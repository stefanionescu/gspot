[kit]
name = "naming"
kind = "general"
title = "Naming"
description = "The naming engine: banned terms, case rules, length and word ceilings over every identifier, file, and folder."

[files]
languages = true

[[check]]
name = "naming/identifiers"
title = "Check identifier names"
example = "With the JavaScript and naming configurations at level `all`, `export const shellCommand = 1;` reports the banned term `shell`. Rename the declaration to `command` and update its references. A legitimate required name needs an exact allowance with a reason."
level = "all"
stage = "commit"
searched = ["eslint-plugin-unicorn prevent-abbreviations", "ls-lint", "ruff N", "swiftlint identifier_name"]
summary = "Checks every identifier against the naming policy: banned terms, case, length, and word count."
why = "Slop announces itself in the name: `enhancedHandler`, `ensureConfigIfNeeded` and `utils` are the sign of code that adds nothing."
help = "Rename after what the thing is or does. Set naming.allowed to an entry with name and reason, or adjust a ceiling with gspot set naming.<language>.max_words."

[[check]]
name = "naming/paths"
title = "Check file and folder names"
example = "With the JavaScript and naming configurations at level `all`, `shell.js` and `shell/port.js` report the banned term `shell`. Rename the file to `entry.js` and the folder to `app`, then update imports and other references."
level = "all"
stage = "commit"
searched = ["ls-lint", "eslint-plugin-unicorn filename-case"]
summary = "Checks every file stem and folder name against the language's case rules and the banned terms."
why = "A file named `enhanced-utils.ts` is a home for code nobody placed; the case rule keeps imports predictable."
help = "Rename the file or folder, or add a path rule under [[naming.rules]] with a reason."

[[check]]
name = "naming/policy-schema"
title = "Validate naming policy"
example = "A naming allowance for an identifier that no selected source contains reports an unmatched policy entry. Remove the obsolete allowance or correct it to the exact required identifier and scope."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that the naming settings in gspot.toml are valid and that every allowed name and path rule matches something."
why = "An allowed name that matches nothing is a leftover, and a path rule that matches nothing hides a typo."
help = "Remove the entry that matches nothing, or fix its name or path."

[[setting]]
name = "naming.banned"
type = "list"
direction = "tightening"
default = []
summary = "Words this repository bans in identifiers, beyond the shipped groups."

[[setting]]
name = "naming.allowed"
type = "list"
direction = "loosening"
default = []
summary = "Exact identifiers allowed despite the policy, each with a reason."

[[setting]]
name = "naming.external"
type = "list"
direction = "loosening"
default = []
summary = "Names a platform or framework fixes, matched whole, and never checked."

[[setting]]
name = "naming.reserved"
type = "list"
direction = "tightening"
default = []
summary = "Terms banned except in the named uses."

[[setting]]
name = "naming.dropped_groups"
type = "list"
direction = "loosening"
default = []
summary = "Removable term groups this repository drops, each with a reason. The marketing, defensive, and terminology groups never drop."

[[setting]]
name = "naming.protocol_keys"
type = "list"
direction = "loosening"
default = []
summary = "Property keys a protocol or format fixes, exempt in one named file."

[[setting]]
name = "naming.max_chars"
type = "number"
direction = "ceiling"
default = 35
languages = ["typescript", "javascript", "python", "swift", "bash", "sql"]
categories = ["files", "directories", "types", "functions", "parameters", "variables", "properties"]
summary = "The most characters one identifier may have."

[[setting]]
name = "naming.max_words"
type = "number"
direction = "ceiling"
default = 4
languages = ["typescript", "javascript", "python", "swift", "bash", "sql"]
categories = ["files", "directories", "types", "functions", "parameters", "variables", "properties"]
summary = "The most words one identifier may have."

[[setting]]
name = "naming.case"
type = "list"
direction = "loosening"
languages = ["typescript", "javascript", "python", "swift", "bash", "sql"]
categories = ["files", "directories", "types", "functions", "parameters", "variables", "properties"]
summary = "The case patterns one identifier category accepts: camel, pascal, kebab, snake, upper-snake, pascal-plus. Ruff owns the case of Python classes, functions, and parameters, and SwiftLint owns Swift types, variables, parameters, and enum cases; the policy governs every other category."

[[setting]]
name = "naming.swift.max_chars"
type = "number"
direction = "ceiling"
default = 40
summary = "The most characters one Swift identifier may have."

[[setting]]
name = "naming.swift.max_words"
type = "number"
direction = "ceiling"
default = 5
summary = "The most words one Swift identifier may have."

[[setting]]
name = "naming.sql.max_chars"
type = "number"
direction = "ceiling"
default = 55
summary = "The most characters one SQL identifier may have."

[[setting]]
name = "naming.sql.max_words"
type = "number"
direction = "ceiling"
default = 7
summary = "The most words one SQL identifier may have."
