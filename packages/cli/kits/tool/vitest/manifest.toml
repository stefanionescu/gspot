[kit]
name = "vitest"
kind = "tool"
title = "Vitest"
requires = ["javascript"]
description = "Vitest test files: the test rules of ESLint over them, and coverage thresholds at push."

[detect]
dependencies = ["vitest"]

[owners]
paths = ["**/vitest.config.*", "**/vitest.workspace.*"]
kinds = ["source"]

[[tools]]
name = "vitest"
floor = "2.0.0"
npm = "vitest"

[[tools]]
name = "@vitest/eslint-plugin"
kind = "library"
version = "1.3.4"
npm = "@vitest/eslint-plugin"

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
imports = "eslint.imports.js.tmpl"
fragment = true

[[checks]]
name = "vitest/coverage"
title = "Check Vitest coverage"
example = "A branch that no test exercises can leave coverage below the floor configured under `tools.vitest`. Add a test for the missing behavior and rerun the native test runner. A passing test run still fails this check when required coverage remains below its floor."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
command = ["vitest", "run", "{each:--config:tools.vitest.config}", "--coverage", "--coverage.reporter=text-summary", "--coverage.thresholds.lines={setting:tools.vitest.coverage.lines}", "--coverage.thresholds.branches={setting:tools.vitest.coverage.branches}", "--coverage.thresholds.functions={setting:tools.vitest.coverage.functions}", "--coverage.thresholds.statements={setting:tools.vitest.coverage.statements}"]
owners = {extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs"]}
output = {format = "regex", pattern = "^ERROR: (?<message>Coverage for .*)$"}
summary = "Runs the test suite with coverage, and fails when lines, branches, functions, or statements fall under their floors."
why = "A floor keeps new code from arriving untested, which is when its behavior is cheapest to pin down."
help = "Add tests for the code the coverage report shows uncovered, or lower one floor under tools.vitest with a reason."

[[settings]]
name = "tools.vitest.config"
kind = "string"
direction = "neutral"
default = ""
summary = "The Vitest configuration the coverage run reads, relative to the scope, for a repository that keeps it somewhere Vitest does not look."

[[settings]]
name = "tools.vitest.coverage.lines"
kind = "number"
direction = "floor"
default = 0
default_all = 80
summary = "The smallest share of lines the tests cover, out of 100."

[[settings]]
name = "tools.vitest.coverage.branches"
kind = "number"
direction = "floor"
default = 0
default_all = 80
summary = "The smallest share of branches the tests cover, out of 100."

[[settings]]
name = "tools.vitest.coverage.functions"
kind = "number"
direction = "floor"
default = 0
default_all = 80
summary = "The smallest share of functions the tests cover, out of 100."

[[settings]]
name = "tools.vitest.coverage.statements"
kind = "number"
direction = "floor"
default = 0
default_all = 80
summary = "The smallest share of statements the tests cover, out of 100."

[guides]
tool = [{path = "tool/vitest/VITEST.md"}, {path = "tool/playwright/PLAYWRIGHT.md", when = {dependencies = ["@playwright/test", "playwright"]}}]
