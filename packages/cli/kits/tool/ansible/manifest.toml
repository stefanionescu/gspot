[kit]
name = "ansible"
kind = "tool"
title = "Ansible"
requires = ["files"]
description = "Ansible playbooks: ansible-lint in every folder that holds an ansible.cfg."

[detect]
paths = ["ansible.cfg", "**/ansible.cfg"]

[owners]
paths = ["ansible.cfg", "**/ansible.cfg"]
kinds = ["source"]

[[tools]]
name = "ansible-lint"
version = "26.8.0"
floor = "24.0.0"
pypi = "ansible-lint"
mise = "pipx:ansible-lint"
brew = "ansible-lint"
platforms = ["macos", "linux"]

[[checks]]
name = "ansible/lint"
title = "Lint Ansible projects"
example = "A task using `ansible.builtin.command: systemctl restart planted` reports `command-instead-of-module`. Use `ansible.builtin.systemd` with `name: planted` and `state: restarted` to express the intended service operation."
level = "recommended"
stage = "commit"
runs = "once"
platform = ["macos", "linux"]
engine = "integrity"
analysis = "ansible-lint"
tool = "ansible-lint"
owners = {extensions = [".yml", ".yaml", ".cfg", ".j2"]}
summary = "Runs ansible-lint in every folder that holds an ansible.cfg."
why = "A playbook runs as root on production hosts, and a task that is not idempotent changes them on every run."
help = "Change the task the way the rule says. Turn one rule off with gspot ignore ansible/lint --rule <id> --reason."
