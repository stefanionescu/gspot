[kit]
name = "pytest"
kind = "tool"
title = "pytest"
requires = ["python"]
description = "pytest suites: the pytest style rules of Ruff over the tests, a test prefix the naming check knows, and a coverage floor at push."

[detect]
dependencies = ["pytest"]
filenames = ["conftest.py", "pytest.ini"]

[[tools]]
name = "pytest"
suppression = {marker = "\\bpragma: ?no cover\\b", reason = "#[^#]*# ?(?<reason>\\S.*)"}
floor = "7.0.0"
pypi = "pytest"
version_pattern = "(\\d+\\.\\d+\\.\\d+)"

[[checks]]
name = "pytest/coverage"
title = "Check Python test coverage"
example = "A branch that no test exercises can leave coverage below the floor configured under `tools.pytest.coverage.lines`. Add a test for the missing behavior and rerun the native test runner. A passing test run still fails this check when required coverage remains below its floor."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
command = ["pytest", "-q", "--strict-markers", "--strict-config", "--cov", "--cov-fail-under={setting:tools.pytest.coverage.lines}", "--no-header", "-p", "no:cacheprovider"]
exit_codes = [1]
owners = {extensions = [".py"]}
output = {format = "regex", pattern = "^(?<message>(?:FAIL Required test coverage|FAILED |ERROR ).*)$"}
summary = "Runs the test suite with coverage, and fails when a test fails or the covered share falls under the floor."
why = "A floor keeps new code from arriving untested."
help = "Fix the failing test, or add tests for the code the report shows uncovered. Lower tools.pytest.coverage.lines with a reason."

[[settings]]
name = "tools.pytest.coverage.lines"
kind = "number"
direction = "floor"
default = 0
default_all = 80
summary = "The smallest share of lines the tests cover, out of 100."

[defaults]
"tools.ruff.select" = ["PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT020", "PT021", "PT024", "PT025", "PT027", "PT028", "PT030", "PT031"]
"tools.ruff.test_ignores" = ["S101", "PLR2004"]
[defaults_all]
"tools.ruff.select" = ["PT001", "PT002", "PT003", "PT006", "PT007", "PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT018", "PT019", "PT020", "PT021", "PT022", "PT023", "PT024", "PT025", "PT026", "PT027", "PT028", "PT030", "PT031", "PTH100", "PTH101", "PTH102", "PTH103", "PTH104", "PTH105", "PTH106", "PTH107", "PTH108", "PTH109", "PTH110", "PTH111", "PTH112", "PTH113", "PTH114", "PTH115", "PTH116", "PTH117", "PTH118", "PTH119", "PTH120", "PTH121", "PTH122", "PTH123", "PTH124", "PTH201", "PTH202", "PTH203", "PTH204", "PTH205", "PTH206", "PTH207", "PTH208", "PTH210", "PTH211"]
