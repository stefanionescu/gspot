[kit]
name = "fastapi"
kind = "framework"
title = "FastAPI"
requires = ["python", "openapi"]
recommends = ["security", "pytest"]
description = "A FastAPI service: the FastAPI and async rules of Ruff, which report a blocking call inside an async function. The OpenAPI document lints and matches the app, and Semgrep reads the request handling."

[detect]
dependencies = ["fastapi"]

[[configs]]
template = "semgrep-fastapi.yml.tmpl"
target = ".gspot/config/semgrep/fastapi.yml"
rules_path = ["rules"]
per_scope = true
needs = "security"
