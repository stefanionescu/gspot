[kit]
name = "nextjs"
kind = "framework"
title = "Next.js"
requires = ["typescript", "react"]
recommends = ["css", "files", "i18n"]
description = "A Next.js app: the framework and hooks rules of ESLint, and server code marked as server only. Route segments serve one thing, the configuration turns no build check off, and message files parse."

[detect]
dependencies = ["next"]

[files]
paths = ["**/next.config.js", "**/next.config.mjs", "**/next.config.ts", "next.config.js", "next.config.mjs", "next.config.ts"]
kinds = ["source"]

[[tool]]
name = "next"
host = true

[[tool]]
name = "@next/eslint-plugin-next"
kind = "library"
version = "16.3.5"
npm = "@next/eslint-plugin-next"

[[config]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
imports = "eslint.imports.js.tmpl"
fragment = true

[[check]]
name = "nextjs/typecheck"
title = "Check Next.js types"
example = "The TypeScript declaration `const count: number = \"one\";` reports an incompatible assignment. Correct it to `const count: number = 1;` when the contract requires a number."
level = "recommended"
stage = "push"
runs = "scope"
replaces = "typescript/tsc"
summary = "Has Next.js write its types, then type-checks the app with the strict compiler options."
why = "A fresh clone holds no next-env.d.ts and no route types, so a plain tsc run fails on imports the framework resolves."
help = "Read the first error tsc prints and fix that file; later errors are often the same mistake."

[[check]]
name = "nextjs/build"
title = "Build the Next.js app"
example = "A Next.js page importing a nonexistent component fails the project build. Restore the component or correct the import path and rerun the configured build."
level = "recommended"
waits_for = "tools.next.build_on_push"
stage = "push"
runs = "scope"
requires = "build"
summary = "Builds the app with next build, for a repository that set tools.next.build_on_push."
why = "Some mistakes show only at build time: a server import in a client file, or a page that cannot be prerendered."
help = "Run next build and read the first error it prints."

[[check]]
name = "integrity/route-segments"
title = "Route segments"
example = "A Next.js segment containing both `page.tsx` and `route.ts` reports conflicting route ownership. Move the route handler into a separate segment, such as `api`, and update its callers."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that no route segment holds both a page and a route handler."
why = "One address is served by one file, and the framework refuses the build when a segment holds two."
help = "Move the route handler into a segment of its own, such as an api folder."

[[check]]
name = "integrity/next-config"
title = "Check Next.js configuration"
example = "Setting `typescript.ignoreBuildErrors` to `true` in Next.js configuration reports a disabled type gate. Remove the switch and correct the type errors before building."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that the framework kit turns no build check off and puts no secret into the client environment."
why = "A build that ignores lint and type errors ships them, and a key under env is readable by every visitor."
help = "Remove the switch, and read the secret on the server."

[[check]]
name = "integrity/dependency-alignment"
title = "Dependency alignment"
example = "Different declared versions of `react` and `react-dom` report an alignment finding. Select the same compatible version for both and update the lockfile with the package manager."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that packages that ship together sit on one version: the framework with its lint package, and react with react-dom."
why = "A lint package a version behind flags what the framework allows and allows what it removed."
help = "Move both packages to the same version."

[[setting]]
name = "tools.next.build_on_push"
type = "boolean"
direction = "tightening"
default = false
summary = "Whether the push stage builds the app with next build."

[[setting]]
name = "tools.next.build_flags"
type = "list"
direction = "neutral"
default = []
summary = "The flags next build runs with, such as --webpack for an app that does not build with Turbopack."

[[naming.rules]]
paths = ["**/app/**", "**/pages/**"]
categories = ["files"]
names = ["page", "layout", "loading", "error", "global-error", "not-found", "route", "template", "default", "middleware", "instrumentation", "proxy", "sitemap", "robots", "manifest", "opengraph-image", "icon", "apple-icon"]
exclude = true
reason = "Next.js names these files."

[[naming.rules]]
paths = ["**"]
languages = ["typescript", "javascript"]
categories = ["functions", "methods"]
structural_prefix = "^handle(?=[A-Z])"
reason = "A handler starts with handle and then names the event."

[guides]
framework = [{path = "framework/nextjs/NEXTJS.md"}, {path = "framework/nextjs/SECURITY.md"}]

[required_rules]
tsx = ["@next/next/no-html-link-for-pages", "@next/next/no-async-client-component"]


[[rules_off]]
tool = "eslint"
rules = ["gspot/no-trivial-files"]
files = ["**/{page,layout,template,default,loading,error,not-found,global-error,route,middleware,proxy}.{js,jsx,ts,tsx}"]
reason = "Next.js discovers route files by name, so each file can hold one export in its own folder."

[[rules_off]]
tool = "eslint"
rules = ["gspot/no-reexports"]
files = ["**/{page,layout,template,default,loading,error,not-found,global-error,route,middleware,proxy}.{js,jsx,ts,tsx}"]
when = {setting = "structure.reexports", value = "index-only"}
reason = "Next.js route files act as framework entry points when the project permits entry-point re-exports."

[defaults]
"tools.eslint.import_style" = {"**/*" = "extensionless"}
"tools.stylelint.ignore_at_rules" = ["tailwind", "apply", "layer", "theme", "utility", "variant", "custom-variant", "source", "plugin", "config", "reference"]
