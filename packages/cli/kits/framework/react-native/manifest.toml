[kit]
title = "React Native"
requires = ["react"]
recommends = ["typescript", "jest"]
description = "A React Native or Expo app: the React Native and Expo rules, lists that render through FlatList with keys, touch through Pressable, no secret in AsyncStorage, and Expo Doctor in an Expo project."

[detect]
dependencies = ["react-native", "expo"]

[files]
filenames = ["app.json", "app.config.js", "app.config.ts", "metro.config.js", "eas.json"]
kinds = ["source"]

[[tool]]
name = "@react-native/eslint-plugin"
kind = "library"
version = "0.87.1"
npm = "@react-native/eslint-plugin"

[[tool]]
name = "eslint-plugin-react-native"
kind = "library"
version = "5.0.0"
npm = "eslint-plugin-react-native"

[[tool]]
name = "eslint-plugin-expo"
kind = "library"
version = "1.1.0"
npm = "eslint-plugin-expo"

[[tool]]
name = "expo-doctor"
version = "1.20.4"
npm = "expo-doctor"

[[config]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
imports = "eslint.imports.js.tmpl"
fragment = true

[[config.selectors]]
level = "all"
selector = "ImportDeclaration[source.value='react-native'] > ImportSpecifier[imported.name=/^Touchable(Opacity|Highlight|WithoutFeedback|NativeFeedback)$/]"
message = "Use Pressable. The Touchable components are kept for old code and get no new behavior."

[[config.selectors]]
level = "all"
selector = "JSXOpeningElement[name.name=/^(FlatList|SectionList)$/]:not(:has(JSXAttribute[name.name='keyExtractor']))"
message = "Give the list a keyExtractor, so a row keeps its state when the list changes."

[[config.selectors]]
level = "all"
selector = "JSXElement[openingElement.name.name='ScrollView'] > JSXExpressionContainer > CallExpression[callee.property.name='map']"
message = "A ScrollView renders every row at once. Render a list that grows through FlatList."

[[config.selectors]]
level = "all"
selector = "CallExpression[callee.object.name='AsyncStorage'][callee.property.name='setItem'] > Literal:first-child[value=/token|secret|password|credential/i]"
message = "AsyncStorage is plain text on the device. Keep a secret in the secure store of the platform."

[[check]]
name = "expo-doctor"
title = "Run Expo Doctor"
example = "An Expo project whose installed `react-native` differs from the version its Expo SDK expects reports a failed Doctor check. Install the expected version with `npx expo install --check` and rerun."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["network"]
summary = "Runs Expo Doctor in a scope that depends on expo, and reports each check it fails."
why = "A native package on the wrong version for the Expo SDK builds and then crashes on the device."
help = "Read the issues and advice Expo Doctor prints for the failed check, then run npx expo install --check."

[guides]
framework = [{path = "framework/react-native/REACT-NATIVE.md"}]

[required_rules]
tsx = ["expo/no-env-var-destructuring", "expo/no-dynamic-env-var"]
jsx = ["expo/no-env-var-destructuring", "expo/no-dynamic-env-var"]

[[rules_off]]
tool = "eslint"
rules = [
    "jsx-a11y/accessible-emoji",
    "jsx-a11y/alt-text",
    "jsx-a11y/anchor-ambiguous-text",
    "jsx-a11y/anchor-has-content",
    "jsx-a11y/anchor-is-valid",
    "jsx-a11y/aria-activedescendant-has-tabindex",
    "jsx-a11y/aria-props",
    "jsx-a11y/aria-proptypes",
    "jsx-a11y/aria-role",
    "jsx-a11y/aria-unsupported-elements",
    "jsx-a11y/autocomplete-valid",
    "jsx-a11y/click-events-have-key-events",
    "jsx-a11y/control-has-associated-label",
    "jsx-a11y/heading-has-content",
    "jsx-a11y/html-has-lang",
    "jsx-a11y/iframe-has-title",
    "jsx-a11y/img-redundant-alt",
    "jsx-a11y/interactive-supports-focus",
    "jsx-a11y/label-has-associated-control",
    "jsx-a11y/label-has-for",
    "jsx-a11y/lang",
    "jsx-a11y/media-has-caption",
    "jsx-a11y/mouse-events-have-key-events",
    "jsx-a11y/no-access-key",
    "jsx-a11y/no-aria-hidden-on-focusable",
    "jsx-a11y/no-autofocus",
    "jsx-a11y/no-distracting-elements",
    "jsx-a11y/no-interactive-element-to-noninteractive-role",
    "jsx-a11y/no-noninteractive-element-interactions",
    "jsx-a11y/no-noninteractive-element-to-interactive-role",
    "jsx-a11y/no-noninteractive-tabindex",
    "jsx-a11y/no-onchange",
    "jsx-a11y/no-redundant-roles",
    "jsx-a11y/no-static-element-interactions",
    "jsx-a11y/prefer-tag-over-role",
    "jsx-a11y/role-has-required-aria-props",
    "jsx-a11y/role-supports-aria-props",
    "jsx-a11y/scope",
    "jsx-a11y/tabindex-no-positive",
]
reason = "React Native view trees contain native components rather than the DOM elements these accessibility rules inspect."
