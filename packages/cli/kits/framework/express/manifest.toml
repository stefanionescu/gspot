[kit]
name = "express"
kind = "framework"
title = "Express"
requires = ["javascript", "openapi"]
recommends = ["security", "vitest"]
description = "An Express service: the Semgrep rules for request handling, an OpenAPI document that lints and matches its source, and a test for every route file."

[detect]
dependencies = ["express"]

[[configs]]
template = "semgrep-express.yml.tmpl"
target = ".gspot/config/semgrep/express.yml"
rules_path = ["rules"]
per_scope = true
needs = "security"

[[checks]]
name = "express/routes-tested"
title = "Routes tested"
example = "With `tools.express.route_files = [\"routes/*.ts\"]`, `routes/users.ts` reports `untested-route` when no test in the same scope imports it. Add `import { users } from './routes/users.js';` to `users.test.ts` and test the route's behavior. This check resolves imports; it does not execute the test or establish assertion coverage."
level = "all"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "routes-tested"
coverage = ["tests"]
summary = "Checks that a test in the same scope imports each route file."
why = "A route with no test is the one that changes behavior without anyone noticing."
help = "Add a test that imports and exercises the route."

[[settings]]
name = "tools.express.route_files"
kind = "list"
direction = "tightening"
default = []
summary = "The route files that each need a test; empty turns the check off."

[[settings]]
name = "tools.express.test_files"
kind = "list"
direction = "neutral"
default = ["**/*.test.*", "**/*.spec.*", "**/tests/**"]
summary = "The files that count as tests of a route."

[[naming.rules]]
paths = ["**"]
languages = ["typescript", "javascript"]
categories = ["functions", "methods"]
structural_prefix = "^handle(?=[A-Z])"
reason = "A handler starts with handle and then names the event."

[guides]
framework = [{path = "framework/express/EXPRESS.md"}, {path = "framework/express/API.md"}, {path = "framework/express/OPENAPI.md"}]
shared = [{path = "shared/http/HTTP.md"}]
runtime = [{path = "runtime/node/NODE.md"}]
