[[config]]
template = "eslint.config.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
rules_path = ["rules"]
pointer = {path = "eslint.config.mjs", body = "export { default } from '{target}';"}

[[config]]
target = ".gspot/config/jsconfig.json"
scoped = true

[[config]]
target = ".gspot/config/knip.json"
header = false

[[check]]
name = "javascript/eslint"
title = "ESLint"
example = "An unused variable such as `const unused = 1;` reports the configured unused-variable rule in a selected source file. Remove the unused declaration and rerun. Component files must also retain valid framework syntax."
level = "recommended"
stage = "commit"
runs = "files"
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{config:eslint}", "--format", "json", "{files}"]
fix = ["eslint", "--fix", "--config", "{config:eslint}", "{files}"]
exit_codes = [1]
files = {extensions = [".js", ".jsx", ".mjs", ".cjs"], filenames = ["package.json"], tags = ["shebang:node"]}
output = {format = "eslint"}
summary = "Runs ESLint with the shipped rule set over every JavaScript file and every package.json."
why = "ESLint catches mistakes and slop the runtime accepts: unused code, unsafe patterns, functions that only forward."
help = "Run gspot check --fix for the rules that fix themselves, then read each remaining line; gspot explain <rule> says what it means."

[[check]]
name = "javascript/tsc"
title = "Check JavaScript types"
example = "With JavaScript type checking enabled, passing a number to a JSDoc parameter declared as `string` reports a type error. Pass the intended string value or correct the documented parameter contract."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
tool = "tsc"
files = {extensions = [".js", ".mjs", ".cjs", ".jsx"]}
output = {format = "regex", pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"}
summary = "Type-checks plain JavaScript through its JSDoc comments."
why = "A JavaScript file with a wrong call crashes at run time; the checker sees it first when the types are written down."
help = "Add or fix the JSDoc type the checker names; gspot explain tsc/TS2345 links the error page."

[[check]]
name = "javascript/knip"
title = "Find unused JavaScript code"
example = "An exported declaration that no selected entry point uses reports an unused export. Remove the export or declaration and update consumers. If the file is dynamically loaded, declare its real entry point in policy."
level = "recommended"
stage = "push"
runs = "scope"
command = ["knip", "--config", "{config:knip}", "--no-progress", "--reporter", "compact", "{workspace:--workspace}"]
cwd = "root"
output = {format = "regex", pattern = "^(?<file>[^:\\s]+)(?::\\s*(?<message>.*))?$"}
summary = "Finds files, exports, and dependencies nothing uses."
why = "Dead code is read, maintained, and shipped for nobody."
help = "Delete what knip names, or add a knip entry point with gspot set tools.knip.entry if the file is loaded in a way knip cannot see."

[[setting]]
name = "tools.eslint.component_languages"
type = "list"
direction = "neutral"
default = []
summary = "The languages a component script block declares; empty means plain JavaScript."

[[setting]]
name = "tools.eslint.rules"
type = "table"
direction = "per-rule"
default = {}
summary = "Rule options and rules turned on, by ESLint rule id; a rule turned off is a gspot ignore --rule."

[[setting]]
name = "tools.eslint.overrides"
type = "list"
direction = "per-rule"
default = []
summary = "Ordered enabled rule settings for config-root paths, bounded by the scope declaring them. Explicit ignores apply last."

[[setting]]
name = "tools.eslint.import_style"
type = "table"
direction = "neutral"
default = {"**/*" = "js"}
summary = "The import suffix style per file class: js for compiled ESM, ts for Deno and Bun, extensionless for bundled code."

[[setting]]
name = "tools.eslint.script_files"
type = "list"
direction = "neutral"
default = ["scripts/**", "**/*.config.{js,mjs,cjs,ts}", ".mise/tasks/**"]
summary = "The globs that count as scripts: no-process-exit off, every unused argument reported."

[[setting]]
name = "tools.eslint.runtimes"
type = "table"
direction = "neutral"
default = {}
summary = "The runtime per file class when the tree does not say: a glob to node, browser, worker, or commonjs."

[[setting]]
name = "tools.eslint.node_version"
type = "string"
direction = "neutral"
default = ">=22.0.0"
summary = "The Node version the n plugin checks builtins against; detected from engines at init."

[[setting]]
name = "tools.eslint.restricted_imports"
type = "list"
direction = "tightening"
default = []
summary = "Imports this repository refuses, each with a name, and a message."

[[setting]]
name = "tools.knip.entry"
type = "list"
direction = "neutral"
default = []
summary = "Entry points knip starts from beyond the ones the framework kit declares."

[[setting]]
name = "tools.knip.exclude"
type = "list"
direction = "loosening"
default = []
summary = "Files knip leaves out, each with a reason."

[[setting]]
name = "tools.knip.ignore_dependencies"
type = "list"
direction = "loosening"
default = []
summary = "Dependencies knip does not report as unused, each with a reason: packages only a spawned command uses. A name that looks like a regular expression matches as one; an entry with workspace applies to that package.json workspace alone."

[[check]]
name = "javascript/rules-off"
title = "Required rules"
example = "An authored ESLint override disabling a rule required by policy reports that missing rule. Remove the override or record the intended scoped exception with a reason through policy, then regenerate configuration."
level = "recommended"
stage = "push"
runs = "scope"
summary = "Checks that the configuration ESLint resolves for a file still turns on every rule the configurations require."
why = "The configuration is put together from the blocks of many configurations, and a later block can turn off a rule that an earlier one turned on."
help = "Run gspot apply to write the configuration again. A rule the repository decided against is recorded with gspot ignore, which carries a reason."

[guides]
language = [{path = "language/JAVASCRIPT.md"}, {path = "language/naming/JAVASCRIPT.md"}]
runtime = [{path = "runtime/node/NODE.md"}, {path = "runtime/bun/BUN.md", when = {filenames = ["bun.lock", "bun.lockb", "bunfig.toml"]}}]

[required_rules]
js = ["eqeqeq", "no-restricted-syntax", "max-lines", "sonarjs/cognitive-complexity", "gspot/private-before-public"]
mjs = ["eqeqeq", "no-restricted-syntax", "max-lines", "sonarjs/cognitive-complexity"]
