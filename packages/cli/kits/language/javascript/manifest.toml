[[tool.replace]]
file = "knip.jsonc"

[[tool.replace]]
file = ".knip.json"

[[tool.replace]]
file = "knip.config.js"

[[tool.replace]]
file = "knip.config.ts"

[[tool.replace]]
file = "knip.config.mjs"

