[kit]
name = "html"
kind = "language"
title = "HTML"
requires = ["formatting"]
recommends = ["spelling"]
description = "HTML files: html-validate for structure and accessibility, no inline script or handler, and templates that hold placeholders in place of copy."

[detect]
extensions = [".html", ".htm"]

[claims]
extensions = [".html", ".htm"]
natures = ["source"]

[[tools]]
name = "html-validate"
suppression = {marker = "^<!--\\s*\\[?html-validate-disable(?:-next|-block)?(?=\\s|\\]|$)", reason = "(?: -- |: )(?<reason>\\S.*)"}
version = "11.6.1"
floor = "11.6.1"
npm = "html-validate"

[[tools.replace]]
file = ".htmlvalidate.json"
keeps = "rules-table"

[[tools.replace]]
file = ".htmlvalidate.js"
keeps = "rules-table"

[[tools.replace]]
file = ".htmlvalidate.cjs"
keeps = "rules-table"

[[configs]]
template = "templates.json.tmpl"
target = ".gspot/config/html-validate-templates.json"
rules_path = ["rules"]
header = false
pointer = {path = ".htmlvalidate.json", body = "{\n    \"extends\": [\"{target}\"]\n}\n"}

[[configs]]
template = "built.json.tmpl"
target = ".gspot/config/html-validate-built.json"
rules_path = ["rules"]
header = false

[[checks]]
name = "html/html-validate"
title = "Validate HTML"
example = "An `<img src=\"logo.png\">` element without alternative text reports an accessibility finding under the configured rules. Add meaningful `alt` text, or an empty `alt` value for a decorative image."
level = "recommended"
stage = "commit"
command = ["html-validate", "--config", "{config:html-validate-templates}", "--formatter", "json", "{files}"]
coverage = ["syntax", "style", "accessibility"]
output = {format = "json", children = "messages", fields = {file = "filePath", line = "line", column = "column", rule = "ruleId", message = "message"}}
summary = "Validates every HTML file: elements where they may sit, required attributes, text alternatives, and one style for void elements."
why = "A browser repairs broken markup in its own way, and a screen reader reads what the repair left."
help = "Change the markup the way the rule page says. Turn one rule off with gspot ignore html/html-validate --rule <name> --reason."

[[checks]]
name = "html/scripts"
title = "Keep executable scripts out of HTML"
example = "A button using an inline `onclick` attribute reports embedded executable code. Remove the attribute and attach the event listener from a separate script file."
level = "all"
stage = "commit"
engine = "integrity"
analysis = "html-scripts"
coverage = ["security"]
summary = "Refuses executable inline script, event handler attributes, and executable script or data URLs in HTML files."
why = "A content security policy that allows inline script allows an injected one too, so the policy only holds when the pages hold none."
help = "Move the script into a file, and attach the handler from that file. Structured data of type application/ld+json stays inline."

[[checks]]
name = "html/text"
title = "Use placeholders in HTML templates"
example = "Authored prose embedded in a governed HTML template reports copy outside the content owner. Move the words to the content file and reference that content from the template."
level = "all"
stage = "commit"
engine = "integrity"
analysis = "html-text"
coverage = ["structure"]
summary = "In the template files named by tools.html.template_files, checks that text a person reads is a placeholder and never a literal."
why = "Copy written into a template is copy no translator and no content file ever sees."
help = "Replace the text with a placeholder and put the words in the content file. Exclude a path under tools.html.copy_allowed with a reason."

[[settings]]
name = "tools.html.template_files"
kind = "list"
direction = "tightening"
default = []
summary = "The HTML files that are templates filled from content; empty turns the copy check off."

[[settings]]
name = "tools.html.copy_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Template paths that may hold literal text, each with a reason."

[coverage]
".html" = ["format", "syntax", "style", "spelling"]
".htm" = ["format", "syntax", "style", "spelling"]

[guides]
language = [{path = "language/HTML.md"}, {path = "language/naming/HTML.md"}]
