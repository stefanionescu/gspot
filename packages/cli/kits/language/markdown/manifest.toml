[kit]
name = "markdown"
kind = "language"
title = "Markdown"
requires = ["formatting"]
recommends = ["docs", "spelling"]
description = "Markdown files: markdownlint, Prettier, every fenced block parsing in its language, and the docs and prose checks."

[detect]
extensions = [".md", ".mdx"]

[files]
extensions = [".md", ".mdx"]
kinds = ["source"]

[[tool]]
name = "markdownlint-cli2"
rule_url = "https://github.com/DavidAnson/markdownlint/blob/main/doc/{rule}.md"
suppression = {marker = "\\bmarkdownlint-disable(?:-line|-next-line|-file)?\\b", reason = " -- (?<reason>\\S.*)"}
version = "0.23.3"
npm = "markdownlint-cli2"
mise = "npm:markdownlint-cli2"
version_command = ["--help"]
version_exit_code = 2
version_pattern = "markdownlint-cli2 v(\\d+\\.\\d+\\.\\d+)"

[[tool.replace]]
file = ".markdownlint-cli2.jsonc"

[[tool.replace]]
file = ".markdownlint-cli2.yaml"

[[tool.replace]]
file = ".markdownlint-cli2.cjs"

[[tool.replace]]
file = ".markdownlint-cli2.mjs"

[[tool.replace]]
file = ".markdownlint.json"

[[tool.replace]]
file = ".markdownlint.jsonc"

[[tool.replace]]
file = ".markdownlint.yaml"

[[tool.replace]]
file = ".markdownlint.yml"

[[config]]
template = "configuration.jsonc.tmpl"
target = ".gspot/config/markdownlint.jsonc"
scoped = true
rules_path = [""]

[[config]]
template = "runner.mjs.tmpl"
target = ".gspot/config/markdownlint-cli2.mjs"
scoped = true

[[check]]
name = "markdown/markdownlint"
title = "Markdownlint"
example = "A Markdown document with two top-level headings can report MD025. Keep one document title and change the later section heading to level two."
isolated_files = true
file_prefix = ":"
level = "recommended"
stage = "commit"
runs = "files"
command = ["markdownlint-cli2", "--no-globs", "--config", "{config:markdownlint-cli2}", "{files}"]
fix = ["markdownlint-cli2", "--fix", "--no-globs", "--config", "{config:markdownlint-cli2}", "{files}"]
output = {format = "markdownlint"}
summary = "Checks every Markdown file against markdownlint with the shipped rule set."
why = "Markdown that lints the same everywhere renders the same everywhere."
help = "Run gspot check --fix for the rules that fix themselves; read the rule name for the rest."

[[check]]
name = "markdown/fences"
title = "Check code block syntax"
example = "A code fence labeled `bash` containing `if then` reports invalid syntax. Correct the example to valid Bash. Use a text fence only when the block represents text rather than executable code."
level = "recommended"
stage = "commit"
summary = "Checks that every fenced code block with a language tag parses in that language."
why = "A code block that does not parse is documentation that lies about the code."
help = "Fix the code in the block, or tag the block text when it is not code."

[[setting]]
name = "tools.markdownlint.rules"
type = "table"
direction = "per-rule"
summary = "Options per markdownlint rule, by rule id; turning a rule off is gspot ignore --rule."
