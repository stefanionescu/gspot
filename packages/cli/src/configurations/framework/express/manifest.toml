[configuration]
description = "Express services: request data passed straight to SQL text, and values or stack traces in the error a client reads."
requires = ["javascript"]
suggests = ["openapi"]
title = "Express"

[detect]
dependencies = ["express"]

[[eslint.selectors]]
message = "Keep values out of the message a client reads; send each value in its own field."
selector = "CallExpression[callee.property.name=/^(json|send)$/] ObjectExpression > Property[key.name=/^(message|error)$/] > TemplateLiteral.value[expressions.length>0]"

[[eslint.selectors]]
message = "Request data goes into the SQL text of a database call, which allows SQL injection. Pass the value as a query parameter."
selector = 'CallExpression[callee.property.name=/^(?:query|execute|raw|\$queryRawUnsafe)$/] > TemplateLiteral.arguments:first-child > MemberExpression.expressions[object.object.name="req"][object.property.name=/^(?:body|query|params)$/]'

[[eslint.selectors]]
message = "A stack trace in an API response leaks implementation details. Log it on the server, and return a generic message."
selector = 'CallExpression[callee.property.name=/^(?:send|json)$/]:matches([callee.object.name="res"], [callee.object.callee.object.name="res"][callee.object.callee.property.name="status"]) > ObjectExpression.arguments > Property[key.name="stack"][value.property.name="stack"]'
