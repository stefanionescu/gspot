rules:
    - id: gspot.express.raw-query-interpolation
      patterns:
          - pattern: $DB.$METHOD(`...${req.$SOURCE.$FIELD}...`, ...)
          - metavariable-regex:
                metavariable: $METHOD
                regex: ^(query|execute|raw|\$queryRawUnsafe)$
          - metavariable-regex:
                metavariable: $SOURCE
                regex: ^(body|query|params)$
      message: >-
          Request data goes into the SQL text of a database call, which allows SQL injection. Pass the value as a query
          parameter.
      languages:
          - typescript
          - javascript
      severity: ERROR
      metadata:
          cwe:
              - CWE-89
          category: security
    - id: gspot.express.unvalidated-redirect
      patterns:
          - pattern-either:
                - pattern: res.redirect(req.body.$VALUE)
                - pattern: res.redirect(req.query.$VALUE)
                - pattern: res.redirect(req.params.$VALUE)
      message: >-
          res.redirect() takes its target from the request, which allows an open redirect. Redirect only to a URL on an
          allowlist.
      languages:
          - typescript
          - javascript
      severity: ERROR
      metadata:
          cwe:
              - CWE-601
          category: security
    - id: gspot.express.res-send-raw-input
      patterns:
          - pattern-either:
                - pattern: res.send(req.$SOURCE.$FIELD)
                - pattern: res.send(`...${req.$SOURCE.$FIELD}...`)
          - metavariable-regex:
                metavariable: $SOURCE
                regex: ^(body|query|params)$
      message: >-
          res.send() returns request data as HTML, which allows reflected XSS. Escape the value, or send JSON with
          res.json().
      languages:
          - typescript
          - javascript
      severity: ERROR
      metadata:
          cwe:
              - CWE-79
          category: security
    - id: gspot.express.stack-trace-in-response
      patterns:
          - pattern-either:
                - pattern: 'res.send({..., stack: $ERR.stack, ...})'
                - pattern: 'res.json({..., stack: $ERR.stack, ...})'
                - pattern: 'res.status(...).send({..., stack: $ERR.stack, ...})'
                - pattern: 'res.status(...).json({..., stack: $ERR.stack, ...})'
      message: Stack traces in API responses leak internal implementation details. Log
          the stack server-side and return a generic error message.
      languages:
          - typescript
          - javascript
      severity: ERROR
      metadata:
          cwe:
              - CWE-209
          category: security
