[configuration]
description = "FastAPI routes: the Ruff FastAPI rules, and Semgrep rules for request handlers."
requires = ["python"]
suggests = ["openapi"]
title = "FastAPI"

[detect]
dependencies = ["fastapi"]

[ruff]
basic = ["FAST001", "FAST002", "FAST003"]

[[config_file]]
per_scope = true
target = "semgrep.yml"
tool = "semgrep"
