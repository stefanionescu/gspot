allowed_words = ["Next.js"]
ci_setup = [["next", "typegen"]]
generated = ["next-env.d.ts"]
route_files = ["page.*", "route.*", "layout.*", "default.*", "template.*", "loading.*", "error.*", "global-error.*", "not-found.*"]

[configuration]
description = "Next.js apps: the framework and hooks rules, and server code that never reaches the client. A Semgrep rule refuses ignoreBuildErrors and ignoreDuringBuilds in next.config."
requires = ["typescript", "react", "react-dom"]
suggests = ["css"]
title = "Next.js"

[detect]
dependencies = ["next"]

[files]
paths = ["**/next.config.js", "**/next.config.mjs", "**/next.config.ts"]

[[naming.override]]
allowed_names = ["page", "layout", "template", "default", "loading", "error", "not-found", "global-error", "route", "sitemap", "robots", "manifest", "opengraph-image", "icon", "apple-icon", "_app", "_document", "_error", "404", "500"]
categories = ["files"]
paths = ["**/app/**", "**/pages/**"]
reason = "Next.js names these files."

[[naming.override]]
allowed_names = ["middleware", "proxy", "instrumentation"]
categories = ["files"]
paths = ["**"]
reason = "Next.js reads these files at the project root or in src/."

[[naming.override]]
allowed_names = ["getStaticProps", "getServerSideProps", "generateMetadata", "generateStaticParams", "generateViewport"]
categories = ["functions", "methods", "variables"]
languages = ["typescript", "javascript"]
paths = ["**"]
reason = "Next.js discovers these data and metadata exports by name."

[[naming.override]]
cases = ["pascal", "camel"]
categories = ["functions"]
paths = ["**/app/**/*.js", "**/pages/**/*.js"]
reason = "Next.js reads components from .js files in app/ and pages/."

[[tool]]
min_version = "15.5.0"
name = "next"
system = true
version_command = ["--version"]

[[tool]]
kind = "package"
name = "@next/eslint-plugin-next"
npm = "@next/eslint-plugin-next"
rule_prefix = "@next/next"
version = "16.4.2"

[eslint]
required_tools = ["@next/eslint-plugin-next"]
all_level_rules = ["@next/next/next-script-for-ga", "@next/next/no-img-element", "@next/next/no-page-custom-font"]

[[eslint.rules_off]]
files = ["**/app/**/{page,layout,default,template,loading,error,global-error,not-found}.*", "**/pages/**/*.{js,jsx,ts,tsx}"]
reason = "Next.js reads the default export of its route files."
rules = ["import-x/no-default-export"]

[[eslint.export_names]]
files = ["**/app/**/route.{js,ts}"]
names = ["GET", "HEAD", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]

[[eslint.export_names]]
files = ["**/app/**/{page,layout,template,default,loading,error,not-found,global-error}.{js,jsx,ts,tsx}"]
names = ["default", "generateMetadata", "generateStaticParams", "generateViewport"]

[[eslint.export_names]]
files = ["**/pages/**/*.{js,jsx,ts,tsx}"]
names = ["default", "getStaticProps", "getStaticPaths", "getServerSideProps"]

[[eslint.export_names]]
files = ["**/{middleware,proxy}.{js,ts}"]
names = ["default", "middleware", "proxy"]

[[eslint.export_names]]
files = ["**/instrumentation.{js,ts}"]
names = ["register", "onRequestError"]

[[eslint.forwarding_files]]
files = ["**/{page,layout,template,default,loading,error,not-found,global-error,route,middleware,proxy}.{js,jsx,ts,tsx}"]
reason = "Next.js discovers route files by name, so each file can hold one export in its own folder."

[[eslint.selectors]]
files = ["**/next.config.*"]
message = "This option lets next build pass with errors. Remove it."
selector = 'Property:matches([key.name=/^(?:ignoreBuildErrors|ignoreDuringBuilds)$/], [key.value=/^(?:ignoreBuildErrors|ignoreDuringBuilds)$/]):matches([value.value=true], [value.expression.value=true])'

[[eslint.selectors]]
files = ["**/next.config.*"]
message = "A key under env is written into the client bundle. Read this secret on the server."
selector = 'Property[key.name="env"] > ObjectExpression.value > Property:matches([key.name=/^(?=[A-Z\d_]*(?:SECRET|TOKEN|PASSWORD|PRIVATE_KEY|API_KEY))[A-Z][A-Z\d_]*$/], [key.value=/^(?=[A-Z\d_]*(?:SECRET|TOKEN|PASSWORD|PRIVATE_KEY|API_KEY))[A-Z][A-Z\d_]*$/])'

[[check]]
cwd = "scope"
example = "`const count: number = \"one\";` reports an incompatible assignment. Assign a number, such as `const count: number = 1;`."
help = "Fix the first error tsc prints; later errors often come from the same mistake."
instead_of = "typescript/tsc"
name = "tsc"
runs = "scope"
stage = "push"
summary = "Has Next.js write its types, then type-checks the app with the strict compiler options."
tool = ["tsc", "next"]
why = "A fresh clone holds no next-env.d.ts and no route types, so a plain tsc run fails on imports the framework resolves."
