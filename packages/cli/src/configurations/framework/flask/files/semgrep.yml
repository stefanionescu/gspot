rules:
    - id: gspot.flask.request-data-in-redirect
      mode: taint
      pattern-sources:
          - patterns:
                - pattern: flask.request.$PART
                - metavariable-regex:
                      metavariable: $PART
                      regex: ^(args|form|values|cookies|headers|json|data|get_json|files)$
      pattern-sinks:
          - patterns:
                - pattern: flask.redirect($URL, ...)
                - focus-metavariable: $URL
      message: The redirect target comes from the request, so a link can send users to any site. Redirect only to a path
          of this application, such as one built with url_for().
      languages:
          - python
      severity: ERROR
      metadata:
          cwe:
              - CWE-601
          category: security
    - id: gspot.flask.request-data-in-file-path
      mode: taint
      pattern-sources:
          - patterns:
                - pattern: flask.request.$PART
                - metavariable-regex:
                      metavariable: $PART
                      regex: ^(args|form|values|cookies|headers|json|data|get_json|files)$
      pattern-sanitizers:
          - pattern: os.path.basename(...)
          - pattern: werkzeug.utils.secure_filename(...)
      pattern-sinks:
          - patterns:
                - pattern-either:
                      - pattern: open($PATH, ...)
                      - pattern: flask.send_file($PATH, ...)
                      - pattern: pathlib.Path($PATH, ...)
                - focus-metavariable: $PATH
      message: A file path comes from the request, so `../` reads any file the server can. Serve files with
          send_from_directory(), or keep only the base name.
      languages:
          - python
      severity: ERROR
      metadata:
          cwe:
              - CWE-22
          category: security
    - id: gspot.flask.request-data-in-outbound-request
      mode: taint
      pattern-sources:
          - patterns:
                - pattern: flask.request.$PART
                - metavariable-regex:
                      metavariable: $PART
                      regex: ^(args|form|values|cookies|headers|json|data|get_json)$
      pattern-sinks:
          - patterns:
                - pattern-either:
                      - pattern: requests.$METHOD($URL, ...)
                      - pattern: httpx.$METHOD($URL, ...)
                      - pattern: urllib.request.urlopen($URL, ...)
                - focus-metavariable: $URL
      message: The server sends a request to a URL that the client chose, which reaches internal services. Allow only
          known hosts.
      languages:
          - python
      severity: ERROR
      metadata:
          cwe:
              - CWE-918
          category: security
    - id: gspot.flask.request-data-in-template-source
      mode: taint
      pattern-sources:
          - patterns:
                - pattern: flask.request.$PART
                - metavariable-regex:
                      metavariable: $PART
                      regex: ^(args|form|values|cookies|headers|json|data|get_json)$
      pattern-sinks:
          - patterns:
                - pattern: flask.render_template_string($SOURCE, ...)
                - focus-metavariable: $SOURCE
      message: The template text holds request data, so a client can run template code on the server. Pass the value as
          a template variable instead.
      languages:
          - python
      severity: ERROR
      metadata:
          cwe:
              - CWE-1336
          category: security
    - id: gspot.flask.request-data-in-html-response
      mode: taint
      pattern-sources:
          - patterns:
                - pattern: flask.request.$PART
                - metavariable-regex:
                      metavariable: $PART
                      regex: ^(args|form|values|cookies|headers|json|data|get_json)$
      pattern-sanitizers:
          - pattern: markupsafe.escape(...)
          - pattern: flask.jsonify(...)
          - pattern: flask.render_template(...)
          - pattern: flask.render_template_string(...)
          - pattern: flask.redirect(...)
          - pattern: flask.send_file(...)
          - pattern: flask.send_from_directory(...)
      pattern-sinks:
          - patterns:
                - pattern-either:
                      - pattern: flask.make_response($CONTENT, ...)
                      - patterns:
                            - pattern-inside: |
                                  @$APP.route(...)
                                  def $VIEW(...):
                                      ...
                            - pattern: return $CONTENT
                - focus-metavariable: $CONTENT
      message: The response returns request data as HTML, which allows reflected XSS. Render a template, or escape the
          value with markupsafe.escape().
      languages:
          - python
      severity: ERROR
      metadata:
          cwe:
              - CWE-79
          category: security
    - id: gspot.flask.insecure-setting
      patterns:
          - pattern-either:
                - pattern: $APP.config[$KEY] = False
                - pattern: $KEY = False
          - metavariable-regex:
                metavariable: $KEY
                regex: ^['"]?(WTF_CSRF_ENABLED|SESSION_COOKIE_SECURE|SESSION_COOKIE_HTTPONLY|REMEMBER_COOKIE_SECURE)['"]?$
      message: This setting turns off CSRF protection, or lets the session cookie travel over plain HTTP or reach page
          scripts. Leave it on.
      languages:
          - python
      severity: ERROR
      metadata:
          cwe:
              - CWE-352
          category: security
