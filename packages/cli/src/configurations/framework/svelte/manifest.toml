route_files = ["+page.*", "+layout.*", "+server.*", "+error.*"]

[configuration]
description = "Svelte components: markup and script rules, HTML injection and DOM checks at both levels, and typing rules at level all."
requires = ["javascript"]
suggests = ["typescript", "css"]
title = "Svelte"

[detect]
dependencies = ["svelte"]
extensions = [".svelte"]

[files]
extensions = [".svelte"]
filenames = ["svelte.config.js", "svelte.config.ts"]

[defaults]
"javascript.import_extension" = "extensionless"

[[tool]]
kind = "package"
name = "eslint-plugin-svelte"
npm = "eslint-plugin-svelte"
rule_prefix = "svelte"
version = "3.23.1"

[tool.eslint]
extensions = [".svelte"]

[[tool]]
kind = "package"
name = "svelte-eslint-parser"
npm = "svelte-eslint-parser"
version = "1.9.0"

[[tool]]
name = "svelte-check"
npm = "svelte-check"
version = "4.7.7"

[tool.suppression]
marker = "^<!--\\s*svelte-ignore\\b"
reason = " - (?<reason>\\S.*)"
example = "<!-- svelte-ignore a11y_autofocus - reason: the dialog opens with the search field in focus -->"

[[tool]]
kind = "package"
name = "prettier-plugin-svelte"
npm = "prettier-plugin-svelte"
version = "4.1.1"

[tool.prettier]
module = "plugin.js"
extensions = [".svelte"]

[eslint]
required_tools = ["eslint-plugin-svelte", "svelte-eslint-parser"]
all_level_rules = ["svelte/no-useless-mustaches", "svelte/prefer-const", "svelte/require-event-dispatcher-types"]

[[eslint.export_names]]
files = ["**/routes/**/+server.{js,ts}"]
names = ["GET", "HEAD", "POST", "PUT", "DELETE", "PATCH", "OPTIONS", "fallback"]

[[eslint.export_names]]
files = ["**/routes/**/+{page,layout}{,.server}.{js,ts}"]
names = ["load", "entries"]

[[eslint.export_names]]
files = ["**/hooks{,.server,.client}.{js,ts}"]
names = ["handle", "handleFetch", "handleError", "reroute", "init"]

[[check]]
example = "A component containing `<img src={source} />` reports `a11y_missing_attribute`. Give the image a text alternative, such as `<img src={source} alt={caption} />`."
help = "Fix each warning and error svelte-check prints; both fail the check."
instead_of = "typescript/tsc"
name = "svelte-check"
runs = "scope"
stage = "push"
summary = "Runs svelte-check over the scope for compiler and accessibility warnings, and the types of every component and TypeScript file."
tool = "svelte-check"
why = "tsc cannot parse a component file, and the Svelte compiler warns about markup that no browser reports."

[check.files]
extensions = [".svelte"]

[[eslint.rules_off]]
files = ["**/*.svelte"]
reason = "Svelte compiles each component to a default export."
rules = ["import-x/no-default-export"]
