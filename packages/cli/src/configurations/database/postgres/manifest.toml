allowed_words = ["PostgreSQL", "Postgres"]

[configuration]
description = "Postgres migrations: the locking and breaking changes that Squawk reports, a fixed order, no edits to frozen migrations, row-level security, explicit grants, and an index under every foreign key."
requires = ["sql"]
title = "Postgres"

[detect]
content = { "prisma/schema.prisma" = '(?:^|\n)[\t ]*provider[\t ]*=[\t ]*"postgresql"' }
dependencies = ["pg", "postgres", "psycopg*", "asyncpg", "@neondatabase/serverless"]

[files]
paths = ["db/migrations/*.sql", "migrations/*.sql", "prisma/migrations/*/migration.sql", "drizzle/*.sql", "**/supabase/migrations/*.sql"]

[defaults]
"tools.sqlfluff.dialect" = "postgres"

[[tool]]
min_version = "2.0.0"
name = "squawk"
npm = "squawk-cli"
replace = [".squawk.toml", "squawk.toml"]
version = "2.70.0"

[[config_file]]
per_scope = true
target = "squawk.toml"
tool = "squawk"

[[check]]
command = ["squawk", "--config", "{config_file:squawk}", "--reporter", "json", "{files}"]
example = "A migration that adds a constraint with a full table scan reports a finding. Create the constraint first, and validate it in a separate migration."
files = { paths = ["{setting:postgres.migrations_folder}/**/*.sql"] }
help = "Follow the advice squawk prints for the rule. Turn one rule off with `gspot ignore postgres/squawk --rule <rule> --reason \"<why>\"`."
name = "squawk"
output = { format = "json", line_base = 0, fields = { file = "file", line = "line", column = "column", rule = "rule_name", message = "message help" } }
stage = "commit"
summary = "Checks every migration for changes that lock or rewrite a table, or break the running application."
why = "A migration that takes an exclusive lock on a large table stops the application for as long as it runs."

[[check]]
example = "A new migration numbered below the latest committed one reports a finding. Give it a later version, and leave applied migrations unchanged."
help = "Rename the new migration with a version later than the newest committed one."
name = "migration-order"
runs = "scope"
stage = "commit"
summary = "Checks that every migration has a version, that no two share one, and that a new migration sorts after the committed ones."
why = "A migration that sorts before an applied one never runs on databases already past it."

[[check]]
example = "An edit to a committed migration reports a finding. Restore the original file, and write the change as a new migration."
help = "Restore the file with `git checkout`, and write the change as a new migration."
name = "edited-migrations"
runs = "scope"
stage = "commit"
summary = "Checks that no migration at or before postgres.frozen_through differs from its committed text."
why = "An applied migration never runs again, so an edit reaches only new databases, and environments drift apart."

[[check]]
example = "A new table without row-level security reports a finding. Add `ALTER TABLE ... ENABLE ROW LEVEL SECURITY` for it."
help = "Enable row-level security on the table."
name = "row-level-security"
when = { setting = "postgres.client_schemas" }
runs = "scope"
stage = "commit"
summary = "Checks that every table in a client schema turns on row-level security."
why = "A client that reaches the schema reads and writes every row of a table without row security."

[[check]]
example = "The statement `GRANT ALL ON TABLE public.items TO app_reader;` reports a broad grant. If the role only reads rows, use `GRANT SELECT ON TABLE public.items TO app_reader;`."
help = "Name the privileges the role needs, such as `SELECT` alone."
name = "grants"
runs = "scope"
stage = "commit"
summary = "Reports a migration that grants all privileges."
why = "A full grant includes truncating the table, adding triggers, and each privilege a later Postgres adds, which nobody meant to give."

[[check]]
example = "A `SECURITY DEFINER` function without a safe search path reports a finding. Add `SET search_path = ''` to the definition, and schema-qualify the objects in its body."
help = "Set an explicit `search_path` in the definition, such as `SET search_path = ''`, and qualify every name inside it."
name = "definer-search-path"
runs = "scope"
stage = "commit"
summary = "Checks that every SECURITY DEFINER function sets its search_path."
why = "A definer function runs with its owner's rights, and a caller who controls the search path chooses the objects it touches."

[[check]]
example = "A foreign key on `orders.customer_id` without an index starting with that column reports a missing index. Add `SET lock_timeout = '5s'; SET statement_timeout = '60s'; CREATE INDEX orders_customer_id_idx ON orders (customer_id);` in the migration set."
help = "Create an index that starts with all columns of the foreign key."
name = "foreign-key-indexes"
runs = "scope"
stage = "commit"
summary = "Checks that an index, a primary key, or a unique key starts with all columns of each foreign key."
why = "Deleting a parent row scans the whole child table when the foreign key has no index."
