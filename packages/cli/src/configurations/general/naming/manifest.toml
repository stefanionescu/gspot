[[naming.override]]
paths = ["**"]
categories = ["variables", "parameters"]
allowed_names = ["_"]
reason = "An underscore marks a discarded binding."

[[naming.override]]
paths = ["**/.githooks/**", "**/.gspot/hooks/**", "**/.husky/**", "**/hooks/**"]
categories = ["files"]
allowed_names = ["pre-commit", "pre-push", "commit-msg", "post-checkout", "post-merge", "pre-rebase", "prepare-commit-msg"]
reason = "git names its hooks."

[[naming.override]]
paths = ["**/e2e/**"]
categories = ["folders", "files"]
allow_digits = true
reason = "The folder name e2e holds a digit."

[[naming.override]]
paths = ["**/migrations/**"]
categories = ["folders", "files"]
allow_digits = true
reason = "Migration tools name their folders and files with timestamps."

[[naming.override]]
allowed_names = ["_default"]
categories = ["files"]
paths = ["**/mise-tasks/**", "**/.mise-tasks/**", "**/.mise/tasks/**", "**/.config/mise/tasks/**", "**/mise/tasks/**"]
reason = "mise runs a task file named _default under the name of its folder."
