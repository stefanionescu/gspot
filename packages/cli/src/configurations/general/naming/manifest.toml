[configuration]
always_selected = true
description = "Identifiers, files, and folders: banned words, case, length, and word count."
title = "Naming"

[files]
languages = true

[[check]]
example = "`export const userHelper = 1;` reports the banned word `helper`. Rename it after what it holds, such as `userCount`."
help = "Rename the thing after what it holds or does. To keep a name, list it exactly under `allowed_names` in a `[[naming.override]]` record with a reason, or change a limit with `gspot set naming.<language>.max_words`."
level = "all"
name = "identifiers"
stage = "commit"
summary = "Checks every identifier against the naming settings: banned words, case, length, and word count."
why = "Names such as `enhancedHandler`, `ensureConfigIfNeeded`, and `utils` hide what the value holds or the code does."

[[check]]
example = "`utils/format.js` reports `utils`. Move it into the folder of the feature it serves, such as `invoices/format.js`."
help = "Rename the file or folder, or add a path rule under [[naming.override]] with a reason."
level = "all"
name = "paths"
stage = "commit"
summary = "Checks every file name, without its extension, and every folder name against the case rules of its language and the banned words."
why = "A file such as `enhanced-utils.ts` collects code with no clear place. One case rule keeps imports predictable."

[[check]]
example = "An allowed name that no source file contains reports an unmatched record. Remove the name, or correct it to the exact identifier and scope."
help = "Remove the record that matches nothing, or fix its name or path."
level = "all"
name = "allowed-names"
runs = "once"
stage = "commit"
summary = "Reports allowed names that no source file uses."
why = "An allowed name that nothing uses stays in gspot.toml after the code that needed it is gone."

[naming]
allowed_names = ["toJSON", "toString", "valueOf", "GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS", "NODE_ENV", "CI", "HOME", "PATH", "PWD", "TMPDIR", "TERM", "SHELL", "USER", "LANG", "NO_COLOR", "FORCE_COLOR", "GITHUB_TOKEN", "GITHUB_ACTIONS", "GITHUB_SHA", "GITHUB_REF"]
allowed_phrases = ["package manager", "news"]

[[naming.path_containers]]
open = "__"
close = "__"
category = "folders"

[[naming.path_containers]]
open = "["
close = "]"
category = "path_parameters"

[[naming.path_containers]]
open = "("
close = ")"
category = "folders"

[[naming.path_containers]]
open = "@"
close = ""
category = "folders"

[[naming.path_containers]]
open = "_"
close = ""
category = "folders"

[naming.lists]

[naming.lists.folders]
categories = ["folders"]
words = ["shared", "support"]

[naming.lists.containers]
words = ["core", "common", "generic", "misc", "stuff", "thing", "things", "details", "info", "object", "taxonomy"]

[naming.lists.roles]
words = ["helper", "helpers", "util", "utils", "manager", "handler", "processor", "wrapper", "shim", "shims", "shell", "probe"]

[naming.lists.marketing]
words = ["advanced", "enhanced", "improved", "intelligent", "smart", "modern", "robust", "seamless", "ultimate", "comprehensive", "optimized", "reusable", "custom", "final", "latest", "old", "new", "legacy", "combined"]

[naming.lists.defensive]
words = ["ensure", "maybe", "likely", "should", "if needed", "ifneeded", "if available", "ifavailable", "if changed", "ifchanged", "if possible", "ifpossible", "or throw", "orthrow", "waitfor", "with retries", "transient", "belt and suspenders", "fallback", "load bearing", "load-bearing", "loadbearing"]

[naming.lists.conjunctions]
words = ["and", "or", "with", "when", "what", "whatever", "once", "plus"]

[naming.lists.tests]
words = ["test case", "testcase", "under test", "undertest", "edge case", "edge cases", "actual"]

[naming.lists.abbreviations]
words = ["dir", "tmp", "temp", "cfg", "conf", "ctx", "msg", "btn", "idx"]

[naming.lists.generic_verbs]
categories = ["functions", "methods"]
first_word = true
words = ["execute", "perform", "manage", "process", "load", "fetch", "resolve"]

[naming.lists.prepositions]
categories = ["functions", "methods"]
first_word = true
words = ["to", "from", "with", "into"]

[naming.lists.negated_predicates]
first_word = true
words = ["is not", "is no", "has not", "has no", "can not", "can no"]

