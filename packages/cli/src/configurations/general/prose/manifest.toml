[[check]]
example = "`Release on 03/04/2026.` reports `ambiguous-date`. Write `Release on March 4, 2026.` instead."
help = "Write the date in ISO form, such as 2026-09-17, or with the month name."
name = "dates"
stage = "commit"
summary = "Reports a date such as 03/04/2026 in Markdown text and in code comments."
why = "03/04/2026 means March or April, depending on where the reader lives."

[[check]]
example = "`We shipped this change last week.` reports `gspot.history`. Say what the code does now."
help = "Rewrite the sentence the alert names, or add a real name and its reason to the `spelling.allowed_words` setting."
level = "all"
name = "vale"
output = { format = "vale" }
stage = "commit"
summary = "Checks prose against the complete gspot style and the upstream packages in Markdown, and the comment rules in code comments."
tool = "vale"
why = "One style keeps the documentation readable, and no other check reads sentences."

[[check]]
example = "A commit message that says `We should simply retry` reports `gspot.modals` and `gspot.marketing`. Write `Retry the request` instead."
help = "Rewrite the sentence that the alert names."
level = "all"
name = "commit-message"
output = { format = "vale" }
stage = "message"
summary = "Runs the word rules of WRITING.md on a new commit message, except the rule on history."
tool = "vale"
why = "A commit message stays in the history, and a hedge or a private path stays with it."
