[configuration]
always_selected = true
description = "Links that reach their files, anchors, and sites, and paths and commands that exist. Level all requires a README in every scope and a LICENSE at the root."
title = "Docs"

[files]
extensions = [".md", ".mdx"]

[[tool]]
mise = { name = "lychee", checksums = { "linux-x64" = "sha256:1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a", "linux-arm64" = "sha256:91a7bd65685da41b90ccb9bc867a3d649a7818042dae04ff405e55a25bddee4c", "macos-x64" = "sha256:887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978", "macos-arm64" = "sha256:c9d3740ea2d891854d37116c9fba840f37b6e7c89d330e7db84ac333631c4977", "windows-x64" = "sha256:32975d1493ee1a975d6bb41e4fb56fe419cb442ded628bb772ba2e614acfacad" } }
name = "lychee"
output = { format = "grouped", file_pattern = "^Errors in (?<file>.+)$", pattern = "^\\[(?<rule>[A-Z0-9]+)\\] (?<message>\\S+(?: \\(at (?<line>\\d+):(?<column>\\d+)\\))? \\| .*)$" }
replace = ["lychee.toml", ".lycheeignore"]
version = "0.24.2"

[[config_file]]
per_scope = true
target = "lychee.toml"
tool = "lychee"

[[check]]
command = ["lychee", "--config", "{config_file:lychee}", "--root-dir", "{root}/.gspot/root-links", "--offline", "--include-fragments=full", "--format", "detailed", "--no-progress", "{files}"]
example = "The link `[Setup](missing.md)` reports a broken link when no `missing.md` exists. Point it at the setup guide, or add that file."
help = "Point the link at the file or heading that exists, or delete it. A link that starts with `/` starts at the repository root."
name = "lychee"
stage = "commit"
summary = "Checks that local documentation links reach existing files and valid anchor or text fragments."
why = "A dead link inside the repository breaks silently, and readers hit it first."

[[check]]
command = ["lychee", "--config", "{config_file:lychee}", "--root-dir", "{root}", "--scheme", "http", "--scheme", "https", "--include-fragments=full", "--format", "detailed", "--no-progress", "{files}"]
example = "A link that returns HTTP 404 reports a broken destination. Replace the URL with a current one, or remove the link."
help = "Update or remove the link, or exclude the URL pattern with a reason under docs.allowed_urls."
name = "lychee-external"
needs = ["network"]
stage = "manual"
summary = "Checks every external link over the network."
why = "A site that moves or closes breaks a link with no change in the repository."

[[check]]
example = "A path in the docs that points to a deleted file reports a stale reference. Update the path and any command that uses it."
files = { extensions = [".md", ".mdx"], filenames = ["package.json"], paths = ["**/{mise,.mise,.config/mise,mise-tasks,.mise-tasks}/**", "**/{mise,.mise}{,.local}.toml", "**/.config/mise.toml"] }
help = "Fix the path or the task name. To keep an example out, write it in a fence with `title=`."
name = "missing-paths"
reads_deleted_paths = true
runs = "once"
stage = "commit"
summary = "Checks that documented paths point to tracked files, and that each documented `run` command of mise or a package manager names a task or script."
why = "A stale path in the docs sends the reader to a deleted file."

[[check]]
example = "A scope without `README.md` reports the missing file. Add one that explains what the scope does and how to start."
help = "Add a README.md that says what the scope does and how to use it, and a LICENSE file at the root."
level = "all"
name = "required-files"
stage = "commit"
summary = "Checks that every scope has a README.md and the root has a LICENSE."
why = "A scope with no README leaves readers to guess what it does."
runs = "scope"

[[check]]
example = "`npm install example@1.2.3` in a README of a package at version 1.2.3 reports `version-string`. Write `npm install example`."
files = { paths = ["**"] }
help = "Delete the version, or read it from the package manifest."
level = "all"
name = "version-strings"
runs = "scope"
stage = "commit"
summary = "Reports the version of a package manifest of the scope in Markdown and test files, except changelogs."
why = "A copied version goes stale at the next release."
