allowed_words = ["gspot"]

[configuration]
always_selected = true
description = "Path patterns in gspot.toml that match files, current generated files, no config files that conflict with the generated ones, a reason on each suppression, and a reason for each setting made weaker."
title = "gspot"

[[tool]]
install_help = "Install Node.js 22.22.3 or newer. On macOS, run brew install node@24. On Windows, run winget install OpenJS.NodeJS.LTS."
min_version = "22.22.3"
name = "node"
system = true
version_command = ["--version"]

[[check]]
example = "A `.commitlintrc.json` while gspot runs commitlint reports a conflicting config file. Delete it, and write the rule you need in `gspot.toml`, such as `commits.types`. A script `eslint .` in `package.json` reports a lint command. Replace it with `gspot check`."
help = "Delete the file or the line that the message names, or replace the line with `gspot check`. gspot writes the settings of this tool; move a rule you need into gspot.toml."
name = "conflicting-configs"
runs = "once"
stage = "commit"
summary = "Finds a tool config that a generated config file replaces, and the scripts, hooks, CI steps, and devDependencies that still call or repeat such a tool."
why = "The tool reads only the settings gspot writes, so a rule left in the old file looks active and does nothing, and a lint command fails or runs a second lint stack beside gspot."

[[check]]
example = "An edit by hand to a generated config file reports `changed`. Move the change into gspot.toml, then run `gspot check --fix` or `gspot install`. A stale tool lockfile under `.gspot/` needs `gspot install`."
help = "Change gspot.toml, then run `gspot check --fix` or `gspot install`. After a merge, run `gspot install`."
name = "generated-files"
runs = "once"
stage = "commit"
summary = "Compares generated files with the settings and reports `changed`, `absent`, and `stray` files."
why = "A generated file that drifts from gspot.toml runs a tool with settings nobody chose."

[[check]]
example = "An `[[ignore]]` record with `paths = [\"nowhere/**\"]` that matches no file reports `unmatched-path`. Remove the record, or correct its path and keep the reason."
help = "Remove the pattern, or correct it so that it matches a tracked file."
name = "unmatched-paths"
runs = "once"
stage = "commit"
summary = "Reports each path pattern in gspot.toml that matches no tracked file."
why = "An ignore or a path setting that matches nothing misleads the next reader."

[[check]]
example = "An `eslint-disable-next-line` comment without a reason reports a finding. Fix the code and remove the comment, or append `-- reason: ...` that explains the exception."
files = { paths = ["**/*"] }
help = "Fix the finding and remove the suppression, or add a reason in the syntax of the tool. Never suppress a size or complexity limit: split the code by its steps, or ask the user to raise it in gspot.toml."
name = "suppressions"
stage = "commit"
summary = "Reports suppressions with no reason, any that lift a size or complexity limit, and Semgrep or Vale suppressions."
why = "A suppression with no reason hides a finding nobody reviewed."

[[check]]
example = "A `main.py` in a repository that selects only `markdown` reports `detected-configuration`. Run `gspot add python`, or `gspot remove python --reason \"<why>\"`."
help = "Add the configuration, or remove it with a reason."
name = "detected-configurations"
runs = "once"
stage = "commit"
summary = "Reports each configuration that the files of a scope suggest and that gspot.toml neither selects nor removes."
why = "A language that no configuration selects passes every check, because no check reads it."

[[check]]
example = "A push that raises `limits.max_file_lines` with no reason reports `setting`. Run `gspot set limits.max_file_lines 400 --reason \"the generated parser needs it\"`."
help = "Give the change a reason, or undo it. Each message names the setting or the rule."
name = "weakenings"
runs = "once"
stage = "push"
summary = "Reports a `gspot.toml` change with no reason that adds or widens an ignore, removes a configuration, lowers the level, makes a setting weaker, or turns off hooks or rule files."
why = "A change to the settings is the easiest way to pass a check, and only its reason tells a reviewer that someone chose it."
