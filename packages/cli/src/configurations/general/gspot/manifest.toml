allowed_words = ["gspot"]

[configuration]
always_selected = true
description = "gspot itself: path patterns in gspot.toml that match files, current generated files, no config files that conflict with the generated ones, and a reason on each suppression."
title = "gspot"

[[tool]]
install_help = "Install Node.js 24.2.0 or newer. On macOS, run brew install node@24. On Windows, run winget install OpenJS.NodeJS.LTS."
min_version = "24.2.0"
name = "node"
system = true
version_command = ["--version"]

[[check]]
example = "A `.commitlintrc.json` while gspot runs commitlint reports a conflicting config file. Delete it, and write the rule you need in `gspot.toml`, such as `tools.commitlint.types`."
help = "Delete the file. gspot writes the settings this tool reads; move a rule you need into gspot.toml."
name = "conflicting-configs"
runs = "once"
stage = "commit"
summary = "Finds the settings file of a tool that gspot writes settings for, such as `.commitlintrc.json` while commitlint runs."
why = "The tool reads only the settings gspot writes, so a rule left in the old file looks active and does nothing."

[[check]]
example = "An edit by hand to a generated config file reports drift. Move the change into gspot.toml, then run `gspot apply`."
help = "Change gspot.toml, then run `gspot apply`. After a merge, run `gspot apply`, followed by `gspot install`."
name = "generated-files"
runs = "once"
stage = "commit"
summary = "Compares generated files with the settings and reports changed, missing, and stray ones."
why = "A generated file that drifts from gspot.toml runs a tool with settings nobody chose."

[[check]]
example = "An `[[ignore]]` record with `paths = [\"nowhere/**\"]` that matches no file reports `unmatched-path`. Remove the record, or correct its path and keep the reason."
help = "Remove the pattern, or correct it so that it matches a tracked file."
name = "unmatched-paths"
runs = "once"
stage = "commit"
summary = "Reports each path pattern in gspot.toml that matches no tracked file."
why = "An ignore or a path setting that matches nothing misleads the next reader."

[[check]]
example = "An `eslint-disable-next-line` comment without a reason reports a finding. Fix the code and remove the comment, or append `-- reason: ...` that explains the exception."
help = "Fix the finding and remove the suppression, or add a reason in the syntax of the tool. Never suppress a size or complexity limit: split the code by its steps, or ask the user to raise it in gspot.toml."
name = "suppressions"
runs = "once"
stage = "commit"
summary = "Reports suppressions with no reason, any that lift a size or complexity limit, and Semgrep or Vale suppressions."
why = "A suppression with no reason hides a finding nobody reviewed."
