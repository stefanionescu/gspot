[configuration]
always_selected = true
description = "Every text file: spelling, with a reason for each allowed word."
title = "Spelling"

[files]
paths = ["**"]

[[tool]]
mise = { name = "typos", checksums = { "linux-x64" = "sha256:93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454", "linux-arm64" = "sha256:2ac5e37b3236b3c07dec5cdf1527acf143aec4674a6089b0bf424d021b35e099", "macos-x64" = "sha256:f3451079971633a7f769fb958fe06b0d64b5f1dc46df0854aa1ddb9a6f4031d6", "macos-arm64" = "sha256:316d50a32c3726a80ab39c6d12141b70080498973c5e8a9b068b12cde78b10c1", "windows-x64" = "sha256:518f759fba43205f17a717656054c1d25bc883455a6296989e9d021c6edb7c59" } }
name = "typos"
replace = ["typos.toml", ".typos.toml", "_typos.toml"]
version = "1.51.1"

[[config_file]]
per_scope = true
target = "typos.toml"
tool = "typos"

[[check]]
command = ["typos", "--isolated", "--config", "{config_file:typos}", "--force-exclude", "--format", "json", "--color", "never", "{files}"]
example = "A misspelled word reports a finding. Correct it, and for a file name, rename the file and update each reference to it."
exit_codes = [2]
fix = ["typos", "--isolated", "--config", "{config_file:typos}", "--force-exclude", "--no-check-filenames", "--locale", "en", "--write-changes", "--color", "never", "{files}"]
fix_extensions = [".md", ".mdx", ".markdown", ".txt", ".rst"]
help = "Fix the spelling, or write the real name and its reason in the `spelling.allowed_words` setting."
name = "typos"
output = { format = "typos" }
stage = "commit"
summary = "Finds misspelled words in code, comments, and documentation."
why = "A typo in an identifier spreads to every caller; in prose it costs the reader a second look."
