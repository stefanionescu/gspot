allowed_words = ["Semgrep", "CSRF"]

[configuration]
always_selected = true
description = "Code in every language a configuration claims: unsafe patterns that Semgrep finds."
title = "Security"

[files]
languages = true

[[tool]]
builds = ["macos", "linux"]
min_version = "1.100.0"
name = "semgrep"
pypi = "semgrep"
suppression = { marker = "^\\s*(?://|/\\*+|\\*|#|--|<!--|;|%)?\\s*nosemgrep\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }
version = "1.181.0"

[[check]]
command = ["semgrep", "scan", "--strict", "--error", "--metrics", "off", "--disable-version-check", "--no-rewrite-rule-ids", "--quiet", "--json", "{files}"]
example = "A rule in `security.semgrep_rules` with the pattern `eval(...)` reports its ID and location at `eval(userInput)`. Parse the input instead, and allow only known operations."
exit_codes = [1, 3]
help = "Change the code the way the message says."
name = "semgrep"
output = { format = "semgrep" }
stage = "push"
summary = "Runs the Semgrep rules of the FastAPI configuration and the files in security.semgrep_rules over the files of the run."
when = { config_file = "semgrep" }
why = "An injection or a logged secret reads like ordinary code, and a pattern rule finds it before a reviewer has to."
