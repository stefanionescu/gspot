ignored_paths = ["**/.env", "**/.env.*", "**/.dev.vars", "**/.dev.vars.*"]

[configuration]
always_selected = true
description = "Secrets: environment files and their examples, credentials in staged changes and pushed commits, and a reason for each allowed value."
title = "Secrets"

[files]
kinds = ["source", "generated", "vendored", "binary"]
paths = ["**"]

[[tool]]
min_version = "8.25.0"
mise = { name = "gitleaks", checksums = { "linux-x64" = "sha256:551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb", "linux-arm64" = "sha256:e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080", "macos-x64" = "sha256:dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709", "macos-arm64" = "sha256:b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5", "windows-x64" = "sha256:d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e" } }
name = "gitleaks"
output = { format = "json", fields = { file = "File", line = "StartLine", column = "StartColumn", rule = "Fingerprint", message = "Description" } }
replace = [".gitleaks.toml", "gitleaks.toml"]
version = "8.30.1"

[[tool]]
mise = { name = "github:dotenv-linter/dotenv-linter", checksums = { "linux-x64" = "sha256:9e2f1f6eb88a71ac15ef209f78f5a68644db82f132d2677112b4f80ec2bd2127", "linux-arm64" = "sha256:c4113aafd35e5f9095b2f757061d07cc8eb5cc0bcd755249877af08b7ffafb9a", "macos-x64" = "sha256:143361bcd3c859cac0b16a6eaa51f3f69f270f17a55431e2e44d76722a7f0271", "macos-arm64" = "sha256:430ed45983cfc1d242cae959ec4b3b2df43fa1aff07d7750cc836d2f6479799a", "windows-x64" = "sha256:771214659b86d2de5c8c5214e6d59484ceb0de8a87037d488ce37d6ca6f6cc1a" } }
name = "dotenv-linter"
version = "4.0.0"

[[config_file]]
target = "gitleaks.toml"
tool = "gitleaks"

[[check]]
command = ["gitleaks", "git", "--staged", "--no-banner", "--redact", "--exit-code", "1", "--config", "{config_file:gitleaks}", "--report-format", "json", "--report-path", "-", "{root}"]
example = "A staged credential reports a finding. Load it from an environment variable instead, and rotate it if it already leaked."
help = "Remove the value and load it from the environment."
name = "gitleaks-staged"
runs = "once"
stage = "commit"
summary = "Scans the staged change for keys, tokens, and passwords before the commit exists."
why = "A secret that reaches a commit stays in history after you delete the line, and every clone holds it."

[[check]]
command = ["gitleaks", "git", "--no-banner", "--redact", "--exit-code", "1", "--config", "{config_file:gitleaks}", "--report-format", "json", "--report-path", "-", "{root}"]
example = "A credential in an earlier commit still reports after you delete it from the working tree. Rotate it, then remove it from history, and coordinate any rewrite of shared commits."
help = "Rewrite the commit that holds the value and rotate the secret."
name = "gitleaks-pushed"
runs = "history"
stage = "push"
summary = "Scans every commit about to be pushed for keys, tokens, and passwords."
why = "A commit made past the hook still reaches the shared branch unless the push checks it."

[[check]]
command = ["dotenv-linter", "check", "--plain", "--skip-updates", "--ignore-checks", "TrailingWhitespace", "--ignore-checks", "EndingBlankLine", "{files}"]
example = "A dotenv file that defines one key twice reports a duplicate. Keep one line, and delete the other."
files = { filenames = [".env", ".env.*", ".dev.vars", ".dev.vars.*"] }
fix = ["dotenv-linter", "fix", "--plain", "--no-backup", "--ignore-checks", "TrailingWhitespace", "--ignore-checks", "EndingBlankLine", "{files}"]
help = "Run the `fix:` command that the report prints, or fix the line dotenv-linter names."
name = "dotenv-linter"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+) (?<rule>[A-Za-z]+): (?<message>.*)$" }
stage = "commit"
summary = "Checks every tracked environment file: key format, duplicates, quoting, ordering, and trailing spaces."
why = "Other people copy a tracked environment file, so a malformed line in it spreads to every machine."

[[check]]
example = "`process.env.API_TOKEN ?? 'dev-token'` reports `env-fallback`. Read the variable with no fallback, and fail when it is missing."
help = "Delete the fallback, and fail with a clear message when the variable is missing."
name = "env-fallbacks"
runs = "scope"
stage = "push"
summary = "Reports a read of a variable named like a token, secret, key, or password with a literal fallback, in JavaScript, TypeScript, and Python."
why = "A secret with a default runs in production with a value that a repository reader knows."

[[check]]
example = "Code that reads `API_URL` while `.env.example` lacks that key reports a finding. Add `API_URL=` to `.env.example` with a note on the value, and no credential."
help = "Add the key to `.env.example` or a file under `secrets.env_examples`, or stop reading it."
name = "env-examples"
runs = "scope"
stage = "push"
summary = "Checks that an existing env example lists each static uppercase key that code reads through process.env, import.meta.env, Bun.env, Deno.env.get, the Python os module, or an environment function."
why = "A variable missing from the env example breaks the first run on a new machine."
