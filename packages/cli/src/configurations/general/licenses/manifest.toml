[configuration]
description = "Locked dependencies: a license on the allowed list, or an allowed-package record with a reason for one package."
title = "Licenses"

[detect]

[files]
filenames = ["bun.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "poetry.lock", "pdm.lock", "Pipfile.lock", "requirements.txt"]
kinds = ["source", "generated"]

[[check]]
example = "A dependency with a license outside `licenses.allowed` reports a finding for that version. Replace it, or write a `[[licenses.allowed_package]]` record with its name, version, and the license in a reason."
help = "Replace the package, or write a [[licenses.allowed_package]] record by hand with its name, version, and a reason naming the license."
large_files = true
name = "allowed"
needs = ["network"]
runs = "scope"
stage = "push"
summary = "Compares the license of each locked package with the allowed list and package records, through osv-scanner."
tool = "osv-scanner"
when = { setting = "licenses.allowed" }
why = "A license the project cannot accept arrives silently with a transitive dependency."
