allowed_words = ["Prettier"]

[configuration]
always_selected = true
description = "Every file: the Prettier layout for the file types it formats, and line endings, final newlines, and trailing whitespace from editorconfig-checker. The format settings set the indentation, line length, quotes, and line endings for every formatter."
title = "Format"

[files]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".json", ".jsonc", ".json5", ".md", ".mdx", ".css", ".scss", ".html", ".yml", ".yaml", ".vue", ".graphql"]
prettier_plugins = true

[[tool]]
crash_pattern = "\\[error\\] (?:No parser|Cannot find|Invalid)"
name = "prettier"
npm = "prettier"
replace = [".prettierrc", ".prettierrc.json", ".prettierrc.yml", ".prettierrc.yaml", ".prettierrc.json5", ".prettierrc.js", "prettier.config.js", ".prettierrc.ts", "prettier.config.ts", ".prettierrc.mjs", "prettier.config.mjs", ".prettierrc.mts", "prettier.config.mts", ".prettierrc.cjs", "prettier.config.cjs", ".prettierrc.cts", "prettier.config.cts", ".prettierrc.toml", ".prettierignore"]
version = "3.9.10"

[[tool.replace_key]]
file = "package.json"
key = "prettier"

[[tool.replace_key]]
file = "package.yaml"
key = "prettier"

[[tool]]
mise = { name = "github:editorconfig-checker/editorconfig-checker", checksums = { "linux-x64" = "sha256:44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003", "linux-arm64" = "sha256:abad76da8c9950fdc2a314bcd66969172aa823e9c595fa7e3a389a91e34d025e", "macos-x64" = "sha256:ff59f57717d95fc62b8e372c8051dbbb766f7d660942409a85d027b0feb2422c", "macos-arm64" = "sha256:ff59f57717d95fc62b8e372c8051dbbb766f7d660942409a85d027b0feb2422c", "windows-x64" = "sha256:857f8f74dfc259d73dac93573e37cf3ce01150787d7b139bf839549cc6b5beb9" } }
name = "editorconfig-checker"
replace = [".editorconfig"]
version = "4.0.2"

[[config_file]]
root = true
target = ".editorconfig"
tool = ["editorconfig-checker", "prettier"]

[[config_file]]
pointer = { path = "prettier.config.mjs", body = "export { default } from {target_module} with { type: 'json' };\n" }
target = "prettier.json"
tool = "prettier"

[[config_file]]
root = true
target = ".prettierignore"
tool = "prettier"

[[check]]
command = ["prettier", "--check", "--config", "{pointer:prettier.config.mjs}", "--ignore-path", ".prettierignore", "--log-level", "warn", "{files}"]
example = "A JavaScript file with `const value={enabled:true};` differs from the Prettier output. Run `gspot check --fix` to format it."
exit_codes = [1, 2]
fix = ["prettier", "--write", "--config", "{pointer:prettier.config.mjs}", "--ignore-path", ".prettierignore", "--log-level", "warn", "{files}"]
help = "Run `gspot check --fix <file>` to format the file."
name = "prettier"
output = { format = "regex", pattern = "^\\[(?:warn|error)\\] (?<file>[^\\s].*?)(?:: SyntaxError: (?<message>.+) \\((?<line>\\d+):(?<column>\\d+)\\)|(?<![\\s.]))$", fixable = "^\\[warn\\] ", message = "Not formatted the way Prettier formats it." }
stage = "commit"
summary = "Checks each file Prettier handles for unformatted code."
why = "Formatting by hand differs by editor; one formatter keeps diffs about the change and not the spacing."

[[check]]
command = ["editorconfig-checker", "-no-color", "-disable-indentation", "-format", "default", "-exclude", "{formatted_extensions}", "{files}"]
example = "A file with CRLF line endings under an `.editorconfig` that requires LF reports a finding. Save it with LF endings."
files = { paths = ["**"] }
help = "Fix the line the checker names; most editors apply .editorconfig on save."
name = "editorconfig-checker"
output = { format = "grouped", file_pattern = "^(?<file>.+):$", pattern = "^\\s+(?:(?<line>\\d+)(?:-\\d+)?: )?(?<message>\\S.*)$" }
stage = "commit"
summary = "Checks line endings, final newlines, and trailing whitespace in every file against .editorconfig."
why = "These rules cover the files no formatter touches, so a stray tab or missing newline never lands in a diff. The formatters handle indentation."
