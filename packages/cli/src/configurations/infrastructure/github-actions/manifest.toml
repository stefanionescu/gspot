allowed_words = ["GitHub", "GitHub Actions"]

[configuration]
description = "GitHub Actions workflows: valid syntax and expressions, security audits, and pinned actions."
title = "GitHub Actions"

[files]
paths = ["**/.github/workflows/*.{yml,yaml}", "**/action.{yml,yaml}"]
kinds = ["source", "generated"]

[[tool]]
mise = { name = "aqua:rhysd/actionlint", checksums = { "linux-x64" = "sha256:8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8", "linux-arm64" = "sha256:325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6", "macos-x64" = "sha256:5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644", "macos-arm64" = "sha256:aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f", "windows-x64" = "sha256:6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9" } }
name = "actionlint"
version = "1.7.12"

[[tool]]
name = "shellcheck"

[[tool]]
mise = { name = "aqua:zizmorcore/zizmor", checksums = { "linux-x64" = "sha256:d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99", "linux-arm64" = "sha256:37eebbd5762a44f262d94875431b14a6d2402991e90a685113ea97b8b41be833", "macos-x64" = "sha256:72ae63bb85b67229c06242f04195cb43927e9fab5f43803c6434dc701a517d61", "macos-arm64" = "sha256:ad5aa633cd56215b11e6c51d51f90c7e6b22904a75047d1215abbd422f61d698", "windows-x64" = "sha256:4de30371c8a3b483aecbcf0dec1fd6a2b6aae65051ca226b4f6527baac6a8c7a" } }
name = "zizmor"
version = "1.31.1"

[[config_file]]
target = "zizmor.yml"
tool = "zizmor"

[[check]]
command = ["actionlint", "-ignore", "is potentially untrusted", "-no-color", "{files}"]
example = "A workflow expression with the unknown context `${{ unknown.value }}` reports an error. Use a supported context and property there instead."
exit_codes = [1]
files = { paths = ["**/.github/workflows/*.{yml,yaml}"], kinds = ["source", "generated"] }
help = "Fix the line actionlint names."
name = "actionlint"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?<message>.*?) \\[(?<rule>[a-z-]+)\\]$" }
stage = "commit"
summary = "Checks every GitHub Actions workflow with actionlint: syntax, expressions, action inputs, and shell steps."
tool = ["actionlint", "shellcheck"]
why = "A workflow error surfaces on the first push after the change, in CI, where it costs a round trip."

[[check]]
example = "A job with no `timeout-minutes` reports `job-timeout`. Add `timeout-minutes: 30` to the job."
files = { paths = ["**/.github/workflows/*.{yml,yaml}"] }
help = "Apply the fix that the message names."
name = "workflow-shape"
stage = "commit"
summary = "Checks each workflow for a job timeout, a pinned runner, a reason above `continue-on-error`, no expression or piped download in `run:`, no secret in the top-level `env`, a `concurrency` group that fits its triggers, and `retention-days` on uploads."
why = "A hung job or a moving runner image costs a day to find, and an expression in `run:` becomes shell code."

[[check]]
command = ["zizmor", "--offline", "--no-progress", "--format", "github", "--config", "{config_file:zizmor}", "{files}"]
example = "A workflow that puts pull request text straight into a shell command reports `template-injection`. Pass the text through a step environment variable, and quote its expansion."
exit_codes = [11, 12, 13, 14]
help = "Apply the fix zizmor names."
name = "zizmor"
output = { format = "regex", pattern = "^::(?:warning|error|notice) file=(?<file>[^,]+),line=(?<line>\\d+),title=(?<rule>[^:]+)::(?<message>.*)$" }
stage = "commit"
summary = "Audits GitHub Actions workflows and composite actions with zizmor for template injection, excessive permissions, and dangerous triggers."
why = "A workflow runs with the repository's credentials; an injectable expression can hand them to a stranger."
