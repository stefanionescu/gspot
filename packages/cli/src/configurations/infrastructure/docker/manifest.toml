allowed_words = ["Docker", "Trivy"]

[configuration]
description = "Dockerfiles and Compose files: Dockerfile best practices, valid Compose files, a .dockerignore beside each Dockerfile, and image vulnerability scans."
title = "Docker"

[detect]
paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose.{yml,yaml}", "**/compose.*.{yml,yaml}", "**/compose-*.{yml,yaml}", "!**/*.dockerignore"]

[files]
paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose.{yml,yaml}", "**/compose.*.{yml,yaml}", "**/compose-*.{yml,yaml}", "**/.dockerignore", "**/*.dockerignore"]

[shared_prefixes]
prefixes = ["docker"]

[[tool]]
mise = { name = "hadolint", checksums = { "linux-x64" = "sha256:c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507", "linux-arm64" = "sha256:f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d", "macos-x64" = "sha256:ffe9bb18b23d5ed1eae50237aecdbb523d016e96da0bd4e7aa432040acfc3fde", "macos-arm64" = "sha256:5c09f3213f8e40406abe048233d985eebef336d4a6a20021be47fadb6cf480a2", "windows-x64" = "sha256:01d927294962b5387f9ead4f18679158452be4f17c765ad0bdffe5264b9c7b0a" } }
name = "hadolint"
off = { basic = ["DL3001", "DL3003", "DL3008", "DL3010", "DL3018", "DL3048", "DL4001"] }
replace = [".hadolint.yaml", ".hadolint.yml"]
version = "2.15.1"

[[tool]]
mise = { name = "trivy", checksums = { "linux-x64" = "sha256:e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7", "linux-arm64" = "sha256:aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c", "macos-x64" = "sha256:89563d4d495cf4ef06a0d1950f8710b124e9f7bd2615ec6c47b03673f4ad45a2", "macos-arm64" = "sha256:e7ec0d21fe842553f59af99aba2efbcc822369fbaed27019c575408b6d135fce", "windows-x64" = "sha256:7b4762a5a5326cb4b83dfd2bb5d9aaf15a1ed867c75cad7dd8b38840a28e7be6" } }
name = "trivy"
replace = ["trivy.yaml", ".trivyignore"]
version = "0.76.0"

[[tool]]
install_help = "Install Docker Desktop or Docker Engine."
name = "docker"
system = true

[[config_file]]
per_scope = true
target = "hadolint.yml"
tool = "hadolint"

[[config_file]]
per_scope = true
target = "trivy.yml"
tool = "trivy"

[[config_file]]
per_scope = true
target = "trivyignore"
tool = "trivy"

[[check]]
command = ["hadolint", "--no-color", "--config", "{config_file:hadolint}", "{files}"]
example = "`FROM node:latest` reports DL3007, because that tag moves. Pin an explicit version tag or a digest."
files = { paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "!**/*.dockerignore"] }
help = "Change the instruction the way the rule says."
name = "hadolint"
output = { format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+) (?<rule>[A-Z]+\\d+) [a-z]+: (?<message>.*)$" }
stage = "commit"
summary = "Lints every Dockerfile, and runs ShellCheck over its RUN lines."
why = "An unpinned base image makes a build nobody can repeat, and a cache left in a layer bloats the result."

[[check]]
command = ["docker", "compose", "-f", "{file}", "config", "--quiet", "--no-interpolate", "--no-env-resolution"]
example = "A Compose service with the unknown key `bogus` fails to parse. Remove the key, or use a supported one."
files = { paths = ["**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose.{yml,yaml}", "**/compose.*.{yml,yaml}", "**/compose-*.{yml,yaml}"] }
help = "Read the message Compose prints; it names the key and the service."
name = "compose"
output = { format = "regex", pattern = "^\\s*(?<message>\\S.*)$" }
runs = "scope"
stage = "push"
summary = "Parses every Compose file with `docker compose config`, which needs no running daemon."
why = "Valid YAML can still hold a key that Compose rejects, and otherwise the first sign comes during a deploy."

[[check]]
example = "A Compose service with `privileged: true` reports `privileged-container`. Remove it, and add only the capabilities the service needs with `cap_add`."
files = { paths = ["**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose.{yml,yaml}", "**/compose.*.{yml,yaml}", "**/compose-*.{yml,yaml}"] }
help = "Change the service the way the message says."
name = "service-security"
stage = "commit"
summary = "Reports each Compose service that runs privileged, mounts the Docker socket, or turns off its seccomp, AppArmor, or SELinux profile."
why = "Each of these hands the container control of the host, so one bug in the service compromises the machine."

[[check]]
example = "`RUN npm install` reports `lockfile-install`. Write `RUN npm ci`, which installs the lockfile as it is."
files = { paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "!**/*.dockerignore"] }
help = "Apply the fix that the message names."
name = "instructions"
stage = "commit"
summary = "Finds `RUN` lines that can rewrite the lockfile, pipe a download into a shell, or add a second Python index, an `ADD` of a URL with no checksum, the Docker socket as a `VOLUME`, an nginx tag with no full version, and a shell as the `ENTRYPOINT`."
why = "A build that rewrites its lockfile or runs a downloaded script ships code that nobody reviewed, and a shell as process 1 swallows the stop signal."

[[check]]
example = "A Dockerfile with no `.dockerignore` beside it reports a finding. Add one that excludes the paths the finding names, such as `.git` and installed dependencies."
files = { paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose.{yml,yaml}", "**/compose.*.{yml,yaml}", "**/compose-*.{yml,yaml}", "**/.dockerignore", "**/*.dockerignore"] }
help = "Add a .dockerignore beside the Dockerfile with the paths the message names."
name = "dockerignore"
runs = "once"
stage = "commit"
summary = "Checks that an ignore file beside every Dockerfile keeps `.git`, installed dependencies, and environment files out of the build, and that no `COPY` source sits in it."
why = "Without it, the daemon receives the whole folder, and a `COPY` of it puts the history and secrets into the image."

[[check]]
command = ["trivy", "config", "--misconfig-scanners", "dockerfile", "--quiet", "--skip-check-update", "--config", "{config_file:trivy}", "--ignorefile", "{config_file:trivyignore}", "--exit-code", "10", "--format", "json", "."]
example = "A Dockerfile whose final stage runs as root reports a finding. Create an unprivileged user, and switch to it with `USER` before the application starts."
exit_codes = [10]
files = { paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "!**/*.dockerignore"] }
help = "Change the file the way the message says."
name = "trivy-config"
output = { format = "json", list = "Results", children = ["Misconfigurations"], fields = { file = "Target", line = "CauseMetadata.StartLine", rule = "ID", message = "Message" } }
run_in_copy = true
runs = "scope"
stage = "push"
summary = "Scans Dockerfiles for HIGH and CRITICAL misconfigurations, including a root user and exposed secrets."
why = "A root user turns any bug in the service into full control of the container."

[[check]]
example = "An image with a vulnerable package reports the advisory. Move to an image version with the fixed package."
files = { paths = ["**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose.{yml,yaml}", "**/compose.*.{yml,yaml}", "**/compose-*.{yml,yaml}"] }
help = "Move to a newer tag of the image."
name = "trivy-image"
needs = ["docker"]
runs = "scope"
stage = "manual"
summary = "Scans every image a Compose file names for known vulnerabilities in its packages."
tool = "trivy"
why = "A base image carries hundreds of packages, and new advisories keep arriving after you pick it."
