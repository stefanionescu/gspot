[configuration]
description = "Ansible playbooks, roles, and collections: the lint rules of the Ansible project."
title = "Ansible"

[detect]
paths = ["**/ansible.cfg", "**/playbook.{yml,yaml}", "**/playbooks/*.{yml,yaml}", "**/inventory/*.{ini,yml,yaml}", "**/inventory/hosts*"]

[files]
paths = ["**/ansible.cfg", "**/galaxy.yml", "**/requirements.yml", "**/roles/*/tasks/main.yml"]

[[tool]]
builds = ["macos", "linux"]
min_version = "24.0.0"
name = "ansible-lint"
off = { always = ["experimental"] }
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):[\\d:]* (?<rule>[^:]+): (?<message>.*)$" }
pypi = "ansible-lint"
version = "26.10.1"

[[config_file]]
per_scope = true
target = "ansible-lint.yml"
tool = "ansible-lint"

[[check]]
command = ["ansible-lint", "-c", "{config_file:ansible-lint}", "--offline", "--nocolor", "-f", "pep8", "--profile", "moderate"]
example = "A task with `ansible.builtin.command: systemctl restart nginx` reports `command-instead-of-module`. Use `ansible.builtin.systemd` with `name: nginx` and `state: restarted` instead."
files = { extensions = [".yml", ".yaml", ".cfg", ".j2"] }
help = "Change the task the way the rule says."
name = "ansible-lint"
runs = "scope"
stage = "commit"
summary = "Runs the moderate ansible-lint profile beside each ansible.cfg or at the scope root."
why = "Playbooks run as root on production hosts, and a non-idempotent task changes them each time."

[[check]]
command = ["ansible-lint", "-c", "{config_file:ansible-lint}", "--offline", "--nocolor", "-f", "pep8", "--profile", "production"]
example = "A task with `ansible.builtin.command: systemctl restart nginx` reports `command-instead-of-module`. Use `ansible.builtin.systemd` with `name: nginx` and `state: restarted` instead."
files = { extensions = [".yml", ".yaml", ".cfg", ".j2"] }
help = "Change the task the way the rule says."
instead_of = "ansible/ansible-lint"
level = "all"
name = "ansible-lint-production"
runs = "scope"
stage = "commit"
summary = "Runs the production ansible-lint profile beside each ansible.cfg or at the scope root."
why = "Playbooks run as root on production hosts, and a non-idempotent task changes them each time."
