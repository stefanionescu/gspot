[configuration]
description = "OpenAPI documents: the committed document passes its lint rules and matches what its generator writes."
title = "OpenAPI"

[detect]
filenames = ["openapi.yaml", "openapi.yml", "openapi.json", "swagger.json", "swagger.yaml", "swagger.yml"]

[[tool]]
name = "spectral"
npm = "@stoplight/spectral-cli"
version = "6.17.0"

[[tool]]
name = "ajv"

[[config_file]]
target = "spectral.yml"
tool = "spectral"

[[check]]
command = ["spectral", "lint", "--ruleset", "{config_file:spectral}", "--format", "text", "{setting:openapi.document}"]
cwd = "root"
example = "An operation that references an undefined schema reports a finding. Define the schema or fix the reference in the source, then generate the document again."
files = { extensions = [".yaml", ".yml", ".json"] }
help = "Change the document the way the rule says, or the code that writes it."
name = "spectral"
output = { format = "regex", pattern = '^(?<file>.+):(?<line>\d+):(?<column>\d+) (?:error|warning) (?<rule>\S+) "(?<message>.*)"$' }
runs = "scope"
stage = "commit"
summary = "Lints the file in `openapi.document` with the Spectral OpenAPI rules."
when = { setting = "openapi.document" }
why = "Teams generate clients from this document, so an operation with no ID or an undefined response breaks them."

[[check]]
command = ["{setting:openapi.generate_command}"]
example = "A committed document that differs from the generator output reports drift. Run the generator, review the change, and commit it."
generator_outputs = [{ path = "{setting:openapi.document}" }]
help = "Run the command and commit the document it writes."
name = "stale-document"
runs = "scope"
stage = "push"
summary = "Runs `openapi.generate_command` and fails when the document changes."
when = { setting = "openapi.generate_command" }
why = "A committed document that lags the routes describes a service that does not exist."
