ignored_paths = ["**/.wrangler/**"]

allowed_words = ["Cloudflare"]
generated = ["worker-configuration.d.ts", "cloudflare-env.d.ts"]

[configuration]
description = "Cloudflare Pages and Workers: valid headers and redirects files and current binding types. Level all adds security rules for worker code."
requires = ["javascript"]
title = "Cloudflare"

[detect]
dependencies = ["wrangler", "@opennextjs/cloudflare"]
filenames = ["wrangler.toml", "wrangler.json", "wrangler.jsonc", "_worker.js"]
paths = ["**/functions/_middleware.{js,ts}"]

[files]
extensions = [".d.ts"]
filenames = ["wrangler.toml", "wrangler.json", "wrangler.jsonc", "_headers", "_redirects"]

[[tool]]
min_version = "3.78.3"
name = "wrangler"
npm = "wrangler"
system = true
version_command = ["--version"]

[[eslint.selectors]]
level = "all"
message = "A wildcard CORS origin lets every site read the response. List the allowed origins."
selector = ':matches(Property[key.value="Access-Control-Allow-Origin"][value.value="*"], CallExpression[callee.property.name=/^(?:set|append)$/][arguments.0.value="Access-Control-Allow-Origin"][arguments.1.value="*"])'

[[check]]
example = "An indented `X-Frame-Options: DENY` at the top of `_headers` reports a header with no path. Put a path such as `/*` on an unindented line above it."
files = { filenames = ["_headers"] }
help = "Write each block as a path, then indented lines of a name, a colon, and a value. Add each missing security header to the block for `/*`."
name = "headers"
runs = "scope"
stage = "commit"
summary = "Checks that `_headers` holds only blocks of a path followed by indented name-value lines, and that the `/*` block sets X-Content-Type-Options, Referrer-Policy, and X-Frame-Options or a CSP frame-ancestors."
why = "Cloudflare skips a line it cannot read, and a static site has no server code to set these protections, so a typo or a missing line silently drops a security header."
[[check]]
example = "The `_redirects` line `/old /new 999` reports an unsupported redirect status. For a permanent redirect, change it to `/old /new 301`."
files = { filenames = ["_redirects"] }
help = "Write the rule as source, destination, and status."
name = "redirects"
runs = "scope"
stage = "commit"
summary = "Checks each redirect source, destination, and optional status: 200, 301, 302, 303, 307, or 308, without a force suffix."
why = "Cloudflare drops a redirect it cannot parse, and the old address starts to answer 404."

[[check]]
command = ["wrangler", "types", "{file}", "--env-interface", "{setting:cloudflare.types_interface}"]
example = "A Worker types file that differs from the output of `wrangler types` reports drift. Run `wrangler types`, and commit the new file."
generator_outputs = [{ pattern = "**/{setting:cloudflare.types_file}" }]
help = "Run `wrangler types` and commit the file."
name = "stale-types"
runs = "scope"
stage = "push"
summary = "Checks that the environment types file, when the scope has one, is tracked and matches what wrangler writes."
why = "Stale binding types let code compile against a binding the configuration dropped."
