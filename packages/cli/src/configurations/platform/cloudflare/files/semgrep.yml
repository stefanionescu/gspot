rules:
    - id: gspot.cloudflare.wildcard-cors-origin
      pattern-either:
          - pattern: '"Access-Control-Allow-Origin": "*"'
          - pattern: "'Access-Control-Allow-Origin': '*'"
          - pattern: $HEADERS.set("Access-Control-Allow-Origin", "*")
          - pattern: $HEADERS.append("Access-Control-Allow-Origin", "*")
      message: >-
          A wildcard CORS origin lets every site read the response. List the allowed origins.
      languages:
          - javascript
          - typescript
      severity: ERROR
