allowed_words = ["Supabase"]

[configuration]
description = "A Supabase project: edge functions under Deno. Every storage bucket has a policy, and privileged keys stay in their allowed files."
requires = ["postgres", "javascript"]
suggests = ["typescript"]
title = "Supabase"

[detect]
project_files = ["supabase/config.toml"]

[files]
paths = ["supabase/config.toml", "{setting:supabase.functions_folder}/**", "supabase/seed.sql"]

[defaults]
"postgres.client_schemas" = ["public"]

[[naming.exception]]
allowed_names = ["shared"]
categories = ["folders"]
paths = ["**/supabase/functions/_shared/**"]
reason = "Supabase deploys every folder under functions/ except _shared, which holds the code the functions share."

[[tool]]
min_version = "2.0.0"
mise = { name = "deno", checksums = { "linux-x64" = "sha256:c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490", "linux-arm64" = "sha256:c832298b1ad4422481334855f6003e0f54145762c5a134f20a489511d2f65bbf", "macos-x64" = "sha256:95daaff11c116a52ad54785e7914c8e9c9cdcaba793c5ed929c74ca2d8e6259a", "macos-arm64" = "sha256:5cd46d6268f6f78f5d88bdc7159d20bd44cdaa4b3303474839f87ec6fe7ae25c", "windows-x64" = "sha256:a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238" } }
name = "deno"
version = "2.9.7"

[[tool]]
min_version = "2.0.0"
name = "supabase"
npm = "supabase"
system = true
version_command = ["--version"]

[[eslint.selectors]]
message = "An interpolated value enters raw PostgREST filter syntax. Escape it for the operator, or use a typed filter."
selector = 'CallExpression[callee.property.name="or"] > TemplateLiteral.arguments:first-child[expressions.length>0]'

[[eslint.selectors]]
message = "An interpolated value enters raw PostgREST filter syntax. Escape it for the operator, or use a typed filter."
selector = 'CallExpression[callee.property.name="filter"][arguments.1.value="in"] > TemplateLiteral.arguments:nth-child(3)[expressions.length>0]'

[[eslint.selectors]]
message = "An interpolated value enters raw PostgREST filter syntax. Escape it for the operator, or use a typed filter."
selector = 'CallExpression[callee.property.name="textSearch"]:not(:has(ObjectExpression > Property[key.name="type"][value.value=/^(?:plain|phrase|websearch)$/])) > TemplateLiteral.arguments:nth-child(2)[expressions.length>0]'

[[eslint.selectors]]
message = "Browsers refuse a wildcard origin on a request with credentials. List the allowed origins."
paths_setting = "supabase.functions_folder"
selector = 'ObjectExpression:has(> Property[key.value="Access-Control-Allow-Origin"][value.value="*"]):has(> Property[key.value="Access-Control-Allow-Credentials"][value.value="true"])'

[[check]]
example = "A storage bucket with no policy on `storage.objects` reports a finding. Add a migration that defines access for that bucket."
files = { filenames = ["config.toml"], extensions = [".sql"] }
help = "Add a policy on storage.objects for the bucket in a migration."
name = "storage-policies"
runs = "scope"
stage = "commit"
summary = "Checks that every storage bucket in the project file has a policy on storage.objects that names it."
why = "A bucket with no policy refuses every upload, and when public serves every file to anyone, and nobody recorded that choice."

[[check]]
example = "`verify_jwt = false` with no comment reports `verify-jwt`. Write `verify_jwt = false # A signed provider webhook.` on the line."
files = { filenames = ["config.toml"] }
help = "Give the reason in a comment on the same line, or set `verify_jwt = true`."
name = "verify-jwt"
runs = "scope"
stage = "commit"
summary = "Checks that each `verify_jwt = false` in the project file has a comment that says why."
why = "A function with `verify_jwt = false` takes requests from anyone, and the reason belongs beside the setting."

[[check]]
example = "Client code that reads a Supabase service-role key reports a finding. Move the key and the privileged work into an edge function."
files = { tags = ["javascript", "typescript", "vue", "svelte", "astro", "swift", "python"], extensions = [".kt", ".dart"] }
help = "Move code to edge functions or tests."
name = "service-role-key"
runs = "files"
stage = "commit"
summary = "Checks that only edge functions and test files name a secret or service role key."
why = "Secret and service role keys bypass row-level security, so a client bundle that holds either exposes privileged database access."

[[check]]
example = "An Edge Function declaring `var greeting = \"hello\";` reports `no-var`. Use `const greeting = \"hello\";` instead."
files = { extensions = [".ts"] }
help = "Change the code the way the rule says; `deno lint --rules` explains each one."
name = "deno-lint"
runs = "scope"
stage = "commit"
summary = "Runs `deno lint` over every edge function, with the function's deno.json when it has one."
tool = "deno"
why = "Edge functions run under Deno, and its linter covers runtime APIs that the Node rules miss."

[[check]]
example = "An edge function that assigns a string to a number variable reports a type error. Correct the value or the type."
help = "Fix the first error Deno prints; later ones often come from the same mistake."
name = "deno-check"
runs = "scope"
stage = "push"
summary = "Runs `deno check` on the entry file of every edge function."
tool = "deno"
why = "The project compiler cannot resolve the import map of a function, so only Deno can check its types."
needs = ["network"]
[[check]]
when = { setting = "supabase.types_file" }

command = ["supabase", "gen", "types", "typescript", "--local", "{each:--schema:supabase.schemas}"]
example = "A types file that differs from the local Supabase schema reports drift. With the local database running, write the output of `supabase gen types typescript --local` to that file."
generator_outputs = [{ stdout = "{setting:supabase.types_file}" }]
help = "Run `supabase gen types typescript --local` and write the output to the file."
name = "stale-types"
needs = ["docker"]
runs = "scope"
stage = "push"
summary = "Compares `supabase.types_file` with the output the Supabase CLI writes from the local database."
why = "Stale types let code compile against a column the database dropped."
