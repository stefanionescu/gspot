rules:
    - id: gspot.supabase.postgrest-filter-interpolation
      patterns:
          - pattern-either:
                - pattern: $CLIENT.or(`...${$VAR}...`, ...)
                - pattern: $CLIENT.filter($COLUMN, "in", `...${$VAR}...`, ...)
                - pattern: $CLIENT.textSearch($COLUMN, `...${$VAR}...`, ...)
          - pattern-not: '$CLIENT.textSearch(..., {..., type: "plain", ...})'
          - pattern-not: '$CLIENT.textSearch(..., {..., type: "phrase", ...})'
          - pattern-not: '$CLIENT.textSearch(..., {..., type: "websearch", ...})'
      message: An interpolated value enters raw PostgREST filter syntax. Escape it for
          the operator or use a typed filter.
      languages:
          - typescript
          - javascript
      severity: ERROR
      metadata:
          cwe:
              - CWE-20
          category: security
    - id: gspot.supabase.edge-cors-wildcard-with-credentials
      pattern: '{..., "Access-Control-Allow-Origin": "*", ...,
          "Access-Control-Allow-Credentials": "true", ...}'
      message: >-
          Browsers refuse a wildcard origin on a request with credentials. List the allowed origins.
      languages:
          - typescript
          - javascript
      severity: ERROR
      paths:
          include:
              - /supabase/functions/**
      metadata:
          cwe:
              - CWE-346
          category: security
    - id: gspot.supabase.edge-unvalidated-json-body
      patterns:
          - pattern: await req.json()
          - pattern-not-inside: $SCHEMA.parse(await req.json(), ...)
          - pattern-not-inside: $SCHEMA.safeParse(await req.json(), ...)
          - pattern-not-inside: $SCHEMA.parseAsync(await req.json(), ...)
          - pattern-not-inside: $SCHEMA.safeParseAsync(await req.json(), ...)
          - pattern-not-inside: |-
                const $BODY = await req.json()
                ...
                $SCHEMA.parse($BODY)
          - pattern-not-inside: |-
                const $BODY = await req.json()
                ...
                $SCHEMA.safeParse($BODY)
      message: >-
          The function reads the request body without a schema. Parse it with a schema, such as a Zod schema.
      languages:
          - typescript
          - javascript
      severity: ERROR
      paths:
          include:
              - /supabase/functions/**
      metadata:
          cwe:
              - CWE-20
          category: security
