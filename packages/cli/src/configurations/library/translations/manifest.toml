[configuration]
description = "Translated interfaces: next-intl message files that parse and hold every key of the base locale. Level all adds no literal text in components."
requires = ["javascript"]
title = "Translations"

[detect]
dependencies = ["next-intl", "react-i18next", "i18next", "react-intl", "@lingui/core"]

[rules."NEXT-INTL.md"]
dependencies = ["next-intl"]

[[tool]]
kind = "library"
name = "eslint-plugin-i18next"
npm = "eslint-plugin-i18next"
rule_prefix = "i18next"
version = "6.1.5"

[eslint]
required_tools = ["eslint-plugin-i18next"]
all_level_rules = ["i18next/no-literal-string"]

[[check]]
example = "When the base locale defines `welcome` and another lacks it, the check reports the missing key. Add the translation with the same placeholders."
help = "Correct the message, or add the missing key to the locale."
name = "messages"
runs = "scope"
stage = "push"
summary = "Checks the next-intl JSON/ICU files under `translations.messages_folder`: each message parses, none stays empty, and each locale holds all keys of the base, and holds no key the base lacks."
why = "next-intl loads one locale at a time, so only a comparison with the base finds a missing key."

[check.when]
dependencies = ["next-intl"]
setting = "translations.messages_folder"
