[configuration]
description = "pytest suites: test lint rules, and passing tests before every push. Level all adds a coverage minimum."
requires = ["python"]
title = "pytest"

[detect]
dependencies = ["pytest"]
filenames = ["conftest.py", "pytest.ini"]

[[naming.override]]
categories = ["functions", "methods"]
ignored_prefix = "^test_"
languages = ["python"]
paths = ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/conftest.py"]
reason = "The test runner finds a test by this prefix."

[[tool]]
install_help = "Run python -m pip install pytest."
min_version = "7.0.0"
name = "pytest"
suppression = { marker = "\\bpragma: ?no cover\\b", reason = "#[^#]*# ?(?<reason>\\S.*)", example = "if TYPE_CHECKING:  # pragma: no cover # reason: imports for type checkers only" }
system = true
version_pattern = "(\\d+\\.\\d+\\.\\d+)"

[[tool]]
install_help = "Install pytest-cov in the Python environment used by pytest."
kind = "library"
name = "pytest-cov"
system = true
version_command = ["pytest", "--version", "--version"]
version_pattern = "pytest-cov-(\\d+(?:\\.\\d+)+)"

[[config_file]]
per_scope = true
target = "coveragerc"
tool = "pytest-cov"
check = "pytest/coverage"

[ruff]
all = ["PT001", "PT002", "PT003", "PT006", "PT007", "PT018", "PT019", "PT022", "PT023", "PT026"]
basic = ["PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT020", "PT021", "PT024", "PT025", "PT027", "PT028", "PT030", "PT031"]

[[check]]
command = ["pytest", "-q", "--strict-markers", "--strict-config", "--cov", "--cov-config={config_file:coveragerc}", "--cov-fail-under={setting:coverage.lines}", "--no-header", "-p", "no:cacheprovider"]
coverage_arguments = ["--cov", "--cov-config", "--cov-fail-under"]
cwd = "scope"
example = "pytest-cov reports `FAIL Required test coverage of 90% not reached. Total coverage: 85%`. Add a Python test for the uncovered behavior."
exit_codes = [1, 5]
files = { extensions = [".py"] }
help = "Fix each failed test, and add tests for the code that the report marks uncovered. Lower `coverage.lines` only with a reason."
name = "coverage"
output = { format = "regex", pattern = "^(?:(?:FAILED|ERROR) (?<file>[^\\s:]+)(?:::\\S+)?(?: - .*)?|FAIL Required test coverage.*|(?:=+ )?no tests ran in .+?(?: =+)?)$" }
runs = "scope"
stage = "push"
summary = "Runs pytest with coverage, and fails on a failed test or when the covered lines fall under their minimum."
tool = ["pytest", "pytest-cov"]
why = "A coverage minimum keeps new code from arriving untested."
