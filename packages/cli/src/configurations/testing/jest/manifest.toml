[configuration]
description = "Jest suites: test lint rules, and passing tests before every push. Level all adds a coverage minimum."
requires = ["javascript"]
title = "Jest"

[detect]
dependencies = ["jest"]
filenames = ["jest.config.*"]

[files]
paths = ["{setting:test_files}", "**/jest.config.*"]

[[tool]]
name = "jest"
system = true

[[tool]]
kind = "library"
name = "eslint-plugin-jest"
npm = "eslint-plugin-jest"
rule_prefix = "jest"
version = "29.17.0"

[eslint]
required_tools = ["eslint-plugin-jest"]
all_level_rules = ["jest/prefer-strict-equal"]

[[check]]
command = ["jest", "--ci", "--rootDir={root}/{scope}", "--coverage", "--coverageReporters=text-summary", "--coverageThreshold={\"global\":{\"lines\":{setting:coverage.lines},\"branches\":{setting:coverage.branches},\"functions\":{setting:coverage.functions},\"statements\":{setting:coverage.statements}}}"]
coverage_arguments = ["--coverage", "--coverageReporters", "--coverageThreshold"]
cwd = "scope"
example = "Jest reports `coverage threshold for lines (90%) not met: 85%`. Add tests for the lines its report marks uncovered."
exit_codes = [1]
help = "Fix each failed test, and add tests for the code that the report marks uncovered. Lower a minimum under `coverage` only with a reason."
name = "coverage"
runs = "scope"
stage = "push"
summary = "Runs Jest with coverage, and fails on a failed test or when lines, branches, functions, or statements fall under their minimums."
why = "A coverage minimum keeps new code from arriving untested."

[check.files]
extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]

[check.output]
format = "regex"
pattern = "^(?:Jest: \"global\" |  (?=● ))(?<message>coverage threshold for .+ not met: .+|● .+)$"
