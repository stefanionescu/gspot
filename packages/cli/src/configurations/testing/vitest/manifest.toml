allowed_words = ["Vitest"]

[configuration]
description = "Vitest suites: test lint rules, and passing tests before every push. Level all adds a coverage minimum."
requires = ["javascript"]
title = "Vitest"

[detect]
filenames = ["vitest.config.*", "vitest.workspace.*"]
dependencies = ["vitest"]

[files]
paths = ["**/vitest.config.*", "**/vitest.workspace.*"]

[shared_prefixes]
prefixes = ["vitest"]

[[tool]]
min_version = "2.0.0"
name = "vitest"
npm = "vitest"
system = true

[tool.suppression]
marker = "\\b(?:v8|c8|istanbul) ignore\\b"
reason = "(?: -- |: )(?<reason>\\S.*)"
example = "/* v8 ignore next -- reason: only a full disk reaches this branch */"

[[tool]]
kind = "package"
name = "@vitest/eslint-plugin"
npm = "@vitest/eslint-plugin"
rule_prefix = "vitest"
version = "1.6.27"

[[tool]]
kind = "package"
name = "@vitest/coverage-v8"
npm = "@vitest/coverage-v8"
system = true

[eslint]
required_tools = ["@vitest/eslint-plugin"]
all_level_rules = ["vitest/prefer-strict-equal"]

[[check]]
command = ["vitest", "run", "--passWithNoTests", "--exclude", "**/.gspot-copies/**", "--coverage", "--coverage.reporter=text-summary", "--coverage.thresholds.lines={setting:coverage.min_line_percent}", "--coverage.thresholds.branches={setting:coverage.min_branch_percent}", "--coverage.thresholds.functions={setting:coverage.min_function_percent}", "--coverage.thresholds.statements={setting:coverage.min_statement_percent}"]
coverage_arguments = ["--coverage", "--coverage.reporter", "--coverage.thresholds.lines", "--coverage.thresholds.branches", "--coverage.thresholds.functions", "--coverage.thresholds.statements"]
cwd = "scope"
example = "Vitest reports `ERROR: Coverage for lines (85%) does not meet global threshold (90%)`. Add tests for the uncovered lines."
help = "Fix each failed test, and add tests for the code that the report marks uncovered. Lower a minimum under `coverage` only with a reason."
name = "tests"
runs = "scope"
stage = "push"
summary = "Runs Vitest with coverage, and fails on a failed test or when lines, branches, functions, or statements fall under their minimums."
tool = ["vitest", "@vitest/coverage-v8"]
why = "A coverage minimum keeps new code from arriving untested."

[check.files]
extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]

[check.output]
format = "regex"
pattern = "^(?:ERROR: (?=Coverage for )| FAIL  (?<file>\\S+) (?:> |(?=\\[)))(?<message>.+)$"
