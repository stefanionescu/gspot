allowed_words = ["Python", "Ruff"]
ignored_paths = ["**/.venv/**", "**/venv/**", "**/__pycache__/**", "**/.pytest_cache/**", "**/.ruff_cache/**", "**/.mypy_cache/**"]

[configuration]
description = "Python sources: lint, layout, strict types, docstrings that match their signatures, and no unused code or dependencies."
title = "Python"

[detect]
extensions = [".py"]
project_files = ["pyproject.toml", "requirements*.txt", "Pipfile"]
tags = ["shebang:python"]

[files]
extensions = [".py", ".pyi"]
filenames = ["pyproject.toml", "setup.cfg"]

[[naming.override]]
allowed_names = ["__init__", "__main__"]
categories = ["files"]
languages = ["python"]
paths = ["**/__init__.py", "**/__main__.py"]
reason = "Python names these files."

[[naming.override]]
allowed_names = ["setUp", "setUpClass", "tearDown", "tearDownClass"]
categories = ["methods"]
languages = ["python"]
paths = ["**"]
reason = "unittest discovers its lifecycle methods by these names."

[[naming.override]]
categories = ["functions", "methods", "variables", "constants", "attributes"]
ignored_names_pattern = "^__[a-z][a-z0-9_]*__$"
languages = ["python"]
paths = ["**"]
reason = "Python names its special methods and attributes with two underscores on each side."

[[naming.override]]
categories = ["functions", "variables", "constants", "methods", "attributes", "type_aliases"]
ignored_prefix = "^_+"
languages = ["python"]
paths = ["**"]
reason = "A leading underscore marks a private Python declaration."

[[tool]]
mise = { name = "uv", checksums = { "linux-x64" = "sha256:eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220", "linux-arm64" = "sha256:9041c73c99fdc5892cf128140beb354eca9231d502068cc36e6cb53a8e59ad14", "macos-x64" = "sha256:bb7b805bdcf3d0bc8c74ceb94569e6b3e8aa35bd492acdbb9d46bf46d9d4ff6b", "macos-arm64" = "sha256:cfe454573412ff7380d15fc7dae5997ab53ffce72fce0a78e91ddbc84001acd2", "windows-x64" = "sha256:3b2661a463a5baea7f5076ea2b25ab71d77f36a6c0d809e5350651792f80a672" } }
name = "uv"
version = "0.13.1"

[[tool]]
min_version = "0.9.0"
name = "ruff"
off = { always = ["W291", "W292", "W293", "W391", "COM812", "COM819", "D203", "D206", "D213", "D300", "D417", "I002", "N806", "N815", "N816", "N999", "ISC001", "ISC002", "Q000", "Q001", "Q002", "Q003", "RUF023", "W191"] }
pypi = "ruff"
replace = ["ruff.toml", ".ruff.toml"]
rule_url = "https://docs.astral.sh/ruff/rules/{rule}/"
suppression = { inline_marker = "#\\s*[nN][oO][qQ][aA](?=\\s|:|$)", marker = "#\\s*(?:(?:ruff|flake8):\\s*)?[nN][oO][qQ][aA](?=\\s|:|$)(?::(?<rules>[^#]*))?", reason = "#\\s*(?:(?:ruff|flake8):\\s*)?[nN][oO][qQ][aA](?=\\s|:|$)[^#]*# ?(?<reason>\\S.*)", example = "import plugins  # noqa: F401 # reason: the module registers its plugins on import", separator = "#", all_rules = "^$", limit_rules = "(?:^|[\\s,])(?:C901|PLR0911|PLR0912|PLR0913|PLR0915)(?=$|[\\s,])" }
version = "0.17.1"

[[tool.replace_key]]
file = "pyproject.toml"
table = "tool.ruff"

[[tool]]
interpreter_flag = "--pythonpath"
min_version = "1.20.0"
name = "basedpyright"
npm = "basedpyright"
replace = ["pyrightconfig.json"]
suppression = { marker = "\\b(?:type|pyright): ?ignore\\b", reason = "#[^#]*# ?(?<reason>\\S.*)", example = "value = payload['key']  # type: ignore[index] # reason: the payload is checked above" }
version = "1.40.2"

[[tool.replace_key]]
file = "pyproject.toml"
table = "tool.basedpyright"

[[tool.replace_key]]
file = "pyproject.toml"
table = "tool.pyright"

[[tool]]
name = "pydoclint"
pypi = "pydoclint"
version = "0.11.1"

[[tool]]
min_version = "0.20.0"
name = "deptry"
pypi = "deptry"
version = "0.25.1"

[[tool]]
name = "vulture"
pypi = "vulture"
version = "2.16"

[[tool.when]]
level = "all"

