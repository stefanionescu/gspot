allowed_words = ["Bash", "ShellCheck"]

[configuration]
description = "Shell scripts, hooks, and task files: lint, formatting, syntax, and the structure rules for shell."
title = "Shell scripts"

[files]
extensions = [".sh", ".bash", ".zsh", ".bats"]
tags = ["shebang:shell"]

[[naming.override]]
allowed_names = ["IFS", "OPTARG", "OPTIND", "EUID", "UID", "PPID", "RANDOM", "SECONDS", "LINENO", "BASH_SOURCE", "BASH_REMATCH", "BASH_VERSION", "BASH_VERSINFO", "FUNCNAME", "PIPESTATUS", "REPLY", "CDPATH", "OLDPWD", "SHLVL", "HOSTNAME", "OSTYPE", "MACHTYPE", "COLUMNS", "LINES"]
categories = ["variables"]
languages = ["bash"]
paths = ["**"]
reason = "The shell defines these variable names."

[[naming.override]]
categories = ["functions", "variables", "constants", "methods", "attributes"]
ignored_prefix = "^_+"
languages = ["bash"]
paths = ["**"]
reason = "A leading underscore marks a private shell declaration."

[[tool]]
mise = { name = "shellcheck", checksums = { "linux-x64" = "sha256:8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198", "linux-arm64" = "sha256:12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588", "macos-x64" = "sha256:3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6", "macos-arm64" = "sha256:56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79", "windows-x64" = "sha256:8a4e35ab0b331c85d73567b12f2a444df187f483e5079ceffa6bda1faa2e740e" } }
name = "shellcheck"
replace = [".shellcheckrc"]
rule_url = "https://www.shellcheck.net/wiki/{rule}"
suppression = { marker = "\\bshellcheck +disable=", reason = "# ?reason: (?<reason>\\S.*)", example = "# shellcheck disable=SC2086 # reason: the word splitting is wanted here" }
version = "0.11.0"

[[tool]]
mise = { name = "shfmt", checksums = { "linux-x64" = "sha256:76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf", "linux-arm64" = "sha256:5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489", "macos-x64" = "sha256:d33eee0da0f92835b3562e9767a05cee7e4eaeef47daa03bfd09da17b4b590a6", "macos-arm64" = "sha256:b7c872db63553ccffc7253aba3ed7d4885a27d83f1ba567b1138c6315a5847e5", "windows-x64" = "sha256:13629ce28442ca80b6b5a819f7574ab39e1c28c6e26734ca816c9714e04851df" } }
name = "shfmt"
version = "3.14.1"

[[tool]]
name = "zsh"
system = true

[[config_file]]
per_scope = true
target = "shellcheckrc"
tool = "shellcheck"

[[config_file]]
per_scope = true
target = "semgrep.yml"
tool = "semgrep"

[[check]]
command = ["zsh", "-n", "{file}"]
example = "A Zsh script whose `if` block has no closing `fi` reports a parse error at the end of the file. Close the block with `fi`."
files = { tags = ["zsh"] }
help = "Fix the syntax at the line Zsh reports. Install zsh when the system lacks it."
name = "zsh-syntax"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):\\s*(?<message>.*)$" }
stage = "commit"
summary = "Checks the syntax of Zsh scripts with `zsh -n`."
why = "Zsh syntax differs from Bash, so a Bash parser rejects valid Zsh programs."

[[check]]
command = ["shellcheck", "--rcfile", "{config_file:shellcheckrc}", "--severity=style", "--check-sourced", "--format=gcc", "{files}"]
example = "In a Bash script, `printf \"%s\\n\" $name` reports SC2086 because the expansion permits word splitting and globbing. Use `printf \"%s\\n\" \"$name\"` to pass the value as one argument."
exit_codes = [1]
files = { tags = ["bash", "sh", "bats"] }
help = "Read the SC code in the finding; `gspot explain shellcheck/SC2086` links to its page."
name = "shellcheck"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?:note|warning|error|style): (?<message>.*?) \\[(?<rule>SC\\d+)\\]$" }
stage = "commit"
summary = "Runs ShellCheck over shell scripts and sourced files, with its stable optional rules at level all."
why = "ShellCheck catches the quoting, globbing, and exit-status mistakes that make a script fail on the one input nobody tested."

[[check]]
command = ["shfmt", "-d", "-i", "{indent}", "-ci", "-s", "{files}"]
example = "`if true;then echo hello;fi` differs from the shfmt output. Run `gspot check --fix` to add the spacing and line breaks."
files = { tags = ["bash", "sh", "bats"] }
fix = ["shfmt", "-w", "-i", "{indent}", "-ci", "-s", "{files}"]
help = "Run `gspot check --fix` to format every script, or `shfmt -w` on one file."
name = "shfmt"
output = { format = "regex", pattern = "^(?:--- )?(?<file>.+?)(?:\\.orig$|:(?<line>\\d+):(?<column>\\d+): (?<message>.+)$)", message = "This script is not formatted the way shfmt formats it.", fixable = "^--- " }
stage = "commit"
summary = "Checks that every shell script matches the shfmt output."
why = "One formatter means diffs show what changed, not how someone's editor indents."

[[check]]
example = "An executable Bash script without `set -euo pipefail` reports a finding. Put that line before the first command, and when the script defines functions, call `main` last."
help = "Open with the shebang and run `set -euo pipefail` first. When an executable defines functions, end it with a call to main."
level = "all"
name = "script-layout"
stage = "commit"
summary = "Checks each Bash script for a shebang, strict mode, a final `main` call when it defines functions, declarative libraries, and removed temporary files."
why = "A script that skips strict mode or hides its runtime fails silently on the machine that matters."

[[check]]
example = "`_quiet() { printf \"%s\\n\" \"Hello\"; }` with no comment above it reports a finding. Add `# _quiet: prints a greeting.` on the line above."
help = "Write \"# name: what it does\" above the function, and an \"# Arguments:\" section when a public function reads arguments; keep Globals, Arguments, Outputs, and Returns in that order."
level = "all"
name = "doc-comments"
stage = "commit"
summary = "Checks that each shell function has a comment above it that says more than its name, and that a public function that reads arguments lists them in an `Arguments` section."
why = "Without a summary, the reader must trace the function in their head, and nobody trusts a vague one."

[[check]]
example = "A private function `_orphan` that no script calls reports a finding. Delete it, or record a hook that needs it with `gspot ignore` and a reason."
help = "Delete the function."
name = "unused-functions"
runs = "scope"
stage = "commit"
summary = "Finds shell functions no script in the scope calls."
why = "A function that nothing calls still costs reading and upkeep, and it hides which code runs."

[[check]]
example = "`_deaf one two` reports dead parameters when `_deaf` never reads its arguments. Drop them from the call, or use them in the function."
help = "Read the argument in the function, or drop it from every call."
name = "unread-arguments"
runs = "scope"
stage = "commit"
summary = "Finds shell functions called with arguments they never read."
why = "An unread argument misleads the caller, who expects it to change the result."

[[check]]
example = "A function over `limits.bash.max_function_lines` reports `function-lines` with the count and the limit. Split it by job."
help = "Split the script or the function, or raise the named limits.bash setting with a reason."
level = "all"
limits = ["max_function_lines", "max_function_branches", "max_block_nesting", "max_function_assignments"]
limit_languages = ["bash"]
name = "function-size"
stage = "commit"
summary = "Checks every shell function against the size ceilings: code lines, branches, nesting, and assignments."
why = "A long script holds more than one job, and many branches or assignments hide several functions under one name."

[[check]]
example = "A shell heredoc containing a Python program reports embedded code. Move the program into a `.py` file and invoke that file from the shell script."
help = "Move the embedded code into its own file and run that."
level = "all"
name = "inline-scripts"
stage = "commit"
summary = "Finds inline Python and Node code, and heredocs piped into an interpreter, in shell scripts."
why = "No check reads code inside a heredoc."

[[check]]
example = "`killall worker` reports `broad-kill`. Stop the one process by its ID, or ignore the rule for that script with a reason."
help = "Stop one process by its ID, delete only paths the script created, handle each failure, and write the form that the message names."
name = "safety"
stage = "commit"
summary = "Finds broad process kills, recursive deletes outside traps that remove mktemp paths, and the syntax that BASH.md forbids: `function`, `typeset`, `&>`, `|&`, brace `for`, `echo`, `bash -lc`, GNU `timeout`, and `curl` without `--fail`. At level all, also reports discarded failures, `set -x`, `seq` loops, and a script-level or saved `IFS`."
why = "Each of these lets a script silently destroy something by mistake."
