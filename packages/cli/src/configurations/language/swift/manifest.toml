allowed_words = ["Swift", "SwiftLint", "SwiftFormat", "Periphery"]
ignored_paths = [".build", "DerivedData", "**/.build/**", "**/DerivedData/**", "**/Pods/**"]

[configuration]
description = "Swift sources and their XCTest and Swift Testing tests: lint and analyzer rules for each level, one format, a clean build, no unused code, a reason on each disabled test, and passing tests, with a coverage minimum at level all."
title = "Swift"

[detect]
extensions = [".swift"]
project_files = ["Package.swift"]

[files]
extensions = [".swift"]
filenames = ["Package.swift", "Package.resolved", "*.xctestplan"]

[defaults]
"ci.operating_systems" = ["linux", "macos"]

[rules]
"SWIFTUI.md" = { tags = ["swift-import:SwiftUI"] }
"SWIFT-TESTS.md" = { tags = ["swift-test", "swift-test-target"] }
"UIKIT.md" = { tags = ["swift-import:UIKit"] }

[[tool]]
builds = ["macos", "linux"]
min_version = "0.57.0"
mise = { name = "swiftlint", checksums = { "linux-x64" = "sha256:caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d", "linux-arm64" = "sha256:9ffa52f478e6d8eb485d37d14715ffac90abc81c58f3370d598bf75be05605f8", "macos-x64" = "sha256:c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0", "macos-arm64" = "sha256:c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0" } }
name = "swiftlint"
off = { always = ["redundant_discardable_let", "duplicate_imports", "unneeded_break_in_switch", "empty_parentheses_with_trailing_closure", "convenience_type", "pattern_matching_keywords", "direct_return", "syntactic_sugar", "redundant_string_enum_value", "unneeded_synthesized_initializer", "yoda_condition", "prefer_key_path", "redundant_type_annotation", "explicit_init", "shorthand_optional_binding", "trailing_whitespace", "opening_brace", "statement_position", "control_statement", "implicit_getter", "implicit_optional_initialization", "closing_brace", "colon", "comma", "redundant_void_return", "return_arrow_whitespace", "trailing_comma", "trailing_newline", "trailing_semicolon", "vertical_whitespace", "void_return"], basic = ["closure_body_length", "max_cyclomatic_complexity", "discouraged_direct_init", "enum_case_associated_values_count", "explicit_acl", "file_length", "file_name_no_space", "file_types_order", "final_test_case", "function_body_length", "function_default_parameter_at_end", "function_parameter_count", "identifier_name", "implicitly_unwrapped_optional", "local_doc_comment", "nesting", "no_empty_block", "no_extension_access_modifier", "no_magic_numbers", "period_spacing", "private_action", "private_outlet", "private_over_fileprivate", "test_case_accessibility", "trailing_closure", "type_body_length", "type_contents_order", "type_name", "unavailable_function", "unowned_variable_capture"] }
replace = [".swiftlint.yml", ".swiftlint.yaml"]
rule_url = "https://realm.github.io/SwiftLint/{rule}.html"
suppression = { marker = "\\bswiftlint:disable\\b(?::(?:next|this|previous))?(?<rules>.*)", reason = " - (?<reason>\\S.*)", example = "// swiftlint:disable:next force_unwrapping - reason: the URL is a literal", separator = "\\s-\\s", all_rules = "^all(?=$|\\s)", limit_rules = "(?:^|[\\s,])(?:max_cyclomatic_complexity|function_body_length|file_length|type_body_length|function_parameter_count)(?=$|[\\s,])" }
version = "0.65.1"

[[tool]]
builds = ["macos", "linux"]
min_version = "0.54.0"
name = "swiftformat"
off = { always = ["trailingClosures", "initCoderUnavailable", "redundantInternal", "redundantPublic"], basic = ["hoistPatternLet", "modifierOrder", "redundantClosure", "redundantExtensionACL", "redundantFileprivate", "redundantGet", "redundantInit", "redundantLet", "redundantLetError", "redundantNilInit", "redundantObjc", "redundantRawValues", "redundantReturn", "strongOutlets", "strongifiedSelf", "typeSugar", "void", "redundantSelf", "wrapEnumCases", "andOperator", "anyObjectProtocol", "applicationMain", "assertionFailures", "conditionalAssignment", "consistentSwitchCaseSpacing", "docCommentsBeforeModifiers", "emptyExtensions", "enumNamespaces", "environmentEntry", "extensionAccessControl", "fileHeader", "fileMacro", "genericExtensions", "headerFileName", "hoistAwait", "hoistTry", "modifiersOnSameLine", "noForceTryInTests", "noForceUnwrapInTests", "opaqueGenericParameters", "preferForLoop", "preferKeyPath", "redundantAsync", "redundantEmptyView", "redundantEquatable", "redundantMemberwiseInit", "redundantOptionalBinding", "redundantSendable", "redundantStaticSelf", "redundantSwiftTestingSuite", "redundantThrows", "redundantType", "redundantTypedThrows", "redundantVariable", "redundantViewBuilder", "simplifyGenericConstraints", "sortTypealiases", "swiftTestingTestCaseNames", "wrapFunctionBodies", "wrapPropertyBodies", "wrapSingleLineComments", "yodaConditions"] }
replace = [".swiftformat"]
suppression = { marker = "\\bswiftformat:disable\\b", reason = " - (?<reason>\\S.*)", example = "// swiftformat:disable:next redundantSelf - reason: the closure needs self" }
version = "0.64.0"
mise = { name = "swiftformat", options = { no_app = true, rename_exe = "swiftformat" }, checksums = { "linux-x64" = "sha256:599eb5d2d8cf43e1128e79cd72f3bc2fec1b3189c3ac7593fbe732f2568fed36", "linux-arm64" = "sha256:6b53c985b3849be0c9544bf93a378c12aaa761a7225f05f0b9948f827dd7db52", "macos-x64" = "sha256:95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98", "macos-arm64" = "sha256:95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98", "windows-x64" = "sha256:95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98" } }

[[tool]]
builds = ["macos"]
min_version = "3.0.0"
mise = { name = "periphery", checksums = { "macos-x64" = "sha256:07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7", "macos-arm64" = "sha256:07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7" } }
name = "periphery"
replace = [".periphery.yml", ".periphery.yaml"]
suppression = { marker = "\\bperiphery:ignore\\b", reason = " - (?<reason>\\S.*)", example = "// periphery:ignore - reason: the runtime calls it by name" }
version = "3.8.0"
version_command = ["version"]

[[tool]]
name = "swift"
system = true

[[tool]]
install_help = "Install Xcode from the App Store."
name = "xcodebuild"
system = true
when = [{ setting = "swift.xcode_project" }]

[[config_file]]
per_scope = true
pointer = { path = ".swiftlint.yml", body = "parent_config: {target_json}\n" }
target = "swiftlint.yml"
tool = "swiftlint"

[[config_file]]
per_scope = true
pointer = { path = ".swiftlint.yml", folders = ["**/*Tests"], body = "parent_config: {target_json}\ndisabled_rules:\n    - force_unwrapping\n    - no_magic_numbers\n" }
target = "swiftlint.yml"
tool = "swiftlint"

[[config_file]]
per_scope = true
target = "swiftformat"
tool = "swiftformat"

[[config_file]]
per_scope = true
target = "periphery.yml"
tool = "periphery"

[[check]]
command = ["swiftlint", "lint", "--strict", "--quiet", "--no-cache", "--reporter", "json", "{files}"]
cwd = "scope"
example = "`value as! NSString` reports `force_cast`. Use `as?` and handle the failure, or change the input type so no cast remains."
files = { extensions = [".swift"] }
fix = ["swiftlint", "lint", "--fix", "--quiet", "--no-cache", "{files}"]
help = "Run the `fix:` command that the report prints for the rules that fix themselves."
limits = { "file_length" = "max_file_lines", "function_parameter_count" = "max_function_parameters", "function_body_length" = "max_function_lines", "type_body_length" = "max_type_lines", "closure_body_length" = "max_closure_lines", "max_cyclomatic_complexity" = "max_cyclomatic_complexity" }
limit_languages = ["swift"]
name = "swiftlint"
output = { format = "json", fields = { file = "file", line = "line", column = "character", rule = "rule_id", message = "reason" } }
stage = "commit"
summary = "Lints Swift files with the SwiftLint files of each scope and nested folder, and treats warnings as errors."
why = "Forced casts and tries can crash, and a strong delegate can keep its owner alive."

[[check]]
command = ["swiftformat", "--lint", "--config", "{config_file:swiftformat}", "{files}"]
example = "`func   greeting` reports `consecutiveSpaces`. Run `gspot check --fix` to get `func greeting`."
exit_codes = [1]
files = { extensions = [".swift"] }
fix = ["swiftformat", "--quiet", "--config", "{config_file:swiftformat}", "{files}"]
help = "Run the `fix:` command that the report prints."
name = "swiftformat"
output = { format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+):(?<column>\\d+): (?:error|warning): \\((?<rule>\\w+)\\) (?<message>.*)$" }
stage = "commit"
summary = "Checks the layout of every Swift file against the shipped SwiftFormat rules."
why = "One layout everywhere keeps a diff about the change and not about where a brace went."

[[check]]
example = "Assigning a string to an `Int` variable fails the build. Correct the value or the type."
help = "Fix the first compiler error; later ones often come from the same mistake."
name = "build"
needs = ["build", "network"]
operating_systems = ["macos", "linux"]
runs = "scope"
stage = "push"
summary = "Builds the package or Xcode scheme once per scope, with warnings as errors, and reports the compiler errors."
tool = ["swift", "xcodebuild"]
why = "Swift checks types only during a build."

[[check]]
example = "An import that no compiled Swift source uses reports a finding. Remove the import."
help = "Remove what the rule names. List an import that the analyzer flags in error under `swift.allowed_unused_imports`."
name = "swiftlint-analyze"
needs = ["build", "network"]
operating_systems = ["macos"]
runs = "scope"
stage = "manual"
summary = "Runs the SwiftLint analyzer rules over the compiler log of the build: unused imports and captured variables."
tool = "swiftlint"
why = "An unused import slows the build and hides the real dependencies, and a captured variable can keep an object alive or read a stale value."

[[check]]
example = "A declaration that nothing references reports unused code. Delete it, and rebuild."
help = "Delete the declaration, or mark it with a periphery:ignore comment that says who uses it."
name = "periphery"
needs = ["build", "network"]
runs = "scope"
stage = "push"
summary = "Scans the built project for declarations nothing uses."
tool = "periphery"
why = "People read, maintain, and migrate dead code without knowing that nothing uses it."

[[check]]
example = "`throw XCTSkip()` in a Swift test reports a missing reason. Restore the test, or give a reason such as `throw XCTSkip(\"Requires the hardware test device\")`."
files = { tags = ["swift-test"] }
help = "Write why the test stays off and what turns it on again, or delete it."
name = "skip-reasons"
stage = "commit"
summary = "Checks that skip calls and disabled traits name a nonempty reason, and unavailable tests carry an explanation."
why = "A skipped test with no reason stays off, because nobody can tell when to restore it."

[[check]]
example = "`UserDefaults.standard.set(value, forKey: \"accessToken\")` reports `secret-in-userdefaults`. Store the token in the Keychain."
files = { extensions = [".swift"] }
help = "Change the code the way the message says."
name = "security"
stage = "commit"
summary = "Finds always-accessible Keychain items, MD5 and SHA-1 hashes, and each secret in UserDefaults, a plist read, or a log."
why = "A secret in plain storage or a log outlives the app that wrote it, and a broken hash protects nothing."

[[check]]
example = "A Swift target reports 85% line coverage against a 90% minimum. Add a test that exercises its uncovered lines, then rerun the target."
files = { extensions = [".swift"] }
help = "Add tests for the target, or lower its minimum with a reason."
name = "tests"
needs = ["build", "network"]
operating_systems = ["macos", "linux"]
runs = "scope"
stage = "push"
summary = "Measures each source target in Xcode projects and Swift packages against `coverage.min_line_percent` and its `coverage.swift_target` minimum."
when = { tags = ["swift-test", "swift-test-target"] }
why = "A coverage minimum for each target exposes Swift code that no test runs."
