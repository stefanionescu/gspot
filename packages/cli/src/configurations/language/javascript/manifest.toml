allowed_words = ["JavaScript", "ESLint"]
ignored_paths = ["**/node_modules/**", "**/bower_components/**"]

[configuration]
description = "JavaScript files: the shipped lint rules, type checks through JSDoc, and no unused code."
title = "JavaScript"

[detect]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
project_files = ["package.json"]
tags = ["shebang:node"]

[files]
eslint_plugins = true
extensions = [".js", ".jsx", ".mjs", ".cjs"]
tags = ["shebang:node"]

[shared_prefixes]
prefixes = ["jsconfig", "eslint", "playwright"]

[rules."PLAYWRIGHT.md"]
dependencies = ["@playwright/test", "playwright"]

[rules."NODE.md"]
absent_dependencies = ["react-native", "expo"]
runtimes = ["node"]

[rules."DENO.md"]
filenames = ["deno.json", "deno.jsonc", "**/supabase/config.toml"]
runtimes = ["deno"]

[rules."COMPONENTS.md"]
dependencies = ["astro", "svelte", "vue", "react"]

[rules."BUN.md"]
filenames = ["bun.lock", "bun.lockb", "bunfig.toml"]

[[naming.exception]]
categories = ["parameters", "variables"]
ignored_prefix = "^_+"
languages = ["typescript", "javascript"]
paths = ["**"]
reason = "A leading underscore marks an unused parameter or variable."

[[naming.exception]]
categories = ["functions", "methods"]
ignored_prefix = "^handle(?=[A-Z])"
languages = ["typescript", "javascript"]
paths = ["**/*.{tsx,jsx,vue,svelte,astro}"]
reason = "A handler starts with handle and then names the event."

[[tool]]
crash_pattern = "^(?:Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:)"
finding_header_pattern = "^(?:Oops!|ESLint: )"
name = "eslint"
npm = "eslint"
replace = ["eslint.config.js", "eslint.config.mjs", "eslint.config.cjs", "eslint.config.ts", "eslint.config.mts", "eslint.config.cts", ".eslintrc", ".eslintrc.js", ".eslintrc.cjs", ".eslintrc.json", ".eslintrc.yml", ".eslintrc.yaml", ".eslintignore"]
rule_url = "https://eslint.org/docs/latest/rules/{rule}"
version = "10.13.0"


[tool.suppression]
marker = "^(?:/\\*\\s*eslint-disable(?:-next-line|-line)?|//\\s*eslint-disable-(?:next-)?line)(?=\\s|$)(?<rules>[\\s\\S]*)"
reason = " -- (?<reason>\\S.*)"
example = "// eslint-disable-next-line no-console -- reason: the command prints its result"
separator = "\\s--"
all_rules = "^$"
limit_rules = "(?:^|[\\s,])(?:complexity|max-lines|max-lines-per-function|max-statements|max-params|max-depth|max-nested-callbacks)(?=$|[\\s,])"

[[tool.replace_key]]
file = "package.json"
key = "eslintConfig"

[[tool]]
name = "biome"
npm = "@biomejs/biome"
version = "2.6.3"
rule_prefix = "lint/complexity"
rule_url = "https://biomejs.dev/linter/rules/no-excessive-cognitive-complexity/javascript/#{rule}"

[tool.suppression]
marker = "^(?://|/\\*|<!--)\\s*biome-ignore(?:-all|-start|-end)?(?=\\s|$)"
reason = ":\\s*(?<reason>\\S.*)"
example = "// biome-ignore lint/complexity/noExcessiveCognitiveComplexity: reason"
forbidden = true

[[tool.when]]
level = "all"

[[tool]]
kind = "package"
name = "@eslint/js"
npm = "@eslint/js"
version = "10.0.1"

[[tool]]
kind = "package"
name = "@gspothq/eslint-plugin"
npm = "@gspothq/eslint-plugin"
version = "0.2.4"
rule_prefix = "gspot"

[[tool]]
kind = "package"
name = "eslint-plugin-unicorn"
npm = "eslint-plugin-unicorn"
rule_prefix = "unicorn"
rule_url = "https://github.com/sindresorhus/eslint-plugin-unicorn/blob/main/docs/rules/{rule}.md"
version = "78.0.0"

[[tool]]
kind = "package"
name = "eslint-plugin-security"
npm = "eslint-plugin-security"
rule_prefix = "security"
version = "4.2.0"

[[tool]]
kind = "package"
name = "eslint-plugin-perfectionist"
npm = "eslint-plugin-perfectionist"
rule_prefix = "perfectionist"
version = "5.12.1"

[[tool]]
kind = "package"
name = "eslint-plugin-n"
npm = "eslint-plugin-n"
rule_prefix = "n"
version = "18.4.1"

[[tool]]
kind = "package"
name = "eslint-plugin-jsdoc"
npm = "eslint-plugin-jsdoc"
rule_prefix = "jsdoc"
version = "65.3.11"

[[tool]]
kind = "package"
name = "eslint-plugin-regexp"
npm = "eslint-plugin-regexp"
rule_prefix = "regexp"
version = "3.3.1"

[[tool]]
kind = "package"
name = "eslint-plugin-import-x"
npm = "eslint-plugin-import-x"
rule_prefix = "import-x"
version = "4.17.1"

[[tool]]
kind = "package"
name = "eslint-import-resolver-typescript"
npm = "eslint-import-resolver-typescript"
version = "4.4.5"

[[tool]]
kind = "package"
name = "eslint-plugin-boundaries"
npm = "eslint-plugin-boundaries"
rule_prefix = "boundaries"
version = "7.2.1"

[[tool.when]]
setting = "import_rule"

[[tool.when]]
level = "all"

[[tool.when]]
setting = "trpc.server_files"

[[tool]]
kind = "package"
name = "eslint-plugin-package-json"
npm = "eslint-plugin-package-json"
rule_prefix = "package-json"
version = "1.10.1"

[[tool]]
kind = "package"
name = "eslint-config-prettier"
npm = "eslint-config-prettier"
version = "10.1.8"

[[tool]]
kind = "package"
name = "globals"
npm = "globals"
version = "17.13.0"

[[tool]]
name = "knip"
npm = "knip"
replace = ["knip.json", "knip.jsonc", ".knip.json", ".knip.jsonc", "knip.ts", "knip.js", "knip.config.js", "knip.config.ts"]
version = "6.41.0"

[[tool]]
name = "tsc"
npm = "typescript"
output = { format = "regex", pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$" }
system = true
version = "5.9.3"
version_command = ["--version"]

[tool.suppression]
marker = "@ts-(?:ignore|expect-error|nocheck)\\b"
reason = "@ts-(?:ignore|expect-error|nocheck):?\\s+(?<reason>\\S.*)"
example = "// @ts-expect-error reason: the library types omit this overload"

[eslint]
required_tools = ["@eslint/js", "@gspothq/eslint-plugin", "eslint-plugin-unicorn", "eslint-plugin-security", "eslint-plugin-perfectionist", "eslint-plugin-n", "eslint-plugin-jsdoc", "eslint-plugin-regexp", "eslint-plugin-import-x", "eslint-import-resolver-typescript", "eslint-plugin-boundaries", "eslint-plugin-package-json", "eslint-config-prettier", "globals"]
all_level_rules = ["no-labels", "gspot/no-identical-functions", "no-new", "no-nested-ternary", "default-case-last", "import-x/first", "import-x/newline-after-import", "perfectionist/sort-imports", "perfectionist/sort-named-imports", "perfectionist/sort-exports", "perfectionist/sort-named-exports", "complexity", "jsdoc/no-types", "jsdoc/require-description", "jsdoc/require-jsdoc", "jsdoc/match-name", "jsdoc/informative-docs", "jsdoc/tag-lines", "max-depth", "max-lines", "max-lines-per-function", "max-nested-callbacks", "max-params", "max-statements", "n/no-process-exit", "n/prefer-global/buffer", "n/prefer-global/console", "n/prefer-global/process", "n/prefer-global/url", "n/prefer-global/url-search-params", "n/prefer-promises/dns", "n/prefer-promises/fs", "no-param-reassign", "package-json/repository-shorthand", "package-json/require-attribution", "package-json/require-description", "package-json/require-exports", "package-json/require-name", "package-json/require-repository", "package-json/require-sideEffects", "package-json/require-version", "package-json/sort-collections", "unicorn/no-process-exit", "package-json/require-packageManager", "import-x/no-default-export", "import-x/no-mutable-exports", "import-x/no-relative-packages", "package-json/scripts-name-casing", "unicorn/consistent-boolean-name", "unicorn/no-for-each", "unicorn/no-negated-condition", "unicorn/prefer-at", "unicorn/prefer-default-parameters", "unicorn/prefer-event-target", "unicorn/prefer-number-properties"]

[[eslint.client_environment]]
dependencies = ["vite"]
files = ["src/**/*.{js,jsx,ts,tsx,vue,svelte}", "!src/**/+server.*", "!src/**/*.server.*", "!src/lib/server/**"]
public_prefixes = ["VITE_"]

[[eslint.rules_off]]
files = ["**/*.config.*"]
reason = "A tool reads the default export of its config file, which the file builds when it loads."
rules = ["import-x/no-default-export", "unicorn/no-top-level-side-effects"]

[[config_file]]
target = "eslint/eslint.mjs"
tool = "eslint"

[config_file.pointer]
body = "export { default } from {target_module};\n"
note = "Run gspot install before you use ESLint in your editor."
path = "eslint.config.mjs"

[[config_file]]
check = "javascript/tsc"
per_scope = true
target = "jsconfig.json"
tool = "tsc"

[[config_file]]
target = "biome.json"
per_scope = true
tool = "biome"
check = "javascript/biome"

[[config_file]]
target = "knip.json"
tool = "knip"

[[config_file]]
source = "eslint-functions.ts"
target = "eslint/functions.mjs"
tool = "eslint"

[[config_file]]
target = "eslint/import-cycles.mjs"
tool = "eslint"

[[check]]
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{config_file:eslint}", "--format", "json", "{files}"]
example = "The declaration `const unused = 1;` reports no-unused-vars. Delete the variable."
exit_codes = [1]
fix = ["eslint", "--fix", "--config", "{config_file:eslint}", "{files}"]
help = "Run the `fix:` command that the report prints for the rules that fix themselves, then read each remaining line; `gspot explain javascript/eslint <rule>` links the rule documentation."
limits = { "max-lines" = "max_file_lines", "max-lines-per-function" = "max_function_lines", "max-params" = "max_function_parameters", "max-statements" = "max_function_statements", "max-depth" = "max_block_nesting", "max-nested-callbacks" = "max_callback_nesting", "complexity" = "max_cyclomatic_complexity", "gspot/no-trivial-files" = "max_index_exports", "gspot/no-trivial-functions" = "min_function_statements" }
limit_languages = ["javascript", "typescript"]
name = "eslint"
needs = ["dependencies"]
stage = "commit"
summary = "Runs the shipped ESLint rules on JavaScript, TypeScript, component files, and package.json."
tool = ["eslint", "node"]
why = "ESLint catches mistakes that the runtime accepts: unused code, unsafe patterns, and functions that only forward."

[check.files]
eslint_plugins = true
extensions = [".js", ".jsx", ".mjs", ".cjs"]
filenames = ["package.json"]
tags = ["shebang:node"]

[check.output]
children = ["messages"]
format = "json"

[check.output.fields]
column = "column"
file = "filePath"
fixable = "fix"
line = "line"
message = "message"
rule = "ruleId"

[[check]]
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--no-inline-config", "--config", "{config_file:import-cycles}", "--format", "json", "{files}"]
example = "`a.ts` imports `b.ts`, and `b.ts` imports `a.ts`: `import-x/no-cycle` reports each import. Move the shared code to a third module."
exit_codes = [1]
help = "Move the code that both files share to a module that imports neither of them."
name = "import-cycles"
stage = "push"
summary = "Runs `import-x/no-cycle` alone, because it walks the whole import graph and is too slow for a commit."
tool = ["eslint", "node"]
why = "A cycle makes the start order of a module depend on which file loads first."

[check.files]
eslint_plugins = true
extensions = [".js", ".jsx", ".mjs", ".cjs"]

[check.output]
children = ["messages"]
format = "json"

[check.output.fields]
column = "column"
file = "filePath"
fixable = "fix"
line = "line"
message = "message"
rule = "ruleId"

[[check]]
cwd = "scope"
example = "Passing a number to a JSDoc `string` parameter reports a type error. Pass a string, or fix the JSDoc."
help = "Add or fix the JSDoc type that the error names."
name = "tsc"
needs = ["dependencies"]
runs = "scope"
stage = "push"
summary = "Type-checks plain JavaScript through its JSDoc comments."
tool = "tsc"
why = "A wrong call in JavaScript crashes at run time, and written types let the checker catch it first."

[check.files]
extensions = [".js", ".mjs", ".cjs", ".jsx"]

[[check]]
command = ["knip", "--config", "{config_file:knip}", "--no-progress", "--reporter", "json", "{workspace:--workspace}"]
cwd = "root"
example = "An export that no entry point uses reports a finding. Remove it, or list a dynamically loaded file in `javascript.entry_files`."
help = "Import the file from the code or test that uses it. Delete it when nothing will. For a file that a tool loads by path, add it to `javascript.entry_files`."
name = "knip"
needs = ["dependencies", "project-code"]
runs = "scope"
stage = "push"
summary = "Finds files, exports, and dependencies nothing uses."
when = { filenames = ["package.json"] }
why = "Teams read, maintain, and ship dead code for nobody."

[check.output]
format = "knip"

[[check]]
command = ["biome", "lint", "--config-path", "{config_file:biome}", "--reporter=rdjson", "--max-diagnostics=none", "--only=complexity/noExcessiveCognitiveComplexity", "{files}"]
example = "Nested conditions raise the cognitive score. Move each independent task into its own function."
exit_codes = [1]
files = { extensions = [".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx", ".mts", ".cts", ".astro", ".vue", ".svelte"], tags = ["shebang:node"] }
help = "Separate the tasks in the reported function to reduce its cognitive complexity."
level = "all"
limits = { "complexity/noExcessiveCognitiveComplexity" = "max_cognitive_complexity" }
limit_languages = ["javascript", "typescript"]
name = "biome"
stage = "commit"
summary = "Checks cognitive complexity against the scope's language limits."
why = "Nested control flow makes a function harder to follow and change."
output = { format = "json", list = "diagnostics", fields = { file = "location.path", line = "location.range.start.line", column = "location.range.start.column", rule = "code.value", message = "message" } }

[[eslint.selectors]]
message = "Use a label only on a loop or switch statement. Remove this label."
selector = "LabeledStatement:not([body.type=/^(?:WhileStatement|DoWhileStatement|ForStatement|ForInStatement|ForOfStatement|SwitchStatement)$/])"

[[eslint.selectors]]
level = "all"
message = "This loop has no initializer or update. Use a while loop for its condition."
selector = "ForStatement[init=null][update=null][test!=null]"

[[eslint.selectors]]
message = "The delete operator removes properties. Pass a property access instead of this expression."
selector = "UnaryExpression[operator='delete']:not([argument.type='MemberExpression']):not([argument.type='ChainExpression']):not([argument.type='Identifier'])"

[[eslint.selectors]]
level = "all"
message = "Move this assignment into a separate statement before using its value."
selector = "AssignmentExpression:not(ExpressionStatement > AssignmentExpression):not(AssignmentExpression > AssignmentExpression):not(BinaryExpression[operator=/^(?:==|!=|===|!==|<|<=|>|>=)$/] > AssignmentExpression):not(SequenceExpression > AssignmentExpression):not(VariableDeclarator > AssignmentExpression):not(ArrowFunctionExpression > AssignmentExpression.body):not(LogicalExpression > AssignmentExpression.right):not(WhileStatement > AssignmentExpression.test):not(DoWhileStatement > AssignmentExpression.test):not(ForStatement > AssignmentExpression.init):not(ForStatement > AssignmentExpression.update)"

[[eslint.selectors]]
message = "Call a function or method instead of a literal value."
selector = "CallExpression[callee.type=/^(?:ArrayExpression|ClassExpression|ObjectExpression|Literal|TemplateLiteral)$/]"

[[eslint.selectors]]
message = "Use a function as the template tag instead of a literal value."
selector = "TaggedTemplateExpression[tag.type=/^(?:ArrayExpression|ClassExpression|ObjectExpression|Literal|TemplateLiteral)$/]"

[[eslint.selectors]]
message = "Use the package's public name instead of a node_modules path."
selector = "ImportDeclaration[source.value=/node_modules/]"

[[eslint.selectors]]
message = "Use the package's public name instead of a node_modules path."
selector = "CallExpression[callee.type='Identifier'][callee.name='require'][arguments.length=1][arguments.0.type='Literal'][arguments.0.value=type(string)][arguments.0.value=/node_modules/]"

[[eslint.selectors]]
message = "This continue ends the loop body, so it does nothing. Remove it."
selector = ':matches(WhileStatement, DoWhileStatement, ForStatement, ForInStatement, ForOfStatement) > BlockStatement[body.length>1] > ContinueStatement[label=null]:last-child'

[[eslint.selectors]]
message = "This continue ends the loop body, so it does nothing. Remove it."
selector = ':matches(WhileStatement, DoWhileStatement, ForStatement, ForInStatement, ForOfStatement) > BlockStatement > IfStatement:last-child > BlockStatement[body.length>1] > ContinueStatement[label=null]:last-child'

[[eslint.selectors]]
message = "The s flag makes . match every character. Write . instead of this character class."
selector = 'Literal[regex.flags=/s/][regex.pattern=/\[(?:\\s\\S|\\S\\s)\]/]'

[[eslint.selectors]]
message = "An empty-object fallback hides a missing value. Handle the missing case."
selector = 'LogicalExpression[operator=/^(\|\||\?\?)$/][right.type="ObjectExpression"][right.properties.length=0]'

[[eslint.selectors]]
message = "Log a stable message and pass the values as fields."
selector = 'CallExpression:matches([callee.property.name=/^(debug|info|warn|error|fatal|trace)$/], [callee.property.name="log"][callee.object.name!="console"]) > TemplateLiteral.arguments:first-child[expressions.length>0]'

[[eslint.selectors]]
message = "Network inactivity does not prove that the page is ready. Wait for the visible state, response, or URL."
selector = "CallExpression[callee.property.name='waitForLoadState'] > Literal:first-child[value='networkidle']"

[[eslint.selectors]]
message = "Pass the locator to expect, so that the assertion retries, such as await expect(locator).toHaveText(text)."
selector = "Program:has(ImportDeclaration[source.value='@playwright/test']) CallExpression[callee.name='expect'] > AwaitExpression:first-child"

[[eslint.selectors]]
message = "Writing HTML into the page allows XSS. Set textContent, create the nodes, or write fixed markup."
selector = 'AssignmentExpression[left.property.name=/^(?:innerHTML|outerHTML)$/]:not([right.type="Literal"])'

[[eslint.selectors]]
message = "Writing HTML into the page allows XSS. Set textContent, create the nodes, or write fixed markup."
selector = 'CallExpression:matches([callee.property.name="insertAdjacentHTML"][arguments.1.type!="Literal"], [callee.object.name="document"][callee.property.name="write"][arguments.0.type!="Literal"])'

[[eslint.selectors]]
message = "fetch() takes its URL from the request, which allows server-side request forgery. Allow only known hosts."
selector = 'CallExpression[callee.name="fetch"]:matches([arguments.0.object.object.name="req"], [arguments.0.callee.object.property.name="searchParams"][arguments.0.callee.property.name="get"])'

[[eslint.selectors]]
message = "The log writes a secret from the environment. Remove the value, or mask it."
selector = 'CallExpression[callee.property.name=/^(?:log|trace|debug|info|warn|error|fatal)$/][arguments.length=1]:matches([arguments.0.object.object.name="process"][arguments.0.object.property.name="env"][arguments.0.property.name=/KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL/], [arguments.0.callee.object.object.name="Deno"][arguments.0.callee.object.property.name="env"][arguments.0.callee.property.name="get"][arguments.0.arguments.0.value=/KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL/])'

[[eslint.selectors]]
dependencies = ["jsonwebtoken"]
message = "Require the expected JWT signing algorithms. Pass an algorithms option that matches the signing contract."
selector = 'CallExpression[callee.object.name="jwt"][callee.property.name="verify"]:not(:has(ObjectExpression > Property[key.name="algorithms"]))'

[[eslint.selectors]]
dependencies = ["jsonwebtoken"]
message = "jwt.decode() does not verify signatures. Use jwt.verify() instead."
selector = 'CallExpression[callee.object.name="jwt"][callee.property.name="decode"]'

[[eslint.selectors]]
message = "Interpolation in execSync() or exec() allows command injection. Use execFileSync() or execFile() with an argument array."
selector = 'CallExpression[callee.name=/^(?:execSync|exec)$/] > TemplateLiteral.arguments:first-child[expressions.length>0]'
