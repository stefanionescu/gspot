allowed_words = ["PostgreSQL", "Postgres"]
[configuration]
description = "Postgres migrations: squawk for the changes that lock or break, ordered versions, and migrations that never change after they run. The schema checks ask for row security, explicit grants, and an index under every foreign key."
requires = ["sql"]
title = "Postgres"

[detect]
content = { "prisma/schema.prisma" = '(?:^|\n)[\t ]*provider[\t ]*=[\t ]*"postgresql"' }
dependencies = ["pg", "postgres", "psycopg", "asyncpg", "@neondatabase/serverless"]

[files]
paths = ["db/migrations/*.sql", "migrations/*.sql", "**/supabase/migrations/*.sql"]

[[tool]]
github = { name = "sbdchd/squawk", version = "v2.64.0" }
min_version = "2.0.0"
mise = "github:sbdchd/squawk"
name = "squawk"
npm = "squawk-cli"
replace = [".squawk.toml", "squawk.toml"]
version = "2.64.0"
[[tool_file]]
per_scope = true
target = ".gspot/config/squawk.toml"
tool = "squawk"

[[check]]
command = ["squawk", "--config", "{tool_file:squawk}", "--reporter", "json", "{files}"]
example = "A migration adding a constraint that requires a disruptive table scan can report a migration-safety finding. Follow the reported rule to separate creation and validation or otherwise reduce the lock, then review the migration against the deployment database."
files = { paths = ["{setting:postgres.migrations_folder}/**/*.sql"] }
help = "Follow the help squawk prints for the rule. Turn one rule off with gspot ignore postgres/squawk --rule `<name>` --reason \"`<why>`\"."
level = "recommended"
name = "squawk"
output = { format = "json", line_base = 0, fields = { file = "file", line = "line", column = "column", rule = "rule_name", message = "message" } }
stage = "commit"
summary = "Reads every migration for the change that locks a table, rewrites it, or breaks the running application."
why = "A migration that takes an exclusive lock on a large table stops the application for as long as it runs."

[[check]]
example = "A new migration numbered before the latest committed migration reports an ordering finding. Give the new migration a version later than the committed maximum without renaming already applied migrations."
help = "Rename the new migration with a version later than the newest committed one."
level = "recommended"
name = "migration-order"
runs = "scope"
stage = "commit"
summary = "Checks that every migration has a version, that no two share one, and that a new migration sorts after the committed ones."
why = "A migration that sorts before one already applied never runs on the databases that are ahead of it."

[[check]]
example = "Editing an already committed migration reports a frozen-history finding. Preserve the intended change as a new migration, restore the original migration bytes, and rerun. Do not rewrite a migration already applied to shared databases."
help = "Restore the file with git checkout, and write the change as a new migration."
level = "recommended"
name = "edited-migrations"
runs = "scope"
stage = "commit"
summary = "Checks that no migration at or before postgres.frozen_through differs from its committed text."
why = "A migration that ran never runs again, so an edit to it changes new databases only and the environments drift apart."

[[check]]
example = "A newly created table without row-level security reports a missing-RLS finding. Add `ALTER TABLE ... ENABLE ROW LEVEL SECURITY` for the table."
help = "Enable row level security on the table."
level = "recommended"
name = "row-level-security"
runs = "scope"
stage = "commit"
summary = "Checks that every table in a client schema turns on row level security."
why = "A table in an exposed schema with no row security is readable and writable by every client that holds the public key."

[[check]]
example = "The statement `GRANT ALL ON TABLE public.items TO app_reader;` reports a broad grant. If the role only reads rows, use `GRANT SELECT ON TABLE public.items TO app_reader;`."
help = "Name the privileges the role needs, such as `SELECT` alone."
level = "recommended"
name = "grants"
runs = "scope"
stage = "commit"
summary = "Refuses a grant of every privilege in a migration."
why = "Granting everything includes truncating the table, adding triggers, and every privilege a later Postgres adds, which nobody meant to give."

[[check]]
example = "A `SECURITY DEFINER` function without an explicit safe search path reports a finding. Add `SET search_path = ''` to the definition and schema-qualify the objects used in its body."
help = "Give the function an empty `search_path` in its definition, and qualify every name inside it."
level = "recommended"
name = "definer-search-path"
runs = "scope"
stage = "commit"
summary = "Checks that every SECURITY DEFINER function sets its search_path."
why = "A definer function runs with its owner's rights, and a caller who controls the search path chooses the objects it touches."

[[check]]
example = "A foreign key on `orders.customer_id` without an index starting with that column reports a missing index. Add `CREATE INDEX orders_customer_id_idx ON orders (customer_id);` in the migration set."
help = "Create an index that starts with the foreign key column."
level = "recommended"
name = "foreign-key-indexes"
runs = "scope"
stage = "commit"
summary = "Checks that an index, a primary key, or a unique key leads with every foreign key column."
why = "Deleting a parent row scans the whole child table when the foreign key has no index."

[[naming.override]]
allow_digits = true
categories = ["directories"]
paths = ["**/migrations/**"]
reason = "Migration directories use the migration tool timestamp names."

[defaults]
"tools.sqlfluff.dialect" = "postgres"
