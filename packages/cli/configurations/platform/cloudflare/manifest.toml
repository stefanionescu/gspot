allowed_words = ["Cloudflare"]
generated = ["worker-configuration.d.ts"]

[configuration]
description = "Cloudflare Pages and Workers: headers and redirects files Cloudflare can read, fresh binding types, and the Semgrep rules for workers."
requires = ["javascript"]
suggests = []
title = "Cloudflare"

[detect]
dependencies = ["wrangler", "@opennextjs/cloudflare"]
filenames = ["wrangler.toml", "wrangler.json", "wrangler.jsonc", "_worker.js"]
paths = ["**/functions/_middleware.{js,ts}"]

[files]
extensions = [".d.ts"]
filenames = ["wrangler.toml", "wrangler.json", "wrangler.jsonc", "_headers", "_redirects"]

[[tool]]
install_hint = "Run: npm install --save-dev wrangler"
min_version = "3.78.3"
name = "wrangler"
npm = "wrangler"
system = true
version_command = ["--version"]

[[tool_file]]
level = "all"
per_scope = true
target = ".gspot/config/semgrep/cloudflare.yml"
tool = "semgrep"
when = { configuration = "security" }

[[check]]
example = "An indented `X-Frame-Options: DENY` line before any path in `_headers` reports that the header sits under no path. Put the intended path, such as `/*`, on the preceding unindented line."
help = "Write each block as a path, then indented lines of a name, a colon, and a value."
level = "recommended"
name = "headers"
runs = "scope"
stage = "commit"
summary = "Checks that the headers file is blocks of a path line and indented header lines."
why = "Cloudflare skips a line it cannot read, so a typo silently drops a security header."

[[check]]
example = "The `_redirects` line `/old /new 999` reports an unsupported redirect status. For an intended permanent redirect, change it to `/old /new 301`."
help = "Write the rule as source, destination, status."
level = "recommended"
name = "redirects"
runs = "scope"
stage = "commit"
summary = "Checks each redirect source, destination, and optional status: 200, 301, 302, 303, 307, or 308, without a force suffix."
why = "A redirect Cloudflare cannot read is dropped, and the old address starts to answer 404."

[[check]]
command = ["wrangler", "types", "{file}", "--env-interface", "{setting:cloudflare.types_interface}"]
example = "A generated Worker environment type file that differs from `wrangler types` output reports drift. Regenerate it using the configured Wrangler project, inspect the changes, and rerun."
generator_outputs = [{ pattern = "**/{setting:cloudflare.types_file}" }]
help = "Run wrangler types and commit the file."
level = "recommended"
name = "stale-types"
runs = "scope"
stage = "push"
summary = "Checks that a tracked environment types file matches what wrangler writes."
tool = "wrangler"
why = "Stale binding types let code compile against a binding the configuration dropped."

[[check]]
example = "A configured response-header block without a required security header reports the missing header. Add that header to every governed path block using the value required by settings."
help = "Add the header to the block for every path."
level = "recommended"
name = "security-headers"
runs = "scope"
stage = "commit"
summary = "Checks that the headers file sets the content type, referrer, and framing headers for every path."
why = "A site of files has no server code, so the headers file is the only place these protections can live."
