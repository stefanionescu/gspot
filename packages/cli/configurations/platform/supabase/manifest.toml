[configuration]
title = "Supabase"
requires = ["postgres"]
suggests = ["typescript", "security"]
description = "A Supabase project: a project file that parses, edge functions under Deno, and migrations named as the CLI names them. Every storage bucket has a policy, and privileged keys stay in their allowed files."

[detect]
paths = ["**/supabase/config.toml"]
project_files = ["supabase/config.toml"]

[files]
paths = ["supabase/config.toml", "supabase/functions/**", "supabase/seed.sql"]
kinds = ["source"]

[[tool]]
name = "deno"
version = "2.6.6"
min_version = "2.0.0"
mise = "deno"
brew = "deno"
github = { name = "denoland/deno", version = "v2.6.6" }
scoop = "deno"

[[tool]]
name = "supabase"
min_version = "2.0.0"
mise = "supabase"
brew = "supabase/tap/supabase"
npm = "supabase"
scoop = "supabase"

[[config]]
template = "semgrep/supabase.yml.eta"
target = ".gspot/config/semgrep/supabase.yml"
tool = "semgrep"
rule_keys = ["rules"]
scoped = true
when = { configuration = "security" }

[[check]]
name = "project-file"
title = "Validate the Supabase project"
example = "A function entry in `supabase/config.toml` naming a function absent from the repository reports a stale function configuration. Restore the function source or remove its obsolete configuration table."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Checks that the project file parses, and that every function it configures has a folder with an index file."
why = "The CLI reads this file at every deploy, and a function it configures with no code fails there."
help = "Correct the file at the place the message names, or remove the table of a function the repository does not hold."

[[check]]
name = "migration-names"
title = "Name migrations by timestamp"
example = "A Supabase migration named `add_users.sql` lacks the required timestamp prefix. Create it with `supabase migration new add_users`, then move the intended SQL into the generated migration file."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Checks that every migration is named fourteen digits, an underscore, and snake case words."
why = "The CLI orders and records migrations by this name, and it skips a file it cannot read a version from."
help = "Create the migration with supabase migration new <name>, which writes the name."

[[check]]
name = "storage-policies"
title = "Give every bucket a policy"
example = "A declared storage bucket with no matching policy on `storage.objects` reports missing access policy. Add a migration defining the intended access policy for that bucket and rerun."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Checks that every storage bucket in the project file has a policy on storage.objects that names it."
why = "A bucket with no policy is closed to everyone or, when it is public, open to everyone, and neither is a decision anybody wrote down."
help = "Add a policy on storage.objects for the bucket in a migration."

[[check]]
name = "service-role-key"
title = "Contain privileged Supabase keys"
example = "A client source reading a Supabase secret or service-role key reports an administrative-key boundary finding. Move privileged operations and the key read to a server-only path, exposing only the required server operation to the client."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Checks that secret and service role keys are named only in edge functions and test files."
why = "Secret and service role keys bypass row level security, so a client bundle that holds either exposes privileged database access."
help = "Move the code into edge functions or tests, or record a reason with gspot ignore supabase/admin-key."

[[check]]
name = "deno-lint"
title = "Lint edge functions"
example = "An Edge Function declaring `var greeting = \"hello\";` reports `no-var`. Use `const greeting = \"hello\";` when the value does not change, then rerun with the pinned Deno tool available."
level = "recommended"
stage = "commit"
runs = "scope"
tool = "deno"
summary = "Runs deno lint over every edge function, with the function's own deno.json."
why = "Edge functions run under Deno, and its linter knows the runtime the Node rules do not."
help = "Change the code the way the rule says; deno lint --rules explains each one."

[[check]]
name = "deno-check"
title = "Type check edge functions"
example = "An Edge Function assigning a string to a number-typed variable reports a Deno type error. Correct the value or type to match the intended contract, then rerun."
level = "recommended"
stage = "push"
runs = "scope"
tool = "deno"
summary = "Type checks the entry file of every edge function with deno check."
why = "The project compiler does not resolve the import map of a function, so only Deno sees its types."
help = "Fix the first error Deno prints; later ones are often the same mistake."

[[check]]
name = "types-fresh"
title = "Keep Supabase database types current"
example = "A database types file that differs from the configured local Supabase schema reports drift. With the local database ready, regenerate using `supabase gen types typescript --local`, write the output to the configured file, and rerun."
level = "recommended"
stage = "push"
runs = "scope"
tool = "supabase"
needs = ["docker"]
summary = "Compares supabase.types_file with the types the CLI writes from the local database."
why = "Stale types let code compile against a column the database dropped."
help = "Run supabase gen types typescript --local and write the output to the file."

[[setting]]
name = "supabase.schemas"
type = "list"
items = "string"
direction = "neutral"
default = ["public"]
summary = "The database schemas to include in generated types."

[[setting]]
name = "supabase.types_file"
type = "path"
direction = "neutral"
default = ""
summary = "The committed database types file, relative to the scope; empty turns the comparison off."

[[setting]]
name = "supabase.functions_folder"
type = "path"
direction = "neutral"
default = "supabase/functions"
summary = "The folder relative to the scope that holds one folder for each edge function."

[set]
"tools.squawk.assume_in_transaction" = true
