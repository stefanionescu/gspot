allowed_words = ["Supabase"]
[configuration]
title = "Supabase"
requires = ["postgres", "javascript"]
suggests = ["typescript"]
description = "A Supabase project: edge functions under Deno. Every storage bucket has a policy, and privileged keys stay in their allowed files."

[detect]
paths = ["**/supabase/config.toml"]
project_files = ["supabase/config.toml"]

[files]
paths = ["supabase/config.toml", "supabase/functions/**", "supabase/seed.sql"]

[[tool]]
name = "deno"
version = "2.6.6"
min_version = "2.0.0"
mise = "deno"
brew = "deno"
github = { name = "denoland/deno", version = "v2.6.6" }
scoop = "deno"

[[tool]]
name = "supabase"
system = true
version_command = ["--version"]
min_version = "2.0.0"
mise = "supabase"
brew = "supabase/tap/supabase"
npm = "supabase"
scoop = "supabase"

[[check]]
name = "storage-policies"
example = "A declared storage bucket with no matching policy on `storage.objects` reports missing access policy. Add a migration defining the intended access policy for that bucket and rerun."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Checks that every storage bucket in the project file has a policy on storage.objects that names it."
why = "A bucket with no policy is closed to everyone or, when it is public, open to everyone, and neither is a decision anybody wrote down."
help = "Add a policy on storage.objects for the bucket in a migration."

[[check]]
name = "service-role-key"
example = "A client source reading a Supabase secret or service-role key reports an administrative-key boundary finding. Move privileged operations and the key read to a server-only path, exposing only the required server operation to the client."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Checks that secret and service role keys are named only in edge functions and test files."
why = "Secret and service role keys bypass row level security, so a client bundle that holds either exposes privileged database access."
help = "Move code to edge functions or tests, or run gspot ignore supabase/service-role-key with a reason."

[[check]]
name = "deno-lint"
example = "An Edge Function declaring `var greeting = \"hello\";` reports `no-var`. Use `const greeting = \"hello\";` when the value does not change, then rerun with the pinned Deno tool available."
level = "recommended"
stage = "commit"
runs = "scope"
tool = "deno"
summary = "Runs deno lint over every edge function, with the function's own deno.json."
why = "Edge functions run under Deno, and its linter knows the runtime the Node rules do not."
help = "Change the code the way the rule says; deno lint --rules explains each one."

[[check]]
name = "deno-check"
example = "An Edge Function assigning a string to a number-typed variable reports a Deno type error. Correct the value or type to match the intended contract, then rerun."
level = "recommended"
stage = "push"
runs = "scope"
tool = "deno"
summary = "Type checks the entry file of every edge function with deno check."
why = "The project compiler does not resolve the import map of a function, so only Deno sees its types."
help = "Fix the first error Deno prints; later ones are often the same mistake."

[[check]]
name = "stale-types"
command = ["supabase", "gen", "types", "typescript", "--local", "{each:--schema:supabase.schemas}"]
generated_paths = [{ stdout = "{setting:supabase.types_file}" }]
example = "A database types file that differs from the configured local Supabase schema reports drift. With the local database ready, regenerate using `supabase gen types typescript --local`, write the output to the configured file, and rerun."
level = "recommended"
stage = "push"
runs = "scope"
tool = "supabase"
needs = ["docker"]
summary = "Compares supabase.types_file with the types the CLI writes from the local database."
why = "Stale types let code compile against a column the database dropped."
help = "Run supabase gen types typescript --local and write the output to the file."

[defaults]
"postgres.client_schemas" = ["public"]
"tools.squawk.assume_in_transaction" = true
