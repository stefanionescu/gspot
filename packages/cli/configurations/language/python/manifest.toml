[configuration]
title = "Python"
requires = ["format", "structure"]
recommends = ["naming"]
description = "Python sources: Ruff for lint and layout, basedpyright for types, import contracts, docstrings that match signatures, unused dependencies, and dead code."

[detect]
extensions = [".py"]
project_files = ["pyproject.toml", "requirements*.txt", "Pipfile"]
shebangs = ["python", "python3"]

[files]
extensions = [".py", ".pyi"]
filenames = ["pyproject.toml", "setup.cfg", ".importlinter"]
kinds = ["source"]

[[tool]]
name = "ruff"
suppression = {inline_marker = "#\\s*[nN][oO][qQ][aA](?=\\s|:|$)", marker = "#\\s*(?:(?:ruff|flake8):\\s*)?[nN][oO][qQ][aA](?=\\s|:|$)", reason = "#[^#]*# ?(?<reason>\\S.*)"}
version = "0.16.8"
min_version = "0.9.0"
mise = "ruff"
pypi = "ruff"
brew = "ruff"

[[tool.replace]]
file = "ruff.toml"

[[tool.replace]]
file = ".ruff.toml"

[[tool.replace]]
file = "pyproject.toml"
table = "tool.ruff"
shared = true

[[tool]]
name = "basedpyright"
suppression = {marker = "\\b(?:type|pyright): ?ignore\\b", reason = "#[^#]*# ?(?<reason>\\S.*)"}
version = "1.40.1"
min_version = "1.20.0"
mise = "pipx:basedpyright"
pypi = "basedpyright"

[[tool.replace]]
file = "pyrightconfig.json"

[[tool.replace]]
file = "pyproject.toml"
table = "tool.basedpyright"
shared = true

[[tool.replace]]
file = "pyproject.toml"
table = "tool.pyright"
shared = true

[[tool]]
name = "lint-imports"
version = "2.15"
mise = "pipx:import-linter"
pypi = "import-linter"
version_pattern = "v?(\\d+\\.\\d+(?:\\.\\d+)?)"

[[tool]]
name = "pydoclint"
version = "0.9.1"
mise = "pipx:pydoclint"
pypi = "pydoclint"

[[tool]]
name = "deptry"
version = "0.25.1"
min_version = "0.20.0"
mise = "pipx:deptry"
pypi = "deptry"

[[tool]]
name = "vulture"
crash_pattern = '^(?:Error:|.+: invalid source code |.+:None: |.+:[0-9]+: .+ at ")'
version = "2.16"
min_version = "2.11"
mise = "pipx:vulture"
pypi = "vulture"
version_pattern = "(\\d+\\.\\d+(?:\\.\\d+)?)"

[[tool]]
name = "validate-pyproject"
version = "0.26"
mise = "pipx:validate-pyproject"
pypi = "validate-pyproject"
version_pattern = "(\\d+\\.\\d+(?:\\.\\d+)?)"

[[config]]
target = ".gspot/config/ruff.toml"
tool = "ruff"
stub_file = {path = "ruff.toml", body = 'extend = "{target}"'}
scoped = true
rule_keys = ["lint.select", "lint.ignore", "lint.per-file-ignores"]

[[config]]
target = ".gspot/config/basedpyrightconfig.json"
tool = "basedpyright"
stub_file = {path = "pyrightconfig.json", body = "{\n    \"extends\": \"{target}\"\n}"}
scoped = true
generated_header = false

[[check]]
name = "ruff"
title = "Lint Python files"
example = "The expression `eval(user_input)` reports S307 when that rule is selected. Replace dynamic evaluation with parsing and explicit operations appropriate to the input contract."
level = "recommended"
stage = "commit"
command = ["ruff", "check", "--no-cache", "--output-format", "json", "{files}"]
exit_codes = [1]
fix = ["ruff", "check", "--no-cache", "--fix", "--quiet", "{files}"]
files = {extensions = [".py", ".pyi"]}
output = {format = "json", fields = {file = "filename", line = "location.row", column = "location.column", rule = "code", message = "message"}}
summary = "Lints every Python file with the Ruff rules for the level, security rules included."
why = "Ruff holds the rules of a dozen older tools in one pass fast enough to run at every commit."
help = "Run gspot check --fix for the rules that fix themselves. Turn one rule off with gspot ignore python/ruff --rule <code> --reason \"<why>\", and add --paths to limit it."

[[check]]
name = "ruff-format"
title = "Format Python files"
example = "The Python assignment `value=1` differs from Ruff formatting. Format the file so the assignment becomes `value = 1`, then rerun."
level = "recommended"
stage = "commit"
command = ["ruff", "format", "--no-cache", "--check", "--output-format", "concise", "{files}"]
exit_codes = [1]
fix = ["ruff", "format", "--no-cache", "--quiet", "{files}"]
files = {extensions = [".py", ".pyi"]}
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): unformatted: ", message = "This file is not formatted the way Ruff formats it."}
summary = "Checks the layout of every Python file against the Ruff formatter."
why = "One layout everywhere keeps a diff about the change."
help = "Run gspot check --fix."

[[check]]
name = "basedpyright"
title = "Check Python types"
example = "The annotated assignment `count: int = \"one\"` reports an incompatible value type. Use `count: int = 1` when the value is a number, or correct the annotation if the contract requires text."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
command = ["basedpyright", "--outputjson"]
exit_codes = [1]
files = {extensions = [".py", ".pyi"]}
output = {format = "json", items = "generalDiagnostics", line_base = 0, fields = {file = "file", line = "range.start.line", column = "range.start.character", rule = "rule", message = "message"}}
summary = "Type checks the project. At level `all`, it also requires annotations."
why = "A type error found here is a crash that never reaches a user."
help = "Fix the type, or narrow it where the value arrives. Exclude a file that needs another dependency set under tools.basedpyright.exclude with a reason."

[[check]]
name = "import-linter"
title = "Check import contracts"
example = "A module importing from a layer forbidden by the configured import contract reports that dependency. Move the shared behavior to an allowed owner and update the import, then rerun against the same contract."
level = "recommended"
stage = "commit"
runs = "scope"
cwd = "scope"
tool = "lint-imports"
files = {extensions = [".py"], filenames = ["pyproject.toml", "setup.cfg", ".importlinter"]}
summary = "Runs project import contracts from setup.cfg, .importlinter, or pyproject.toml."
why = "A layer that imports the layer above it turns an architecture into a diagram nobody follows."
help = "Move the import to the side the contract allows, or change the contract."

[[check]]
name = "pydoclint"
title = "Match docstrings to their functions"
example = "A function docstring describing parameter `name` when its signature accepts `path` reports a signature mismatch. Document `path` and its actual meaning, removing the obsolete parameter entry."
level = "recommended"
stage = "commit"
cwd = "scope"
nested_config_file = "pyproject.toml"
tool = "pydoclint"
files = {extensions = [".py"]}
output = {format = "grouped", file_pattern = "^(?<file>\\S.*\\.py)$", pattern = "^\\s+(?<line>\\d+): (?<rule>DOC\\d+): (?<message>.*)$"}
summary = "Checks that every docstring names the arguments, the return, and the exceptions its function really has."
why = "A docstring that disagrees with the signature is worse than none, because people trust it."
help = "Bring the docstring in line with the signature."

[[check]]
name = "deptry"
title = "Match imports to declared dependencies"
example = "A module importing a third-party package absent from the project dependencies reports an undeclared dependency. Declare and lock that dependency with the project package manager, or remove the unused import."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
tool = "deptry"
files = {extensions = [".py"], filenames = ["pyproject.toml"]}
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?<rule>DEP\\d+) (?<message>.*)$"}
summary = "Compares the imports of the project with the dependencies it declares: missing, unused, and transitive ones."
why = "An import that works through somebody else's dependency breaks the day they drop it."
help = "Declare the dependency, or remove the one nothing imports. Turn one rule off with gspot ignore python/deptry --rule <code> --reason \"<why>\"."

[[check]]
name = "vulture"
title = "Find unused Python code"
example = "An unused `import colorsys` reports `unused import 'colorsys'`. Remove the unused import and rerun. Dynamically used names need exact entries in the configured allowlist."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
command = ["vulture", ".", "--min-confidence", "{setting:tools.vulture.min_confidence}", "--exclude", ".venv,node_modules,build,dist,.gspot", "{each:--ignore-names:tools.vulture.ignore_names}"]
exit_codes = [3]
files = {extensions = [".py"]}
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+): (?<message>.*)$"}
summary = "Finds functions, classes, and variables nothing uses."
why = "Dead code is read and maintained by people who cannot tell it is dead."
help = "Delete the code, or list a name a framework calls under tools.vulture.ignore_names."

[[check]]
name = "pyproject"
title = "Validate Python project metadata"
example = "The project metadata `version = 7` in `pyproject.toml` reports an invalid version value. Use a valid version string, such as `version = \"1.0.0\"`, and rerun before updating the lockfile."
level = "recommended"
stage = "commit"
command = ["validate-pyproject", "{file}"]
exit_codes = [1]
files = {filenames = ["pyproject.toml"]}
tool = "validate-pyproject"
output = {format = "regex", pattern = "^\\[ERROR\\] (?<message>.*)$"}
summary = "Validates every pyproject.toml against the packaging schemas."
why = "A key the build backend does not know is ignored without a word."
help = "Correct the key the message names."

[[check]]
name = "pip-installs"
title = "Keep dependencies in pyproject.toml"
example = "An authored `requirements.txt` beside a locked Python project creates a second dependency owner. Export that file from the lockfile, declare it generated, and use the locked installation command."
level = "all"
stage = "commit"
runs = "scope"
files = {filenames = ["uv.lock", "poetry.lock", "pdm.lock"], kinds = ["source", "generated"]}
summary = "Checks that pyproject.toml owns every dependency: no hand-kept requirements file, and no pip install outside the allowed paths."
why = "Two owners of the dependency list drift apart, and the image installs what the lockfile never saw."
help = "Export the requirements file from the lockfile and declare it generated, and replace pip install with the locked install. Allow a path under tools.pip.installs_allowed with a reason."

[[check]]
name = "stale-exclusions"
title = "Find stale type check exclusions"
example = "An entry `missing/**` under `tools.basedpyright.exclude` reports a stale exclusion when no selected file matches it. Remove the obsolete entry or correct its path."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that every path the type check leaves out still matches a tracked file."
why = "An exclusion that outlives its file hides the next file that takes the name."
help = "Remove the entry from tools.basedpyright.exclude."

[[check]]
name = "file-lines"
title = "Limit Python file lines"
example = "A Python module whose code-line count exceeds the configured file ceiling reports its count and limit. Move an independent responsibility to its owner and update imports, then verify both modules fit the limit."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Checks that no Python file has more code lines than the ceiling."
why = "A long module holds more than one job, and the second job is the one nobody finds."
help = "Split the module by the job, or raise limits.file_lines for python with a reason."

[[check]]
name = "function-lines"
title = "Limit Python function lines"
example = "A Python function exceeding the configured code-line ceiling reports a length finding. Extract a distinct operation with its own responsibility and verify the remaining function and extracted operation."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Checks that no Python function has more code lines than the ceiling."
why = "A function that fills a screen does several things, and a reader has to hold all of them."
help = "Move one job of the function into a function of its own."

[[check]]
name = "trivial-functions"
title = "Find trivial functions"
example = "The function `def answer(): return 1` has one executable statement and reports a trivial-function finding. Replace unnecessary calls with the value and delete the function."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Reports functions at or below limits.min_function_statements and files containing only trivial declarations."
why = "Unnecessary functions add names and indirection without substantial behavior."
help = "Inline unnecessary functions. For one an external API requires, run `gspot ignore python/trivial-functions --paths <file> --reason <why>`."

[[check]]
name = "placeholder-docstrings"
title = "Replace placeholder docstrings"
example = "A function whose docstring merely repeats its name reports a placeholder description. Replace the docstring with the behavior, inputs, and consequential effects that the name does not explain."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Finds docstrings that hold a placeholder word, or the name of the function again."
why = "A docstring that says nothing passes the docstring rule and wastes the line."
help = "Say what the function does that its name does not, or for whom it exists."

[[check]]
name = "private-prefix"
title = "Prefix private Python names"
example = "A file-local function with no leading underscore and no public export reports a naming finding. Add the underscore and update its local callers, or declare the actual public contract in the export list."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "In a module with an export list, checks that every other definition starts with an underscore, and that the list holds no such name."
why = "A name that is public by accident gets imported, and then it cannot change."
help = "Add the underscore, or list the name in the export list."

[[check]]
name = "private-before-public"
title = "Put private functions first"
example = "A private `_parse` function below an exported public function reports declaration order. Move `_parse` before the public function without changing either body."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Checks that private functions sit above the public functions of a module."
why = "A reader who meets the parts first understands what is built from them."
help = "Move the private functions above the first public one."

[[check]]
name = "exports-at-bottom"
title = "Put the export list last"
example = "A module with `__all__` before later declarations reports an export-list position finding. Move the export list after those declarations."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Checks that the export list is the last statement of its module."
why = "A reader looks for the public surface in one place."
help = "Move the export list to the end of the module."

[[check]]
name = "lazy-exports"
title = "Find lazy exports"
example = "A package exposing names through module-level `__getattr__` reports lazy exports. Import the intended public names explicitly and list them in `__all__`."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Finds a module-level `__getattr__`."
why = "A name that appears only at run time hides from the type checker, the editor, and the reader."
help = "Import the names and list them."

[[check]]
name = "package-exports"
title = "Limit package exports"
example = "A package export list larger than its configured limit reports the export count. Split unrelated public responsibilities into separate packages or remove unnecessary exports and update consumers."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Checks that a package exports no more names than the ceiling."
why = "A package that exports everything has no surface, so every change to it is a breaking one."
help = "Split the package, or export fewer names."

[[check]]
name = "import-comments"
title = "Keep comments out of import blocks"
example = "A comment written between two imports reports an import comment. Move it above the block or next to the code that uses the import; a `# noqa` or `# type:` directive stays."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Finds a comment written inside an import block, between its first and last import."
why = "An import block is a list, and a note inside a list is read as part of the wrong entry."
help = "Move the comment above the block or next to the code it explains."

[[check]]
name = "export-order"
title = "Order the export list"
example = "An `__all__` list whose names are not ordered shortest first reports the sorted order. Reorder the list."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Checks that the names in the export list go shortest first, alphabetically among names of one length."
why = "One order for every export list means a reader never searches it."
help = "Reorder the names shortest first."

[[check]]
name = "singletons"
title = "Find module singletons"
example = "A module-level service instance created during import reports a singleton finding when it is not allowed by policy. Construct it in the application entry point and pass the instance to consumers."
level = "all"
stage = "commit"
runs = "scope"
files = {extensions = [".py"]}
summary = "Finds objects built at import time and kept in a module variable."
why = "Every importer shares the one instance, and no test gets a fresh one."
help = "Build the object where the program starts, and pass it in. Allow a name under structure.python.singletons_allowed with a reason."

[[setting]]
name = "structure.python.singletons_allowed"
type = "list"
direction = "loosening"
default = []
summary = "Names of module variables that may hold an object built at import time, with a reason and optional repository-relative path selectors. Omit paths to allow those names throughout the scope."

[[setting]]
name = "limits.python.package_exports"
type = "number"
direction = "ceiling"
default = 20
summary = "The most names a package may list in its export list."

[[setting]]
name = "tools.pip.installs_allowed"
type = "list"
direction = "loosening"
default = []
summary = "Paths that may run pip install, such as an image that installs one build tool, each with a reason."

[[setting]]
name = "tools.ruff.docstring_convention"
type = "string"
direction = "neutral"
summary = "The Ruff pydocstyle convention carried from project configuration, also used by pydoclint when it has no explicit style."

[setting.validation]
enum = ["google", "numpy", "pep257"]

[[setting]]
name = "tools.ruff.select"
type = "list"
direction = "tightening"
default = []
summary = "Rule families and rules Ruff selects on top of the level's set, such as the ones a framework adds."

[[setting]]
name = "tools.ruff.rules_off_in_tests"
type = "list"
direction = "loosening"
default = []
summary = "Ruff rules and families the test files leave off, such as the assert rule."

[[setting]]
name = "tools.basedpyright.exclude"
type = "list"
direction = "loosening"
default = []
summary = "Paths basedpyright leaves out, such as files that need another dependency set, each with a reason."

[[setting]]
name = "tools.vulture.ignore_names"
type = "list"
direction = "loosening"
default = []
summary = "Names vulture treats as used, such as functions a framework calls."

[[setting]]
name = "tools.vulture.min_confidence"
type = "number"
direction = "ceiling"
default = 100
default_all = 80
summary = "The minimum confidence percentage for reporting unused Python code."
