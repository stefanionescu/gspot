[[config_file]]
per_scope = true
pointer = { path = "ruff.toml", body = "extend = {target_json}\n" }
target = "ruff.toml"
tool = "ruff"

[[config_file]]
per_scope = true
pointer = { path = "pyrightconfig.json", body = "{\n    \"extends\": {target_json}\n}\n" }
target = "basedpyright.json"
tool = "basedpyright"

[[check]]
command = ["ruff", "check", "--no-cache", "--output-format", "json", "{files}"]
example = "`eval(user_input)` reports S307. Parse the input instead, and allow only known operations."
exit_codes = [1]
files = { extensions = [".py", ".pyi"] }
fix = ["ruff", "check", "--no-cache", "--fix", "--quiet", "{files}"]
help = "Run `gspot check --fix` for the rules that fix themselves. Turn one rule off with `gspot ignore python/ruff --rule <rule> --reason \"<why>\"`, and add `--paths` to limit it."
level = "recommended"
name = "ruff"
output = { format = "json", fields = { file = "filename", line = "location.row", column = "location.column", rule = "code", message = "message" } }
stage = "commit"
summary = "Lints every Python file with the Ruff rules for the level, security rules included."
why = "Undefined names, unused code, and insecure calls fail at run time or open a security hole, and a reader misses them."

[[check]]
command = [
    "ruff",
    "format",
    "--no-cache",
    "--check",
    "--output-format",
    "concise",
    "{files}",
]
example = "`value=1` differs from the Ruff output. Run `gspot check --fix` to get `value = 1`."
exit_codes = [1]
files = { extensions = [".py", ".pyi"] }
fix = ["ruff", "format", "--no-cache", "--quiet", "{files}"]
help = "Run `gspot check --fix`."
level = "recommended"
name = "ruff-format"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): unformatted: ", fixable = "unformatted: ", message = "This file is not formatted the way Ruff formats it." }
stage = "commit"
summary = "Checks the layout of every Python file against the Ruff formatter."
why = "One layout everywhere keeps a diff about the change."

[[check]]
command = ["basedpyright", "--outputjson"]
cwd = "scope"
example = "`count: int = \"one\"` reports an incompatible type. Assign a number, such as `count: int = 1`, or change the annotation to `str`."
exit_codes = [1]
files = { extensions = [".py", ".pyi"] }
help = "Fix the type, or narrow it where the value arrives. Accept a file that needs another dependency set with `gspot ignore python/basedpyright --paths <path> --reason \"<why>\"`."
level = "recommended"
name = "basedpyright"
output = { format = "json", list = "generalDiagnostics", line_base = 0, fields = { file = "file", line = "range.start.line", column = "range.start.character", rule = "rule", message = "message" } }
runs = "scope"
stage = "push"
summary = "Type checks the project. At level `all`, it also requires annotations."
why = "Each type error found here becomes a crash that never reaches a user."

[[check]]
cwd = "scope"
example = "A docstring that documents `name` for a function that takes `path` reports a mismatch. Document `path` instead."
files = { extensions = [".py"] }
help = "Bring the docstring in line with the signature."
level = "recommended"
name = "pydoclint"
output = { format = "grouped", file_pattern = "^(?<file>\\S.*\\.py)$", pattern = "^\\s+(?<line>\\d+): (?<rule>DOC\\d+): (?<message>.*)$" }
stage = "commit"
summary = "Checks that each docstring names the arguments, return value, and exceptions of its function."
tool = "pydoclint"
why = "A docstring that contradicts the signature misleads more than none, because people trust it."

[[check]]
cwd = "scope"
env = { PYTHONDONTWRITEBYTECODE = "1" }
example = "An import of a third-party package missing from the project dependencies reports a finding. Declare the package and update the lockfile, or remove the import."
files = { extensions = [".py"], filenames = ["pyproject.toml"] }
help = "Declare the dependency, or remove the one nothing imports. Turn one rule off with `gspot ignore python/deptry --rule <rule> --reason \"<why>\"`."
level = "recommended"
name = "deptry"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?<rule>DEP\\d+) (?<message>.*)$" }
runs = "scope"
stage = "push"
summary = "Compares the imports of the project with the dependencies it declares: missing, unused, and transitive ones."
tool = ["uv", "deptry"]
why = "An import that works through somebody else's dependency breaks the day they drop it."

[[check]]
example = "A function that no Python file of the scope calls reports `unused-function`. Delete it. A hook that a framework calls by name gets an ignore with `names`."
files = { extensions = [".py"] }
help = "Delete the unused definition or the unreachable code. For a definition that a framework uses by name, run `gspot ignore python/vulture --names <name> --reason \"<why>\"`."
level = "all"
name = "vulture"
runs = "scope"
stage = "push"
summary = "Finds functions, classes, methods, attributes, and properties that no Python file of the scope uses, and code that never runs."
tool = "vulture"
why = "Code that nothing calls still costs a reader time and still has to compile and pass review."

[[check]]
example = "A Python function over `limits.python.function_lines` reports `function-lines` with its count. Split it into functions that each do one job."
files = { extensions = [".py"] }
help = "Split the function by responsibility, or raise `limits.python.function_lines` with a reason."
level = "all"
name = "function-size"
runs = "scope"
stage = "commit"
summary = "Checks the code line count of each Python function against `limits.function_lines`."
why = "A long function does more than one job, and a reader has to hold all of it at once."

[[check]]
example = "A `requirements.txt` kept by hand beside a locked project reports a second dependency list. Export it from the lockfile, declare it generated, and install from the lock."
files = { filenames = [
    "uv.lock",
    "poetry.lock",
    "pdm.lock",
], kinds = [
    "source",
    "generated",
] }
help = "Export the requirements file from the lockfile, declare it generated, and replace `pip install` with the locked command. Accept a reviewed path with `gspot ignore python/pip-installs --paths <glob> --reason \"<why>\"`."
level = "all"
name = "pip-installs"
runs = "scope"
stage = "commit"
summary = "Checks that pyproject.toml lists every dependency, with no hand-kept requirements file and no `pip install`."
why = "Two dependency lists drift apart, and the image installs packages the lockfile never pinned."

[[check]]
example = "A docstring that only repeats the function name reports a placeholder. Describe the behavior, the arguments, and the effects that the name leaves out."
files = { extensions = [".py"] }
help = "Say what the function does that its name does not, or for whom it exists."
level = "all"
name = "placeholder-docstrings"
runs = "scope"
stage = "commit"
summary = "Finds docstrings that hold a placeholder word, or the name of the function again."
why = "A docstring that says nothing satisfies the lint rule and wastes the line."
