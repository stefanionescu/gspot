allowed_words = ["Bash", "ShellCheck", "tree-sitter"]
[configuration]
title = "Bash, zsh, and Bats scripts"
suggests = []
description = "Shell scripts, hooks and task files: ShellCheck, shfmt, a syntax pass, and the structure rules for shell."

[detect]
extensions = [".sh", ".bash", ".zsh", ".bats"]
shebangs = ["shell"]

[files]
extensions = [".sh", ".bash", ".zsh", ".bats"]
tags = ["shebang:shell"]

[[tool]]
name = "shellcheck"
refused_options = [
    { paths = ["enable", "disable"], message = "ShellCheck rule selection comes from level recommended or all and gspot ignore. Remove enable and disable from tools.shellcheck.extra.value." },
]
rule_url = "https://www.shellcheck.net/wiki/{rule}"
suppression = { marker = "\\bshellcheck +disable=", reason = "# ?reason: (?<reason>\\S.*)" }
version = "0.11.0"
mise = "shellcheck"
brew = "shellcheck"
apt = "shellcheck"
winget = "koalaman.shellcheck"
scoop = "shellcheck"
github = { name = "koalaman/shellcheck", version = "v0.11.0" }
[[tool.replace]]
file = ".shellcheckrc"
shared = false

[[tool]]
name = "shfmt"
version = "3.12.0"
mise = "shfmt"
brew = "shfmt"
winget = "mvdan.shfmt"
scoop = "shfmt"
github = { name = "mvdan/sh", version = "v3.12.0" }

[[tool]]
name = "zsh"
system = true

[[tool_file]]
target = ".gspot/config/shellcheckrc"
tool = "shellcheck"
per_scope = true

[[check]]
name = "zsh-syntax"
example = "In a Zsh script, `if then` has no condition. Use a real test: `if [[ -f \"$file\" ]]; then print -r -- \"$file\"; fi`, then rerun with Zsh installed."
level = "recommended"
stage = "commit"
command = ["zsh", "-n", "{file}"]
files = { tags = ["zsh"] }
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):\\s*(?<message>.*)$" }
summary = "Checks Zsh syntax with the Zsh interpreter."
why = "Zsh syntax differs from Bash, so a Bash parser rejects valid Zsh programs."
help = "Fix the syntax at the line Zsh reports. Install zsh when the command is missing."

[[check]]
name = "shellcheck"
example = "In a Bash script, `printf \"%s\\n\" $name` reports SC2086 because the expansion permits word splitting and globbing. Use `printf \"%s\\n\" \"$name\"` to pass the value as one argument."
level = "recommended"
stage = "commit"
files = { tags = ["bash", "sh", "bats"] }
command = ["shellcheck", "--rcfile", "{tool_file:shellcheckrc}", "--severity=style", "--check-sourced", "--format=gcc", "{files}"]
exit_codes = [1]
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?:note|warning|error|style): (?<message>.*?) \\[(?<rule>SC\\d+)\\]$" }
summary = "Runs ShellCheck over shell scripts and sourced files, adding stable optional ShellCheck rules at level all."
why = "ShellCheck catches the quoting, globbing and exit-status mistakes that make shell scripts fail on the one input nobody tested."
help = "Read the SC code in the finding; gspot explain shellcheck/SC2086 links to its page. Turn one code off with gspot ignore bash/shellcheck --rule SC2086 --reason \"`<why>`\"."

[[check]]
name = "shfmt"
example = "In a script, `if true;then echo hello;fi` differs from shfmt output. Run the configured formatter to add the required spacing and block layout, then rerun the check."
level = "recommended"
stage = "commit"
files = { tags = ["bash", "sh", "bats"] }
command = ["shfmt", "-d", "-i", "{indent}", "-ci", "-s", "{files}"]
fix = ["shfmt", "-w", "-i", "{indent}", "-ci", "-s", "{files}"]
output = { format = "regex", pattern = "^(?:--- )?(?<file>.+?)(?:\\.orig$|:(?<line>\\d+):(?<column>\\d+): (?<message>.+)$)", message = "This script is not formatted the way shfmt formats it.", fixable = "^--- " }
summary = "Checks that every shell script is formatted the way shfmt formats it."
why = "One formatter means diffs show what changed, not how someone's editor indents."
help = "Run gspot check --fix to format every script, or shfmt -w on one file."

[[check]]
name = "script-layout"
example = "An executable Bash script without `set -euo pipefail` reports a strict-mode finding. Put strict mode before the first command and, when the script defines functions, call the documented `main` function last."
level = "all"
stage = "commit"
summary = "Checks the contract every Bash script keeps: the shebang, strict mode, a main called last when functions are defined, declarative libraries, cleaned-up temporary files."
why = "A script that skips strict mode or hides its runtime fails on the machine where it matters, silently."
help = "Open with the shebang and run set -euo pipefail first. When an executable defines functions, end it with a call to main."

[[check]]
name = "doc-comments"
example = "A function `_quiet() { printf \"%s\\n\" \"Hello\"; }` without a preceding description reports a missing comment. Add `# _quiet: prints a greeting.` immediately above the function. Other structural checks still apply."
level = "all"
stage = "commit"
summary = "Checks that every shell function announces itself in a comment above it that says more than its name."
why = "A function with no summary makes the reader run it in their head; a vague summary is a summary nobody will trust."
help = "Write \"# name: what it does\" above the function; when it carries doc sections, keep Globals, Arguments, Outputs, Returns in that order."

[[check]]
name = "unused-functions"
example = "A private shell function `_orphan` that no script calls reports an unused-function finding. Delete the unused definition. If an external hook requires the function, record that contract with `gspot ignore` and a reason."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Finds shell functions no script in the scope calls."
why = "ShellCheck checks one file; this check follows calls across every script in the scope."
help = "Delete the function. For a required hook entry point, run `gspot ignore bash/unused-functions --paths <file> --reason <why>`."

[[check]]
name = "unread-arguments"
example = "A call `_deaf one two` whose function never reads positional arguments reports dead parameters. If both arguments are unnecessary, remove them from the call. Otherwise read and use the arguments in the function."
level = "recommended"
stage = "commit"
runs = "scope"
summary = "Finds shell functions called with arguments they never read."
why = "A caller that passes an argument expects it to affect the result. An unread argument misleads the caller."
help = "Read the argument in the function, or drop it from every call."

[[check]]
name = "function-size"
example = "A function over `limits.bash.function_lines`, `limits.bash.branches`, `limits.bash.nesting`, or `limits.bash.assignments` reports the count and the ceiling under `function-lines`, `branches`, `nesting`, or `assignments`. Split the function by the job, then rerun."
level = "all"
stage = "commit"
summary = "Checks every shell function against the size ceilings: code lines, branches, nesting, and assignments."
why = "A long script holds more than one job, and a function with many branches or assignments is several functions with one name."
help = "Split the script or the function, or raise the named limits.bash setting with a reason."

[[check]]
name = "wrappers"
example = "A short launcher containing only `exec bash scripts/build.sh` reports a forwarding-wrapper finding. Invoke `scripts/build.sh` directly and remove the redundant launcher."
level = "all"
stage = "commit"
summary = "Finds forwarding wrappers and compatibility aliases in shell scripts."
why = "A wrapper is a second entry point that drifts from the first."
help = "Call the target script directly and delete the redundant launcher or alias."

[[check]]
name = "inline-scripts"
example = "A shell heredoc containing a Python program reports embedded code. Move the program into a `.py` file and invoke that file from the shell script."
level = "all"
stage = "commit"
summary = "Finds inline Python, Node, and generated-script heredocs in shell scripts."
why = "Code inside a heredoc is checked by nothing."
help = "Move the embedded code into its own file and run that."

[[check]]
name = "safety"
example = "A `killall worker` command reports broad-kill. Target the specific process, or ignore that rule for the owning script with a reason."
level = "recommended"
stage = "commit"
summary = "Finds broad process kills and recursive deletes, except traps that remove mktemp paths. At all, it also reports discarded failures."
why = "Each of these is a way a script destroys something it did not mean to and says nothing."
help = "Handle the failure. For required cleanup, use gspot ignore bash/safety with --rule, --paths and --reason."

[[naming.override]]
paths = ["**"]
languages = ["bash"]
categories = ["variables"]
allowed_names = ["IFS", "OPTARG", "OPTIND", "EUID", "UID", "PPID", "RANDOM", "SECONDS", "LINENO", "BASH_SOURCE", "BASH_REMATCH", "BASH_VERSION", "BASH_VERSINFO", "FUNCNAME", "PIPESTATUS", "REPLY", "CDPATH", "OLDPWD", "SHLVL", "HOSTNAME", "OSTYPE", "MACHTYPE", "COLUMNS", "LINES"]
reason = "The shell defines these variable names."

[[naming.override]]
paths = ["**"]
languages = ["bash"]
categories = ["functions", "variables", "constants", "methods", "attributes"]
ignored_prefix = "^_+"
reason = "A leading underscore marks a private shell declaration."
