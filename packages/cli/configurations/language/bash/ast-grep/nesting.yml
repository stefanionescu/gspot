# Compound statements nested deeper than limits.bash.nesting.
id: bash-nesting
language: bash
rule:
    any:
        - kind: if_statement
        - kind: while_statement
        - kind: for_statement
        - kind: c_style_for_statement
        - kind: case_statement
    inside:
        any:
            - kind: if_statement
            - kind: while_statement
            - kind: for_statement
            - kind: c_style_for_statement
            - kind: case_statement
        stopBy: end
