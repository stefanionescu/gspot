# Assignments per function; the engine compares the count with limits.bash.assignments.
id: bash-assignments
language: bash
rule:
    kind: variable_assignment
    not:
        any:
            - inside:
                  kind: declaration_command
                  stopBy: end
            - inside:
                  kind: c_style_for_statement
                  field: initializer
                  stopBy: end
            - inside:
                  kind: c_style_for_statement
                  field: condition
                  stopBy: end
            - inside:
                  kind: c_style_for_statement
                  field: update
                  stopBy: end
