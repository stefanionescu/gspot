allowed_words = ["HTML"]

[configuration]
description = "HTML files: html-validate for structure and accessibility, and no inline script or handler."
title = "HTML"

[files]
extensions = [".html", ".htm"]

[[tool]]
name = "html-validate"
npm = "html-validate"
replace = [".htmlvalidate.json", ".htmlvalidate.js", ".htmlvalidate.cjs"]
suppression = { marker = "^<!--\\s*\\[?html-validate-disable(?:-next|-block)?(?=\\s|\\]|$)", reason = "(?: -- |: )(?<reason>\\S(?:[\\s\\S]*?\\S)?)\\s*\\]?\\s*(?:--!?>)?$" }
version = "11.6.1"

[[tool_file]]
check = "html/html-validate"
target = "html-validate.json"
tool = "html-validate"

[[check]]
command = ["html-validate", "--config", "{tool_file:html-validate}", "--formatter", "json", "{files}"]
example = "An `<img src=\"logo.png\">` without alternative text reports a finding. Add `alt` text, or leave it empty for a decorative image."
help = "Change the markup the way the rule page says. Turn one rule off with `gspot ignore html/html-validate --rule <name> --reason \"<why>\"`."
level = "recommended"
name = "html-validate"
output = { format = "json", children = "messages", fields = { file = "filePath", line = "line", column = "column", rule = "ruleId", message = "message" } }
stage = "commit"
summary = "Validates HTML files for nesting, required attributes, text alternatives, and one style for void elements."
why = "Each browser repairs broken markup differently, and a screen reader announces only what remains."

[[check]]
example = "A button with an inline `onclick` attribute reports a finding. Remove it, and attach the listener from a script file."
help = "Move the script into its own file, and attach the handler there. Structured data of type `application/ld+json` stays inline."
level = "all"
name = "scripts"
stage = "commit"
summary = "Reports inline scripts, event handler attributes, and executable URLs in HTML files."
why = "A content security policy can block injected code only when the pages carry no inline script."
