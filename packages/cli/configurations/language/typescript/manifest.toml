allowed_words = ["TypeScript"]

[configuration]
description = "TypeScript files: the strict compiler and the shipped lint and structure rules."
requires = ["javascript"]
title = "TypeScript"

[detect]
extensions = [".ts", ".tsx", ".mts", ".cts"]
filenames = ["tsconfig.json"]

[files]
extensions = [".ts", ".tsx", ".mts", ".cts", ".d.ts"]
filenames = ["tsconfig.json", "tsconfig.*.json"]

[shared_prefixes]
prefixes = ["tsconfig"]

[[tool]]
kind = "library"
name = "typescript-eslint"
npm = "typescript-eslint"
requires = ["tsc"]
rule_prefix = "@typescript-eslint"
rule_url = "https://typescript-eslint.io/rules/{rule}"
version = "8.71.2"

[tool.eslint]
extensions = [".ts", ".tsx", ".mts", ".cts"]

[eslint]
required_tools = ["typescript-eslint"]
all_level_rules = ["@typescript-eslint/ban-ts-comment", "@typescript-eslint/consistent-type-definitions", "@typescript-eslint/consistent-type-exports", "@typescript-eslint/consistent-type-imports", "@typescript-eslint/explicit-module-boundary-types", "@typescript-eslint/no-extraneous-class", "@typescript-eslint/no-mixed-enums", "@typescript-eslint/no-non-null-assertion", "@typescript-eslint/no-unnecessary-type-parameters", "@typescript-eslint/prefer-readonly", "@typescript-eslint/prefer-reduce-type-parameter", "@typescript-eslint/prefer-return-this-type", "@typescript-eslint/strict-boolean-expressions", "@typescript-eslint/unified-signatures", "gspot/no-magic-numbers"]

[[check]]
cwd = "scope"
example = "`const count: number = \"one\";` reports an incompatible assignment. Assign a number, such as `const count: number = 1;`."
help = "Fix the first error tsc prints; later errors often come from the same mistake."
name = "tsc"
runs = "scope"
stage = "push"
summary = "Runs tsc on each tsconfig project, or on the TypeScript files of a scope that has no tsconfig, with the strict options of the level."
tool = "tsc"
why = "A type error left in a file can crash the program at run time, though the editor already showed it."

[check.output]
format = "regex"
pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"

[[check]]
example = "A tsconfig with `strict` set to `false` reports a finding. Set `strict` to `true`, and fix the new type errors."
help = "Turn on the reported compiler option in your tsconfig."
name = "tsconfig"
stage = "commit"
summary = "Requires strict in every tsconfig you write. Level all also requires noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, noFallthroughCasesInSwitch, noImplicitReturns, and noPropertyAccessFromIndexSignature."
why = "One tsconfig that drops strict lets untyped code back in for that whole scope."
