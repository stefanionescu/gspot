allowed_words = ["TypeScript"]

[shared_prefixes]
prefixes = ["tsconfig"]

[configuration]
description = "The strict compiler, ESLint with typescript-eslint and the gspot structural rules over every TypeScript file, and knip for dead code."
requires = ["javascript"]
suggests = []
title = "TypeScript"

[detect]
extensions = [".ts", ".tsx", ".mts", ".cts"]
filenames = ["tsconfig.json"]

[files]
extensions = [".ts", ".tsx", ".mts", ".cts", ".d.ts"]
filenames = ["tsconfig.json", "tsconfig.*.json"]

[[tool]]
kind = "library"
name = "typescript-eslint"
npm = "typescript-eslint"
requires = ["tsc"]
rule_prefix = "@typescript-eslint"
rule_url = "https://typescript-eslint.io/rules/{rule}"
version = "8.70.0"

[tool.eslint]
extensions = [".ts", ".tsx", ".mts", ".cts"]

[[check]]
cwd = "scope"
example = "`const count: number = \"one\";` reports an incompatible assignment. Assign a number, such as `const count: number = 1;`."
help = "Fix the first error tsc prints; later errors often come from the same mistake."
level = "recommended"
name = "tsc"
runs = "scope"
stage = "push"
summary = "Runs tsc with the strict compiler options over every TypeScript file."
tool = "tsc"
why = "A type error left in a file can crash the program at run time, though the editor already showed it."

[check.output]
format = "regex"
pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"

[[check]]
example = "A tsconfig with `strict` set to `false` reports a finding. Set `strict` to `true`, and fix the new type errors."
help = "Turn on the reported compiler option in your tsconfig."
level = "recommended"
name = "tsconfig"
stage = "commit"
summary = "Requires strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, and noFallthroughCasesInSwitch in every tsconfig you write. Level all also requires noImplicitReturns and noPropertyAccessFromIndexSignature."
why = "One tsconfig that drops strict lets untyped code back in for that whole scope."

[eslint]
all_level_rules = ["@typescript-eslint/ban-ts-comment", "@typescript-eslint/consistent-type-definitions", "@typescript-eslint/consistent-type-exports", "@typescript-eslint/consistent-type-imports", "@typescript-eslint/explicit-module-boundary-types", "@typescript-eslint/no-explicit-any", "@typescript-eslint/no-extraneous-class", "@typescript-eslint/no-magic-numbers", "@typescript-eslint/no-mixed-enums", "@typescript-eslint/no-namespace", "@typescript-eslint/no-non-null-assertion", "@typescript-eslint/no-require-imports", "@typescript-eslint/no-this-alias", "@typescript-eslint/no-unnecessary-type-parameters", "@typescript-eslint/prefer-readonly", "@typescript-eslint/prefer-reduce-type-parameter", "@typescript-eslint/prefer-return-this-type", "@typescript-eslint/strict-boolean-expressions", "@typescript-eslint/triple-slash-reference", "@typescript-eslint/unified-signatures"]

[eslint.presets.strict]
package = "typescript-eslint"
source = "configs.strictTypeChecked"

[eslint.presets.untyped]
package = "typescript-eslint"
source = "configs.disableTypeChecked"

[[tool_file]]
fragment = true
required_tools = ["typescript-eslint"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
