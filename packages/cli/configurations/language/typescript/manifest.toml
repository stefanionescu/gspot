[configuration]
title = "TypeScript"
requires = ["javascript", "structure"]
suggests = ["naming", "format"]
description = "The strict compiler, ESLint with typescript-eslint and the gspot structural rules over every TypeScript file, and knip for dead code."

[detect]
extensions = [".ts", ".tsx", ".mts", ".cts"]
filenames = ["tsconfig.json"]

[files]
extensions = [".ts", ".tsx", ".mts", ".cts", ".d.ts"]
filenames = ["tsconfig.json", "tsconfig.*.json"]

[[tool]]
name = "typescript-eslint"
eslint = { extensions = [".ts", ".tsx", ".mts", ".cts"] }
rule_url = "https://typescript-eslint.io/rules/{rule}"
kind = "library"
version = "8.70.0"
npm = "typescript-eslint"
min_version = "8.29.0"

[[config]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
imports = "eslint.imports.js.tmpl"
fragment = true

[[config]]
target = ".gspot/config/tsconfig.json"
tool = ["tsc", "vue-tsc", "svelte-check", "next"]
check = ["typescript/tsc", "vue/vue-tsc", "svelte/svelte-check", "nextjs/tsc"]
scoped = true

[[check]]
name = "tsc"
title = "Type check TypeScript"
example = "The TypeScript declaration `const count: number = \"one\";` reports an incompatible assignment. Correct it to `const count: number = 1;` when the contract requires a number."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
tool = "tsc"
output = { format = "regex", pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$" }
summary = "Checks that every TypeScript file type-checks with the strict compiler options."
why = "A file that does not type-check can crash at run time in a way the editor already knew about."
help = "Read the first error tsc prints and fix that file; later errors are often the same mistake."

[[check]]
name = "tsconfig"
title = "Keep strict TypeScript options"
example = "An authored TypeScript configuration setting `strict` to `false` reports the required compiler option. Enable `strict` and fix the type errors it reports."
level = "recommended"
stage = "commit"
summary = "Requires strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride, and noFallthroughCasesInSwitch in every authored tsconfig. Level all also requires noImplicitReturns and noPropertyAccessFromIndexSignature."
why = "One tsconfig that drops strict lets untyped code back in for that whole scope."
help = "Enable the reported compiler option in the authored TypeScript configuration."

[required_eslint_rules]
ts = ["@typescript-eslint/no-explicit-any", "@typescript-eslint/no-floating-promises"]
