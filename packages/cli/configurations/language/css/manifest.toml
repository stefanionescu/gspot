allowed_words = ["CSS"]
[configuration]
title = "CSS"
description = "CSS files and the style blocks of Vue and Svelte components: Stylelint with the standard rules, Prettier for layout, and CSS module classes that are both defined and used. SCSS receives formatting only."

[detect]
extensions = [".css", ".vue", ".svelte"]

[files]
extensions = [".css"]

[[tool]]
name = "stylelint"
suppression = { marker = "^(?:/\\*|//)\\s*stylelint-disable(?:-next-line|-line)?(?=\\s|$)", reason = " -- (?<reason>\\S(?:[\\s\\S]*?\\S)?)\\s*(?:\\*/)?$" }
version = "16.23.1"
npm = "stylelint"
[[tool.replace]]
file = ".stylelintrc"
shared = false

[[tool.replace]]
file = ".stylelintrc.json"
shared = false

[[tool.replace]]
file = ".stylelintrc.js"
shared = false

[[tool.replace]]
file = ".stylelintrc.cjs"
shared = false

[[tool.replace]]
file = ".stylelintrc.mjs"
shared = false

[[tool.replace]]
file = ".stylelintrc.yml"
shared = false

[[tool.replace]]
file = ".stylelintrc.yaml"
shared = false

[[tool.replace]]
file = "stylelint.config.js"
shared = false

[[tool.replace]]
file = "stylelint.config.cjs"
shared = false

[[tool.replace]]
file = "stylelint.config.mjs"
shared = false

[[tool.replace]]
file = "package.json"
key = "stylelint"
redirect = true
shared = true

[[tool]]
name = "stylelint-config-standard"
kind = "library"
version = "39.0.0"
npm = "stylelint-config-standard"

[[tool]]
name = "postcss-html"
kind = "library"
version = "2.0.0"
npm = "postcss-html"

[[tool_file]]
target = ".gspot/config/stylelint.json"
tool = "stylelint"
rule_keys = ["rules"]
per_scope = true
pointer = { path = ".stylelintrc.json", body = "{\n    \"extends\": \"{target}\"\n}\n" }

[[check]]
name = "stylelint"
tool = ["stylelint", "stylelint-config-standard"]
example = "The declaration `color: #ggg` uses an invalid hexadecimal color and reports a Stylelint finding. Replace it with a valid intended color such as `#abc`."
level = "recommended"
stage = "commit"
command = ["stylelint", "--config", "{tool_file:stylelint}", "--config-basedir", "{root}/.gspot", "--formatter", "unix", "--allow-empty-input", "{files}"]
fix = ["stylelint", "--config", "{tool_file:stylelint}", "--config-basedir", "{root}/.gspot", "--fix", "--allow-empty-input", "{files}"]
exit_codes = [2]
files = { extensions = [".css", ".vue", ".svelte"] }
output = { format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+):(?<column>\\d+): (?<message>.*) \\((?<rule>[\\w/@-]+)\\) \\[\\w+\\]$" }
summary = "Lints every stylesheet with the standard stylelint rules: unknown properties, overridden selectors, and invalid values."
why = "A browser skips a declaration it cannot read without a word, so a typo in a property ships as a missing style."
help = "Run gspot check --fix for the rules that fix themselves. Turn one rule off with gspot ignore css/stylelint --rule `<name>` --reason \"`<why>`\"."

[rules]
"TAILWIND.md" = { dependencies = ["tailwindcss"] }
