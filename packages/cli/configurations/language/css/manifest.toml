[configuration]
name = "css"
kind = "language"
title = "CSS"
requires = ["formatting"]
recommends = ["spelling"]
description = "Stylesheets: stylelint with the standard rules, Prettier for layout, and CSS module classes that are both defined and used."

[detect]
extensions = [".css", ".scss", ".pcss"]

[claims]
extensions = [".css", ".scss", ".pcss"]
natures = ["source"]

[[tools]]
name = "stylelint"
suppression = {marker = "\\bstylelint-disable(?:-next-line|-line)?\\b", reason = " -- (?<reason>\\S.*)"}
version = "16.23.1"
floor = "16.0.0"
npm = "stylelint"

[[tools.takeover]]
file = ".stylelintrc"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = ".stylelintrc.json"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = ".stylelintrc.js"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = ".stylelintrc.cjs"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = ".stylelintrc.yml"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = ".stylelintrc.yaml"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = "stylelint.config.js"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = "stylelint.config.cjs"
carries = "rules-table"
check = "css/stylelint"

[[tools.takeover]]
file = "stylelint.config.mjs"
carries = "rules-table"
check = "css/stylelint"

[[tools]]
name = "stylelint-config-standard"
kind = "library"
version = "39.0.0"
npm = "stylelint-config-standard"

[[configs]]
template = "stylelint.json.tmpl"
target = ".gspot/config/stylelint.json"
rules_path = ["rules"]
per_scope = true
header = false
stub = {path = ".stylelintrc.json", body = "{\n    \"extends\": \"{target}\"\n}\n"}

[[checks]]
name = "css/stylelint"
title = "Stylelint"
example = "The declaration `color: #ggg` uses an invalid hexadecimal color and reports a Stylelint finding. Replace it with a valid intended color such as `#abc`."
level = "all"
stage = "commit"
command = ["stylelint", "--config", "{config:stylelint}", "--config-basedir", "{root}/.gspot", "--formatter", "unix", "--allow-empty-input", "{files}"]
fix_command = ["stylelint", "--config", "{config:stylelint}", "--config-basedir", "{root}/.gspot", "--fix", "--allow-empty-input", "{files}"]
fix_order = "codemod"
findings_exit_codes = [2]
fix_findings_exit_codes = [2]
coverage = ["style", "syntax"]
output = {format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+):(?<column>\\d+): (?<message>.*) \\((?<rule>[\\w/@-]+)\\) \\[\\w+\\]$"}
summary = "Lints every stylesheet with the standard stylelint rules: unknown properties, overridden selectors, and invalid values."
why = "A browser skips a declaration it cannot read without a word, so a typo in a property ships as a missing style."
help = "Run gspot check --fix for the rules that fix themselves. Turn one rule off with gspot ignore css/stylelint --rule <name> --reason."

[[checks]]
name = "integrity/css-usage"
title = "CSS usage"
example = "A CSS module class referenced by source code but absent from the stylesheet reports a missing class. Define the intended class or correct the source reference to the existing class name."
level = "recommended"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "css-module-usage"
claims = {extensions = [".css", ".scss", ".pcss", ".ts", ".tsx", ".js", ".jsx"]}
coverage = ["consistency"]
summary = "For every CSS module, checks that the code uses each class it defines, and that each class the code reads is defined."
why = "A class the code reads and the stylesheet lacks is undefined at run time, and the element silently loses its style."
help = "Delete the class nobody reads, or define the class the code reads."

[[settings]]
name = "tools.stylelint.rules"
kind = "table"
direction = "per-rule"
default = {}
summary = "Enabled Stylelint rules and their native options. Disable a rule with gspot ignore css/stylelint --rule."

[coverage]
".css" = ["format", "syntax", "style", "spelling"]
".scss" = ["format", "syntax", "style", "spelling"]
".pcss" = ["format", "syntax", "style", "spelling"]

[rule_files]
language = ["language/CSS.md", "language/naming/CSS.md"]
