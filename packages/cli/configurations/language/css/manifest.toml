allowed_words = ["CSS"]

[configuration]
description = "Style sheets and the style blocks of components: the standard stylelint rules and one layout. SCSS gets formatting only."
title = "CSS"

[detect]
extensions = [".css", ".vue", ".svelte"]

[files]
extensions = [".css"]

[rules]
"TAILWIND.md" = { dependencies = ["tailwindcss"] }

[[tool]]
name = "stylelint"
npm = "stylelint"
replace = [".stylelintrc", ".stylelintrc.json", ".stylelintrc.js", ".stylelintrc.cjs", ".stylelintrc.mjs", ".stylelintrc.yml", ".stylelintrc.yaml", "stylelint.config.js", "stylelint.config.cjs", "stylelint.config.mjs"]
suppression = { marker = "^(?:/\\*|//)\\s*stylelint-disable(?:-next-line|-line)?(?=\\s|$)", reason = " -- (?<reason>\\S(?:[\\s\\S]*?\\S)?)\\s*(?:\\*/)?$", example = "/* stylelint-disable-next-line declaration-no-important -- reason: the vendor widget sets its own color */" }
version = "17.16.0"

[[tool.replace_key]]
file = "package.json"
key = "stylelint"
pointer = true

[[tool]]
kind = "library"
name = "stylelint-config-standard"
npm = "stylelint-config-standard"
version = "40.0.0"

[[tool]]
kind = "library"
name = "postcss-html"
npm = "postcss-html"
version = "2.0.0"

[[config_file]]
per_scope = true
pointer = { path = ".stylelintrc.yml", body = "extends: {target_json}\n" }
target = "stylelint.json"
tool = "stylelint"

[[check]]
command = ["stylelint", "--config", "{config_file:stylelint}", "--config-basedir", "{root}/.gspot", "--formatter", "unix", "--allow-empty-input", "{files}"]
example = "The declaration `color: #ggg` holds an invalid hex value and reports a finding. Replace it with a valid one such as `#abc`."
exit_codes = [2]
files = { extensions = [".css", ".vue", ".svelte"] }
fix = ["stylelint", "--config", "{config_file:stylelint}", "--config-basedir", "{root}/.gspot", "--fix", "--allow-empty-input", "{files}"]
help = "Run `gspot check --fix` for the rules that fix themselves. Turn one rule off with `gspot ignore css/stylelint --rule <rule> --reason \"<why>\"`."
level = "recommended"
name = "stylelint"
output = { format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+):(?<column>\\d+): (?<message>.*) \\((?<rule>[\\w/@-]+)\\) \\[\\w+\\]$" }
stage = "commit"
summary = "Lints every stylesheet with the standard stylelint rules: unknown properties, overridden selectors, and invalid values."
tool = ["stylelint", "stylelint-config-standard"]
why = "A browser silently skips a declaration it cannot parse, so a typo in a property ships as a missing style."
