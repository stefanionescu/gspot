entry = [".markdownlint-cli2.mjs"]

[configuration]
title = "Markdown"
requires = ["format"]
description = "Markdown files: markdownlint, Prettier, and fenced code blocks that must parse."

notes = '''
## Markdown rule options

Markdown rule settings hold native option tables, without an enable/disable value or a `default` key:

```toml
[tools.markdownlint.rules]
MD024 = { siblings_only = false }
```

This reports repeated headings throughout a document, rather than only under the same parent heading.
The selected level decides which rules run. Options cannot enable a rule outside that level.
Both levels check image alt text. Accept a specific finding with `gspot ignore markdown/markdownlint --rule <rule> --reason "<why>"`.
'''

[files]
extensions = [".md", ".mdx"]

[[tool]]
name = "markdownlint-cli2"
rule_url = "https://github.com/DavidAnson/markdownlint/blob/main/doc/{rule}.md"
suppression = { marker = "\\bmarkdownlint-disable(?:-line|-next-line|-file)?\\b", reason = " -- (?<reason>\\S(?:[\\s\\S]*?\\S)?)\\s*(?:--!?>)?$" }
version = "0.23.3"
npm = "markdownlint-cli2"
mise = "npm:markdownlint-cli2"
version_command = ["--help"]
version_exit_code = 2
version_pattern = "markdownlint-cli2 v(\\d+\\.\\d+\\.\\d+)"
replaces = [".markdownlint-cli2.jsonc", ".markdownlint-cli2.yaml", ".markdownlint-cli2.cjs", ".markdownlint-cli2.mjs", ".markdownlint.json", ".markdownlint.jsonc", ".markdownlint.yaml", ".markdownlint.yml"]

[[tool_file]]
target = ".gspot/config/markdownlint.jsonc"
tool = "markdownlint-cli2"
per_scope = true
rule_keys = [""]

[[tool_file]]
target = ".gspot/config/markdownlint-cli2.mjs"
tool = "markdownlint-cli2"
per_scope = true
pointer = { path = ".markdownlint-cli2.mjs", body = "export { default } from {target_module};" }

[[check]]
name = "markdownlint"
title = "Lint Markdown files"
example = "A heading that jumps from level one to level three reports MD001. Change the later heading to level two."
run_in_copy = true
path_prefix = ":"
level = "recommended"
stage = "commit"
command = ["markdownlint-cli2", "--no-globs", "--config", "{tool_file:markdownlint-cli2}", "{files}"]
fix = ["markdownlint-cli2", "--fix", "--no-globs", "--config", "{tool_file:markdownlint-cli2}", "{files}"]
exit_codes = [1]
output = { format = "markdownlint" }
summary = "Checks every Markdown file against markdownlint with the shipped rule set."
why = "Markdown that lints the same everywhere renders the same everywhere."
help = "Run gspot check --fix for the rules that fix themselves; read the rule name for the rest."

[[check]]
name = "fences"
title = "Check code block syntax"
example = "A code fence labeled `bash` containing `if then` reports invalid syntax. Correct the example to valid Bash. Use a text fence only when the block represents text rather than executable code."
level = "recommended"
stage = "commit"
summary = "Checks JSON, JSONC, TOML, YAML, Bash, JavaScript, JSX, TypeScript, TSX, and Python code fences in Markdown (.md) files for syntax errors."
why = "A code block that does not parse is documentation that lies about the code."
help = "Fix the code in the block, or tag the block text when it is not code."

[[setting]]
name = "tools.markdownlint.rules"
off_values = [false]
type = "table"
direction = "rule-options"
default = {}
summary = "Native option tables by Markdown rule ID, such as MD024. The level decides which rules run; ignore a finding with gspot ignore markdown/markdownlint --rule `<rule>` --reason `<why>`."
