allowed_words = ["Markdown"]

[configuration]
description = "Markdown files: one style and layout, and code blocks that parse."
title = "Markdown"

[files]
extensions = [".md", ".mdx"]

[[tool]]
name = "markdownlint-cli2"
npm = "markdownlint-cli2"
replace = [".markdownlint-cli2.jsonc", ".markdownlint-cli2.yaml", ".markdownlint-cli2.cjs", ".markdownlint-cli2.mjs", ".markdownlint.json", ".markdownlint.jsonc", ".markdownlint.yaml", ".markdownlint.yml"]
rule_url = "https://github.com/DavidAnson/markdownlint/blob/main/doc/{rule}.md"
suppression = { marker = "\\bmarkdownlint-disable(?:-line|-next-line|-file)?\\b", reason = " -- (?<reason>\\S(?:[\\s\\S]*?\\S)?)\\s*(?:--!?>)?$", example = "<!-- markdownlint-disable-next-line MD013 -- reason: the table row cannot wrap -->" }
version = "0.23.3"
version_command = ["--help"]
version_exit_code = 2
version_pattern = "markdownlint-cli2 v(\\d+\\.\\d+\\.\\d+)"

[[tool_file]]
per_scope = true
pointer = { path = ".markdownlint.jsonc", body = "{ \"extends\": {target_json} }\n", inherit = true }
target = "markdownlint.jsonc"
tool = "markdownlint-cli2"

[[tool_file]]
per_scope = true
target = "markdownlint-cli2.mjs"
tool = "markdownlint-cli2"

[[check]]
command = ["markdownlint-cli2", "--no-globs", "--config", "{tool_file:markdownlint-cli2}", "{files}"]
example = "A heading that jumps from level one to level three reports MD001. Change the later heading to level two."
exit_codes = [1]
fix = ["markdownlint-cli2", "--fix", "--no-globs", "--config", "{tool_file:markdownlint-cli2}", "{files}"]
help = "Run `gspot check --fix` for the rules that fix themselves; read the rule name for the rest."
level = "recommended"
name = "markdownlint"
output = { format = "markdownlint" }
run_in_copy = true
stage = "commit"
summary = "Checks every Markdown file against markdownlint with the shipped rule set. In an `.mdx` page, the rules start after the leading import and export blocks."
why = "Consistent Markdown renders the same in every viewer."

[[check]]
example = "A `bash` fence with `if then` reports a syntax error. Correct the Bash, or label the block `text` when it holds no code."
help = "Fix the code, or label the block `text` when it holds prose."
level = "recommended"
name = "fences"
stage = "commit"
summary = "Checks JSON, JSONC, TOML, YAML, Bash, JavaScript, JSX, TypeScript, TSX, and Python code fences in Markdown (.md) files for syntax errors."
why = "A code block that fails to parse shows readers a program that cannot run."
