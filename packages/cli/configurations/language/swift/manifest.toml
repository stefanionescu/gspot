allowed_words = ["Swift", "SwiftLint", "SwiftFormat", "Periphery"]

ignored_folders = [".build", "DerivedData", "Pods"]

[configuration]
description = "Swift sources: SwiftLint with stable rules selected by level and analyzer rules, SwiftFormat, a build, and Periphery for dead code."
suggests = []
title = "Swift"

[detect]
extensions = [".swift"]
project_files = ["Package.swift"]

[files]
extensions = [".swift"]
filenames = ["Package.swift", "Package.resolved"]

[[tool]]
brew = "swiftlint"
builds = ["macos", "linux"]
github = { name = "realm/SwiftLint", version = "0.63.2" }
min_version = "0.57.0"
mise = "swiftlint"
name = "swiftlint"
replace = [".swiftlint.yml", ".swiftlint.yaml"]
rule_url = "https://realm.github.io/SwiftLint/{rule}.html"
suppression = { marker = "\\bswiftlint:disable\\b", reason = " - (?<reason>\\S.*)" }
version = "0.63.2"
version_command = ["version"]
[[tool]]
builds = ["macos", "linux"]
min_version = "0.54.0"
name = "swiftformat"
replace = [".swiftformat"]
suppression = { marker = "\\bswiftformat:disable\\b", reason = " - (?<reason>\\S.*)" }
version = "0.61.1"
# The GitHub release ships an app bundle beside the executable, which mise skips.
brew = "swiftformat"
github = { name = "nicklockwood/SwiftFormat", version = "0.61.1" }
mise = { name = "swiftformat", version = "0.61.1", options = { no_app = true, rename_exe = "swiftformat" } }
[[tool]]
brew = "periphery"
builds = ["macos"]
github = { name = "peripheryapp/periphery", version = "3.6.0" }
min_version = "3.0.0"
mise = "periphery"
name = "periphery"
replace = [".periphery.yml", ".periphery.yaml"]
suppression = { marker = "\\bperiphery:ignore\\b", reason = " - (?<reason>\\S.*)" }
version = "3.6.0"
version_command = ["version"]
[[tool]]
name = "swift"
system = true

[[tool]]
install_hint = "install Xcode from the App Store"
name = "xcodebuild"
system = true

[[tool_file]]
per_scope = true
pointer = { path = ".swiftlint.yml", body = "parent_config: {target_json}\n" }
target = ".gspot/config/swiftlint.yml"
tool = "swiftlint"

[[tool_file]]
per_scope = true
target = ".gspot/config/swiftformat"
tool = "swiftformat"

[[tool_file]]
per_scope = true
target = ".gspot/config/periphery.yml"
tool = "periphery"

[[check]]
command = ["swiftlint", "lint", "--strict", "--quiet", "--no-cache", "--reporter", "json", "{files}"]
cwd = "scope"
example = "The forced cast `value as! NSString` reports `force_cast`. Use a conditional cast and handle the failed conversion, or change the input contract so no cast is required."
files = { extensions = [".swift"] }
fix = ["swiftlint", "lint", "--fix", "--quiet", "--no-cache", "{files}"]
help = "Run `gspot check --fix` for the rules that fix themselves. Turn one rule off with `gspot ignore swift/swiftlint --rule <id> --reason \"<why>\"`."
level = "recommended"
name = "swiftlint"
output = { format = "json", fields = { file = "file", line = "line", column = "character", rule = "rule_id", message = "reason" } }
stage = "commit"
summary = "Lints Swift files with the scoped and nested SwiftLint configurations, treating warnings as errors."
tool = "swiftlint"
why = "Forced casts and tries can crash, and a strong delegate can retain its owner. Find these before committing."

[[check]]
command = ["swiftformat", "--lint", "--config", "{tool_file:swiftformat}", "{files}"]
example = "A declaration beginning `func   greeting` reports `consecutiveSpaces`. Run the configured formatter to obtain `func greeting`, inspect the diff, and rerun."
exit_codes = [1]
files = { extensions = [".swift"] }
fix = ["swiftformat", "--quiet", "--config", "{tool_file:swiftformat}", "{files}"]
help = "Run `gspot check --fix`."
level = "recommended"
name = "swiftformat"
output = { format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+):(?<column>\\d+): (?:error|warning): \\((?<rule>\\w+)\\) (?<message>.*)$" }
stage = "commit"
summary = "Checks the layout of every Swift file against the shipped SwiftFormat rules."
why = "One layout everywhere keeps a diff about the change and not about where a brace went."

[[check]]
example = "A Swift assignment of a string to an `Int` variable fails compilation. Correct the value or declared type and rerun with the required compiler and project settings available."
help = "Fix the first compiler error; later ones are often the same mistake."
level = "recommended"
name = "build"
needs = ["build"]
operating_systems = ["macos", "linux"]
runs = "scope"
stage = "push"
summary = "Builds the package or Xcode scheme incrementally to report compiler errors."
why = "Swift has no type check without a build, so the build is the type check."

[[check]]
example = "An import unused by the compiled Swift sources reports an analyzer finding. Remove the import and rerun the build-backed analysis. A missing build log does not establish a clean result."
help = "Remove what the rule names. Keep an import the analyzer misjudges under tools.swiftlint.always_keep_imports."
level = "recommended"
name = "swiftlint-analyze"
needs = ["build"]
operating_systems = ["macos"]
runs = "scope"
stage = "manual"
summary = "Runs the SwiftLint analyzer rules over the compiler log of the build: unused imports and captured variables."
tool = "swiftlint"
why = "These rules need the compiler's view of the code, which a file-by-file lint does not have."

[[check]]
example = "A declaration with no references in the selected compiled project reports unused code. Delete the unused declaration and rebuild before rerunning. Runtime-only references require a specific documented exception."
help = "Delete the declaration, or mark it with a periphery:ignore comment that says who uses it."
level = "recommended"
name = "periphery"
needs = ["build"]
runs = "scope"
stage = "push"
summary = "Scans the built project for declarations nothing uses."
tool = "periphery"
why = "Dead code is read, maintained, and migrated by people who cannot tell it is dead."

[rules]
"SWIFTUI.md" = { tags = ["swift-import:SwiftUI"] }
"UIKIT.md" = { tags = ["swift-import:UIKit"] }

[[tool_file]]
per_scope = true
target = ".gspot/config/semgrep/swift.yml"
tool = "semgrep"
when = { configuration = "security" }
