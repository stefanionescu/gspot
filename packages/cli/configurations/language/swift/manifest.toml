allowed_words = ["Swift", "SwiftLint", "SwiftFormat", "Periphery"]
ignored_paths = [".build", "DerivedData", "**/.build/**", "**/DerivedData/**", "**/Pods/**"]

[configuration]
description = "Swift sources and their XCTest and Swift Testing tests: lint and analyzer rules for each level, one format, a clean build, no unused code, a reason on each disabled test, and a coverage floor."
title = "Swift"

[detect]
extensions = [".swift"]
project_files = ["Package.swift"]

[files]
extensions = [".swift"]
filenames = ["Package.swift", "Package.resolved", "*.xctestplan"]

[rules]
"SWIFTUI.md" = { tags = ["swift-import:SwiftUI"] }
"SWIFT-TESTS.md" = { tags = ["swift-test", "swift-test-target"] }
"UIKIT.md" = { tags = ["swift-import:UIKit"] }

[[tool]]
builds = ["macos", "linux"]
min_version = "0.57.0"
mise = "swiftlint"
name = "swiftlint"
replace = [".swiftlint.yml", ".swiftlint.yaml"]
rule_url = "https://realm.github.io/SwiftLint/{rule}.html"
suppression = { marker = "\\bswiftlint:disable\\b(?::(?:next|this|previous))?(?<rules>.*)", reason = " - (?<reason>\\S.*)", example = "// swiftlint:disable:next force_unwrapping - the URL is a literal", separator = "\\s-\\s", all_rules = "^all(?=$|\\s)", limit_rules = "(?:^|[\\s,])(?:cyclomatic_complexity|function_body_length|file_length|type_body_length|function_parameter_count)(?=$|[\\s,])" }
version = "0.63.2"
version_command = ["version"]

[[tool]]
builds = ["macos", "linux"]
min_version = "0.54.0"
name = "swiftformat"
replace = [".swiftformat"]
suppression = { marker = "\\bswiftformat:disable\\b", reason = " - (?<reason>\\S.*)", example = "// swiftformat:disable:next redundantSelf - the closure needs self" }
version = "0.61.1"
# The GitHub release ships an app bundle beside the executable, which mise skips.
mise = { name = "swiftformat", version = "0.61.1", options = { no_app = true, rename_exe = "swiftformat" } }

[[tool]]
builds = ["macos"]
min_version = "3.0.0"
mise = "periphery"
name = "periphery"
replace = [".periphery.yml", ".periphery.yaml"]
suppression = { marker = "\\bperiphery:ignore\\b", reason = " - (?<reason>\\S.*)", example = "// periphery:ignore - the runtime calls it by name" }
version = "3.6.0"
version_command = ["version"]

[[tool]]
name = "swift"
system = true

[[tool]]
install_hint = "install Xcode from the App Store"
name = "xcodebuild"
system = true

[[tool_file]]
per_scope = true
pointer = { path = ".swiftlint.yml", body = "parent_config: {target_json}\n" }
target = "swiftlint.yml"
tool = "swiftlint"

[[tool_file]]
per_scope = true
pointer = { path = ".swiftlint.yml", folders = ["**/*Tests"], body = "parent_config: {target_json}\ndisabled_rules:\n    - force_unwrapping\n    - missing_docs\n    - no_magic_numbers\n" }
target = "swiftlint.yml"
tool = "swiftlint"

[[tool_file]]
per_scope = true
target = "swiftformat"
tool = "swiftformat"

[[tool_file]]
per_scope = true
target = "periphery.yml"
tool = "periphery"

[[tool_file]]
per_scope = true
target = "semgrep.yml"
tool = "semgrep"

[[check]]
command = ["swiftlint", "lint", "--strict", "--quiet", "--no-cache", "--reporter", "json", "{files}"]
cwd = "scope"
example = "`value as! NSString` reports `force_cast`. Use `as?` and handle the failure, or change the input type so no cast remains."
files = { extensions = [".swift"] }
fix = ["swiftlint", "lint", "--fix", "--quiet", "--no-cache", "{files}"]
help = "Run `gspot check --fix` for the rules that fix themselves. Turn one rule off with `gspot ignore swift/swiftlint --rule <id> --reason \"<why>\"`."
level = "recommended"
name = "swiftlint"
output = { format = "json", fields = { file = "file", line = "line", column = "character", rule = "rule_id", message = "reason" } }
stage = "commit"
summary = "Lints Swift files with the SwiftLint files of each scope and nested folder, and treats warnings as errors."
tool = "swiftlint"
why = "Forced casts and tries can crash, and a strong delegate can keep its owner alive."

[[check]]
command = ["swiftformat", "--lint", "--config", "{tool_file:swiftformat}", "{files}"]
example = "`func   greeting` reports `consecutiveSpaces`. Run `gspot check --fix` to get `func greeting`."
exit_codes = [1]
files = { extensions = [".swift"] }
fix = ["swiftformat", "--quiet", "--config", "{tool_file:swiftformat}", "{files}"]
help = "Run `gspot check --fix`."
level = "recommended"
name = "swiftformat"
output = { format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+):(?<column>\\d+): (?:error|warning): \\((?<rule>\\w+)\\) (?<message>.*)$" }
stage = "commit"
summary = "Checks the layout of every Swift file against the shipped SwiftFormat rules."
why = "One layout everywhere keeps a diff about the change and not about where a brace went."

[[check]]
example = "Assigning a string to an `Int` variable fails the build. Correct the value or the type."
help = "Fix the first compiler error; later ones often come from the same mistake."
level = "recommended"
name = "build"
needs = ["build"]
operating_systems = ["macos", "linux"]
runs = "scope"
stage = "push"
summary = "Builds the package or Xcode scheme incrementally to report compiler errors."
why = "Swift checks types only during a build."

[[check]]
example = "An import that no compiled Swift source uses reports a finding. Remove the import."
help = "Remove what the rule names. List an import that the analyzer flags in error under `tools.swiftlint.always_keep_imports`."
level = "recommended"
name = "swiftlint-analyze"
needs = ["build"]
operating_systems = ["macos"]
runs = "scope"
stage = "manual"
summary = "Runs the SwiftLint analyzer rules over the compiler log of the build: unused imports and captured variables."
tool = "swiftlint"
why = "An unused import slows the build and hides the real dependencies, and a captured variable can keep an object alive or read a stale value."

[[check]]
example = "A declaration that nothing references reports unused code. Delete it, and rebuild."
help = "Delete the declaration, or mark it with a periphery:ignore comment that says who uses it."
level = "recommended"
name = "periphery"
needs = ["build"]
runs = "scope"
stage = "push"
summary = "Scans the built project for declarations nothing uses."
tool = "periphery"
why = "People read, maintain, and migrate dead code without knowing that nothing uses it."

[[check]]
example = "`throw XCTSkip()` in a Swift test reports a missing reason. Restore the test, or give a reason such as `throw XCTSkip(\"Requires the hardware test device\")`."
files = { tags = ["swift-test"] }
help = "Write why the test stays off and what turns it on again, or delete it."
level = "recommended"
name = "skip-reasons"
stage = "commit"
summary = "Checks that skip calls and disabled traits name a nonempty reason, and unavailable tests carry an explanation."
why = "A skipped test with no reason stays off, because nobody can tell when to restore it."

[[check]]
example = "A Swift target reports 85% line coverage against a 90% floor. Add a test that exercises its uncovered lines, then rerun the target."
files = { extensions = [".swift"] }
help = "Add tests for the target, or lower its floor with a reason."
level = "recommended"
name = "coverage"
needs = ["build"]
operating_systems = ["macos", "linux"]
runs = "scope"
stage = "push"
summary = "Measures each source target in Xcode projects and Swift packages against `coverage.lines` and its `coverage.swift_target` floor."
when = { tags = ["swift-test", "swift-test-target"] }
why = "A floor for each target exposes Swift code that no test runs."
