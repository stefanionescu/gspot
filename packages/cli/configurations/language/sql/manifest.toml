[configuration]
title = "SQL"
requires = ["format"]
suggests = ["naming"]
description = "SQLFluff checks layout and style in the project dialect. At all, SQL checks line comments, file length, and PostgreSQL function structure."

[files]
extensions = [".sql", ".pgsql", ".psql"]

[[tool]]
name = "sqlfluff"
crash_pattern = '^Traceback \(most recent call last\):$'
suppression = { marker = "\\bnoqa\\b", reason = "--[^\\n]*?-- ?(?<reason>\\S.*)" }
version = "4.3.0"
min_version = "3.0.0"
pypi = "sqlfluff"
mise = "pipx:sqlfluff"
brew = "sqlfluff"
replaces = [".sqlfluff", ".sqlfluffignore"]

[[tool.replace]]
file = "pyproject.toml"
table = "tool.sqlfluff"
shared = true

[[tool.replace]]
file = "setup.cfg"
table = "sqlfluff"
shared = true

[[tool.replace]]
file = "tox.ini"
table = "sqlfluff"
shared = true

[[tool_file]]
target = ".gspot/config/sqlfluff.cfg"
tool = "sqlfluff"
per_scope = true
rule_keys = ["sqlfluff.rules", "sqlfluff.exclude_rules", "sqlfluff:rules"]

[[check]]
name = "sqlfluff"
title = "Lint SQL files"
example = "The query `select id from user_accounts;` reports CP01 under the configured uppercase keyword policy. Format it as `SELECT id FROM user_accounts;` and rerun using the project dialect."
level = "recommended"
stage = "commit"
command = ["sqlfluff", "lint", "--config", "{tool_file:sqlfluff}", "--ignore-local-config", "--disable-progress-bar", "--format", "json", "{files}"]
exit_codes = [1]
fix = ["sqlfluff", "fix", "--config", "{tool_file:sqlfluff}", "--ignore-local-config", "--disable-progress-bar", "{files}"]
output = { format = "json", children = "violations", fields = { file = "filepath", line = "start_line_no", column = "start_line_pos", rule = "code", message = "description" } }
summary = "Lints every SQL file for layout, capitalization, aliasing, and ambiguous references, in the dialect the database configuration names."
why = "SQL that reads one way in every file lets a reviewer look at what the statement does."
help = "Run gspot check --fix. Turn one rule off with gspot ignore sql/sqlfluff --rule `<code>` --reason \"`<why>`\"."

[[check]]
name = "trivial-functions"
title = "Check trivial SQL functions and parameters"
example = "A SQL function that only forwards one expression reports a trivial-function finding. Inline unnecessary calls and delete the function. If an external API requires the signature, record that with `gspot ignore` and a reason."
level = "all"
stage = "commit"
summary = "For the postgres dialect, reports trivial SQL and PL/pgSQL functions and excessive declared input parameters."
why = "Unnecessary functions add indirection; excessive parameters obscure responsibilities."
help = "Inline unnecessary functions. If a required API needs one, run `gspot ignore sql/trivial-functions --paths <file> --reason <why>`. Reduce parameters or configure limits.sql.function_parameters."

[[setting]]
name = "tools.sqlfluff.dialect"
type = "string"
direction = "neutral"
default = "ansi"
summary = "The sqlfluff dialect; a database configuration sets it."
validation = { pattern = "^[a-z][a-z0-9_]*$", message = "Use a SQLFluff dialect label, such as postgres or sqlite." }

[[setting]]
name = "limits.sql.file_lines"
type = "number"
direction = "ceiling"
default = 400
summary = "The most code lines a SQL file may have."
