allowed_words = ["SQL"]

[configuration]
description = "SQL files: layout, capitalization, and references in the dialect of your database. Level `all` adds the join, cast, subquery, and `LIMIT` rules."
title = "SQL"

[files]
extensions = [".sql", ".pgsql", ".psql"]

[[tool]]
crash_pattern = '^Traceback \(most recent call last\):$'
min_version = "3.0.0"
name = "sqlfluff"
pypi = "sqlfluff"
replace = [".sqlfluff", ".sqlfluffignore"]
suppression = { marker = "\\bnoqa\\b", reason = "--[^\\n]*?-- ?(?<reason>\\S.*)", example = "SELECT * FROM orders -- noqa: AM04 -- reason: the view mirrors every column" }
version = "4.3.0"

[[tool.replace_key]]
file = "pyproject.toml"
table = "tool.sqlfluff"

[[tool.replace_key]]
file = "setup.cfg"
table = "sqlfluff"

[[tool.replace_key]]
file = "tox.ini"
table = "sqlfluff"

[[config_file]]
per_scope = true
target = "sqlfluff.cfg"
tool = "sqlfluff"

[[check]]
command = ["sqlfluff", "lint", "--config", "{config_file:sqlfluff}", "--ignore-local-config", "--disable-progress-bar", "--format", "json", "{files}"]
example = "The query `select id from user_accounts;` reports CP01 for lowercase keywords. Write it as `SELECT id FROM user_accounts;`."
exit_codes = [1]
fix = ["sqlfluff", "fix", "--config", "{config_file:sqlfluff}", "--ignore-local-config", "--disable-progress-bar", "{files}"]
help = "Run `gspot check --fix`. Turn one rule off with `gspot ignore sql/sqlfluff --rule <rule> --reason \"<why>\"`."
level = "recommended"
name = "sqlfluff"
output = { format = "json", children = "violations", fields = { file = "filepath", line = "start_line_no", column = "start_line_pos", rule = "code", message = "description" } }
stage = "commit"
summary = "Lints every SQL file for layout, capitalization, aliasing, and ambiguous references, in the dialect the database configuration names."
why = "When every SQL file follows one style, a reviewer can focus on what each statement does."
