ignored_folders = ["node_modules/"]
dockerignore = ["node_modules"]

# Where a dead-code scan starts when no framework names its own entries.
entry = ["src/main.{ts,js}", "src/index.{ts,js}", "**/*.{test,spec}.{ts,tsx,js}"]

[configuration]
title = "JavaScript"
requires = ["structure"]
suggests = ["naming", "format"]
description = "ESLint with the shipped rule set over every JavaScript file, type checking through JSDoc, and knip for dead code."

notes = '''
gspot translates policy settings into plugin rule options:

| Policy setting | Plugin rule | Rule option |
| --- | --- | --- |
| `architecture.roles.env` | `env-owner` | `owners` |
| `tools.eslint.import_extensions` | `n/file-extension-in-import` | native import style |
| `limits.index_exports` | `barrel-files/avoid-barrel-files` | `amountOfExportsToConsiderModuleAsBarrel` |
| `structure.reexports = "index-only"` | core re-export selectors and `no-trivial-files` | index exemptions |

Environment ownership and barrel limits apply at level `all`. Barrel limits apply when index re-exports are allowed. See the [standalone plugin reference](/reference/plugin/) for the rule options.

## JavaScript runtimes

ESLint gives each file one runtime. Ordinary modules use Node.js built-ins; `.cjs` and `.cts`
files also receive CommonJS globals. React, Vue, Svelte, and Vite application sources use
browser globals. React Native sources use native globals. Build scripts retain Node.js.
Next.js sources retain Node.js by default because server components can use its APIs.

Use `tools.eslint.runtimes` to declare another runtime for a file selector:

```toml title="Runtime choices in gspot.toml"
[tools.eslint.runtimes]
"src/client/**" = "browser"
"src/workers/**" = "worker"
"src/service-worker.js" = "service-worker"
```

Selectors are relative to the scope that authors the setting. Inherited selectors keep that
origin. A scope can add or replace selectors. Later selectors take precedence when they overlap.
A child scope reads its own settings and framework defaults. Use an explicit `node` selector
for server code inside a browser or native project.

Runtime names follow the pinned [globals package](https://github.com/sindresorhus/globals);
`service-worker` names its service-worker
set. Web Workers and service workers have different APIs. Browser and native files do not
receive Node.js rules. React Native retains the `process` and `require` globals its
runtime supports, and does not receive Node.js globals such as `Buffer` and `__dirname`.
Unknown runtime names fail policy validation before configuration is generated.

JavaScript checks inherit an authored `jsconfig.json` first and `tsconfig.json` otherwise. The TypeScript fallback keeps compiler settings and declarations while selecting JavaScript sources for this check. An authored JSX setting remains in force; otherwise the generated project uses `jsx: "preserve"`. Scopes without either project file use Bundler resolution when an extensionless import style matches a JavaScript source file. Ambient types come from the source project, including authored custom roots.

For compiler selection, see [TypeScript details](/reference/configurations/typescript/#details).
'''

[detect]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
shebangs = ["node"]

[files]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
tags = ["shebang:node"]
eslint_plugins = true

[[tool]]
name = "eslint"
refused_options = [{ paths = ["rules", "overrides", "extends"], message = "ESLint rule selection comes from level recommended or all. Use tools.eslint.rules and tools.eslint.overrides for native options, or gspot ignore javascript/eslint --rule <rule> --reason <why> to accept a finding." }]
rule_url = "https://eslint.org/docs/latest/rules/{rule}"
crash_pattern = "^(?:Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:)"
diagnostic_header_pattern = "^(?:Oops!|ESLint: )"
suppression = { marker = "^(?:/\\*\\s*eslint-disable(?:-next-line|-line)?|//\\s*eslint-disable-(?:next-)?line)(?=\\s|$)", reason = " -- (?<reason>\\S.*)" }
version = "9.39.5"
npm = "eslint"
min_version = "9.38.0"


[[tool.replace]]
file = "eslint.config.js"

[[tool.replace]]
file = "eslint.config.mjs"

[[tool.replace]]
file = "eslint.config.cjs"

[[tool.replace]]
file = "eslint.config.ts"

[[tool.replace]]
file = "eslint.config.mts"

[[tool.replace]]
file = "eslint.config.cts"

[[tool.replace]]
file = ".eslintrc"

[[tool.replace]]
file = ".eslintrc.js"

[[tool.replace]]
file = ".eslintrc.cjs"

[[tool.replace]]
file = ".eslintrc.json"

[[tool.replace]]
file = ".eslintrc.yml"

[[tool.replace]]
file = ".eslintrc.yaml"

[[tool.replace]]
file = "package.json"
key = "eslintConfig"
shared = true

[[tool.replace]]
file = ".eslintignore"

[[tool]]
name = "@eslint/js"
kind = "library"
version = "9.39.5"
npm = "@eslint/js"

[[tool]]
name = "@gspothq/eslint-plugin"
kind = "library"
version = "0.1.0"
npm = "@gspothq/eslint-plugin"
rule_url = "https://generativespotting.com/reference/plugin/{rule}/"

[[tool]]
name = "eslint-plugin-sonarjs"
kind = "library"
version = "4.2.0"
npm = "eslint-plugin-sonarjs"
min_version = "3.0.0"

[[tool]]
name = "eslint-plugin-unicorn"
rule_url = "https://github.com/sindresorhus/eslint-plugin-unicorn/blob/main/docs/rules/{rule}.md"
kind = "library"
version = "65.0.1"
npm = "eslint-plugin-unicorn"
min_version = "63.0.0"

[[tool]]
name = "eslint-plugin-security"
kind = "library"
version = "4.0.1"
npm = "eslint-plugin-security"

[[tool]]
name = "eslint-plugin-barrel-files"
kind = "library"
version = "3.0.1"
npm = "eslint-plugin-barrel-files"

[[tool]]
name = "eslint-plugin-n"
kind = "library"
version = "18.3.0"
npm = "eslint-plugin-n"
min_version = "17.24.0"

[[tool]]
name = "eslint-plugin-jsdoc"
