# Where a dead-code scan starts when no framework names its own entries.
entry = ["src/main.{ts,js}", "src/index.{ts,js}", "src/server.{ts,js}", "scripts/**/*.{ts,js,mjs}", "**/*.{test,spec}.{ts,tsx,js}", "tests/**/*.{ts,js}"]

[configuration]
title = "JavaScript"
requires = ["structure"]
recommends = ["naming", "format"]
description = "ESLint with the shipped rule set over every JavaScript file, type checking through JSDoc, and knip for dead code."

[detect]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
project_files = ["package.json"]
shebangs = ["node"]

[files]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
tags = ["shebang:node"]
eslint_plugins = true

[[tool]]
name = "eslint"
refused_options = [{paths = ["rules", "overrides", "extends"], message = "ESLint rule selection comes from level recommended or all. Use tools.eslint.rules and tools.eslint.overrides for native options, or gspot ignore javascript/eslint --rule <rule> --reason <why> to accept a finding."}]
rule_url = "https://eslint.org/docs/latest/rules/{rule}"
crash_pattern = "^(?:Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:)"
diagnostic_header_pattern = "^(?:Oops!|ESLint: )"
suppression = {marker = "^(?:/\\*\\s*eslint-disable(?:-next-line|-line)?|//\\s*eslint-disable-(?:next-)?line)(?=\\s|$)", reason = " -- (?<reason>\\S.*)"}
version = "9.39.5"
npm = "eslint"
min_version = "9.38.0"

[[tool.replace]]
file = ".whitelizard"

[[tool.replace]]
file = "eslint.config.js"

[[tool.replace]]
file = "eslint.config.mjs"

[[tool.replace]]
file = "eslint.config.cjs"

[[tool.replace]]
file = "eslint.config.ts"

[[tool.replace]]
file = "eslint.config.mts"

[[tool.replace]]
file = "eslint.config.cts"

[[tool.replace]]
file = ".eslintrc"

[[tool.replace]]
file = ".eslintrc.js"

[[tool.replace]]
file = ".eslintrc.cjs"

[[tool.replace]]
file = ".eslintrc.json"

[[tool.replace]]
file = ".eslintrc.yml"

[[tool.replace]]
file = ".eslintrc.yaml"

[[tool.replace]]
file = "package.json"
key = "eslintConfig"
shared = true

[[tool.replace]]
file = ".eslintignore"

[[tool]]
name = "@eslint/js"
kind = "library"
version = "9.39.5"
npm = "@eslint/js"

[[tool]]
name = "@gspothq/eslint-plugin"
kind = "library"
version = "0.1.0"
npm = "@gspothq/eslint-plugin"
rule_url = "https://gspot.dev/reference/plugin/{rule}/"

[[tool]]
name = "eslint-plugin-sonarjs"
kind = "library"
version = "4.2.0"
npm = "eslint-plugin-sonarjs"
min_version = "3.0.0"

[[tool]]
name = "eslint-plugin-unicorn"
rule_url = "https://github.com/sindresorhus/eslint-plugin-unicorn/blob/main/docs/rules/{rule}.md"
kind = "library"
version = "65.0.1"
npm = "eslint-plugin-unicorn"
min_version = "63.0.0"

[[tool]]
name = "eslint-plugin-security"
kind = "library"
version = "4.0.1"
npm = "eslint-plugin-security"

[[tool]]
name = "eslint-plugin-n"
kind = "library"
version = "18.3.0"
npm = "eslint-plugin-n"
min_version = "17.24.0"

[[tool]]
name = "eslint-plugin-jsdoc"
kind = "library"
version = "64.3.9"
npm = "eslint-plugin-jsdoc"
min_version = "50.8.0"

[[tool]]
name = "eslint-plugin-regexp"
kind = "library"
version = "3.3.0"
npm = "eslint-plugin-regexp"
min_version = "2.10.0"

[[tool]]
name = "eslint-plugin-import-x"
kind = "library"
version = "4.17.1"
npm = "eslint-plugin-import-x"

[[tool]]
name = "@eslint-community/eslint-plugin-eslint-comments"
kind = "library"
version = "4.8.0"
npm = "@eslint-community/eslint-plugin-eslint-comments"

[[tool]]
name = "eslint-plugin-boundaries"
kind = "library"
version = "7.2.0"
npm = "eslint-plugin-boundaries"
min_version = "5.0.0"

[[tool]]
name = "eslint-plugin-package-json"
kind = "library"
version = "1.8.0"
npm = "eslint-plugin-package-json"

[[tool]]
name = "eslint-config-prettier"
kind = "library"
version = "10.1.8"
npm = "eslint-config-prettier"

[[tool]]
name = "globals"
kind = "library"
version = "17.12.0"
npm = "globals"

[[tool]]
name = "knip"
version = "6.35.1"
npm = "knip"
