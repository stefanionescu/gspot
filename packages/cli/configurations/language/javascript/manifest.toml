[[tool.replace]]
file = "knip.json"

[[tool.replace]]
file = "knip.jsonc"

[[tool.replace]]
file = ".knip.json"

[[tool.replace]]
file = ".knip.jsonc"

[[tool.replace]]
file = "knip.ts"

[[tool.replace]]
