# Where a dead-code scan starts when no framework names its own entries.
entry = ["src/main.{ts,js}", "src/index.{ts,js}", "src/server.{ts,js}", "scripts/**/*.{ts,js,mjs}", "**/*.{test,spec}.{ts,tsx,js}", "tests/**/*.{ts,js}"]

[configuration]
title = "JavaScript"
requires = ["structure"]
recommends = ["naming", "format", "spelling"]
description = "ESLint with the shipped rule set over every JavaScript file, type checking through JSDoc, and knip for dead code."

[detect]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
project_files = ["package.json"]
shebangs = ["node"]

[files]
extensions = [".js", ".jsx", ".mjs", ".cjs"]
tags = ["shebang:node"]
eslint_plugins = true

[[tool]]
name = "eslint"
rule_url = "https://eslint.org/docs/latest/rules/{rule}"
crash_pattern = "^(?:Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:)"
diagnostic_header_pattern = "^(?:Oops!|ESLint: )"
suppression = {marker = "^(?:/\\*\\s*eslint-disable(?:-next-line|-line)?|//\\s*eslint-disable-(?:next-)?line)(?=\\s|$)", reason = " -- (?<reason>\\S.*)"}
version = "9.39.5"
npm = "eslint"
min_version = "9.38.0"

[[tool.replace]]
file = ".whitelizard"

[[tool.replace]]
file = "eslint.config.js"

[[tool.replace]]
file = "eslint.config.mjs"

[[tool.replace]]
file = "eslint.config.cjs"

[[tool.replace]]
file = "eslint.config.ts"

[[tool.replace]]
file = ".eslintrc"

[[tool.replace]]
file = ".eslintrc.js"

[[tool.replace]]
file = ".eslintrc.cjs"

[[tool.replace]]
file = ".eslintrc.json"

[[tool.replace]]
file = ".eslintrc.yml"

[[tool.replace]]
file = ".eslintrc.yaml"

[[tool.replace]]
file = "package.json"
key = "eslintConfig"
shared = true

[[tool.replace]]
file = ".eslintignore"

[[tool]]
name = "@eslint/js"
kind = "library"
version = "9.39.5"
npm = "@eslint/js"

[[tool]]
name = "@gspothq/eslint-plugin"
kind = "library"
version = "0.1.0"
npm = "@gspothq/eslint-plugin"
rule_url = "https://gspot.dev/reference/plugin/{rule}/"

[[tool]]
name = "eslint-plugin-sonarjs"
kind = "library"
version = "4.2.0"
npm = "eslint-plugin-sonarjs"
min_version = "3.0.0"

[[tool]]
name = "eslint-plugin-unicorn"
rule_url = "https://github.com/sindresorhus/eslint-plugin-unicorn/blob/main/docs/rules/{rule}.md"
kind = "library"
version = "65.0.1"
npm = "eslint-plugin-unicorn"
min_version = "63.0.0"

[[tool]]
name = "eslint-plugin-security"
kind = "library"
version = "4.0.1"
npm = "eslint-plugin-security"

[[tool]]
name = "eslint-plugin-n"
kind = "library"
version = "18.3.0"
npm = "eslint-plugin-n"
min_version = "17.24.0"

[[tool]]
name = "eslint-plugin-jsdoc"
kind = "library"
version = "64.3.9"
npm = "eslint-plugin-jsdoc"
min_version = "50.8.0"

[[tool]]
name = "eslint-plugin-regexp"
kind = "library"
version = "3.3.0"
npm = "eslint-plugin-regexp"
min_version = "2.10.0"

[[tool]]
name = "eslint-plugin-import-x"
kind = "library"
version = "4.17.1"
npm = "eslint-plugin-import-x"

[[tool]]
name = "@eslint-community/eslint-plugin-eslint-comments"
kind = "library"
version = "4.8.0"
npm = "@eslint-community/eslint-plugin-eslint-comments"

[[tool]]
name = "eslint-plugin-boundaries"
kind = "library"
version = "7.2.0"
npm = "eslint-plugin-boundaries"
min_version = "5.0.0"

[[tool]]
name = "eslint-plugin-package-json"
kind = "library"
version = "1.8.0"
npm = "eslint-plugin-package-json"

[[tool]]
name = "eslint-config-prettier"
kind = "library"
version = "10.1.8"
npm = "eslint-config-prettier"

[[tool]]
name = "globals"
kind = "library"
version = "17.12.0"
npm = "globals"

[[tool]]
name = "knip"
version = "6.35.1"
npm = "knip"
min_version = "5.85.0"

[[tool.replace]]
file = "knip.json"

[[tool.replace]]
file = "knip.jsonc"

[[tool.replace]]
file = ".knip.json"

[[tool.replace]]
file = "knip.config.js"

[[tool.replace]]
file = "knip.config.ts"

[[tool.replace]]
file = "knip.config.mjs"

[[tool]]
name = "typescript"
kind = "library"
version = "5.9.3"
npm = "typescript"

[[config]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
rule_keys = ["rules"]
stub_file = {path = "eslint.config.mjs", body = "export { default } from {target_module};"}

[[config]]
target = ".gspot/config/jsconfig.json"
tool = "tsc"
check = "javascript/tsc"
scoped = true

[[config]]
target = ".gspot/config/knip.json"
tool = "knip"
generated_header = false

[[check]]
name = "eslint"
title = "Lint JavaScript and TypeScript"
tool = ["eslint", "node"]
example = "The declaration `const unused = 1;` reports no-unused-vars. Delete the variable."
level = "recommended"
stage = "commit"
runs = "files"
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{config:eslint}", "--format", "json", "{files}"]
fix = ["eslint", "--fix", "--config", "{config:eslint}", "{files}"]
exit_codes = [1]
files = {extensions = [".js", ".jsx", ".mjs", ".cjs"], filenames = ["package.json"], tags = ["shebang:node"], eslint_plugins = true}
output = {format = "eslint"}
summary = "Runs ESLint with the shipped rule set over every JavaScript file and every package.json."
why = "ESLint catches mistakes and dead code the runtime accepts: unused code, unsafe patterns, functions that only forward."
help = "Run gspot check --fix for the rules that fix themselves, then read each remaining line; gspot explain <rule> links the rule documentation."

[[check]]
name = "tsc"
title = "Check JavaScript types"
example = "With JavaScript type checking enabled, passing a number to a JSDoc parameter declared as `string` reports a type error. Pass the intended string value or correct the documented parameter contract."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
tool = "tsc"
files = {extensions = [".js", ".mjs", ".cjs", ".jsx"]}
output = {format = "regex", pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"}
summary = "Type-checks plain JavaScript through its JSDoc comments."
why = "A JavaScript file with a wrong call crashes at run time; the checker sees it first when the types are written down."
help = "Add or fix the JSDoc type the checker names; gspot explain tsc/TS2345 links the error page."

[[check]]
name = "knip"
title = "Find unused JavaScript code"
example = "An exported declaration that no selected entry point uses reports an unused export. Remove the export or declaration and update consumers. If the file is dynamically loaded, declare its real entry point in policy."
level = "recommended"
stage = "push"
runs = "scope"
command = ["knip", "--config", "{config:knip}", "--no-progress", "--reporter", "compact", "{workspace:--workspace}"]
cwd = "root"
output = {format = "regex", pattern = "^(?<file>[^:\\s]+)(?::\\s*(?<message>.*))?$"}
summary = "Finds files, exports, and dependencies nothing uses."
why = "Dead code is read, maintained, and shipped for nobody."
help = "Delete what knip names, or add a knip entry point with gspot set tools.knip.entry if the file is loaded in a way knip cannot see."

[[setting]]
name = "tools.eslint.component_languages"
type = "list"
direction = "neutral"
default = []
summary = "The languages a component script block declares; empty means plain JavaScript."

[[setting]]
name = "tools.eslint.rules"
type = "table"
direction = "rule-options"
off_values = [0, "off"]
default = {}
summary = "Rule options and rules turned on, by ESLint rule id; a rule turned off is a gspot ignore --rule."

[[setting]]
name = "tools.eslint.overrides"
type = "list"
direction = "rule-options"
default = []
summary = "Lint rule options for selected paths, in order. A scope's overrides apply inside that scope only. Explicit ignores apply last."

[[setting]]
name = "tools.eslint.import_extensions"
type = "table"
direction = "neutral"
default = {"**/*" = "js"}
summary = "The import suffix style per file class: js for compiled ESM, ts for Deno and Bun, extensionless for bundled code."

[[setting]]
name = "tools.eslint.script_files"
type = "list"
direction = "neutral"
default = ["scripts/**", "**/*.config.{js,mjs,cjs,ts}", ".mise/tasks/**"]
summary = "The globs that count as scripts: no-process-exit off, every unused argument reported."

[[setting]]
name = "tools.eslint.runtimes"
type = "table"
direction = "neutral"
default = {}
summary = "The runtime per scoped file selector, using names from globals; service-worker selects service-worker APIs. Framework application sources use their runtime, build scripts use Node.js, and authored selectors override those defaults."

[[setting]]
name = "tools.eslint.node_version"
type = "string"
direction = "neutral"
default = ">=22.0.0"
summary = "The Node version the n plugin checks builtins against; detected from engines at init."

[[setting]]
name = "tools.eslint.restricted_imports"
type = "list"
direction = "tightening"
default = []
summary = "Imports this repository refuses, each with a name, and a message."

[[setting]]
name = "tools.knip.entry"
type = "list"
direction = "neutral"
default = []
summary = "Entry points knip starts from beyond the ones the framework configuration declares."

[[setting]]
name = "tools.knip.exclude"
type = "list"
direction = "loosening"
default = []
summary = "Files knip leaves out, each with a reason."

[[setting]]
name = "tools.knip.ignore_dependencies"
type = "list"
direction = "loosening"
default = []
summary = "Dependencies knip does not report as unused, each with a reason: packages only a spawned command uses. A name that looks like a regular expression matches as one; an entry with workspace applies to that package.json workspace alone."

[[check]]
name = "rules-off"
title = "Keep required ESLint rules on"
tool = "node"
example = "An authored ESLint override disabling a rule required by policy reports that missing rule. Remove the override or record the intended scoped exception with a reason through policy, then regenerate configuration."
level = "recommended"
stage = "push"
runs = "scope"
summary = "Checks that the configuration ESLint resolves for a file still turns on every rule the configurations require."
why = "The configuration is put together from the blocks of many configurations, and a later block can turn off a rule that an earlier one turned on."
help = "Run gspot apply to write the configuration again. A rule the repository decided against is recorded with gspot ignore, which carries a reason."

[agent_rules]
"NODE.md" = {runtimes = ["node"]}
"BUN.md" = {filenames = ["bun.lock", "bun.lockb", "bunfig.toml"]}

[required_eslint_rules]
js = ["eqeqeq", "no-restricted-syntax", "max-lines", "sonarjs/cognitive-complexity", "gspot/private-before-public"]
mjs = ["eqeqeq", "no-restricted-syntax", "max-lines", "sonarjs/cognitive-complexity"]
