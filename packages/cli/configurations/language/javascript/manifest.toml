[[tool]]
name = "tsc"
suppression = { marker = "@ts-(?:ignore|expect-error|nocheck)\\b", reason = "@ts-(?:ignore|expect-error|nocheck):?\\s+(?<reason>\\S.*)" }
system = true
version = "5.9.3"
npm = "typescript"
version_command = ["--version"]

[[tool]]
name = "typescript"
kind = "library"
version = "5.9.3"
npm = "typescript"

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
rule_keys = ["rules"]
pointer = { path = "eslint.config.mjs", body = "export { default } from {target_module};" }

[[tool_file.selectors]]
selector = "ExportAllDeclaration"
message = "Export values at their declaration instead of re-exporting them."
when = { setting = "structure.reexports", value = "none" }

[[tool_file.selectors]]
selector = "ExportNamedDeclaration[source]"
message = "Export values at their declaration instead of re-exporting them."
when = { setting = "structure.reexports", value = "none" }

[[tool_file.selectors]]
selector = "ExportNamedDeclaration[declaration=null]"
message = "Export values at their declaration instead of re-exporting them."
when = { setting = "structure.reexports", value = "none" }

[[tool_file.selectors]]
selector = "ExportAllDeclaration"
message = "Export values at their declaration instead of re-exporting them."
when = { setting = "structure.reexports", value = "index-only" }
ignores = ["**/index.*"]

[[tool_file.selectors]]
selector = "ExportNamedDeclaration[source]"
message = "Export values at their declaration instead of re-exporting them."
when = { setting = "structure.reexports", value = "index-only" }
ignores = ["**/index.*"]

[[tool_file.selectors]]
selector = "ExportNamedDeclaration[declaration=null]"
message = "Export values at their declaration instead of re-exporting them."
when = { setting = "structure.reexports", value = "index-only" }
ignores = ["**/index.*"]

[[tool_file]]
target = ".gspot/config/jsconfig.json"
tool = "tsc"
check = "javascript/tsc"
scoped = true

[[tool_file]]
target = ".gspot/config/knip.json"
tool = "knip"
generated_header = false

[[check]]
name = "eslint"
title = "Lint JavaScript and TypeScript"
tool = ["eslint", "node"]
example = "The declaration `const unused = 1;` reports no-unused-vars. Delete the variable."
level = "recommended"
stage = "commit"
runs = "files"
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{tool_file:eslint}", "--format", "json", "{files}"]
fix = ["eslint", "--fix", "--config", "{tool_file:eslint}", "{files}"]
exit_codes = [1]
files = { extensions = [".js", ".jsx", ".mjs", ".cjs"], filenames = ["package.json"], tags = ["shebang:node"], eslint_plugins = true }
output = { format = "json", children = "messages", fields = { file = "filePath", line = "line", column = "column", rule = "ruleId", message = "message", fixable = "fix" } }
summary = "Runs the shipped ESLint rules on JavaScript, TypeScript, component files, and package.json."
why = "ESLint catches mistakes and dead code the runtime accepts: unused code, unsafe patterns, functions that only forward."
help = "Run gspot check --fix for the rules that fix themselves, then read each remaining line; gspot explain `<rule>` links the rule documentation."

[[check]]
name = "tsc"
title = "Check JavaScript types"
example = "With JavaScript type checking enabled, passing a number to a JSDoc parameter declared as `string` reports a type error. Pass the intended string value or correct the documented parameter contract."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
tool = "tsc"
files = { extensions = [".js", ".mjs", ".cjs", ".jsx"] }
output = { format = "regex", pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$" }
summary = "Type-checks plain JavaScript through its JSDoc comments."
why = "A JavaScript file with a wrong call crashes at run time; the checker sees it first when the types are written down."
help = "Add or fix the JSDoc type that the error names."

[[check]]
name = "knip"
title = "Find unused JavaScript code"
example = "An exported declaration that no selected entry point uses reports an unused export. Remove the export or declaration and update consumers. If the file is dynamically loaded, add its entry point with gspot set tools.knip.entry."
level = "recommended"
stage = "push"
runs = "scope"
command = ["knip", "--config", "{tool_file:knip}", "--no-progress", "--reporter", "json", "{workspace:--workspace}"]
cwd = "root"
output = { format = "knip" }
summary = "Finds files, exports, and dependencies nothing uses."
why = "Dead code is read, maintained, and shipped for nobody."
help = "Delete what knip names, or add a knip entry point with gspot set tools.knip.entry if the file is loaded in a way knip cannot see."

[[setting]]
name = "tools.eslint.rules"
type = "table"
direction = "rule-options"
default = {}
summary = "Native option arrays by ESLint rule ID, without a severity. Options apply only where the selected level enables the rule. Accept findings with gspot ignore --rule."

[[setting]]
name = "tools.eslint.overrides"
type = "list"
direction = "rule-options"
default = []
summary = "Rule options for selected paths, in order. A scope's overrides apply inside that scope only. Explicit ignores apply last."

[[setting]]
name = "tools.eslint.import_extensions"
type = "table"
direction = "neutral"
default = { "**/*" = "js" }
summary = "The import suffix for each path pattern: js for compiled ESM, ts for Deno and Bun, extensionless for bundled code."

[[setting]]
name = "architecture.roles.scripts"
type = "list"
items = "path"
direction = "neutral"
default = ["scripts/**", "**/*.config.{js,mjs,cjs,ts}"]
summary = "Globs for script files: they may print to the console and call process.exit."

[[setting]]
name = "tools.eslint.runtimes"
type = "table"
direction = "neutral"
default = {}
summary = "The runtime per scoped file selector, using names from globals; service-worker selects service-worker APIs. Framework application sources use their runtime, build scripts use Node.js, and authored selectors override those defaults."

[[setting]]
name = "tools.eslint.node_version"
type = "string"
direction = "neutral"
default = ""
summary = "Override the Node version checked by the n plugin. When unset, the plugin reads each source file's package engines."

[[setting]]
name = "tools.eslint.restricted_imports"
type = "list"
items = { name = "string", message = "string" }
direction = "tightening"
default = []
summary = "Imports this repository refuses, each with a name, and a message."

[[setting]]
name = "tools.knip.entry"
type = "list"
items = "path"
direction = "neutral"
default = []
summary = "Entry points knip starts from beyond the ones the framework configuration declares."

[[setting]]
name = "tools.knip.ignore_dependencies"
type = "table"
direction = "loosening"
default = {}
summary = "Dependencies knip does not report as unused, each with a reason: packages only a spawned command uses. A name that looks like a regular expression matches as one; an entry with workspace applies to that package.json workspace alone."

[agent_rules]
"NODE.md" = { runtimes = ["node"] }
"DENO.md" = { runtimes = ["deno"] }
"COMPONENTS.md" = { dependencies = ["astro", "svelte", "vue", "react"] }
"BUN.md" = { filenames = ["bun.lock", "bun.lockb", "bunfig.toml"] }

[required_eslint_rules]
js = ["eqeqeq", "no-restricted-syntax", "max-lines", "sonarjs/cognitive-complexity", "import-x/exports-last"]
