[configuration]
title = "Dependencies"
always_selected = true
description = "Dependency health: known advisories, one version for each dependency, exact pins, one package manager, and a lockfile that matches its manifest."

[detect]
project_files = ["package.json"]
filenames = ["pyproject.toml", "Package.swift", "Cargo.toml", "go.mod", "Gemfile"]

[files]
filenames = ["package.json", "bun.lock", "bun.lockb", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bunfig.toml", ".npmrc", "pnpm-workspace.yaml", "pyproject.toml", "uv.lock", "requirements*.txt", "Package.swift", "Package.resolved", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "Gemfile.lock"]
kinds = ["source", "generated"]

[[tool]]
name = "osv-scanner"
version = "2.6.0"
min_version = "2.0.0"
mise = "osv-scanner"
brew = "osv-scanner"
github = {name = "google/osv-scanner", version = "v2.6.0"}
winget = "Google.OSVScanner"
scoop = "osv-scanner"

[[tool.replace]]
file = "osv-scanner.toml"

[[tool]]
name = "syncpack"
version = "15.3.3"
npm = "syncpack"
mise = "npm:syncpack"

[[tool.replace]]
file = ".syncpackrc"

[[tool.replace]]
file = ".syncpackrc.json"

[[tool.replace]]
file = ".syncpackrc.yaml"

[[tool.replace]]
file = ".syncpackrc.yml"

[[tool.replace]]
file = ".syncpackrc.ts"

[[tool.replace]]
file = ".syncpackrc.mjs"

[[tool.replace]]
file = ".syncpackrc.js"

[[tool.replace]]
file = ".syncpackrc.cjs"

[[tool.replace]]
file = "syncpack.config.js"

[[tool.replace]]
file = "syncpack.config.cjs"

[[tool.replace]]
file = "syncpack.config.mjs"

[[tool.replace]]
file = "syncpack.config.ts"

[[config]]
target = ".gspot/config/osv-scanner.toml"
tool = "osv-scanner"

[[config]]
target = ".gspot/config/syncpack.json"
tool = "syncpack"
generated_header = false

[[check]]
name = "osv"
title = "Scan dependencies for advisories"
example = "A locked dependency version affected by a published OSV advisory reports the package and advisory. Upgrade to a reviewed fixed version and update the lockfile, then rescan."
level = "recommended"
stage = "push"
runs = "once"
needs = ["network"]
files = {filenames = ["bun.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "go.mod", "Cargo.lock", "Gemfile.lock", "gems.locked", "requirements.txt", "Pipfile.lock", "poetry.lock", "pdm.lock", "pylock.toml", "uv.lock", "pom.xml", "gradle.lockfile", "buildscript-gradle.lockfile", "conan.lock", "pubspec.lock", "mix.lock", "cabal.project.freeze", "stack.yaml.lock", "composer.lock", "renv.lock", "packages.config", "packages.lock.json", "*.deps.json"], paths = ["**/gradle/verification-metadata.xml", "gradle/verification-metadata.xml"], kinds = ["source", "generated"]}
# The private tool lockfiles under .gspot stay out: a repository cannot upgrade a package that a gspot tool pins.
command = ["osv-scanner", "scan", "source", "--config", "{config:osv-scanner}", "--format", "json", "--allow-no-lockfiles", "--recursive", "--experimental-exclude", ".gspot", "{root}"]
output = {format = "json", items = "results", children = "packages.vulnerabilities", fields = {file = "source.path", rule = "id", message = "package.name package.version summary"}}
summary = "Looks up every locked dependency in the Open Source Vulnerabilities (OSV) advisory database."
why = "An advisory identifies a vulnerability in a dependency version."
help = "Upgrade the package the finding names. When no fix exists, accept the advisory with `gspot ignore dependencies/osv --rule <advisory-id> --reason \"<why>\" --until <YYYY-MM-DD>`. Recheck it before that date."

[[check]]
name = "syncpack"
title = "Keep one version of each dependency"
example = "Two workspace manifests declaring different versions of a dependency governed by the same version group report a mismatch. Align both declarations to the reviewed version and update the lockfile."
level = "all"
stage = "push"
runs = "once"
command = ["syncpack", "lint", "--config", "{config:syncpack}"]
tool = "syncpack"
files = {filenames = ["package.json"]}
output = {format = "lines"}
summary = "Checks that every workspace package resolves each dependency to one version."
why = "Two versions of one dependency in a workspace mean two behaviors, and a bug that appears in one package only."
help = "Run syncpack fix --config .gspot/config/syncpack.json, or align the versions by hand."

[[check]]
name = "manifests"
title = "Check package manifests"
example = "A dependency declared with a range such as `^1.2.3` reports an unpinned version under the exact-version policy. Pin the actual reviewed lockfile version, then update the lockfile through the package manager."
level = "all"
stage = "commit"
runs = "once"
files = {filenames = ["package.json"]}
summary = "Checks every package.json: exact versions, one packageManager across the workspace, a private root, and one kind of lockfile."
why = "A version range installs a different tree tomorrow, and two package managers produce two trees today."
help = "Pin the version the lockfile holds, name one packageManager, mark a workspace root private, and delete the lockfile of the manager the repository does not use."

[[check]]
name = "lockfile-fresh"
title = "Keep lockfiles current"
example = "Adding a dependency to a package manifest without updating its lockfile reports an outdated lockfile. Run the owning package manager installation, inspect its manifest and lockfile changes, and retain both together."
level = "recommended"
stage = "push"
runs = "once"
summary = "Checks npm, Bun, pnpm, Yarn, and uv lockfiles with isolated native frozen installs."
why = "A lockfile that lags its manifest installs versions nobody reviewed the moment someone runs a plain install."
help = "Run the install of the package manager once and commit the lockfile it writes."

[[check]]
name = "bun-release-age"
title = "Check Bun release age and security scanner"
example = "A Bun project without the required `[install] minimumReleaseAge` reports a missing installation safeguard. Set it to the seconds named in the finding and configure the required scanner under `[install.security]`."
level = "all"
stage = "commit"
runs = "scope"
files = {filenames = ["bunfig.toml", "bun.lock", "bun.lockb"], kinds = ["source", "generated"]}
summary = "Checks each Bun project's bunfig.toml for the required minimum release age and security scanner."
why = "Most malicious releases are pulled within days, so a package nobody installs in its first week rarely harms anybody."
help = "Set [install] minimumReleaseAge in bunfig.toml to the seconds the message names, and the scanner under [install.security]."

[[check]]
name = "lockfile-hosts"
title = "Check lockfile hosts"
example = "A locked package URL pointing to a host outside `dependencies.registry_hosts` reports that host. Resolve the package again from the approved registry, or review and explicitly allow the required host."
level = "recommended"
stage = "commit"
runs = "scope"
files = {filenames = ["package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock"], kinds = ["source", "generated"]}
summary = "Checks that npm, pnpm, Yarn, and text Bun lockfile downloads in each project scope use HTTPS and allowed registry hosts."
why = "A lockfile line that resolves from another host installs code nobody chose, and a review rarely reads lockfiles."
help = "Install the package from the registry again, or add the host to dependencies.registry_hosts."

[[setting]]
name = "dependencies.min_release_age_days"
type = "number"
direction = "floor"
default = 7
summary = "The minimum age in days for releases installed through Bun."

[[setting]]
name = "dependencies.scanner"
type = "string"
direction = "neutral"
default = ""
summary = "The security scanner Bun names in [install.security]. An empty string requires none."

[[setting]]
name = "dependencies.registry_hosts"
type = "list"
direction = "loosening"
default = ["registry.npmjs.org", "registry.yarnpkg.com"]
summary = "The hosts a lockfile may resolve packages from."

[[setting]]
name = "dependencies.ranges_allowed"
type = "list"
direction = "loosening"
default = []
summary = "Manifest allowances with paths and reason fields for version ranges, such as a library others install."
