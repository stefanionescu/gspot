[configuration]
always_selected = true
description = "Dependencies: known advisories, allowed registries, one package manager, a lockfile that matches its dependency file, and one package manager version. Level all adds one version of each package across a workspace."
title = "Dependencies"

[files]
filenames = ["package.json", "bun.lock", "bun.lockb", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bunfig.toml", ".npmrc", "pnpm-workspace.yaml", "pyproject.toml", "uv.lock", "requirements*.txt", "Package.swift", "Package.resolved", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "Gemfile.lock"]
kinds = ["source", "generated"]

[shared_prefixes]
prefixes = ["package", "pnpm"]

[[tool]]
min_version = "2.0.0"
mise = "osv-scanner"
name = "osv-scanner"
replace = ["osv-scanner.toml"]
version = "2.7.0"

[[tool]]
name = "syncpack"
npm = "syncpack"
replace = [".syncpackrc", ".syncpackrc.json", ".syncpackrc.yaml", ".syncpackrc.yml", ".syncpackrc.ts", ".syncpackrc.mjs", ".syncpackrc.js", ".syncpackrc.cjs", "syncpack.config.js", "syncpack.config.cjs", "syncpack.config.mjs", "syncpack.config.ts"]
version = "15.3.3"

[[config_file]]
target = "osv-scanner.toml"
tool = "osv-scanner"

[[config_file]]
target = "syncpack.json"
tool = "syncpack"

[[check]]
example = "A locked package version named in an OSV advisory reports a finding. Upgrade to a fixed version, and update the lockfile."
files = { filenames = ["bun.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "go.mod", "Cargo.lock", "Gemfile.lock", "gems.locked", "requirements.txt", "Pipfile.lock", "poetry.lock", "pdm.lock", "pylock.toml", "uv.lock", "pom.xml", "gradle.lockfile", "buildscript-gradle.lockfile", "conan.lock", "pubspec.lock", "mix.lock", "cabal.project.freeze", "stack.yaml.lock", "composer.lock", "renv.lock", "packages.config", "packages.lock.json", "*.deps.json"], paths = ["**/gradle/verification-metadata.xml"], kinds = ["source", "generated"] }
level = "recommended"
name = "osv-scanner"
needs = ["network"]
runs = "once"
stage = "push"
command = ["osv-scanner", "scan", "source", "--config", "{config_file:osv-scanner}", "--format", "json", "--allow-no-lockfiles", "--recursive", "--experimental-exclude", ".gspot", "{root}"]
help = "Upgrade the package the finding names. When no fix exists, accept the advisory until a recheck date with `gspot ignore dependencies/osv-scanner --rule <advisory-id> --reason \"<why>\" --until <YYYY-MM-DD>`."
output = { format = "json", list = "results", children = "packages.vulnerabilities", fields = { file = "source.path", rule = "id", message = "package.name package.version summary" } }
summary = "Looks up every locked dependency in the Open Source Vulnerabilities (OSV) advisory database."
why = "An advisory identifies a vulnerability in a dependency version."

[[check]]
command = ["syncpack", "lint", "--config", "{config_file:syncpack}"]
example = "Two package.json files that pin different versions of one dependency report a mismatch. Set both to the same version, and update the lockfile."
files = { filenames = ["package.json"] }
help = "Set every package.json to the same version of the dependency, then update the lockfile."
level = "all"
name = "syncpack"
output = { format = "lines" }
runs = "once"
stage = "push"
summary = "Checks that every workspace package resolves each dependency to one version."
why = "Two versions of a dependency in one workspace behave differently, so a bug shows in only one package."

[[check]]
example = "A lockfile URL outside `dependencies.allowed_registries` reports its host. Install the package again from an allowed registry, or add that host to the list."
files = { filenames = ["package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb"], kinds = ["source", "generated"] }
help = "Install the package again from an allowed registry, or add the host to `dependencies.allowed_registries`. Keep the lockfile of one package manager, and delete the others."
level = "recommended"
name = "lockfiles"
runs = "scope"
stage = "commit"
summary = "Checks that npm, pnpm, Yarn, and text Bun lockfile downloads in each scope use HTTPS and an allowed registry host, and that the scope holds the lockfiles of one package manager."
why = "A lockfile line from another host installs code nobody chose, and reviewers rarely read those files."

[[check]]
example = "A `package.json` that asks for `zod ^4.1.0` while `bun.lock` records `^4.0.0` reports `stale-lockfile`. Run `bun install` and commit the lockfile."
files = { filenames = ["package.json", "package-lock.json", "pnpm-lock.yaml", "bun.lock"], kinds = ["source", "generated"] }
help = "Run the install of the package manager, and commit the lockfile it writes."
level = "recommended"
name = "stale-lockfile"
runs = "scope"
stage = "push"
summary = "Checks that each `package.json` declares the dependencies that its npm, pnpm, or Bun lockfile records."
why = "A frozen install in CI stops when package.json and the lockfile disagree, after the push has already landed."

[[check]]
example = "A `packageManager` of `bun@1.4.2` while `mise.toml` pins `bun = \"1.4.3\"` reports `package-manager-pin`. Write one version in both."
files = { filenames = ["package.json"] }
help = "Write the same version of the package manager in packageManager and in mise.toml."
level = "recommended"
name = "package-manager-pin"
runs = "scope"
stage = "push"
summary = "Checks that the `packageManager` field of `package.json` and the mise pin of that package manager name one version."
why = "Tools that read packageManager, such as Corepack, and tools that start the mise pin then run two versions of one package manager."
