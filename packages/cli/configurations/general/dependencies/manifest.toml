[configuration]
always_selected = true
description = "Checks for known advisories, one version per package, exact pins, one package manager, and a lockfile that matches its dependency file."
title = "Dependencies"

[files]
filenames = ["package.json", "bun.lock", "bun.lockb", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bunfig.toml", ".npmrc", "pnpm-workspace.yaml", "pyproject.toml", "uv.lock", "requirements*.txt", "Package.swift", "Package.resolved", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "Gemfile.lock"]
kinds = ["source", "generated"]

[shared_prefixes]
prefixes = ["package", "pnpm"]

[[tool]]
brew = "osv-scanner"
github = { name = "google/osv-scanner", version = "v2.6.0" }
min_version = "2.0.0"
mise = "osv-scanner"
name = "osv-scanner"
replace = ["osv-scanner.toml"]
scoop = "osv-scanner"
version = "2.6.0"
winget = "Google.OSVScanner"

[[tool]]
mise = "npm:syncpack"
name = "syncpack"
npm = "syncpack"
replace = [".syncpackrc", ".syncpackrc.json", ".syncpackrc.yaml", ".syncpackrc.yml", ".syncpackrc.ts", ".syncpackrc.mjs", ".syncpackrc.js", ".syncpackrc.cjs", "syncpack.config.js", "syncpack.config.cjs", "syncpack.config.mjs", "syncpack.config.ts"]
version = "15.3.3"

[[tool_file]]
target = ".gspot/config/osv-scanner.toml"
tool = "osv-scanner"

[[tool_file]]
target = ".gspot/config/syncpack.json"
tool = "syncpack"

[[check]]
example = "A locked package version named in an OSV advisory reports a finding. Upgrade to a fixed version, and update the lockfile."
files = { filenames = ["bun.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "go.mod", "Cargo.lock", "Gemfile.lock", "gems.locked", "requirements.txt", "Pipfile.lock", "poetry.lock", "pdm.lock", "pylock.toml", "uv.lock", "pom.xml", "gradle.lockfile", "buildscript-gradle.lockfile", "conan.lock", "pubspec.lock", "mix.lock", "cabal.project.freeze", "stack.yaml.lock", "composer.lock", "renv.lock", "packages.config", "packages.lock.json", "*.deps.json"], paths = ["**/gradle/verification-metadata.xml", "gradle/verification-metadata.xml"], kinds = ["source", "generated"] }
level = "recommended"
name = "osv-scanner"
needs = ["network"]
runs = "once"
stage = "push"
# The tool project lockfiles under .gspot stay out: a repository cannot upgrade a package that a gspot tool pins.
command = ["osv-scanner", "scan", "source", "--config", "{tool_file:osv-scanner}", "--format", "json", "--allow-no-lockfiles", "--recursive", "--experimental-exclude", ".gspot", "{root}"]
help = "Upgrade the package the finding names. When no fix exists, accept the advisory until a recheck date with `gspot ignore dependencies/osv-scanner --rule <advisory-id> --reason \"<why>\" --until <YYYY-MM-DD>`."
output = { format = "json", items = "results", children = "packages.vulnerabilities", fields = { file = "source.path", rule = "id", message = "package.name package.version summary" } }
summary = "Looks up every locked dependency in the Open Source Vulnerabilities (OSV) advisory database."
why = "An advisory identifies a vulnerability in a dependency version."

[[check]]
command = ["syncpack", "lint", "--config", "{tool_file:syncpack}"]
example = "Two package.json files that pin different versions of one dependency report a mismatch. Set both to the same version, and update the lockfile."
files = { filenames = ["package.json"] }
help = "Run `syncpack fix --config .gspot/config/syncpack.json`, or align the versions by hand."
level = "all"
name = "syncpack"
output = { format = "lines" }
runs = "once"
stage = "push"
summary = "Checks that every workspace package resolves each dependency to one version."
tool = "syncpack"
why = "Two versions of a dependency in one workspace behave differently, so a bug shows in only one package."

[[check]]
example = "npm 10.9.2 in packageManager reports a finding, because it ignores min-release-age. Declare npm 11.17.0 or newer."
files = { filenames = ["package.json"] }
help = "Upgrade the package manager that the root package.json names to the version the finding gives."
level = "recommended"
name = "release-age"
runs = "once"
stage = "commit"
summary = "Checks that the package manager in the root package.json holds back releases newer than dependencies.min_release_age_days."
why = "gspot writes a release hold for each package manager. An older version ignores it and installs a new release the day it appears."

[[check]]
example = "A root package.json without packageManager reports a finding. Declare the package manager and its exact version."
files = { filenames = ["package.json"] }
help = "Name one packageManager in the root package.json."
level = "all"
name = "package-json"
runs = "once"
stage = "commit"
summary = "Checks that the root package.json names a packageManager."
why = "A declared package manager keeps installs and the lockfile format consistent."

[[check]]
example = "A lockfile URL outside `dependencies.allowed_registries` reports its host. Install the package again from an allowed registry, or add that host to the list."
files = { filenames = ["package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb"], kinds = ["source", "generated"] }
help = "Install the package from the registry again, or add the host to dependencies.allowed_registries."
level = "recommended"
name = "lockfiles"
runs = "scope"
stage = "commit"
summary = "Checks that npm, pnpm, Yarn, and text Bun lockfile downloads in each project scope use HTTPS and allowed registry hosts."
why = "A lockfile line from another host installs code nobody chose, and reviewers rarely read those files."
