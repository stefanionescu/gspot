[configuration]
description = "Checks the license of each installed dependency against the allowed list. An allowed-package record with a reason accepts one package."
title = "Licenses"

[files]
filenames = ["package.json", "pyproject.toml"]

[[tool]]
mise = "npm:license-checker-rseidelsohn"
name = "license-checker-rseidelsohn"
npm = "license-checker-rseidelsohn"
replace = [".license-checker.json"]
version = "5.0.1"
version_exit_code = 1
[[tool]]
mise = "pipx:pip-licenses"
name = "pip-licenses"
pypi = "pip-licenses"
version = "5.5.5"

[[check]]
example = "A dependency with a license outside `licenses.allowed` reports a finding for that version. Replace it, or write a `[[licenses.allowed_package]]` record with its name, version, and the license in a reason."
files = { filenames = ["package.json", "pyproject.toml"] }
help = "Replace the package, or write a [[licenses.allowed_package]] record by hand with its name, exact version, and a reason naming the license."
level = "recommended"
name = "allowed"
runs = "once"
stage = "push"
summary = "Compares the license of each installed npm or Python package with the allowed list and package records."
why = "A license the project cannot accept arrives silently with a transitive dependency."
