allowed_words = ["Semgrep", "CSRF"]

[configuration]
always_selected = true
description = "Code in every language a configuration claims: unsafe patterns that Semgrep finds."
title = "Security"

[files]
extensions = [".plist"]
languages = true

[[tool]]
builds = ["macos", "linux"]
min_version = "1.100.0"
name = "semgrep"
pypi = "semgrep"
suppression = { marker = "\\bnosemgrep\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }
version = "1.181.0"
version_command = ["--disable-version-check", "--version"]

[[check]]
command = ["semgrep", "scan", "--strict", "--error", "--metrics", "off", "--disable-version-check", "--no-rewrite-rule-ids", "--quiet", "--json", "{files}"]
example = "`eval(userInput)` matches a rule against dynamic evaluation and reports its ID and location. Parse the input instead, and allow only known operations."
exit_codes = [1, 3]
help = "Change the code the way the message says. Turn one rule off for a path with `gspot ignore security/semgrep --rule <rule> --paths <glob> --reason \"<why>\"`."
level = "recommended"
name = "semgrep"
output = { format = "semgrep" }
stage = "push"
summary = "Runs the Semgrep rules that each configuration ships, and the files in `tools.semgrep.rule_files`, over changed files."
when = { config_file = "semgrep" }
why = "An injection or a logged secret reads like ordinary code, and a pattern rule finds it before a reviewer has to."

[[check]]
command = ["semgrep", "scan", "--strict", "{each:--config:tools.semgrep.registry_packs}", "--error", "--metrics", "off", "--disable-version-check", "--quiet", "--json", "{files}"]
example = "Code that matches a registry rule reports its upstream ID. Fix the code at that location, then rerun with network access."
exit_codes = [1, 3]
help = "Change the code the way the message says, or turn the rule off for a path with `gspot ignore security/semgrep-registry --rule <rule> --reason \"<why>\"`."
level = "recommended"
name = "semgrep-registry"
needs = ["network"]
output = { format = "semgrep" }
stage = "manual"
summary = "Downloads and runs the public Semgrep packs in `tools.semgrep.registry_packs`."
when = { setting = "tools.semgrep.registry_packs" }
why = "The registry packs cover the common vulnerability classes, and their license keeps them out of this package."
