[configuration]
always_selected = true
description = "Layout rules for code: import rules for Python and Swift, and the files that no import rule covers. Level all adds lone files, pass-through folders, shared name prefixes, file and folder clashes, long files, trivial functions, private functions below public ones, bare Swift do blocks, and environment reads outside the environment readers."
title = "Structure"

[files]
languages = true

[[check]]
example = "With `[[import_rule]]` records, a Python file under `app/` that imports `storage.models` from a rule it may not import reports `refused-import`. A code file that no rule covers reports `uncovered-file`."
files = { extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs", ".py", ".pyi", ".swift"], kinds = ["source"] }
help = "Move the code into a rule that may import it, move that rule above, list the rule in `can_import`, or add the file to the paths of a rule."
name = "import-rules"
runs = "scope"
stage = "commit"
summary = "Applies `[[import_rule]]` to Python and Swift imports, and reports code files that no import rule covers. ESLint applies the rules to JavaScript and TypeScript imports."
why = "An import that crosses the layers that the rules describe, or a file outside every rule, breaks the structure that the rules promise."

[[check]]
example = "With TypeScript at level `all`, a `feature/only.ts` alone in its folder reports `lone-file`. Move it up beside related code, and update its imports."
help = "Move the file up beside its neighbors, or use `gspot ignore structure/lone-files` with paths and a reason."
level = "all"
name = "lone-files"
runs = "scope"
stage = "commit"
summary = "Finds a folder that holds one code file and nothing else."
why = "A folder with one file adds a level to every import path and groups nothing."

[[check]]
example = "At level `all`, a `src/models/` whose only entry is `src/models/user/` reports `pass-through-folder`. Move `user/` up to `src/user/`, and update its imports."
help = "Move the inner folder up one level, or use `gspot ignore structure/pass-through-folders` with paths and a reason when a tool or a framework fixes the layout."
level = "all"
name = "pass-through-folders"
runs = "scope"
stage = "commit"
summary = "Finds a folder whose only entry is one folder."
why = "A folder that only holds one folder adds a level to every path and groups nothing."

[[check]]
example = "Sibling files `asset-card.ts`, `asset-list.ts`, and `asset-row.ts` share a repeated prefix. Move them into `asset/` with names `card.ts`, `list.ts`, and `row.ts`, then update imports."
help = "Move the files into a folder named after the shared prefix, or raise `limits.shared_prefix_files` with a reason."
level = "all"
name = "shared-prefixes"
runs = "scope"
stage = "commit"
summary = "Finds sibling files that share a name prefix, such as `asset-card`, `asset-list`, and `asset-row`."
why = "Sibling files with one prefix split a single concept by suffix, and a folder of that name groups them."

[[check]]
example = "A `report.ts` beside a `report/` folder reports a clash. Rename one after its job, and update each reference."
help = "Rename the file or the folder so their names differ."
level = "all"
name = "file-folder-clashes"
runs = "scope"
stage = "commit"
summary = "Finds a file and a folder with the same name, apart from the extension, in the same place, such as `turn.ts` beside `turn/`."
why = "An import of ./turn names both, and a reader cannot tell which one loads."

[[check]]
example = "A Python file over its line limit reports the count. Split it by responsibility."
files = { extensions = [".py", ".pyi", ".sql", ".pgsql", ".psql"], tags = ["shell"], kinds = ["source"] }
help = "Split the file by responsibility, or raise `limits.<language>.file_lines` with a reason."
level = "all"
name = "long-files"
runs = "scope"
stage = "commit"
summary = "Checks the code line count of each Python, SQL and shell file against limits.<language>.file_lines. ESLint and SwiftLint count the other languages."
why = "A long file hides independent responsibilities from the reader."

[[check]]
example = "A Bash function that only calls another reports a finding. Inline the call at each caller, and delete the wrapper."
files = { extensions = [".py", ".swift"], tags = ["shell"], kinds = ["source"] }
help = "Inline the function at its calls and delete it, or import from the module that defines the code and delete the forwarding file. When a function must stay, list its name under `names` in an `[[ignore]]` record with the reason."
level = "all"
name = "trivial-functions"
runs = "scope"
stage = "commit"
summary = "Finds named Python, Swift, and Bash functions at or under `limits.trivial_function_statements`, methods and accessors included, and files whose statements are only imports, re-exports, and aliases."
why = "A function of one statement makes the reader jump for nothing."

[[check]]
example = "A TypeScript file whose `function parseRow` sits below `export function loadRows` reports `private-below-public`. Move `parseRow` above `loadRows`."
files = { extensions = [".py", ".swift", ".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx", ".mts", ".cts"], kinds = ["source"] }
help = "Move each private function above the first public function of its file."
level = "all"
name = "function-order"
runs = "scope"
stage = "commit"
summary = "Finds a private top-level function below a public one in Python, Swift, JavaScript, and TypeScript. A Python name that starts with `_` is private, and so is a Swift function marked `private` or `fileprivate`. In JavaScript and TypeScript, a function declaration or a constant set to a function is private unless the module exports it."
why = "When private functions come first in every file, a reader knows where the public functions of a file start."

[[check]]
example = "A Swift `do { ... }` without `catch` reports `bare-block`. Move its statements into a function named after their step, or remove the `do`."
files = { extensions = [".swift"], kinds = ["source"] }
help = "Move the statements into a function named after their step, or remove the `do` and keep the statements."
level = "all"
name = "bare-blocks"
runs = "scope"
stage = "commit"
summary = "Finds Swift `do` blocks without `catch`. ESLint reports the bare blocks of JavaScript and TypeScript."
why = "A block that only groups statements hides a step that a named function would explain."

[[check]]
example = "A Python file that uses `os.environ` outside `structure.environment_readers` reports a finding. Move that access into an environment reader, and pass the value to callers."
files = { extensions = [".py", ".swift"], tags = ["shell"], kinds = ["source"] }
help = "Move the environment read into a file listed in structure.environment_readers, then pass the value to callers."
level = "all"
name = "environment-readers"
when = { setting = "structure.environment_readers" }
runs = "scope"
stage = "commit"
summary = "Finds environment reads outside the files listed in structure.environment_readers."
why = "Environment reads spread through the code hide which settings a program needs."
