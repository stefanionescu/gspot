[configuration]
always_selected = true
description = "Structural rules that no standard linter ships, for every language: wrappers, barrels, lone files, and size limits."
title = "Structure"

[files]
languages = true

[[check]]
example = "With TypeScript at level `all`, a `feature/only.ts` alone in its folder reports `lone-file`. Move it up beside related code, and update its imports."
help = "Move the file up beside its neighbors, or use `gspot ignore structure/lone-files` with paths and a reason."
level = "all"
name = "lone-files"
runs = "scope"
stage = "commit"
summary = "Finds a folder that holds one code file and nothing else."
why = "A folder with one file adds a level to every import path and groups nothing."

[[check]]
example = "Sibling files `asset-card.ts`, `asset-list.ts`, and `asset-row.ts` share a repeated prefix. Move them into `asset/` with names `card.ts`, `list.ts`, and `row.ts`, then update imports."
help = "Move the files into a folder named after the shared prefix, or allow the set with a reason."
level = "all"
name = "shared-prefixes"
runs = "scope"
stage = "commit"
summary = "Finds sibling files that share a name prefix, such as `asset-card`, `asset-list`, and `asset-row`."
why = "Sibling files with one prefix split a single concept by suffix, and a folder of that name groups them."

[[check]]
example = "A `report.ts` beside a `report/` folder reports a clash. Rename one after its job, and update each reference."
help = "Rename the file or the folder so their stems differ."
level = "all"
name = "file-folder-clashes"
runs = "scope"
stage = "commit"
summary = "Finds a file and a folder with one stem in the same place, such as `turn.ts` beside `turn/`."
why = "An import of ./turn names both, and a reader cannot tell which one loads."

[[check]]
example = "A Python file over its line limit reports the count. Split it by responsibility."
files = { extensions = [".sh", ".bash", ".zsh", ".bats", ".py", ".pyi", ".sql", ".pgsql", ".psql"], tags = ["shebang:shell"], kinds = ["source"] }
help = "Split the file by responsibility, or raise limits.`<language>`.file_lines with a reason."
level = "all"
name = "long-files"
runs = "scope"
stage = "commit"
summary = "Checks the code line count of each file against the limit for its language."
why = "A long file hides independent responsibilities from the reader."

[[check]]
example = "A Bash function that only calls another reports a finding. Inline the call at each caller, and delete the wrapper."
files = { extensions = [".ts", ".tsx", ".js", ".mjs", ".cjs", ".py", ".swift", ".sh", ".bash", ".zsh", ".bats"], tags = ["shell"], kinds = ["source"] }
help = "Inline a forwarding function at its calls and delete it. Split independent statements into the files that use them."
level = "all"
name = "trivial-functions"
runs = "scope"
stage = "commit"
summary = "Finds functions with too few statements and files that only forward to other code."
why = "A function of one statement makes the reader jump for nothing."

[[check]]
example = "A Python file that uses `os.environ` outside `architecture.roles.environment_readers` reports a finding. Move that access into an environment reader, and pass the value to callers."
files = { extensions = [".py", ".swift", ".sh", ".bash", ".zsh", ".bats"], tags = ["shell"], kinds = ["source"] }
help = "Move the environment read into a file listed in architecture.roles.environment_readers, then pass the value to callers."
level = "all"
name = "environment-readers"
runs = "scope"
stage = "commit"
summary = "Finds environment reads outside the files listed in architecture.roles.environment_readers."
why = "Environment reads spread through the code hide which settings a program needs."
