[configuration]
always_selected = true
description = "Tracked files: large files outside Git LFS, and paths that a configuration keeps out of Git."
title = "Repository"

[[check]]
example = "A tracked `notes/big.txt` over `repository.max_file_kilobytes` reports `size`. Delete the file, or store it through Git LFS."
help = "Track the file with Git LFS, classify it as generated or vendored in .gitattributes, or raise repository.max_file_kilobytes with a reason."
name = "large-files"
runs = "once"
stage = "commit"
summary = "Checks that each tracked file over the size limit goes through Git LFS or has a reason."
why = "A large file in plain Git history stays in every clone forever."

[[check]]
example = "A tracked `.env` reports `tracked-file`. Add the path to `.gitignore`, then run `git rm --cached .env`, which keeps the file on disk."
help = "Add the reported file or folder to .gitignore and remove it from the index with `git rm --cached`."
name = "local-files"
runs = "once"
stage = "commit"
summary = "Reports a tracked file at a path that a configuration keeps out of Git, and each tracked symbolic link that leaves the repository."
why = "Machine-local values and installed packages belong outside shared Git history."

[[check]]
example = "A tracked Latin-1 notes.md reports encoding. Save the file as UTF-8."
help = "Save the reported file as UTF-8, then run the check again."
name = "encoding"
runs = "once"
stage = "commit"
summary = "Checks that tracked text files use UTF-8."
why = "Every text check must read the same characters."
