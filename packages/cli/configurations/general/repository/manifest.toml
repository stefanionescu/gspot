[configuration]
title = "Repository"
always_selected = true
description = "Checks the files that Git tracks and their storage."

[[check]]
name = "large-files"
title = "Keep large files out of git"
example = "A tracked `notes/big.txt` containing 1,100 KiB exceeds the default 1,024 KiB ceiling and reports `size`. Remove accidental content or store a required large file through Git LFS. Generated and vendored classifications must describe the actual file ownership."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that every tracked file over the size limit is stored through LFS or declared with a reason."
why = "A large file in plain git history stays in every clone for good."
help = "Track the file with git lfs, classify it with gspot set generated `<path>` or gspot set vendored `<path>`, or raise limits.file_kb with a reason."

[[check]]
name = "tracked-files"
title = "Keep local and installed files out of Git"
example = "A tracked .env or node_modules/example/index.js reports tracked-file. Add its path to .gitignore and run git rm --cached on that file, preserving its local contents."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks tracked files against the paths that selected configurations declare untracked."
why = "Machine-local values and installed packages belong outside shared Git history."
help = "Add the reported file or folder to .gitignore and remove it from the index with git rm --cached."

[[setting]]
name = "limits.file_kb"
type = "number"
direction = "ceiling"
default_all = 1024
default = 1024
summary = "The largest file Git may track, in kilobytes. Larger files need Git LFS or a generated or vendored entry."
