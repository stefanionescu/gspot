products = ["gspot"]
[configuration]
title = "gspot"
always_selected = true
description = "The checks gspot runs on policy layout and generated files."

[[tool]]
name = "node"
version = "24.20.0"
min_version = "24.2.0"
version_command = ["--version"]
mise = "node"
brew = "node@24"
winget = "OpenJS.NodeJS.LTS"

[[check]]
name = "policy-layout"
title = "Keep canonical policy layout"
example = "A hand-edited policy with separated tables reports a layout finding. Run gspot check --fix --only gspot/policy-layout to regroup its tables and retain their comments."
level = "recommended"
stage = "commit"
files = { paths = ["gspot.toml"] }
summary = "Compares gspot.toml with the canonical policy writer."
why = "One policy layout keeps related settings and their reasons together."
help = "Run gspot check --fix --only gspot/policy-layout."

[[check]]
name = "drift"
title = "Keep generated files matching the policy"
example = "A file under `.gspot/config/` edited by hand differs from what gspot writes from gspot.toml and reports drift. Change the policy in gspot.toml and run gspot apply, or move the edited file aside so apply writes it again."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Compares every generated file with what gspot writes from the policy: a changed, missing, or stray file, or one with merge conflict markers, is a finding."
why = "A generated file that no longer matches the policy runs a tool with settings nobody chose."
help = "Change the policy in gspot.toml, then run gspot apply. After a merge, run gspot apply and then gspot install."

[[check]]
name = "unmatched-paths"
title = "Find policy paths that match nothing"
example = "An `[[ignore]]` entry for `bash/shellcheck` with `paths = [\"nowhere/**\"]` reports `unmatched-pattern` when that path matches no selected file. Remove the obsolete entry or correct its path to the actual exception, preserving its reason."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks policy path patterns against tracked files."
why = "An ignore or declaration that matches nothing misleads the next reader."
help = "Remove the entry or correct its path."


[[check]]
name = "policy"
title = "Check declared policy values"
example = "An unknown setting or a loosened limit without a reason reports its gspot.toml key path. Correct the declaration or record the required reason."
level = "recommended"
stage = "commit"
runs = "once"
files = { paths = ["gspot.toml"] }
summary = "Reports invalid policy declarations while the remaining valid checks run."
why = "A setting no check reads, or an unexplained loosening, can leave repository policy unenforced."
help = "Correct the gspot.toml key path named by the finding and retain a reason for each loosening."

[[check]]
name = "suppressions"
title = "Explain each suppression"
example = "An `eslint-disable-next-line` comment without a reason reports an unexplained suppression. Fix the underlying finding and remove the suppression, or append a specific `-- reason: ...` explanation of the required exception."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks suppression reasons; Semgrep and Vale directives are refused outright."
why = "A suppression with no reason hides a finding nobody reviewed."
help = "Use the tool's suppression syntax to write a meaningful reason, or fix the finding and remove the suppression."
