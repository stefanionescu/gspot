allowed_words = ["gspot"]
[configuration]
always_selected = true
description = "Checks gspot.toml, generated files, and suppression reasons, and requires Node.js as a system tool."
title = "gspot"

[[tool]]
brew = "node@24"
install_hint = "Install Node.js 24.2.0 or newer. On macOS, run brew install node@24. On Windows, run winget install OpenJS.NodeJS.LTS."
min_version = "24.2.0"
name = "node"
system = true
version_command = ["--version"]
winget = "OpenJS.NodeJS.LTS"

[[check]]
example = "An edit by hand to a tool file under `.gspot/config/` reports drift. Move the change into gspot.toml, then run `gspot apply`."
help = "Change gspot.toml, then run `gspot apply`. After a merge, run `gspot apply`, followed by `gspot install`."
level = "recommended"
name = "generated-files"
runs = "once"
stage = "commit"
summary = "Compares generated files with the settings and reports changed, missing, and stray ones, and any with merge conflict markers."
why = "A generated file that drifts from gspot.toml runs a tool with settings nobody chose."

[[check]]
example = "An `[[ignore]]` record with `paths = [\"nowhere/**\"]` that matches no file reports `unmatched-pattern`. Remove the record, or correct its path and keep the reason."
help = "Remove the record or correct its path."
level = "recommended"
name = "unmatched-patterns"
runs = "once"
stage = "commit"
summary = "Checks settings path patterns against tracked files."
why = "An ignore or declaration that matches nothing misleads the next reader."

[[check]]
example = "An `eslint-disable-next-line` comment without a reason reports a finding. Fix the code and remove the comment, or append `-- reason: ...` that explains the exception."
help = "Fix the finding and remove the suppression, or add a reason in the syntax of the tool. Never suppress a size or complexity limit: split the code by its steps, or ask the user to raise it in gspot.toml."
level = "recommended"
name = "suppressions"
runs = "once"
stage = "commit"
summary = "Reports suppressions with no reason, any that lift a size or complexity limit, and Semgrep or Vale directives."
why = "A suppression with no reason hides a finding nobody reviewed."
