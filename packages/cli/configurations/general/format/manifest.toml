allowed_words = ["Prettier"]

[configuration]
always_selected = true
description = "A single `[format]` block for every formatter, so Prettier, shfmt, Ruff, and markdownlint use the same indentation."
title = "Format"

[files]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".json", ".jsonc", ".json5", ".md", ".mdx", ".css", ".scss", ".html", ".yml", ".yaml", ".vue", ".graphql"]
prettier_plugins = true

[[tool]]
crash_pattern = "\\[error\\] (?:No parser|Cannot find|Invalid)"
name = "prettier"
npm = "prettier"
replace = [".prettierrc", ".prettierrc.json", ".prettierrc.yml", ".prettierrc.yaml", ".prettierrc.json5", ".prettierrc.js", "prettier.config.js", ".prettierrc.ts", "prettier.config.ts", ".prettierrc.mjs", "prettier.config.mjs", ".prettierrc.mts", "prettier.config.mts", ".prettierrc.cjs", "prettier.config.cjs", ".prettierrc.cts", "prettier.config.cts", ".prettierrc.toml", ".prettierignore"]
version = "3.8.1"
[[tool.replace_key]]
file = "package.json"
key = "prettier"
[[tool.replace_key]]
file = "package.yaml"
key = "prettier"
[[tool]]
brew = "editorconfig-checker"
github = { name = "editorconfig-checker/editorconfig-checker", version = "v3.4.0" }
mise = { name = "github:editorconfig-checker/editorconfig-checker", version = "3.4.0", options = { rename_exe = "editorconfig-checker" } }
name = "editorconfig-checker"
replace = [".editorconfig"]
version = "3.4.0"
[[tool_file]]
target = ".editorconfig"
tool = ["editorconfig-checker", "prettier"]

[[tool_file]]
pointer = { path = "prettier.config.mjs", when = { configuration = "javascript" }, body = '''
import { readFileSync } from 'node:fs';
import { dirname, isAbsolute, relative, resolve } from 'node:path';
import { fileURLToPath } from 'node:url';

const toolFile = new URL({target_json}, import.meta.url);
const options = JSON.parse(readFileSync(toolFile, 'utf8'));
const folder = dirname(fileURLToPath(toolFile));
const root = dirname(fileURLToPath(import.meta.url));
const movePattern = (pattern) => {
    const negated = pattern.startsWith('!');
    const value = negated ? pattern.slice(1) : pattern;
    if (!value.includes('/') || isAbsolute(value)) return pattern;
    return (negated ? '!' : '') + relative(root, resolve(folder, value)).replaceAll('\\', '/');
};
const moveSelectors = (selectors) => Array.isArray(selectors) ? selectors.map(movePattern) : movePattern(selectors);
if (options.plugins !== undefined) {
    options.plugins = options.plugins.map((plugin) => plugin.startsWith('.') ? fileURLToPath(new URL(plugin, toolFile)) : plugin);
}
if (options.overrides !== undefined) {
    options.overrides = options.overrides.map((entry) => ({
        ...entry,
        files: moveSelectors(entry.files),
        ...(entry.excludeFiles === undefined ? {} : { excludeFiles: moveSelectors(entry.excludeFiles) }),
    }));
}
export default options;
''' }
target = ".gspot/config/prettier.json"
tool = "prettier"

[[tool_file]]
target = ".prettierignore"
tool = "prettier"

[[check]]
command = ["prettier", "--check", "--config", "{tool_file:prettier}", "--ignore-path", ".prettierignore", "--log-level", "warn", "{files}"]
example = "A JavaScript file with `const value={enabled:true};` differs from the Prettier output. Run `gspot check --fix` to format it."
exit_codes = [1]
fix = ["prettier", "--write", "--config", "{tool_file:prettier}", "--ignore-path", ".prettierignore", "--log-level", "warn", "{files}"]
help = "Run `gspot check --fix` to format every file, or `prettier --write` on one file."
level = "recommended"
name = "prettier"
output = { format = "regex", pattern = "^\\[warn\\] (?<file>[^\\s].*[^\\s.])$", message = "Not formatted the way Prettier formats it." }
stage = "commit"
summary = "Checks each file Prettier handles for unformatted code."
why = "Formatting by hand differs by editor; one formatter keeps diffs about the change and not the spacing."

[[check]]
command = ["editorconfig-checker", "-no-color", "-disable-indentation", "{files}"]
example = "A file with CRLF line endings under an `.editorconfig` that requires LF reports a finding. Save it with LF endings."
files = { paths = ["**"] }
help = "Fix the line the checker names; most editors apply .editorconfig on save."
level = "recommended"
name = "editorconfig-checker"
output = { format = "grouped", file_pattern = "^(?<file>.+):$", pattern = "^\\s+(?:(?<line>\\d+)(?:-\\d+)?: )?(?<message>\\S.*)$" }
stage = "commit"
summary = "Checks line endings, final newlines, and trailing whitespace in every file against .editorconfig."
tool = "editorconfig-checker"
why = "These rules cover the files no formatter touches, so a stray tab or missing newline never lands in a diff. The formatters handle indentation."
