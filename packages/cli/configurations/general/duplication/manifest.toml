[configuration]
always_selected = true
description = "Reports copied code across every language a configuration claims."
title = "Duplication"

[files]
languages = true

[[tool]]
name = "jscpd"
npm = "jscpd"
replace = [".jscpd.json"]
version = "5.2.0"

[[tool_file]]
target = "jscpd.json"
tool = "jscpd"

[[check]]
example = "Two files with the same long block of code report that block. Move it into one function, and call it from both places."
files = { languages = true }
help = "Move the shared block into one function both callers use."
level = "all"
name = "jscpd"
runs = "scope"
stage = "push"
summary = "Reports every block of code copied between files, naming both places."
tool = "jscpd"
why = "A fix in one place leaves the copied block broken in the other."
