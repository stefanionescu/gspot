[configuration]
title = "Duplication"
opt_in = true
description = "Copy-paste detection across every language a selected configuration claims, with a ceiling for the share of duplicated lines."

[files]
languages = true

[[tool]]
name = "jscpd"
version = "5.2.0"
npm = "jscpd"
mise = "npm:jscpd"

[[tool.replace]]
file = ".jscpd.json"

[[config]]
target = ".gspot/config/jscpd.json"
tool = "jscpd"
generated_header = false

[[check]]
name = "jscpd"
title = "Find copied code"
example = "Two selected files containing the same substantial code block can exceed the configured duplication threshold. Move the shared behavior into its actual owner and call it from both locations, then rerun."
level = "all"
stage = "push"
runs = "scope"
tool = "jscpd"
summary = "Finds blocks of code copied between files. While the duplicated share stays at or under the ceiling it passes, and over it every copy is a finding that names both places."
why = "A copied block is fixed in one place and stays broken in the other."
help = "Move the shared block into one function both callers use, or raise limits.duplication.percent with a reason."

[[setting]]
name = "limits.duplication.min_lines"
type = "number"
direction = "ceiling"
default = 8
summary = "The fewest lines a copied block has before it counts."

[[setting]]
name = "limits.duplication.min_tokens"
type = "number"
direction = "ceiling"
default = 40
summary = "The fewest tokens a copied block has before it counts."

[[setting]]
name = "limits.duplication.percent"
type = "number"
direction = "ceiling"
default = 4
summary = "The largest share of duplicated lines the check accepts, as a number out of 100."

[[setting]]
name = "tools.jscpd.exclude"
type = "list"
direction = "loosening"
default = []
summary = "Paths the duplication check skips, each with a reason."
