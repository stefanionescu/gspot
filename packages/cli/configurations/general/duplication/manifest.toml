[[check]]
example = "Two selected files containing the same substantial code block report that copied block. Move the shared behavior into its actual owner and call it from both locations, then rerun."
files = { languages = true }
help = "Move the shared block into one function both callers use."
level = "all"
name = "jscpd"
runs = "scope"
stage = "push"
summary = "Reports every block of code copied between files, naming both places."
tool = "jscpd"
why = "A copied block is fixed in one place and stays broken in the other."
