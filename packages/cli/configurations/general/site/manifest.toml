[configuration]
title = "Static Site"
requires = ["html"]
suggests = ["css", "javascript"]
description = "A site built to a folder and served as files: the build, its output, its links, its weight, its sitemap."

[detect]
paths = ["site.webmanifest", "sitemap.xml"]

[files]
filenames = ["site.webmanifest", "sitemap.xml", "robots.txt"]
extensions = [".svg"]

[[tool]]
name = "linkinator"
version = "8.1.0"
npm = "linkinator"
replaces = ["linkinator.config.json"]

[[tool]]
name = "svgo"
version = "4.1.0"
npm = "svgo"

[[tool]]
name = "purgecss"
version = "7.0.2"
npm = "purgecss"

[[tool_file]]
target = ".gspot/config/html-validate-built.json"
per_scope = true
tool = "html-validate"
check = "site/html-validate"
rule_keys = ["rules"]
generated_header = false

[[tool_file]]
source = "purgecss.config.mjs.eta"
target = ".gspot/config/purgecss.config.mjs"
per_scope = true
tool = "purgecss"
check = "site/purgecss"

[[check]]
name = "build"
title = "Build the site"
example = "If the configured site build imports a missing template, the build check reports the command failure. Correct the template import or restore the template, then rerun the same configured build."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Runs the build command of the site and fails when it fails or writes no output folder."
why = "Every other output check reads what the build wrote, so a broken build hides all of them."
help = "Run the build command by hand and fix what it prints. Name the command under site.build_command."

[[check]]
name = "build-reproducible"
title = "Check reproducible site builds"
example = "A build that embeds the current timestamp produces different bytes across repeated builds. Remove the timestamp from generated output or derive it from a stable declared input, then rerun the reproducibility check."
level = "all"
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Builds the site twice and compares the two outputs file by file."
why = "A build that differs from run to run cannot be cached, compared, or trusted to hold what was reviewed."
help = "Take the timestamp, the random value, or the unordered list out of the build."

[[check]]
name = "html-validate"
tool = "html-validate"
title = "Validate built HTML"
example = "A template emitting `<img src=\"logo.png\">` without alternative text can produce an accessibility finding in the built HTML. Add meaningful `alt` text in the template, or `alt=\"\"` for a decorative image, and rebuild."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Validates every built page with html-validate."
why = "Templates can each be valid and still join into a page with two main elements or a missing label."
help = "Fix the template or the content that writes the markup the rule names."

[[check]]
name = "purgecss"
tool = "purgecss"
title = "Find unused selectors"
example = "A built stylesheet containing `.unused-banner` that no scanned HTML or script uses reports an unused selector. Delete the unused rule. For a class added at runtime, declare the actual class in the configured safelist with a reason."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Finds selectors of the built stylesheets that no built page or script uses."
why = "A selector nobody uses is downloaded by every visitor and read by every maintainer."
help = "Delete the rule, or list a name a script adds at run time under tools.purgecss.safelist with a reason."

[[check]]
name = "linkinator"
tool = "linkinator"
title = "Check internal site links"
example = "A built page linking to `/missing/` reports a missing destination when no such page exists. Point the source link at an existing page or add the intended page, then rebuild."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Serves the built site and follows every link between its pages, stylesheets, and fragments."
why = "A broken internal link is a dead end a visitor finds before the author does."
help = "Fix the link, or the page it points at."

[[check]]
name = "linkinator-external"
tool = "linkinator"
title = "Check external site links"
example = "A built link to an external URL that responds with HTTP 404 reports a link failure. Replace it with the verified destination or remove the obsolete link, then rerun with network access."
level = "recommended"
stage = "manual"
runs = "scope"
needs = ["network"]
summary = "Follows every link of the built site, the ones that leave it included."
why = "Other sites move their pages, and a link nobody rechecks rots."
help = "Update the link. Skip a host that refuses crawlers under tools.linkinator.exclude_urls with a reason."

[[check]]
name = "size"
title = "Check site size limits"
example = "A built page larger than its configured byte ceiling reports its measured size. Remove unused assets or reduce the page payload, rebuild, and rerun to verify it fits the ceiling."
level = "recommended"
when = { setting = "site.max_kilobytes" }
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Sums the compressed weight of the output paths each ceiling in site.max_kilobytes names."
why = "Weight arrives a kilobyte at a time, and only a ceiling notices."
help = "Remove what the page does not need, or raise the ceiling with a reason."

[[check]]
name = "sitemap"
title = "Match the sitemap to the built pages"
example = "A sitemap entry for `/removed/` with no corresponding built page reports a stale entry. Remove that entry from the sitemap source and rebuild. Add missing public pages to the sitemap instead of excluding them without a reason."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["build"]
summary = "Compares the sitemap with the output: every listed route is a built page, and every built page is listed."
why = "A page outside the sitemap is found late by search engines, and a listed page that does not exist costs trust with them."
help = "Add the page to the sitemap, remove the dead entry, or leave a page out under site.sitemap_exclude."

[[check]]
name = "dead-assets"
title = "Find unused assets"
example = "An image in the output directory that no built page or stylesheet references reports an unused asset. Remove it from the source asset set and rebuild."
level = "all"
stage = "push"
runs = "scope"
files = { paths = ["**/*"], kinds = ["source", "binary"] }
summary = "Finds files under an assets folder that no page, stylesheet, or script names."
why = "An asset nobody references ships with every deploy and is kept by everyone who fears deleting it."
help = "Delete the file."

[[check]]
name = "svgo"
tool = "svgo"
title = "Optimize SVG assets"
example = "An SVG containing removable editor metadata differs from optimized output. Run the configured SVGO formatter on its source, inspect the result, and rebuild before checking again."
level = "recommended"
stage = "commit"
files = { extensions = [".svg"] }
fix = ["svgo", "--quiet", "{files}"]
summary = "Reports SVG byte reductions above tools.svgo.min_saving_percent, which defaults to 10 at level `recommended` and 0 at level `all`."
why = "An SVG straight from an editor carries metadata and precision a browser never needs."
help = "Run svgo over the file."

[[check]]
name = "webmanifest"
title = "Validate the web app manifest"
example = "A web manifest referencing `icon-192.png` reports a missing icon when no such file sits beside the manifest. Add the icon to the build or correct the manifest path, then rebuild."
level = "recommended"
stage = "commit"
runs = "scope"
files = { extensions = [".webmanifest", ".html", ".htm", ".json"] }
summary = "Checks that the web manifest parses, names the app, and lists icons that exist."
why = "A manifest with a missing icon installs an app with a blank tile."
help = "Correct the manifest, or add the icon."

[[setting]]
name = "tools.svgo.min_saving_percent"
type = "number"
direction = "ceiling"
default = 10
default_all = 0
summary = "Report an SVG when optimization saves more than this percentage of its UTF-8 bytes."
validation = { minimum = 0, maximum = 100 }

[[setting]]
name = "site.build_command"
type = "list"
items = "string"
direction = "neutral"
default = ["npm", "run", "build"]
summary = "The build script run by the repository package manager, unless an authored command replaces it."

[[setting]]
name = "site.build_folder"
type = "path"
path_role = "destination"
direction = "neutral"
default = "dist"
summary = "The folder the build writes."

[[setting]]
name = "site.max_kilobytes"
type = "list"
items = { paths = { type = "list", items = "string" }, kb = { type = "number", validation = { minimum = 0, integer = true } } }
direction = "tightening"
default = []
summary = "Weight ceilings: the output paths, and the most kilobytes they may weigh compressed."

[[setting]]
name = "site.sitemap_exclude"
type = "list"
items = "string"
direction = "loosening"
default = ["404.html"]
summary = "Built pages the sitemap leaves out on purpose."

[[setting]]
name = "tools.purgecss.safelist"
type = "table"
direction = "loosening"
default = {}
summary = "Class names a script adds at run time: the names and the reason."
