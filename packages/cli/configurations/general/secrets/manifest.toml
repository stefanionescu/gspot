products = ["gitleaks"]

[configuration]
title = "Secrets"
always_selected = true
description = "Checks environment files and examples, scans staged changes and pushed commits for secrets, and requires reasons for allowed values."

[files]
paths = ["**"]
kinds = ["source", "generated", "vendored", "binary"]

[[tool]]
name = "gitleaks"
version = "8.30.1"
min_version = "8.25.0"
mise = "gitleaks"
brew = "gitleaks"
github = { name = "gitleaks/gitleaks", version = "v8.30.1" }
winget = "Gitleaks.Gitleaks"
scoop = "gitleaks"
version_command = ["version"]
replaces = [".gitleaks.toml", "gitleaks.toml"]

[[tool]]
name = "trufflehog"
crash_pattern = '"level"\s*:\s*"error"'
version = "3.97.5"
mise = "trufflehog"
brew = "trufflehog"
github = { name = "trufflesecurity/trufflehog", version = "v3.97.5" }

[[tool]]
name = "dotenv-linter"
version = "4.0.0"
mise = "github:dotenv-linter/dotenv-linter"
brew = "dotenv-linter"
cargo = "dotenv-linter"
github = { name = "dotenv-linter/dotenv-linter", version = "v4.0.0" }

[[tool_file]]
target = ".gspot/config/gitleaks.toml"
tool = "gitleaks"

[[check]]
name = "gitleaks-staged"
title = "Scan staged changes for secrets"
example = "A staged credential reports a secret finding. Remove the credential from source, load it from the configured environment owner, and stage the correction. If the credential has been exposed, rotate it at its provider."
level = "recommended"
stage = "commit"
runs = "once"
when = { git = true }
command = ["gitleaks", "git", "--staged", "--no-banner", "--redact", "--exit-code", "1", "--config", "{tool_file:gitleaks}", "--report-format", "json", "--report-path", "-", "{root}"]
output = { format = "json", fields = { file = "File", line = "StartLine", column = "StartColumn", rule = "Fingerprint", message = "Description" } }
summary = "Scans the staged change for keys, tokens, and passwords before the commit exists."
why = "A secret that reaches a commit stays in history after the line is deleted, and every clone holds it."
help = "Remove the value and load it from the environment. For a reviewed public value, use gspot ignore with its reported fingerprint and a reason."

[[check]]
name = "gitleaks-pushed"
title = "Scan pushed commits for secrets"
example = "A credential in an earlier commit still reports after it is deleted from the working tree. Rotate the credential and remove it from the affected history, coordinating any rewrite of shared commits. Rerun the history scan."
level = "recommended"
stage = "push"
runs = "history"
when = { git = true }
tool = "gitleaks"
output = { format = "json", file_type = "history", fields = { file = "File", line = "StartLine", column = "StartColumn", rule = "Fingerprint", message = "Description" } }
summary = "Scans every commit about to be pushed for keys, tokens, and passwords."
why = "A commit made past the hook still reaches the shared branch unless the push checks it."
help = "Rewrite the commit that holds the value and rotate the secret. For a reviewed historical example, use gspot ignore secrets/gitleaks-pushed --rule `<fingerprint>` --reason \"...\"."

[[check]]
name = "gitleaks-files"
title = "Scan the files for secrets"
example = "In a folder with no git, a credential in a source file reports a secret finding. Remove the credential from source and load it from the configured environment owner. If the credential has been exposed, rotate it at its provider."
level = "recommended"
stage = "commit"
runs = "once"
when = { git = false }
command = ["gitleaks", "dir", "--no-banner", "--redact", "--exit-code", "1", "--config", "{tool_file:gitleaks}", "--report-format", "json", "--report-path", "-", "."]
output = { format = "json", fields = { file = "File", line = "StartLine", column = "StartColumn", rule = "Fingerprint", message = "Description" } }
summary = "Scans every file of a folder that has no git for keys, tokens, and passwords."
why = "Without git there is no staged change to scan, so the files themselves are the only place a secret can be caught."
help = "Remove the value and load it from the environment. For a reviewed public value, use gspot ignore with its reported fingerprint and a reason."

[[check]]
name = "trufflehog"
title = "Verify detected secrets"
example = "A committed credential that its provider confirms as active reports a verified secret. Revoke or rotate it at the provider and remove it from the affected history."
level = "recommended"
stage = "push"
runs = "history"
needs = ["network"]
when = { git = true }
tool = "trufflehog"
exit_codes = [183]
output = { format = "trufflehog-json", file_type = "history" }
summary = "Verifies candidate secrets in the pushed commits against the service that issued them."
why = "A verified secret is live right now, which makes it the finding to act on first."
help = "Rotate the secret at its provider, then rewrite the commit that holds it."

[[check]]
name = "env-files"
title = "Keep environment files out of git"
example = "A tracked `.env` file reports a secret-file policy finding. Keep a template with keys and no secret values, add `.env` to `.gitignore`, and run `git rm --cached .env` to stop tracking it while preserving the local file."
level = "recommended"
stage = "commit"
runs = "once"
summary = "Checks that git tracks no environment file except the example files."
why = "An environment file holds the values of one machine, and most of them are secrets."
help = "Run git rm --cached `<file>`, add it to .gitignore, and keep an example such as .env.example with the keys and no values."

[[check]]
name = "dotenv-linter"
title = "Lint environment files"
example = "A dotenv file defining the same key twice reports a duplicate entry. Keep the intended assignment and remove the duplicate, preserving secret values outside version control."
level = "recommended"
stage = "commit"
command = ["dotenv-linter", "check", "--plain", "--skip-updates", "{files}"]
fix = ["dotenv-linter", "fix", "--plain", "--no-backup", "{files}"]
files = { filenames = [".env", ".dev.vars"], paths = [".env.*", "**/.env.*", ".dev.vars.*", "**/.dev.vars.*"] }
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+) (?<rule>[A-Za-z]+): (?<message>.*)$" }
summary = "Checks every tracked environment file: key format, duplicates, quoting, ordering, and trailing spaces."
why = "A tracked environment file is a template other people copy; a malformed line there is copied into every machine."
help = "Run gspot check --fix, or fix the line dotenv-linter names."

[[check]]
name = "env-template"
title = "Declare environment reads in example environment files"
example = "Source code reading `API_URL` while the example environment file omits that key reports a missing example entry. Add `API_URL=` to `.env.example` and document the required value without committing credentials."
level = "recommended"
stage = "push"
runs = "scope"
summary = "When an example environment file exists, checks static uppercase keys read through process.env, import.meta.env, Bun.env, Deno.env.get, Python os APIs, and declared reader functions in JavaScript, TypeScript, Python, and component files."
why = "A variable missing from the example file is the one a new machine lacks on its first run."
help = "Add the key to the example file (.env.example or the files under secrets.env_examples), or stop reading it."

[[setting]]
name = "secrets.env_examples"
type = "list"
items = "path"
default = [".env.example", ".env.template", ".env.sample", ".dev.vars.example"]
summary = "The example environment filenames searched for supported environment keys; a key may appear in any one example file."

[[setting]]
name = "secrets.reader_functions"
type = "list"
items = "string"
default = []
summary = "The project functions that read environment keys, in addition to the built-in readers; for example config.$env and read_env."
