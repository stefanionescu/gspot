ignored_paths = ["**/.env", "**/.env.*", "**/.dev.vars", "**/.dev.vars.*"]

[configuration]
always_selected = true
description = "Secrets: environment files and their examples, credentials in staged changes and pushed commits, and a reason for each allowed value."
title = "Secrets"

[files]
kinds = ["source", "generated", "vendored", "binary"]
paths = ["**"]

[[tool]]
min_version = "8.25.0"
mise = "gitleaks"
name = "gitleaks"
replace = [".gitleaks.toml", "gitleaks.toml"]
version = "8.30.1"
version_command = ["version"]

[[tool]]
mise = "github:dotenv-linter/dotenv-linter"
name = "dotenv-linter"
version = "4.0.0"

[[config_file]]
target = "gitleaks.toml"
tool = "gitleaks"

[[check]]
command = ["gitleaks", "git", "--staged", "--no-banner", "--redact", "--exit-code", "1", "--config", "{config_file:gitleaks}", "--report-format", "json", "--report-path", "-", "{root}"]
example = "A staged credential reports a finding. Load it from an environment variable instead, and rotate it if it already leaked."
help = "Remove the value and load it from the environment. For a reviewed public value, run `gspot ignore secrets/gitleaks-staged --rule <fingerprint> --reason \"<why>\"`."
name = "gitleaks-staged"
output = { format = "json", fields = { file = "File", line = "StartLine", column = "StartColumn", rule = "Fingerprint", message = "Description" } }
runs = "once"
stage = "commit"
summary = "Scans the staged change for keys, tokens, and passwords before the commit exists."
when = { git = true }
why = "A secret that reaches a commit stays in history after you delete the line, and every clone holds it."

[[check]]
example = "A credential in an earlier commit still reports after you delete it from the working tree. Rotate it, then remove it from history, and coordinate any rewrite of shared commits."
help = "Rewrite the commit that holds the value and rotate the secret. For a reviewed historical example, use `gspot ignore secrets/gitleaks-pushed --rule <fingerprint> --reason \"<why>\"`."
name = "gitleaks-pushed"
output = { format = "json", fields = { file = "File", line = "StartLine", column = "StartColumn", rule = "Fingerprint", message = "Description" } }
runs = "history"
stage = "push"
summary = "Scans every commit about to be pushed for keys, tokens, and passwords."
tool = "gitleaks"
when = { git = true }
why = "A commit made past the hook still reaches the shared branch unless the push checks it."

[[check]]
command = ["dotenv-linter", "check", "--plain", "--skip-updates", "{files}"]
example = "A dotenv file that defines one key twice reports a duplicate. Keep one line, and delete the other."
files = { filenames = [".env", ".env.*", ".dev.vars", ".dev.vars.*"] }
fix = ["dotenv-linter", "fix", "--plain", "--no-backup", "{files}"]
help = "Run `gspot check --fix`, or fix the line dotenv-linter names."
name = "dotenv-linter"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+) (?<rule>[A-Za-z]+): (?<message>.*)$" }
stage = "commit"
summary = "Checks every tracked environment file: key format, duplicates, quoting, ordering, and trailing spaces."
why = "Other people copy a tracked environment file, so a malformed line in it spreads to every machine."

[[check]]
example = "Code that reads `API_URL` while `.env.example` lacks that key reports a finding. Add `API_URL=` to `.env.example` with a note on the value, and no credential."
help = "Add the key to `.env.example` or a file under `secrets.env_examples`, or stop reading it."
name = "env-examples"
runs = "scope"
stage = "push"
summary = "Checks that an existing env example lists each static uppercase key that code reads through process.env, import.meta.env, Bun.env, Deno.env.get, the Python os module, or an environment function."
why = "A variable missing from the env example breaks the first run on a new machine."
