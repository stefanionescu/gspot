allowed_words = ["Vale", "DOM", "DTO", "RPC"]

[configuration]
always_selected = true
description = "Runs Vale with the gspot style and upstream packages over comments and documentation files."
title = "Prose"

[files]
extensions = [".md", ".mdx", ".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".swift", ".css", ".sh", ".bash", ".zsh", ".py", ".sql", ".pgsql", ".psql"]
tags = ["shebang:shell"]

[[tool]]
brew = "vale"
github = { name = "errata-ai/vale", version = "v3.21.0" }
mise = "vale"
name = "vale"
replace = [".vale.ini", "_vale.ini", "vale.ini"]
scoop = "vale"
suppression = { marker = "^<!--\\s*vale\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }
version = "3.21.0"
winget = "errata-ai.Vale"

[[tool_file]]
target = ".gspot/config/vale.ini"

[[tool_file]]
level = "all"
target = ".gspot/config/vale/styles/gspot/acronyms.yml"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/alt-text.yml"

