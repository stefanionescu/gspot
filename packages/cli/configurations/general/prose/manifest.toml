[[check]]
name = "vale"
tool = "vale"
title = "Lint prose"
example = "The sentence `Release on 03/04/2026.` reports an ambiguous date at the recommended level. Write `Release on March 4, 2026.` when March 4 is the intended date, then rerun. Write legitimate project names in [words]."
level = "recommended"
stage = "commit"
summary = "Checks ambiguous dates, link text, and alternative text with bundled Vale styles at level `recommended`. Level `all` adds the complete style and upstream packages."
why = "Prose that hedges, markets or wanders is read by everyone who reads the code, and nothing else checks it."
help = "Rewrite the sentence the alert names, write a real name and its reason in [words], or use gspot ignore prose/vale --rule `<rule>` --reason \"`<why>`\"."

[[setting]]
name = "limits.docs.sentence_words"
type = "number"
direction = "ceiling"
default = 30
summary = "The most words one sentence of documentation may have."

[[setting]]
name = "limits.docs.list_item_words"
type = "number"
direction = "ceiling"
default = 45
summary = "The most words one list item may have."

[[setting]]
name = "limits.docs.paragraph_sentences"
type = "number"
direction = "ceiling"
default = 6
summary = "The most sentences one paragraph may have."

[[setting]]
name = "prose.locale"
type = "string"
direction = "neutral"
default = "en-us"
summary = "The English locale typos checks against: en, en-us, en-gb, en-ca, or en-au."
validation = { enum = ["en", "en-us", "en-gb", "en-ca", "en-au"] }
