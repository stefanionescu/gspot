allowed_words = ["Vale", "DOM", "DTO", "RPC"]

[configuration]
always_selected = true
description = "Documentation: unambiguous dates, descriptive link text, and alternative text for images. Level all adds the complete gspot style, the upstream Vale packages, and the comment rules for code."
title = "Prose"

[files]
extensions = [".md", ".mdx", ".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".swift", ".css", ".sh", ".bash", ".zsh", ".py", ".sql", ".pgsql", ".psql"]
tags = ["shebang:shell"]

[[tool]]
mise = "vale"
name = "vale"
replace = [".vale.ini", "_vale.ini", "vale.ini"]
suppression = { marker = "^<!--\\s*vale\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }
version = "3.24.0"

