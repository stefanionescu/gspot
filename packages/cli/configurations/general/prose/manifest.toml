allowed_words = ["Vale", "DOM", "DTO", "RPC"]

[configuration]
always_selected = true
description = "Vale over every comment and every documentation file, with the gspot style, and the upstream packages."
title = "Prose"

[files]
extensions = [".md", ".mdx", ".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".swift", ".css", ".sh", ".bash", ".zsh", ".py", ".sql", ".pgsql", ".psql"]
tags = ["shebang:shell"]

[[tool]]
brew = "vale"
github = { name = "errata-ai/vale", version = "v3.21.0" }
mise = "vale"
name = "vale"
replace = [".vale.ini", "_vale.ini", "vale.ini"]
scoop = "vale"
suppression = { marker = "^<!--\\s*vale\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }
version = "3.21.0"
winget = "errata-ai.Vale"
[[tool_file]]
target = ".gspot/config/vale.ini"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/acronyms.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/alt-text.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/banned-headings.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/heading-case.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/item-length.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/paragraph-length.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/possessives.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/sentence-length.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/gspot/title-case.yml"
tool = "vale"

[[tool_file]]
target = ".gspot/config/vale/styles/config/vocabularies/words/accept.txt"
tool = "vale"

[[check]]
example = "The sentence `Release on 03/04/2026.` reports an ambiguous date at the recommended level. Write `Release on March 4, 2026.` when March 4 is the intended date, then rerun. Write legitimate project names in the root allowed_words setting."
help = "Rewrite the sentence the alert names, write a real name and its reason in the root allowed_words setting, or use `gspot ignore prose/vale --rule <rule> --reason \"<why>\"`."
level = "recommended"
name = "vale"
stage = "commit"
summary = "Checks ambiguous dates, link text, and alternative text with the shipped Vale styles at level `recommended`. Level `all` adds the complete style and upstream packages."
tool = "vale"
why = "Prose that hedges, markets or wanders is read by everyone who reads the code, and nothing else checks it."

