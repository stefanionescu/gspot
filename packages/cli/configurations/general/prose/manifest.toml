[[check]]
example = "`Release on 03/04/2026.` reports an ambiguous date. Write `Release on March 4, 2026.` instead."
help = "Rewrite the sentence the alert names, add a real name and its reason to the `spelling.allowed_words` setting, or use `gspot ignore prose/vale --rule <rule> --reason \"<why>\"`."
level = "recommended"
name = "vale"
stage = "commit"
summary = "Checks ambiguous dates, link text, and alternative text with the shipped Vale styles at level `recommended`. Level `all` adds the complete style and upstream packages."
tool = "vale"
why = "An ambiguous date, a link that reads \"here\", or an image without alternative text fails some readers, and no other check catches it."
