allowed_words = ["Vale", "DOM", "DTO", "RPC"]

[configuration]
always_selected = true
description = "Comments and documentation: clear dates, link text, and alternative text. Level `all` adds the complete gspot style and the upstream Vale packages."
title = "Prose"

[files]
extensions = [".md", ".mdx", ".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".swift", ".css", ".sh", ".bash", ".zsh", ".py", ".sql", ".pgsql", ".psql"]
tags = ["shebang:shell"]

[[tool]]
mise = "vale"
name = "vale"
replace = [".vale.ini", "_vale.ini", "vale.ini"]
suppression = { marker = "^<!--\\s*vale\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }
version = "3.21.0"

[[tool_file]]
target = "vale.ini"

