ignored = [
    ".gspot/config/vale/styles/Google/",
    ".gspot/config/vale/styles/Microsoft/",
    ".gspot/config/vale/styles/write-good/",
    ".gspot/config/vale/styles/proselint/",
    ".gspot/config/vale/styles/alex/",
    ".gspot/config/vale/styles/RedHat/",
    ".gspot/config/vale/styles/Harper/",
    ".gspot/config/vale/styles/.vale-config/",
    ".gspot/config/vale/styles/config/dictionaries/",
]

[configuration]
title = "Prose"
always_selected = true
description = "Vale over every comment and every documentation file, with the gspot style, and the upstream packages."

[files]
extensions = [".md", ".mdx", ".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".swift", ".css", ".sh", ".bash", ".zsh", ".py", ".sql", ".pgsql", ".psql"]
tags = ["shebang:shell"]

[[tool]]
name = "vale"
version = "3.21.0"
mise = "vale"
brew = "vale"
winget = "errata-ai.Vale"
scoop = "vale"
github = { name = "errata-ai/vale", version = "v3.21.0" }
suppression = { marker = "^<!--\\s*vale\\b", reason = "reason: (?<reason>\\S.*)", forbidden = true }

[[tool.replace]]
file = ".vale.ini"

[[tool.replace]]
file = "_vale.ini"

[[tool.replace]]
file = "vale.ini"

[[tool_file]]
target = ".gspot/config/vale.ini"
tool = "vale"
rule_keys = ["*.rules", "*.BasedOnStyles"]

[[check]]
name = "vale"
tool = "vale"
title = "Lint prose"
example = "The sentence `Release on 03/04/2026.` reports an ambiguous date at the recommended level. Write `Release on March 4, 2026.` when March 4 is the intended date, then rerun. Write legitimate project names in [words]."
level = "recommended"
stage = "commit"
summary = "Checks ambiguous dates, link text, and alternative text with bundled Vale styles at level `recommended`. Level `all` adds the complete style and upstream packages."
why = "Prose that hedges, markets or wanders is read by everyone who reads the code, and nothing else checks it."
help = "Rewrite the sentence the alert names, write a real name and its reason in [words], or use gspot ignore prose/vale --rule <rule> --reason \"<why>\"."
