[configuration]
always_selected = true
description = "Commit messages: a conventional type, an optional project scope, a first line of 72 characters or fewer, and a wrapped body."
title = "Commits"
when = { git = true }

[files]
paths = ["**"]

[[tool]]
name = "commitlint"
npm = "@commitlint/cli"
replace = [".commitlintrc", ".commitlintrc.json", ".commitlintrc.yml", ".commitlintrc.yaml", ".commitlintrc.js", ".commitlintrc.cjs", ".commitlintrc.mjs", ".commitlintrc.ts", ".commitlintrc.cts", ".commitlintrc.mts", "commitlint.config.js", "commitlint.config.cjs", "commitlint.config.mjs", "commitlint.config.ts", "commitlint.config.cts", "commitlint.config.mts"]
version = "21.2.3"

[[tool.replace_key]]
file = "package.json"
key = "commitlint"
pointer = true

[[config_file]]
target = "commitlint.json"
tool = "commitlint"

[[check]]
command = ["commitlint", "--config", "{config_file:commitlint}", "--edit", "{message_file}"]
example = "The message `changed stuff` has no type or scope. Write `fix(cli): report missing configuration` instead."
help = "Write `<type>: <subject>` or `<type>(<scope>): <subject>` in a first line of 72 characters or fewer, with `!` before the colon for a breaking change. Change the accepted types with `gspot set tools.commitlint.types`."
level = "all"
name = "commitlint"
output = { format = "regex", pattern = "^\\s*[✖⚠]\\s+(?<message>.*?)\\s+\\[(?<rule>[a-z-]+)\\]\\s*$" }
stage = "message"
summary = "Checks a new commit message for a conventional type, an optional known scope, a first line of 72 characters or fewer, and a wrapped body."
why = "Release notes, blame, and bisect depend on typed, scoped subjects, and a free-form message hides the change."

[[check]]
example = "The trailer `Claude-Session: https://claude.ai/code/session_01Abc` reports `session-link`. Remove the line, and describe the change in the message itself."
help = "Remove the line that the finding names. For a reviewed exception, run `gspot ignore commits/references --rule <rule> --reason \"<why>\"`."
name = "references"
stage = "message"
summary = "Checks a new commit message for links to AI chat sessions and the `Claude-Session:` trailer, finding IDs such as `C3-BUG-019`, plan steps such as `steps 7.01 to 7.36` or `stage 45`, and `Refs:` or `Closes:` footers without an issue number."
why = "A reader of the history cannot open a chat session, a private finding, or a plan step, and a session link shares the chat with everyone who can read the repository."

[[check]]
example = "A commit with the message `changed stuff` in the push fails. Reword it as `fix(cli): report missing configuration`, and coordinate first when others share that history."
help = "Reword the commits that fail with `git rebase -i`, or change the rule with `gspot set tools.commitlint.rules`."
level = "all"
name = "commitlint-pushed"
output = { format = "regex", pattern = "^\\s*[✖⚠]\\s+(?<message>.*?)\\s+\\[(?<rule>[a-z-]+)\\]\\s*$" }
runs = "history"
stage = "push"
summary = "Checks the message of each commit in a push. A manual run covers every commit from the upstream merge base to HEAD."
tool = "commitlint"
why = "A message written past the hook (--no-verify, a rebase, or a merge) still reaches the shared branch unless the push checks it."
