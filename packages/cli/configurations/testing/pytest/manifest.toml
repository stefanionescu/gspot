[configuration]
description = "pytest suites: Ruff style rules for tests, test-name prefixes, and a coverage floor at push."
requires = ["python"]
title = "pytest"

[detect]
dependencies = ["pytest"]
filenames = ["conftest.py", "pytest.ini"]

[[naming.override]]
categories = ["functions", "methods"]
ignored_prefix = "^test_"
languages = ["python"]
paths = ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/conftest.py"]
reason = "The test runner finds a test by this prefix."

[[tool]]
install_hint = "Run: python -m pip install pytest"
min_version = "7.0.0"
name = "pytest"
pypi = "pytest"
suppression = { marker = "\\bpragma: ?no cover\\b", reason = "#[^#]*# ?(?<reason>\\S.*)" }
system = true
version_pattern = "(\\d+\\.\\d+\\.\\d+)"

[[tool]]
install_hint = "Install pytest-cov in the Python environment used by pytest."
kind = "library"
name = "pytest-cov"
pypi = "pytest-cov"
system = true
version_command = ["pytest", "--version", "--version"]
version_pattern = "pytest-cov-(\\d+(?:\\.\\d+)+)"

[ruff]
all = ["PT001", "PT002", "PT003", "PT006", "PT007", "PT018", "PT019", "PT022", "PT023", "PT026"]
recommended = ["PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT020", "PT021", "PT024", "PT025", "PT027", "PT028", "PT030", "PT031"]

[[check]]
command = ["pytest", "-q", "--strict-markers", "--strict-config", "--cov", "--cov-fail-under={setting:coverage.lines}", "--no-header", "-p", "no:cacheprovider"]
cwd = "scope"
example = "pytest-cov reports `FAIL Required test coverage of 90% not reached. Total coverage: 85%`. Add a Python test for the uncovered behavior."
exit_codes = [1]
files = { extensions = [".py"] }
help = "Fix the failed test, or cover the lines the report marks. Lower `coverage.lines` only with a reason."
level = "recommended"
name = "coverage"
output = { format = "regex", pattern = "^(?<message>(?:FAIL Required test coverage|FAILED |ERROR ).*)$" }
runs = "scope"
stage = "push"
summary = "Runs pytest with coverage, and fails on a broken test or a covered share under the floor."
tool = ["pytest", "pytest-cov"]
why = "Coverage shows the Python branches and lines that no test runs, before a push."
