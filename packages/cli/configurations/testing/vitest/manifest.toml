allowed_words = ["Vitest"]

[prefix_collisions]
prefixes = ["vitest"]

[configuration]
title = "Vitest"
requires = ["javascript", "coverage"]
description = "Vitest test files: the test rules of ESLint over them, and coverage thresholds at push."

[detect]
dependencies = ["vitest"]

[files]
paths = ["**/vitest.config.*", "**/vitest.workspace.*"]

[[tool]]
name = "vitest"
install_hint = "Run: npm install --save-dev vitest"
system = true
min_version = "2.0.0"
npm = "vitest"

[[tool]]
name = "@vitest/eslint-plugin"
rule_prefix = "vitest"
kind = "library"
version = "1.3.4"
npm = "@vitest/eslint-plugin"

[[tool]]
name = "@vitest/coverage-v8"
install_hint = "Run: npm install --save-dev @vitest/coverage-v8"
kind = "library"
system = true
npm = "@vitest/coverage-v8"

[[check]]
name = "coverage"
tool = ["vitest", "@vitest/coverage-v8"]
example = "Vitest reports `ERROR: Coverage for lines (85%) does not meet global threshold (90%)`. Exercise the missing lines before the push check."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
command = ["vitest", "run", "--coverage", "--coverage.reporter=text-summary", "--coverage.thresholds.lines={setting:coverage.lines}", "--coverage.thresholds.branches={setting:coverage.branches}", "--coverage.thresholds.functions={setting:coverage.functions}", "--coverage.thresholds.statements={setting:coverage.statements}"]
summary = "Runs the test suite with coverage, and fails when lines, branches, functions, or statements fall under their floors."
why = "A floor keeps new code from arriving untested, which is when its behavior is cheapest to pin down."
help = "Add tests for the code the coverage report shows uncovered, or lower one floor under coverage with a reason."

[check.files]
extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]

[check.output]
format = "regex"
pattern = "^ERROR: (?<message>Coverage for .*)$"

[eslint]
all_level_rules = ["vitest/no-import-node-test", "vitest/prefer-strict-equal", "vitest/valid-title"]

[eslint.presets.recommended]
package = "@vitest/eslint-plugin"
source = "configs.recommended"

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true
required_tools = ["@vitest/eslint-plugin"]
