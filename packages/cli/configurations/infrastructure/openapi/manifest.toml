[configuration]
title = "OpenAPI"
description = "A committed OpenAPI document: Spectral lints it, and the command that writes it must not change it."

[detect]
filenames = ["openapi.yaml", "openapi.yml", "openapi.json", "swagger.json", "swagger.yaml"]

[[tool]]
name = "spectral"
version = "6.15.0"
npm = "@stoplight/spectral-cli"
mise = "npm:@stoplight/spectral-cli"

# Spectral's Ajv plugins must use the same ajv package as Spectral, so the tool project installs one shared ajv.

[[tool]]
name = "ajv"

[[tool_file]]
target = ".gspot/config/spectral.yaml"
tool = "spectral"

[[check]]
name = "spectral"
example = "An OpenAPI document whose operation references an undefined schema reports a validation finding. Define the schema or correct the reference in the source that produces the document, then regenerate it."
level = "recommended"
stage = "commit"
runs = "scope"
tool = "spectral"
cwd = "root"
command = ["spectral", "lint", "--ruleset", "{tool_file:spectral}", "--format", "text", "{setting:openapi.document}"]
when = { setting = "openapi.document" }
output = { format = "regex", pattern = '^(?<file>.+):(?<line>\d+):(?<column>\d+) (?:error|warning) (?<rule>\S+) "(?<message>.*)"$' }
files = { extensions = [".yaml", ".yml", ".json"] }
summary = "Lints the OpenAPI document named in openapi.document with the Spectral OpenAPI rules."
why = "Clients are written from this document, so an operation with no id or an undefined response becomes somebody's broken client."
help = "Change the document the way the rule says, or the code that writes it."

[[check]]
name = "stale-document"
command = ["{setting:openapi.generate_command}"]
when = { setting = "openapi.generate_command" }
generated_paths = [{ path = "{setting:openapi.document}" }]
example = "A committed OpenAPI document that differs from the configured generator output reports drift. Run the declared generator, inspect the changed document, and retain the corrected output before rerunning."
level = "recommended"
stage = "push"
runs = "scope"
summary = "Runs the command in openapi.generate_command and fails when it changes the document."
why = "A committed document that lags the routes describes a service that does not exist."
help = "Run the command and commit the document it writes."
