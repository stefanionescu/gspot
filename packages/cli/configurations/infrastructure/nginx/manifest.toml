allowed_words = ["nginx", "NGINX"]

[configuration]
description = "nginx files: gixy finds security mistakes, and the server parser checks the rest in a container."
title = "nginx"

[files]
paths = ["**/nginx.conf", "**/nginx/**/*.conf"]

[[tool]]
builds = ["macos", "linux"]
mise = "pipx:gixy-ng"
name = "gixy"
pypi = "gixy-ng"
version = "0.2.53"
version_pattern = "(\\d+\\.\\d+\\.\\d+)"

[[tool]]
name = "docker"

[[tool]]
name = "openssl"
system = true

[[tool_file]]
target = ".gspot/config/gixy.cfg"
tool = "gixy"

[[check]]
command = ["gixy", "--config", "{tool_file:gixy}", "--format", "json", "{file}"]
example = "A location for `/proxy/(.*)` with `proxy_pass http://$1` sends requests to any host and reports `ssrf`. Point `proxy_pass` at a fixed upstream instead."
help = "Change the block the way the rule page says. Turn one rule off with `gspot ignore nginx/gixy --rule <name> --reason \"<why>\"`."
level = "recommended"
name = "gixy"
output = { format = "json", fields = { file = "path", line = "line", rule = "plugin", message = "summary" } }
stage = "commit"
summary = "Checks every nginx file for mistakes that expose a server: request forgery, path traversal through alias, header injection, and a disclosed version."
why = "These mistakes parse, serve traffic, and look like any other location block until somebody uses them."

[[check]]
example = "The line `invalid_directive on;` fails `nginx -t`. Remove it, or replace it with a known directive such as `listen 443 ssl;`."
files = { filenames = ["nginx.conf"] }
help = "Fix the line nginx names. Set `tools.nginx.image` to the one your deployment runs."
level = "recommended"
name = "config-test"
needs = ["docker"]
runs = "scope"
stage = "push"
summary = "Runs `nginx -t` on each main file inside the image, with a throwaway certificate and resolved upstream names. Records every file that nginx parsed."
tool = "docker"
why = "Only nginx itself can confirm that a file parses; otherwise the first test comes at the restart in production."
