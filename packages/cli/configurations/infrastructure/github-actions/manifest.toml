allowed_words = ["GitHub"]

[configuration]
description = "GitHub Actions workflows: valid syntax and expressions, security audits, and pinned actions."
title = "GitHub Actions"

[files]
paths = ["**/.github/workflows/*.{yml,yaml}", "**/action.{yml,yaml}"]

[[tool]]
brew = "actionlint"
github = { name = "rhysd/actionlint", version = "v1.7.12" }
mise = "actionlint"
name = "actionlint"
version = "1.7.12"

[[tool]]
name = "shellcheck"

[[tool]]
brew = "zizmor"
cargo = "zizmor"
mise = "zizmor"
name = "zizmor"
pypi = "zizmor"
version = "1.30.1"

[[tool_file]]
target = "zizmor.yml"
tool = "zizmor"

[[check]]
command = ["actionlint", "-no-color", "{files}"]
example = "A workflow expression with the unknown context `${{ unknown.value }}` reports an error. Use a supported context and property there instead."
exit_codes = [1]
files = { paths = ["**/.github/workflows/*.{yml,yaml}"] }
help = "Fix the line actionlint names."
level = "recommended"
name = "actionlint"
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?<message>.*?) \\[(?<rule>[a-z-]+)\\]$" }
stage = "commit"
summary = "Checks every GitHub Actions workflow with actionlint: syntax, expressions, action inputs, and shell steps."
tool = ["actionlint", "shellcheck"]
why = "A workflow error surfaces on the first push after the change, in CI, where it costs a round trip."

[[check]]
command = ["zizmor", "--offline", "--no-progress", "--format", "github", "--config", "{tool_file:zizmor}", "{files}"]
example = "A workflow that puts pull request text straight into a shell command reports `template-injection`. Pass the text through a step environment variable, and quote its expansion."
exit_codes = [11, 12, 13, 14]
help = "Apply the fix zizmor names, or turn one audit off with `gspot ignore github-actions/zizmor --rule <audit> --reason \"<why>\"`."
level = "recommended"
name = "zizmor"
output = { format = "regex", pattern = "^::(?:warning|error|notice) file=(?<file>[^,]+),line=(?<line>\\d+),title=(?<rule>[^:]+)::(?<message>.*)$" }
stage = "commit"
summary = "Audits GitHub Actions workflows and composite actions with zizmor for template injection, excessive permissions, and dangerous triggers."
why = "A workflow runs with the repository's credentials; an injectable expression can hand them to a stranger."
