allowed_words = ["Xcode"]

[configuration]
description = "An Xcode project: property lists that parse, build settings files, and complete string catalogs. Asset catalogs hold their images, sources belong to a target, and entitlements stay on a list."
suggests = ["swift"]
title = "Xcode"

[detect]
project_files = ["*.xcodeproj"]

[files]
extensions = [".plist", ".entitlements", ".xcconfig", ".xcstrings", ".storyboard", ".xib"]
paths = ["**/project.pbxproj", "**/*.xcscheme", "**/*.xctestplan", "**/*.xcassets/**/Contents.json"]

[[tool]]
builds = ["macos"]
crash_pattern = "couldn['’]t be opened"
install_help = "Install Xcode from the App Store."
name = "plutil"
system = true

[[check]]
command = ["plutil", "-lint", "{files}"]
example = "A plist with an unclosed dictionary fails plutil. Close the dictionary element."
files = { extensions = [".plist", ".entitlements"] }
help = "Fix the element plutil names."
level = "recommended"
name = "plutil"
output = { format = "regex", pattern = "^(?<file>[^:]+): \\(?(?<message>(?!OK$).+?)\\)?$" }
stage = "commit"
summary = "Parses every property list and entitlements file with plutil."
why = "A broken plist fails the build or, worse, ships an app whose settings silently fell back to defaults."

[[check]]
example = "A catalog string that lacks a required locale reports a finding. Add the translation, or mark the string as not translated."
files = { extensions = [".xcstrings"] }
help = "Add the translation, or mark the string as not translated in the catalog."
level = "recommended"
name = "xcstrings"
runs = "scope"
stage = "commit"
summary = "Checks that each string catalog parses and translates every string into all its locales."
why = "A string with no translation shows its source language in the middle of a translated screen."

[[check]]
example = "A `Contents.json` that names a missing `icon.png` reports a finding. Add the image beside it, or remove the reference."
files = { paths = ["**/*.xcassets/**"], extensions = [".swift"] }
help = "Add the image or delete the asset."
level = "recommended"
name = "assets"
runs = "scope"
stage = "commit"
summary = "Checks that each asset `Contents.json` parses, and that its image set holds each file it names."
why = "An image set with no image draws nothing at run time."

[[check]]
example = "An asset set that no source file or build setting names reports `unused-asset`. Delete it, or reference it where the app loads it."
files = { paths = ["**/*.xcassets/**"], extensions = [".swift", ".storyboard", ".xib", ".plist", ".pbxproj", ".xcconfig"] }
help = "Delete the asset, or name it in the code that loads it. For an asset that the app picks at run time, run `gspot ignore xcode/unused-assets --rule unused-asset --paths <glob> --reason \"<why>\"`."
level = "all"
name = "unused-assets"
runs = "scope"
stage = "commit"
summary = "Finds asset sets that no source or Xcode build setting names."
why = "An asset nobody names ships in the app for nothing."

[[check]]
example = "A Swift file in no target reports a finding. Add the file to a target, or delete it."
files = { extensions = [".swift"], paths = ["**/project.pbxproj"] }
help = "Add the file to a target, or delete it."
level = "recommended"
name = "files-without-target"
runs = "scope"
stage = "commit"
summary = "Finds the Swift files in the tree that no target of the project names."
why = "Xcode never compiles a Swift file that belongs to no target, so it breaks unnoticed."

[[check]]
example = "An `.entitlements` key missing from `xcode.allowed_entitlements` reports a finding. Remove it, or add it to that list."
files = { extensions = [".entitlements"] }
help = "Remove the entitlement, or add it to xcode.allowed_entitlements."
level = "recommended"
name = "entitlements"
runs = "scope"
stage = "commit"
summary = "Checks each entitlement against `xcode.allowed_entitlements`, when the settings hold that list."
when = { setting = "xcode.allowed_entitlements" }
why = "Each entitlement grants the app a system capability, so a new one needs its own review."

[[check]]
example = "An Info.plist with `NSAllowsArbitraryLoads` reports a finding. Remove the key, and add an exception only for a host that needs one."
files = { extensions = [".plist"] }
help = "Remove the key, and add an exception for the one host that needs it."
level = "recommended"
name = "app-transport-security"
runs = "scope"
stage = "commit"
summary = "Refuses a property list that allows arbitrary loads, which turns transport security off for every host."
why = "Arbitrary loads let the app send plain HTTP to any host, and one forgotten debug setting ships that."
