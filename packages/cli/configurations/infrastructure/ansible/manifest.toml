[configuration]
description = "Ansible playbooks, roles, and collections checked by ansible-lint."
title = "Ansible"

[files]
paths = ["**/ansible.cfg", "**/galaxy.yml", "**/requirements.yml", "**/roles/*/tasks/main.yml"]

[[tool]]
brew = "ansible-lint"
builds = ["macos", "linux"]
min_version = "24.0.0"
mise = "pipx:ansible-lint"
name = "ansible-lint"
pypi = "ansible-lint"
version = "26.8.0"

[[tool_file]]
per_scope = true
target = ".gspot/config/ansible-lint.yml"
tool = "ansible-lint"

[[check]]
command = ["ansible-lint", "-c", "{tool_file:ansible-lint}", "--offline", "--nocolor", "-f", "pep8", "--profile", "{level:moderate:production}"]
example = "A task using `ansible.builtin.command: systemctl restart nginx` reports `command-instead-of-module`. Use `ansible.builtin.systemd` with `name: nginx` and `state: restarted` to express the intended service operation."
files = { extensions = [".yml", ".yaml", ".cfg", ".j2"] }
help = "Change the task the way the rule says. Turn one rule off with `gspot ignore ansible/ansible-lint --rule <id> --reason \"<why>\"`."
level = "recommended"
name = "ansible-lint"
runs = "scope"
stage = "commit"
summary = "Runs the moderate ansible-lint profile at recommended and production at all, beside each ansible.cfg or at the selected scope root."
tool = "ansible-lint"
why = "A playbook runs as root on production hosts, and a task that is not idempotent changes them on every run."
