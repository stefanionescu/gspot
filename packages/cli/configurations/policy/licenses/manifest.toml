[configuration]
name = "licenses"
kind = "policy"
title = "Licenses"
proposed = true
check_references = ["integrity/allowlists-match"]
description = "Every installed dependency reports a license from the allowed list, or carries an exception that names the license it reports."

[detect]
filenames = ["package.json", "pyproject.toml"]

[claims]
filenames = ["package.json", "pyproject.toml"]

[[tools]]
name = "license-checker-rseidelsohn"
version = "5.0.1"
npm = "license-checker-rseidelsohn"
version_exit_code = 1
mise = "npm:license-checker-rseidelsohn"

[[tools.takeover]]
file = ".license-checker.json"
carries = "licenses"

[[tools]]
name = "pip-licenses"
version = "5.5.5"
pypi = "pip-licenses"
mise = "pipx:pip-licenses"

[[configs]]
template = "licenses.json.tmpl"
target = ".gspot/config/licenses.json"
per_scope = true

[[checks]]
name = "licenses/packages"
title = "Check dependency licenses"
example = "A locked package whose declared license is outside the allowed license policy reports a finding for that exact package version. Replace the dependency with an acceptable one or record a reviewed package-and-license exception with a reason. An exception for another version does not apply."
level = "recommended"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "licenses-packages"
claims = {filenames = ["package.json", "pyproject.toml"]}
coverage = ["licenses"]
summary = "Compares the license every installed npm or Python package reports with the allowed list and the exceptions."
why = "A license the project cannot accept arrives silently with a transitive dependency."
help = "Replace the package, or add an entry to tools.licenses.packages_allowed with gspot set. Include package (name@version), license, and reason. An exception holds only while the package reports that license."

[[settings]]
name = "tools.licenses.licenses_allowed"
kind = "list"
direction = "neutral"
default = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Unlicense", "BlueOak-1.0.0", "Python-2.0"]
summary = "The SPDX license ids a dependency may report."

[[settings]]
name = "tools.licenses.packages_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Packages accepted under a license outside the list: name@version, the license it reports, and the reason."
