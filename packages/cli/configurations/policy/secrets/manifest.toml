[configuration]
name = "secrets"
kind = "policy"
title = "Secrets"
default = true
description = "Secret scanning over staged files at commit and over the pushed commits at push, with every allowed value carrying its reason."

[claims]
paths = ["**"]
natures = ["source", "generated", "vendored", "binary"]

[[tools]]
name = "gitleaks"
version = "8.30.1"
floor = "8.19.0"
mise = "gitleaks"
brew = "gitleaks"
github = {name = "gitleaks/gitleaks", version = "v8.30.1"}
winget = "Gitleaks.Gitleaks"
scoop = "gitleaks"
version_command = ["version"]

[[tools.takeover]]
file = ".gitleaks.toml"
carries = "rules-table"

[[tools.takeover]]
file = "gitleaks.toml"
carries = "rules-table"

[[tools]]
name = "trufflehog"
crash_pattern = '"level"\s*:\s*"error"'
version = "3.97.5"
mise = "trufflehog"
brew = "trufflehog"
github = {name = "trufflesecurity/trufflehog", version = "v3.97.5"}

[[configs]]
template = "gitleaks.toml.tmpl"
target = ".gspot/config/gitleaks.toml"
pointer = {path = ".gitleaks.toml", copy = true}

[[checks]]
name = "secrets/gitleaks-staged"
title = "Scan staged changes for secrets"
example = "A staged credential reports a secret finding. Remove the credential from source, load it from the configured environment owner, and stage the correction. If the credential has been exposed, rotate it at its provider."
level = "recommended"
stage = "commit"
runs = "once"
command = ["gitleaks", "git", "--staged", "--no-banner", "--redact", "--exit-code", "1", "--config", "{config:gitleaks}", "--report-format", "csv", "--report-path", "-", "{root}"]
coverage = ["secrets"]
output = {format = "regex", pattern = "^(?<rule>[a-z0-9-]+),[^,]*,(?<file>[^,]+),[^,]*,REDACTED,REDACTED,(?<line>\\d+),\\d+,(?<column>\\d+),", message = "A value in the staged change matches a secret pattern."}
summary = "Scans the staged change for keys, tokens, and passwords before the commit exists."
why = "A secret that reaches a commit stays in history after the line is deleted, and every clone holds it."
help = "Remove the value and load it from the environment. For a value that is public by design, use gspot set tools.gitleaks.allow with an entry containing paths, regexes, description, and reason."

[[checks]]
name = "secrets/gitleaks"
title = "Scan pushed commits for secrets"
example = "A credential in an earlier commit still reports after it is deleted from the working tree. Rotate the credential and remove it from the affected history, coordinating any rewrite of shared commits. Rerun the history scan."
level = "recommended"
stage = "push"
runs = "once"
tool = "gitleaks"
analysis = "gitleaks-history"
coverage = ["secrets"]
output = {format = "regex", file_is = "history", pattern = "^(?<rule>[a-z0-9-]+),[^,]*,(?<file>[^,]+),[^,]*,REDACTED,REDACTED,(?<line>\\d+),\\d+,(?<column>\\d+),", message = "A value in a commit about to be pushed matches a secret pattern."}
summary = "Scans every commit about to be pushed for keys, tokens, and passwords."
why = "A commit made past the hook still reaches the shared branch unless the push checks it."
help = "Rewrite the commit that holds the value and rotate the secret; a pushed secret is a leaked secret."

[[checks]]
name = "secrets/trufflehog"
title = "Verify detected secrets"
example = "A committed credential that its provider confirms as active reports a verified secret. Revoke or rotate it at the provider and remove it from the affected history. Rerun with the required network access."
level = "recommended"
stage = "push"
runs = "once"
requires = "network"
tool = "trufflehog"
analysis = "verified-secrets"
coverage = ["secrets"]
output = {format = "trufflehog-json", file_is = "history"}
summary = "Verifies candidate secrets in the pushed commits against the service that issued them."
why = "A verified secret is live right now, which makes it the finding to act on first."
help = "Rotate the secret at its provider, then rewrite the commit that holds it."

[[checks]]
name = "integrity/env-files"
title = "Environment files"
example = "A tracked `.env` file reports a secret-file policy finding. Keep a template with keys and no secret values, add `.env` to `.gitignore`, and run `git rm --cached .env` to stop tracking it while preserving the local file."
level = "recommended"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "env-files"
coverage = ["secrets"]
summary = "Checks that git tracks no environment file except the templates."
why = "An environment file holds the values of one machine, and most of them are secrets."
help = "Run git rm --cached <file>, add it to .gitignore, and keep a template such as .env.example with the keys and no values."

[[checks]]
name = "integrity/gitleaks-baseline"
title = "Gitleaks baseline"
example = "A Gitleaks baseline entry without a corresponding reason reports an unexplained suppression. Remove the obsolete entry or add its specific reviewed reason under `tools.gitleaks.baseline_reasons`."
level = "recommended"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "gitleaks-baseline"
coverage = ["consistency"]
summary = "Checks that every reviewed finding in the gitleaks baseline has a reason and names a path that exists."
why = "A baseline entry with no reason hides a secret nobody reviewed, and one for a deleted file hides nothing at all."
help = "Add the reason under tools.gitleaks.baseline_reasons, or remove the entry from the baseline file."

[[settings]]
name = "tools.gitleaks.allow"
kind = "list"
direction = "loosening"
default = []
summary = "Values gitleaks skips because they are public by design: a description, paths, regexes, and the reason."

[[settings]]
name = "tools.gitleaks.baseline_reasons"
kind = "list"
direction = "loosening"
default = []
summary = "The reason for each reviewed historical finding in the gitleaks baseline, by fingerprint."

[rule_files]
code = ["general/code/SECRETS.md", "general/code/SECURITY.md"]
