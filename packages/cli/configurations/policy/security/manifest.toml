[configuration]
name = "security"
kind = "policy"
title = "Security"
proposed = true
description = "Static analysis for security patterns with Semgrep over every file a selected language claims, and CodeQL on request."

[claims]
from_languages = true
extensions = [".plist"]

[[tools]]
name = "semgrep"
suppression = {marker = "\\bnosemgrep\\b", reason = "(?<reason>never)", forbidden = true}
version = "1.178.0"
floor = "1.100.0"
pypi = "semgrep"
mise = "pipx:semgrep"
brew = "semgrep"
windows = false

[[tools.takeover]]
file = "bearer.yml"
carries = "rules-table"

[[tools.takeover]]
file = "bearer.ignore"
carries = "rules-table"

[[tools.takeover]]
file = ".semgrepignore"
carries = "ignore-paths"

[[tools]]
name = "codeql"
version = "2.24.3"
brew = "codeql"
github = {name = "github/codeql-cli-binaries", version = "v2.24.3"}
# Query versions paired with github/codeql tag codeql-cli/v2.24.3.
query_packs = {actions = "0.6.21", cpp = "1.5.12", csharp = "1.6.3", go = "1.5.7", java = "1.10.8", javascript = "2.3.3", python = "1.7.8", ruby = "1.5.8", rust = "0.1.28", swift = "1.2.17"}

[[configs]]
template = "semgrep-node.yml.tmpl"
target = ".gspot/config/semgrep/node.yml"
rules_path = ["rules"]
per_scope = true

[[configs]]
template = "semgrep-secrets.yml.tmpl"
target = ".gspot/config/semgrep/secrets.yml"
rules_path = ["rules"]
per_scope = true

[[configs]]
template = "semgrepignore.tmpl"
target = ".semgrepignore"
per_scope = true

[[checks]]
name = "security/semgrep"
title = "Semgrep"
example = "Code matching a selected local Semgrep rule reports that rule ID and source location. For a rule banning dynamic evaluation, replace `eval(userInput)` with explicit parsing and permitted operations, then rerun the same rule set."
level = "recommended"
stage = "push"
runs = "per-file-list"
exclude_setting = "tools.semgrep.ignore"
findings_exit_codes = [1]
platform = ["macos", "linux"]
command = ["semgrep", "scan", "--strict", "--config", "{root}/.gspot/config/{scope}/semgrep", "{each:--config:tools.semgrep.rules}", "--error", "--metrics", "off", "--disable-version-check", "--no-rewrite-rule-ids", "--quiet", "--vim", "{files}"]
coverage = ["security"]
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+):[EWI]:(?<rule>[^:]+):(?<message>.*)$"}
summary = "Runs the Semgrep rule packs of the selected configurations, and the repository's own rules, over the changed files."
why = "An injection or a logged secret reads like ordinary code, and a pattern rule finds it before a reviewer has to."
help = "Change the code the way the message says. Turn one rule off for a path with gspot ignore security/semgrep --rule <id> --paths <glob> --reason."

[[checks]]
name = "security/semgrep-registry"
title = "Semgrep registry"
example = "Code matching a configured Semgrep registry rule reports its upstream rule ID. Correct the operation identified by that rule and rerun with network access. The configured rule set determines which patterns are findings."
level = "recommended"
stage = "manual"
runs = "per-file-list"
exclude_setting = "tools.semgrep.ignore"
findings_exit_codes = [1]
requires = "network"
platform = ["macos", "linux"]
command = ["semgrep", "scan", "--strict", "{each:--config:tools.semgrep.registry}", "--error", "--metrics", "off", "--disable-version-check", "--quiet", "--vim", "{files}"]
tool = "semgrep"
coverage = ["security"]
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+):[EWI]:(?<rule>[^:]+):(?<message>.*)$"}
summary = "Runs the public Semgrep registry packs named in tools.semgrep.registry, which the registry serves over the network."
why = "The registry packs cover the common vulnerability classes, and their license keeps them out of this package."
help = "Change the code the way the message says, or turn the rule off for a path with gspot ignore security/semgrep-registry --rule <id> --reason."

[[checks]]
name = "security/codeql"
title = "CodeQL"
example = "A query constructed by concatenating request input into SQL reports a SQL-injection finding when the selected language query pack detects the flow. Use a parameterized database query and rerun with the language build prerequisites satisfied."
level = "recommended"
stage = "manual"
runs = "once"
engine = "integrity"
analysis = "codeql"
tool = "codeql"
coverage = ["security"]
summary = "Builds a CodeQL database for every language in tools.codeql.languages and runs the security suite over it."
why = "Data-flow analysis follows a value from a request to a query across files, which a pattern rule cannot."
help = "Change the code the result names. Record a false positive under tools.codeql.false_positives with its rule, its paths, and a reason."

[[settings]]
name = "tools.codeql.languages"
kind = "list"
direction = "tightening"
default = []
summary = "The CodeQL languages to scan, such as javascript-typescript, python, or swift."

[[settings]]
name = "tools.codeql.suite"
kind = "string"
direction = "neutral"
default = "security-extended"
summary = "The CodeQL query suite: security-extended, or security-and-quality."

[[settings]]
name = "tools.codeql.false_positives"
kind = "list"
direction = "loosening"
default = []
summary = "CodeQL results accepted as false positives: the rule id, the paths, and the reason."

[[settings]]
name = "tools.semgrep.rules"
kind = "list"
direction = "tightening"
default = []
summary = "Rule files or folders of the repository that Semgrep runs beside the shipped packs."

[[settings]]
name = "tools.semgrep.registry"
kind = "list"
direction = "tightening"
default = ["p/owasp-top-ten", "p/secrets"]
summary = "The registry packs the manual registry check runs."

[[settings]]
name = "tools.semgrep.ignore"
kind = "list"
direction = "loosening"
default = []
summary = "Paths Semgrep never scans, each with a reason; they are written into .semgrepignore."

[rule_files]
code = ["general/code/SECURITY.md", "general/code/SECRETS.md"]
