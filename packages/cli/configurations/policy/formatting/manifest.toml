[configuration]
name = "formatting"
kind = "policy"
title = "Formatting"
description = "One [format] block every formatter reads, so indentation cannot disagree between Prettier, shfmt, Ruff, and markdownlint."

[claims]
extensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs", ".jsx", ".json", ".jsonc", ".json5", ".md", ".mdx", ".css", ".scss", ".html", ".yml", ".yaml", ".vue", ".svelte", ".graphql"]

[[tools]]
name = "prettier"
crash_pattern = "\\[error\\] (?:No parser|Cannot find|Invalid)"
version = "3.8.1"
npm = "prettier"

[[tools.takeover]]
file = ".prettierrc"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.json"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.yml"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.yaml"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.json5"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.js"
carries = "rules-table"

[[tools.takeover]]
file = "prettier.config.js"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.ts"
carries = "rules-table"

[[tools.takeover]]
file = "prettier.config.ts"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.mjs"
carries = "rules-table"

[[tools.takeover]]
file = "prettier.config.mjs"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.mts"
carries = "rules-table"

[[tools.takeover]]
file = "prettier.config.mts"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.cjs"
carries = "rules-table"

[[tools.takeover]]
file = "prettier.config.cjs"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.cts"
carries = "rules-table"

[[tools.takeover]]
file = "prettier.config.cts"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierrc.toml"
carries = "rules-table"

[[tools.takeover]]
file = ".prettierignore"
carries = "ignore-paths"

[[tools.takeover]]
file = "package.json"
key = "prettier"
shared = true
carries = "rules-table"

[[tools.takeover]]
file = "package.yaml"
key = "prettier"
shared = true
carries = "rules-table"

[[tools]]
name = "ec"
version = "3.4.0"
env = {EC_VERSION = "v3.4.0"}
npm = {name = "editorconfig-checker", version = "7.0.0"}
mise = "aqua:editorconfig-checker/editorconfig-checker"
brew = "editorconfig-checker"
github = {name = "editorconfig-checker/editorconfig-checker", version = "v3.4.0"}

[[tools.takeover]]
file = ".editorconfig"
carries = "rules-table"

[[configs]]
template = "editorconfig.tmpl"
target = ".editorconfig"

[[configs]]
template = "prettier.json.tmpl"
target = ".gspot/config/prettier.json"
header = false

[configs.pointer]
path = ".prettierrc.json"
template = "prettier.json.tmpl"

[[configs]]
template = "prettierignore.tmpl"
target = ".prettierignore"

[[checks]]
name = "formatting/prettier"
title = "Prettier"
example = "A selected JavaScript file containing `const value={enabled:true};` differs from the configured Prettier output. Run the formatter and retain its spacing and wrapping changes before rerunning."
level = "all"
stage = "commit"
runs = "per-file-list"
command = ["prettier", "--check", "--config", "{config:prettier}", "--ignore-path", ".prettierignore", "--log-level", "warn", "{files}"]
findings_exit_codes = [1]
fix_command = ["prettier", "--write", "--config", "{config:prettier}", "--ignore-path", ".prettierignore", "--log-level", "warn", "{files}"]
fix_order = "format"
coverage = ["format"]
output = {format = "regex", pattern = "^\\[warn\\] (?<file>[^\\s].*[^\\s.])$", message = "This file is not formatted the way Prettier formats it."}
summary = "Checks that every file Prettier formats is already formatted that way."
why = "Formatting by hand differs by editor; one formatter keeps diffs about the change and not the spacing."
help = "Run gspot check --fix to format every file, or prettier --write on one file."

[[checks]]
name = "formatting/editorconfig-checker"
title = "Check EditorConfig formatting"
example = "A file containing CRLF line endings when `.editorconfig` requires LF reports a line-ending finding. Save it with LF endings and rerun. Use the exact configured indentation and final-newline settings as well."
level = "all"
stage = "commit"
runs = "per-file-list"
command = ["ec", "-no-color", "-disable-indent-size", "{files}"]
tool = "ec"
coverage = ["format"]
output = {format = "grouped", file_pattern = "^(?<file>[^\\s].*):$", pattern = "^\\s+(?<line>\\d+)(?:-\\d+)?: (?<message>.*)$"}
summary = "Checks line endings, final newlines and trailing whitespace in every file against .editorconfig."
why = "These rules cover the files no formatter touches, so a stray tab or missing newline never lands in a diff. Indentation is the formatters' job and is not checked here."
help = "Fix the line the checker names; most editors apply .editorconfig on save."

[[settings]]
name = "format.indent_style"
kind = "string"
direction = "neutral"
default = "space"
summary = "What one indent level is made of: space or tab."

[[settings]]
name = "format.indent_width"
kind = "number"
direction = "neutral"
default = 4
summary = "Spaces per indent level."

[[settings]]
name = "format.print_width"
kind = "number"
direction = "neutral"
default = 120
summary = "The line width formatters wrap at."

[[settings]]
name = "format.line_ending"
kind = "string"
direction = "neutral"
default = "lf"
summary = "The line ending every file uses: lf or crlf."

[[settings]]
name = "format.newline_at_end"
kind = "boolean"
direction = "neutral"
default = true
summary = "Whether every file ends with a newline."

[[settings]]
name = "format.quotes"
kind = "string"
direction = "neutral"
default = "single"
summary = "single or double, for the languages where a formatter chooses."

[[settings]]
name = "format.trailing_comma"
kind = "string"
direction = "neutral"
default = "all"
summary = "Where trailing commas go: all, es5, or none."

[[settings]]
name = "format.semicolons"
kind = "boolean"
direction = "neutral"
default = true
summary = "Whether JavaScript and TypeScript statements end with semicolons."

[[settings]]
name = "tools.editorconfig.extra"
kind = "table"
direction = "neutral"
summary = "A section gspot does not render, added verbatim to .editorconfig with a reason."

[[settings]]
name = "format.overrides"
kind = "list"
direction = "neutral"
summary = "Ordered formatting options for config-root paths, bounded by their declaring scope. Apply preserves selectors for current and future files."

[[settings]]
name = "tools.prettier.ignore_patterns"
kind = "list"
direction = "neutral"
summary = "Ordered native Prettier ignore lines, including negations, preserved during adoption."

[[settings]]
name = "tools.prettier.native_defaults"
kind = "boolean"
direction = "neutral"
default = false
summary = "Use native Prettier defaults and EditorConfig values for options not explicitly set in policy."

[[settings]]
name = "tools.editorconfig.adopted"
kind = "table"
direction = "neutral"
summary = "Ordered native EditorConfig sections and preambles, including nested directory documents, retained as data during adoption."
