[configuration]
name = "dependencies"
kind = "policy"
title = "Dependencies"
default = true
description = "Dependency health: known advisories, one version for each dependency, exact pins, one package manager, and a lockfile that matches its manifest."

[detect]
filenames = ["package.json", "pyproject.toml", "Package.swift", "Cargo.toml", "go.mod", "Gemfile"]

[claims]
filenames = ["package.json", "bun.lock", "bun.lockb", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bunfig.toml", ".npmrc", "pnpm-workspace.yaml", "pyproject.toml", "uv.lock", "requirements*.txt", "Package.swift", "Package.resolved", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "Gemfile.lock"]
natures = ["source", "generated"]

[[tools]]
name = "osv-scanner"
version = "2.6.0"
floor = "2.0.0"
mise = "osv-scanner"
brew = "osv-scanner"
github = {name = "google/osv-scanner", version = "v2.6.0"}
winget = "Google.OSVScanner"
scoop = "osv-scanner"

[[tools.takeover]]
file = "osv-scanner.toml"
carries = "advisories"

[[tools]]
name = "syncpack"
version = "15.3.3"
npm = "syncpack"
mise = "npm:syncpack"

[[tools.takeover]]
file = ".syncpackrc"
carries = "rules-table"

[[tools.takeover]]
file = ".syncpackrc.json"
carries = "rules-table"

[[tools.takeover]]
file = ".syncpackrc.js"
carries = "rules-table"

[[tools.takeover]]
file = ".syncpackrc.cjs"
carries = "rules-table"

[[tools.takeover]]
file = "syncpack.config.js"
carries = "rules-table"

[[tools.takeover]]
file = "syncpack.config.cjs"
carries = "rules-table"

[[tools.takeover]]
file = "syncpack.config.mjs"
carries = "rules-table"

[[configs]]
template = "osv-scanner.toml.tmpl"
target = ".gspot/config/osv-scanner.toml"
pointer = {path = "osv-scanner.toml", copy = true}

[[configs]]
template = "syncpack.json.tmpl"
target = ".gspot/config/syncpack.json"
header = false

[[checks]]
name = "dependencies/osv"
title = "OSV"
example = "A locked dependency version affected by a published OSV advisory reports the package and advisory. Upgrade to a reviewed fixed version and update the lockfile, then rescan. Available findings depend on the advisory database."
level = "recommended"
stage = "push"
runs = "once"
requires = "network"
command = ["osv-scanner", "scan", "source", "--config", "{config:osv-scanner}", "--format", "json", "--recursive", "{root}"]
coverage = ["advisories"]
output = {format = "json", items = "results", children = "packages.vulnerabilities", fields = {file = "source.path", rule = "id", message = "package.name package.version summary"}}
summary = "Looks up every locked dependency in the Open Source Vulnerabilities (OSV) advisory database."
why = "A dependency with a published advisory is an attack someone already wrote down."
help = "Upgrade the package the finding names. When no fix exists, use gspot set tools.osv.ignore with an entry containing id and reason, and record a date to review it."

[[checks]]
name = "dependencies/syncpack"
title = "Syncpack"
example = "Two workspace manifests declaring different versions of a dependency governed by the same version group report a mismatch. Align both declarations to the reviewed version and update the lockfile."
level = "all"
stage = "push"
runs = "once"
command = ["syncpack", "lint", "--config", "{config:syncpack}"]
tool = "syncpack"
claims = {filenames = ["package.json"]}
coverage = ["consistency"]
output = {format = "lines"}
summary = "Checks that every workspace package resolves each dependency to one version."
why = "Two versions of one dependency in a workspace mean two behaviors, and a bug that appears in one package only."
help = "Run syncpack fix-mismatches with the gspot configuration, or align the versions by hand."

[[checks]]
name = "integrity/manifest-policy"
title = "Manifest policy"
example = "A dependency declared with a range such as `^1.2.3` reports an unpinned version under the exact-version policy. Pin the actual reviewed lockfile version, then update the lockfile through the package manager."
level = "all"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "manifest-policy"
claims = {filenames = ["package.json"]}
coverage = ["consistency"]
summary = "Checks every package.json: exact versions, one packageManager across the workspace, a private root, and one kind of lockfile."
why = "A version range installs a different tree tomorrow, and two package managers produce two trees today."
help = "Pin the version the lockfile holds, name one packageManager, mark a workspace root private, and delete the lockfile of the manager the repository does not use."

[[checks]]
name = "integrity/lockfile-fresh"
title = "Keep lockfiles current"
example = "Adding a dependency to a package manifest without updating its lockfile reports a stale lock. Run the owning package manager installation, inspect its manifest and lock changes, and retain both together."
level = "recommended"
stage = "push"
runs = "once"
engine = "integrity"
analysis = "lockfile-fresh"
coverage = ["consistency"]
summary = "Checks npm, Bun, pnpm, Yarn, and uv lockfiles with isolated native frozen installs."
why = "A lockfile that lags its manifest installs versions nobody reviewed the moment someone runs a plain install."
help = "Run the install of the package manager once and commit the lockfile it writes."

[[checks]]
name = "integrity/install-policy"
title = "Install policy"
example = "A Bun project without the required `[install] minimumReleaseAge` reports a missing installation safeguard. Set it to the seconds named in the finding and configure the required scanner under `[install.security]`."
level = "all"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "install-policy"
claims = {filenames = ["bunfig.toml", "bun.lock", "bun.lockb", "package.json"]}
coverage = ["consistency"]
summary = "Checks that the install configuration waits out a minimum release age, and names the security scanner the policy asks for."
why = "Most malicious releases are pulled within days, so a package nobody installs in its first week rarely harms anybody."
help = "Set [install] minimumReleaseAge in bunfig.toml to the seconds the message names, and the scanner under [install.security]."

[[checks]]
name = "integrity/lockfile-hosts"
title = "Lockfile hosts"
example = "A locked package URL pointing to a host outside `tools.dependencies.registry_hosts` reports that host. Resolve the package again from the approved registry, or review and explicitly allow the required host."
level = "recommended"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "lockfile-hosts"
coverage = ["consistency"]
summary = "Checks that every URL in a lockfile is HTTPS and points at an allowed registry host."
why = "A lockfile line that resolves from another host installs code nobody chose, and a review rarely reads lockfiles."
help = "Install the package from the registry again, or add the host to tools.dependencies.registry_hosts."

[[settings]]
name = "tools.install.min_release_age_days"
kind = "number"
direction = "floor"
default = 7
summary = "The fewest days a release has existed before the package manager installs it."

[[settings]]
name = "tools.install.security_scanner"
kind = "string"
direction = "neutral"
default = ""
summary = "The security scanner the install configuration names; empty asks for none."

[[settings]]
name = "tools.dependencies.registry_hosts"
kind = "list"
direction = "neutral"
default = ["registry.npmjs.org", "registry.yarnpkg.com", "codeload.github.com", "github.com"]
summary = "The hosts a lockfile may resolve packages from."

[[settings]]
name = "tools.osv.ignore"
kind = "list"
direction = "loosening"
default = []
summary = "Advisories accepted until a review date: the id, the reason, and that date."

[[settings]]
name = "tools.dependencies.ranges_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Manifests that may hold version ranges, such as a library others install, each with a reason."

[rule_files]
code = ["general/code/DEPENDENCIES.md"]
