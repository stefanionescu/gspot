allowed_words = ["Zustand"]

[configuration]
description = "Zustand: state lives in store files, and components read it through a selector."
requires = ["javascript"]
title = "Zustand"

[detect]
dependencies = ["zustand"]

[[eslint.selectors]]
message = "Create stores only in the files of zustand.store_files."
selector = "CallExpression[callee.name=/^use[A-Z]\\w*Store$/][arguments.length=0], CallExpression[callee.name='useStore'][arguments.length=1]"
