eslint_all_rules = [
    "i18next/no-literal-string",
]

[configuration]
title = "Translations"
requires = ["javascript"]
description = "Translated interfaces: no literal text in components, and message files that parse and stay complete in every locale."

[detect]
dependencies = ["next-intl", "react-i18next", "i18next", "react-intl", "@lingui/core"]

[[tool]]
name = "eslint-plugin-i18next"
kind = "library"
version = "6.1.5"
npm = "eslint-plugin-i18next"

[[check]]
name = "locales"
title = "Check message files"
example = "If the base locale defines `welcome` but another required locale does not, the check reports the missing key. Add the translated message with matching interpolation arguments."
level = "recommended"
stage = "push"
runs = "scope"
when = { dependencies = ["next-intl"] }
summary = "Checks next-intl JSON/ICU message files under translations.messages_folder: each message parses, none is empty, no key holds a dot, and every locale holds every key of the base."
why = "A key missing in one locale shows the key itself, or another language, in the middle of a translated screen."
help = "Correct the message, or add the missing key to the locale."

[[setting]]
name = "translations.messages_folder"
type = "path"
default = ""
summary = "The folder of `<locale>`.json message files, relative to its scope."

[[setting]]
name = "translations.base_locale"
type = "string"
default = "en"
summary = "The locale whose message keys every other locale must contain."
