[configuration]
title = "Translations"
requires = ["javascript"]
description = "Translated interfaces: no literal text in components, and message files that parse and stay complete in every locale."

[detect]
dependencies = ["next-intl", "react-i18next", "i18next", "react-intl", "@lingui/core"]

[[tool]]
name = "eslint-plugin-i18next"
rule_prefix = "i18next"
kind = "library"
version = "6.1.5"
npm = "eslint-plugin-i18next"

[[check]]
name = "messages"
example = "If the base locale defines `welcome` but another required locale does not, the check reports the missing key. Add the translated message with matching interpolation arguments."
level = "recommended"
stage = "push"
runs = "scope"
summary = "Checks next-intl JSON/ICU message files under translations.messages_folder: each message parses, none is empty, and every locale holds every key of the base."
why = "next-intl reads one locale at a time, so only a comparison of each locale with the base locale finds a key that a locale lacks."
help = "Correct the message, or add the missing key to the locale."

[check.when]
dependencies = ["next-intl"]
setting = "translations.messages_folder"

[rules."NEXT-INTL.md"]
dependencies = ["next-intl"]

[eslint]
all_level_rules = ["i18next/no-literal-string"]

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true
required_tools = ["eslint-plugin-i18next"]
