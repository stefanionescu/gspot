allowed_words = ["tRPC"]

[configuration]
description = "tRPC routers: every procedure validates its input, and other code imports the files of `trpc.server_files` as types only."
requires = ["javascript"]
title = "tRPC"

[detect]
dependencies = ["@trpc/server"]

[[eslint.selectors]]
message = "Give the procedure an input schema before its resolver, even when the input is nothing."
files_setting = "trpc.router_files"
selector = "CallExpression[callee.property.name=/^(query|mutation|subscription)$/]:not(:has(CallExpression[callee.property.name='input']))"
