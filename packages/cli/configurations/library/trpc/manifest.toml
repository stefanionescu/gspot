[configuration]
title = "tRPC"
requires = ["javascript"]
description = "tRPC routers: every procedure validates its input, and client code imports the declared server module as a type only."

[detect]
dependencies = ["@trpc/server"]

[[config]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true

[[config.selectors]]
selector = "CallExpression[callee.property.name=/^(query|mutation|subscription)$/]:not(:has(CallExpression[callee.property.name='input']))"
message = "Give the procedure an input schema before its resolver, even when the input is nothing."
files = ["**/routers/**/*.ts", "**/*router*.ts", "**/trpc/**/*.ts"]
