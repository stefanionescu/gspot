allowed_words = ["tRPC"]

[configuration]
description = "tRPC routers: every procedure validates its input, and client code imports the server files of trpc.server_files as types only."
requires = ["javascript"]
title = "tRPC"

[detect]
dependencies = ["@trpc/server", "@trpc/client"]

[[eslint.selectors]]
message = "Give the procedure an input schema before its resolver, even when the input is nothing."
paths_setting = "trpc.router_files"
selector = "CallExpression[callee.property.name=/^(query|mutation|subscription)$/]:matches([callee.object.name=/Procedure$/], [callee.object.property.name='procedure'], [callee.object.callee.property.name=/^(use|meta|output|concat)$/]):not(:has(CallExpression[callee.property.name='input']))"
