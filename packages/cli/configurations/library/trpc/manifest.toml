[configuration]
name = "trpc"
kind = "library"
title = "tRPC"
requires = ["javascript"]
description = "tRPC routers: every procedure validates its input, and client code imports the router as a type only."

[detect]
dependencies = ["@trpc/server"]

[[configs]]
target = ".gspot/config/eslint.config.mjs"
fragment = true

[[configs.selectors]]
selector = "CallExpression[callee.property.name=/^(query|mutation|subscription)$/]:not(:has(CallExpression[callee.property.name='input']))"
message = "Give the procedure an input schema before its resolver, even when the input is nothing."
files = ["**/routers/**/*.ts", "**/*router*.ts", "**/trpc/**/*.ts"]

[[checks]]
name = "trpc/router-boundaries"
title = "Router boundaries"
example = "A client module importing a server router as a runtime value reports a boundary finding. Import only the router type with `import type`, and make requests through the tRPC client."
level = "recommended"
stage = "commit"
engine = "integrity"
analysis = "trpc-boundaries"
claims = {extensions = [".ts", ".tsx"]}
coverage = ["structure"]
summary = "Checks that code outside the server paths imports from them as a type only."
why = "A value import of the router pulls the server, its secrets, and its database client into the client bundle."
help = "Import the router type with import type, and call the server through the client."

[[settings]]
name = "tools.trpc.server_files"
kind = "list"
direction = "neutral"
default = ["**/server/**"]
summary = "Server file globs used when architecture.elements has no server element. An explicit server element owns the boundary."

[rule_files]
library = ["library/trpc/TRPC.md"]
