products = ["Drizzle"]
[configuration]
title = "Drizzle"
requires = ["javascript"]
description = "Drizzle: no update or delete without a where, raw SQL only where the policy allows it, relations for every reference, and migrations that match the schema."

[detect]
dependencies = ["drizzle-orm"]

[[tool]]
name = "eslint-plugin-drizzle"
kind = "library"
version = "0.2.3"
npm = "eslint-plugin-drizzle"

[[tool]]
name = "drizzle-kit"
system = true
min_version = "0.20.0"
npm = "drizzle-kit"

[[tool_file]]
source = "eslint.fragment.js.eta"
selectors = [{ selector = "TaggedTemplateExpression[tag.name='sql']", message = "Raw SQL skips the types of the schema. Use the query builder, or accept this finding with a rule-specific ignore." }]

[[check]]
name = "relations"
title = "Declare every Drizzle relation"
example = "An exported `orders` table whose column uses `.references(() => users.id)` reports `relations` when the scope has no `relations(orders, ...)` declaration. Add that declaration with the table's actual relationships and rerun. The check recognizes the supported source forms; it does not execute the schema."
level = "all"
stage = "commit"
runs = "scope"
files = { extensions = [".ts"] }
summary = "Checks that every table with a reference has a relations entry."
why = "Relational queries through `db.query` read relations. SQL joins do not need them."
help = "Add a relations call for the table."

[[check]]
name = "stale-migrations"
command = ["drizzle-kit", "generate"]
generated_paths = [{ pattern = "**/*" }]
title = "Keep Drizzle migrations current"
example = "Changing a Drizzle schema without generating its migration reports drift. Run `drizzle-kit generate` with the project configuration, inspect the new migration, and retain it before rerunning."
level = "recommended"
stage = "push"
runs = "scope"
tool = "drizzle-kit"
files = { paths = ["drizzle.config.ts", "drizzle.config.js", "drizzle.config.mts", "drizzle.config.mjs", "drizzle.config.cts", "drizzle.config.cjs"] }
summary = "Asks drizzle-kit to write migrations, and fails when it writes one."
why = "A schema change with no migration works on the machine that pushed the schema and nowhere else."
help = "Run drizzle-kit generate and commit the migration."

[[setting]]
name = "drizzle.client_names"
type = "list"
items = "string"
default = ["db"]
summary = "The Drizzle client identifiers checked for update and delete operations without a where clause."

[agent_rules]
"DRIZZLE.md" = { dependencies = ["pg", "postgres"] }
