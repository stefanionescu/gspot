allowed_words = ["Drizzle"]

[configuration]
description = "Drizzle: no update or delete without `where`, raw SQL only at paths the settings allow, and migrations that match the schema."
requires = ["javascript"]
title = "Drizzle"

[detect]
dependencies = ["drizzle-orm"]

[rules."DRIZZLE.md"]
dependencies = ["pg", "postgres"]

[[tool]]
kind = "library"
name = "eslint-plugin-drizzle"
npm = "eslint-plugin-drizzle"
rule_prefix = "drizzle"
version = "0.2.3"

[[tool]]
install_hint = "Run: npm install --save-dev drizzle-kit"
min_version = "0.21.0"
name = "drizzle-kit"
npm = "drizzle-kit"
system = true
version_command = ["--version"]

[[eslint.selectors]]
message = "Raw SQL skips the types of the schema. Use the query builder, or accept this finding with a rule-specific ignore."
selector = "TaggedTemplateExpression[tag.name='sql']"

[eslint]
required_tools = ["eslint-plugin-drizzle"]

[[check]]
command = ["drizzle-kit", "generate"]
example = "A schema change with no new migration reports drift. Run `drizzle-kit generate`, review the migration, and commit it."
help = "Run `drizzle-kit generate` and commit the migration."
level = "recommended"
name = "stale-migrations"
runs = "scope"
stage = "push"
summary = "Runs `drizzle-kit generate` and fails when it creates a migration."
tool = "drizzle-kit"
why = "A schema change with no migration works only on the machine that pushed it."

[[check.generator_outputs]]
pattern = "**/*"

[check.files]
paths = ["drizzle.config.ts", "drizzle.config.js", "drizzle.config.mts", "drizzle.config.mjs", "drizzle.config.cts", "drizzle.config.cjs"]
