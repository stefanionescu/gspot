allowed_words = ["Drizzle"]

[configuration]
title = "Drizzle"
requires = ["javascript"]
description = "Drizzle: no update or delete without a where, raw SQL only where the settings allow it, relations for every reference, and migrations that match the schema."

[detect]
dependencies = ["drizzle-orm"]

[[tool]]
name = "eslint-plugin-drizzle"
rule_prefix = "drizzle"
kind = "library"
version = "0.2.3"
npm = "eslint-plugin-drizzle"

[[tool]]
name = "drizzle-kit"
install_hint = "Run: npm install --save-dev drizzle-kit"
system = true
version_command = ["--version"]
min_version = "0.21.0"
npm = "drizzle-kit"

[[check]]
name = "relations"
example = "An exported `orders` table whose column uses `.references(() => users.id)` reports `relations` when the scope has no `relations(orders, ...)` declaration. Add that declaration with the table's actual relationships and rerun. The check recognizes the supported source forms; it does not execute the schema."
level = "all"
stage = "commit"
runs = "scope"
summary = "Checks that every table with a reference has a relations entry."
why = "Relational queries through `db.query` read relations. SQL joins do not need them."
help = "Add a relations call for the table."

[check.files]
extensions = [".ts"]

[[check]]
name = "stale-migrations"
command = ["drizzle-kit", "generate"]
example = "Changing a Drizzle schema without generating its migration reports drift. Run `drizzle-kit generate` with the project configuration, inspect the new migration, and retain it before rerunning."
level = "recommended"
stage = "push"
runs = "scope"
tool = "drizzle-kit"
summary = "Asks drizzle-kit to write migrations, and fails when it writes one."
why = "A schema change with no migration works on the machine that pushed the schema and nowhere else."
help = "Run drizzle-kit generate and commit the migration."

[[check.generated_paths]]
pattern = "**/*"

[check.files]
paths = ["drizzle.config.ts", "drizzle.config.js", "drizzle.config.mts", "drizzle.config.mjs", "drizzle.config.cts", "drizzle.config.cjs"]

[rules."DRIZZLE.md"]
dependencies = ["pg", "postgres"]

[[eslint.selectors]]
selector = "TaggedTemplateExpression[tag.name='sql']"
message = "Raw SQL skips the types of the schema. Use the query builder, or accept this finding with a rule-specific ignore."

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true
required_tools = ["eslint-plugin-drizzle"]
