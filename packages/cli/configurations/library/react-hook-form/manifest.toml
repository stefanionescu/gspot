[configuration]
title = "React Hook Form"
requires = ["javascript"]
description = "React Hook Form: a form validates through a resolver, and a registered field is not also controlled."

[detect]
dependencies = ["react-hook-form"]

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true

[[tool_file.selectors]]
selector = "CallExpression[callee.name='useForm']:not(:has(Property[key.name='resolver']))"
message = "Give useForm a resolver, so the schema that types the form also validates it."

[[tool_file.selectors]]
selector = "JSXOpeningElement:has(JSXSpreadAttribute CallExpression[callee.name='register']):has(JSXAttribute[name.name='value']):not(:has(JSXAttribute[name.name='type'] > Literal[value=/^(checkbox|radio)$/]))"
message = "A registered field is uncontrolled. Drop the value attribute, or use a Controller."
