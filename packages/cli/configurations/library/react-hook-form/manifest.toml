[configuration]
description = "React Hook Form: each form validates through a resolver, and no registered field also acts as a controlled one."
requires = ["javascript"]
title = "React Hook Form"

[detect]
dependencies = ["react-hook-form"]

[[eslint.selectors]]
message = "Give useForm a resolver, so the schema that types the form also validates it."
selector = "CallExpression[callee.name='useForm'][arguments.length=0], CallExpression[callee.name='useForm'] > ObjectExpression:first-child:not(:has(> Property[key.name='resolver'])):not(:has(> SpreadElement))"

[[eslint.selectors]]
message = "A registered field that also takes `value` acts as a controlled field. Drop `value`, or use Controller."
selector = "JSXOpeningElement:has(JSXSpreadAttribute CallExpression:matches([callee.name='register'], [callee.property.name='register'])):has(JSXAttribute[name.name=value]):not(:has([name.name=type]>[value=/^(checkbox|radio)$/]))"
