[configuration]
description = "Lint rules for test files in projects that depend on Testing Library."
requires = ["javascript"]
title = "Testing Library"

[detect]
dependencies = ["@testing-library/*"]

[[tool]]
kind = "library"
name = "eslint-plugin-testing-library"
npm = "eslint-plugin-testing-library"
rule_prefix = "testing-library"
version = "7.16.2"

[eslint]
required_tools = ["eslint-plugin-testing-library"]
all_level_rules = ["testing-library/no-container", "testing-library/no-node-access", "testing-library/no-render-in-lifecycle", "testing-library/prefer-screen-queries", "testing-library/render-result-naming-convention"]
