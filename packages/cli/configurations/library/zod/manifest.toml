allowed_words = ["Zod"]

[configuration]
description = "Zod: ESLint rules reject unsafe schema APIs and name the replacement for each deprecated one."
requires = ["javascript"]
title = "Zod"

[detect]
dependencies = ["zod"]

[[tool]]
kind = "library"
name = "eslint-plugin-zod"
npm = "eslint-plugin-zod"
rule_prefix = "zod"
version = "4.12.0"

[eslint]
all_level_rules = ["zod/no-any-schema", "zod/no-native-enum", "zod/prefer-meta-last", "zod/prefer-strict-object"]

[[tool_file]]
fragment = true
required_tools = ["eslint-plugin-zod"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
