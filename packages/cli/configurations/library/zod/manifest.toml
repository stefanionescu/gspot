products = ["Zod"]
eslint_all_rules = [
    "zod/no-any-schema",
    "zod/no-native-enum",
    "zod/prefer-meta-last",
    "zod/prefer-strict-object",
]

[configuration]
title = "Zod"
requires = ["javascript"]
description = "Zod schemas: ESLint rules reject unsafe schema APIs and recommend replacements for deprecated APIs."

[detect]
dependencies = ["zod"]

[[tool]]
name = "eslint-plugin-zod"
kind = "library"
version = "4.12.0"
npm = "eslint-plugin-zod"
