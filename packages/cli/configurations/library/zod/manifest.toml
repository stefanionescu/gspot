allowed_words = ["Zod"]

[configuration]
description = "Zod schemas: no unsafe APIs, and the replacement for each deprecated one."
requires = ["javascript"]
title = "Zod"

[detect]
dependencies = ["zod"]

[[tool]]
kind = "library"
name = "eslint-plugin-zod"
npm = "eslint-plugin-zod"
rule_prefix = "zod"
version = "4.12.0"

[eslint]
required_tools = ["eslint-plugin-zod"]
all_level_rules = ["zod/no-any-schema", "zod/no-native-enum", "zod/prefer-meta-last", "zod/prefer-strict-object"]
