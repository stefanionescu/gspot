allowed_words = ["TanStack"]

[configuration]
title = "TanStack Query"
requires = ["javascript"]
description = "TanStack Query: the query rules of ESLint for dependency lists, stable clients, and query options in order."

[detect]
dependencies = ["@tanstack/react-query", "@tanstack/query-core", "@tanstack/vue-query", "@tanstack/svelte-query", "@tanstack/solid-query", "@tanstack/angular-query-experimental"]

[[tool]]
name = "@tanstack/eslint-plugin-query"
rule_prefix = "@tanstack/query"
kind = "library"
version = "5.91.2"
npm = "@tanstack/eslint-plugin-query"

[eslint.presets.recommended]
package = "@tanstack/eslint-plugin-query"
source = "configs.flat/recommended"

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true
required_tools = ["@tanstack/eslint-plugin-query"]
