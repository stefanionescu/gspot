[configuration]
name = "vue"
kind = "framework"
title = "Vue"
requires = ["javascript"]
recommends = ["typescript", "css", "vitest"]
description = "Vue single-file components: ESLint reads the template and the script together, with the recommended Vue and accessibility rules as errors, and the Testing Library rules read test files."

[detect]
dependencies = ["vue"]
extensions = [".vue"]

[claims]
extensions = [".vue"]
natures = ["source"]

[[tools]]
name = "eslint-plugin-vue"
kind = "library"
version = "10.11.0"
npm = "eslint-plugin-vue"

[[tools]]
name = "vue-eslint-parser"
kind = "library"
version = "10.4.1"
npm = "vue-eslint-parser"

[[tools]]
name = "eslint-plugin-vuejs-accessibility"
kind = "library"
version = "2.6.0"
npm = "eslint-plugin-vuejs-accessibility"

[[tools]]
name = "eslint-plugin-testing-library"
kind = "library"
version = "7.16.2"
npm = "eslint-plugin-testing-library"

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
fragment = true

[[checks]]
name = "vue/eslint"
title = "ESLint"
example = "A Vue template containing `<div v-html=\"html\"></div>` reports `vue/no-v-html`. Render text with interpolation, such as `<p>{{ name }}</p>`, when the component needs text rather than injected markup."
level = "all"
stage = "commit"
runs = "per-file-list"
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{config:eslint}", "--format", "json", "{files}"]
fix_command = ["eslint", "--fix", "--config", "{config:eslint}", "{files}"]
fix_order = "codemod"
findings_exit_codes = [1]
fix_findings_exit_codes = [1]
tool = "eslint"
claims = {extensions = [".vue"]}
coverage = ["style", "syntax", "structure"]
output = {format = "eslint-json"}
tool_errors = "^Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:"
summary = "Runs ESLint with the Vue plugin over every .vue file. It reads the markup and the script together."
why = "A component file is markup and code in one, and a plain JavaScript parser reads neither half of it."
help = "Run gspot check --fix for the rules that fix themselves, then read each remaining line; gspot explain <rule> says what it means."

[coverage]
".vue" = ["format", "syntax", "style", "structure", "spelling"]

[rule_files]
framework = ["framework/vue/VUE.md"]

[required_rules]
vue = ["vue/no-v-html", "vue/require-v-for-key", "vue/no-mutating-props", "vue/no-use-v-if-with-v-for"]
