[configuration]
description = "Vue components: template, script, and accessibility rules, HTML injection checks at both levels, and naming and ordering rules at level all."
requires = ["javascript"]
suggests = ["typescript", "css"]
title = "Vue"

[detect]
dependencies = ["vue"]
extensions = [".vue"]

[files]
extensions = [".vue"]

[defaults]
"tools.eslint.import_extension" = "extensionless"

[[tool]]
kind = "library"
name = "eslint-plugin-vue"
npm = "eslint-plugin-vue"
rule_prefix = "vue"
version = "10.11.1"

[tool.eslint]
extensions = [".vue"]

[[tool]]
kind = "library"
name = "vue-eslint-parser"
npm = "vue-eslint-parser"
version = "10.4.1"

[[tool]]
kind = "library"
name = "eslint-plugin-vuejs-accessibility"
npm = "eslint-plugin-vuejs-accessibility"
rule_prefix = "vuejs-accessibility"
version = "2.6.2"

[[tool]]
name = "vue-tsc"
npm = "vue-tsc"
version = "3.3.13"

[eslint]
required_tools = ["eslint-plugin-vue", "vue-eslint-parser", "eslint-plugin-vuejs-accessibility"]
all_level_rules = ["vue/no-useless-v-bind", "vue/prefer-true-attribute-shorthand", "vue/attribute-hyphenation", "vue/attributes-order", "vue/block-order", "vue/component-api-style", "vue/component-definition-name-casing", "vue/define-emits-declaration", "vue/define-props-declaration", "vue/multi-word-component-names", "vue/one-component-per-file", "vue/order-in-components", "vue/prop-name-casing", "vue/this-in-template", "vue/v-bind-style", "vue/v-on-event-hyphenation", "vue/v-on-style", "vue/v-slot-style"]

[[check]]
cwd = "scope"
example = "`const count: number = 'one';` in a component script reports an incompatible assignment. Assign a number, such as `const count: number = 1;`."
help = "Fix the first error vue-tsc prints; later errors often come from the same mistake."
instead_of = "typescript/tsc"
name = "vue-tsc"
runs = "scope"
stage = "push"
summary = "Type-checks every Vue component and TypeScript file of the scope with the strict compiler options."
tool = "vue-tsc"
why = "tsc cannot parse a component file, so a type error inside one ships unless vue-tsc catches it."

[check.when]
configuration = "typescript"

[check.files]
extensions = [".vue"]

[check.output]
format = "regex"
pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"
