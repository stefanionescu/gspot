[configuration]
description = "ESLint checks Vue templates, scripts, and accessibility. Attribute spelling, component names, declarations, ordering, and default props wait for level all. HTML injection checks run at both levels."
requires = ["javascript"]
suggests = ["typescript", "css"]
title = "Vue"

[detect]
dependencies = ["vue"]
extensions = [".vue"]

[files]
extensions = [".vue"]

[[tool]]
kind = "library"
name = "eslint-plugin-vue"
npm = "eslint-plugin-vue"
rule_prefix = "vue"
version = "10.11.0"

[tool.eslint]
extensions = [".vue"]

[[tool]]
kind = "library"
name = "vue-eslint-parser"
npm = "vue-eslint-parser"
version = "10.4.1"

[[tool]]
kind = "library"
name = "eslint-plugin-vuejs-accessibility"
npm = "eslint-plugin-vuejs-accessibility"
rule_prefix = "vuejs-accessibility"
version = "2.6.0"

[[tool]]
name = "vue-tsc"
npm = "vue-tsc"
version = "3.3.11"

[[check]]
cwd = "scope"
example = "A component script containing `const count: number = 'one';` reports an incompatible assignment. Correct it to `const count: number = 1;` when the contract requires a number."
help = "Read the first error vue-tsc prints and fix that file; later errors are often the same mistake."
instead_of = "typescript/tsc"
level = "recommended"
name = "vue-tsc"
runs = "scope"
stage = "push"
summary = "Type-checks every Vue component and TypeScript file of the scope with the strict compiler options."
tool = "vue-tsc"
why = "The TypeScript compiler cannot read a component file, so a type error inside one ships unless the Vue checker reads it."

[check.when]
configuration = "typescript"

[check.files]
extensions = [".vue"]

[check.output]
format = "regex"
pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"

[eslint]
all_level_rules = ["vue/no-useless-v-bind", "vue/prefer-true-attribute-shorthand", "vue/attribute-hyphenation", "vue/attributes-order", "vue/block-order", "vue/component-api-style", "vue/component-definition-name-casing", "vue/define-emits-declaration", "vue/define-props-declaration", "vue/multi-word-component-names", "vue/one-component-per-file", "vue/order-in-components", "vue/prop-name-casing", "vue/require-default-prop", "vue/this-in-template", "vue/v-bind-style", "vue/v-on-event-hyphenation", "vue/v-on-style", "vue/v-slot-style"]

[eslint.presets.recommended]
package = "eslint-plugin-vue"
source = "configs.flat/recommended"

[eslint.presets.accessibility]
package = "eslint-plugin-vuejs-accessibility"
source = "configs.flat/recommended"

[defaults]
"tools.eslint.import_extension" = "extensionless"

[[tool_file]]
fragment = true
required_tools = ["eslint-plugin-vue", "vue-eslint-parser", "eslint-plugin-vuejs-accessibility"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
