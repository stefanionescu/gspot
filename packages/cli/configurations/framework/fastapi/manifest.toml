[configuration]
description = "Checks FastAPI route declarations with Ruff. Adds Semgrep request-handling rules when security is selected and suggests the OpenAPI configuration."
requires = ["python"]
suggests = ["openapi"]
title = "FastAPI"

[detect]
dependencies = ["fastapi"]

[ruff]
recommended = ["FAST001", "FAST002", "FAST003"]

[[tool_file]]
per_scope = true
target = ".gspot/config/semgrep/fastapi.yml"
tool = "semgrep"
when = { configuration = "security" }
