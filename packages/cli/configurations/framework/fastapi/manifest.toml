[configuration]
title = "FastAPI"
requires = ["python", "openapi"]
suggests = ["security"]
description = "Checks FastAPI route declarations with Ruff. Adds Semgrep request-handling rules when security is selected and requires the OpenAPI configuration."

[detect]
dependencies = ["fastapi"]

[[tool_file]]
source = "semgrep/fastapi.yml.eta"
target = ".gspot/config/semgrep/fastapi.yml"
tool = "semgrep"
rule_keys = ["rules"]
scoped = true
when = { configuration = "security" }

[ruff_rules]
recommended = ["FAST001", "FAST002", "FAST003"]
