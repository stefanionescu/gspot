allowed_words = ["Next.js"]
generated = ["next-env.d.ts"]

[[naming.override]]
allowed_names = ["page", "layout", "template", "default", "loading", "error", "not-found", "global-error", "route", "middleware", "proxy", "instrumentation", "sitemap", "robots", "manifest", "opengraph-image", "icon", "apple-icon", "_app", "_document", "_error", "404", "500"]
categories = ["files"]
paths = ["**/app/**", "**/pages/**"]
reason = "Next.js names these files."

[[naming.override]]
allowed_names = ["getStaticProps", "getServerSideProps", "generateMetadata", "generateStaticParams", "generateViewport"]
categories = ["functions", "methods", "variables"]
languages = ["typescript", "javascript"]
paths = ["**"]
reason = "Next.js discovers these data and metadata exports by name."

[configuration]
description = "A Next.js app: the framework and hooks rules of ESLint, and server code marked as server only. The configuration turns no build check off."
requires = ["typescript", "react", "react-dom"]
suggests = ["css"]
title = "Next.js"

[detect]
dependencies = ["next"]

[files]
paths = ["**/next.config.js", "**/next.config.mjs", "**/next.config.ts"]

[[tool]]
min_version = "15.5.0"
name = "next"
system = true
version_command = ["--version"]

[[tool]]
kind = "library"
name = "@next/eslint-plugin-next"
npm = "@next/eslint-plugin-next"
rule_prefix = "@next/next"
version = "16.3.8"

[[check]]
example = "The TypeScript declaration `const count: number = \"one\";` reports an incompatible assignment. Correct it to `const count: number = 1;` when the contract requires a number."
help = "Read the first error tsc prints and fix that file; later errors are often the same mistake."
instead_of = "typescript/tsc"
level = "recommended"
name = "tsc"
runs = "scope"
stage = "push"
summary = "Has Next.js write its types, then type-checks the app with the strict compiler options."
tool = "next"
why = "A fresh clone holds no next-env.d.ts and no route types, so a plain tsc run fails on imports the framework resolves."

[eslint]
all_level_rules = ["@next/next/next-script-for-ga", "@next/next/no-html-link-for-pages", "@next/next/no-img-element", "@next/next/no-page-custom-font"]

[eslint.presets.recommended]
package = "@next/eslint-plugin-next"
source = "configs.core-web-vitals"

[eslint.presets.refresh]
package = "eslint-plugin-react-refresh"
source = "configs.next"

[[eslint.rules_off]]
files = ["**/{page,layout,template,default,loading,error,not-found,global-error,route,middleware,proxy}.{js,jsx,ts,tsx}"]
reason = "Next.js discovers route files by name, so each file can hold one export in its own folder."
rules = ["gspot/no-trivial-files"]

[[tool_file]]
fragment = true
required_tools = ["@next/eslint-plugin-next"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"

[[tool_file]]
per_scope = true
target = ".gspot/config/semgrep/nextjs.yml"
tool = "semgrep"
