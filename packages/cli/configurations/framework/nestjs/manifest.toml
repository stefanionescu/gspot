eslint_presets = { recommended = { package = "@darraghor/eslint-plugin-nestjs-typed", source = "configs.flatRecommended" }, noSwagger = { package = "@darraghor/eslint-plugin-nestjs-typed", source = "configs.flatNoSwagger" } }
eslint_all_rules = [
    "@darraghor/nestjs-typed/api-operation-summary-description-capitalized",
]

compiler_options = { experimentalDecorators = true, emitDecoratorMetadata = true }

[configuration]
title = "NestJS"
requires = ["typescript"]
suggests = ["security"]
description = "A NestJS service: the compiler options decorators need, the NestJS plugin rules for providers, routes, and DTOs, controllers that reach data through a service, and no circular modules."

[detect]
dependencies = ["@nestjs/core"]
filenames = ["nest-cli.json"]

[files]
filenames = ["nest-cli.json"]

[[tool]]
name = "@darraghor/eslint-plugin-nestjs-typed"
rule_prefix = "@darraghor/nestjs-typed"
kind = "library"
version = "7.5.5"
npm = "@darraghor/eslint-plugin-nestjs-typed"

[[tool_file]]
source = "eslint.fragment.js.eta"
# A controller turns a request into a call, and a service owns the data.
selectors = [{ selector = "CallExpression[callee.name='forwardRef']", message = "forwardRef papers over two modules that import each other. Move what both need into a third module." }, { selector = "Decorator[expression.callee.name=/^(Res|Response)$/]:not(:has(Property[key.name='passthrough'][value.value=true]))", message = "Taking the response object turns off interceptors and the return value. Return the value, or pass { passthrough: true }." }, { selector = "TSParameterProperty TSTypeReference[typeName.name=/(Repository|DataSource|EntityManager|PrismaClient|PrismaService)$/]", message = "A controller reaches data through a service. Inject the service, and keep the repository behind it.", files = ["**/*.controller.ts"] }, { selector = "Decorator[expression.callee.name=/^(InjectRepository|InjectModel|InjectDataSource)$/]", message = "A controller reaches data through a service. Inject the service, and keep the repository behind it.", files = ["**/*.controller.ts"] }]

[required_eslint_rules]
ts = ["@typescript-eslint/no-extraneous-class", "no-restricted-syntax"]

[[eslint_rules_off]]
rules = ["gspot/no-trivial-files", "gspot/no-trivial-functions"]
files = ["**/*.module.ts"]
reason = "A Nest module is an empty decorated class that registers providers and controllers, which is the shape Nest asks for."

[[eslint_rules_off]]
rules = ["class-methods-use-this"]
files = ["**/*.{ts,tsx,mts,cts,vue,svelte}"]
reason = "NestJS invokes decorated instance methods through dependency injection even when they do not access instance state."
