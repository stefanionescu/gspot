[shared_prefixes]
kinds = ["controller", "service", "module", "guard", "pipe", "filter", "interceptor", "middleware", "decorator", "gateway", "resolver", "repository", "entity", "dto", "strategy", "provider"]

[configuration]
title = "NestJS"
requires = ["typescript"]
suggests = []
description = "A NestJS service: the compiler options decorators need, the NestJS plugin rules for providers, routes, and DTOs, and no circular modules."

[detect]
dependencies = ["@nestjs/core"]
filenames = ["nest-cli.json"]

[files]
filenames = ["nest-cli.json"]

[[tool]]
name = "@darraghor/eslint-plugin-nestjs-typed"
rule_prefix = "@darraghor/nestjs-typed"
kind = "library"
version = "7.5.5"
npm = "@darraghor/eslint-plugin-nestjs-typed"

[eslint]
all_level_rules = ["@darraghor/nestjs-typed/api-operation-summary-description-capitalized"]

[eslint.presets.recommended]
package = "@darraghor/eslint-plugin-nestjs-typed"
source = "configs.flatRecommended"

[eslint.presets.noSwagger]
package = "@darraghor/eslint-plugin-nestjs-typed"
source = "configs.flatNoSwagger"

[[eslint.rules_off]]
rules = ["gspot/no-trivial-files", "gspot/no-trivial-functions"]
files = ["**/*.module.ts"]
reason = "A Nest module is an empty decorated class that registers providers and controllers, which is the shape Nest asks for."

[[eslint.selectors]]
selector = "CallExpression[callee.name='forwardRef']"
message = "forwardRef papers over two modules that import each other. Move what both need into a third module."

[[eslint.selectors]]
selector = "Decorator[expression.callee.name=/^(Res|Response)$/]:not(:has(Property[key.name='passthrough'][value.value=true]))"
message = "Taking the response object turns off interceptors and the return value. Return the value, or pass { passthrough: true }."

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true
required_tools = ["@darraghor/eslint-plugin-nestjs-typed"]
