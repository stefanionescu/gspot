[configuration]
title = "React Native"
requires = ["react"]
suggests = ["typescript"]
description = "React Native components, styles, and native APIs. Lists use stable keys and virtualized rendering, touch targets use Pressable, and AsyncStorage stores no credentials."

[detect]
dependencies = ["react-native"]

[files]
filenames = ["app.json", "app.config.js", "app.config.ts", "metro.config.js", "eas.json"]

[[tool]]
name = "@react-native/eslint-plugin"
rule_prefix = "@react-native"
kind = "library"
version = "0.87.1"
npm = "@react-native/eslint-plugin"

[[tool]]
name = "eslint-plugin-react-native"
rule_prefix = "react-native"
kind = "library"
version = "5.0.0"
npm = "eslint-plugin-react-native"

[eslint]
all_level_rules = ["react-native/no-color-literals", "react-native/no-inline-styles", "react-native/split-platform-components"]

[[eslint.selectors]]
selector = "ImportDeclaration[source.value='react-native'] > ImportSpecifier[imported.name=/^Touchable(Opacity|Highlight|WithoutFeedback|NativeFeedback)$/]"
message = "Use Pressable. The Touchable components are kept for old code and get no new behavior."

[[eslint.selectors]]
selector = "JSXElement[openingElement.name.name='ScrollView'] > JSXExpressionContainer > CallExpression[callee.property.name='map']"
message = "A ScrollView renders every row at once. Render a list that grows through FlatList."

[[eslint.selectors]]
selector = "CallExpression[callee.object.name='AsyncStorage'][callee.property.name='setItem'] > Literal:first-child[value=/token|secret|password|credential/i]"
message = "AsyncStorage is plain text on the device. Keep a secret in the secure store of the platform."

[[tool_file]]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
fragment = true
required_tools = ["@react-native/eslint-plugin", "eslint-plugin-react-native"]
