

[configuration]
description = "ESLint checks Svelte markup and scripts. DOM manipulation and event-dispatcher typing rules run at level all; HTML injection checks run at both levels."
requires = ["javascript"]
suggests = ["typescript", "css"]
title = "Svelte"

[detect]
dependencies = ["svelte"]
extensions = [".svelte"]

[files]
extensions = [".svelte"]
filenames = ["svelte.config.js", "svelte.config.ts"]

[[tool]]
kind = "library"
name = "eslint-plugin-svelte"
npm = "eslint-plugin-svelte"
rule_prefix = "svelte"
version = "3.23.0"

[tool.eslint]
extensions = [".svelte"]

[[tool]]
kind = "library"
name = "svelte-eslint-parser"
npm = "svelte-eslint-parser"
version = "1.8.1"

[[tool]]
name = "svelte-check"
npm = "svelte-check"
version = "4.7.6"

[[tool]]
kind = "library"
name = "prettier-plugin-svelte"
npm = "prettier-plugin-svelte"
version = "4.1.1"

[tool.prettier]
entry = "plugin.js"
extensions = [".svelte"]

[[tool.prettier.overrides]]
files = "*.svelte"

[tool.prettier.overrides.options]
embeddedLanguageFormatting = "auto"

[[check]]
example = "A component containing `<img src={source} />` reports `a11y_missing_attribute`. Give the image a text alternative, such as `<img src={source} alt={caption} />`."
help = "Read the warning or error svelte-check prints for the file and fix it there; a warning fails the check as an error does."
instead_of = "typescript/tsc"
level = "recommended"
name = "svelte-check"
runs = "scope"
stage = "push"
summary = "Runs svelte-check over the scope: the warnings of the Svelte compiler, its accessibility warnings, and the types of every component and TypeScript file."
tool = "svelte-check"
why = "The TypeScript compiler cannot read a component file, and the Svelte compiler warns about markup that no browser reports."

[check.files]
extensions = [".svelte"]

[eslint]
all_level_rules = ["svelte/no-useless-mustaches", "svelte/prefer-const", "svelte/no-dom-manipulating", "svelte/require-event-dispatcher-types"]

[eslint.presets.recommended]
package = "eslint-plugin-svelte"
source = "configs.recommended"

[defaults]
"tools.eslint.import_extension" = "extensionless"

[[tool_file]]
fragment = true
required_tools = ["eslint-plugin-svelte", "svelte-eslint-parser"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
