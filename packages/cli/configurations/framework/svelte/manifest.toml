[configuration]
name = "svelte"
kind = "framework"
title = "Svelte"
requires = ["javascript"]
recommends = ["typescript", "css", "vitest"]
description = "Svelte components: ESLint reads the markup and the script together with every recommended rule of the Svelte plugin as an error, and the Testing Library rules read test files."

[detect]
dependencies = ["svelte"]
extensions = [".svelte"]

[claims]
extensions = [".svelte"]
filenames = ["svelte.config.js", "svelte.config.ts"]
natures = ["source"]

[[tools]]
name = "eslint-plugin-svelte"
kind = "library"
version = "3.23.0"
npm = "eslint-plugin-svelte"

[[tools]]
name = "svelte-eslint-parser"
kind = "library"
version = "1.8.1"
npm = "svelte-eslint-parser"

[[tools]]
name = "eslint-plugin-testing-library"
kind = "library"
version = "7.16.2"
npm = "eslint-plugin-testing-library"

[[tools]]
name = "svelte-check"
version = "4.7.6"
npm = "svelte-check"

[[tools]]
name = "prettier-plugin-svelte"
kind = "library"
version = "4.1.1"
npm = "prettier-plugin-svelte"
prettier = {entry = "plugin.js", overrides = [{files = "*.svelte", options = {embeddedLanguageFormatting = "auto"}}]}

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/config/eslint.config.mjs"
imports = "eslint.imports.js.tmpl"
fragment = true

[[checks]]
name = "svelte/eslint"
title = "ESLint"
example = "A Svelte template containing `<div>{@html html}</div>` reports `svelte/no-at-html-tags`. Render text with interpolation, such as `<p>{name}</p>`, when the component needs text rather than injected markup."
level = "all"
stage = "commit"
runs = "per-file-list"
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{config:eslint}", "--format", "json", "{files}"]
fix_command = ["eslint", "--fix", "--config", "{config:eslint}", "{files}"]
fix_order = "codemod"
findings_exit_codes = [1]
fix_findings_exit_codes = [1]
tool = "eslint"
claims = {extensions = [".svelte"]}
coverage = ["style", "syntax", "structure"]
output = {format = "eslint-json"}
tool_errors = "^Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:"
summary = "Runs ESLint with the Svelte plugin over every .svelte file. It reads the markup and the script together."
why = "A component file is markup and code in one, and a plain JavaScript parser reads neither half of it."
help = "Run gspot check --fix for the rules that fix themselves, then read each remaining line; gspot explain <rule> says what it means."

[[checks]]
name = "svelte/check"
title = "Check Svelte components"
example = "A component containing `<img src={source} />` reports `a11y_missing_attribute`. Give the image a text alternative, such as `<img src={source} alt={caption} />`."
level = "recommended"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "svelte-check"
takes_over = "typescript/tsc"
claims = {extensions = [".svelte"]}
coverage = ["types", "syntax"]
summary = "Runs svelte-check over the scope: the warnings of the Svelte compiler, its accessibility warnings, and the types of every component and TypeScript file."
why = "The TypeScript compiler cannot read a component file, and the Svelte compiler warns about markup that no browser reports."
help = "Read the warning or error svelte-check prints for the file and fix it there; a warning fails the check as an error does."

[coverage]
".svelte" = ["format", "syntax", "style", "structure", "spelling"]

[rule_files]
framework = ["framework/svelte/SVELTE.md"]

[required_rules]
svelte = ["svelte/no-at-html-tags", "svelte/require-each-key", "svelte/no-target-blank"]
