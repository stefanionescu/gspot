allowed_words = ["React"]

[configuration]
description = "React components: the recommended React and hooks rules as errors, and react-refresh rules, so Fast Refresh keeps component state."
requires = ["javascript"]
suggests = ["typescript", "css", "react-dom"]
title = "React"

[detect]
dependencies = ["react"]

[defaults]
"tools.eslint.import_extension" = "extensionless"

[[naming.override]]
cases = ["pascal", "kebab"]
categories = ["files"]
paths = ["**/*.tsx", "**/*.jsx"]
reason = "A component file takes the component's name."

[[naming.override]]
cases = ["pascal", "camel"]
categories = ["functions"]
paths = ["**/*.tsx", "**/*.jsx"]
reason = "A function that returns JSX is a component and takes a capital."

[[naming.override]]
allowed_names = ["useSyncExternalStore", "getSnapshot", "getServerSnapshot"]
categories = ["functions", "methods", "variables"]
languages = ["typescript", "javascript"]
paths = ["**"]
reason = "React defines these subscription and snapshot callback names."

[[tool]]
kind = "library"
name = "eslint-plugin-react-hooks"
npm = "eslint-plugin-react-hooks"
rule_prefix = "react-hooks"
version = "7.1.1"

[[tool]]
kind = "library"
name = "eslint-plugin-react"
npm = "eslint-plugin-react"
rule_prefix = "react"
version = "7.37.5"

[[tool]]
kind = "library"
name = "eslint-plugin-react-refresh"
npm = "eslint-plugin-react-refresh"
rule_prefix = "react-refresh"
version = "0.5.7"

[eslint]
fragment = true
required_tools = ["eslint-plugin-react-hooks", "eslint-plugin-react", "eslint-plugin-react-refresh"]
all_level_rules = ["react/self-closing-comp", "react/display-name", "react/no-array-index-key", "react/prop-types"]

[[eslint.rules_off]]
files = ["**/*.tsx", "**/*.jsx"]
reason = "React renders a component by its name, so a component of one statement, alone in its file, is the shape React asks for."
rules = ["gspot/no-trivial-files", "gspot/no-trivial-functions"]
