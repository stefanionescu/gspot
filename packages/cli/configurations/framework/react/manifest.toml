allowed_words = ["React"]

[configuration]
description = "React components: the recommended React and hooks rules as errors, and react-refresh rules, so Fast Refresh keeps component state."
requires = ["javascript"]
suggests = ["typescript", "css", "react-dom"]
title = "React"

[detect]
dependencies = ["react"]

[defaults]
"tools.eslint.import_extension" = "extensionless"

[[naming.override]]
cases = ["pascal", "kebab"]
categories = ["files"]
paths = ["**/*.tsx", "**/*.jsx"]
reason = "A component file takes the component's name."

[[naming.override]]
cases = ["pascal", "camel"]
categories = ["functions"]
paths = ["**/*.tsx", "**/*.jsx"]
reason = "A function that returns JSX is a component and takes a capital."

[[naming.override]]
cases = ["camel", "upper-snake", "pascal"]
categories = ["variables"]
paths = ["**/*.tsx", "**/*.jsx"]
reason = "A variable that holds a component, such as a memo or lazy result, takes the component's capital."

[[tool]]
kind = "library"
name = "eslint-plugin-react-hooks"
npm = "eslint-plugin-react-hooks"
rule_prefix = "react-hooks"
version = "7.1.1"

[[tool]]
kind = "library"
name = "@eslint-react/eslint-plugin"
npm = "@eslint-react/eslint-plugin"
rule_prefix = "@eslint-react"
version = "5.28.0"

[[tool]]
kind = "library"
name = "eslint-plugin-react-refresh"
npm = "eslint-plugin-react-refresh"
rule_prefix = "react-refresh"
version = "0.5.7"

[eslint]
required_tools = ["eslint-plugin-react-hooks", "@eslint-react/eslint-plugin", "eslint-plugin-react-refresh"]
all_level_rules = ["@eslint-react/no-missing-component-display-name", "@eslint-react/no-array-index-key"]

[[eslint.rules_off]]
files = ["**/*.tsx", "**/*.jsx"]
reason = "React renders a component by its name, so a component of one statement, alone in its file, is the shape React asks for."
rules = ["gspot/no-trivial-files", "gspot/no-trivial-functions"]

[[eslint.rules_off]]
reason = "eslint-plugin-react-hooks reports the same hook mistakes under its react-hooks/ names."
rules = ["@eslint-react/error-boundaries", "@eslint-react/exhaustive-deps", "@eslint-react/purity", "@eslint-react/rules-of-hooks", "@eslint-react/set-state-in-effect", "@eslint-react/set-state-in-render", "@eslint-react/static-components", "@eslint-react/unsupported-syntax", "@eslint-react/use-memo"]
