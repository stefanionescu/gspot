[configuration]
description = "Expo apps: rules for public environment variables and DOM exports, and Expo's own project and SDK checks. The React Native configuration adds the component and style rules."
requires = ["react-native"]
title = "Expo"

[detect]
dependencies = ["expo"]

[files]
filenames = ["app.json", "app.config.js", "app.config.ts", "eas.json"]

[[tool]]
kind = "library"
name = "eslint-plugin-expo"
npm = "eslint-plugin-expo"
rule_prefix = "expo"
version = "1.1.0"

[[tool]]
name = "expo-doctor"
npm = "expo-doctor"
version = "1.20.4"

[eslint]
required_tools = ["eslint-plugin-expo"]
all_level_rules = ["expo/prefer-box-shadow"]

[[check]]
example = "A `react-native` version that differs from the one the Expo SDK requires fails a Doctor check. Run `npx expo install --check` to install the matching version."
help = "Follow the advice Expo Doctor prints, then run `npx expo install --check`."
level = "recommended"
name = "expo-doctor"
needs = ["network"]
runs = "scope"
stage = "push"
summary = "Runs Expo Doctor and reports each failed check with its details."
tool = "expo-doctor"
why = "A native package on the wrong version for the Expo SDK builds and then crashes on the device."
