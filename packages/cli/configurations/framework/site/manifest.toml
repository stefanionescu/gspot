[configuration]
description = "Sites built to a folder: the build, broken links, page weight, and the sitemap."
requires = ["html"]
suggests = ["css", "javascript"]
title = "Static site"

[detect]
filenames = ["sitemap.xml"]
absent_dependencies = ["next", "nuxt", "@sveltejs/kit", "@remix-run/node", "@react-router/node", "expo"]

[files]
extensions = [".svg"]
filenames = ["site.webmanifest", "sitemap.xml", "robots.txt"]

[[tool]]
name = "lychee"

[[tool]]
name = "purgecss"
npm = "purgecss"
version = "7.0.2"

[[config_file]]
check = "site/html-validate"
per_scope = true
target = "html-validate.json"
tool = "html-validate"

[[config_file]]
check = "site/purgecss"
per_scope = true
target = "purgecss.mjs"
tool = "purgecss"

[[check]]
example = "A build that imports a missing template fails the check. Fix the import, or restore that file."
help = "Run the build command by hand and fix what it prints. Name the command under site.build_command."
level = "recommended"
name = "build"
needs = ["build"]
runs = "scope"
stage = "push"
summary = "Runs `site.build_command`, and fails on an error or a missing output folder."
why = "Other site checks read the built files, so a failed build hides their findings."

[[check]]
example = "A template that writes `<img src=\"logo.png\">` without alternative text reports a finding in the built HTML. Add `alt` text in the template, or `alt=\"\"` for a decorative image."
help = "Fix the template or the content that writes the markup the rule names."
level = "recommended"
name = "html-validate"
needs = ["build"]
output = { format = "json", children = "messages", fields = { file = "filePath", line = "line", column = "column", rule = "ruleId", message = "message" } }
runs = "scope"
stage = "push"
summary = "Validates every built page with html-validate."
tool = "html-validate"
why = "Templates can each be valid and still join into a page with two main elements or a missing label."

[[check]]
example = "A built `.unused-banner` selector that no page or script uses reports a finding. Delete the rule, or list a class that a script adds under `tools.purgecss.safelist` with a reason."
help = "Delete the rule, or list a name a script adds at run time under tools.purgecss.safelist with a reason."
level = "recommended"
name = "purgecss"
needs = ["build"]
runs = "scope"
stage = "push"
summary = "Finds selectors in the built stylesheets that no page or script uses."
tool = "purgecss"
why = "Visitors download an unused selector, and maintainers still read it."

[[check]]
example = "A link to `/missing/` reports a broken destination when that page does not exist. Point it at an existing page, or add the page."
help = "Fix the link, or the page it points at."
level = "recommended"
name = "lychee"
needs = ["build"]
output = { format = "grouped", file_pattern = "^Errors in (?<file>.+)$", pattern = "^\\[(?<rule>[A-Z0-9]+)\\] (?<message>\\S+(?: \\(at (?<line>\\d+):(?<column>\\d+)\\))? \\| .*)$" }
runs = "scope"
stage = "push"
summary = "Checks the links between built pages, stylesheets, and fragments without a server or network requests."
tool = "lychee"
why = "A visitor hits a broken internal link before the author notices it."

[[check]]
example = "A built page over its limit reports the measured size. Remove unused assets or shrink the page, then rebuild."
help = "Remove what the page does not need, or raise the ceiling with a reason."
level = "recommended"
name = "size"
needs = ["build"]
runs = "scope"
stage = "push"
summary = "Sums the compressed weight of the built paths each ceiling in site.size_limit names."
when = { setting = "site.size_limit" }
why = "Page weight grows a kilobyte at a time, and only a limit catches it."

[[check]]
example = "A sitemap URL for `/removed/` with no built page reports a stale route. Remove it from the sitemap source, and rebuild."
help = "Add the page to the sitemap, remove the dead URL, or leave a page out under site.allowed_unlisted_pages."
level = "recommended"
name = "sitemap"
needs = ["build"]
runs = "scope"
stage = "push"
summary = "Compares the sitemap with the built pages, and reports a listed route with no page or a page left out."
why = "Search engines find an unlisted page late, and a listed route with nothing behind it costs their trust."

[[check]]
example = "An image that no built page or stylesheet references reports an unused asset. Delete it from the source assets, and rebuild."
files = { paths = ["**/*"], kinds = ["source", "binary"] }
help = "Delete the file."
level = "all"
name = "unused-assets"
runs = "scope"
stage = "push"
summary = "Finds files under an assets folder that no page, stylesheet, or script names."
why = "An unreferenced asset ships with every deploy, and nobody dares to delete it."
