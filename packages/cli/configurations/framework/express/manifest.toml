[configuration]
name = "express"
kind = "framework"
title = "Express"
requires = ["javascript"]
recommends = ["security", "vitest"]
description = "An Express service: the Semgrep rules for request handling, an OpenAPI document that lints and matches its source, and a test for every route file."

[detect]
dependencies = ["express"]

[[tools]]
name = "spectral"
version = "6.15.0"
npm = "@stoplight/spectral-cli"
mise = "npm:@stoplight/spectral-cli"

# Spectral and its Ajv plugins share one code generator instance in the private tool project.
[[tools]]
name = "ajv"
kind = "library"
version = "8.20.0"
npm = "ajv"

[[configs]]
template = "semgrep-express.yml.tmpl"
target = ".gspot/config/semgrep/express.yml"
rules_path = ["rules"]
needs = "security"

[[configs]]
template = "spectral.yaml.tmpl"
target = ".gspot/config/spectral.yaml"

[[checks]]
name = "express/openapi-lint"
title = "Validate the OpenAPI document"
example = "An OpenAPI document whose operation references an undefined schema reports a validation finding. Define the schema or correct the reference in the source that produces the document, then regenerate it."
level = "recommended"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "openapi-lint"
tool = "spectral"
claims = {extensions = [".yaml", ".yml", ".json"]}
coverage = ["style"]
summary = "Lints the OpenAPI document named in tools.openapi.document with the Spectral OpenAPI rules."
why = "Clients are written from this document, so an operation with no id or an undefined response becomes somebody's broken client."
help = "Change the document the way the rule says, or the code that writes it."

[[checks]]
name = "express/openapi-fresh"
title = "Keep the OpenAPI document current"
example = "A committed OpenAPI document that differs from the configured generator output reports drift. Run the declared generator, inspect the changed document, and retain the corrected output before rerunning."
level = "recommended"
stage = "push"
runs = "once"
engine = "integrity"
analysis = "openapi-fresh"
coverage = ["consistency"]
summary = "Runs the command in tools.openapi.produced_by and fails when it changes the document."
why = "A committed document that lags the routes describes a service that does not exist."
help = "Run the command and commit the document it writes."

[[checks]]
name = "express/routes-tested"
title = "Routes tested"
example = "With `tools.express.route_glob = [\"routes/*.ts\"]`, `routes/users.ts` reports `untested-route` when no test in the same scope imports it. Add `import { users } from './routes/users.js';` to `users.test.ts` and test the route's behavior. This check resolves imports; it does not execute the test or establish assertion coverage."
level = "all"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "routes-tested"
coverage = ["tests"]
summary = "Checks that a test in the same scope imports each route file."
why = "A route with no test is the one that changes behavior without anyone noticing."
help = "Add a test that imports and exercises the route."

[[settings]]
name = "tools.openapi.document"
kind = "string"
direction = "neutral"
default = ""
summary = "The committed OpenAPI document; empty turns both OpenAPI checks off."

[[settings]]
name = "tools.openapi.produced_by"
kind = "string"
direction = "neutral"
default = ""
summary = "The command that writes the OpenAPI document from the code."

[[settings]]
name = "tools.express.route_glob"
kind = "list"
direction = "tightening"
default = []
summary = "The route files that each need a test; empty turns the check off."

[[settings]]
name = "tools.express.test_glob"
kind = "list"
direction = "neutral"
default = ["**/*.test.*", "**/*.spec.*", "**/tests/**"]
summary = "The files that count as tests of a route."

[rule_files]
framework = ["framework/express/EXPRESS.md", "framework/express/API.md", "framework/express/OPENAPI.md"]
shared = ["shared/http/HTTP.md"]
runtime = ["runtime/node/NODE.md"]
