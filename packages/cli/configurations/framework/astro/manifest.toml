[configuration]
description = "Astro components: ESLint applies the recommended and accessibility rules of eslint-plugin-astro as errors to frontmatter, markup, and scripts. `astro check` reports type errors in each component."
requires = ["javascript"]
suggests = ["typescript", "css"]
title = "Astro"

[detect]
dependencies = ["astro"]
extensions = [".astro"]

[files]
extensions = [".astro"]
filenames = ["astro.config.mjs", "astro.config.ts"]

[defaults]
"tools.eslint.import_extension" = "extensionless"

[[tool]]
kind = "library"
name = "eslint-plugin-astro"
npm = "eslint-plugin-astro"
rule_prefix = "astro"
version = "1.7.0"

[tool.eslint]
extensions = [".astro"]

[[tool]]
name = "eslint-plugin-jsx-a11y"

[[tool]]
name = "astro-check"
npm = "@astrojs/check"
version = "0.9.10"
version_command = ["astro", "check", "--version"]

[[tool]]
kind = "library"
name = "prettier-plugin-astro"
npm = "prettier-plugin-astro"
version = "1.0.1"

[tool.prettier]
entry = "dist/index.js"
extensions = [".astro"]

[[tool.prettier.overrides]]
files = "*.astro"

[tool.prettier.overrides.options]
parser = "astro"

[eslint]
all_level_rules = ["astro/no-unused-css-selector", "astro/prefer-class-list-directive", "astro/prefer-object-class-list", "astro/prefer-split-class-list"]

[eslint.presets.recommended]
package = "eslint-plugin-astro"
source = "configs.flat/recommended"

[eslint.presets.accessibility]
package = "eslint-plugin-astro"
source = "configs.flat/jsx-a11y-recommended"

[[eslint.rules_off]]
files = ["**/*.astro", "**/*.astro/*.ts", "**/*.astro/*.js"]
reason = "A component is markup, never a file that only forwards: a script that only imports a module is how Astro bundles client code, and Astro reads the props of a component from the Props type in its own frontmatter."
rules = ["gspot/no-trivial-files"]

[[tool_file]]
fragment = true
required_tools = ["eslint-plugin-astro", "eslint-plugin-jsx-a11y"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"

[[check]]
command = ["astro-check", "astro", "check", "--minimumSeverity", "warning", "--minimumFailingSeverity", "warning"]
cwd = "scope"
example = "A component whose frontmatter holds `const count: number = 'three';` reports `ts(2322)`. Give the value the declared type, such as `const count: number = 3;`."
exit_codes = [1]
help = "Fix the first error `astro check` prints; later errors often come from the same mistake."
level = "recommended"
name = "astro-check"
runs = "scope"
stage = "push"
summary = "Runs astro check over the scope: the type errors and warnings of every Astro component."
why = "tsc cannot parse a component file, so a type error inside one ships unless `astro check` catches it."

[check.files]
extensions = [".astro"]

[check.output]
format = "regex"
pattern = "^(?<file>[^:\\s][^:]*\\.astro):(?<line>\\d+):(?<column>\\d+) - (?:error|warning) (?<rule>[a-z-]+\\(\\d+\\)): (?<message>.*)$"
