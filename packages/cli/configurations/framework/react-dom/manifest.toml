[configuration]
description = "React applications rendered into the DOM: JSX accessibility rules for labels, alternative text, keyboard access, and valid ARIA attributes. Native-only applications get React without these browser rules."
requires = ["react"]
title = "React DOM"

[detect]
dependencies = ["react-dom"]

[[tool]]
kind = "library"
name = "eslint-plugin-jsx-a11y"
npm = "eslint-plugin-jsx-a11y"
rule_prefix = "jsx-a11y"
version = "6.10.2"

[eslint]
fragment = true
required_tools = ["eslint-plugin-jsx-a11y"]
