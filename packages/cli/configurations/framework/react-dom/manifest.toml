[configuration]
description = "React applications rendered into the DOM: JSX accessibility rules for labels, alternative text, keyboard access, and valid ARIA attributes. Native-only applications retain React without these browser rules."
requires = ["react"]
title = "React DOM"

[detect]
dependencies = ["react-dom"]

[[tool]]
kind = "library"
name = "eslint-plugin-jsx-a11y"
npm = "eslint-plugin-jsx-a11y"
rule_prefix = "jsx-a11y"
version = "6.10.2"

[eslint.presets.accessibility]
package = "eslint-plugin-jsx-a11y"
source = "flatConfigs.recommended"

[[tool_file]]
fragment = true
required_tools = ["eslint-plugin-jsx-a11y"]
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
