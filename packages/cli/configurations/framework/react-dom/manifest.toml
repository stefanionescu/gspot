[configuration]
description = "React apps in the browser: labels, alternative text, keyboard access, and valid ARIA attributes."
requires = ["react"]
title = "React DOM"

[detect]
dependencies = ["react-dom"]

[[tool]]
kind = "library"
name = "eslint-plugin-jsx-a11y-x"
npm = "eslint-plugin-jsx-a11y-x"
rule_prefix = "jsx-a11y-x"
version = "0.2.0"

[eslint]
required_tools = ["eslint-plugin-jsx-a11y-x"]

[[check]]
example = "A project that locks `react 19.1.0` and `react-dom 19.0.0` reports `react-versions`. Install the same version of both."
files = { filenames = ["package.json"] }
help = "Install the same version of react and react-dom."
name = "react-versions"
runs = "scope"
stage = "push"
summary = "Checks that `react` and `react-dom` resolve to the same version."
why = "React stops at run time when react and react-dom differ."
