[configuration]
title = "Xcode"
suggests = ["swift"]
description = "An Xcode project: property lists that parse, build settings files, and complete string catalogs. Asset catalogs hold their images, test targets sit in a plan, sources belong to a target, and entitlements stay on a list."

[detect]
paths = ["**/*.xcodeproj/project.pbxproj", "*.xcodeproj/project.pbxproj"]
project_files = ["*.xcodeproj"]

[files]
extensions = [".plist", ".entitlements", ".xcconfig", ".xcstrings", ".storyboard", ".xib"]
paths = ["**/project.pbxproj", "**/*.xcscheme", "**/*.xctestplan", "**/*.xcassets/**/Contents.json"]

[[tool]]
name = "plutil"
system = true
crash_pattern = "couldn['’]t be opened"

[[check]]
name = "plutil"
title = "Parse property lists"
example = "A plist containing an unclosed dictionary fails native validation. Close the dictionary and plist elements, then rerun with plutil available on a declared platform."
level = "recommended"
stage = "commit"
platforms = ["macos"]
command = ["plutil", "-lint", "{files}"]
files = { extensions = [".plist", ".entitlements"] }
output = { format = "regex", pattern = "^(?<file>[^:]+): (?<message>(?!OK$).+)$" }
summary = "Parses every property list and entitlements file with plutil."
why = "A broken plist fails the build or, worse, ships an app whose settings silently fell back to defaults."
help = "Fix the element plutil names."

[[check]]
name = "xmllint"
title = "Validate storyboard XML"
example = "The XML text `<settings><enabled>true</settings>` has mismatched tags. Close the child element as `<enabled>true</enabled>` before closing `settings`."
level = "recommended"
stage = "commit"
command = ["xmllint", "--noout", "{files}"]
files = { extensions = [".storyboard", ".xib"] }
output = { format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+): (?<message>.*)$" }
summary = "Parses every storyboard and xib with xmllint."
why = "Malformed XML is refused by the reader at the worst moment."
help = "Fix the line xmllint names."

[[check]]
name = "xcconfig"
title = "Check build settings files"
example = "A non-comment line `PRODUCT_NAME App` in an `.xcconfig` file lacks an assignment operator. Change it to `PRODUCT_NAME = App`."
level = "recommended"
stage = "commit"
runs = "scope"
files = { extensions = [".xcconfig"] }
summary = "Checks that every line of a build settings file is a setting, an include, or a comment."
why = "Xcode ignores a line it cannot read, so a typo turns a setting off without a word."
help = "Write the line as a name, an equals sign, and a value."

[[check]]
name = "xcstrings"
title = "Check string catalogs"
example = "A string catalog entry with one translated locale and an absent required locale reports the missing translation. Add that locale and its translation, or explicitly mark the string as not translated when that is the intended catalog state."
level = "recommended"
stage = "commit"
runs = "scope"
files = { extensions = [".xcstrings"] }
summary = "Checks that every string catalog parses, and that every string has a translation for every locale the catalog uses."
why = "A string with no translation shows its source language in the middle of a translated screen."
help = "Add the translation, or mark the string as not translated in the catalog."

[[check]]
name = "assets"
title = "Validate asset catalogs"
example = "A `Contents.json` image entry naming `icon.png` reports a missing asset when that file does not exist. Add the intended image beside the manifest or remove the obsolete entry."
level = "recommended"
stage = "commit"
runs = "scope"
files = { paths = ["**/*.xcassets/**"], extensions = [".swift"] }
summary = "Checks that every asset Contents.json parses and that every image set holds the images it names."
why = "An image set with no image draws nothing at run time."
help = "Add the image or delete the asset."

[[check]]
name = "orphan-assets"
title = "Find unused asset sets"
example = "An asset set named only in an Xcode build setting counts as used. An asset that no source or build setting names reports an orphan-asset finding."
level = "all"
stage = "commit"
runs = "scope"
files = { paths = ["**/*.xcassets/**"], extensions = [".swift", ".storyboard", ".xib", ".plist", ".pbxproj", ".xcconfig"] }
summary = "At level all, finds asset sets that no source or Xcode build setting names."
why = "An asset nobody names ships in the app for nothing."
help = "Delete the asset or name it where it is used. For an accepted asset selected at runtime, run gspot ignore xcode/orphan-assets --rule orphan-asset --paths `<glob>` --reason \"`<why>`\"."

[[check]]
name = "test-plans"
title = "Check Xcode test plans"
example = "A test target absent from the test plan used by its scheme reports missing coverage by the plan. Add that target to the plan and point the scheme at the plan."
level = "all"
stage = "commit"
runs = "scope"
summary = "Checks that every shared scheme that runs tests names a test plan, and that every test target is in a plan."
why = "A test target outside every plan never runs in CI, and its tests rot while they look present."
help = "Add the target to a test plan, and point the scheme at the plan."

[[check]]
name = "orphan-sources"
title = "Match Swift files to project targets"
example = "A Swift source file under the project that belongs to no target reports an orphan source. Add the file to its intended target or delete the unused source. Remove project references to files that no longer exist."
level = "recommended"
stage = "commit"
runs = "scope"
files = { extensions = [".swift"], paths = ["**/project.pbxproj"] }
summary = "Compares the Swift files in the tree with the files the project names: a file in no target, and a target file that is gone."
why = "A Swift file in no target is never compiled, so it breaks without anyone seeing it."
help = "Add the file to a target or delete it, and remove the reference to a file that is gone."

[[check]]
name = "symlinks"
title = "Report symlinks in Xcode projects"
example = "A source directory represented by a symlink reports a project symlink finding. Replace the link with the intended repository-owned directory and update project references."
level = "all"
stage = "commit"
runs = "scope"
summary = "Reports every tracked symlink beside or under an Xcode project, with where it points."
why = "Xcode, git, and each lint tool follow a symlink their own way, so one file is checked twice or never."
help = "Replace the symlink with the folder it points at, or ignore the path with a reason."

[[check]]
name = "entitlements"
title = "Allow only listed entitlements"
example = "An entitlement enabled in an `.entitlements` file but absent from `xcode.entitlements_allowed` reports a policy finding. Remove an unnecessary entitlement, or explicitly allow the required entitlement in policy."
level = "recommended"
when = { setting = "xcode.entitlements_allowed" }
stage = "commit"
runs = "scope"
files = { extensions = [".entitlements"] }
summary = "Checks that every entitlement is on xcode.entitlements_allowed, when the policy holds that list."
why = "An entitlement is a capability the system grants the app, and a new one deserves a review of its own."
help = "Remove the entitlement, or add it to xcode.entitlements_allowed."

[[check]]
name = "ats"
title = "Keep App Transport Security on"
example = "An Info.plist enabling `NSAllowsArbitraryLoads` disables transport protection broadly and reports a finding. Remove that key. If one host requires an exception, declare only the host-specific exception."
level = "recommended"
stage = "commit"
runs = "scope"
files = { extensions = [".plist"] }
summary = "Refuses a property list that allows arbitrary loads, which turns transport security off for every host."
why = "With arbitrary loads the app speaks plain HTTP to anyone, and one forgotten debug setting ships it."
help = "Remove the key, and add an exception for the one host that needs it."

[[setting]]
name = "xcode.entitlements_allowed"
type = "list"
items = "string"
direction = "tightening"
default = []
summary = "The entitlements the app may hold; empty turns the check off."
