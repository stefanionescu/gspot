[configuration]
name = "xctest"
kind = "tool"
title = "Swift Tests"
requires = ["swift"]
description = "Swift test files under XCTest, Swift Testing, and snapshot testing. A disabled test says why, no test sleeps, and no snapshot test records. Every reference has its test, and coverage holds a floor."

[detect]
tags = ["swift-test", "swift-test-target"]
paths = ["**/*.xctestplan"]

[claims]
paths = ["**/*Tests/**/*.swift", "**/__Snapshots__/**"]
filenames = ["*.xctestplan"]
natures = ["source", "binary"]

[[configs]]
template = "swiftlint.yml.tmpl"
target = ".gspot/config/swiftlint.yml"
per_scope = true
fragment = true
stub = {path = ".swiftlint.yml", directories = ["**/*Tests"], body = "parent_config: {target_json}\ndisabled_rules:\n    - force_unwrapping\n    - missing_docs\n    - no_magic_numbers\n"}

[[checks]]
name = "xctest/disabled"
title = "Explain skipped and disabled tests"
example = "In a Swift test, `throw XCTSkip()` reports a missing reason. Restore the test, or supply a nonempty reason such as `throw XCTSkip(\"Requires the hardware test device\")`. The check requires a reason; it does not validate when the test will be enabled."
level = "recommended"
stage = "commit"
runs = "per-file-list"
engine = "integrity"
analysis = "xctest-disabled"
claims = {tags = ["swift-test"]}
coverage = ["tests"]
summary = "Checks that skip calls and disabled traits name a nonempty reason, and unavailable tests carry an explanation."
why = "A test turned off with no reason stays off, because nobody knows when it is safe to turn on."
help = "Say why the test is off and what turns it back on, or delete the test."

[[checks]]
name = "xctest/no-sleep"
title = "Avoid sleeps in tests"
example = "A test using a fixed sleep to wait for asynchronous work reports a timing finding. Wait for the actual completion expectation or poll the required condition with a bounded timeout."
level = "all"
stage = "commit"
runs = "per-file-list"
engine = "integrity"
analysis = "xctest-sleep"
claims = {tags = ["swift-test"]}
coverage = ["tests"]
summary = "Refuses sleep calls in test files outside tools.xctest.sleep_allowed."
why = "A sleep makes a test slow when it passes and flaky when the machine is slower than the number."
help = "Wait on an expectation or a confirmation, or poll a condition with a timeout."

[[checks]]
name = "xctest/recording"
title = "Disable snapshot recording"
example = "A snapshot test left in recording mode reports a recording finding. Inspect and retain the intended reference images, remove the recording flag, and rerun in comparison mode."
level = "recommended"
stage = "commit"
runs = "per-file-list"
engine = "integrity"
analysis = "xctest-recording"
claims = {tags = ["swift-test"]}
coverage = ["tests"]
summary = "Refuses a snapshot test left in a recording mode."
why = "A recording test writes a new reference and passes, so it approves whatever the screen shows."
help = "Take the recording flag out, and commit the references it wrote after looking at them."

[[checks]]
name = "xctest/reference-images"
title = "Validate snapshot references"
example = "A snapshot reference folder whose corresponding test file no longer exists reports unused references. Delete the unused references, or rename the folder to match the renamed test file."
level = "all"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "xctest-references"
claims = {paths = ["**/*"], natures = ["source", "binary"]}
coverage = ["consistency"]
summary = "Checks that snapshot references match tools.xctest.reference_layout and name a test file beside the layout."
why = "References of a deleted test stay in the repository, and every clone pays for them."
help = "Delete the references of the test that is gone, or rename the folder after the test file."

[[checks]]
name = "xctest/coverage"
title = "Check Swift test coverage"
example = "A branch that no test exercises can leave coverage below the floor configured under `tools.xctest`. Add a test for the missing behavior and rerun the native test runner. A passing test run still fails this check when required coverage remains below its floor."
level = "recommended"
waits_for = "tools.xctest.coverage"
stage = "push"
runs = "per-scope"
requires = "build"
platform = ["macos"]
engine = "integrity"
analysis = "xctest-coverage"
claims = {extensions = [".swift"]}
coverage = ["coverage"]
summary = "Runs the tests with coverage and holds each target named in tools.xctest.coverage to its floor."
why = "A floor keeps new code from arriving untested."
help = "Add tests for the target, or lower its floor with a reason."

[[settings]]
name = "tools.xctest.coverage"
kind = "list"
direction = "floor"
default = []
summary = "Coverage floors: a target and the share of lines out of 100. Empty turns the check off."

[[settings]]
name = "tools.xctest.sleep_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Test paths that may sleep, each with a reason."

[[settings]]
name = "tools.xctest.reference_layout"
kind = "string"
direction = "neutral"
default = "__Snapshots__/{file}/{test}.*"
summary = "Snapshot paths relative to the test file directory, with {file} as its stem, {test} as the test name, and * as a wildcard."

[rule_files]
tool = ["tool/xctest/XCTEST.md"]
general = ["general/code/TESTING.md"]
