[configuration]
title = "Swift Tests"
requires = ["swift", "coverage"]
description = "Swift test files under XCTest and Swift Testing. A disabled test says why, no test sleeps, and coverage holds a floor."

[detect]
tags = ["swift-test", "swift-test-target"]
paths = ["**/*.xctestplan"]

[files]
paths = ["**/*Tests/**/*.swift"]
filenames = ["*.xctestplan"]

[[tool_file]]
target = ".gspot/config/swiftlint.yml"
tool = "swiftlint"
per_scope = true
fragment = true
pointer = { path = ".swiftlint.yml", directories = ["**/*Tests"], template = "swiftlint.yml.eta" }

[[check]]
name = "skip-reasons"
title = "Explain skipped and disabled tests"
example = "In a Swift test, `throw XCTSkip()` reports a missing reason. Restore the test, or supply a nonempty reason such as `throw XCTSkip(\"Requires the hardware test device\")`. The check requires a reason; it does not validate when the test will be enabled."
level = "recommended"
stage = "commit"
files = { tags = ["swift-test"] }
summary = "Checks that skip calls and disabled traits name a nonempty reason, and unavailable tests carry an explanation."
why = "A test turned off with no reason stays off, because nobody knows when it is safe to turn on."
help = "Say why the test is off and what turns it back on, or delete the test."

[[check]]
name = "sleep"
title = "Avoid sleeps in tests"
example = "A test using a fixed sleep to wait for asynchronous work reports a timing finding. Wait for the actual completion expectation or poll the required condition with a bounded timeout."
level = "all"
stage = "commit"
files = { tags = ["swift-test"] }
summary = "Refuses sleep calls in test files."
why = "A sleep makes a test slow when it passes and flaky when the machine is slower than the number."
help = "Wait on an expectation or a confirmation, or poll a condition with a timeout."

[[check]]
name = "coverage"
title = "Check Swift test coverage"
example = "A branch that no test exercises can leave coverage below the floor configured under `coverage`. Add a test for the missing behavior and rerun the native test runner. A passing test run still fails this check when required coverage remains below its floor."
level = "recommended"
stage = "push"
runs = "scope"
needs = ["build"]
platforms = ["macos", "linux"]
files = { extensions = [".swift"] }
summary = "Measures Xcode projects and Swift packages, holding each source target against coverage.lines and its coverage.overrides floor."
why = "A floor keeps new code from arriving untested."
help = "Add tests for the target, or lower its floor with a reason."
