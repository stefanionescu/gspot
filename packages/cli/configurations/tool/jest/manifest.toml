[configuration]
title = "Jest"
requires = ["javascript", "coverage"]
description = "Jest test rules and coverage floors for repository-owned test suites."

[detect]
dependencies = ["jest"]
filenames = ["jest.config.*"]

[files]
paths = ["**/*.{test,spec}.{ts,tsx,js,jsx}", "**/tests/**", "**/__tests__/**", "**/jest.config.*"]

[[tool]]
name = "jest"
system = true

[[tool]]
name = "eslint-plugin-jest"
kind = "library"
version = "29.16.6"
npm = "eslint-plugin-jest"

[[tool_file]]
source = "eslint.fragment.js.eta"
target = ".gspot/config/eslint.config.mjs"
tool = "eslint"
imports = "eslint.imports.js.eta"
fragment = true

[[check]]
name = "coverage"
title = "Check Jest coverage"
example = "A branch that no test exercises can leave coverage below the floor configured under `coverage`. Add a test for the missing behavior and rerun the native test runner. A passing test run still fails this check when required coverage remains below its floor."
level = "recommended"
stage = "push"
runs = "scope"
cwd = "scope"
files = { extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"] }
tool = "jest"
summary = "Runs Jest in a disposable source copy and checks all four coverage floors."
why = "A coverage floor keeps new code from arriving untested."
help = "Correct failed tests and cover the reported branches, functions, lines, and statements."
