[configuration]
name = "pytest"
kind = "tool"
title = "pytest"
requires = ["python"]
description = "pytest suites: the pytest style rules of Ruff over the tests, a test prefix the naming check knows, and a coverage floor at push."

[detect]
dependencies = ["pytest"]
filenames = ["conftest.py", "pytest.ini"]

[[tools]]
name = "pytest"
suppression = {marker = "\\bpragma: ?no cover\\b", reason = "#[^#]*# ?(?<reason>\\S.*)"}
floor = "7.0.0"
pypi = "pytest"
version_regex = "(\\d+\\.\\d+\\.\\d+)"

[[checks]]
name = "pytest/coverage"
title = "Check Python test coverage"
example = "A branch that no test exercises can leave coverage below the floor configured under `tools.pytest.coverage`. Add a test for the missing behavior and rerun the native test runner. A passing test run still fails this check when required coverage remains below its floor."
level = "recommended"
stage = "push"
runs = "per-scope"
cwd = "scope"
command = ["pytest", "-q", "--strict-markers", "--strict-config", "--cov", "--cov-fail-under={setting:tools.pytest.coverage}", "--no-header", "-p", "no:cacheprovider"]
findings_exit_codes = [1]
claims = {extensions = [".py"]}
coverage = ["coverage"]
output = {format = "regex", pattern = "^(?<message>(?:FAIL Required test coverage|FAILED |ERROR ).*)$"}
summary = "Runs the test suite with coverage, and fails when a test fails or the covered share falls under the floor."
why = "A floor keeps new code from arriving untested."
help = "Fix the failing test, or add tests for the code the report shows uncovered. Lower tools.pytest.coverage with a reason."

[[settings]]
name = "tools.pytest.coverage"
kind = "number"
direction = "floor"
default = 0
default_all = 80
summary = "The smallest share of lines the tests cover, out of 100."

[[settings]]
name = "tools.ruff.select"
kind = "list"
direction = "tightening"
default = ["PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT020", "PT021", "PT024", "PT025", "PT027", "PT028", "PT030", "PT031"]
default_all = ["PT001", "PT002", "PT003", "PT006", "PT007", "PT008", "PT009", "PT010", "PT011", "PT012", "PT013", "PT014", "PT015", "PT016", "PT017", "PT018", "PT019", "PT020", "PT021", "PT022", "PT023", "PT024", "PT025", "PT026", "PT027", "PT028", "PT030", "PT031", "PTH100", "PTH101", "PTH102", "PTH103", "PTH104", "PTH105", "PTH106", "PTH107", "PTH108", "PTH109", "PTH110", "PTH111", "PTH112", "PTH113", "PTH114", "PTH115", "PTH116", "PTH117", "PTH118", "PTH119", "PTH120", "PTH121", "PTH122", "PTH123", "PTH124", "PTH201", "PTH202", "PTH203", "PTH204", "PTH205", "PTH206", "PTH207", "PTH208", "PTH210", "PTH211"]
summary = "Rule families and rules Ruff selects on top of the level's set, such as the ones a framework adds."

[[settings]]
name = "tools.ruff.test_files"
kind = "list"
direction = "neutral"
default = ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
summary = "The test files Ruff lints with the test ignores; a test runner configuration fills it."

[[settings]]
name = "tools.ruff.test_ignores"
kind = "list"
direction = "loosening"
default = ["S101", "ARG", "PLR2004"]
summary = "Ruff rules and families the test files leave off, such as the assert rule."

[rule_files]
general = ["general/code/TESTING.md"]
