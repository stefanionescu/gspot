# A throwaway registry: the gspot packages are published here, and every other package comes from npm through it.
storage: ./storage
# Compiled binaries exceed Verdaccio's default 10 MB request limit.
max_body_size: 200mb
auth:
    htpasswd:
        file: ./htpasswd
uplinks:
    npmjs:
        url: https://registry.npmjs.org/
        timeout: 60s
packages:
    'eslint-plugin-gspot':
        access: $all
        publish: $anonymous
        unpublish: $anonymous
    'gspot':
        access: $all
        publish: $anonymous
        unpublish: $anonymous
    'gspot-*':
        access: $all
        publish: $anonymous
        unpublish: $anonymous
    '**':
        access: $all
        publish: $anonymous
        proxy: npmjs
log: { type: stdout, format: pretty, level: error }
