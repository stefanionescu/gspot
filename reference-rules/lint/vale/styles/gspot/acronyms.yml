extends: conditional
message: "'%s' is used without being spelled out on first use."
level: error
ignorecase: false
first: "\\b([A-Z]{3,6})\\b"
second: "(?:\\b[A-Z][a-z]+ ){2,5}\\(([A-Z]{3,6})\\)"
