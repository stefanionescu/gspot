# Vale configuration for the gspot rule corpus. Run from reference-rules/lint/vale:
#   vale --config .vale.ini ../../merged
StylesPath = styles
MinAlertLevel = error

[*.md]
BasedOnStyles = gspot
# Front matter and fenced code are not prose.
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (`[^`]+`), (\$\{[^}]+\}), ("[^"\n]+")
