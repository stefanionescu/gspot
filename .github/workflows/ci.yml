name: Windows publication parent guard
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: windows-publication-parent-${{ github.ref }}
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    parent:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Verify native confinement after the held flush batch
              run: |
                  cat > .windows-boundary-parent-probe.ts <<'PARENT_PROBE'
                  import { mock } from 'bun:test';
                  import { strict as assert } from 'node:assert';
                  import * as fs from 'node:fs';
                  const native = { ...fs };
                  import { join, resolve } from 'node:path';
                  import { pathToFileURL } from 'node:url';
                  import { tmpdir } from 'node:os';

                  const mode = process.argv[2];
                  const checkout = resolve(process.argv[3] ?? process.cwd());
                  const work = native.mkdtempSync(join(tmpdir(), 'gspot-async-boundary-'));
                  const project = join(work, 'project');
                  const outside = join(work, 'outside');
                  native.mkdirSync(project); native.mkdirSync(outside);
                  native.writeFileSync(join(outside, 'unchanged'), 'outside');
                  const descriptors = new Map<number, string>();
                  const gates: Array<{ fd: number; path: string; error: NodeJS.ErrnoException | null; finish: (error: NodeJS.ErrnoException | null) => void }> = [];
                  let active = false;
                  let maximum = 0;
                  let wake: (() => void) | undefined;
                  let starts = 0;
                  let closes = 0;
                  mock.module('node:fs', () => ({
                      ...native,
                      openSync: (...args: Parameters<typeof native.openSync>) => {
                          const fd = native.openSync(...args);
                          if (active && String(args[0]).includes('node_modules.next')) {
                              descriptors.set(fd, String(args[0])); starts += 1; maximum = Math.max(maximum, descriptors.size);
                          }
                          return fd;
                      },
                      closeSync: (fd: number) => {
                          native.closeSync(fd);
                          if (descriptors.delete(fd)) closes += 1;
                      },
                      fsync: (fd: number, finish: (error: NodeJS.ErrnoException | null) => void) => {
                          if (!active) { native.fsync(fd, finish); return; }
                          native.fsync(fd, (error) => {
                              gates.push({ fd, path: descriptors.get(fd)!, error, finish });
                              wake?.(); wake = undefined;
                          });
                      },
                  }));
                  const { openOwnership } = await import(pathToFileURL(join(checkout, 'packages/cli/src/lifecycle/ownership/public.ts')).href);
                  const { installTree } = await import(pathToFileURL(join(checkout, 'packages/cli/src/lifecycle/ownership/state/public.ts')).href);
                  const log = openOwnership(project);
                  try {
                      await installTree(log, 'npm', [{ path: '.gspot/node_modules/previous', file: { bytes: Buffer.from('old'), mode: 0o444 } }]);
                      active = true;
                      const entries = Array.from({ length: 35 }, (_, i) => ({ path: `.gspot/node_modules/package/${mode === 'linked-parent' && i >= 16 ? 'later/' : ''}file-${String(i)}`, file: { bytes: Buffer.from(`bytes-${String(i)}`), mode: i % 2 ? 0o444 : 0o755 } }));
                      entries.push({ path: '.gspot/node_modules/package/link', file: { bytes: Buffer.from('file-0'), mode: 0o777, isLink: true } } as typeof entries[number]);
                      let settled = false;
                      const outcome = installTree(log, 'npm', entries).then(
                          () => { settled = true; return { status: 'fulfilled' } as const; },
                          (error: unknown) => { settled = true; return { status: 'rejected', error } as const; },
                      );
                      const waitFor = async (count: number) => { while (gates.length < count) await new Promise<void>((resolve) => { wake = resolve; }); };
                      await waitFor(16);
                      assert.equal(starts, 16); assert.equal(settled, false);
                      assert.equal(native.readFileSync(join(project, '.gspot/node_modules/previous'), 'utf8'), 'old');
                      assert.equal(native.existsSync(join(project, '.gspot/node_modules.next/package/link')), false);
                      if (mode === 'modified') native.writeFileSync(gates[0]!.path, 'changed-bytes');
                      if (mode === 'substituted') {
                          native.unlinkSync(gates[0]!.path); native.writeFileSync(gates[0]!.path, 'bytes-0', { mode: 0o755 });
                      }
                      if (mode === 'linked-parent') {
                          native.symlinkSync(outside, join(project, '.gspot/node_modules.next/package/later'), 'dir');
                      }
                      gates[0]!.finish(mode === 'flush-failed' ? Object.assign(new Error('native flush injected failure'), { code: 'EIO' }) : gates[0]!.error);
                      await Promise.resolve(); await Promise.resolve();
                      assert.equal(settled, false, 'a first rejection must not leave pending flushes');
                      for (let i = 1; i < 16; i += 1) gates[i]!.finish(gates[i]!.error);
                      if (mode === 'success') {
                          await waitFor(32); for (let i = 16; i < 32; i += 1) gates[i]!.finish(gates[i]!.error);
                          await waitFor(35); for (let i = 32; i < 35; i += 1) gates[i]!.finish(gates[i]!.error);
                      }
                      const result = await outcome;
                      assert.equal(descriptors.size, 0); assert.equal(starts, closes); assert.equal(maximum, 16);
                      if (mode === 'success') {
                          assert.equal(result.status, 'fulfilled'); assert.equal(starts, 35);
                          for (let i = 0; i < 35; i += 1) {
                              const path = join(project, '.gspot/node_modules/package', `file-${String(i)}`);
                              assert.equal(native.readFileSync(path, 'utf8'), `bytes-${String(i)}`);
                              if (process.platform !== 'win32') assert.equal(native.statSync(path).mode & 0o777, i % 2 ? 0o444 : 0o755);
                          }
                          assert.equal(native.readlinkSync(join(project, '.gspot/node_modules/package/link')), 'file-0');
                          assert.equal(native.existsSync(join(project, '.gspot/node_modules.next')), false);
                          assert.deepEqual(log.state.installed, ['npm']); assert.equal(log.state.installing, undefined);
                      } else {
                          assert.equal(result.status, 'rejected'); assert.equal(starts, 16);
                          assert.ok(result.status === 'rejected' && result.error instanceof Error);
                          const message = result.status === 'rejected' ? (result.error as Error).message : '';
                          assert.match(message, mode === 'flush-failed' ? /native flush injected failure/u : mode === 'linked-parent' ? /Unsafe lifecycle parent/u : /Lifecycle destination changed during the operation/u);
                          assert.equal(native.readFileSync(join(project, '.gspot/node_modules/previous'), 'utf8'), 'old');
                          assert.deepEqual(log.state.installing, ['npm']);
                          if (mode === 'linked-parent') {
                              assert.equal(native.readFileSync(join(outside, 'unchanged'), 'utf8'), 'outside');
                              assert.deepEqual(native.readdirSync(outside), ['unchanged']);
                              native.unlinkSync(join(project, '.gspot/node_modules.next/package/later'));
                          }
                          log[Symbol.dispose]();
                          const recovered = openOwnership(project);
                          assert.equal(native.existsSync(join(project, '.gspot/node_modules.next')), false);
                          assert.equal(native.readFileSync(join(project, '.gspot/node_modules/previous'), 'utf8'), 'old');
                          recovered[Symbol.dispose]();
                      }
                      console.log(JSON.stringify({ mode, runtime: `Bun ${Bun.version}`, platform: process.platform, status: result.status, starts, closes, maximum, pending: descriptors.size, realNativeFlushes: gates.length, secondBatchStarted: starts > 16, oldPublishedUntilDrain: true, allResultsPreserved: true, linkedParentGeometry: mode === 'linked-parent' ? 'later-batch-unused-parent-alias' : undefined, sourceParentGuardExercised: mode === 'linked-parent' }));
                  } finally {
                      log[Symbol.dispose]();
                      mock.restore();
                      native.rmSync(work, { recursive: true, force: true });
                  }
                  PARENT_PROBE
                  node --version
                  bun --version
                  bun ./.windows-boundary-parent-probe.ts linked-parent "$PWD"
