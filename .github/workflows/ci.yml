name: ci
# GSPOT_CI_ENABLED controls execution for this repository.
on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:
        inputs:
            full:
                description: Run full platform acceptance
                type: boolean
                default: true
            runner:
                description: One runner of the matrix to run, or all
                type: choice
                options: [all, ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
                default: all
            tests:
                description: Test files to run instead of the acceptance steps, relative to tests/
                type: string
                default: ''
    workflow_call:
        inputs:
            full:
                type: boolean
                default: false
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    affected:
        if: vars.GSPOT_CI_ENABLED == 'true' && !inputs.full
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            GITHUB_TOKEN: ${{ github.token }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: true
            - run: mise run --skip-tools repo:setup
            - run: mise run --skip-tools repo:install-checks
            - name: Check affected inputs
              env:
                  GSPOT_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
              run: mise run --skip-tools ci:affected
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always() && !cancelled()
              with:
                  name: affected-${{ github.sha }}
                  path: .gspot/reports/report.*
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 14
    acceptance:
        if: vars.GSPOT_CI_ENABLED == 'true' && inputs.full
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON((inputs.runner == '' || inputs.runner == 'all') && '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]' || format('["{0}"]', inputs.runner)) }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 180
        env:
            GITHUB_TOKEN: ${{ github.token }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: true
            - name: Install Linux XML tools and zsh
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
            - name: Install Bash 5 on macOS, which ships Bash 3.2
              if: runner.os == 'macOS'
              run: brew install bash
            - name: Install the Supabase CLI for the Linux database journeys
              if: runner.os == 'Linux'
              run: mise use --global supabase@2.72.7
            - run: mise run --skip-tools repo:setup
            - name: Extract Windows SwiftFormat executable
              if: runner.os == 'Windows'
              run: mise run --skip-tools ci:swiftformat
            - run: mise run --skip-tools repo:install-checks
            - run: mise run --skip-tools check:types
            - name: Run the named tests of a probe
              if: inputs.tests != ''
              env:
                  PROBE_TESTS: ${{ inputs.tests }}
              run: |
                  read -ra files <<< "$PROBE_TESTS"
                  mise run --skip-tools test:probe -- "${files[@]}"
            - if: inputs.tests == ''
              run: mise run --skip-tools test:coverage
            - if: inputs.tests == ''
              run: mise run --skip-tools test:tools
            - if: inputs.tests == ''
              run: mise run --skip-tools test:acceptance
            - id: normal
              if: inputs.tests == ''
              run: mise run --skip-tools check
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always() && !cancelled() && steps.normal.outcome != 'skipped'
              with:
                  name: acceptance-${{ matrix.os }}-normal-${{ github.sha }}
                  path: .gspot/reports/report.*
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 14
            - id: manual
              if: inputs.tests == ''
              run: mise run --skip-tools check -- --stage manual
            - if: inputs.tests == ''
              run: mise run --skip-tools doctor
            - if: inputs.tests == ''
              run: mise run --skip-tools build -- --all
            - name: Run the musl binary of this architecture on Alpine
              if: runner.os == 'Linux' && inputs.tests == ''
              run: |
                  case "$(uname -m)" in
                      x86_64) binary=gspot-linux-x64-musl ;;
                      aarch64) binary=gspot-linux-arm64-musl ;;
                      *) echo "::error::No musl target for $(uname -m)"; exit 1 ;;
                  esac
                  docker run --rm --volume "$PWD/dist:/dist:ro" alpine:3.22 sh -ec "/dist/$binary --version && /dist/$binary --help"
            - name: Run the x64 binary under Rosetta, which is not native evidence
              if: runner.os == 'macOS' && inputs.tests == ''
              run: arch -x86_64 dist/gspot-darwin-x64 --version && arch -x86_64 dist/gspot-darwin-x64 --help
            - if: inputs.tests == ''
              run: mise run --skip-tools test:release
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always() && !cancelled() && steps.manual.outcome != 'skipped'
              with:
                  name: acceptance-${{ matrix.os }}-manual-${{ github.sha }}
                  path: .gspot/reports/report.*
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 14
    documentation:
        if: vars.GSPOT_CI_ENABLED == 'true' && inputs.full
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            GITHUB_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
            - run: mise install bun node
            - run: mise run --skip-tools repo:setup
            - run: mise run --skip-tools test:docs
            - run: mise run --skip-tools docs:build
    code-scanning:
        needs: [affected, acceptance]
        if: always() && !cancelled() && vars.GSPOT_CI_ENABLED == 'true' && github.event_name != 'pull_request' && !github.event.repository.fork
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read
            security-events: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: ${{ inputs.full && format('acceptance-ubuntu-24.04-normal-{0}', github.sha) || format('affected-{0}', github.sha) }}
                  path: reports/normal
                  merge-multiple: true
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              if: inputs.full
              with:
                  pattern: acceptance-ubuntu-24.04-manual-${{ github.sha }}
                  path: reports/manual
                  merge-multiple: true
            - name: Upload normal repository SARIF
              if: hashFiles('reports/normal/report.sarif') != ''
              uses: github/codeql-action/upload-sarif@df5a14dc28094dc936e103b37d749c6628682b60 # v3.25.0
              with:
                  sarif_file: reports/normal/report.sarif
                  category: gspot-repository
            - name: Upload manual repository SARIF
              if: hashFiles('reports/manual/report.sarif') != ''
              uses: github/codeql-action/upload-sarif@df5a14dc28094dc936e103b37d749c6628682b60 # v3.25.0
              with:
                  sarif_file: reports/manual/report.sarif
                  category: gspot-repository-manual
            - name: Report absent SARIF
              if: hashFiles('reports/**/report.sarif') == ''
              run: echo '::notice::No SARIF artifact was produced. Inspect the setup and check job result.'
