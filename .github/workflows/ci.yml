name: ci
# Run the unit, integration, and end-to-end tests on Linux, macOS, and Windows, and build the docs site.
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
jobs:
    test:
        name: ${{ matrix.suite }} (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-26, windows-2025]
                suite: [unit, integration, e2e]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: $/.github/actions/setup
            - if: matrix.suite == 'integration' && runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
            - if: runner.os == 'macOS'
              run: brew install bash
            - if: matrix.suite == 'integration' && runner.os == 'macOS'
              shell: bash
              run: |
                  brew install docker docker-compose
                  mkdir -p "$HOME/.docker/cli-plugins"
                  ln -s "$(brew --prefix)/lib/docker/cli-plugins/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
                  docker compose version
            - run: mise run setup
            - run: mise run ${{ matrix.suite == 'unit' && 'test' || format('test:{0}', matrix.suite) }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
    docs:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: $/.github/actions/setup
            - run: bun install --frozen-lockfile --filter @gspothq/workspace --filter @gspothq/docs
            - run: mise run build:docs
