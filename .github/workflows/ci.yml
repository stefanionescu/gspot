name: Windows package launcher acceptance
on:
    workflow_dispatch:
permissions:
    contents: read
defaults:
    run:
        shell: bash
jobs:
    launcher:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Validate the packed launcher with Node absent from Bun PATH
              run: mise run test:package -- --test-name-pattern 'the packed CLI validates own record keys in Node and Bun without Node on PATH' -- tests/packages/launcher.test.ts
