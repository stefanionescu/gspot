name: ci
# Disposable diagnostic branch; only the outstanding Windows compiler cases run.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    compiler:
        name: Compiler acceptance (windows-2025)
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  native-tests: 'true'
            # The normal runner installs the complete native pins once before applying the selectors.
            - name: Stop Windows Defender scanning on this disposable runner
              shell: pwsh
              run: Set-MpPreference -DisableRealtimeMonitoring $true
            - name: Run the outstanding compiler cases
              env:
                  COMPILER_TEST_PATTERN: >-
                      (?:type checking delegates to the Next\.js check only when it runs|the TypeScript check reports findings when the Next\.js check is skipped)$
              run: |
                  mise run test:tools -- --test-name-pattern "$COMPILER_TEST_PATTERN" -- \
                      tests/tools/configurations/framework/nextjs.test.ts \
                      2>&1 | tee "$RUNNER_TEMP/compiler-native.log"
            - name: Preserve the compiler acceptance log
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: compiler-windows-${{ github.sha }}
                  path: ${{ runner.temp }}/compiler-native.log
                  retention-days: 1
