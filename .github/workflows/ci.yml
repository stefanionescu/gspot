# Run the unit, integration, and end-to-end tests on Linux, macOS, and Windows.
name: ci
on:
    push:
        branches: [main]
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
jobs:
    test:
        name: ${{ matrix.suite }} (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-26, windows-2025]
                suite: [unit, integration, e2e]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
              with:
                  version: '2026.10.7'
                  install_args: bun node
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/uv
                      ~/AppData/Local/uv/cache
                  key: packages-${{ runner.os }}-${{ hashFiles('mise.toml', 'bun.lock', 'packages/cli/configurations/**/manifest.toml') }}
            - if: matrix.suite == 'integration' && runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
            - if: runner.os == 'macOS'
              run: brew install bash
            - if: matrix.suite == 'integration' && runner.os == 'macOS'
              shell: bash
              run: |
                  brew install docker docker-compose
                  mkdir -p "$HOME/.docker/cli-plugins"
                  ln -s "$(brew --prefix)/lib/docker/cli-plugins/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
                  docker compose version
            - run: mise run setup
            - run: mise run test ${{ matrix.suite }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
