name: Windows library fixture phases
'on':
    workflow_dispatch:
permissions:
    contents: read
env:
    GITHUB_TOKEN: ${{ github.token }}
concurrency:
    group: windows-library-fixture-${{ github.ref }}
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    library:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Observe unchanged native library fixtures
              run: |
                  node --version
                  npm --version
                  bun --version
                  mise --version
                  cat > .async-publication-observer.mjs <<'OBSERVER'
                  import { mock } from 'bun:test';
                  import * as fs from 'node:fs';
                  import { resolve, basename } from 'node:path';
                  import { pathToFileURL } from 'node:url';
                  import { AsyncLocalStorage } from 'node:async_hooks';

                  const record = (value) => process.stderr.write(`GSPOT_PHASE ${JSON.stringify({ at: new Date().toISOString(), ...value })}\n`);
                  const publications = new AsyncLocalStorage();
                  const monitored = {};
                  for (const name of ['fsyncSync', 'lstatSync', 'statSync', 'realpathSync', 'readlinkSync', 'openSync', 'readFileSync', 'writeFileSync', 'fchmodSync', 'renameSync', 'mkdirSync', 'symlinkSync', 'unlinkSync']) {
                      const native = fs[name];
                      monitored[name] = (...args) => {
                          const start = performance.now();
                          try { return native(...args); }
                          finally {
                              const publication = publications.getStore();
                              if (publication) {
                                  const result = publication[name] ??= { calls: 0, ms: 0 };
                                  result.calls++;
                                  result.ms += performance.now() - start;
                              }
                          }
                      };
                      Object.defineProperties(monitored[name], Object.getOwnPropertyDescriptors(native));
                  }
                  const nativeFsync = fs.fsync;
                  monitored.fsync = (file, callback) => {
                      const start = performance.now();
                      const publication = publications.getStore();
                      return nativeFsync(file, (...args) => {
                          if (publication) {
                              const result = publication.fsync ??= { calls: 0, ms: 0 };
                              result.calls++;
                              result.ms += performance.now() - start;
                          }
                          return callback(...args);
                      });
                  };
                  Object.defineProperties(monitored.fsync, Object.getOwnPropertyDescriptors(nativeFsync));
                  mock.module('node:fs', () => ({ ...fs, ...monitored }));
                  const url = (path) => pathToFileURL(resolve(process.cwd(), path)).href;
                  const stateUrl = url('packages/cli/src/lifecycle/ownership/state/public.ts');
                  const state = await import(stateUrl);
                  const nativeRead = state.readInstalledTree;
                  const nativeInstall = state.installTree;
                  const inventory = (entries) => ({ files: entries.length, bytes: entries.reduce((n, entry) => n + entry.file.bytes.length, 0) });
                  mock.module(stateUrl, () => ({
                      ...state,
                      readInstalledTree(...args) {
                          const start = performance.now();
                          const operations = {};
                          record({ phase: 'readInstalledTree', event: 'start', kind: args[1] });
                          return publications.run(operations, () => {
                              try {
                                  const result = nativeRead(...args);
                                  record({ phase: 'readInstalledTree', event: 'end', kind: args[1], ms: performance.now() - start, ...inventory(result), fsOperations: operations });
                                  return result;
                              } catch (error) {
                                  record({ phase: 'readInstalledTree', event: 'error', kind: args[1], ms: performance.now() - start, error: error?.name });
                                  throw error;
                              }
                          });
                      },
                      async installTree(...args) {
                          const start = performance.now();
                          const operations = {};
                          record({ phase: 'installTree', event: 'start', kind: args[1], ...inventory(args[2]) });
                          return await publications.run(operations, async () => {
                              try {
                                  const result = await nativeInstall(...args);
                                  record({ phase: 'installTree', event: 'end', kind: args[1], ms: performance.now() - start, fsOperations: operations });
                                  return result;
                              } catch (error) {
                                  record({ phase: 'installTree', event: 'error', kind: args[1], ms: performance.now() - start, error: error?.name, fsOperations: operations });
                                  throw error;
                              }
                          });
                      },
                  }));
                  const commandUrl = url('tests/harness/command.ts');
                  const command = await import(commandUrl);
                  const nativeCommand = command.runTestCommand;
                  let commandSequence = 0;
                  const safeNativeCommand = (argv) => {
                      const selected = argv.slice(2);
                      return argv[1]?.replaceAll('\\', '/').endsWith('/packages/cli/src/main.ts') &&
                          ['["apply"]', '["install"]', '["check","--staged"]', '["check","--staged","--json"]'].includes(JSON.stringify(selected))
                          ? ['source-gspot', ...selected] : [basename(argv[0]), '<arguments redacted>'];
                  };
                  mock.module(commandUrl, () => ({
                      ...command,
                      async runTestCommand(...args) {
                          const start = performance.now();
                          const executable = basename(args[0][0]);
                          const id = ++commandSequence;
                          const argv = safeNativeCommand(args[0]);
                          record({ phase: 'runTestCommand', event: 'start', executable, id, argv });
                          try {
                              const result = await nativeCommand(...args);
                              record({ phase: 'runTestCommand', event: 'end', executable, id, argv, ms: performance.now() - start, code: result.code });
                              return result;
                          } catch (error) {
                              record({ phase: 'runTestCommand', event: 'error', executable, id, argv, ms: performance.now() - start, error: error?.name });
                              throw error;
                          }
                      },
                  }));
                  const copyUrl = url('packages/cli/src/execution/copy/public.ts');
                  const copy = await import(copyUrl);
                  const nativeCopy = copy.copyInto;
                  mock.module(copyUrl, () => ({ ...copy, async copyInto(...args) {
                      const start = performance.now();
                      record({ phase: 'copyInto', event: 'start', files: args[0].files?.length, dependencies: args[0].dependencies?.length });
                      try { return await nativeCopy(...args); }
                      finally { record({ phase: 'copyInto', event: 'end', ms: performance.now() - start }); }
                  }}));
                  const pythonUrl = url('tests/harness/python-installation.ts');
                  const python = await import(pythonUrl);
                  const nativePython = python.sharePythonTools;
                  mock.module(pythonUrl, () => ({ ...python, async sharePythonTools(...args) {
                      const start = performance.now();
                      record({ phase: 'sharePythonTools', event: 'start' });
                      try { return await nativePython(...args); }
                      finally { record({ phase: 'sharePythonTools', event: 'end', ms: performance.now() - start }); }
                  }}));
                  const installUrl = url('tests/harness/install.ts');
                  const install = await import(installUrl);
                  const nativeShare = install.shareToolProjects;
                  mock.module(installUrl, () => ({
                      ...install,
                      async shareToolProjects(...args) {
                          const start = performance.now();
                          record({ phase: 'shareToolProjects', event: 'start' });
                          try { return await nativeShare(...args); }
                          finally { record({ phase: 'shareToolProjects', event: 'end', ms: performance.now() - start }); }
                      },
                  }));
                  const gspotUrl = url('tests/harness/gspot.ts');
                  const gspot = await import(gspotUrl);
                  const nativeSpawn = gspot.spawnGspot;
                  let sequence = 0;
                  const tutorialArgv = new Set(['["apply"]', '["install"]', '["check","--staged"]', '["check","--staged","--json"]']);
                  mock.module(gspotUrl, () => ({ ...gspot, async spawnGspot(...args) {
                      const start = performance.now();
                      const id = ++sequence;
                      const serialized = JSON.stringify(args[1]);
                      const argv = tutorialArgv.has(serialized) ? args[1] : { redacted: true, count: args[1]?.length };
                      record({ phase: 'spawnGspot', event: 'start', id, argv });
                      try {
                          const result = await nativeSpawn(...args);
                          record({ phase: 'spawnGspot', event: 'end', id, argv, ms: performance.now() - start, code: result.code,
                              stdoutBytes: Buffer.byteLength(result.stdout), stderrBytes: Buffer.byteLength(result.stderr) });
                          if (serialized === '["check","--staged","--json"]') {
                              try {
                                  const report = JSON.parse(result.stdout);
                                  if (Array.isArray(report.checks)) record({ phase: 'completedCheckReport', id, duration: report.duration,
                                      checks: report.checks.map(({ check, status, duration }) => ({ check, status, duration })) });
                              } catch { /* Diagnostic parsing does not change native results. */ }
                          }
                          return result;
                      } catch (error) {
                          record({ phase: 'spawnGspot', event: 'error', id, argv, ms: performance.now() - start, error: error?.name });
                          throw error;
                      }
                  }}));
                  record({ phase: 'observer', event: 'ready', revision: 'async-publication-v5' });
                  OBSERVER
                  mise run test:tools -- --preload ./.async-publication-observer.mjs --test-name-pattern '^the library configurations' -- tests/tools/configurations/cases.test.ts
