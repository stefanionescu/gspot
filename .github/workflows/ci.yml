name: ci
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
            - name: Install Linux XML tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
            - run: mise run gspot:setup
            - name: Extract Windows SwiftFormat executable
              if: runner.os == 'Windows'
              run: bun tests/harness/swiftformat-windows.ts
            - run: bunx tsc --noEmit -p tsconfig.json
            - name: Observe Windows planted processes
              if: runner.os == 'Windows'
              shell: pwsh
              timeout-minutes: 16
              run: ./tests/harness/process-observer.ps1 -Coverage
            - name: Retain Windows process observations
              if: ${{ always() && runner.os == 'Windows' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: windows-processes-${{ github.sha }}
                  path: dist/process-observation/
                  if-no-files-found: error
                  retention-days: 7
            - run: mise run gspot:check
            - run: mise exec -- bun test --coverage
            - run: bun packages/cli/build.ts
