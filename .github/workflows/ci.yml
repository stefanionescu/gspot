name: ci
# Disposable diagnostic branch. Observe unchanged Astro and Svelte native cases.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    tools:
        name: Astro and Svelte stages (windows-2025)
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  native-tests: 'true'
            - name: Observe the unchanged native cases
              env:
                  NATIVE_TEST_PATTERN: 'one Astro project|format/prettier reports and corrects a component through the Svelte plugin'
              run: |
                  mkdir -p "$RUNNER_TEMP/native-stages"
                  cat > "$RUNNER_TEMP/native-stages/observer.js" <<'OBSERVER'
                  // @bun
                  import{afterAll as g,spyOn as v}from"bun:test";import{appendFileSync as b,writeFileSync as k}from"fs";import{resolve as R}from"path";import{pathToFileURL as D}from"url";var d=new URL("./events.jsonl",import.meta.url);k(d,"");var m=[],E=0,l=(s)=>b(d,JSON.stringify({time:new Date().toISOString(),...s})+`
                  `),f=(s)=>s.map((i)=>/token|password|_auth/iu.test(i)?"[REDACTED]":i.replace(/(https?:\/\/)[^\s/@]+:[^\s/@]+@/gu,"$1[REDACTED]@"));for(let[s,i]of[["tests/harness/platforms.ts",["linkInstalledModules"]],["tests/harness/install.ts",["initRepository","shareToolProjects","installToolProjects"]],["tests/harness/python-installation.ts",["sharePythonTools"]],["packages/cli/src/lifecycle/ownership/state/public.ts",["readInstalledTree","installTree"]],["tests/harness/gspot.ts",["spawnGspot"]],["packages/cli/src/platform/public.ts",["run"]]]){let p=await import(D(R(process.cwd(),s)).href);for(let t of i){let h=p[t];m.push(v(p,t).mockImplementation(function(...o){let u=++E,y=performance.now(),r={id:u,name:t};if(t==="run")r.argv=f(o[0]);if(t==="spawnGspot")r.argv=f(o[1]);if(t.endsWith("Tree"))r.kind=o[1];l({...r,event:"start",rss:process.memoryUsage().rss});let a=(e,n=!1)=>{let c=t==="readInstalledTree"?e:t==="installTree"?o[2]:void 0;l({...r,event:n?"error":"end",ms:performance.now()-y,rss:process.memoryUsage().rss,...n?{errorName:e instanceof Error?e.name:typeof e}:{},...c===void 0?{}:{entries:c.length,bytes:c.reduce((w,T)=>w+T.file.bytes.length,0)},...e?.code===void 0?{}:{code:e.code,stdoutBytes:Buffer.byteLength(e.stdout??""),stderrBytes:Buffer.byteLength(e.stderr??"")}})};try{let e=Reflect.apply(h,this,o);if(e?.then!==void 0)e.then((n)=>a(n),(n)=>a(n,!0));else a(e);return e}catch(e){throw a(e,!0),e}}))}}g(()=>{for(let s of m)s.mockRestore();l({event:"observer-restored"})});
                  OBSERVER
                  mise run test:tools -- --preload "$RUNNER_TEMP/native-stages/observer.js" \
                      --test-name-pattern "$NATIVE_TEST_PATTERN" -- \
                      tests/tools/configurations/framework/astro.test.ts tests/tools/configurations/framework/svelte.test.ts \
                      2>&1 | tee "$RUNNER_TEMP/native-stages/native.log"
            - name: Preserve native stage diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: astro-svelte-windows-${{ github.sha }}
                  path: ${{ runner.temp }}/native-stages/
                  retention-days: 1
