name: ci
# Run all four suites on each platform; split heavy tool files by their registered test names.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
env:
    GITHUB_TOKEN: ${{ github.token }}
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            # A pull request checks out a detached merge commit, so the commit checks compare with the default branch.
            - name: Point origin/HEAD at the default branch
              run: git remote set-head origin "${DEFAULT_BRANCH}"
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            - name: Install the repository checks
              id: install
              run: mise run install:checks
            - name: Verify the committed tool lockfiles
              run: |
                  bun scripts/plugin.ts install --refresh-lockfiles
                  git diff --exit-code .gspot/bun.lock .gspot/uv.lock
            - name: Validate registry pins
              run: mise run check:pins
            - name: Build the CLI
              run: mise run build:cli
    docs:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare docs and CLI
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  setup: bun install --frozen-lockfile --filter '@gspothq/{cli,docs}'
            - name: Build the site
              run: mise run build:docs
    package:
        strategy:
            fail-fast: false
            matrix:
                os: &platforms [ubuntu-24.04, macos-26, windows-2025]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Test the packages
              run: mise run test:package
    test:
        strategy:
            fail-fast: false
            matrix:
                os: *platforms
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Run the CLI and plugin tests
              run: mise run test
    tools:
        name: tools (${{ matrix.os }} ${{ matrix.selection.shard || matrix.selection.name }})
        strategy:
            fail-fast: false
            matrix:
                os: *platforms
                selection:
                    - shard: 1/16
                    - shard: 2/16
                    - shard: 3/16
                    - shard: 4/16
                    - shard: 5/16
                    - shard: 6/16
                    - shard: 7/16
                    - shard: 8/16
                    - shard: 9/16
                    - shard: 10/16
                    - shard: 11/16
                    - shard: 12/16
                    - shard: 13/16
                    - shard: 14/16
                    - shard: 15/16
                    - shard: 16/16
                    - name: general
                      path: &cases tests/tools/configurations/cases.test.ts
                      pattern: '^(?:the (?:xcode|files|github-actions|supabase|ansible) configuration |environment checks in the secrets configuration )'
                    - name: python-swift
                      path: *cases
                      pattern: '^the (?:pytest|python|sql|swift) configuration(?: over a package)? '
                    - name: data
                      path: *cases
                      pattern: '^the (?:postgres|docker) configuration '
                    - name: bash
                      path: *cases
                      pattern: '^the bash configuration '
                    - name: openapi-vitest
                      path: *cases
                      pattern: '^the (?:openapi|vitest) configuration '
                    - name: typescript-library
                      path: *cases
                      pattern: '^the (?:typescript configuration|library configurations) '
                    - name: prose-site
                      path: *cases
                      pattern: '^the (?:markdown, docs and prose configurations|site configuration) '
                    - name: nestjs
                      path: *cases
                      pattern: '^the nestjs configuration '
                    - name: react
                      path: *cases
                      pattern: '^the react configuration '
                    - name: svelte
                      path: *cases
                      pattern: '^the svelte configuration '
                    - name: vue
                      path: *cases
                      pattern: '^the vue configuration '
                    - name: shared-recommended
                      path: &shared tests/tools/lifecycle/shared-tools.test.ts
                      pattern: '^(?:shared tools preserve scoped checks and portable lockfiles at recommended|installed tool projects leave no apply drift after initialization)$'
                    - name: shared-all
                      path: *shared
                      pattern: '^(?:shared tools preserve scoped checks and portable lockfiles at all|shared native tool projects keep a separately selected Stylelint dependency and native result)$'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  native-tests: 'true'
            - name: Run this file shard of the tool tests
              if: matrix.selection.shard
              run: >-
                  mise run test:tools -- "--shard=${{ matrix.selection.shard }}"
                  --test-name-pattern='^(?!(?:the (?:xcode|pytest|ansible|library|postgres|supabase|github-actions|docker|openapi|vitest|python|sql|typescript|swift|bash|files|markdown, docs and prose|site|nestjs|react|svelte|vue) configurations?(?: over a package)?|environment checks in the secrets configuration) \S+ reports .* and passes after the fix$|(?:shared tools preserve scoped checks and portable lockfiles at (?:recommended|all)|shared native tool projects keep a separately selected Stylelint dependency and native result|installed tool projects leave no apply drift after initialization)$)'
            - name: Run this named group of the tool tests
              if: matrix.selection.path
              run: >-
                  mise run test:tools -- "--test-name-pattern=${{ matrix.selection.pattern }}"
                  -- "${{ matrix.selection.path }}"
