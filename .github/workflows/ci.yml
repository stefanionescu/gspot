name: ci
# Disposable diagnostic branch; only the outstanding Windows compiler cases run.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    compiler:
        name: Compiler acceptance (windows-2025)
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  native-tests: 'true'
            # The normal runner installs the complete native pins once before applying the selectors.
            - name: Stop Windows Defender scanning on this disposable runner
              shell: pwsh
              run: Set-MpPreference -DisableRealtimeMonitoring $true
            - name: Run the outstanding compiler cases
              env:
                  COMPILER_TEST_PATTERN: >-
                      (?:an absolute outDir outside the project is refused with exit 2|an outDir through a linked node_modules writes nothing outside the repository|type checking delegates to the Next\.js check only when it runs|the TypeScript check reports findings when the Next\.js check is skipped|Next\.js generates types and compiles references without a second copy or source output|JavaScript checking includes authored build directories at level all|JavaScript checking preserves repository resolution and excludes private ambient types without an authored jsconfig|JavaScript checking preserves repository resolution and excludes private ambient types with an authored jsconfig|JavaScript projects retain nested compiler options and isolate the deepest scope|recommended copies imported ambient dependencies and keeps unrelated scopes separate|all copies imported ambient dependencies and keeps unrelated scopes separate|recommended standalone TypeScript checks its own scope and keeps project declarations without private globals|all standalone TypeScript checks its own scope and keeps project declarations without private globals|recommended runs a covering ancestor compiler once across nested scopes|all runs a covering ancestor compiler once across nested scopes|nextjs/tsc reports TS2322 in app/count\.ts and passes after the fix|recommended compiles covering ancestors once and checks child-only selections|all compiles covering ancestors once and checks child-only selections|recommended staged standalone TypeScript checks index sources without working-tree fixes|all staged standalone TypeScript checks index sources without working-tree fixes)$
              run: |
                  mise run test:tools -- --test-name-pattern "$COMPILER_TEST_PATTERN" -- \
                      tests/tools/configurations/language/typescript/checks.test.ts \
                      tests/tools/configurations/framework/nextjs.test.ts \
                      tests/tools/configurations/language/javascript/projects.test.ts \
                      tests/tools/configurations/language/typescript/standalone.test.ts \
                      2>&1 | tee "$RUNNER_TEMP/compiler-native.log"
            - name: Preserve the compiler acceptance log
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: compiler-windows-${{ github.sha }}
                  path: ${{ runner.temp }}/compiler-native.log
                  retention-days: 1
