name: ci
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
            - name: Install Linux XML tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
            - run: mise run gspot:setup
            - name: Extract Windows SwiftFormat executable
              if: runner.os == 'Windows'
              run: bun tests/harness/swiftformat-windows.ts
            - run: bunx tsc --noEmit -p tsconfig.json
            - run: mise exec -- bun test --coverage
            - run: bun packages/cli/build.ts
            - run: bun packages/cli/src/main.ts check
