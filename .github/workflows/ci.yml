name: Windows compiler native configuration acceptance
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: windows-compiler-seven-${{ github.ref }}
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    compiler:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Validate native TypeScript configuration
              run: |
                  mise run test:tools -- --test-name-pattern '^the typescript configuration' -- tests/tools/configurations/cases.test.ts
