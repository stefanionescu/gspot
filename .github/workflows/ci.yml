name: Windows declared POSIX exclusions
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: windows-posix-skips-${{ github.ref }}
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    exclusions:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Observe declared POSIX-only registrations
              run: |
                  mise exec -- bun -e '
                  import { TEST_TIMEOUT_MS } from "./tests/config/timeouts.ts";
                  const node = Bun.spawnSync(["node", "--version"]);
                  console.log(JSON.stringify({ bun: Bun.version, node: node.stdout.toString().trim(), timeoutMs: TEST_TIMEOUT_MS }));
                  const child = Bun.spawnSync([process.execPath, "test", "--timeout", String(TEST_TIMEOUT_MS), "./tests/tools/configurations/language/javascript/jsconfig.test.ts", "./tests/tools/lifecycle/python-project.test.ts"], { stdout: "inherit", stderr: "inherit" });
                  process.exit(child.exitCode);
                  '
