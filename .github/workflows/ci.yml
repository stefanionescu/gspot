name: ci
# Disposable diagnostic branch. Run the unchanged root and child Drizzle generator controls.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    drizzle:
        name: Drizzle refusal (windows-2025)
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Observe the unchanged Drizzle controls
              env:
                  DRIZZLE_TEST_PATTERN: 'a failed generation|a stale schema'
              run: |
                  mkdir -p "$RUNNER_TEMP/drizzle-native"
                  cat > "$RUNNER_TEMP/drizzle-native/observer.js" <<'OBSERVER'
                  // @bun
                  import{afterAll as y,spyOn as c}from"bun:test";import{appendFileSync as l,writeFileSync as u}from"fs";import{join as r}from"path";import{pathToFileURL as p}from"url";var a=await import(p(r(process.cwd(),"packages/cli/src/execution/command/public.ts")).href),i=await import(p(r(process.cwd(),"packages/cli/src/execution/copy/public.ts")).href),m=await import(p(r(process.cwd(),"tests/harness/expectations.ts")).href),h=new URL("./events.jsonl",import.meta.url);u(h,"");var s=(o)=>l(h,JSON.stringify({time:new Date().toISOString(),...o})+`
                  `),t=(o)=>o instanceof Error?{name:o.name,message:o.message,stack:o.stack,..."cause"in o?{cause:t(o.cause)}:{},..."error"in o?{primary:t(o.error)}:{},..."suppressed"in o?{suppressed:t(o.suppressed)}:{}}:{type:typeof o},f=a.runCheckTool,w=c(a,"runCheckTool").mockImplementation(async(...o)=>{s({phase:"tool-start",scope:o[0].scope});try{let e=await f(...o);return s({phase:"tool",scope:o[0].scope,code:e.code,stdout:e.stdout,stderr:e.stderr}),e}catch(e){throw s({phase:"tool-error",scope:o[0].scope,error:t(e)}),e}}),k=i.copyIntoScratch,S=c(i,"copyIntoScratch").mockImplementation(async(...o)=>{s({phase:"copy-start",scope:o[0].scope});try{let e=await k(...o),d=e[Symbol.dispose].bind(e);return e[Symbol.dispose]=()=>{s({phase:"scratch-dispose-start"});try{d(),s({phase:"scratch-dispose",success:!0})}catch(n){throw s({phase:"scratch-dispose",success:!1,error:t(n)}),n}},s({phase:"copy",success:!0}),e}catch(e){throw s({phase:"copy-error",error:t(e)}),e}}),j=m.rejection,b=c(m,"rejection").mockImplementation((o)=>(o.catch((e)=>s({phase:"final-rejection",error:t(e)})),j(o)));y(()=>{b.mockRestore(),S.mockRestore(),w.mockRestore(),s({phase:"observer-restored"})});
                  OBSERVER
                  mise run test -- --preload "$RUNNER_TEMP/drizzle-native/observer.js" \
                      --test-name-pattern "$DRIZZLE_TEST_PATTERN" -- \
                      tests/cli/checks/library/drizzle.test.ts \
                      2>&1 | tee "$RUNNER_TEMP/drizzle-native/native.log"
            - name: Preserve the Drizzle diagnostic
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: drizzle-windows-${{ github.sha }}
                  path: ${{ runner.temp }}/drizzle-native/
                  retention-days: 1
