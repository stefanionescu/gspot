name: ci
# Disposable diagnostic branch; no full-suite acceptance.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    tools:
        name: Svelte stages (windows-2025)
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  native-tests: 'true'
            # Defender scans every file a sandbox install writes, which makes those installs run for minutes.
            - name: Stop Windows Defender scanning on this disposable runner
              if: runner.os == 'Windows'
              shell: pwsh
              run: Set-MpPreference -DisableRealtimeMonitoring $true
            - name: Observe the unchanged Svelte callback
              run: |
                  cat > "$RUNNER_TEMP/gspot-svelte-stage-preload.js" <<'OBSERVER'
                  // @bun
                  import{spyOn as k}from"bun:test";import{appendFileSync as v,writeFileSync as S}from"fs";import{dirname as g,resolve as f}from"path";import{fileURLToPath as I,pathToFileURL as R}from"url";var m=f(g(I(import.meta.url)),"svelte-stages.ndjson");S(m,"");var d=[],G=0,O=["install","sync","lock","init","set","remove","check","apply","run"];function p(s){let o=JSON.stringify(s)+`
                  `;v(m,o),process.stderr.write("GSPOT_STAGE "+o)}for(let[s,o]of[["tests/harness/platforms.ts",["linkInstalledModules"]],["tests/harness/install.ts",["initRepository","shareToolProjects"]],["tests/harness/python-installation.ts",["sharePythonTools"]],["packages/cli/src/lifecycle/ownership/state/public.ts",["readInstalledTree","installTree"]],["tests/harness/gspot.ts",["spawnGspot"]]]){let l=await import(R(f(process.cwd(),s)).href);for(let t of o){let h=l[t];d.push(k(l,t).mockImplementation(function(...n){let u=++G,y=performance.now(),r={id:u,name:t,at:new Date().toISOString()};if(t.endsWith("Tree")&&["npm","python","vale"].includes(n[1]))r.kind=n[1];if(t==="spawnGspot")r.operation=O.find((e)=>e===n[1][0]);p({...r,event:"start",rss:process.memoryUsage().rss});let i=(e,c=!1)=>{let a=t==="readInstalledTree"?e:t==="installTree"?n[2]:void 0;p({...r,event:c?"error":"end",ms:performance.now()-y,rss:process.memoryUsage().rss,...a?{entries:a.length,bytes:a.reduce((w,T)=>w+T.file.bytes.length,0)}:{}})};try{let e=Reflect.apply(h,this,n);if(e&&typeof e.then==="function")e.then((c)=>i(c),()=>i(void 0,!0));else i(e);return e}catch(e){throw i(void 0,!0),e}}))}}process.on("exit",()=>{for(let s of d)s.mockRestore()});
                  OBSERVER
                  mise run test:tools -- --preload "$RUNNER_TEMP/gspot-svelte-stage-preload.js" -- tests/tools/configurations/framework/svelte.test.ts
            - name: Preserve stage diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: svelte-windows-${{ github.sha }}
                  path: ${{ runner.temp }}/svelte-stages.ndjson
                  retention-days: 1
