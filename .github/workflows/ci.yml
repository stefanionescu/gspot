name: Windows HTML executable companion acceptance
on:
    workflow_dispatch:
permissions:
    contents: read
defaults:
    run:
        shell: bash
jobs:
    html:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Verify native companion relocation and missing companion refusal
              run: |
                  cat > "$RUNNER_TEMP/companion-probe.ts" <<'PROBE'
                  import {copyInstalledModule} from "./tests/harness/platforms.ts";
                  import {testModules,installedModules} from "./tests/harness/environment.ts";
                  import {createRequire} from "node:module";
                  import {testdir} from "testdirs";
                  import {join,dirname,resolve,relative,isAbsolute} from "node:path";
                  import {readdir,readlink,readFile,realpath,rename} from "node:fs/promises";
                  await using sandbox=await testdir();
                  const name="html-validate";
                  const originalPackage=join(testModules,name);
                  const source=await realpath(originalPackage);
                  const manifest=JSON.parse(await readFile(join(source,"package.json"),"utf8"));
                  const nativeRequire=createRequire(join(source,"package.json"));
                  const outcomes=async(paths)=>await Promise.all(paths.map(async path=>({path,realpath:await realpath(path),entries:await readdir(path)})));
                  const resolutions=Object.fromEntries(Object.keys(manifest.dependencies).map(dependency=>{try{return [dependency,{path:nativeRequire.resolve(dependency)}]}catch(error){return [dependency,{error:error.code,message:error.message}]}}));
                  const sourceLink=await readlink(originalPackage).then(target=>({target}),error=>({error:error.code}));
                  console.log(JSON.stringify({bunGeometry:{version:Bun.version,revision:Bun.revision,originalPackage,source,sourceLink,dependencies:manifest.dependencies,resolutions,stores:await outcomes([testModules,dirname(source),installedModules])}},null,2));
                  const nodeProbe=`import {realpathSync,readlinkSync,readdirSync,lstatSync,readFileSync} from "node:fs";import {createRequire} from "node:module";import {join,dirname} from "node:path";const [original,copied]=process.argv.slice(1);const inspect=path=>{const outcome=operation=>{try{return {value:operation()}}catch(error){return {error:error.code,message:error.message}}};const source=realpathSync(path);const manifest=JSON.parse(readFileSync(join(path,"package.json"),"utf8"));const require=createRequire(join(source,"package.json"));return {path,source,isSymbolicLink:lstatSync(path).isSymbolicLink(),readlink:outcome(()=>readlinkSync(path)),dependencyLink:outcome(()=>readlinkSync(join(path,"node_modules"))),dependencyRealpath:outcome(()=>realpathSync(join(path,"node_modules"))),store:dirname(source),entries:readdirSync(dirname(source)),dependencies:manifest.dependencies,resolutions:Object.fromEntries(Object.keys(manifest.dependencies).map(name=>[name,outcome(()=>require.resolve(name))]))}};console.log(JSON.stringify({node:{version:process.version,execPath:process.execPath,original:inspect(original),...(copied?{copied:inspect(copied)}:{})}},null,2));`;
                  const nativeOriginal=Bun.spawnSync(["node","--input-type=module","-e",nodeProbe,originalPackage]);
                  console.log(JSON.stringify({nativeOriginal:{code:nativeOriginal.exitCode,stdout:nativeOriginal.stdout.toString(),stderr:nativeOriginal.stderr.toString()}},null,2));
                  const originalVersion=Bun.spawnSync(["node",join(originalPackage,"bin/html-validate.mjs"),"--version"]);
                  console.log(JSON.stringify({originalVersion:{code:originalVersion.exitCode,stdout:originalVersion.stdout.toString(),stderr:originalVersion.stderr.toString()}},null,2));
                  const original=join(testModules,".bin");
                  const entries=(await readdir(original)).filter(entry=>entry===name||entry.startsWith(`${name}.`));
                  const layout=await Promise.all(entries.map(async entry=>({entry,realpath:await realpath(join(original,entry)),sha256:new Bun.CryptoHasher("sha256").update(await readFile(join(original,entry))).digest("hex")})));
                  const target=join(sandbox.path,"node_modules");
                  await copyInstalledModule(target,name);
                  const nativeCopied=Bun.spawnSync(["node","--input-type=module","-e",nodeProbe,originalPackage,join(target,name)]);
                  console.log(JSON.stringify({nativeCopied:{code:nativeCopied.exitCode,stdout:nativeCopied.stdout.toString(),stderr:nativeCopied.stderr.toString()}},null,2));
                  const dependencies=JSON.parse(nativeCopied.stdout.toString()).node;
                  const dependencyPaths=Object.keys(manifest.dependencies).map(name=>({name,original:dependencies.original.resolutions[name],copied:dependencies.copied.resolutions[name]}));
                  console.log(JSON.stringify({dependencyPaths},null,2));
                  const sameDependencies=dependencyPaths.every(entry=>entry.original.value&&entry.original.value===entry.copied.value);
                  const metadata=join(target,".bin",`${name}.bunx`);
                  const raw=await readFile(metadata);
                  const sameCompanion=raw.equals(await readFile(join(original,`${name}.bunx`)));
                  const encoded=raw.toString("utf16le").split('"')[0];
                  const program=resolve(target,encoded);
                  const boundary=relative(target,program);
                  const confined=!(isAbsolute(boundary)||boundary===".."||boundary.startsWith("..\\"));
                  const copied=await realpath(program);
                  const version=Bun.spawnSync([join(target,".bin",`${name}.exe`),"--version"]);
                  await rename(metadata,`${metadata}.held`);
                  let absent;
                  try{absent=Bun.spawnSync([join(target,".bin",`${name}.exe`),"--version"]);}finally{await rename(`${metadata}.held`,metadata);}
                  const restored=Bun.spawnSync([join(target,".bin",`${name}.exe`),"--version"]);
                  console.log(JSON.stringify({bun:Bun.version,revision:Bun.revision,sameCompanion,confined,layout,encoded,program:copied,copiedEntries:await readdir(join(target,".bin")),metadataSHA256:new Bun.CryptoHasher("sha256").update(raw).digest("hex"),version:{code:version.exitCode,stdout:version.stdout.toString(),stderr:version.stderr.toString()},absent:{code:absent.exitCode,stdout:absent.stdout.toString(),stderr:absent.stderr.toString()},restored:{code:restored.exitCode,stdout:restored.stdout.toString(),stderr:restored.stderr.toString()}},null,2));
                  if(!sameDependencies||!sameCompanion||!confined||originalVersion.exitCode!==0||version.exitCode!==0||restored.exitCode!==0||absent.exitCode!==255||!absent.stderr.toString().includes("could not find bin metadata file"))throw new Error("Native companion transport witness failed");
                  PROBE
                  cp "$RUNNER_TEMP/companion-probe.ts" companion-probe.ts
                  trap 'rm -f companion-probe.ts' EXIT
                  mise exec -- bun companion-probe.ts
            - name: Prepare native publication timing observer
              run: |
                  cat > .windows-ci-publication-observer.mjs <<'OBSERVER'
                  import { mock } from 'bun:test';
                  import * as fs from 'node:fs';
                  import { resolve, basename } from 'node:path';
                  import { pathToFileURL } from 'node:url';

                  const record = (value) => process.stderr.write(`GSPOT_PHASE ${JSON.stringify({ at: new Date().toISOString(), ...value })}\n`);
                  let publication;
                  const monitored = {};
                  for (const name of ['fsyncSync', 'lstatSync', 'statSync', 'realpathSync', 'readlinkSync', 'openSync', 'readFileSync', 'writeFileSync', 'fchmodSync', 'renameSync', 'mkdirSync', 'symlinkSync', 'unlinkSync']) {
                      const native = fs[name];
                      monitored[name] = (...args) => {
                          const start = performance.now();
                          try { return native(...args); }
                          finally {
                              if (publication) {
                                  const result = publication[name] ??= { calls: 0, ms: 0 };
                                  result.calls++;
                                  result.ms += performance.now() - start;
                              }
                          }
                      };
                      Object.defineProperties(monitored[name], Object.getOwnPropertyDescriptors(native));
                  }
                  mock.module('node:fs', () => ({ ...fs, ...monitored }));
                  const url = (path) => pathToFileURL(resolve(process.cwd(), path)).href;
                  const stateUrl = url('packages/cli/src/lifecycle/ownership/state/public.ts');
                  const state = await import(stateUrl);
                  const nativeRead = state.readInstalledTree;
                  const nativeInstall = state.installTree;
                  const inventory = (entries) => ({ files: entries.length, bytes: entries.reduce((n, entry) => n + entry.file.bytes.length, 0) });
                  mock.module(stateUrl, () => ({
                      ...state,
                      readInstalledTree(...args) {
                          const start = performance.now();
                          const previous = publication;
                          publication = {};
                          record({ phase: 'readInstalledTree', event: 'start', kind: args[1] });
                          try {
                              const result = nativeRead(...args);
                              record({ phase: 'readInstalledTree', event: 'end', kind: args[1], ms: performance.now() - start, ...inventory(result), fsOperations: publication });
                              return result;
                          } catch (error) {
                              record({ phase: 'readInstalledTree', event: 'error', kind: args[1], ms: performance.now() - start, error: error?.name });
                              throw error;
                          } finally { publication = previous; }
                      },
                      installTree(...args) {
                          const start = performance.now();
                          const previous = publication;
                          publication = {};
                          record({ phase: 'installTree', event: 'start', kind: args[1], ...inventory(args[2]) });
                          try { return nativeInstall(...args); }
                          finally {
                              record({ phase: 'installTree', event: 'end', kind: args[1], ms: performance.now() - start, fsOperations: publication });
                              publication = previous;
                          }
                      },
                  }));
                  const commandUrl = url('tests/harness/command.ts');
                  const command = await import(commandUrl);
                  const nativeCommand = command.runTestCommand;
                  mock.module(commandUrl, () => ({
                      ...command,
                      async runTestCommand(...args) {
                          const start = performance.now();
                          const executable = basename(args[0][0]);
                          record({ phase: 'runTestCommand', event: 'start', executable });
                          try {
                              const result = await nativeCommand(...args);
                              record({ phase: 'runTestCommand', event: 'end', executable, ms: performance.now() - start, code: result.code });
                              return result;
                          } catch (error) {
                              record({ phase: 'runTestCommand', event: 'error', executable, ms: performance.now() - start, error: error?.name });
                              throw error;
                          }
                      },
                  }));
                  const installUrl = url('tests/harness/install.ts');
                  const install = await import(installUrl);
                  const nativeShare = install.shareToolProjects;
                  mock.module(installUrl, () => ({
                      ...install,
                      async shareToolProjects(...args) {
                          const start = performance.now();
                          record({ phase: 'shareToolProjects', event: 'start' });
                          try { return await nativeShare(...args); }
                          finally { record({ phase: 'shareToolProjects', event: 'end', ms: performance.now() - start }); }
                      },
                  }));
                  record({ phase: 'observer', event: 'ready' });
                  OBSERVER
            - name: Validate HTML scopes, registry credentials, and GitHub CI refusals
              run: mise run test:tools -- --preload ./.windows-ci-publication-observer.mjs --test-name-pattern 'keeps built HTML exceptions confined|reports audio and video autoplay|native registry settings authenticate|invalid comparisons and failed installs fail the job in github CI' -- tests/tools/generation/site-html.test.ts tests/tools/generation/html-accessibility.test.ts tests/tools/npm/environment.test.ts tests/tools/commands/ci.test.ts
