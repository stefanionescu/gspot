name: Windows async publication regression
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: windows-async-publication-regression-${{ github.ref }}
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    regression:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Verify asynchronous publication refusal and drain
              run: mise run test -- -- tests/cli/platform/writes.test.ts
    compiler-installer:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the committed acceptance source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: 081fc435ce6df22e2c7fbe7e9ef65925dabb64a2
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Verify native Vue and installer refusal controls
              run: |
                  mise run test:tools -- --test-name-pattern '^the vue configuration|^init ' -- tests/tools/configurations/cases.test.ts tests/tools/lifecycle/installer-failures.test.ts
