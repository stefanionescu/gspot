name: ci
# Disposable selected-cache diagnostic.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
    run:
        shell: bash
jobs:
    tools:
        name: Npm cache publication (Windows)
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  native-tests: 'true'
            - name: Observe the unchanged native case
              run: |
                  mkdir -p "$RUNNER_TEMP/native-stages"
                  cat > "$RUNNER_TEMP/native-stages/observer.js" <<'OBSERVER'
                  // @bun
                  import{afterAll as L}from"bun:test";import{appendFileSync as R,writeFileSync as x,readFileSync as k,mkdirSync as j,readdirSync as T,existsSync as _}from"fs";import{resolve as d,join as n,dirname as D}from"path";import{pathToFileURL as m}from"url";import{createHash as N}from"crypto";var E=new URL("./events.jsonl",import.meta.url);x(E,"");var r=(o)=>R(E,`${JSON.stringify({time:new Date().toISOString(),...o})}
                  `),F=await import(m(d("packages/cli/src/lifecycle/ownership/state/public.ts")).href),P=await import(m(d("packages/cli/src/execution/copy/public.ts")).href),q=await import(m(d("packages/cli/src/lifecycle/ownership/public.ts")).href),B=await import(m(d("packages/cli/src/platform/scratch.ts")).href),{readInstalledTree:u,installTree:C}=F;function w(o){let t=N("sha256");for(let{path:a,file:e}of o)t.update(JSON.stringify({path:a,mode:e.mode,link:e.isLink===!0})).update(e.bytes);return t.digest("hex")}L(async()=>{let o=n(D(process.env.GSPOT_PACKAGE_ARCHIVES),"tool-projects"),t=T(o).map((e)=>n(o,e)).filter((e)=>_(n(e,".gspot/node_modules")));if(r({event:"cache-inventory",caches:t.length}),t.length!==1)throw Error(`Expected one selected npm cache; observed ${String(t.length)}.`);let a;{using e=B.scratchFolder("gspot-cache-publication-");a=e.path;for(let p of t){let h=n(e.path,"journaled"),l=n(e.path,"native");j(h),j(l);let c=performance.now(),s=u(n(p,".gspot/node_modules"),"npm"),f=w(s),I=s.length,O=s.reduce((i,A)=>i+A.file.bytes.length,0),g=s.find((i)=>i.file.isLink!==!0).path;r({event:"read",ms:performance.now()-c,count:I,bytes:O,digest:f,rss:process.memoryUsage().rss}),c=performance.now();{using i=q.openOwnership(h);C(i,"npm",s)}r({event:"journaled",ms:performance.now()-c,rss:process.memoryUsage().rss}),s=[],Bun.gc(!0),c=performance.now(),await P.copyInto({root:p,target:l,files:[],dependencies:[{path:".gspot/node_modules",operation:"clone"}]}),r({event:"clone",ms:performance.now()-c,rss:process.memoryUsage().rss});let y=w(u(n(h,".gspot/node_modules"),"npm")),v=w(u(n(l,".gspot/node_modules"),"npm")),U=k(n(p,g));x(n(l,g),"independent mutation");let b=k(n(p,g)).equals(U),S=f===y&&f===v;if(r({event:"proof",equal:S,independent:b,journaledDigest:y,nativeDigest:v}),!S||!b)throw Error("Native cache publication changed installed bytes, modes, links, or donor independence.")}}r({event:"cleanup",removed:!_(a)})});
                  OBSERVER
                  mise run test:tools -- --preload "$RUNNER_TEMP/native-stages/observer.js" \
                      --test-name-pattern 'format/prettier reports and corrects a component through the Svelte plugin' -- \
                      tests/tools/configurations/framework/svelte.test.ts \
                      2>&1 | tee "$RUNNER_TEMP/native-stages/native.log"
            - name: Preserve cache diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: npm-cache-publication-windows-${{ github.sha }}
                  path: ${{ runner.temp }}/native-stages/
                  retention-days: 1
