name: ci
# Checks, documentation, and npm package tests run on Linux. CLI, plugin, and tool tests run on
# Linux, macOS, and Windows. Tool tests split into four shards per system.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            # A pull request checks out a detached merge commit, so the commit checks compare with the default branch.
            - name: Point origin/HEAD at the default branch
              run: git remote set-head origin "${DEFAULT_BRANCH}"
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            - name: Install the repository checks
              id: install
              run: mise run install:checks
            - name: Check the types
              run: mise run check:types
            - name: Detect changed pin inputs
              id: pin-inputs
              shell: bash
              run: |
                  if ! git cat-file -e "${PIN_BASE}^{commit}" 2>/dev/null ||
                     git diff --name-only "${PIN_BASE}" HEAD -- \
                         packages/cli/configurations bun.lock packages/cli/package.json packages/eslint-plugin/package.json \
                         scripts/pins.ts scripts/config/pins.ts scripts/types/pins.ts scripts/parsers/releases.ts \
                         scripts/plugin.ts scripts/config/plugin.ts scripts/eslint-presets.ts \
                         scripts/config/eslint-presets.ts scripts/parsers/npm.ts scripts/types/npm.ts \
                         packages/cli/src/config/generation/eslint.ts packages/cli/src/generation/eslint/presets.ts \
                         packages/cli/src/parsers/schema/eslint.ts | rg .; then
                      echo 'changed=true' >> "$GITHUB_OUTPUT"
                  fi
              env:
                  PIN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
            - name: Validate changed registry pins
              if: steps.pin-inputs.outputs.changed == 'true'
              run: mise run check:pins
            - name: Build the CLI
              run: mise run build:cli
            - name: Run the repository checks
              run: mise exec -- gspot check
            - name: Run the manual checks
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: mise exec -- gspot check --only docs/lychee-external security/codeql security/semgrep-registry
            - name: Run doctor
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: mise exec -- gspot doctor
    docs:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Install mise
              uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
            - name: Install Bun and Node
              run: mise install bun node
            - name: Install workspace dependencies
              run: bun install --frozen-lockfile
            - name: Build the site
              run: mise run build:docs
    package:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Test the packages
              run: mise run test:package
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-15, windows-2025]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Run the CLI and plugin tests
              run: mise run test
    tools:
        name: tools (${{ matrix.platform }} ${{ matrix.shard }}/${{ matrix.shards }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-24.04, platform: linux, shard: 1, shards: 4 }
                    - { os: ubuntu-24.04, platform: linux, shard: 2, shards: 4 }
                    - { os: ubuntu-24.04, platform: linux, shard: 3, shards: 4 }
                    - { os: ubuntu-24.04, platform: linux, shard: 4, shards: 4 }
                    - { os: macos-15, platform: macos, shard: 1, shards: 4 }
                    - { os: macos-15, platform: macos, shard: 2, shards: 4 }
                    - { os: macos-15, platform: macos, shard: 3, shards: 4 }
                    - { os: macos-15, platform: macos, shard: 4, shards: 4 }
                    - { os: windows-2025, platform: windows, shard: 1, shards: 4 }
                    - { os: windows-2025, platform: windows, shard: 2, shards: 4 }
                    - { os: windows-2025, platform: windows, shard: 3, shards: 4 }
                    - { os: windows-2025, platform: windows, shard: 4, shards: 4 }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        env:
            SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  native-tests: 'true'
            # Defender scans every file a sandbox install writes, which makes those installs run for minutes.
            - name: Stop Windows Defender scanning on this disposable runner
              if: runner.os == 'Windows'
              shell: pwsh
              run: Set-MpPreference -DisableRealtimeMonitoring $true
            - name: Run this shard of the tool tests
              run: mise run test:tools -- "--shard=${SHARD}"
