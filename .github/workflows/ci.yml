name: ci
# Every pull request, merge group, and push to main runs the whole suite on Linux, macOS, and Windows. The tool and
# acceptance tests are split into four shards per system by file count.
on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
        env:
            GITHUB_TOKEN: ${{ github.token }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: true
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/uv
                  key: packages-${{ runner.os }}-${{ hashFiles('bun.lock', '.gspot/bun.lock', '.gspot/uv.lock') }}
            # A pull request checks out a detached merge commit, so the commit checks compare with the default branch.
            - run: git remote set-head origin "${DEFAULT_BRANCH}"
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            - name: Install the XML tools and zsh that doctor expects
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
            - run: mise run --skip-tools repo:setup
            - id: install
              run: mise run --skip-tools repo:install-checks
            - run: mise run --skip-tools check:types
            # The tracked pins of the kit tools must be what the manifests write.
            - run: mise run --skip-tools repo:tools && git diff --exit-code .mise/conf.d/test-tools.toml
            # The unit job runs the tests on every system, so this job skips the check that runs them.
            - run: mise run --skip-tools check -- --skip tests/unit
            - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: mise run --skip-tools check -- --stage manual
            - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: mise run --skip-tools doctor
    docs:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            GITHUB_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
            - run: mise install bun node
            - run: mise run --skip-tools repo:setup
            - run: mise run --skip-tools docs:build
    package:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            GITHUB_TOKEN: ${{ github.token }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: true
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/uv
                  key: packages-${{ runner.os }}-${{ hashFiles('bun.lock', '.gspot/bun.lock', '.gspot/uv.lock') }}
            - run: mise run --skip-tools repo:setup
            - run: mise run --skip-tools repo:install-checks
            - run: mise run --skip-tools test:package
    unit:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-15, windows-2025]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            GITHUB_TOKEN: ${{ github.token }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: true
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/uv
                      ~/AppData/Local/uv/cache
                  key: packages-${{ runner.os }}-${{ hashFiles('bun.lock', '.gspot/bun.lock', '.gspot/uv.lock') }}
            - name: Install Linux XML tools and zsh
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
            - name: Install Bash 5 on macOS, which ships Bash 3.2
              if: runner.os == 'macOS'
              run: brew install bash
            - run: mise run --skip-tools repo:setup
            - name: Extract Windows SwiftFormat executable
              if: runner.os == 'Windows'
              run: mise run --skip-tools ci:swiftformat
            - run: mise run --skip-tools repo:install-checks
            - run: mise run --skip-tools test
    suite:
        name: suite (${{ matrix.system }} ${{ matrix.shard }}/${{ matrix.shards }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-24.04, system: linux, shard: 1, shards: 4 }
                    - { os: ubuntu-24.04, system: linux, shard: 2, shards: 4 }
                    - { os: ubuntu-24.04, system: linux, shard: 3, shards: 4 }
                    - { os: ubuntu-24.04, system: linux, shard: 4, shards: 4 }
                    - { os: macos-15, system: macos, shard: 1, shards: 4 }
                    - { os: macos-15, system: macos, shard: 2, shards: 4 }
                    - { os: macos-15, system: macos, shard: 3, shards: 4 }
                    - { os: macos-15, system: macos, shard: 4, shards: 4 }
                    - { os: windows-2025, system: windows, shard: 1, shards: 4 }
                    - { os: windows-2025, system: windows, shard: 2, shards: 4 }
                    - { os: windows-2025, system: windows, shard: 3, shards: 4 }
                    - { os: windows-2025, system: windows, shard: 4, shards: 4 }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        env:
            GITHUB_TOKEN: ${{ github.token }}
            SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: true
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/uv
                      ~/AppData/Local/uv/cache
                  key: packages-${{ runner.os }}-${{ hashFiles('bun.lock', '.gspot/bun.lock', '.gspot/uv.lock') }}
            - name: Install Linux XML tools and zsh
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
            - name: Install Bash 5 on macOS, which ships Bash 3.2
              if: runner.os == 'macOS'
              run: brew install bash
            - name: Install the Supabase CLI for the Linux database journeys
              if: runner.os == 'Linux'
              run: mise use --global supabase@2.72.7
            # Defender scans every file a sandbox install writes, which makes those installs run for minutes.
            - name: Stop Windows Defender scanning on this disposable runner
              if: runner.os == 'Windows'
              shell: pwsh
              run: Set-MpPreference -DisableRealtimeMonitoring $true
            - run: mise run --skip-tools repo:setup
            - name: Extract Windows SwiftFormat executable
              if: runner.os == 'Windows'
              run: mise run --skip-tools ci:swiftformat
            - id: install
              run: mise run --skip-tools repo:install-checks
            - name: Run this shard of the tool tests
              run: mise run --skip-tools test:tools -- "--shard=${SHARD}"
            - name: Run this shard of the acceptance tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: mise run --skip-tools test:acceptance -- "--shard=${SHARD}"
