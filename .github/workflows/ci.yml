name: ci
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad4ec7f4b0d0a6ae
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566
            - run: bun install --frozen-lockfile
            - run: bunx tsc --noEmit -p tsconfig.json
            - run: bun test --coverage
            - run: bun packages/cli/build.ts
            - run: mise run gspot:setup
              if: runner.os != 'Windows'
            - run: bun packages/cli/src/main.ts check
              if: runner.os != 'Windows'
