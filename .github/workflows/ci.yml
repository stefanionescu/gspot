name: Windows async publication candidate
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: windows-async-publication-${{ github.ref }}
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    native:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Verify native publication and refusal boundaries
              run: |
                  cat > .windows-native-publication-probe.mjs <<'NATIVE_PROBE'
                  import fs from 'node:fs';
                  import { strict as assert } from 'node:assert';
                  import { syncBuiltinESMExports } from 'node:module';
                  import { join, resolve } from 'node:path';
                  import { pathToFileURL } from 'node:url';
                  import { tmpdir } from 'node:os';
                  const native = { ...fs };
                  const checkpoint = resolve(process.argv[2] ?? '/private/tmp/gspot-async-publication-4c7c1d');
                  const work = native.mkdtempSync(join(tmpdir(), 'gspot-async-native-'));
                  const source = join(work, 'source'); const target = join(work, 'target');
                  native.mkdirSync(source); native.mkdirSync(target);
                  const samples = []; const open = new Set(); let maximum = 0;
                  const observedFsync = (fd, callback) => {
                      const before = native.fstatSync(fd); open.add(fd); maximum = Math.max(maximum, open.size);
                      native.fsync(fd, (error) => {
                          const after = native.fstatSync(fd);
                          samples.push({ dev: before.dev === after.dev, ino: before.ino === after.ino, size: before.size === after.size, mtime: before.mtimeMs === after.mtimeMs, ctime: before.ctimeMs === after.ctimeMs, error: error?.code ?? null });
                          callback(error);
                      });
                  };
                  Object.defineProperties(observedFsync, Object.getOwnPropertyDescriptors(native.fsync));
                  const observedClose = (fd) => { native.closeSync(fd); open.delete(fd); };
                  Object.defineProperties(observedClose, Object.getOwnPropertyDescriptors(native.closeSync));
                  let restore;
                  if (process.versions.bun) {
                      const { mock } = await import('bun:test');
                      mock.module('node:fs', () => ({ ...native, fsync: observedFsync, closeSync: observedClose }));
                      restore = () => mock.restore();
                  } else {
                      fs.fsync = observedFsync; fs.closeSync = observedClose; syncBuiltinESMExports();
                      restore = () => { fs.fsync = native.fsync; fs.closeSync = native.closeSync; syncBuiltinESMExports(); };
                  }
                  let log;
                  try {
                      const { openOwnership } = await import(pathToFileURL(join(checkpoint, 'packages/cli/src/lifecycle/ownership/public.ts')).href);
                      const { installTree, readInstalledTree } = await import(pathToFileURL(join(checkpoint, 'packages/cli/src/lifecycle/ownership/state/public.ts')).href);
                      for (let i = 0; i < 35; i += 1) native.writeFileSync(join(source, `file-${String(i)}`), `value-${String(i)}`, { mode: i % 2 ? 0o444 : 0o755 });
                      native.mkdirSync(join(source, '__pycache__')); native.writeFileSync(join(source, '__pycache__/runtime.pyc'), 'excluded');
                      native.symlinkSync('file-0', join(source, 'link'), 'file');
                      log = openOwnership(target);
                      await installTree(log, 'python', readInstalledTree(source, 'python'));
                      for (let i = 0; i < 35; i += 1) {
                          const path = join(target, '.gspot/.venv', `file-${String(i)}`);
                          assert.equal(native.readFileSync(path, 'utf8'), `value-${String(i)}`);
                          if (process.platform !== 'win32') assert.equal(native.statSync(path).mode & 0o777, i % 2 ? 0o444 : 0o755);
                      }
                      assert.equal(native.readlinkSync(join(target, '.gspot/.venv/link')), 'file-0');
                      assert.equal(native.existsSync(join(target, '.gspot/.venv/__pycache__')), false);
                      native.chmodSync(join(source, 'file-1'), 0o644); native.unlinkSync(join(source, 'file-1'));
                      native.writeFileSync(join(source, 'file-0'), 'replacement');
                      await installTree(log, 'python', readInstalledTree(source, 'python'));
                      assert.equal(native.readFileSync(join(target, '.gspot/.venv/file-0'), 'utf8'), 'replacement');
                      assert.equal(native.existsSync(join(target, '.gspot/.venv/file-1')), false);
                      assert.equal(native.existsSync(join(target, '.gspot/.venv.next')), false);
                      assert.equal(native.existsSync(join(target, '.gspot/.venv.previous')), false);
                      assert.deepEqual(log.state.installed, ['python']); assert.equal(log.state.installing, undefined);
                      assert.equal(open.size, 0); assert.equal(samples.length, 69); assert.ok(maximum <= 16 && maximum > 1);
                      for (const sample of samples) assert.deepEqual(sample, { dev: true, ino: true, size: true, mtime: true, ctime: true, error: null });
                      console.log(JSON.stringify({ platform: process.platform, node: process.versions.node, bun: process.versions.bun ?? null, flushes: samples.length, maximum, pending: open.size, allFsyncIdentityAndTimestampsStable: true, bytesModesLinksReplacementsPycacheState: true }));
                  } finally {
                      log?.[Symbol.dispose]();
                      restore();
                      native.rmSync(work, { recursive: true, force: true });
                  }
                  NATIVE_PROBE
                  cat > .windows-boundary-publication-probe.ts <<'BOUNDARY_PROBE'
                  import { mock } from 'bun:test';
                  import { strict as assert } from 'node:assert';
                  import * as fs from 'node:fs';
                  const native = { ...fs };
                  import { join, resolve } from 'node:path';
                  import { pathToFileURL } from 'node:url';
                  import { tmpdir } from 'node:os';

                  const mode = process.argv[2];
                  const checkout = resolve(process.argv[3] ?? process.cwd());
                  const work = native.mkdtempSync(join(tmpdir(), 'gspot-async-boundary-'));
                  const project = join(work, 'project');
                  const outside = join(work, 'outside');
                  native.mkdirSync(project); native.mkdirSync(outside);
                  native.writeFileSync(join(outside, 'unchanged'), 'outside');
                  const descriptors = new Map<number, string>();
                  const gates: Array<{ fd: number; path: string; error: NodeJS.ErrnoException | null; finish: (error: NodeJS.ErrnoException | null) => void }> = [];
                  let active = false;
                  let maximum = 0;
                  let wake: (() => void) | undefined;
                  let starts = 0;
                  let closes = 0;
                  mock.module('node:fs', () => ({
                      ...native,
                      openSync: (...args: Parameters<typeof native.openSync>) => {
                          const fd = native.openSync(...args);
                          if (active && String(args[0]).includes('node_modules.next')) {
                              descriptors.set(fd, String(args[0])); starts += 1; maximum = Math.max(maximum, descriptors.size);
                          }
                          return fd;
                      },
                      closeSync: (fd: number) => {
                          native.closeSync(fd);
                          if (descriptors.delete(fd)) closes += 1;
                      },
                      fsync: (fd: number, finish: (error: NodeJS.ErrnoException | null) => void) => {
                          if (!active) { native.fsync(fd, finish); return; }
                          native.fsync(fd, (error) => {
                              gates.push({ fd, path: descriptors.get(fd)!, error, finish });
                              wake?.(); wake = undefined;
                          });
                      },
                  }));
                  const { openOwnership } = await import(pathToFileURL(join(checkout, 'packages/cli/src/lifecycle/ownership/public.ts')).href);
                  const { installTree } = await import(pathToFileURL(join(checkout, 'packages/cli/src/lifecycle/ownership/state/public.ts')).href);
                  const log = openOwnership(project);
                  try {
                      await installTree(log, 'npm', [{ path: '.gspot/node_modules/previous', file: { bytes: Buffer.from('old'), mode: 0o444 } }]);
                      active = true;
                      const entries = Array.from({ length: 35 }, (_, i) => ({ path: `.gspot/node_modules/package/file-${String(i)}`, file: { bytes: Buffer.from(`bytes-${String(i)}`), mode: i % 2 ? 0o444 : 0o755 } }));
                      entries.push({ path: '.gspot/node_modules/package/link', file: { bytes: Buffer.from('file-0'), mode: 0o777, isLink: true } } as typeof entries[number]);
                      let settled = false;
                      const outcome = installTree(log, 'npm', entries).then(
                          () => { settled = true; return { status: 'fulfilled' } as const; },
                          (error: unknown) => { settled = true; return { status: 'rejected', error } as const; },
                      );
                      const waitFor = async (count: number) => { while (gates.length < count) await new Promise<void>((resolve) => { wake = resolve; }); };
                      await waitFor(16);
                      assert.equal(starts, 16); assert.equal(settled, false);
                      assert.equal(native.readFileSync(join(project, '.gspot/node_modules/previous'), 'utf8'), 'old');
                      assert.equal(native.existsSync(join(project, '.gspot/node_modules.next/package/link')), false);
                      if (mode === 'modified') native.writeFileSync(gates[0]!.path, 'changed-bytes');
                      if (mode === 'substituted') {
                          native.unlinkSync(gates[0]!.path); native.writeFileSync(gates[0]!.path, 'bytes-0', { mode: 0o755 });
                      }
                      if (mode === 'linked-parent') {
                          native.renameSync(join(project, '.gspot/node_modules.next'), join(project, '.gspot/parked'));
                          native.symlinkSync(outside, join(project, '.gspot/node_modules.next'), 'dir');
                      }
                      gates[0]!.finish(mode === 'flush-failed' ? Object.assign(new Error('native flush injected failure'), { code: 'EIO' }) : gates[0]!.error);
                      await Promise.resolve(); await Promise.resolve();
                      assert.equal(settled, false, 'a first rejection must not leave pending flushes');
                      for (let i = 1; i < 16; i += 1) gates[i]!.finish(gates[i]!.error);
                      if (mode === 'success') {
                          await waitFor(32); for (let i = 16; i < 32; i += 1) gates[i]!.finish(gates[i]!.error);
                          await waitFor(35); for (let i = 32; i < 35; i += 1) gates[i]!.finish(gates[i]!.error);
                      }
                      const result = await outcome;
                      assert.equal(descriptors.size, 0); assert.equal(starts, closes); assert.equal(maximum, 16);
                      if (mode === 'success') {
                          assert.equal(result.status, 'fulfilled'); assert.equal(starts, 35);
                          for (let i = 0; i < 35; i += 1) {
                              const path = join(project, '.gspot/node_modules/package', `file-${String(i)}`);
                              assert.equal(native.readFileSync(path, 'utf8'), `bytes-${String(i)}`);
                              if (process.platform !== 'win32') assert.equal(native.statSync(path).mode & 0o777, i % 2 ? 0o444 : 0o755);
                          }
                          assert.equal(native.readlinkSync(join(project, '.gspot/node_modules/package/link')), 'file-0');
                          assert.equal(native.existsSync(join(project, '.gspot/node_modules.next')), false);
                          assert.deepEqual(log.state.installed, ['npm']); assert.equal(log.state.installing, undefined);
                      } else {
                          assert.equal(result.status, 'rejected'); assert.equal(starts, 16);
                          assert.ok(result.status === 'rejected' && result.error instanceof Error);
                          const message = result.status === 'rejected' ? (result.error as Error).message : '';
                          assert.match(message, mode === 'flush-failed' ? /native flush injected failure/u : mode === 'linked-parent' ? /Unsafe lifecycle parent/u : /Lifecycle destination changed during the operation/u);
                          assert.equal(native.readFileSync(join(project, '.gspot/node_modules/previous'), 'utf8'), 'old');
                          assert.deepEqual(log.state.installing, ['npm']);
                          if (mode === 'linked-parent') {
                              assert.equal(native.readFileSync(join(outside, 'unchanged'), 'utf8'), 'outside');
                              assert.deepEqual(native.readdirSync(outside), ['unchanged']);
                              native.unlinkSync(join(project, '.gspot/node_modules.next'));
                              native.renameSync(join(project, '.gspot/parked'), join(project, '.gspot/node_modules.next'));
                          }
                          log[Symbol.dispose]();
                          const recovered = openOwnership(project);
                          assert.equal(native.existsSync(join(project, '.gspot/node_modules.next')), false);
                          assert.equal(native.readFileSync(join(project, '.gspot/node_modules/previous'), 'utf8'), 'old');
                          recovered[Symbol.dispose]();
                      }
                      console.log(JSON.stringify({ mode, runtime: `Bun ${Bun.version}`, platform: process.platform, status: result.status, starts, closes, maximum, pending: descriptors.size, realNativeFlushes: gates.length, secondBatchStarted: starts > 16, oldPublishedUntilDrain: true, allResultsPreserved: true }));
                  } finally {
                      log[Symbol.dispose]();
                      mock.restore();
                      native.rmSync(work, { recursive: true, force: true });
                  }
                  BOUNDARY_PROBE
                  node --version
                  bun --version
                  node ./.windows-native-publication-probe.mjs "$PWD"
                  bun ./.windows-native-publication-probe.mjs "$PWD"
                  for mode in success flush-failed modified substituted linked-parent; do
                      bun ./.windows-boundary-publication-probe.ts "$mode" "$PWD"
                  done
    shared-tools:
        runs-on: windows-2025
        timeout-minutes: 60
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the repository
              uses: ./.github/actions/setup
            - name: Observe four unchanged shared installation controls
              run: |
                  cat > .async-publication-observer.mjs <<'PUBLICATION_OBSERVER'
                  import { mock } from 'bun:test';
                  import * as fs from 'node:fs';
                  import { resolve, basename } from 'node:path';
                  import { pathToFileURL } from 'node:url';
                  import { AsyncLocalStorage } from 'node:async_hooks';

                  const record = (value) => process.stderr.write(`GSPOT_PHASE ${JSON.stringify({ at: new Date().toISOString(), ...value })}\n`);
                  const publications = new AsyncLocalStorage();
                  const monitored = {};
                  for (const name of ['fsyncSync', 'lstatSync', 'statSync', 'realpathSync', 'readlinkSync', 'openSync', 'readFileSync', 'writeFileSync', 'fchmodSync', 'renameSync', 'mkdirSync', 'symlinkSync', 'unlinkSync']) {
                      const native = fs[name];
                      monitored[name] = (...args) => {
                          const start = performance.now();
                          try { return native(...args); }
                          finally {
                              const publication = publications.getStore();
                              if (publication) {
                                  const result = publication[name] ??= { calls: 0, ms: 0 };
                                  result.calls++;
                                  result.ms += performance.now() - start;
                              }
                          }
                      };
                      Object.defineProperties(monitored[name], Object.getOwnPropertyDescriptors(native));
                  }
                  const nativeFsync = fs.fsync;
                  monitored.fsync = (file, callback) => {
                      const start = performance.now();
                      const publication = publications.getStore();
                      return nativeFsync(file, (...args) => {
                          if (publication) {
                              const result = publication.fsync ??= { calls: 0, ms: 0 };
                              result.calls++;
                              result.ms += performance.now() - start;
                          }
                          return callback(...args);
                      });
                  };
                  Object.defineProperties(monitored.fsync, Object.getOwnPropertyDescriptors(nativeFsync));
                  mock.module('node:fs', () => ({ ...fs, ...monitored }));
                  const url = (path) => pathToFileURL(resolve(process.cwd(), path)).href;
                  const stateUrl = url('packages/cli/src/lifecycle/ownership/state/public.ts');
                  const state = await import(stateUrl);
                  const nativeRead = state.readInstalledTree;
                  const nativeInstall = state.installTree;
                  const inventory = (entries) => ({ files: entries.length, bytes: entries.reduce((n, entry) => n + entry.file.bytes.length, 0) });
                  mock.module(stateUrl, () => ({
                      ...state,
                      readInstalledTree(...args) {
                          const start = performance.now();
                          const operations = {};
                          record({ phase: 'readInstalledTree', event: 'start', kind: args[1] });
                          return publications.run(operations, () => {
                              try {
                                  const result = nativeRead(...args);
                                  record({ phase: 'readInstalledTree', event: 'end', kind: args[1], ms: performance.now() - start, ...inventory(result), fsOperations: operations });
                                  return result;
                              } catch (error) {
                                  record({ phase: 'readInstalledTree', event: 'error', kind: args[1], ms: performance.now() - start, error: error?.name });
                                  throw error;
                              }
                          });
                      },
                      async installTree(...args) {
                          const start = performance.now();
                          const operations = {};
                          record({ phase: 'installTree', event: 'start', kind: args[1], ...inventory(args[2]) });
                          return await publications.run(operations, async () => {
                              try {
                                  const result = await nativeInstall(...args);
                                  record({ phase: 'installTree', event: 'end', kind: args[1], ms: performance.now() - start, fsOperations: operations });
                                  return result;
                              } catch (error) {
                                  record({ phase: 'installTree', event: 'error', kind: args[1], ms: performance.now() - start, error: error?.name, fsOperations: operations });
                                  throw error;
                              }
                          });
                      },
                  }));
                  const commandUrl = url('tests/harness/command.ts');
                  const command = await import(commandUrl);
                  const nativeCommand = command.runTestCommand;
                  let commandSequence = 0;
                  const safeNativeCommand = (argv) => {
                      const selected = argv.slice(2);
                      return argv[1]?.replaceAll('\\', '/').endsWith('/packages/cli/src/main.ts') &&
                          ['["apply"]', '["install"]', '["check","--staged"]', '["check","--staged","--json"]'].includes(JSON.stringify(selected))
                          ? ['source-gspot', ...selected] : [basename(argv[0]), '<arguments redacted>'];
                  };
                  mock.module(commandUrl, () => ({
                      ...command,
                      async runTestCommand(...args) {
                          const start = performance.now();
                          const executable = basename(args[0][0]);
                          const id = ++commandSequence;
                          const argv = safeNativeCommand(args[0]);
                          record({ phase: 'runTestCommand', event: 'start', executable, id, argv });
                          try {
                              const result = await nativeCommand(...args);
                              record({ phase: 'runTestCommand', event: 'end', executable, id, argv, ms: performance.now() - start, code: result.code });
                              return result;
                          } catch (error) {
                              record({ phase: 'runTestCommand', event: 'error', executable, id, argv, ms: performance.now() - start, error: error?.name });
                              throw error;
                          }
                      },
                  }));
                  const copyUrl = url('packages/cli/src/execution/copy/public.ts');
                  const copy = await import(copyUrl);
                  const nativeCopy = copy.copyInto;
                  mock.module(copyUrl, () => ({ ...copy, async copyInto(...args) {
                      const start = performance.now();
                      record({ phase: 'copyInto', event: 'start', files: args[0].files?.length, dependencies: args[0].dependencies?.length });
                      try { return await nativeCopy(...args); }
                      finally { record({ phase: 'copyInto', event: 'end', ms: performance.now() - start }); }
                  }}));
                  const pythonUrl = url('tests/harness/python-installation.ts');
                  const python = await import(pythonUrl);
                  const nativePython = python.sharePythonTools;
                  mock.module(pythonUrl, () => ({ ...python, async sharePythonTools(...args) {
                      const start = performance.now();
                      record({ phase: 'sharePythonTools', event: 'start' });
                      try { return await nativePython(...args); }
                      finally { record({ phase: 'sharePythonTools', event: 'end', ms: performance.now() - start }); }
                  }}));
                  const installUrl = url('tests/harness/install.ts');
                  const install = await import(installUrl);
                  const nativeShare = install.shareToolProjects;
                  mock.module(installUrl, () => ({
                      ...install,
                      async shareToolProjects(...args) {
                          const start = performance.now();
                          record({ phase: 'shareToolProjects', event: 'start' });
                          try { return await nativeShare(...args); }
                          finally { record({ phase: 'shareToolProjects', event: 'end', ms: performance.now() - start }); }
                      },
                  }));
                  const gspotUrl = url('tests/harness/gspot.ts');
                  const gspot = await import(gspotUrl);
                  const nativeSpawn = gspot.spawnGspot;
                  let sequence = 0;
                  const tutorialArgv = new Set(['["apply"]', '["install"]', '["check","--staged"]', '["check","--staged","--json"]']);
                  mock.module(gspotUrl, () => ({ ...gspot, async spawnGspot(...args) {
                      const start = performance.now();
                      const id = ++sequence;
                      const serialized = JSON.stringify(args[1]);
                      const argv = tutorialArgv.has(serialized) ? args[1] : { redacted: true, count: args[1]?.length };
                      record({ phase: 'spawnGspot', event: 'start', id, argv });
                      try {
                          const result = await nativeSpawn(...args);
                          record({ phase: 'spawnGspot', event: 'end', id, argv, ms: performance.now() - start, code: result.code,
                              stdoutBytes: Buffer.byteLength(result.stdout), stderrBytes: Buffer.byteLength(result.stderr) });
                          if (serialized === '["check","--staged","--json"]') {
                              try {
                                  const report = JSON.parse(result.stdout);
                                  if (Array.isArray(report.checks)) record({ phase: 'completedCheckReport', id, duration: report.duration,
                                      checks: report.checks.map(({ check, status, duration }) => ({ check, status, duration })) });
                              } catch { /* Diagnostic parsing does not change native results. */ }
                          }
                          return result;
                      } catch (error) {
                          record({ phase: 'spawnGspot', event: 'error', id, argv, ms: performance.now() - start, error: error?.name });
                          throw error;
                      }
                  }}));
                  record({ phase: 'observer', event: 'ready', revision: 'async-publication-v5' });
                  PUBLICATION_OBSERVER
                  mise run test:tools -- --preload ./.async-publication-observer.mjs -- tests/tools/lifecycle/shared-tools.test.ts
