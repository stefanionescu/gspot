# Release and manual runs build the published stable release tag.
name: docs
on:
    workflow_call:
        inputs:
            release_tag:
                description: Published stable release tag
                required: true
                type: string
    workflow_dispatch:
        inputs:
            release_tag:
                description: Published stable release tag
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: documentation-production
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Verify the published release
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(gh release view "${DOCS_RELEASE}" --repo "${DOCS_REPOSITORY}" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true
              env:
                  GH_TOKEN: ${{ github.token }}
                  DOCS_RELEASE: ${{ inputs.release_tag }}
                  DOCS_REPOSITORY: ${{ github.repository }}
            - name: Check out the documentation source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.release_tag }}
                  persist-credentials: false
            - name: Prepare docs and CLI
              uses: $/.github/actions/setup
            - run: bun install --frozen-lockfile --filter @gspothq/workspace --filter @gspothq/docs
            - name: Build the site
              run: mise run build:docs
            - name: Upload the site
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: documentation-${{ github.run_id }}
                  path: docs/dist
                  if-no-files-found: error
                  retention-days: 1
