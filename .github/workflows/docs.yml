name: docs
# Builds the manual from a published release and deploys it. Pull requests build it in the ci workflow.
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            release_tag:
                description: Published stable release tag (use the prior tag to roll back)
                required: true
                type: string
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Check out the release tag
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ inputs.release_tag || github.event.release.tag_name }}
                  persist-credentials: false
            - name: Install mise
              uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
                  cache: false
            - name: Install Bun and Node
              run: mise install bun node
            - name: Set up the repository
              run: mise run --skip-tools setup
            - name: Name the source commit the pages link to
              shell: bash
              run: printf 'GSPOT_DOCS_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            - name: Build the site
              run: mise run --skip-tools build:docs
            - name: Upload the site
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              with:
                  path: docs/dist
                  retention-days: 90
    deploy:
        needs: build
        if: vars.PAGES_ENABLED == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        concurrency:
            group: github-pages-production
            cancel-in-progress: false
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy the site
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
