name: docs
# Release runs use their published tag. Manual runs can build the selected source before publication.
on:
    workflow_call:
        inputs:
            release_tag:
                description: Published stable release tag
                required: true
                type: string
    workflow_dispatch:
        inputs:
            release_tag:
                description: Published stable release tag (omit to build the selected source)
                required: false
                type: string
permissions:
    contents: read
concurrency:
    group: documentation-production
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Verify the published release
              if: inputs.release_tag != ''
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(gh release view "${DOCS_RELEASE}" --repo "${DOCS_REPOSITORY}" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true
              env:
                  GH_TOKEN: ${{ github.token }}
                  DOCS_RELEASE: ${{ inputs.release_tag }}
                  DOCS_REPOSITORY: ${{ github.repository }}
            - name: Check out the documentation source
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ inputs.release_tag || github.ref }}
                  persist-credentials: false
            - name: Prepare the documentation workspace
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  setup: bun install --frozen-lockfile --filter @gspothq/docs
            - name: Name the source commit the documentation links to
              shell: bash
              run: printf 'GSPOT_DOCS_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            - name: Build the site
              run: mise run build:docs
            - name: Upload the site
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: documentation-${{ github.run_id }}
                  path: docs/dist
                  if-no-files-found: error
                  retention-days: 90
    deploy:
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out the documentation deployment settings
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ inputs.release_tag || github.ref }}
                  persist-credentials: false
            - name: Prepare the documentation workspace
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  setup: bun install --frozen-lockfile --filter @gspothq/docs
            - name: Download the reviewed static build
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: documentation-${{ github.run_id }}
                  path: docs/dist
            - name: Deploy the static assets
              run: mise run deploy:docs
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
