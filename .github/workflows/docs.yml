name: docs
# The release calls this workflow after publication; a manual dispatch rebuilds an earlier release for rollback.
on:
    workflow_call:
        inputs:
            release_tag:
                description: Published stable release tag
                required: true
                type: string
    workflow_dispatch:
        inputs:
            release_tag:
                description: Published stable release tag (use the prior tag to roll back)
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: documentation-production
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Verify the published release
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(gh release view "${DOCS_RELEASE}" --repo "${DOCS_REPOSITORY}" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true
              env:
                  GH_TOKEN: ${{ github.token }}
                  DOCS_RELEASE: ${{ inputs.release_tag }}
                  DOCS_REPOSITORY: ${{ github.repository }}
            - name: Check out the release tag
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ inputs.release_tag }}
                  persist-credentials: false
            - name: Install mise
              uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
                  cache: false
            - name: Install Bun and Node
              run: mise install bun node
            - name: Install workspace dependencies
              run: bun install --frozen-lockfile
            - name: Name the source commit the documentation links to
              shell: bash
              run: printf 'GSPOT_DOCS_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            - name: Build the site
              run: mise run build:docs
            - name: Upload the site
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: documentation-${{ github.run_id }}
                  path: docs/dist
                  if-no-files-found: error
                  retention-days: 90
    deploy:
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment:
            name: documentation
            url: https://gspot.dev
        steps:
            - name: Check out the release deployment settings
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ inputs.release_tag }}
                  persist-credentials: false
            - name: Install mise
              uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
                  cache: false
            - name: Install Bun and Node
              run: mise install bun node
            - name: Install workspace dependencies
              run: bun install --frozen-lockfile
            - name: Download the reviewed static build
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: documentation-${{ github.run_id }}
                  path: docs/dist
            - name: Deploy the static assets
              working-directory: docs
              run: bun run wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
