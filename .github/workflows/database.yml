name: database
# The Supabase database test starts a local Postgres container. The pull request jobs leave it out, because pulling
# the image on every run hits the registry rate limit, so it runs only when started by hand.
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    supabase:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            MISE_ENV: test
            GSPOT_SUPABASE_TEST: '1'
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Install mise
              uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
            - name: Install the Supabase CLI
              run: mise install bun node supabase
            - name: Install workspace dependencies
              run: bun install --frozen-lockfile
            - name: Run the Supabase freshness test
              working-directory: tests
              run: mise exec -- bun test --timeout 900000 ./tools/checks/supabase/types.test.ts
