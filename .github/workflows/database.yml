name: database
# The Supabase database test starts a local Postgres container. The pull request jobs leave it out, because pulling
# the image on every run hits the registry rate limit, so it runs only when started by hand.
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    supabase:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Prepare the test workspace
              uses: ./.github/actions/setup
              with:
                  tools: bun node
            - name: Run the Supabase freshness test
              run: mise run test:database
