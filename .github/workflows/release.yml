name: release
# Start workflow dispatch on the version tag, such as v0.1.0.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false
jobs:
    version:
        permissions:
            contents: read
            actions: read
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out the release commit
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Prepare release validation
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  setup: bun install --frozen-lockfile --filter @gspothq/workspace --filter @gspothq/cli
            - name: Validate the release tag and plugin pin
              shell: bash
              run: |
                  mise run check:release -- "${TAG}"
              env:
                  TAG: ${{ github.ref_name }}
            - name: Require both CI runs
              shell: bash
              run: |
                  set -euo pipefail
                  for workflow in ci.yml gspot.yml; do
                      if [ "$(gh run list --workflow "$workflow" --commit "$RELEASE_COMMIT" --branch main --event push --status success --limit 1 --json databaseId --jq length)" != 1 ]; then
                          echo "${workflow} must pass for ${RELEASE_COMMIT}." >&2
                          exit 1
                      fi
                  done
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_COMMIT: ${{ github.sha }}
    publish:
        needs: version
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: write
            id-token: write
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Prepare release packages
              uses: ./.github/actions/setup
              with:
                  tools: bun node
                  setup: |
                      bun install --frozen-lockfile --filter @gspothq/workspace --filter @gspothq/cli --filter @gspothq/eslint-plugin
                      bun packages/cli/scripts/grammars.ts
                      mise run build:plugin
            - name: Build the CLI package
              run: mise run build:cli
            # Run setup and build:cli, then publish the plugin and CLI manually with a short-lived granular token.
            # Register this repository and workflow file as npm trusted publishers before later OIDC releases.
            - name: Publish the packages to npm
              run: |
                  set -euo pipefail
                  for package in packages/eslint-plugin packages/cli; do
                      name=$(jq -r '.name' "${package}/package.json")
                      version=$(jq -r '.version' "${package}/package.json")
                      lookup="${RUNNER_TEMP}/npm-release.json"
                      if npm view "${name}@${version}" version --json > "${lookup}"; then
                          test "$(jq -r '.' "${lookup}")" = "${version}"
                          echo "${name}@${version} is already published."
                          continue
                      fi
                      if ! jq -e '.error.code == "E404"' "${lookup}" > /dev/null; then
                          echo "Cannot verify ${name}@${version} on npm." >&2
                          exit 1
                      fi
                      npm publish "./${package}"
                  done
            - name: Create the GitHub release
              run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
    docs:
        needs: publish
        uses: ./.github/workflows/docs.yml
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
            release_tag: ${{ github.ref_name }}
