name: release
# Start this workflow by hand on a version tag, such as v0.1.0. npm accepts the publish through
# trusted publishing (OIDC: GitHub proves to npm which workflow runs). Publish the first version
# by hand, then add this workflow as a trusted publisher on npmjs.com.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false
jobs:
    publish:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: $/.github/actions/setup
            - run: test "${TAG}" = "v$(node -p "require('./packages/cli/package.json').version")"
              env:
                  TAG: ${{ github.ref_name }}
            - run: mise run setup
            - run: mise run build
            - name: Publish the packages to npm
              shell: bash
              run: |
                  set -euo pipefail
                  for package in packages/eslint-plugin packages/cli; do
                      spec=$(node -p "const manifest = require('./${package}/package.json'); manifest.name + '@' + manifest.version")
                      if npm view "${spec}" version > /dev/null 2>&1; then
                          echo "${spec} is already on npm."
                      else
                          npm publish "./${package}"
                      fi
                  done
            - name: Create the GitHub release
              run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
    docs:
        needs: publish
        uses: $/.github/workflows/docs.yml
        with:
            release_tag: ${{ github.ref_name }}
