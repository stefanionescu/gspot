name: release
on:
    push:
        tags: ['v*']
permissions:
    contents: read
jobs:
    build:
        permissions:
            contents: read
            id-token: write
            attestations: write
        strategy:
            matrix:
                include:
                    - target: bun-darwin-arm64
                      os: macos-latest
                      npm: darwin-arm64
                    - target: bun-darwin-x64
                      os: macos-latest
                      npm: darwin-x64
                    - target: bun-linux-x64
                      os: ubuntu-latest
                      npm: linux-x64
                    - target: bun-linux-arm64
                      os: ubuntu-latest
                      npm: linux-arm64
                    - target: bun-windows-x64
                      os: ubuntu-latest
                      npm: win32-x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  cache: false
            - run: bun install --frozen-lockfile
            - run: test "v$(bun -e 'console.log(require("./packages/cli/package.json").version)')" = "$TAG"
              env:
                  TAG: ${{ github.ref_name }}
            - run: bun packages/cli/build.ts --target "$TARGET"
              env:
                  TARGET: ${{ matrix.target }}
            - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
              with:
                  subject-path: dist/*
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: ${{ matrix.npm }}
                  path: dist/*
    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  cache: false
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: dist
                  merge-multiple: true
            - run: bun install --frozen-lockfile
            - run: bun test tests/release
              env:
                  GSPOT_RELEASE_TEST: '1'
            - run: bun packages/cli/publish.ts --tag "$TAG"
              env:
                  NPM_CONFIG_PROVENANCE: 'true'
                  TAG: ${{ github.ref_name }}
            - run: gh release create "$TAG" dist/gspot-* dist/checksums.txt --title "$TAG" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
