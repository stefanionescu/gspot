name: release
# Release publication requires an explicit workflow dispatch.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false
jobs:
    ci:
        permissions:
            contents: read
            actions: read
            security-events: write
        uses: $/.github/workflows/ci.yml
    publish:
        needs: ci
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        environment: release
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - name: Install mise and the pinned tools
              uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  cache: false
            - name: Set up the repository
              run: mise run --skip-tools setup
            - name: Check the release version
              shell: bash
              run: mise run --skip-tools check:release
              env:
                  TAG: ${{ github.ref_name }}
            - name: Build the CLI package
              run: mise run --skip-tools build:cli
            # npm trusted publishing: npm trades this job's OIDC token for a publish token that lasts one run, and
            # records provenance. Each package names this workflow and the release environment as its trusted
            # publisher on npmjs.com, so no token is stored anywhere.
            - name: Publish the packages to npm
              shell: bash
              run: |
                  for package in packages/eslint-plugin packages/cli; do
                      npm publish "./${package}" --access public
                  done
            - name: Create the GitHub release
              shell: bash
              run: gh release create "${TAG}" --title "${TAG}" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
