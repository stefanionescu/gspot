# Generated by gspot 0.1.0 from gspot.toml. Do not edit.
# Change policy: gspot set / allow / ignore, or edit gspot.toml, then run: gspot apply
name: gspot
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  check-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
      - run: mise run gspot:setup
      - run: mise run gspot:check --
      - run: mise run gspot:check -- --at manual
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      - uses: github/codeql-action/upload-sarif@df5a14dc28094dc936e103b37d749c6628682b60 # v3.25.0
        if: always() && hashFiles('.gspot/last.sarif') != ''
        with:
          sarif_file: .gspot/last.sarif
