# Generated by gspot. Do not edit this file; change gspot.toml, then run gspot apply.
name: gspot

on:
  push:
    branches:
      - "**"
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: gspot-${{ runner.os }}-${{ runner.arch }}-0.3.8-${{ hashFiles('.gspot/package.json', '.gspot/*lock*', '.gspot/pyproject.toml', '.gspot/mise.toml', 'bun.lock') }}
          path: |
            ~/.cache/mise/downloads-cas
            ~/.bun/install/cache

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false

      - name: Install gspot
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |-
          mise install node@24.20.0 'npm:@gspothq/cli[allow_low_downloads=true]@0.3.8' bun@1.4.3
          mise bin-paths node@24.20.0 'npm:@gspothq/cli[allow_low_downloads=true]@0.3.8' bun@1.4.3 >> "$GITHUB_PATH"

      - name: Set up the project
        run: mise run setup

      - name: Install gspot tools
        run: |-
          gspot install
          git add --intent-to-add -- .gspot
          git diff --exit-code -- .gspot || { echo "::error::gspot install changed .gspot/. Run gspot install, then commit .gspot/."; exit 1; }

      - name: Save caches
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.cache/mise/downloads-cas
            ~/.bun/install/cache

      - name: Lint
        env:
          GSPOT_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          gspot check --base "${GSPOT_CI_BASE}"
