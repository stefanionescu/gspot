name: site
# No build or deployment runs until the owner explicitly re-enables CI.
on:
    pull_request:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            release_tag:
                description: Published stable release tag (use the prior tag to roll back)
                required: true
                type: string
            source_ref:
                description: Exact docs-only correction commit, or empty to rebuild the release tag
                required: false
                type: string
permissions:
    contents: read
concurrency:
    group: site-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    build:
        if: vars.GSPOT_CI_ENABLED == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ inputs.source_ref || inputs.release_tag || github.event.release.tag_name || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
            - run: mise install bun node
            - run: mise run --skip-tools repo:setup
            - name: Verify released documentation source
              if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
              env:
                  GH_TOKEN: ${{ github.token }}
                  DOCS_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
                  DOCS_SOURCE_REF: ${{ inputs.source_ref }}
              run: mise run --skip-tools site:verify-release
            - name: Record immutable source
              shell: bash
              run: printf 'GSPOT_DOCS_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            - run: mise run --skip-tools docs:build
            - name: Record artifact provenance
              shell: bash
              run: |
                  bun -e 'await Bun.write("docs/dist/source.json", JSON.stringify({revision:process.env.GSPOT_DOCS_REVISION,version:require("./packages/cli/package.json").version})+"\n")'
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: site-source-${{ github.run_id }}
                  path: docs/dist
                  retention-days: 90
                  if-no-files-found: error
            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
              with:
                  path: docs/dist
                  retention-days: 90
    deploy:
        needs: build
        if: vars.GSPOT_PAGES_ENABLED == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        concurrency:
            group: github-pages-production
            cancel-in-progress: false
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy verified artifact
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
