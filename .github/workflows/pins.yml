name: pins
# Every tool pin of the kit manifests must exist in its registry. The check calls a registry once per pin, so it runs
# once a week and on demand instead of in every pull request.
on:
    schedule:
        - cron: '41 5 * * 1'
    workflow_dispatch:
permissions:
    contents: read
jobs:
    pins:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            GITHUB_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
              with:
                  version: '2026.8.8'
                  install: false
            - run: mise install bun
            - run: mise run --skip-tools repo:setup
            - run: mise run --skip-tools repo:pins
