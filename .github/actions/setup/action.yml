name: Prepare repository
description: Install pinned tools and dependencies and build the parsers and plugin.
inputs:
    tools:
        description: Mise tools to install, or all repository pins.
        default: all
    setup:
        description: Commands to prepare the selected workspace.
        default: mise run setup
    native-tests:
        description: Install host shell and XML commands used by native tool tests.
        default: 'false'
runs:
    using: composite
    steps:
        - name: Install mise and the pinned tools
          uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
          with:
              version: '2026.8.8'
              install_args: ${{ inputs.tools != 'all' && inputs.tools || '' }}
        - name: Restore the package caches
          uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
          with:
              path: |
                  ~/.bun/install/cache
                  ~/.cache/uv
                  ~/AppData/Local/uv/cache
              key: packages-${{ runner.os }}-${{ hashFiles('mise.toml', 'bun.lock', '.gspot/bun.lock', '.gspot/uv.lock') }}
              restore-keys: packages-${{ runner.os }}-
        - name: Install Linux XML tools and zsh
          if: runner.os == 'Linux' && inputs.native-tests == 'true'
          shell: bash
          run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zsh
        - name: Install Bash 5 on macOS
          if: runner.os == 'macOS' && inputs.native-tests == 'true'
          shell: bash
          run: brew install bash
        - name: Set up the repository
          shell: bash
          env:
              SETUP_COMMAND: ${{ inputs.setup }}
          run: bash --noprofile --norc -e -o pipefail -c "$SETUP_COMMAND"
