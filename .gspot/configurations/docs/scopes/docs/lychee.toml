# This file stops lychee from reading a lychee.toml in the folder where it runs.
# Allow a URL with the docs.allowed_urls setting.
# A link that starts with / names a route of the site, so lychee skips it.
exclude = ["^https://www\\.npmjs\\.com/package/@gspothq/cli$", "%7B[^/]*%7D", "^file://(.*)/\\.gspot/root-links/"]
