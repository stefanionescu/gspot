# Files without a known schema are checked by their other selected tools.
ignoreErrors: true
customCatalog:
  schemas:
    - name: gspot
      description: The gspot settings file
      fileMatch:
        - gspot.toml
      location: .gspot/configurations/general/files/gspot-toml.schema.json
    - name: mise
      description: The mise configuration file
      fileMatch:
        - mise.toml
        - .mise.toml
        - .mise/conf.d/*.toml
        - .config/mise/config.toml
        - .config/mise/conf.d/*.toml
        - .gspot/mise.toml
      location: https://mise.jdx.dev/schema/mise.json
