[default]
locale = "en"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-identifiers]
capitalisation = "capitalisation"
IIF = "IIF"
LICENCE = "LICENCE"
next-intl = "next-intl"
udid = "udid"
NGINX = "NGINX"
Stylelint = "Stylelint"
markdownlint = "markdownlint"
React = "React"
Native = "Native"
Simple = "Simple"
Icons = "Icons"

[default.extend-words]
capitalisation = "capitalisation"
IIF = "IIF"
LICENCE = "LICENCE"
next-intl = "next-intl"
udid = "udid"
NGINX = "NGINX"
Stylelint = "Stylelint"
markdownlint = "markdownlint"
React = "React"
Native = "Native"
Simple = "Simple"
Icons = "Icons"

[files]
extend-exclude = [
  # Build output
  "**/build/**",
  # Ignored by Git
  "**/.DS_Store",
  "**/Thumbs.db",
  "**/*.swp",
  "**/*~",
  "**/.idea/**",
  "**/.vscode/**",
  "**/node_modules/**",
  "**/.env",
  "**/.env.*",
  "**/*.log",
  ".wrangler/**",
  "packages/*/dist/**",
  "packages/cli/grammars/**",
  "docs/dist/**",
  "docs/.astro/**",
  "docs/.wrangler/**",
  "findings/**",
  # Files that gspot generates
  ".gspot/**",
  "**/eslint.config.mjs",
  "**/.markdownlint.jsonc",
  "**/.editorconfig",
  "**/prettier.config.mjs",
  "**/.prettierignore",
  "docs/.markdownlint.jsonc",
  "docs/.stylelintrc.json",
  "packages/cli/.markdownlint.jsonc",
  "packages/eslint-plugin/.markdownlint.jsonc",
  # Generator outputs
  "docs/worker-configuration.d.ts",
  "docs/cloudflare-env.d.ts",
  "**/*.pbxproj",
  "**/*.xcstrings",
  "**/*.svg",
  "**/*.min.js",
  "**/*.min.css",
  # Dependencies
  "**/bower_components/**",
  # Lockfiles
  "**/*.lock",
  "**/bun.lockb",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/npm-shrinkwrap.json",
  "**/go.sum",
  "**/Package.resolved",
  # Local environment files
  "**/.env*",
  # This literal supplies a deliberate misspelling to the spelling checks and their corrections.
  "tests/data/checks/spelling.ts",
]

[type]

[type.license_names]
extend-glob = ["gspot.toml"]

[type.zod_types]
extend-glob = ["shapes.ts"]

[type.gspot-settings]
extend-glob = ["gspot.toml"]

[type.gspot-settings.extend-identifiers]

[type.gspot-settings.extend-words]
axe = "axe"
optin = "optin"

[type.zod_types.extend-words]
optin = "optin"

[type.license_names.extend-words]
axe = "axe"
optin = "optin"

[type.license_names.extend-identifiers]
