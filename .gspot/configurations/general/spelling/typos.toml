[default]
locale = "en"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-words]
IIF = "IIF"
NGINX = "NGINX"
Native = "Native"
React = "React"
Simple = "Simple"
Stylelint = "Stylelint"
USAGE = "USAGE"
certifi = "certifi"
ede = "ede"
markdownlint = "markdownlint"
next-intl = "next-intl"
pytest = "pytest"
styl = "styl"
udid = "udid"
vertica = "vertica"
writeable = "writeable"
xdescribe = "xdescribe"

[files]
extend-exclude = [
  # Build output
  "**/build/**",
  # Files that gspot generates
  ".gspot/**",
  ".gspot-copies/**",
  "**/gspot.baseline.json",
  ".editorconfig",
  ".github/workflows/gspot.yml",
  ".markdownlint.jsonc",
  ".prettierignore",
  ".stylelintrc.yml",
  "eslint.config.mjs",
  "prettier.config.mjs",
  # Generator outputs
  "packages/cli/README.md",
  "docs/worker-configuration.d.ts",
  "docs/cloudflare-env.d.ts",
  "**/*.pbxproj",
  "**/*.xcstrings",
  "**/*.svg",
  "**/*.min.js",
  "**/*.min.css",
  # Paths that configurations leave out
  "**/node_modules/**",
  "**/bower_components/**",
  "**/coverage/**",
  "**/.env",
  "**/.env.*",
  "**/.dev.vars",
  "**/.dev.vars.*",
  "**/.wrangler/**",
  # Lockfiles
  "**/*.lock",
  "**/bun.lockb",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/npm-shrinkwrap.json",
  "**/go.sum",
  "**/Package.resolved",
  # This literal supplies a deliberate misspelling to the spelling checks and their corrections.
  "tests/config/setup/configurations.ts",
]
