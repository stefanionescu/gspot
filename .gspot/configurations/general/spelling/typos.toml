[default]
locale = "en"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-words]
vertica = "vertica"
axe = "axe"
optin = "optin"
IIF = "IIF"
next-intl = "next-intl"
udid = "udid"
NGINX = "NGINX"
Stylelint = "Stylelint"
markdownlint = "markdownlint"
React = "React"
Native = "Native"
Simple = "Simple"
certifi = "certifi"

[files]
extend-exclude = [
  # Build output
  "**/build/**",
  # Files that Git ignores
  "**/node_modules/**",
  "**/.env",
  "**/.env.*",
  "**/*.log",
  "packages/*/dist/**",
  "packages/cli/grammars/**",
  "docs/dist/**",
  "docs/.astro/**",
  "docs/.wrangler/**",
  "findings/**",
  # Files that gspot generates
  ".gspot/**",
  "eslint.config.mjs",
  ".markdownlint.jsonc",
  ".editorconfig",
  "prettier.config.mjs",
  ".prettierignore",
  "docs/.markdownlint.jsonc",
  "docs/.stylelintrc.json",
  "packages/cli/.markdownlint.jsonc",
  "packages/eslint-plugin/.markdownlint.jsonc",
  # Generator outputs
  "packages/cli/configurations/**/eslint-presets.json",
  "packages/cli/configurations/**/*-names.json",
  "docs/worker-configuration.d.ts",
  "docs/cloudflare-env.d.ts",
  "**/*.pbxproj",
  "**/*.xcstrings",
  "**/*.svg",
  "**/*.min.js",
  "**/*.min.css",
  # Paths that configurations leave out, such as installed dependencies and local secrets
  "**/bower_components/**",
  "**/.dev.vars",
  "**/.dev.vars.*",
  # Lockfiles
  "**/*.lock",
  "**/bun.lockb",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/npm-shrinkwrap.json",
  "**/go.sum",
  "**/Package.resolved",
  # Local environment files
  "**/.env*",
  # This literal supplies a deliberate misspelling to the spelling checks and their corrections.
  "tests/config/checks/general/spelling.ts",
]
