# Generated by gspot 0.1.0 from gspot.toml. Regenerate: gspot apply.
rules:
    - id: hardcoded-token
      pattern-regex: '(sk-[a-zA-Z0-9]{20,}|sk_live_[a-zA-Z0-9]+|sk_test_[a-zA-Z0-9]+|eyJhbGciOi[A-Za-z0-9+/=]{20,}|ghp_[a-zA-Z0-9]{36}|xoxb-[0-9]+-[a-zA-Z0-9]+|AKIA[0-9A-Z]{16})'
      message: >
          A value shaped like an access token is written in the source. Read it from the environment.
      languages: [typescript, javascript]
      severity: ERROR
      paths:
          exclude:
              - '**/tests/'
      metadata:
          cwe: ['CWE-798']
          category: security
