# Generated by gspot 0.1.0 from gspot.toml. Regenerate: gspot apply.
rules:
  - id: gspot.javascript.no-eval
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: setTimeout("...", ...)
    message: >
      Code injection risk - eval(), new Function(), and string setTimeout()
      allow arbitrary code execution. Use safer alternatives.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-94
      category: security
  - id: gspot.javascript.no-child-process-exec
    patterns:
      - pattern-either:
          - pattern: exec(...)
          - pattern: execSync(...)
    message: >
      Command injection risk - exec()/execSync() runs input through a shell. Use
      execFile() or spawn() with argument arrays instead.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-78
      category: security
  - id: gspot.javascript.no-dynamic-require
    patterns:
      - pattern-either:
          - pattern: require($VAR)
          - pattern: import($VAR)
      - pattern-not: require("...")
      - pattern-not: import("...")
    message: >
      Dynamic require/import with a variable path risks loading arbitrary
      modules. Use static imports.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-94
      category: security
  - id: gspot.javascript.ssrf-web-request-user-input
    patterns:
      - pattern-either:
          - pattern: $HTTP(req.body.$VALUE, ...)
          - pattern: $HTTP(req.query.$VALUE, ...)
          - pattern: $HTTP(req.params.$VALUE, ...)
      - metavariable-regex:
          metavariable: $HTTP
          regex: ^f[e]tch$
    message: >
      SSRF risk - web request called with a URL from user input. Validate and
      allowlist target hosts.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-918
      category: security
  - id: gspot.javascript.no-secret-in-log
    patterns:
      - pattern: $LOGGER.$LEVEL(process.env.$VAR)
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(log|trace|debug|info|warn|error|fatal)$
      - metavariable-regex:
          metavariable: $VAR
          regex: .*(KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL).*
    message: |
      Sensitive environment variable logged. Remove or mask before logging.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-532
      category: security
  - id: gspot.javascript.jwt-no-algorithm-none
    patterns:
      - pattern: jwt.verify($TOKEN, $SECRET)
      - pattern-not: |
          jwt.verify($TOKEN, $SECRET, {algorithms: ...})
    message: Require the expected JWT signing algorithms when verifying a token.
      Pass an algorithms option that matches the signing contract.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-327
      category: security
  - id: gspot.javascript.jwt-no-decode-without-verify
    pattern: jwt.decode(...)
    message: |
      jwt.decode() does not verify signatures. Use jwt.verify() instead.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-345
      category: security
  - id: gspot.javascript.no-stack-trace-in-response
    patterns:
      - pattern-either:
          - pattern: |
              res.send({..., stack: $ERR.stack, ...})
          - pattern: |
              res.json({..., stack: $ERR.stack, ...})
          - pattern: |
              res.status(...).send({..., stack: $ERR.stack, ...})
          - pattern: |
              res.status(...).json({..., stack: $ERR.stack, ...})
    message: >
      Stack traces in API responses leak internal implementation details. Log
      the stack server-side and return a generic error message.
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      cwe:
        - CWE-209
      category: security
