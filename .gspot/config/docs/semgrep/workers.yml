# Generated by gspot 0.1.0 from gspot.toml. Regenerate: gspot apply.
rules:
  - id: gspot.cloudflare.no-user-controlled-fetch
    pattern: fetch($URL.searchParams.get(...), ...)
    message: SSRF risk. Validate and allowlist outbound fetch targets.
    languages:
      - javascript
      - typescript
    severity: ERROR
    metadata:
      cwe:
        - CWE-918
      category: security
  - id: gspot.cloudflare.no-wildcard-cors-origin
    pattern-either:
      - pattern: |
          "Access-Control-Allow-Origin": "*"
      - pattern: |
          'Access-Control-Allow-Origin': '*'
      - pattern: $HEADERS.set("Access-Control-Allow-Origin", "*")
      - pattern: $HEADERS.append("Access-Control-Allow-Origin", "*")
    message: Cloudflare middleware must not send wildcard CORS origins.
    languages:
      - javascript
      - typescript
    severity: ERROR
