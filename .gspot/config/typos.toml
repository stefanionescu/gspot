[default]
locale = "en-us"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-identifiers]
capitalisation = "capitalisation"
IIF = "IIF"
LICENCE = "LICENCE"
next-intl = "next-intl"
udid = "udid"
NGINX = "NGINX"
Stylelint = "Stylelint"
markdownlint = "markdownlint"
React = "React"
Native = "Native"
Simple = "Simple"
Icons = "Icons"

[default.extend-words]
capitalisation = "capitalisation"
IIF = "IIF"
LICENCE = "LICENCE"
next-intl = "next-intl"
udid = "udid"
NGINX = "NGINX"
Stylelint = "Stylelint"
markdownlint = "markdownlint"
React = "React"
Native = "Native"
Simple = "Simple"
Icons = "Icons"

[files]
extend-exclude = ["*.lock", "bun.lockb", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "Package.resolved", "*.pbxproj", "*.xcstrings", "*.svg", "*.min.js", "*.min.css", ".gspot/config/vale/", "tests/data/checks/spelling.ts", ".gspot/**", "**/node_modules/**", "**/bower_components/**", "docs/worker-configuration.d.ts", "bun.lock", "npm-shrinkwrap.json"]

[type]

[type.license_names]
extend-glob = ["gspot.toml"]

[type.zod_types]
extend-glob = ["shapes.ts"]

[type.gspot-settings]
extend-glob = ["gspot.toml"]

[type.gspot-settings.extend-identifiers]

[type.gspot-settings.extend-words]
axe = "axe"
optin = "optin"

[type.zod_types.extend-words]
optin = "optin"

[type.license_names.extend-words]
axe = "axe"
optin = "optin"

[type.license_names.extend-identifiers]
