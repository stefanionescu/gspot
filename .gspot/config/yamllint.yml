rules:
  anchors: {}
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  colons: {}
  commas: {}
  comments:
    min-spaces-from-content: 1
  comments-indentation: {}
  empty-lines: {}
  hyphens: {}
  indentation:
    spaces: consistent
    indent-sequences: consistent
  key-duplicates: {}
  new-line-at-end-of-file: {}
  new-lines: {}
  trailing-spaces: {}
  truthy:
    check-keys: false
