# Vale reads several StylesPath lines in order and installs packages in the last folder.
StylesPath = vale/styles
StylesPath = ../vale
MinAlertLevel = suggestion
SkippedScopes = script, style, pre, figure, table
Packages = Google, write-good, proselint, alex, Harper
Vocab = words

[formats]
ts = md
tsx = md
js = md
jsx = md
swift = md
py = md
css = md
sh = py
bash = py
zsh = py
sql = lua
pgsql = lua
psql = lua

[*]
BasedOnStyles = gspot, Vale, Google, write-good, proselint, alex, Harper
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (eslint-(?:disable|enable)(?:-next-line|-line)?\s+[^\n]*?--\s*(?:reason:\s*)?), (https?://[^\s)]+), (@(?:param|template|typedef)\s+(?:\{[^}\n]*\}\s+)?(?:\[[^\]\n]*\]|\S+)), (@(?:returns?|throws|type|see|example|deprecated)\b(?:\s+\{[^}\n]*\})?)
# typos owns spelling
Vale.Spelling = NO
# typos owns spelling
Google.Spelling = NO
# typos owns spelling
Harper.Spelling = NO
# gspot.contractions holds the contractions rule
Google.Contractions = NO
# gspot.heading-case owns heading case
Google.Headings = NO
# gspot.acronyms owns acronyms
Google.Acronyms = NO
# it flags execute, kill and abort, which are the words for those actions
alex.ProfanityUnlikely = NO
# config is the common abbreviation for configuration in file and folder names
Harper.ExpandConfiguration = NO
# the vocabulary accepts spellings; it does not fix case, because configuration ids are the lowercase tool names
Vale.Terms = NO
# it flags validate, multiple and it is, which are plain words
write-good.TooWordy = NO
# gspot.hedging owns hedges; this flags several and tiny
write-good.Weasel = NO
# Google product terminology: command-line tool for CLI
Google.WordList = NO
# it lowercases acronyms after a colon
Google.Colons = NO
# guarantee is a technical word for what a check makes certain
Google.ExcessiveClaims = NO
# gspot.future owns the future tense
Google.Will = NO
# gspot.history owns time words
Google.Timeless = NO
# camel case is the name of the case
Google.Jargon = NO
# it flags disabled, as in a disabled rule
alex.Ablist = NO
# swallow, trap and abuse are what code does to errors, signals and inputs
alex.ProfanityMaybe = NO
# looser is a comparative
alex.ProfanityLikely = NO
# primitive is a type
alex.Race = NO
# a process hangs
alex.Suicide = NO
# three dots stay ASCII
proselint.Typography = NO
# oversized and extensible are the words
proselint.Needless = NO
# MB and GB are the units
Harper.ExpandMemoryShorthands = NO
# it reports that an inflected form exists, which is not an error
Harper.MoreAdjective2 = NO
# it reports that an inflected form exists, which is not an error
Harper.MoreAdjective4 = NO
# gspot.semicolons holds the semicolon rule
Google.Semicolons = NO
# Google product terminology: command-line tool for CLI
Google.WordListCase = NO
# OK names a successful status and a button action
Harper.OkToOkay = NO
# Markup checks read markup only.
gspot.merge-conflict-markers = NO

[*.{md,mdx,html,htm,astro,svelte,vue}]
gspot.alt-text = YES
gspot.merge-conflict-markers = YES
