[preset]
name = "nestjs"
kind = "framework"
title = "NestJS"
requires = ["typescript"]
recommends = ["vitest", "security", "dependencies"]
description = "A NestJS service: the compiler options decorators need, decorated classes that lint cleanly, controllers that reach data through a service, and no circular modules."

[detect]
dependencies = ["@nestjs/core"]
filenames = ["nest-cli.json"]

[claims]
filenames = ["nest-cli.json"]
natures = ["source"]

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/eslint.config.mjs"
fragment = true

[rule_files]
framework = ["framework/nestjs/NESTJS.md"]

[required_rules]
ts = ["@typescript-eslint/no-extraneous-class", "no-restricted-syntax"]
