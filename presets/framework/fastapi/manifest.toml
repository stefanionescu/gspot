[preset]
name = "fastapi"
kind = "framework"
title = "FastAPI"
requires = ["python"]
recommends = ["security", "pytest"]
description = "A FastAPI service: the FastAPI and async rules of Ruff, and no blocking call inside an async function. The OpenAPI document lints and matches the app, and Semgrep reads the request handling."

[detect]
dependencies = ["fastapi"]

[[tools]]
name = "spectral"
version = "6.15.0"
npm = "@stoplight/spectral-cli"
mise = "npm:@stoplight/spectral-cli"

[[configs]]
template = "spectral.yaml.tmpl"
target = ".gspot/spectral.yaml"

[[configs]]
template = "semgrep-fastapi.yml.tmpl"
target = ".gspot/semgrep/fastapi.yml"
rules_path = ["rules"]
needs = "security"

[[checks]]
name = "fastapi/openapi-lint"
example = "An OpenAPI document whose operation references an undefined schema reports a validation finding. Define the schema or correct the reference in the source that produces the document, then regenerate it."
level = "recommended"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "openapi-lint"
tool = "spectral"
claims = {extensions = [".yaml", ".yml", ".json"]}
coverage = ["style"]
summary = "Lints the OpenAPI document named in tools.openapi.document with the Spectral OpenAPI rules."
why = "Clients are written from this document, so an operation with no id becomes somebody's broken client."
help = "Change the route metadata that writes the document, then export it again."

[[checks]]
name = "fastapi/openapi-fresh"
example = "A committed OpenAPI document that differs from the configured generator output reports drift. Run the declared generator, inspect the changed document, and retain the corrected output before rerunning."
level = "recommended"
stage = "push"
runs = "once"
engine = "integrity"
analysis = "openapi-fresh"
coverage = ["consistency"]
summary = "Runs the command in tools.openapi.produced_by and fails when it changes the document."
why = "A committed document that lags the routes describes a service that does not exist."
help = "Run the command and commit the document it writes."

[[checks]]
name = "fastapi/no-blocking-io-in-async"
example = "An `async def` function calling `time.sleep(1)` blocks the event loop and reports a finding. Import `asyncio` and use `await asyncio.sleep(1)` for an asynchronous delay."
level = "recommended"
stage = "commit"
engine = "integrity"
analysis = "python-blocking-calls"
claims = {extensions = [".py"]}
coverage = ["structure"]
summary = "Refuses time.sleep, the requests library, and a plain open inside an async function."
why = "A blocking call inside an async function stops the event loop, so every other request waits for it."
help = "Use asyncio.sleep, an async HTTP client, or run the call in a worker thread."

[[settings]]
name = "tools.openapi.document"
kind = "string"
direction = "neutral"
default = ""
summary = "The committed OpenAPI document; empty turns both OpenAPI checks off."

[[settings]]
name = "tools.openapi.produced_by"
kind = "string"
direction = "neutral"
default = ""
summary = "The command that writes the OpenAPI document from the code."

[rule_files]
framework = ["framework/fastapi/FASTAPI.md", "framework/fastapi/RUNTIME.md"]
shared = ["shared/http/HTTP.md"]
