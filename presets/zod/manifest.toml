[preset]
name = "zod"
kind = "library"
title = "Zod"
requires = ["javascript"]
description = "Zod schemas: the schema rules of ESLint, so a schema says what it accepts and rejects the rest."

[detect]
dependencies = ["zod"]

[[tools]]
name = "eslint-plugin-zod"
kind = "library"
version = "4.12.0"
npm = "eslint-plugin-zod"

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/eslint.config.mjs"
fragment = true

[rule_files]
library = ["library/zod/ZOD.md"]
