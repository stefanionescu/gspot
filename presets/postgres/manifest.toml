[preset]
id = "postgres"
kind = "database"
title = "Postgres"
requires = ["sql"]
description = "Postgres migrations: squawk for the changes that lock or break, ordered versions, and migrations that never change after they run. The schema checks ask for row security, explicit grants, and an index under every foreign key."

[detect]
paths = ["supabase/migrations/*.sql", "db/migrations/*.sql", "migrations/*.sql", "**/supabase/migrations/*.sql"]

[claims]
paths = ["supabase/migrations/*.sql", "db/migrations/*.sql", "migrations/*.sql", "**/supabase/migrations/*.sql"]
natures = ["source"]

[[tools]]
name = "squawk"
version = "2.64.0"
floor = "2.0.0"
mise = "github:sbdchd/squawk"
npm = "squawk-cli"
github = "sbdchd/squawk"

[[configs]]
template = "squawk.toml.tmpl"
target = ".gspot/squawk.toml"

[[checks]]
id = "postgres/squawk"
stage = "commit"
command = ["squawk", "--config", "{config:squawk}", "--reporter", "json", "{files}"]
inspection = ["security"]
output = {format = "json", line_base = 0, fields = {file = "file", line = "line", column = "column", rule = "rule_name", message = "message"}}
summary = "Reads every migration for the change that locks a table, rewrites it, or breaks the running application."
why = "A migration that takes an exclusive lock on a large table stops the application for as long as it runs."
fix = "Follow the help squawk prints for the rule. Turn one rule off with gspot ignore postgres/squawk --rule <name> --reason."

[[checks]]
id = "postgres/migration-order"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-order"
inspection = ["consistency"]
summary = "Checks that every migration has a version, that no two share one, and that a new migration sorts after the committed ones."
why = "A migration that sorts before one already applied never runs on the databases that are ahead of it."
fix = "Rename the new migration with a version later than the newest committed one."

[[checks]]
id = "postgres/migrations-frozen"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-frozen"
inspection = ["consistency"]
summary = "Checks that no migration at or before tools.squawk.frozen_through differs from its committed text."
why = "A migration that ran never runs again, so an edit to it changes new databases only and the environments drift apart."
fix = "Restore the file with git checkout, and write the change as a new migration."

[[checks]]
id = "postgres/rls-present"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-rls"
inspection = ["security"]
summary = "Checks that every table in a client schema enables row level security and has a policy in some migration."
why = "A table in an exposed schema with no row security is readable and writable by every client that holds the public key."
fix = "Enable row level security on the table, and add its policies in the same or a later migration."

[[checks]]
id = "postgres/explicit-grants"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-grants"
inspection = ["security"]
summary = "Refuses a grant of every privilege in a migration."
why = "Granting everything includes truncating the table, adding triggers, and every privilege a later Postgres adds, which nobody meant to give."
fix = "Name the privileges the role needs, such as `SELECT` alone."

[[checks]]
id = "postgres/security-definer-search-path"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-definer"
inspection = ["security"]
summary = "Checks that every SECURITY DEFINER function sets its search_path."
why = "A definer function runs with its owner's rights, and a caller who controls the search path chooses the objects it touches."
fix = "Give the function an empty `search_path` in its definition, and qualify every name inside it."

[[checks]]
id = "postgres/index-covers-foreign-key"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-foreign-keys"
inspection = ["structure"]
summary = "Checks that an index, a primary key, or a unique key leads with every foreign key column."
why = "Deleting a parent row scans the whole child table when the foreign key has no index."
fix = "Create an index that starts with the foreign key column."

[[checks]]
id = "postgres/migration-docs"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "postgres-docs"
inspection = ["prose"]
summary = "Checks the documented migration layout when tools.postgres.migration_docs asks for it: a boxed header, boxed sections, and a labeled block above each table and function."
why = "A migration is read years later by someone deciding whether a table can go, and the purpose line is what they look for."
fix = "Write the header, put each statement under its section, and label tables and functions with their purpose."

[[settings]]
name = "tools.squawk.assume_in_transaction"
kind = "boolean"
direction = "neutral"
default = false
summary = "Whether the migration runner wraps every migration in a transaction; the supabase preset turns it on."

[[settings]]
name = "tools.squawk.frozen_through"
kind = "string"
direction = "neutral"
default = "none"
summary = "The version through which migrations have run everywhere: none, all, or a version. Squawk skips them, and they may not change."

[[settings]]
name = "tools.postgres.migrations_dir"
kind = "string"
direction = "neutral"
default = ""
summary = "The migrations folder; empty searches supabase/migrations, db/migrations, and migrations."

[[settings]]
name = "tools.postgres.client_schemas"
kind = "list"
direction = "tightening"
default = ["public"]
summary = "The schemas clients reach, where every table needs row level security."

[[settings]]
name = "tools.postgres.migration_docs"
kind = "boolean"
direction = "tightening"
default = false
summary = "Whether migrations follow the documented layout."

[[settings]]
name = "tools.postgres.doc_sections"
kind = "list"
direction = "neutral"
default = ["Schema", "Tables", "Indexes", "Functions", "Triggers", "Extensions", "Row Level Security", "Grants"]
summary = "The section names a documented migration may box."

[rule_files]
database = ["database/postgres/POSTGRES.md"]
