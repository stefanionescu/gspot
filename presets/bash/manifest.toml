[preset]
name = "bash"
kind = "language"
title = "Bash"
requires = ["structure"]
recommends = ["naming", "formatting", "spelling"]
description = "Shell scripts, hooks and task files: ShellCheck, shfmt, a syntax pass, and the structure rules for shell."

[detect]
extensions = [".sh", ".bash", ".zsh", ".bats"]
shebangs = ["shell"]

[claims]
extensions = [".sh", ".bash", ".zsh", ".bats"]
tags = ["shebang:shell"]

[[tools]]
name = "shellcheck"
version = "0.11.0"
mise = "shellcheck"
brew = "shellcheck"
apt = "shellcheck"
winget = "koalaman.shellcheck"
scoop = "shellcheck"
github = {name = "koalaman/shellcheck", version = "v0.11.0"}

[[tools]]
name = "shfmt"
version = "3.12.0"
mise = "shfmt"
brew = "shfmt"
winget = "mvdan.shfmt"
scoop = "shfmt"
github = {name = "mvdan/sh", version = "v3.12.0"}

[[tools]]
name = "bash"
provider = "host"

[[tools]]
name = "zsh"
provider = "host"

[[tools]]
name = "bats"
provider = "host"

[[configs]]
template = "shellcheckrc.tmpl"
target = ".gspot/shellcheckrc"
stub = {path = ".shellcheckrc", copy = true}

[[checks]]
name = "bash/syntax"
stage = "commit"
runs = "per-file-list"
command = ["bash", "-n", "{file}"]
claims = {tags = ["bash"]}
coverage = ["syntax"]
output = {format = "regex", pattern = "^(?<file>[^:]+): line (?<line>\\d+): (?<message>.*)$"}
summary = "Checks that Bash scripts parse before running them."
why = "A script with a syntax error stops at the broken line, sometimes after it has already done half its work."
help = "Open the file at the line bash names and fix the quoting, bracket, or keyword it complains about."

[[checks]]
name = "bash/zsh-syntax"
stage = "commit"
runs = "per-file-list"
command = ["zsh", "-n", "{file}"]
claims = {tags = ["zsh"]}
coverage = ["syntax"]
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):\\s*(?<message>.*)$"}
summary = "Checks Zsh syntax with the Zsh interpreter."
why = "Zsh syntax differs from Bash, so a Bash parser rejects valid Zsh programs."
help = "Fix the syntax at the line Zsh reports. Install zsh when the command is missing."

[[checks]]
name = "bash/bats-syntax"
stage = "commit"
runs = "per-file-list"
command = ["bats", "--count", "{file}"]
claims = {tags = ["bats"]}
coverage = ["syntax"]
output = {format = "regex", pattern = "^# (?<file>[^:]+): line (?<line>\\d+): (?<message>.*)$"}
summary = "Parses Bats test files while counting their test cases."
why = "Bats test declarations need the Bats parser before Bash can read them."
help = "Fix the syntax reported by Bats. Install bats-core when the command is missing."

[[checks]]
name = "bash/shellcheck"
stage = "commit"
runs = "per-file-list"
claims = {tags = ["bash", "bats"]}
command = ["shellcheck", "--rcfile", "{config:shellcheckrc}", "--severity=style", "--check-sourced", "--format=gcc", "{files}"]
coverage = ["style", "security"]
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<column>\\d+): (?:note|warning|error|style): (?<message>.*?) \\[(?<rule>SC\\d+)\\]$"}
summary = "Runs ShellCheck with every rule on, over every shell script, and the files they source."
why = "ShellCheck catches the quoting, globbing and exit-status mistakes that make shell scripts fail on the one input nobody tested."
help = "Read the SC code in the finding; gspot explain shellcheck/SC2086 links to its page. Turn one code off with gspot ignore bash/shellcheck --rule SC2086 --reason."

[[checks]]
name = "bash/shfmt"
stage = "commit"
runs = "per-file-list"
claims = {tags = ["bash", "bats"]}
command = ["shfmt", "-d", "-i", "{indent}", "-ci", "-s", "{files}"]
fix_command = ["shfmt", "-w", "-i", "{indent}", "-ci", "-s", "{files}"]
fix_order = "format"
coverage = ["format"]
output = {format = "regex", pattern = "^--- (?<file>[^\\s]+)\\.orig$", message = "This script is not formatted the way shfmt formats it."}
summary = "Checks that every shell script is formatted the way shfmt formats it."
why = "One formatter means diffs show what changed, not how someone's editor indents."
help = "Run gspot check --fix to format every script, or shfmt -w on one file."

[[checks]]
name = "structure/bash-interpreter"
stage = "commit"
engine = "structure"
analysis = "bash-interpreter"
coverage = ["structure"]
searched = ["shellcheck", "shfmt", "bashate"]
summary = "Checks the contract every Bash script keeps: the four-line header, strict mode, one main called last, readonly constants, declarative libraries, cleaned-up temporary files."
why = "A script that skips strict mode or hides its runtime fails on the machine where it matters, silently."
help = "Open with the shebang, a bare #, one line saying what the script does, and the Runtime line. Run set -euo pipefail first; add shopt -s inherit_errexit when the declared minimum is Bash 4.4+. End an executable with a call to main."

[[checks]]
name = "structure/doc-comment"
stage = "commit"
engine = "structure"
analysis = "doc-comment"
coverage = ["structure", "prose"]
searched = ["shellcheck", "bashdoc", "shdoc"]
summary = "Checks that every shell function announces itself in a comment above it that says more than its name."
why = "A function with no summary makes the reader run it in their head; a vague summary is a summary nobody will trust."
help = "Write \"# name: what it does\" above the function; when it carries doc sections, keep Globals, Arguments, Outputs, Returns in that order."

[[checks]]
name = "structure/duplicate-functions"
stage = "commit"
engine = "structure"
analysis = "duplicate-functions"
limit = "limits.bash.duplicate_min_lines"
coverage = ["structure"]
searched = ["jscpd", "shellcheck"]
summary = "Finds shell functions with the same body in the same scope."
why = "Two copies drift apart; the fix lands in one and the bug stays in the other."
help = "Keep one function and call it from both places."

[[checks]]
name = "structure/unused-functions"
stage = "commit"
engine = "structure"
analysis = "unused-functions"
coverage = ["structure"]
searched = ["shellcheck SC2329", "knip"]
summary = "Finds shell functions no script in the scope calls."
why = "Dead code is read and maintained for nobody."
help = "Delete the function, or mark a hook entry point with lint:allow-unused-function <name> and say why."

[[checks]]
name = "structure/dead-parameters"
stage = "commit"
engine = "structure"
analysis = "dead-parameters"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Finds shell functions called with arguments they never read."
why = "An argument the callee ignores is a promise the call site believes in."
help = "Read the argument in the function, or drop it from every call."

[[checks]]
name = "structure/private-prefix"
stage = "commit"
engine = "structure"
analysis = "private-prefix"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Checks that a shell function no other file calls starts with an underscore, and that an underscore function is not called from outside."
why = "The underscore tells a reader what the file publishes without reading every caller."
help = "Rename the function with a leading underscore, or drop the underscore when another file calls it."

[[checks]]
name = "structure/private-before-public"
stage = "commit"
engine = "structure"
analysis = "private-before-public"
coverage = ["structure"]
searched = ["shfmt", "shellcheck"]
summary = "Checks that underscore functions come before the public ones and main comes last."
why = "A file read top to bottom then explains its helpers before it uses them and ends where it starts."
help = "Move the private functions above the public ones and main to the end."

[[checks]]
name = "structure/trivial-function"
stage = "commit"
engine = "structure"
analysis = "trivial-function"
limit = "limits.trivial_statements"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Finds a shell function used once whose body fits the trivial ceiling."
why = "A name for two lines used once hides the two lines and adds a jump."
help = "Inline the body at its one call, or mark the function with lint:allow-trivial-function <name> and say why."

[[checks]]
name = "structure/call-through"
stage = "commit"
engine = "structure"
analysis = "call-through"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Finds a shell function whose whole body forwards its arguments to one command."
why = "A forwarding function is a second name for the command it wraps."
help = "Call the command directly, or allow the function with a reason under structure.call_through_allowed."

[[checks]]
name = "structure/file-length"
stage = "commit"
engine = "structure"
analysis = "file-length"
limit = "limits.bash.file_lines"
coverage = ["structure"]
searched = ["shellcheck", "shfmt"]
summary = "Checks that no shell script has more code lines than the ceiling."
why = "A long script holds more than one job; split it by the job."
help = "Split the script, or raise limits.bash.file_lines with a reason."

[[checks]]
name = "structure/function-length"
stage = "commit"
engine = "structure"
analysis = "function-length"
limit = "limits.bash.function_lines"
coverage = ["structure"]
searched = ["shellcheck", "shfmt"]
summary = "Checks that no shell function has more code lines than the ceiling."
why = "A long function does more than its name says."
help = "Split the function, or raise limits.bash.function_lines with a reason."

[[checks]]
name = "structure/bash-script-policy"
stage = "commit"
engine = "structure"
analysis = "bash-script-policy"
coverage = ["structure"]
searched = ["shellcheck", "semgrep"]
summary = "Finds forwarding wrappers, compatibility aliases, and inline Node in shell scripts."
why = "A wrapper is a second entry point that drifts from the first; inline Node is a second language nobody lints."
help = "Call the target script directly, delete the alias, and move the Node code into a .js file."

[[checks]]
name = "structure/bash-embeds"
stage = "commit"
engine = "structure"
analysis = "bash-embeds"
coverage = ["structure"]
searched = ["shellcheck", "semgrep"]
summary = "Finds inline Python, Node and generated-script heredocs in shell scripts."
why = "Code inside a heredoc is checked by nothing."
help = "Move the embedded code into its own file and run that."

[[checks]]
name = "structure/bash-ssh-blocks"
stage = "commit"
engine = "structure"
analysis = "bash-ssh-blocks"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Checks that multi-line ssh blocks are named, documented, and inside a function."
why = "A remote command block with no name is the hardest thing in a script to test or reuse."
help = "Move the block into a named function and write \"# name - what it does\" above it."

[[checks]]
name = "structure/bash-config-defaults"
stage = "commit"
engine = "structure"
analysis = "bash-config-defaults"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Finds variable defaults of the form name:-value outside the configuration owners."
why = "A default set in three places is three settings with one name."
help = "Set the default in a configuration owner named under tools.bash.config_owners and read the variable everywhere else."

[[checks]]
name = "structure/bash-config-guards"
stage = "commit"
engine = "structure"
analysis = "bash-config-guards"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Checks that every configuration owner opens with one include guard nobody else uses."
why = "A configuration file sourced twice runs its side effects twice."
help = "Open the owner with [[ -n ${_CFG_NAME_READY:-} ]] && return 0 and then readonly _CFG_NAME_READY=1."

[[checks]]
name = "structure/bash-boundaries"
stage = "commit"
engine = "structure"
analysis = "bash-boundaries"
coverage = ["structure"]
searched = ["shellcheck source="]
summary = "Checks that scripts under the architecture roots declare their boundary and source what they call."
why = "A script that works only because another file was sourced first breaks when the order changes."
help = "Add a Boundary line to the header comment, annotate every source with # shellcheck source=, and source the file a function comes from."

[[checks]]
name = "structure/env-access-owner"
stage = "commit"
engine = "structure"
analysis = "env-access-owner"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Checks that environment variables the owner declares are read elsewhere only through it."
why = "When any script reads the environment, nobody can list what the program needs to run; one owner can."
help = "Read the variable in the owner named under architecture.roles.env and pass the value in."

[[checks]]
name = "structure/bash-branches"
stage = "commit"
engine = "structure"
analysis = "bash-branches"
limit = "limits.bash.function_branches"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Counts the branches in each shell function against the ceiling."
why = "A function with many branches is several functions with one name."
help = "Split the function by branch, or raise limits.bash.function_branches with a reason."

[[checks]]
name = "structure/bash-nesting"
stage = "commit"
engine = "structure"
analysis = "bash-nesting"
limit = "limits.bash.function_nesting"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Measures how deep control flow nests in each shell function against the ceiling."
why = "Deep nesting is the shape of code nobody can hold in their head."
help = "Return early or split the inner block into a function, or raise limits.bash.function_nesting with a reason."

[[checks]]
name = "structure/bash-mutable-assignments"
stage = "commit"
engine = "structure"
analysis = "bash-mutable-assignments"
limit = "limits.bash.mutable_assignments"
coverage = ["structure"]
searched = ["shellcheck"]
summary = "Counts the variable assignments in each shell function against the ceiling."
why = "A function that reassigns many variables is tracking state a reader cannot follow."
help = "Split the function, or raise limits.bash.mutable_assignments with a reason."

[[checks]]
name = "structure/bash-safety"
stage = "commit"
engine = "structure"
analysis = "bash-safety"
coverage = ["structure", "security"]
searched = ["shellcheck", "semgrep"]
summary = "Finds discarded failures, broad process kills, recursive deletes outside their owners, unchecked cd, and sourced state files."
why = "Each of these is a way a script destroys something it did not mean to and says nothing."
help = "Handle the failure, check the cd, and move the delete or kill into a script named under tools.bash.safety.owners."

[[settings]]
name = "tools.bash.doc_style"
kind = "string"
direction = "neutral"
default = "colon"
summary = "How a shell function announces itself: colon means a header line like `# name: what it does`."

[[settings]]
name = "tools.bash.config_owners"
kind = "list"
direction = "loosening"
default = []
summary = "The scripts allowed to read environment variables with defaults; every other script reads them through these."

[[settings]]
name = "tools.bash.architecture_roots"
kind = "list"
direction = "neutral"
default = []
summary = "The directories whose scripts carry a Boundary header and source annotations."

[[settings]]
name = "tools.bash.safety.owners"
kind = "list"
direction = "loosening"
default = []
summary = "The scripts allowed to delete recursively or kill processes; everything else is refused."

[[settings]]
name = "tools.bash.default_fragments_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Variable defaults of the form name:-value that appear outside the configuration owners."

[[settings]]
name = "tools.bash.runtime_header"
kind = "string"
direction = "neutral"
default = "macOS and Linux"
summary = "The platforms the fourth header line of every script names."

[coverage]
".zsh" = ["syntax"]
".bats" = ["syntax", "style", "format"]
".sh" = ["format", "syntax", "style", "structure", "naming", "prose", "spelling"]
".bash" = ["format", "syntax", "style", "structure", "naming", "prose", "spelling"]

[rule_files]
language = ["language/BASH.md", "language/bash/LANGUAGE.md", "language/bash/SAFETY.md", "language/bash/OPERATIONS.md", "language/naming/BASH.md"]
