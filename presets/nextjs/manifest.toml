[preset]
id = "nextjs"
kind = "framework"
title = "Next.js"
requires = ["typescript"]
recommends = ["css", "config-files"]
description = "A Next.js app: the framework and hooks rules of ESLint, and server code marked as server only. Route segments serve one thing, the configuration turns no build check off, and message files parse."

[detect]
dependencies = ["next"]

[claims]
paths = ["**/next.config.js", "**/next.config.mjs", "**/next.config.ts", "next.config.js", "next.config.mjs", "next.config.ts"]
natures = ["source"]

[[tools]]
name = "@next/eslint-plugin-next"
kind = "library"
version = "15.5.4"
npm = "@next/eslint-plugin-next"

[[tools]]
name = "eslint-plugin-react-hooks"
kind = "library"
version = "6.1.1"
npm = "eslint-plugin-react-hooks"

[[tools]]
name = "eslint-plugin-react"
kind = "library"
version = "7.37.5"
npm = "eslint-plugin-react"

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/eslint.config.mjs"
fragment = true

[[checks]]
id = "integrity/route-segments"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "next-route-segments"
inspection = ["structure"]
summary = "Checks that no route segment holds both a page and a route handler."
why = "One address is served by one file, and the framework refuses the build when a segment holds two."
fix = "Move the route handler into a segment of its own, such as an api folder."

[[checks]]
id = "integrity/next-config"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "next-config"
inspection = ["security"]
summary = "Checks that the framework configuration turns no build check off and puts no secret into the client environment."
why = "A build that ignores lint and type errors ships them, and a key under env is readable by every visitor."
fix = "Remove the switch, and read the secret on the server."

[[checks]]
id = "integrity/dependency-alignment"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "dependency-alignment"
inspection = ["consistency"]
summary = "Checks that packages that ship together sit on one version: the framework with its lint package, and react with react-dom."
why = "A lint package a version behind flags what the framework allows and allows what it removed."
fix = "Move both packages to the same version."

[[checks]]
id = "integrity/locales"
stage = "push"
runs = "once"
engine = "integrity"
analysis = "locale-files"
inspection = ["consistency"]
summary = "Checks the message files under tools.next.translations: each message parses, none is empty, no key holds a dot, and every locale holds every key of the base."
why = "A message that does not parse throws when its screen renders, in the one language nobody on the team reads."
fix = "Correct the message, or add the missing key to the locale."

[[settings]]
name = "tools.next.translations"
kind = "table"
direction = "neutral"
summary = "Where the message files live and which locale is the base: directory and base."

[rule_files]
framework = ["framework/nextjs/NEXTJS.md", "framework/react/REACT.md"]
