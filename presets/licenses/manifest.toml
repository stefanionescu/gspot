[preset]
id = "licenses"
kind = "concern"
title = "Licenses"
proposed = true
description = "Every installed dependency reports a license from the allowed list, or carries an exception that names the license it reports."

[detect]
filenames = ["package.json"]

[claims]
filenames = ["package.json"]

[[tools]]
name = "license-checker-rseidelsohn"
version = "5.0.1"
npm = "license-checker-rseidelsohn"
mise = "npm:license-checker-rseidelsohn"

[[checks]]
id = "licenses/npm"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "licenses-npm"
claims = {filenames = ["package.json"]}
inspection = ["licenses"]
summary = "Compares the license every installed npm package reports with the allowed list and the exceptions."
why = "A license the project cannot accept arrives silently with a transitive dependency."
help = "Replace the package, or record it with gspot allow licenses <name@version> --license <id> --reason. An exception holds only while the package reports that license."

[[settings]]
name = "tools.licenses.allow"
kind = "list"
direction = "neutral"
default = ["MIT", "MIT-0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Unlicense", "BlueOak-1.0.0", "Python-2.0"]
summary = "The SPDX license ids a dependency may report."

[[settings]]
name = "tools.licenses.exceptions"
kind = "list"
direction = "loosening"
default = []
summary = "Packages accepted under a license outside the list: name@version, the license it reports, and the reason."
