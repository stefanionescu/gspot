[preset]
id = "vitest"
kind = "tool"
title = "Vitest"
requires = ["javascript"]
description = "Vitest test files: the test rules of ESLint over them, and coverage thresholds at push."

[detect]
dependencies = ["vitest"]

[claims]
paths = ["**/vitest.config.*", "**/vitest.workspace.*"]
natures = ["source"]

[[tools]]
name = "vitest"
version = "3.2.4"
floor = "2.0.0"
npm = "vitest"

[[tools]]
name = "@vitest/eslint-plugin"
kind = "library"
version = "1.3.4"
npm = "@vitest/eslint-plugin"

[[tools]]
name = "@vitest/coverage-v8"
kind = "library"
version = "3.2.4"
npm = "@vitest/coverage-v8"

[[checks]]
id = "vitest/coverage"
stage = "push"
runs = "per-scope"
cwd = "scope"
command = ["vitest", "run", "--coverage", "--coverage.reporter=text-summary", "--coverage.thresholds.lines={setting:tools.vitest.coverage_lines}", "--coverage.thresholds.branches={setting:tools.vitest.coverage_branches}", "--coverage.thresholds.functions={setting:tools.vitest.coverage_functions}", "--coverage.thresholds.statements={setting:tools.vitest.coverage_statements}"]
claims = {extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs"]}
inspection = ["tests"]
output = {format = "regex", pattern = "^ERROR: (?<message>Coverage for .*)$"}
summary = "Runs the test suite with coverage, and fails when lines, branches, functions, or statements fall under their floors."
why = "A floor keeps new code from arriving untested, which is when its behavior is cheapest to pin down."
fix = "Add tests for the code the coverage report shows uncovered, or lower one floor under tools.vitest with a reason."

[[settings]]
name = "tools.vitest.coverage_lines"
kind = "number"
direction = "floor"
default = 80
summary = "The smallest share of lines the tests cover, out of 100."

[[settings]]
name = "tools.vitest.coverage_branches"
kind = "number"
direction = "floor"
default = 80
summary = "The smallest share of branches the tests cover, out of 100."

[[settings]]
name = "tools.vitest.coverage_functions"
kind = "number"
direction = "floor"
default = 80
summary = "The smallest share of functions the tests cover, out of 100."

[[settings]]
name = "tools.vitest.coverage_statements"
kind = "number"
direction = "floor"
default = 80
summary = "The smallest share of statements the tests cover, out of 100."

[[settings]]
name = "tools.vitest.harness_dir"
kind = "string"
direction = "neutral"
default = "tests/support"
summary = "The folder that holds test support code, which test files import and source files never do."

[rule_files]
tool = ["tool/vitest/VITEST.md"]
general = ["general/code/TESTING.md"]
