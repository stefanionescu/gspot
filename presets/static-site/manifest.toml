[preset]
name = "static-site"
kind = "concern"
title = "Static Site"
requires = ["html", "css", "javascript"]
description = "A site built to a folder and served as files: the build, its output, its links, its weight, its sitemap, and its headers."

[detect]
paths = ["_headers", "_redirects", "site.webmanifest", "sitemap.xml"]

[claims]
filenames = ["_headers", "_redirects", "site.webmanifest", "sitemap.xml", "robots.txt"]
extensions = [".svg"]
natures = ["source"]

[[tools]]
name = "linkinator"
version = "6.1.4"
npm = "linkinator"

[[tools]]
name = "svgo"
version = "4.1.0"
npm = "svgo"

[[tools]]
name = "purgecss"
version = "7.0.2"
npm = "purgecss"

[[checks]]
name = "static-site/build"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-build"
inspection = ["build"]
summary = "Runs the build command of the site and fails when it fails or writes no output folder."
why = "Every other output check reads what the build wrote, so a broken build hides all of them."
help = "Run the build command by hand and fix what it prints. Name the command under tools.site.build."

[[checks]]
name = "static-site/build-reproducible"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-build-reproducible"
inspection = ["consistency"]
summary = "Builds the site twice and compares the two outputs file by file."
why = "A build that differs from run to run cannot be cached, compared, or trusted to hold what was reviewed."
help = "Take the timestamp, the random value, or the unordered list out of the build."

[[checks]]
name = "static-site/html-validate-built"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-built-markup"
inspection = ["accessibility"]
summary = "Validates every built page with html-validate."
why = "Templates can each be valid and still join into a page with two main elements or a missing label."
help = "Fix the template or the content that writes the markup the rule names."

[[checks]]
name = "css/dead-selectors"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-dead-selectors"
inspection = ["structure"]
summary = "Finds selectors of the built stylesheets that no built page or script uses."
why = "A selector nobody uses is downloaded by every visitor and read by every maintainer."
help = "Delete the rule, or list a name a script adds at run time under tools.purgecss.safelist with a reason."

[[checks]]
name = "static-site/links-internal"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-links-internal"
inspection = ["consistency"]
summary = "Serves the built site and follows every link between its pages, stylesheets, and fragments."
why = "A broken internal link is a dead end a visitor finds before the author does."
help = "Fix the link, or the page it points at."

[[checks]]
name = "static-site/links-external"
stage = "manual"
runs = "per-scope"
requires = "network"
engine = "integrity"
analysis = "site-links-external"
inspection = ["consistency"]
summary = "Follows every link of the built site, the ones that leave it included."
why = "Other sites move their pages, and a link nobody rechecks rots."
help = "Update the link. Skip a host that refuses crawlers under tools.linkinator.skip with a reason."

[[checks]]
name = "static-site/size"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-size"
inspection = ["structure"]
summary = "Sums the compressed weight of the output paths each ceiling in tools.site.size_limits names."
why = "Weight arrives a kilobyte at a time, and only a ceiling notices."
help = "Remove what the page does not need, or raise the ceiling with a reason."

[[checks]]
name = "static-site/sitemap"
stage = "push"
runs = "per-scope"
requires = "build"
engine = "integrity"
analysis = "site-sitemap"
inspection = ["consistency"]
summary = "Compares the sitemap with the output: every listed route is a built page, and every built page is listed."
why = "A page outside the sitemap is found late by search engines, and a listed page that does not exist costs trust with them."
help = "Add the page to the sitemap, remove the dead entry, or leave a page out under tools.site.sitemap_excluded."

[[checks]]
name = "static-site/dead-assets"
stage = "push"
runs = "per-scope"
engine = "integrity"
analysis = "site-dead-assets"
inspection = ["structure"]
summary = "Finds files under an assets folder that no page, stylesheet, or script names."
why = "An asset nobody references ships with every deploy and is kept by everyone who fears deleting it."
help = "Delete the file."

[[checks]]
name = "static-site/svg"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "site-svg"
claims = {extensions = [".svg"]}
fix_command = ["svgo", "--quiet", "{files}"]
fix_order = "format"
inspection = ["format"]
summary = "Checks that svgo cannot make any SVG smaller."
why = "An SVG straight from an editor carries metadata and precision a browser never needs."
help = "Run svgo over the file."

[[checks]]
name = "static-site/webmanifest"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "site-webmanifest"
inspection = ["schema"]
summary = "Checks that the web manifest parses, names the app, and lists icons that exist."
why = "A manifest with a missing icon installs an app with a blank tile."
help = "Correct the manifest, or add the icon."

[[checks]]
name = "integrity/security-headers"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "site-security-headers"
inspection = ["security"]
summary = "Checks that the headers file sets the content type, referrer, and framing headers for every path."
why = "A site of files has no server code, so the headers file is the only place these protections can live."
help = "Add the header to the block for every path."

[[settings]]
name = "tools.site.build"
kind = "string"
direction = "neutral"
default = "npm run build"
summary = "The command that builds the site."

[[settings]]
name = "tools.site.output"
kind = "string"
direction = "neutral"
default = "dist"
summary = "The folder the build writes."

[[settings]]
name = "tools.site.size_limits"
kind = "list"
direction = "tightening"
default = []
summary = "Weight ceilings: the output paths, and the most kilobytes they may weigh compressed."

[[settings]]
name = "tools.site.sitemap_excluded"
kind = "list"
direction = "neutral"
default = ["404.html"]
summary = "Built pages the sitemap leaves out on purpose."

[[settings]]
name = "tools.purgecss.safelist"
kind = "list"
direction = "loosening"
default = []
summary = "Class names a script adds at run time: the names and the reason."

[[settings]]
name = "tools.linkinator.skip"
kind = "list"
direction = "loosening"
default = []
summary = "Links the crawl skips: a pattern and the reason."

[rule_files]
repository = ["repository/static-site/STATIC-SITE.md"]
runtime = ["runtime/browser/BROWSER.md"]
