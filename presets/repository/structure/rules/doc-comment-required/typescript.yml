id: structure/doc-comment-required
language: TypeScript
message: This export has no comment above it saying what it is for.

rule:
  kind: export_statement
  has:
    any:
      - kind: function_declaration
      - kind: class_declaration
      - kind: type_alias_declaration
      - kind: interface_declaration
  not:
    follows:
      stopBy: neighbor
      kind: comment
