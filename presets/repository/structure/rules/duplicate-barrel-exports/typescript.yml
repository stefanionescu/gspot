id: structure/duplicate-barrel-exports
language: TypeScript
message: A second star re-export here makes a name exported by both resolve to neither.

rule:
  kind: export_statement
  has:
    field: source
    kind: string
  not:
    has:
      kind: export_clause
  follows:
    stopBy: end
    kind: export_statement
    has:
      field: source
      kind: string
    not:
      has:
        kind: export_clause
