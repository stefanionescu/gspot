[preset]
id    = "repository:formatting"
kind  = "repository"
title = "One source for every formatter setting"

[defaults]
"format.indent_style"  = "space"
"format.indent_width"  = 2
"format.print_width"   = 100
"format.line_ending"   = "lf"
"format.final_newline" = true

[[settings]]
name      = "format.indent_style"
ops       = ["set"]
direction = "neutral"

[[settings]]
name      = "format.indent_width"
ops       = ["set"]
direction = "neutral"

[[settings]]
name      = "format.print_width"
ops       = ["set"]
direction = "neutral"

[[settings]]
name      = "format.line_ending"
ops       = ["set"]
direction = "neutral"

[[settings]]
name      = "format.final_newline"
ops       = ["set"]
direction = "neutral"
