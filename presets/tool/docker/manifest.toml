[preset]
name = "docker"
kind = "tool"
title = "Docker"
requires = ["configs"]
recommends = ["spelling"]
description = "Dockerfiles and Compose files: hadolint, a Compose file that parses, an ignore file beside every Dockerfile, and Trivy over the configuration."

[detect]
paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose*.yml", "**/compose*.yaml"]

[claims]
paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose*.yml", "**/compose*.yaml", "**/.dockerignore"]
natures = ["source"]

[[tools]]
name = "hadolint"
version = "2.14.0"
mise = "hadolint"
brew = "hadolint"
github = {name = "hadolint/hadolint", version = "v2.14.0"}
scoop = "hadolint"

[[tools.takeover]]
file = ".hadolint.yaml"
carries = "rules-table"
check = "docker/hadolint"

[[tools.takeover]]
file = ".hadolint.yml"
carries = "rules-table"
check = "docker/hadolint"

[[tools]]
name = "trivy"
version = "0.69.3"
mise = "trivy"
brew = "trivy"
github = {name = "aquasecurity/trivy", version = "v0.69.3"}

[[tools.takeover]]
file = "trivy.yaml"
carries = "rules-table"

[[tools.takeover]]
file = ".trivyignore"
carries = "rules-table"

[[tools]]
name = "docker"
provider = "host"

[[configs]]
template = "hadolint.yaml.tmpl"
target = ".gspot/hadolint.yaml"
rules_path = ["ignored"]

[[configs]]
template = "trivy.yaml.tmpl"
target = ".gspot/trivy.yaml"

[[configs]]
template = "trivyignore.tmpl"
target = ".gspot/trivyignore"

[[configs]]
template = "trivy-findings.tpl.tmpl"
target = ".gspot/trivy-findings.tpl"
header = false

[[checks]]
name = "docker/hadolint"
example = "The instruction `FROM node:latest` reports DL3007 because the tag changes over time. Select a reviewed, explicit version tag or digest and rerun."
level = "recommended"
stage = "commit"
command = ["hadolint", "--no-color", "--config", "{config:hadolint}", "{files}"]
claims = {paths = ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile"]}
coverage = ["syntax", "style"]
output = {format = "regex", pattern = "^(?<file>.+?):(?<line>\\d+) (?<rule>[A-Z]+\\d+) [a-z]+: (?<message>.*)$"}
summary = "Lints every Dockerfile, and runs ShellCheck over its RUN lines."
why = "An unpinned base image or a cache left in a layer makes a build nobody can repeat and an image larger than it needs to be."
help = "Change the instruction the way the rule says. Turn one rule off with gspot ignore docker/hadolint --rule <id> --reason."

[[checks]]
name = "docker/compose-config"
example = "A Compose service with an unknown key such as `bogus` fails configuration validation. Remove the key or replace it with the supported setting for the intended behavior."
level = "recommended"
stage = "push"
requires = "docker"
tool = "docker"
command = ["docker", "compose", "-f", "{file}", "config", "--quiet", "--no-env-resolution"]
claims = {paths = ["**/docker-compose*.yml", "**/docker-compose*.yaml", "**/compose*.yml", "**/compose*.yaml"]}
coverage = ["syntax"]
output = {format = "lines"}
summary = "Asks Docker Compose to parse every Compose file, which needs no running daemon."
why = "A Compose file that is valid YAML can still name a key Compose refuses, and the first person to learn that is deploying."
help = "Read the message Compose prints; it names the key and the service."

[[checks]]
name = "docker/dockerignore"
example = "A Dockerfile without a neighboring `.dockerignore` reports the missing context exclusions. Add `.dockerignore` with the required entries named in the finding, such as `.git` and dependency directories."
level = "recommended"
stage = "commit"
runs = "once"
engine = "integrity"
analysis = "dockerignore"
coverage = ["security"]
summary = "Checks that an ignore file sits beside every Dockerfile and keeps the git folder, installed dependencies, and environment files out of the build."
why = "Without it the whole folder goes to the daemon, and copying the folder puts the history and the secrets into the image."
help = "Add a .dockerignore beside the Dockerfile with the entries the message names."

[[checks]]
name = "docker/trivy-config"
example = "A Dockerfile whose final application stage runs as root can report a container-security finding. Create an unprivileged user, grant it only required file access, and select it with `USER` before running the application."
level = "recommended"
stage = "push"
runs = "once"
command = ["trivy", "config", "--quiet", "--config", "{config:trivy}", "--exit-code", "1", "--format", "template", "--template", "@{config:trivy-findings}", "{root}"]
tool = "trivy"
coverage = ["security"]
output = {format = "regex", pattern = "^(?<file>[^:]+):(?<line>\\d+):(?<rule>[^:]+):(?<message>.*)$"}
summary = "Scans Dockerfiles and Compose files for misconfiguration: a root user, a missing health check, an exposed secret."
why = "A container that runs as root turns any bug in the service into control of the container."
help = "Change the file the way the message says. Accept one id with a reason under tools.trivy.ignore."

[[checks]]
name = "docker/trivy-image"
example = "A configured image containing a package with a known advisory reports that advisory. Move to a reviewed image version containing the package fix, then rerun the image scan. Results depend on the advisory database and available image."
level = "recommended"
stage = "manual"
runs = "once"
requires = "docker"
engine = "integrity"
analysis = "trivy-image"
tool = "trivy"
coverage = ["security"]
summary = "Scans every image a Compose file names for known vulnerabilities in its packages."
why = "A base image carries hundreds of packages, and their advisories arrive after the image was chosen."
help = "Move to a newer tag of the image. Accept one advisory with a reason under tools.trivy.ignore."

[[settings]]
name = "tools.hadolint.trusted_registries"
kind = "list"
direction = "tightening"
default = []
summary = "The registries a base image may come from; empty allows any."

[[settings]]
name = "tools.trivy.severity"
kind = "string"
direction = "neutral"
default = "HIGH,CRITICAL"
summary = "The severities Trivy reports, as a comma-separated list."

[[settings]]
name = "tools.trivy.ignore"
kind = "list"
direction = "loosening"
default = []
summary = "Trivy ids accepted: the id and the reason."

[[settings]]
name = "tools.trivy.timeout"
kind = "string"
direction = "neutral"
default = "10m"
summary = "How long one Trivy scan may take."

[rule_files]
tool = ["tool/docker/DOCKER.md"]
