[preset]
name = "nginx"
kind = "tool"
title = "nginx"
description = "nginx configuration: gixy for the security mistakes, and the server's own parser in a container for the rest."

[detect]
paths = ["**/nginx.conf", "**/nginx/**/*.conf", "**/nginx/*.conf"]

[claims]
paths = ["**/nginx.conf", "**/nginx/**/*.conf", "**/nginx/*.conf"]
natures = ["source"]

[[tools]]
name = "gixy"
version = "0.2.53"
pypi = "gixy-ng"
mise = "pipx:gixy-ng"
windows = false
version_regex = "(\\d+\\.\\d+\\.\\d+)"

[[tools]]
name = "docker"
provider = "host"

[[tools]]
name = "openssl"
provider = "host"

[[configs]]
template = "gixy.cfg.tmpl"
target = ".gspot/gixy.cfg"
rules_path = ["checks", "skips"]

[[checks]]
name = "nginx/gixy"
example = "A location matching `/proxy/(.*)` with `proxy_pass http://$1` lets the request choose the destination and reports `ssrf`. Remove the request-controlled proxy destination and use the intended fixed upstream, or remove the proxy operation when the endpoint only needs to return a response."
level = "recommended"
stage = "commit"
platform = ["macos", "linux"]
command = ["gixy", "--config", "{config:gixy}", "--format", "json", "{file}"]
coverage = ["security"]
output = {format = "json", fields = {file = "path", line = "line", rule = "plugin", message = "summary"}}
summary = "Reads every nginx file for the mistakes that open a server: request forgery, path traversal through alias, header injection, a disclosed version."
why = "These mistakes parse, serve traffic, and look like any other location block until somebody uses them."
help = "Change the block the way the rule's page says. Turn one rule off with gspot ignore nginx/gixy --rule <name> --reason."

[[checks]]
name = "nginx/config-test"
example = "The line `invalid_directive on;` fails the native configuration test with `nginx-t`. Remove the unknown directive or replace it with the intended supported directive, such as `listen 443 ssl;` in the configured TLS server. Rerun with the configured deployment image available."
level = "recommended"
stage = "push"
runs = "per-scope"
requires = "docker"
engine = "integrity"
analysis = "nginx-test"
tool = "docker"
claims = {filenames = ["nginx.conf"]}
coverage = ["syntax"]
summary = "Validates each main configuration inside the nginx image and records the files nginx parsed. It mounts a throwaway certificate and resolves upstream names."
why = "Only nginx knows whether nginx accepts the file, and the other place to learn it is the restart in production."
help = "Read the line nginx names. Set tools.nginx.image to the image the deployment runs."

[[settings]]
name = "tools.nginx.image"
kind = "string"
direction = "neutral"
default = "nginx:stable-alpine"
summary = "The image nginx -t runs in; name the one the deployment uses."

[rule_files]
tool = ["tool/nginx/NGINX.md"]
