[preset]
name = "trpc"
kind = "library"
title = "tRPC"
requires = ["javascript"]
description = "tRPC routers: every procedure validates its input, and client code imports the router as a type only."

[detect]
dependencies = ["@trpc/server"]

[[checks]]
name = "trpc/router-boundaries"
stage = "commit"
engine = "integrity"
analysis = "trpc-boundaries"
claims = {extensions = [".ts", ".tsx"]}
inspection = ["structure"]
summary = "Checks that code outside the server paths imports from them as a type only."
why = "A value import of the router pulls the server, its secrets, and its database client into the client bundle."
help = "Import the router type with import type, and call the server through the client."

[[settings]]
name = "tools.trpc.server_paths"
kind = "list"
direction = "neutral"
default = ["**/server/**"]
summary = "The paths that hold the routers and everything they import."

[rule_files]
library = ["library/trpc/TRPC.md"]
