[preset]
id = "go"
kind = "language"
title = "Go"
requires = ["structure", "formatting"]
recommends = ["spelling", "dependencies", "security"]
description = "Go source and modules: gofmt, golangci-lint with a strict rule set, govulncheck, a tidy go.mod, and ceilings on file and function length."

[detect]
filenames = ["go.mod"]
extensions = [".go"]

[claims]
extensions = [".go"]
filenames = ["go.mod", "go.sum", ".golangci.yml", ".golangci.yaml"]
natures = ["source"]

[[tools]]
name = "go"
provider = "host"

[[tools]]
name = "gofmt"
provider = "host"

[[tools]]
name = "golangci-lint"
version = "2.13.2"
mise = "golangci-lint"
version_regex = "version (\\d+\\.\\d+\\.\\d+)"

[[tools]]
name = "govulncheck"
version = "1.8.0"
mise = "go:golang.org/x/vuln/cmd/govulncheck"
version_command = ["-version"]
version_regex = "govulncheck@v(\\d+\\.\\d+\\.\\d+)"

[[configs]]
template = "golangci.yml.tmpl"
target = ".gspot/golangci.yml"

[[checks]]
id = "go/gofmt"
stage = "commit"
runs = "per-file-list"
command = ["gofmt", "-l", "{files}"]
fix_command = ["gofmt", "-w", "{files}"]
fix_order = "format"
tool = "gofmt"
claims = {extensions = [".go"]}
inspection = ["format"]
output = {format = "regex", pattern = "^(?<file>.+\\.go)$", message = "This file is not formatted the way gofmt formats it."}
summary = "Checks that every Go file is formatted the way gofmt formats it."
why = "Every Go reader expects gofmt layout, and a diff of layout hides the diff that matters."
fix = "Run gspot check --fix, which runs gofmt -w over the files."

[[checks]]
id = "go/golangci-lint"
stage = "commit"
runs = "per-scope"
cwd = "scope"
command = ["golangci-lint", "run", "--config", "{config:golangci}", "--output.json.path", "stdout", "--show-stats=false", "--issues-exit-code", "1", "./..."]
tool = "golangci-lint"
claims = {extensions = [".go"]}
inspection = ["style", "types", "syntax"]
output = {format = "json", items = "Issues", fields = {file = "Pos.Filename", line = "Pos.Line", column = "Pos.Column", rule = "FromLinter", message = "Text"}}
summary = "Runs golangci-lint with the linters the preset turns on, the type check of go vet among them."
why = "An unchecked error, a shadowed variable, or a lost context is a bug the compiler accepts."
fix = "Read the linter named in the finding; fix the code, or record a decision with gspot ignore go/golangci-lint --rule and a reason."

[[checks]]
id = "go/mod-tidy"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "go-mod-tidy"
claims = {filenames = ["go.mod", "go.sum"]}
inspection = ["integrity"]
summary = "Checks that go mod tidy changes neither go.mod nor go.sum."
why = "A module file that lists what nothing imports, or misses what something imports, builds differently on the next machine."
fix = "Run go mod tidy in the module and commit both files."

[[checks]]
id = "go/govulncheck"
stage = "push"
runs = "per-scope"
requires = "network"
engine = "integrity"
analysis = "go-vulnerabilities"
tool = "govulncheck"
claims = {filenames = ["go.mod", "go.sum"]}
inspection = ["dependencies"]
summary = "Runs govulncheck, which reports a known vulnerability only where the code calls the vulnerable function."
why = "A vulnerable function the program calls is reachable by whoever controls its input."
fix = "Upgrade the module to the fixed version the finding names, then run go mod tidy."

[[checks]]
id = "go/file-length"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "go-file-length"
claims = {extensions = [".go"]}
inspection = ["structure"]
summary = "Checks that no Go file has more code lines than the ceiling."
why = "A long file holds more than one job, and the second job is the one nobody finds."
fix = "Split the file by the job, or raise limits.file_lines for go with a reason."

[[checks]]
id = "go/function-length"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "go-function-length"
claims = {extensions = [".go"]}
inspection = ["structure"]
summary = "Checks that no Go function or method has more lines than the ceiling."
why = "A function longer than a screen hides its branches, and a reviewer approves what they did not read."
fix = "Move a step into a function of its own, or raise limits.function_lines for go with a reason."

[[settings]]
name = "tools.golangci.disabled"
kind = "list"
direction = "loosening"
default = []
summary = "Linters the repository turns off: the name and the reason."

[inspections]
".go" = ["format", "syntax", "style", "types", "structure", "spelling"]

[rule_files]
language = ["language/GO.md"]
