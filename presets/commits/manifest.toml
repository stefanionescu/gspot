[preset]
id = "commits"
kind = "repository"
title = "Commits"
default = true
description = "commitlint over every commit message: conventional types, the repository's scopes, and the corpus limits."

[claims]
paths = ["**"]
natures = ["source"]

[[tools]]
name = "commitlint"
version = "21.2.2"
npm = "@commitlint/cli"
mise = "npm:@commitlint/cli"

[[configs]]
template = "commitlint.config.cjs.tmpl"
target = ".gspot/commitlint.config.cjs"
stub = { path = ".commitlintrc.json", body = "{\n    \"extends\": [\"./.gspot/commitlint.config.cjs\"]\n}\n" }

[[checks]]
id = "commits/commitlint"
stage = "message"
takes = "files"
command = ["commitlint", "--config", "{config:commitlint}", "--edit", "{message_file}"]
output = { format = "regex", pattern = "^\\s*[✖⚠]\\s+(?<message>.*?)\\s+\\[(?<rule>[a-z-]+)\\]\\s*$" }
inspection = []
summary = "Checks the commit message being written: a conventional type, a known scope, a short subject and a wrapped body."
why = "A history of typed, scoped subjects is what release notes, blame and bisect are read from; a free-form message hides the change."
fix = "Write <type>(<scope>): <subject>, with a type from the list and a subject under 72 characters, or change the list with gspot set tools.commitlint.types."

[[checks]]
id = "commits/range"
stage = "push"
takes = "project"
command = ["commitlint", "--config", "{config:commitlint}", "--from", "{merge_base}", "--to", "HEAD"]
output = { format = "regex", pattern = "^\\s*[✖⚠]\\s+(?<message>.*?)\\s+\\[(?<rule>[a-z-]+)\\]\\s*$" }
inspection = []
summary = "Checks every commit message about to be pushed, from the merge base with the upstream branch to HEAD."
why = "A message written past the hook (--no-verify, a rebase, a merge) still reaches the shared branch unless the push checks it."
fix = "Reword the commits that fail with git rebase -i, or change the rule with gspot set tools.commitlint.rules."

[[settings]]
name = "tools.commitlint.types"
kind = "list"
direction = "neutral"
default = ["feat", "fix", "refactor", "perf", "docs", "test", "build", "ci", "chore"]
summary = "The commit types the type-enum rule allows."

[[settings]]
name = "tools.commitlint.scopes"
kind = "list"
direction = "neutral"
default = []
summary = "The commit scopes the scope-enum rule allows; empty means the last segment of every scope path plus root, hooks and deps, and no enum at all when the repository has no scopes."

[[settings]]
name = "tools.commitlint.rules"
kind = "table"
direction = "per-rule"
summary = "Options per commitlint rule, by rule name; turning a rule off is gspot ignore --rule."

[rules]
general = ["general/agent/GIT.md"]
tool = ["tool/commitlint/COMMITLINT.md"]
