[preset]
name = "react"
kind = "framework"
title = "React"
requires = ["javascript"]
recommends = ["typescript", "css", "vitest"]
description = "React components: the rules of hooks and the compiler rules as errors, keys, links that open a new tab, markup set from a string, and components built inside a render."

[detect]
dependencies = ["react"]

[[tools]]
name = "eslint-plugin-react-hooks"
kind = "library"
version = "6.1.1"
npm = "eslint-plugin-react-hooks"

[[tools]]
name = "eslint-plugin-react"
kind = "library"
version = "7.37.5"
npm = "eslint-plugin-react"

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/eslint.config.mjs"
fragment = true

[rule_files]
framework = ["framework/react/REACT.md"]

[required_rules]
jsx = ["react-hooks/rules-of-hooks", "react-hooks/exhaustive-deps", "react/jsx-key", "react/no-danger"]
tsx = ["react-hooks/rules-of-hooks", "react-hooks/exhaustive-deps", "react/jsx-key", "react/no-danger"]
