[preset]
id = "rust"
kind = "language"
title = "Rust"
requires = ["structure", "formatting"]
recommends = ["spelling", "dependencies", "security"]
description = "Rust crates: rustfmt, Clippy with every finding an error, cargo-audit for advisories, and cargo-deny for licenses, bans, and sources."

[detect]
filenames = ["Cargo.toml"]
extensions = [".rs"]

[claims]
extensions = [".rs"]
filenames = ["Cargo.toml", "Cargo.lock", "clippy.toml", "rustfmt.toml", "deny.toml"]
natures = ["source"]

[[tools]]
name = "cargo"
provider = "host"

[[tools]]
name = "rustfmt"
provider = "host"

[[tools]]
name = "cargo-clippy"
provider = "host"

[[tools]]
name = "cargo-audit"
version = "0.22.2"
mise = "cargo:cargo-audit"

[[tools]]
name = "cargo-deny"
version = "0.20.2"
mise = "cargo:cargo-deny"

[[configs]]
template = "rustfmt.toml.tmpl"
target = ".gspot/rustfmt.toml"

[[configs]]
template = "clippy.toml.tmpl"
target = ".gspot/clippy.toml"

[[configs]]
template = "deny.toml.tmpl"
target = ".gspot/deny.toml"

[[checks]]
id = "rust/rustfmt"
stage = "commit"
runs = "per-scope"
cwd = "scope"
command = ["cargo", "fmt", "--all", "--", "--check", "-l", "--config-path", "{config:rustfmt}"]
fix_command = ["cargo", "fmt", "--all", "--", "--config-path", "{config:rustfmt}"]
fix_order = "format"
tool = "cargo"
claims = {extensions = [".rs"]}
inspection = ["format"]
output = {format = "regex", pattern = "^(?<file>.+\\.rs)$", message = "This file is not formatted the way rustfmt formats it."}
summary = "Checks that every Rust file is formatted the way rustfmt formats it."
why = "One layout means a diff shows what changed, and nobody reviews spacing."
fix = "Run gspot check --fix, which runs cargo fmt over the crate."

[[checks]]
id = "rust/clippy"
stage = "commit"
runs = "per-scope"
engine = "integrity"
analysis = "rust-clippy"
tool = "cargo-clippy"
claims = {extensions = [".rs"], filenames = ["Cargo.toml"]}
inspection = ["style", "types", "syntax"]
summary = "Builds the crate with Clippy, where every compiler warning and every Clippy finding is an error."
why = "An unwrap, a needless clone, or a lossy cast compiles, and Clippy is the reviewer that never tires of them."
fix = "Read the lint named in the finding; fix the code, or record a decision with gspot ignore rust/clippy --rule and a reason."

[[checks]]
id = "rust/cargo-audit"
stage = "push"
runs = "per-scope"
requires = "network"
engine = "integrity"
analysis = "rust-advisories"
tool = "cargo-audit"
claims = {filenames = ["Cargo.lock", "Cargo.toml"]}
inspection = ["dependencies"]
summary = "Checks Cargo.lock against the RustSec advisory database."
why = "A crate with a known vulnerability is one the whole world can read the exploit for."
fix = "Upgrade the crate to a patched version the finding names, with cargo update -p."

[[checks]]
id = "rust/cargo-deny"
stage = "push"
runs = "per-scope"
requires = "network"
engine = "integrity"
analysis = "rust-crate-policy"
tool = "cargo-deny"
claims = {filenames = ["Cargo.lock", "Cargo.toml"]}
inspection = ["dependencies"]
summary = "Checks the crate graph with cargo-deny: the licenses it may hold, the crates it bans, and the registries it may come from."
why = "A license the product cannot ship under, or a crate from an unknown registry, arrives three levels down the graph."
fix = "Replace the crate, or allow the license under tools.deny.licenses with a reason."

[[settings]]
name = "tools.deny.licenses"
kind = "list"
direction = "loosening"
default = []
summary = "Licenses the crate graph may hold beside the ones the preset allows: the SPDX id and the reason."

[inspections]
".rs" = ["format", "syntax", "style", "types", "spelling"]

[rule_files]
language = ["language/RUST.md"]
