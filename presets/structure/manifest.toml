[preset]
id = "structure"
kind = "repository"
title = "Structure"
description = "The structural rules no standard linter ships, over every language: wrappers, barrels, lone files, private-first order, and the size limits."

[claims]
from_languages = true

[[tools]]
name = "ast-grep"
version = "0.45.3"
npm = "@ast-grep/cli"
mise = "ast-grep"
brew = "ast-grep"
cargo = "ast-grep"
github = "ast-grep/ast-grep"

[[checks]]
id = "structure/single-file-folder"
stage = "commit"
engine = "structure"
analysis = "single-file-folder"
inspection = ["structure"]
searched = ["eslint-plugin-unicorn", "ls-lint", "knip"]
summary = "Finds a folder that holds one code file and nothing else."
why = "A folder of one file adds a level to every path and promises siblings that never arrive."
fix = "Move the file up beside its neighbors, or allow the folder with a reason under structure.single_file_folder_allowed."

[[checks]]
id = "structure/prefix-collisions"
stage = "commit"
engine = "structure"
analysis = "prefix-collisions"
limit = "limits.prefix_collisions"
inspection = ["structure"]
searched = ["ls-lint", "eslint-plugin-unicorn"]
summary = "Finds sibling files that share a name prefix, like asset-card, asset-list and asset-row in one folder."
why = "Files that share a prefix are one concept split by suffix; they belong in a folder named after the prefix."
fix = "Move the files into a folder named after the shared prefix, or allow the set with a reason."

[[checks]]
id = "structure/file-directory-collision"
stage = "commit"
engine = "structure"
analysis = "file-directory-collision"
inspection = ["structure"]
searched = ["ls-lint"]
summary = "Finds a file and a folder in the same place with the same stem, like turn.ts beside turn/."
why = "An import of ./turn names both, and a reader cannot tell which one loads."
fix = "Rename the file or the folder so their stems differ."

[[checks]]
id = "structure/folder-names"
stage = "commit"
engine = "structure"
analysis = "folder-names"
inspection = ["structure"]
searched = ["ls-lint"]
summary = "Finds a folder named after a container word like common, core, helpers or utils, or after a language."
why = "A folder with no owner collects everything nobody wanted to place, and grows until nobody reads it."
fix = "Name the folder after what it holds, or allow it with a reason under structure.folder_name_allowed."

[[checks]]
id = "integrity/baselines-current"
stage = "commit"
takes = "project"
engine = "integrity"
analysis = "baselines-current"
inspection = ["consistency"]
summary = "Checks that every baseline names a check that still runs and that every file in a tool's suppressions file is still tracked."
why = "A baseline for a check that is gone hides nothing and misleads the reader; a suppression for a deleted file is a count nobody lowered."
fix = "Run gspot apply --baseline to remove the stale baseline or prune the suppressions."

[[checks]]
id = "integrity/config-purity"
stage = "commit"
takes = "project"
engine = "integrity"
analysis = "config-purity"
inspection = ["structure"]
summary = "Checks that every module under the config role holds literals only: no function, no control flow, no call, no value import from outside the config roots."
why = "A configuration module with logic in it is code nobody tests, hidden where reviewers expect a table."
fix = "Move the logic into a module under src and keep the literal in the config module, or take the folder out of the config role."

[[checks]]
id = "integrity/suppressions"
stage = "commit"
takes = "project"
engine = "integrity"
analysis = "suppressions"
inspection = ["structure"]
summary = "Counts every inline suppression by form and reports each one that carries no reason; nosemgrep is refused outright."
why = "A suppression without a reason is a finding hidden for good; a census that grows without a baseline update is debt nobody agreed to."
fix = "Write the reason in the comment (after -- for eslint-disable and gspot-ignore, after a colon for ts-expect-error), or fix the finding and drop the suppression."

[[checks]]
id = "integrity/allowlists-match"
stage = "commit"
takes = "project"
engine = "integrity"
analysis = "allowlists-match"
inspection = ["consistency"]
summary = "Checks that every path pattern in gspot.toml matches at least one tracked file."
why = "An ignore, declaration or allowance that matches nothing is a leftover that misleads the next reader."
fix = "Remove the entry, or fix its pattern."

[[checks]]
id = "integrity/task-policy"
stage = "commit"
takes = "project"
engine = "integrity"
analysis = "task-policy"
inspection = ["consistency"]
summary = "Checks that the runner surface holds every task gspot writes and that the installed hooks exist, call gspot and are pointed at by core.hooksPath."
why = "A missing task or a hook nobody points at means the gate runs only when someone remembers to."
fix = "Run gspot apply; it rewrites the tasks and the hooks and sets core.hooksPath."

[[checks]]
id = "integrity/large-files"
stage = "commit"
takes = "project"
engine = "integrity"
analysis = "large-files"
inspection = ["consistency"]
summary = "Checks that every tracked file over the size limit is stored through LFS or declared with a reason."
why = "A large file in plain git history stays in every clone for good."
fix = "Track the file with git lfs, declare it with gspot declare <path> --reason, or raise limits.file_size_kb with a reason."

[[settings]]
name = "limits.file_lines"
kind = "number"
direction = "ceiling"
default = 300
languages = ["typescript", "javascript", "python", "swift", "bash", "sql"]
summary = "The most lines a file may have. Bash counts code lines; the other languages count every line."

[[settings]]
name = "limits.function_lines"
kind = "number"
direction = "ceiling"
default = 60
languages = ["typescript", "javascript", "python", "swift", "bash", "sql"]
summary = "The most lines one function may have."

[[settings]]
name = "limits.function_parameters"
kind = "number"
direction = "ceiling"
default = 5
languages = ["typescript", "javascript", "python", "swift"]
summary = "The most parameters one function may take."

[[settings]]
name = "limits.cognitive_complexity"
kind = "number"
direction = "ceiling"
default = 8
languages = ["typescript", "javascript"]
summary = "How hard a function is to follow, by the sonarjs cognitive score."

[[settings]]
name = "limits.cyclomatic_complexity"
kind = "number"
direction = "ceiling"
default = 8
languages = ["typescript", "javascript", "python", "swift", "bash"]
summary = "How many paths run through one function."

[[settings]]
name = "limits.classes_per_file"
kind = "number"
direction = "ceiling"
default = 1
languages = ["typescript", "javascript", "python", "swift"]
summary = "The most classes one file may declare."

[[settings]]
name = "limits.nested_blocks"
kind = "number"
direction = "ceiling"
default = 3
languages = ["typescript", "javascript", "python"]
summary = "How deep blocks may nest inside one function."

[[settings]]
name = "limits.positional_arguments"
kind = "number"
direction = "ceiling"
default = 5
languages = ["python"]
summary = "The most positional arguments one Python function may take."

[[settings]]
name = "limits.branches"
kind = "number"
direction = "ceiling"
default = 8
languages = ["python"]
summary = "The most branches one function may have."

[[settings]]
name = "limits.returns"
kind = "number"
direction = "ceiling"
default = 4
languages = ["python"]
summary = "The most return statements one function may have."

[[settings]]
name = "limits.statements"
kind = "number"
direction = "ceiling"
default = 30
languages = ["typescript", "javascript", "python"]
summary = "The most statements one function may have."

[[settings]]
name = "limits.locals"
kind = "number"
direction = "ceiling"
default = 10
languages = ["python"]
summary = "The most local variables one function may declare."

[[settings]]
name = "limits.boolean_expressions"
kind = "number"
direction = "ceiling"
default = 4
languages = ["python"]
summary = "The most boolean operators in one condition."

[[settings]]
name = "limits.public_methods"
kind = "number"
direction = "ceiling"
default = 12
languages = ["python"]
summary = "The most public methods one class may have."

[[settings]]
name = "limits.nested_callbacks"
kind = "number"
direction = "ceiling"
default = 3
languages = ["typescript", "javascript"]
summary = "How deep callbacks may nest."

[[settings]]
name = "limits.identical_functions"
kind = "number"
direction = "ceiling"
default = 3
languages = ["typescript", "javascript", "bash", "swift"]
summary = "The fewest lines two function bodies must share before they count as identical."

[[settings]]
name = "limits.barrel_reexports"
kind = "number"
direction = "ceiling"
default = 20
languages = ["typescript", "javascript", "python"]
summary = "The most re-exports one index file may hold."

[[settings]]
name = "limits.prefix_collisions"
kind = "number"
direction = "ceiling"
default = 2
summary = "How many sibling files may share a name prefix before it is a finding."

[[settings]]
name = "limits.trivial_statements"
kind = "number"
direction = "ceiling"
default = 2
summary = "A function with this many statements or fewer, used once, is reported as trivial."

[[settings]]
name = "limits.trivial_ast_nodes"
kind = "number"
direction = "ceiling"
default = 10
languages = ["python"]
summary = "A function with this many syntax nodes or fewer, used once, is reported as trivial."

[[settings]]
name = "limits.line_length"
kind = "number"
direction = "ceiling"
default = 120
summary = "The most characters on one line."

[[settings]]
name = "limits.file_size_kb"
kind = "number"
direction = "ceiling"
default = 1024
summary = "The largest tracked file, in kilobytes, outside LFS or a declaration."

[[settings]]
name = "limits.bash.file_lines"
kind = "number"
direction = "ceiling"
default = 140
summary = "The most code lines a shell script may have."

[[settings]]
name = "limits.bash.function_lines"
kind = "number"
direction = "ceiling"
default = 40
summary = "The most code lines one shell function may have."

[[settings]]
name = "limits.bash.function_branches"
kind = "number"
direction = "ceiling"
default = 8
summary = "The most branches one shell function may have."

[[settings]]
name = "limits.bash.function_nesting"
kind = "number"
direction = "ceiling"
default = 3
summary = "How deep blocks may nest in one shell function."

[[settings]]
name = "limits.bash.mutable_assignments"
kind = "number"
direction = "ceiling"
default = 8
summary = "The most variable assignments one shell function may make."

[[settings]]
name = "limits.bash.duplicate_min_lines"
kind = "number"
direction = "ceiling"
default = 3
summary = "The fewest lines two shell functions must share before they count as duplicates."

[[settings]]
name = "limits.sql.function_lines"
kind = "number"
direction = "ceiling"
default = 60
summary = "The most lines one SQL function body may have."

[[settings]]
name = "limits.swift.type_body_length"
kind = "number"
direction = "ceiling"
default = 300
summary = "The most lines one Swift type body may have."

[[settings]]
name = "limits.swift.closure_body_length"
kind = "number"
direction = "ceiling"
default = 60
summary = "The most lines one Swift closure may have."

[[settings]]
name = "limits.duplication.min_lines"
kind = "number"
direction = "ceiling"
default = 8
summary = "The fewest lines a copied block must have before jscpd reports it."

[[settings]]
name = "limits.duplication.min_tokens"
kind = "number"
direction = "ceiling"
default = 40
summary = "The fewest tokens a copied block must have before jscpd reports it."

[[settings]]
name = "limits.duplication.threshold_percent"
kind = "number"
direction = "ceiling"
default = 4
summary = "The most duplicated code a repository may hold, as a percentage."

[[settings]]
name = "limits.docs.sentence_words"
kind = "number"
direction = "ceiling"
default = 30
summary = "The most words one sentence of documentation may have."

[[settings]]
name = "limits.docs.list_item_words"
kind = "number"
direction = "ceiling"
default = 45
summary = "The most words one list item may have."

[[settings]]
name = "limits.docs.paragraph_sentences"
kind = "number"
direction = "ceiling"
default = 6
summary = "The most sentences one paragraph may have."

[[settings]]
name = "limits.install.min_release_age_days"
kind = "number"
direction = "floor"
default = 7
summary = "How many days a package must have been published before the package manager installs it."

[[settings]]
name = "structure.reexports"
kind = "string"
direction = "tightening"
default = "none"
summary = "Whether re-exports are allowed: none, or index-only for libraries with barrels."

[[settings]]
name = "structure.call_through_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Functions allowed to forward their arguments to one call, each with a file, a name and a reason."

[[settings]]
name = "structure.trivial_exemptions"
kind = "list"
direction = "loosening"
default = []
summary = "Small single-use functions allowed to stay, by path and name, each with a reason."

[[settings]]
name = "structure.single_file_folder_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Folders allowed to hold one file, by path, each with a reason."

[[settings]]
name = "structure.prefix_collision_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Folders where sibling files may share a prefix, by path, each with a reason."

[[settings]]
name = "structure.folder_name_allowed"
kind = "list"
direction = "loosening"
default = []
summary = "Folder names from the banned list that this repository keeps, by path, each with a reason."

[[settings]]
name = "architecture.types_directory"
kind = "string"
direction = "neutral"
summary = "The directory every type alias lives under; turns on the types placement rules."

[[settings]]
name = "architecture.roles"
kind = "table"
direction = "tightening"
summary = "Which elements play the types, config, env, tests, support and runtime roles for the import direction rules."

[[settings]]
name = "architecture.elements"
kind = "list"
direction = "tightening"
default = []
summary = "The named parts of the code and the paths each covers."

[[settings]]
name = "architecture.allow"
kind = "list"
direction = "tightening"
default = []
summary = "Which element may import which; an element imports only itself unless a row says otherwise."

[rules]
general = ["general/agent/WORKING.md"]
