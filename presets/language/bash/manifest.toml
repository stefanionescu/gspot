[preset]
id    = "language:bash"
kind     = "language"
requires = ["repository:formatting"]
title = "Bash"

[claims]
extensions = [".sh", ".bash", ".bats"]
interpreters = ["bash", "sh", "dash", "ksh", "zsh"]

[required]
".sh"   = ["format", "syntax", "style", "structure", "naming", "prose", "spelling"]
".bash" = ["format", "syntax", "style", "structure", "naming", "prose", "spelling"]
".bats" = ["format", "syntax", "style", "spelling"]

[[configs]]
target   = ".gspot/generated/shellcheckrc"
template = "configs/shellcheckrc.tmpl"
readers  = ["sh/shellcheck"]

[[tools]]
id       = "bash"
version  = "5.3.3"
provider = "host"

[[tools]]
id       = "shellcheck"
version  = "0.11.0"
provider = "download"

[[tools]]
id       = "shfmt"
version  = "3.12.0"
provider = "download"

[[checks]]
id        = "sh/syntax"
inspects  = ["syntax"]
mechanism = "configured"
stage     = "pre-commit"
takes     = "one-file"
command   = ["bash", "-n"]
fails_on  = "exit-code"
tools     = ["bash"]
file_list = { via = "declared" }

[[checks]]
id        = "sh/shellcheck"
inspects  = ["style"]
mechanism = "configured"
stage     = "pre-commit"
takes     = "file-list"
command   = ["shellcheck", "--severity=style", "--enable=all", "--external-sources"]
fails_on  = "exit-code"
tools     = ["shellcheck"]
config_arg = "--rcfile"
file_list = { via = "check-mode", command = ["shellcheck", "--format=json1", "--severity=error"] }

[[checks.tool_errors]]
regex   = "Failed to (?:open|read)|No such file"
message = """
ShellCheck could not read a file it was handed.
  - The path is tracked but absent from the working tree, under a sparse checkout.
  - Run `gspot coverage` to see which paths the listing claimed.
"""

[[checks]]
id        = "sh/shfmt"
inspects  = ["format"]
mechanism = "configured"
stage     = "pre-commit"
takes     = "file-list"
command   = ["shfmt", "--diff"]
fails_on  = "exit-code"
fix       = ["shfmt", "--write"]
tools     = ["shfmt"]
file_list = { via = "check-mode", command = ["shfmt", "--list"] }

[[tasks]]
name        = "lint:bash"
description = "Parse, style check and format check every shell file"
scope       = "per-scope"
checks      = ["sh/syntax", "sh/shellcheck", "sh/shfmt"]
