[preset]
name = "typescript"
kind = "language"
title = "TypeScript"
requires = ["javascript", "structure"]
recommends = ["naming", "formatting", "spelling"]
description = "The strict compiler, ESLint with typescript-eslint and the gspot structural rules over every TypeScript file, and knip for dead code."

[detect]
extensions = [".ts", ".tsx", ".mts", ".cts"]
filenames = ["tsconfig.json"]
dependencies = ["typescript"]

[claims]
extensions = [".ts", ".tsx", ".mts", ".cts", ".d.ts"]
filenames = ["tsconfig.json", "tsconfig.*.json"]

[[tools]]
name = "tsc"
suppression = {marker = "@ts-(?:ignore|expect-error)\\b", reason = "@ts-(?:ignore|expect-error):?\\s+(?<reason>\\S.*)"}
provider = "host"
version_command = ["--version"]

[[tools]]
name = "typescript-eslint"
kind = "library"
version = "8.70.0"
npm = "typescript-eslint"
floor = "8.29.0"

[[tools]]
name = "eslint-import-resolver-typescript"
kind = "library"
version = "4.4.5"
npm = "eslint-import-resolver-typescript"

[[configs]]
template = "eslint.fragment.js.tmpl"
target = ".gspot/eslint.config.mjs"
fragment = true

[[configs]]
template = "tsconfig.check.json.tmpl"
target = ".gspot/tsconfig.check.json"
per_scope = true

[[checks]]
name = "typescript/tsc"
example = "The TypeScript declaration `const count: number = \"one\";` reports an incompatible assignment. Correct it to `const count: number = 1;` when the contract requires a number."
level = "recommended"
stage = "commit"
runs = "per-scope"
cwd = "scope"
tool = "tsc"
analysis = "typescript"
coverage = ["types"]
output = {format = "regex", pattern = "^(?<file>[^(]+)\\((?<line>\\d+),(?<column>\\d+)\\): error (?<rule>TS\\d+): (?<message>.*)$"}
summary = "Checks that every TypeScript file type-checks with the strict compiler options."
why = "A file that does not type-check can crash at run time in a way the editor already knew about."
help = "Read the first error tsc prints and fix that file; later errors are often the same mistake."

[[checks]]
name = "typescript/eslint"
example = "An unused variable such as `const unused = 1;` reports the configured unused-variable rule in a selected source file. Remove the unused declaration and rerun. Component files must also retain valid framework syntax."
level = "recommended"
stage = "commit"
runs = "per-file-list"
command = ["eslint", "--max-warnings", "0", "--no-warn-ignored", "--config", "{config:eslint}", "--format", "json", "{files}"]
fix_command = ["eslint", "--fix", "--config", "{config:eslint}", "{files}"]
fix_order = "codemod"
fix_findings_exit_codes = [1]
claims = {extensions = [".ts", ".tsx", ".mts", ".cts"]}
coverage = ["style", "structure", "security"]
output = {format = "eslint-json"}
tool_errors = "^(?:Oops! Something went wrong|Error: Cannot find module|ERR_MODULE_NOT_FOUND|ConfigError:)"
summary = "Runs ESLint with the shipped rule set over every TypeScript file."
why = "ESLint catches mistakes and slop the compiler accepts: unused code, unsafe casts, functions that only forward."
help = "Run gspot check --fix for the rules that fix themselves, then read each remaining line; gspot explain <rule> says what it means."

[[checks]]
name = "integrity/tsconfig-options"
example = "An authored TypeScript configuration setting `strict` to `false` reports the required compiler option. Enable `strict` and fix the resulting type errors rather than disabling the integrity check."
level = "all"
stage = "commit"
engine = "integrity"
analysis = "tsconfig-options"
coverage = ["types"]
summary = "Checks that every tsconfig still turns on the strict options the preset requires."
why = "One tsconfig that drops strict lets untyped code back in for that whole scope."
help = "Enable the reported compiler option in the authored TypeScript configuration."

[coverage]
".ts" = ["format", "syntax", "style", "types", "structure", "naming", "prose", "spelling"]
".tsx" = ["format", "syntax", "style", "types", "structure", "naming", "prose", "spelling"]
".mts" = ["format", "syntax", "style", "types", "structure", "naming", "prose", "spelling"]
".cts" = ["format", "syntax", "style", "types", "structure", "naming", "prose", "spelling"]

[rule_files]
language = ["language/TYPESCRIPT.md", "language/naming/TYPESCRIPT.md"]

[required_rules]
ts = ["eqeqeq", "max-lines", "sonarjs/cognitive-complexity", "gspot/private-before-public", "@typescript-eslint/no-explicit-any", "@typescript-eslint/no-floating-promises"]
tsx = ["eqeqeq", "@typescript-eslint/no-explicit-any", "@typescript-eslint/no-floating-promises"]
