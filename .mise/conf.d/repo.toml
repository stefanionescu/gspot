[tasks."repo:setup"]
description = "Install frozen workspace dependencies and synchronize Astro types."
run = "bun install --frozen-lockfile"
depends_post = ["docs:sync"]

[tasks."repo:install-checks"]
description = "Install the locked repository check environment."
run = "bun packages/cli/src/main.ts install"

[tasks.build]
description = "Build the host CLI, or targets supplied as arguments, with licenses and notices."
run = "bun packages/cli/build.ts"

[tasks."build:plugin"]
description = "Build the standalone ESLint plugin and stage its license."
run = "bun packages/eslint-plugin/build.ts"

[tasks.test]
description = "Run deterministic unit and integration tests."
dir = "{{config_root}}/tests"
run = "bun test --timeout 60000 ./unit ./integration"

[tasks."test:unit"]
description = "Run CLI unit and standalone plugin tests."
dir = "{{config_root}}/tests"
run = "bun test --timeout 60000 ./unit"

[tasks."test:coverage"]
description = "Run unit and integration tests with coverage."
dir = "{{config_root}}/tests"
run = "bun test --timeout 60000 --coverage ./unit ./integration"

[tasks."test:integration"]
description = "Run integration tests."
dir = "{{config_root}}/tests"
run = "bun test --timeout 60000 ./integration"

[tasks."test:native"]
description = "Run native compatibility tests with the selected tools installed."
dir = "{{config_root}}/tests"
run = "bun test --timeout 60000 ./native"

[tasks."test:acceptance"]
description = "Run behavioral acceptance tests with the local plugin in an isolated registry."
dir = "{{config_root}}/tests"
run = "bun support/acceptance/run.ts"

[tasks."test:release"]
description = "Exercise built release artifacts and installed consumers through an isolated registry."
dir = "{{config_root}}/tests"
run = "bun test --timeout 60000 ./release"

[tasks."check:types"]
description = "Check workspace and documentation TypeScript types."
depends = ["docs:sync"]
run = ["bunx tsc --noEmit -p tsconfig.json", "bunx tsc --noEmit -p docs/tsconfig.json", "bunx tsc --noEmit -p tests/tsconfig.json"]

[tasks."docs:sync"]
description = "Generate Astro content and TypeScript metadata."
dir = "{{config_root}}/docs"
run = "bun --bun astro sync"

[tasks."docs:build"]
description = "Build the documentation site and validate its links and fragments."
dir = "{{config_root}}/docs"
run = ["bun --bun astro build", "bun scripts/links.ts"]

[tasks."docs:dev"]
alias = "dev"
description = "Generate references and serve the documentation locally."
dir = "{{config_root}}/docs"
run = "bun --bun astro dev"

[tasks."ci:swiftformat"]
description = "Prepare and exercise SwiftFormat on Windows."
run = "bun tests/support/cli/swiftformat.ts"

[tasks."site:verify-release"]
description = "Verify that documentation describes a published stable release."
run = "bun docs/scripts/verify-release.ts"

[tasks."release:publish"]
description = "Validate and publish packages to the selected registry."
run = "bun packages/cli/publish.ts"

[tasks."generate:schema"]
description = "Generate the configuration schema, or validate it with --check."
run = "bun packages/cli/schemas.ts"

[tasks."build:grammar"]
description = "Build the pinned Swift grammar using Docker, or compare it with --check."
tools = {tree-sitter = "0.25.10"}
run = "bun packages/cli/grammars/swift.build.ts"
