min_version = "2026.8.8"

[settings]
# Repository tasks execute the CLI source before a release exists.
disable_tools = ["github:stefanionescu/gspot"]

# Tasks use installed tools; native provisioning is an explicit development step.
[settings.task]
run_auto_install = false

[settings.npm]
package_manager = "npm"

[tools]
bats = "1.14.0"
bun = "1.4.2"
node = "24.20.0"
deno = "2.6.6"
hadolint = "2.14.0"
trivy = "0.69.3"
ruff = "0.16.8"
"pipx:pytest" = {version = "9.1.1", depends = ["uv"], uvx_args = "--with pytest-cov==7.1.0"}
"pipx:sqlfluff" = "4.0.0"
swiftlint = {version = "0.63.2", os = ["linux", "macos"]}
swiftformat = {version = "0.61.1", no_app = true, rename_exe = "swiftformat"}
periphery = {version = "3.6.0", os = ["macos"]}
"github:sbdchd/squawk" = "2.64.0"
