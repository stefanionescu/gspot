[tools]
bun = "1.4.2"
node = "24.20.0"

[tasks.setup]
description = "Install the locked packages, build both npm packages, and write the docs site types."
run = ["bun install --frozen-lockfile", "mise run build", "bun --cwd {{config_root}}/docs --bun astro sync"]

[tasks.build]
description = "Build both npm packages: the CLI with its grammar files, and the ESLint plugin."
run = "bun scripts/build.ts"

[tasks.test]
description = "Run the unit tests."
depends = ["build"]
run = '''bun test --parallel --timeout {{ exec(command="bun --eval \"import { TEST_TIMEOUT_MS } from './tests/config/processes.ts'; console.log(TEST_TIMEOUT_MS)\"") }} tests/unit'''

[tasks."test:integration"]
description = "Run gspot with the pinned tools installed, on sample repositories."
depends = ["build"]
run = '''bun test --parallel --timeout {{ exec(command="bun --eval \"import { TEST_TIMEOUT_MS } from './tests/config/processes.ts'; console.log(TEST_TIMEOUT_MS)\"") }} --preload ./tests/setup/preload.ts --preload ./tests/setup/integration.ts tests/integration'''

[tasks."test:e2e"]
description = "Install both packed npm packages in a new project and test them there."
depends = ["build"]
run = '''bun test --parallel --timeout {{ exec(command="bun --eval \"import { TEST_TIMEOUT_MS } from './tests/config/processes.ts'; console.log(TEST_TIMEOUT_MS)\"") }} --preload ./tests/setup/preload.ts --preload ./tests/setup/integration.ts tests/e2e'''

[tasks."update:rule-lists"]
description = "Copy the rule lists of the pinned linter packages into packages/cli/configurations. Run after changing a linter version."
run = "bun scripts/update-rule-lists.ts"

[tasks."build:docs"]
description = "Build the docs site."
depends = ["build"]
dir = "{{config_root}}/docs"
run = "bun --bun astro build"

[tasks."serve:docs"]
description = "Serve the docs site on your computer."
depends = ["build"]
dir = "{{config_root}}/docs"
run = "bun --bun astro dev"
