[settings.npm]
package_manager = "npm"

[tools]
bats = "1.14.0"
bun = "1.3.11"
node = "24.20.0"
uv = "0.12.13"
deno = "2.6.6"
hadolint = "2.14.0"
trivy = "0.69.3"
ruff = "0.16.8"
"pipx:ansible-lint" = "26.8.0"
"pipx:basedpyright" = "1.40.1"
"pipx:deptry" = "0.25.1"
"pipx:gixy-ng" = "0.2.53"
"pipx:import-linter" = "2.15"
"pipx:pydoclint" = "0.9.1"
"pipx:pytest" = {version = "9.1.1", depends = ["uv"], uvx_args = "--with pytest-cov==7.1.0"}
"pipx:sqlfluff" = "4.0.0"
"pipx:validate-pyproject" = "0.26"
"pipx:vulture" = "2.16"
swiftlint = {version = "0.63.2", os = ["linux", "macos"]}
swiftformat = {version = "0.61.1", no_app = true, rename_exe = "swiftformat"}
periphery = {version = "3.6.0", os = ["macos"]}
"github:sbdchd/squawk" = "2.64.0"

[env]
GSPOT_BIN = "bun {{config_root}}/packages/cli/src/main.ts"

[tasks."gspot:setup"]
description = "Install repository dependencies and prepare gspot"
run = ["mise install", "bun install --frozen-lockfile", "bun packages/eslint-plugin/build.ts", "bun packages/cli/src/main.ts apply"]

[tasks."gspot:check"]
description = "Run gspot from repository source"
run = "bun packages/cli/src/main.ts check"
