[settings]
# Repository tasks run the CLI source, so mise does not install the published package.
disable_tools = ["npm:@gspothq/cli"]

# `mise run` does not install missing tools. Run `mise install` first.
[settings.task]
run_auto_install = false

# Use npm to acquire npm tools without depending on the package manager of the consuming project.
[settings.npm]
package_manager = "npm"

# Hooks run `mise exec -- gspot`. The launcher in scripts/ runs the source CLI.
[env]
_.path = ["{{config_root}}/scripts"]

# gspot-tools.toml pins the applicable repository tools. Test suites install the remaining manifest pins.
[tools]
bun = "1.4.2"
[tasks."install:checks"]
description = "Install locked repository checks with the current workspace plugin."
run = "bun scripts/plugin.ts install --refresh-lockfiles"

[tasks.setup]
description = "Install locked dependencies, write grammars, build the plugin, and generate Astro types."
run = ["bun install --frozen-lockfile", "bun packages/cli/scripts/grammars.ts"]
depends_post = ["generate:docs", "build:plugin"]

[tasks."pin:eslint-presets"]
description = "Refresh shipped ESLint preset data from the installed pinned tool project."
run = "bun scripts/eslint-presets.ts .gspot"

[tasks."check:pins"]
description = "Check that every tool pin of the configuration manifests exists in its registry."
run = "bun scripts/pins.ts"

[tasks."check:types"]
description = "Check workspace and documentation TypeScript types."
depends = ["generate:docs"]
run = ["bunx tsc --noEmit -p tsconfig.json", "bunx tsc --noEmit -p packages/cli/tsconfig.json", "bunx tsc --noEmit -p packages/eslint-plugin/tsconfig.json", "bunx tsc --noEmit -p docs/tsconfig.json"]

[tasks."build:cli"]
description = "Build the gspot package into packages/cli/dist, with its grammars."
run = "bun packages/cli/scripts/build.ts"

[tasks."build:plugin"]
description = "Build the standalone ESLint plugin and include its license."
run = "bun packages/eslint-plugin/build.ts"

[tasks.test]
description = "Run deterministic CLI and plugin tests."
run = "bun scripts/plugin.ts cli"

[tasks."test:tools"]
description = "Run native compatibility tests with the selected tools installed."
run = "bun scripts/plugin.ts test"

[tasks."test:package"]
description = "Build and pack the CLI with the plugin, then test installed consumers."
run = "bun scripts/plugin.ts package"

[tasks."generate:docs"]
description = "Generate Astro content and TypeScript metadata."
dir = "{{config_root}}/docs"
run = "bun --bun astro sync"

[tasks."build:docs"]
description = "Build the documentation site."
dir = "{{config_root}}/docs"
run = "bun --bun astro build"

[tasks.dev]
description = "Generate references and serve the documentation locally."
dir = "{{config_root}}/docs"
run = "bun --bun astro dev"

[tasks.check]
description = "Run the repository checks."
run = "bun packages/cli/src/main.ts check"

[tasks."check:fix"]
description = "Correct findings from repository checks."
run = "bun packages/cli/src/main.ts check --fix"

[tasks.build]
description = "Build the CLI, plugin, and documentation."
depends = ["build:cli", "build:plugin", "build:docs"]
