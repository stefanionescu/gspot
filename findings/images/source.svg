<text x="997" y="1560" class="small">config/ and types/ mirror these behavioral owners.</text>
<rect x="1840" y="230" width="905" height="1395" rx="16" fill="#f7f9fc" stroke="#d6dfe8" stroke-width="2"/>
<text x="1868" y="285" class="heading">Package and asset ownership</text>
<text x="1867" y="343" class="label">packages/cli/src/config/</text>
<text x="1867" y="376" class="mono">Static declarations grouped by behavior</text>
<text x="1867" y="425" class="label">packages/cli/src/types/</text>
<text x="1867" y="458" class="mono">Types grouped by their actual owners</text>
<text x="1867" y="507" class="label">packages/cli/configurations/</text>
<text x="1867" y="540" class="mono">Shipped assets, not source parsers</text>
<text x="1867" y="589" class="label">Asset categories</text>
<text x="1867" y="622" class="mono">database/ · framework/ · general/ · infra/</text>
<text x="1867" y="671" class="mono">language/ · library/ · platform/ · test/</text>
<text x="1867" y="720" class="label">packages/eslint-plugin/src/</text>
<text x="1867" y="753" class="mono">public.ts · create-rule.ts · comments.ts</text>
<text x="1867" y="802" class="mono">environment.ts · imports.ts · layout.ts</text>
<text x="1867" y="851" class="mono">syntax.ts · rules/public.ts</text>
<text x="1867" y="900" class="label">Plugin config/</text>
<text x="1867" y="933" class="mono">Native rule constants and static declarations</text>
<text x="1867" y="982" class="label">Plugin types/</text>
<text x="1867" y="1015" class="mono">Native rule contracts and inferred types</text>
<text x="1867" y="1064" class="label">Parser and writer ownership</text>
<text x="1867" y="1097" class="mono">Preserve native parsing and serialization</text>
<text x="1867" y="1146" class="label">Commands</text>
<text x="1867" y="1179" class="mono">Keep every CLI command</text>
<text x="1867" y="1228" class="label">Static ownership</text>
<text x="1867" y="1261" class="mono">Flatten one-file mirrors into their parent</text>
<text x="1867" y="1310" class="label">Public ownership</text>
<text x="1867" y="1343" class="mono">No aliases, re-exports or compatibility paths</text>
<text x="1867" y="1557" class="small">Folder names follow the final glossary and decisions.</text>
<line x1="55" y1="1680" x2="2745" y2="1680" stroke="#d6dfe8" stroke-width="2"/>
<text x="55" y="1732" class="note">Decision: config/ and types/ remain in every package; each concern retains one owner.</text>
<text x="55" y="1778" class="note">Source: findings/review/source-layout.md, “Proposed target tree”; findings/progress.json, strict-repository-public-api-owners.</text>
<text x="55" y="1824" class="note">The full historical tree and rationale remain in the source-layout review. This view applies the higher-priority public API paths.</text>
