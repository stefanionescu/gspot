<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1910" viewBox="0 0 2800 1910">
<title>Source ownership target</title>
<desc>The source-layout target reconciled with the strict public API owner decision. CLI runtime layers run from platform through commands and the main entry point. Each package retains static config and type owners. Parser format schemas, policy table schemas and the ownership log schema have separate homes. Shipped assets live in packages/cli/configurations. Runtime paths and plugin declarations are checked against committed 214e4bb2; this diagram makes no file-count or complete-migration claim.</desc>
<rect width="2800" height="1910" fill="#ffffff"/>
<style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#202a34}.title{font-size:54px;font-weight:700}.subtitle{font-size:28px;fill:#506071}.heading{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:600}.mono{font-family:Menlo,monospace;font-size:23px}.note{font-size:24px;fill:#506071}.small{font-size:21px;fill:#506071}</style>
<text x="55" y="87" class="title">The source ownership target</text>
<text x="55" y="138" class="subtitle">Source-layout review · strict public API owner decision · committed paths at 214e4bb2</text>
<text x="55" y="183" class="subtitle">config/ and types/ stay. Shipped assets use configurations/. Historical private paths yield to substantive public owners.</text>
<rect x="55" y="230" width="885" height="1395" rx="16" fill="#f7f9fc" stroke="#d6dfe8" stroke-width="2"/>
