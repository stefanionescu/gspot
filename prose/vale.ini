# Vale configuration for the gspot rule corpus and the docs. StylesPath is relative to this file.
StylesPath = styles
MinAlertLevel = error
SkippedScopes = script, style, pre, figure, table

[*.md]
BasedOnStyles = gspot
# Front matter is not prose; code and tables are the parser's job.
BlockIgnores = (?s)^---\n.*?\n---\n
