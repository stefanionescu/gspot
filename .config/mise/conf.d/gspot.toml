# Change policy: gspot set / allow / ignore, or edit gspot.toml, then run: gspot apply

[tools]
ast-grep = "0.45.3"
editorconfig-checker = "3.4.0"
lychee = "0.24.2"
"npm:markdownlint-cli2" = "0.23.2"
shellcheck = "0.11.0"
shfmt = "3.12.0"
typos = "1.43.5"
vale = "3.21.0"

[tasks."gspot:check"]
description = "Run every check"
run = "gspot check"

[tasks."gspot:fix"]
description = "Apply every fixer, then check again"
run = "gspot check --fix"

[tasks."gspot:apply"]
description = "Re-render the generated files from gspot.toml"
run = "gspot apply"

[tasks."gspot:doctor"]
description = "Report tools, unchecked files and what changed since init"
run = "gspot doctor"

[tasks."gspot:setup"]
description = "Install the pinned tools, then the hooks and rule files"
run = ["mise install", "gspot apply"]
