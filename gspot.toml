#:schema https://generativespotting.com/schema/gspot.schema.json

# Run gspot apply after changing policy. Use gspot explain <name> to inspect a setting.

level = "all"
configurations = ["spelling", "typescript", "prose", "commits", "github-actions", "naming", "docs", "secrets", "dependencies", "licenses", "duplication", "security", "engineering", "files", "markdown", "format", "gspot", "structure", "javascript", "repository", "python"]
runner = "mise"

[scope.docs]
configurations = ["css", "astro", "javascript", "zod", "cloudflare", "site"]

[scope.docs.site]
build_command = ["bun", "--bun", "astro", "build"]

[scope."packages/cli"]
configurations = ["javascript", "zod"]

[scope."packages/eslint-plugin"]
configurations = ["javascript"]

[scope.tests]
configurations = ["javascript", "python"]
removed_configurations = ["astro", "jest", "nestjs", "nextjs", "react", "react-dom", "svelte", "vitest", "vue"]

[hooks]
enabled = true

[naming]
banned = ["catalog", "catalogue", "corpus", "render", "sync", "synchronize", "materialize", "coerce", "scoped", "bind", "load", "loaded", "loader", "loaders", "loading", "fetch", "resolve", "resolving", "resolution", "probe", "probes", "probed", "probing", "fixture", "fixtures", "shell"]

[[naming.overrides]]
allowed = ["may_import", "tool_timeout_seconds", "agent_rules", "test_files", "removed_configurations"]
paths = ["packages/cli/src/types/policy/settings.ts"]
reason = "These declarations use the exact public TOML policy keys."

[[naming.overrides]]
allowed = ["object"]
paths = ["packages/cli/src/types/repository/revisions.ts"]
reason = "The pre-push JSON report names Git object identities with this key."

[[naming.overrides]]
allowed = ["object"]
paths = ["packages/cli/src/types/commands/check.ts"]
reason = "The pre-push JSON report names Git object identities with this key."

[[naming.overrides]]
allowed = ["C"]
paths = ["packages/cli/src/types/commands/program.ts"]
reason = "Commander names the value of the -C flag after its letter, which Git uses for the same flag."

[[naming.overrides]]
allowed = ["DefElem", "List", "String", "FunctionParameter"]
paths = ["packages/cli/src/types/checks/language/sql.ts"]
reason = "libpg-query AST tags spell these keys."

[[naming.overrides]]
allowed = ["shouldTranslate"]
paths = ["packages/cli/src/parsers/schema/xcode.ts"]
reason = "Xcode string files spell this key."

[[naming.overrides]]
allowed = ["lengthBytesUTF8", "stringToUTF8", "UTF8ToString", "_malloc", "_free", "_wasm_parse_query_raw", "_wasm_parse_plpgsql", "_wasm_free_string", "_wasm_free_parse_result", "stmt_location", "stmt_len"]
paths = ["packages/cli/src/types/parsers/sql.ts"]
reason = "Emscripten and libpg-query export these members."

[[naming.overrides]]
allowed = ["FunctionParameter"]
paths = ["packages/cli/src/checks/language/sql.ts"]
reason = "The libpg-query AST tag for a function parameter."

[[naming.overrides]]
allowed = ["404"]
paths = ["docs/src/content/docs/404.md"]
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.overrides]]
allowed = ["MD007"]
paths = ["tests/cli/generation/formatting.test.ts"]
reason = "The markdownlint rule name."

[[naming.overrides]]
allowed = ["rule_id"]
paths = ["tests/tools/generation/parameter-limits.test.ts"]
reason = "The SwiftLint JSON diagnostic key."

[[naming.overrides]]
allowed = ["allowed", "exceptions"]
paths = ["tests/cli/generation/licenses.test.ts"]
reason = "The license scanner policy keys."

[[naming.overrides]]
allowed = ["with"]
paths = ["tests/cli/commands/ci.test.ts"]
reason = "The GitHub Actions inputs key."

[[naming.overrides]]
allowed = ["MD007", "customSyntax"]
paths = ["tests/types/cli/generation/configuration-files.ts"]
reason = "Markdownlint names its indentation rule MD007. Stylelint names its parser option customSyntax. These native configuration keys retain their exact API spelling."

[[naming.overrides]]
allowed = ["with"]
paths = ["tests/types/cli/generation/ci.ts"]
reason = "GitHub Actions uses with as the key for action inputs."

[[naming.overrides]]
allowed = ["rule_id"]
paths = ["tests/types/tools/generation/parameter-limits.ts"]
reason = "SwiftLint JSON diagnostics identify the native rule using rule_id."

[[naming.overrides]]
allowed = ["swift-snapshot-testing", "swift-snapshot-testing.test"]
paths = ["tests/cli/checks/library/swift-snapshot-testing.test.ts", "tests/config/cli/checks/library/swift-snapshot-testing.ts", "packages/cli/src/checks/library/swift-snapshot-testing.ts", "packages/cli/src/config/checks/swift-snapshot-testing.ts"]
reason = "These files test the swift-snapshot-testing library configuration and use its exact public name."

[[naming.overrides]]
allowed = ["removed_configurations"]
paths = ["packages/cli/src/types/configurations.ts"]
reason = "This selection contract uses the public TOML key for manual configuration removals."

# A CLI layer imports itself and the layers named in its imports_allowed entry. Its config and types files belong to the same layer.
[[architecture.modules]]
may_import = ["platform", "commands", "main"]
name = "main"
paths = ["packages/cli/src/main.ts"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "agent-rules", "planning", "generation", "tools", "lifecycle", "execution", "checks", "terminal", "commands"]
name = "commands"
paths = ["packages/cli/src/public.ts", "packages/cli/src/commands/**", "packages/cli/src/config/commands/**", "packages/cli/src/types/commands/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "planning", "generation", "tools", "lifecycle", "execution", "checks"]
name = "checks"
paths = ["packages/cli/src/checks/**", "packages/cli/src/config/checks/**", "packages/cli/src/types/checks/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "execution", "terminal"]
name = "terminal"
paths = ["packages/cli/src/terminal/**", "packages/cli/src/config/terminal.ts", "packages/cli/src/types/terminal.ts"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "planning", "tools", "lifecycle", "execution"]
name = "execution"
paths = ["packages/cli/src/execution/**", "packages/cli/src/config/execution/**", "packages/cli/src/types/execution/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "planning", "generation", "tools", "lifecycle"]
name = "lifecycle"
paths = ["packages/cli/src/lifecycle/**", "packages/cli/src/config/lifecycle/**", "packages/cli/src/types/lifecycle/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "agent-rules", "planning", "generation"]
name = "generation"
paths = ["packages/cli/src/generation/**", "packages/cli/src/config/generation/**", "packages/cli/src/types/generation/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "planning"]
name = "planning"
paths = ["packages/cli/src/planning/**", "packages/cli/src/config/planning.ts", "packages/cli/src/types/planning.ts"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "planning", "generation", "tools"]
name = "tools"
paths = ["packages/cli/src/tools/**", "packages/cli/src/config/tools/!(vale).ts", "packages/cli/src/types/tools/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy"]
name = "policy"
paths = ["packages/cli/src/policy/**", "packages/cli/src/config/policy/**", "packages/cli/src/types/policy/**"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository", "policy", "agent-rules"]
name = "agent-rules"
paths = ["packages/cli/src/agent-rules/**", "packages/cli/src/config/agent-rules.ts", "packages/cli/src/types/agent-rules.ts"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations"]
name = "configurations"
paths = ["packages/cli/src/configurations/**", "packages/cli/src/parsers/schema/configurations.ts", "packages/cli/src/config/configurations.ts", "packages/cli/src/config/tools/vale.ts", "packages/cli/src/types/configurations.ts"]

[[architecture.modules]]
may_import = ["platform", "parsers", "configurations", "repository"]
name = "repository"
paths = ["packages/cli/src/repository/**", "packages/cli/src/config/repository/**", "packages/cli/src/types/repository/**"]

[[architecture.modules]]
may_import = ["platform", "parsers"]
name = "parsers"
paths = ["packages/cli/src/parsers/*.ts", "packages/cli/src/parsers/!(schema)/**", "packages/cli/src/parsers/schema/!(configurations).ts", "packages/cli/src/parsers/schema/python/**", "packages/cli/src/config/parsers/**", "packages/cli/src/types/parsers/**"]
reason = "Tool-output parsing consumes validated configuration declarations to interpret native versions without copying the tool metadata contract."

[[architecture.modules]]
may_import = ["platform"]
name = "platform"
paths = ["packages/cli/src/platform/**", "packages/cli/src/config/platform/**", "packages/cli/src/types/platform/**"]

# The ESLint plugin is one more element, which neither imports the CLI nor is imported by it.
[[architecture.modules]]
may_import = ["plugin"]
name = "plugin"
paths = ["packages/eslint-plugin/src/**", "packages/eslint-plugin/build.ts"]

[architecture.roles]
config = ["packages/*/src/config/**", "tests/config/**", "scripts/config/**", "docs/src/config/**"]
env = ["packages/cli/src/platform/public.ts", "tests/harness/environment.ts"]
runtime = ["packages/*/src/**"]
scripts = ["scripts/**", "packages/*/scripts/**", "docs/src/content/reference/**"]
test_harness = "tests/harness"
tests = ["tests/cli/**", "tests/plugin/**", "tests/tools/**", "tests/packages/**", "**/*.test.*"]
types = ["packages/*/src/types/**", "tests/types/**", "scripts/types/**", "docs/src/types/**"]

[dependencies]
scanner = "@socketsecurity/bun-security-scanner"

[licenses]
allowed = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Unlicense", "BlueOak-1.0.0", "Python-2.0"]

[licenses.exceptions."@csstools/selector-specificity@5.0.0"]
license = "MIT-0"
reason = "The CSS tooling dependency uses the MIT No Attribution license; its installed package retains the license text."

[licenses.exceptions."@fontsource-variable/geist-mono@5.3.0"]
license = "OFL-1.1"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[licenses.exceptions."@fontsource-variable/geist@5.3.0"]
license = "OFL-1.1"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[licenses.exceptions."axe-core@4.13.0"]
license = "MPL-2.0"
reason = "The JSX accessibility lint plugin requires this unmodified development dependency. Its installed LICENSE identifies MPL-2.0; it is not included in the gspot package."

[licenses.exceptions."eslint-plugin-sonarjs@4.2.0"]
license = "LGPL-3.0-only"
reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the gspot package."

[licenses.exceptions."lightningcss@1.33.0"]
license = "MPL-2.0"
reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."

