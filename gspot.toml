#:schema https://gspot.dev/schema/gspot.schema.json

# Run gspot apply after changing policy. Use gspot explain <name> to inspect a setting.

version = 1
level = "all"
configurations = ["jest", "bash", "spelling", "typescript", "markdown", "prose", "commits", "configs", "naming", "formatting", "docs", "secrets", "dependencies", "licenses", "duplication", "security"]

[[scope]]
path = "packages/cli"
configurations = []

[[scope]]
path = "packages/eslint-plugin"
configurations = []

[[scope]]
path = "docs"
configurations = ["typescript"]

[hooks]
tool = "gspot"

[rules]
install = true
directory = ".gspot/rules"

[coverage]
strict = true

[runner]
tool = "mise"

[tools]

[tools.docs]
paths_allowed = [
    {patterns = ["packages/cli/rules/**"], reason = "The rule corpus is generic text installed into other repositories; it names nothing in this one."},
    {patterns = ["architecture/**"], reason = "The architecture names files in other repositories and files that are not built yet."},
    {patterns = ["docs/**"], reason = "The manual names files in the reader's repository and check ids written with a slash."},
]

[tools.lychee]
exclude_paths = [{paths = ["docs/src/content/docs/**"], reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."}]

[tools.typos]
words = [{word = "udid", reason = "Apple's device identifier API name."}, {word = "certifi", reason = "The Python certificate package name."}, {word = "axe", reason = "The axe-core accessibility package name."}, {word = "Virtua", reason = "The Virtua list virtualisation library."}, {word = "virtua", reason = "The Virtua list virtualisation library."}, {word = "synchronise", reason = "British spellings the naming policy bans on purpose."}, {word = "synchronised", reason = "British spellings the naming policy bans on purpose."}, {word = "materialise", reason = "British spellings the naming policy bans on purpose."}, {word = "IFEs", reason = "The ESLint option name for immediately invoked functions."}, {word = "IIF", reason = "The word typos sees inside the ESLint option IIFEs."}, {word = "capitalisation", reason = "The sqlfluff rule group is spelled capitalisation in its own configuration keys."}, {word = "speling", reason = "A configuration name misspelled on purpose in the profile test."}]
exclude = [
    {paths = ["packages/cli/configurations/policy/prose/styles/gspot/us-english.yml"], reason = "A list of British spellings mapped to their US forms."},
    {paths = ["tests/acceptance/source/cli/spelling.test.ts", "tests/integration/cli/lifecycle/init.test.ts", "tests/integration/tools/generation/spelling.test.ts", "tests/integration/cli/generation/selection.test.ts", "tests/integration/tools/policy/adoption/native.test.ts", "tests/integration/cli/policy/adoption/native.test.ts", "tests/integration/cli/profile.test.ts", "tests/integration/tools/profile.test.ts", "tests/integration/cli/execution/fixers.test.ts", "tests/integration/tools/execution/fixers.test.ts", "tests/integration/tools/execution/parse-output.test.ts", "tests/integration/cli/execution/parse-output.test.ts"], reason = "These spelling and adoption fixtures retain deliberately misspelled words and British variants to verify findings, corrections, and preservation."},
    {paths = ["tests/unit/cli/parsers/sql.test.ts"], reason = "The SQL parser fixtures retain an intentionally misspelled SELECT token to verify PostgreSQL syntax diagnostics."},
    {paths = ["packages/cli/configurations/policy/spelling/manifest.toml"], reason = "The shipped spelling example pairs a deliberately misspelled word with its correction."},
]

[[naming.rules]]
paths = ["packages/cli/src/checks/security/gitleaks-baseline.ts"]
names = ["Fingerprint", "File", "RuleID", "Commit"]
exclude = true
reason = "gitleaks writes these keys in its report and its baseline, and the type names them as they are."

[[naming.rules]]
paths = ["packages/cli/src/checks/dependencies/manifest-policy.ts"]
names = ["packageManager"]
exclude = true
reason = "package.json names the key packageManager, and the code reads it under that name."

[[naming.rules]]
paths = ["packages/cli/src/parsers/sql/types.ts"]
names = ["lengthBytesUTF8", "stringToUTF8", "UTF8ToString", "_malloc", "_free", "_wasm_parse_query_raw", "_wasm_free_parse_result", "stmt_location", "stmt_len"]
exclude = true
reason = "Emscripten and libpg-query name these members, and the type spells them as the module exports them."

[[naming.rules]]
paths = ["packages/cli/src/checks/xcode/types.ts"]
names = ["shouldTranslate"]
exclude = true
reason = "Xcode writes this key in a string file, and the type spells it as the file does."

[architecture]
roles = {env = "packages/cli/src/platform/environment.ts"}

[tools.eslint]
import_style = {"**/*" = "ts"}
script_files = ["packages/npm/**", "packages/cli/build/**", "packages/eslint-plugin/build.ts", "docs/src/content/reference/**"]
globals = {"packages/npm/**" = "commonjs"}
node_version = ">=24.2.0"

[tools.knip]
entry = ["**/build.ts", "packages/cli/build/command.ts", "packages/cli/build/inputs.ts", "**/publish.ts", "packages/cli/src/agents/lint.ts", "packages/npm/gspot.js", "docs/src/content/reference/loader.ts", "docs/astro.config.ts", "docs/src/content.config.ts", "docs/src/route-metadata.ts"]
ignore_dependencies = [{name = "@fontsource-variable/geist", reason = "The site imports this font from docs/src/styles/theme.css, outside the TypeScript import graph."}, {name = "@fontsource-variable/geist-mono", reason = "The site imports this font from docs/src/styles/theme.css, outside the TypeScript import graph."}, {name = "html-validate", reason = "Native site-output compatibility tests invoke its installed executable."}, {name = "linkinator", reason = "Native site-output compatibility tests invoke its installed executable."}, {name = "purgecss", reason = "Native site-output compatibility tests invoke its installed executable."}, {name = "eslint-plugin-expo", reason = "The ESLint configuration of the planted react-native test repository imports it."}, {name = "@nestjs/common", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "@nestjs/core", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "reflect-metadata", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "rxjs", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "eslint-plugin-vue", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "vue-eslint-parser", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "eslint-plugin-svelte", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "svelte-eslint-parser", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "svelte", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "@types/node", reason = "Next.js refuses to write its types in the planted test repository when the package is absent."}, {name = "next", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "react", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "react-dom", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "@types/react", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "@next/eslint-plugin-next", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-react-hooks", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-react", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-i18next", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-zod", reason = "The ESLint configuration of the planted libraries test repository imports it."}, {name = "@tanstack/eslint-plugin-query", reason = "The ESLint configuration of the planted libraries test repository imports it."}, {name = "eslint-plugin-drizzle", reason = "The ESLint configuration of the planted libraries test repository imports it."}, {name = "stylelint", reason = "The planted css test runs it in a test repository, which knip cannot see."}, {name = "stylelint-config-standard", reason = "The stylelint configuration of a planted test repository extends it."}, {name = "vitest", reason = "The planted vitest test runs it in a test repository, which knip cannot see."}, {name = "@vitest/coverage-v8", reason = "The planted vitest test needs the coverage provider in a test repository."}, {name = "@vitest/eslint-plugin", reason = "The ESLint configuration of a planted test repository imports it."}, {name = "tree-sitter-bash", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-css", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-html", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-javascript", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-python", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-typescript", reason = "The grammar WASM file is read from the package, not imported."}]

[structure]
folder_name_allowed = [{paths = ["packages/cli/src/checks/python", "packages/cli/src/checks/swift", "packages/cli/src/checks/typescript"], reason = "Language names identify the implemented check and parser domains in the architecture ownership layout."}]
single_file_folder_allowed = [{paths = ["packages/npm"], reason = "The npm launcher package is one file by design: it runs the platform package that installed."}]
prefix_collision_allowed = [{paths = ["packages/eslint-plugin/src/rules/**", "tests/unit/plugin/rules/**"], reason = "ESLint rule ids are the file names, and the ids share their first word by convention."}, {paths = ["docs/src"], reason = "Astro fixes the name of the content configuration file beside the content folder."}]

# The rule corpus is this repository's product; its lint is this repository's check and ships in no binary.
[[check]]
name = "rules/lint"
command = ["bun", "packages/cli/src/agents/lint.ts"]
paths = ["packages/cli/rules/**", "packages/cli/src/agents/**"]
stage = "commit"
summary = "Lints rule files for front matter, links, size, layer boundaries, and fences."

[tools.licenses]
packages_allowed = [{package = "@csstools/selector-specificity@5.0.0", license = "MIT-0", reason = "The CSS tooling dependency uses the MIT No Attribution license; its installed package retains the license text."}, {package = "@fontsource-variable/geist@5.3.0", license = "OFL-1.1", reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."}, {package = "@fontsource-variable/geist-mono@5.3.0", license = "OFL-1.1", reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."}, {package = "eslint-plugin-sonarjs@4.2.0", license = "LGPL-3.0-only", reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the binary."}, {package = "lightningcss@1.33.0", license = "MPL-2.0", reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."}, {package = "truncate-utf8-bytes@1.0.2", license = "WTFPL", reason = "A permissive license with no conditions; it arrives through a test tool and ships in nothing."}]

[tools.osv]
ignore = [{id = "GHSA-w5hq-g745-h8pq", reason = "uuid 9 arrives through gaxios under linkinator, a test tool. The flaw needs a caller that passes its own buffer, and gaxios passes none. Review when linkinator moves to uuid 11."}]

[tools.jest]
global_package = "bun:test"

[[ignore]]
check = "jest/coverage"
reason = "This repository runs Bun tests. tests/unit runs unit and integration tests at push; tests/coverage measures their coverage with Bun instead of invoking Jest."

[[check]]
name = "tests/unit"
command = ["mise", "run", "test"]
paths = ["packages/cli/**", "packages/eslint-plugin/**", "tests/**", ".mise/gspot/**", "packages/cli/configurations/**", "packages/cli/rules/**", "package.json", "bun.lock", "tsconfig.json", "mise.toml", "docs/**", ".mise/conf.d/repo.toml"]
stage = "push"
summary = "Runs the routine unit and integration suites, including CLI, plugin, and documentation tests."

[check.output]
format = "none"

[[check]]
name = "tests/coverage"
command = ["mise", "run", "test:coverage"]
paths = ["packages/cli/**", "packages/eslint-plugin/**", "tests/**", ".mise/gspot/**", "packages/cli/configurations/**", "packages/cli/rules/**", "package.json", "bun.lock", "tsconfig.json", "mise.toml", "docs/**", ".mise/conf.d/repo.toml"]
stage = "manual"
summary = "Measures unit and integration coverage with Bun without imposing a percentage quota."

[check.output]
format = "none"
