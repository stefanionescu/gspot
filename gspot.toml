level = "all"
configurations = ["typescript", "markdown", "github-actions", "bash"]

[hooks]
enabled = true

[ci]
setup_command = ["mise", "run", "setup"]
enabled = true

[naming]
banned_words = ["catalog", "corpus", "render", "sync", "materialize", "coerce", "scoped", "bind", "load", "fetch", "resolve", "probe", "fixture", "shell", "diagnostic", "directory", "envelope", "outcome", "emit", "violation", "problem", "tooling", "implementation", "candidate", "fragment", "invocation", "lexeme", "substantial", "substance", "floor", "hint", "sink", "inputs", "memo", "collect", "summarize", "verdict", "your", "odd", "qa", "cfg", "obsolete", "release hold", "installed root", "working folder", "root path", "entry", "entries", "item", "items", "part", "parts", "data", "known", "declared", "needed", "prepared", "pinned", "existing", "current", "extra", "complete", "whole", "plain", "raw", "full", "real", "additional", "given", "retained", "observed", "computed", "actual", "effective", "original", "specific", "captured", "recorded", "chosen", "internal", "helper", "helpers", "util", "utils", "payload", "fallback", "attempt", "normalized", "expanded", "composed", "thing", "things", "misc", "info", "details", "meta", "stuff", "perform", "execute", "ensure", "wrapper", "temp", "tmp", "various", "several", "certain", "resulting", "handled", "wrapped", "underlying", "corresponding", "relevant", "appropriate", "proper", "basic", "generic", "overall"]

[[naming.override]]
paths = ["docs/src/content/docs/404.md"]
allow_digits = true
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.override]]
paths = ["tests/types/integration.ts"]
allowed_names = ["rule_id"]
reason = "SwiftLint JSON diagnostics identify the native rule using rule_id."

[[naming.override]]
paths = ["packages/cli/src/types/commands/edits.ts", "packages/cli/src/types/configurations/general.ts", "packages/cli/src/types/configurations/infrastructure.ts", "packages/cli/src/types/configurations/language.ts", "packages/cli/src/types/engine/plan.ts", "packages/cli/src/types/engine/tool-runs.ts", "packages/cli/src/types/engine/run.ts", "packages/cli/src/types/manifests.ts", "packages/cli/src/types/repository.ts", "packages/cli/src/types/tools.ts", "packages/cli/src/types/settings.ts"]
categories = ["properties"]
allowed_names = ["default_all", "language_defaults", "path_role", "reason_values", "reason_when", "removed_configurations", "test_files"]
reason = "These properties retain the serialized gspot.toml, configuration manifest and tool report field names."

[[naming.override]]
paths = ["packages/eslint-plugin/src/rules/variables/no-magic-numbers.ts"]
allowed_names = ["meta"]
reason = "ESLint names the description of a rule meta."

[[naming.override]]
paths = ["packages/cli/src/configurations/framework/site/checks/purgecss-process.ts"]
allowed_names = ["PurgeCSS"]
reason = "PurgeCSS exports its class under this exact name."

[[naming.override]]
paths = ["packages/cli/src/configurations/framework/svelte/checks.ts"]
categories = ["functions"]
allowed_names = ["checkSvelteCheck"]
reason = "Check functions start with check and spell the svelte/svelte-check check ID without repeating svelte."

[[naming.override]]
paths = ["packages/cli/src/configurations/platform/supabase/checks.ts"]
categories = ["functions"]
allowed_names = ["checkDenoCheck"]
reason = "Check functions start with check and spell the check name of supabase/deno-check."

[[naming.override]]
paths = ["tests/types/setup.ts"]
allowed_names = ["with"]
reason = "GitHub Actions calls its action argument record with."

[[naming.override]]
paths = ["packages/cli/src/configurations/general/data-files/generate.ts", "packages/cli/src/config/configurations/general.ts"]
allow_digits = true
reason = "v8r is the name of the tool."

[[naming.override]]
paths = ["packages/cli/src/types/configurations/language.ts"]
allowed_names = ["customSyntax"]
reason = "Stylelint names its parser option customSyntax."

[[naming.override]]
paths = ["packages/cli/src/types/parsers.ts", "packages/cli/src/types/tools.ts"]
allowed_names = ["objects"]
reason = "Xcode project files name the object table objects."

[[naming.override]]
paths = ["packages/cli/src/configurations/language/markdown/files/markdownlint-cli2.ts", "packages/cli/src/types/configurations/language.ts"]
allowed_names = ["markdownlint-cli2"]
reason = "The manifest names the source after its markdownlint-cli2 target, and the placeholder uses that name."

[[naming.override]]
paths = ["packages/cli/src/types/configurations/language.ts"]
allowed_names = ["getDocumentFragment"]
reason = "vue-eslint-parser names this parser service getDocumentFragment."

[[naming.override]]
paths = ["packages/cli/src/types/configurations/language.ts"]
allowed_names = ["parseForESLint"]
reason = "ESLint calls a custom parser through its parseForESLint method."

[[naming.override]]
paths = ["packages/eslint-plugin/src/rules/aws/aws-s3-bucket-versioning.ts"]
allowed_names = ["awsS3BucketVersioning"]
reason = "S3 is an allowed numeric word, and gspot 0.3.8 drops its digit before it tests the case."

[[naming.override]]
paths = ["docs/src/types/pages.ts"]
allowed_names = ["data"]
reason = "Astro content entries keep their fields in data."

[[naming.override]]
paths = ["packages/cli/src/config/configurations/builds.ts"]
allowed_names = ["DERIVED_DATA_FLAG", "DERIVED_DATA_FOLDER"]
reason = "Xcode names its build folder DerivedData and its flag -derivedDataPath."

[[naming.override]]
paths = ["packages/cli/src/configurations/language/python/generate.ts", "tests/suites/unit/cli/configurations/language/python/generate.test.ts"]
allowed_names = ["extraPaths"]
reason = "basedpyright names its import search setting extraPaths."

[[naming.override]]
paths = ["packages/cli/src/types/parsers.ts", "packages/cli/src/types/tools.ts"]
allowed_names = ["raw"]
reason = "toml-patch and the TypeScript compiler API name the source text raw."

[[naming.override]]
paths = ["packages/cli/src/config/configurations/javascript.ts", "packages/cli/src/configurations/language/javascript/knip.ts", "tests/types/configurations.ts"]
allowed_names = ["KNIP_JAVASCRIPT_ENTRY_FILES", "selectEntryFiles", "entry", "entries"]
reason = "knip names its start files entry, and tools.knip.entry passes them on."

[[naming.override]]
paths = ["packages/cli/src/types/commands/edits.ts", "packages/cli/src/types/commands/reports.ts", "packages/cli/src/types/settings.ts", "packages/cli/src/types/manifests.ts"]
allowed_names = ["reason_when"]
reason = "gspot list settings --json and the shipped setting definitions name this field reason_when."

[[naming.override]]
paths = ["packages/cli/src/configurations/general/data-files/**", "packages/cli/src/configurations/general/data-files/checks.ts", "packages/cli/src/types/configurations/general.ts", "packages/cli/src/configurations/general/data-files/generate.ts", "tests/suites/unit/cli/configurations/general/data-files.test.ts", "tests/config/integration/general.ts", "tests/suites/integration/configurations/general/data-files.test.ts"]
allowed_names = ["data-files", "data-files.test"]
reason = "These files and folders take the name of the data-files configuration."

[[naming.override]]
paths = ["tests/types/setup.ts"]
allowed_names = ["rootDir"]
reason = "The Next.js ESLint plugin names this setting rootDir."

[structure]
environment_readers = ["packages/cli/src/system/environment.ts", "tests/setup/system/environment.ts", "tests/setup/runner/unit.ts"]

[dependencies]
bun_scanner = "@socketsecurity/bun-security-scanner"

[docs]
allowed_urls = { value = ["^https://www\\.npmjs\\.com/package/@gspothq/cli$"], reason = "The npm package page returns HTTP 403 to automated requests." }

[licenses]
allowed = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "BlueOak-1.0.0", "Python-2.0", "MIT-0", "PSF-2.0"]

[[licenses.allowed_package]]
name = "@fontsource-variable/geist-mono"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist/mono.txt."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist/sans.txt."

[[licenses.allowed_package]]
name = "lightningcss"
version = "1.33.0"
reason = "Vite depends on it to build the docs site; the license binds changes to its own files, and none are made."

[spelling.allowed_words]
vertica = "SQLFluff names its Vertica dialect vertica."
IIF = "ESLint names immediately invoked functions IIFEs."
next-intl = "The next-intl package name."
udid = "Apple names the device identifier udid."
NGINX = "Official product name."
Stylelint = "Official product name."
pytest = "Official product name."
markdownlint = "Official product name."
React = "Official product name."
Native = "Part of the React Native product name."
Simple = "Part of the Simple Icons product name."
certifi = "The tests name the Python certificate bundle package certifi."
writeable = "ESLint accepts writeable as the value of a global."
styl = "The Stylus stylesheet extension is .styl."
USAGE = "mise uses USAGE in task argument directives."
xdescribe = "Jasmine, Jest, and Mocha name their disabled suite xdescribe."
ede = "OpenSSL names the Triple DES ciphers des-ede and des-ede3."

[javascript]
import_extension = "ts"
entry_files = ["tests/setup/runner/unit.ts", "tests/setup/programs/**/*.ts", "packages/eslint-plugin/src/plugin.ts", "tests/setup/runner/prepare.ts", "tests/setup/sandboxes/test-tools.ts", "tests/setup/runner/integration.ts", "packages/cli/src/configurations/framework/site/checks/purgecss-process.ts", "packages/cli/src/configurations/language/javascript/files/eslint-functions.ts", "packages/cli/src/bin.ts", "packages/cli/src/reference.ts", "packages/cli/src/configurations/language/markdown/files/markdownlint-cli2.ts", "packages/cli/src/configurations/framework/site/files/purgecss.ts"]

[tools.eslint.rules]
no-restricted-properties = [{ object = "Bun", property = "env" }, { object = "Deno", property = "env" }, { property = "localeCompare", message = "Use compareText for stable ordering." }]
"n/no-unpublished-import" = [{ ignoreTypeImport = true }]
"unicorn/consistent-boolean-name" = [{ checkFunctions = "never", ignore = ["^_", "^(?:enabled|active|retryable)$"] }]
"jsdoc/require-jsdoc" = [
    { enableFixer = false, publicOnly = true, require = { FunctionDeclaration = true, MethodDefinition = true }, contexts = [":matches(VariableDeclarator, AssignmentExpression, ExportDefaultDeclaration, PropertyDefinition) > :matches(ArrowFunctionExpression, FunctionExpression)"] },
]

[[scope]]
path = "docs"
configurations = ["css", "astro", "cloudflare", "site"]
site.build_command = ["bun", "--bun", "astro", "build"]
javascript.allowed_unused_dependencies = { value = ["satteri"], reason = "Astro prerender externalizes the native satteri loader in astro.config.ts." }

[[scope]]
path = "packages/cli"
configurations = ["zod"]

[[scope]]
path = "tests"
configurations = ["zod"]
javascript.allowed_unused_dependencies = { value = ["prettier", "stylelint", "html-validate"], reason = "The tests import the tool versions that gspot pins, which mise run setup installs in node_modules/.test-tools." }

[[import_rule]]
name = "cli-types"
paths = ["packages/cli/src/types/*.d.ts"]
can_import = ["system", "parsers", "manifests", "repository", "settings", "tools", "engine", "configurations", "generation", "commands", "main"]

[[import_rule]]
name = "system"
paths = ["packages/cli/src/system/**", "packages/cli/src/config/system.ts", "packages/cli/src/types/system.ts"]

[[import_rule]]
name = "parsers"
paths = ["packages/cli/src/parsers/**", "packages/cli/src/config/parsers.ts", "packages/cli/src/types/parsers.ts", "packages/cli/src/schemas/parsers.ts"]

[[import_rule]]
name = "manifests"
paths = ["packages/cli/src/manifests/**", "packages/cli/src/config/manifests.ts", "packages/cli/src/types/manifests.ts", "packages/cli/src/schemas/manifests/**"]

[[import_rule]]
name = "repository"
paths = ["packages/cli/src/repository/**", "packages/cli/src/config/repository/**", "packages/cli/src/types/repository.ts", "packages/cli/src/schemas/repository.ts"]

[[import_rule]]
name = "settings"
paths = ["packages/cli/src/settings/**", "packages/cli/src/config/settings/**", "packages/cli/src/types/settings.ts", "packages/cli/src/schemas/settings/**"]

[[import_rule]]
name = "tools"
paths = ["packages/cli/src/tools/**", "packages/cli/src/config/tools/**", "packages/cli/src/types/tools.ts", "packages/cli/src/schemas/tools.ts"]

[[import_rule]]
name = "engine"
paths = ["packages/cli/src/engine/**", "packages/cli/src/config/engine.ts", "packages/cli/src/types/engine/**", "packages/cli/src/schemas/engine.ts"]

[[import_rule]]
name = "shipped-config"
paths = ["packages/cli/src/configurations/*/*/files/**"]
can_import = ["configurations"]

[[import_rule]]
name = "configurations"
paths = ["packages/cli/src/configurations/**", "packages/cli/src/config/configurations/**", "packages/cli/src/types/configurations/**", "packages/cli/src/schemas/configurations.ts"]

[[import_rule]]
name = "generation"
paths = ["packages/cli/src/generation/**", "packages/cli/src/config/generation.ts", "packages/cli/src/types/generation.ts", "packages/cli/src/schemas/generation.ts"]

[[import_rule]]
name = "commands"
paths = ["packages/cli/src/commands/**", "packages/cli/src/config/commands/**", "packages/cli/src/types/commands/**"]

[[import_rule]]
name = "main"
paths = ["packages/cli/src/main.ts", "packages/cli/src/bin.ts", "packages/cli/src/reference.ts", "packages/cli/src/config/main.ts", "packages/cli/src/types/main.ts"]

[[import_rule]]
name = "plugin-config"
paths = ["packages/eslint-plugin/src/config/**"]
can_import = []

[[import_rule]]
name = "plugin-types"
paths = ["packages/eslint-plugin/src/types/**"]
can_import = []

[[import_rule]]
name = "plugin"
paths = ["packages/eslint-plugin/src/*.ts", "packages/eslint-plugin/src/language/**", "packages/eslint-plugin/src/libraries/**", "packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/plugin.d.ts"]
can_import = ["plugin-config", "plugin-types"]

[[import_rule]]
name = "docs-config"
paths = ["docs/src/config/**"]
can_import = ["system", "parsers", "manifests", "repository", "settings", "tools", "engine", "configurations", "generation", "commands", "main", "cli-types", "docs-types"]

[[import_rule]]
name = "docs-types"
paths = ["docs/src/types/**"]
can_import = ["system", "parsers", "manifests", "repository", "settings", "tools", "engine", "configurations", "generation", "commands", "main", "cli-types", "docs-config"]

[[import_rule]]
name = "docs"
paths = ["docs/src/*.*", "docs/src/!(config|types)/**"]

[[import_rule]]
name = "tests-data"
paths = ["tests/config/**"]
can_import = ["system", "parsers", "manifests", "repository", "settings", "tools", "engine", "configurations", "generation", "commands", "main", "cli-types", "tests-setup"]

[[import_rule]]
name = "tests-types"
paths = ["tests/types/**"]
can_import = ["system", "parsers", "manifests", "repository", "settings", "tools", "engine", "configurations", "generation", "commands", "main", "cli-types", "plugin-types", "tests-data"]

[[import_rule]]
name = "tests-setup"
paths = ["tests/setup/**", "tests/schemas/**"]

[[import_rule]]
name = "tests"
paths = ["tests/suites/**"]

[[command_check]]
id = "unit-tests"
command = ["bash", "-c", "[[ -n ${CI:-} ]] || mise run test unit"]
paths = ["**"]
stage = "push"
summary = "Runs the unit suite."
help = "Run `mise run test unit`, and fix each failed test."
exit_codes = [1]
output = { format = "none" }

[[ignore]]
check = "dependencies/osv-scanner"
rule = "GHSA-3g3m-2fjr-6pw4"
reason = "As checked on 2026-10-31, only glob 14.0.2 fixes the AbortSignal bypass, and @npmcli/map-workspaces and @npmcli/package-json require glob ^13. Neither passes an AbortSignal to glob, so the bypass does not apply."

[[ignore]]
check = "dependencies/osv-scanner"
rule = "GHSA-ch52-4w7c-c8xp"
reason = "As checked on 2026-10-20, no release fixes the max-stale flaw: bun.lock holds 4.2.0, and 4.3.0 changes only Vary handling. Astro and make-fetch-happen use it in the docs and tests workspaces, which share no cached responses between users."

[[ignore]]
check = "dependencies/osv-scanner"
rule = "GHSA-g3hv-75wg-m249"
reason = "As checked on 2026-10-31, only minimatch 11.0.1 fixes the globparts denial of service, and ESLint, typescript-estree, and @npmcli/map-workspaces require minimatch ^10. Their patterns come from the repository's own config and package.json workspaces."

[[ignore]]
check = "docs/missing-paths"
paths = ["packages/cli/src/configurations/infrastructure/docker/rules/DOCKER.md", "packages/cli/src/configurations/language/html/rules/HTML.md", "packages/cli/src/configurations/platform/supabase/rules/SUPABASE.md"]
reason = "Paths in shipped rules are examples for user projects."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/src/configurations/general/prose/files/styles/LICENSES.md"]
reason = "This file reproduces upstream license notices and terms whose wording must remain unchanged."

[[ignore]]
check = "prose/vale"
rule = "gspot.session-identifiers"
paths = ["tests/config/integration/prose.ts", "tests/suites/unit/cli/configurations/general/commits/checks.test.ts"]
reason = "These samples hold session links so that the tests see gspot report them."

[[ignore]]
check = "prose/vale"
rule = "gspot.home-paths"
paths = ["tests/config/integration/prose.ts", "tests/suites/unit/cli/configurations/general/commits/checks.test.ts", "tests/suites/unit/cli/configurations/general/gspot/suppressions/reasons.test.ts"]
reason = "These samples hold home folders so that the tests see gspot report them."

[[ignore]]
check = "javascript/eslint"
rule = "import-x/no-default-export"
paths = ["packages/eslint-plugin/src/plugin.ts", "packages/cli/src/configurations/language/markdown/files/markdownlint-cli2.ts"]
reason = "ESLint and markdownlint-cli2 load the default export of these modules."

[[ignore]]
check = "site/html-validate"
rule = "element-permitted-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "no-implicit-button-type"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "text-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "unique-landmark"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "spelling/typos"
paths = ["tests/config/setup/configurations.ts"]
reason = "This literal supplies a deliberate misspelling to the spelling checks and their corrections."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["**/{checks,configurations}/{database,framework,general,infrastructure,language,library,platform,testing}/*"]
reason = "Each group folder keeps the code of a configuration at <group>/<configuration>, also when the group holds one configuration."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["packages/cli/src/configurations/{database,framework,general,infrastructure,language,library,platform,testing}/*/*.ts"]
reason = "A configuration folder also holds its manifest.toml and rules/, which the check does not count."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["docs/src/pages/index.astro"]
reason = "Astro builds the routes of the site only from files in src/pages/."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["docs/src/schemas/content.ts"]
reason = "AGENTS.md keeps every schema in a schemas folder, and the docs site declares one schema."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["packages/cli/src/configurations/framework/site/files/purgecss.ts", "packages/cli/src/configurations/language/javascript/files/eslint-functions.ts", "packages/cli/src/configurations/language/markdown/files/markdownlint-cli2.ts"]
reason = "The manifest loader discovers config files in files/ and names each of these modules as the source of its config file target."

[[ignore]]
check = "structure/pass-through-folders"
paths = ["**/{checks,configurations}/{database,framework,general,infrastructure,language,library,platform,testing}"]
reason = "Each group folder keeps the code of a configuration at <group>/<configuration>, also when the group holds one configuration."

[[ignore]]
check = "structure/pass-through-folders"
paths = ["packages/cli/src/configurations/{database,framework,general,infrastructure,language,library,platform,testing}/*"]
reason = "A configuration folder also holds its manifest.toml and rules/, which the check does not count."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["docs/src/content.config.ts"]
reason = "Astro fixes this name beside the content folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["tests/suites/unit/cli/configurations/framework/react*.test.ts"]
reason = "The react and react-dom configurations name these tests, after their npm packages."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/eslint-plugin/src/rules/**", "tests/suites/unit/eslint-plugin/rules/**"]
reason = "ESLint rule IDs are the file names, and they share their first word by convention."

[[ignore]]
check = "javascript/eslint"
rule = "unicorn/prefer-ternary"
reason = "It fights gspot/no-trivial-functions: the ternary shrinks a helper to one statement, and that rule then asks to inline the helper."

[[ignore]]
check = "javascript/eslint"
rule = "unicorn/prefer-await"
reason = "With no-floating-promises, no-misused-promises, and no-void, a synchronous callback that starts async work has no form that this rule accepts."

[[ignore]]
check = "javascript/eslint"
rule = "no-template-curly-in-string"
paths = ["tests/**"]
reason = "Test samples quote template literal code as text."

[[ignore]]
check = "javascript/eslint"
rule = "unicorn/no-incorrect-template-string-interpolation"
paths = ["tests/**"]
reason = "Test samples quote template syntax of other languages as text."

[[ignore]]
check = "javascript/eslint"
rule = "unicorn/no-top-level-side-effects"
paths = ["**/*.config.*"]
reason = "A tool reads the default export of its config file, which the file builds when it loads."

[[ignore]]
check = "javascript/eslint"
rule = "gspot/no-magic-numbers"
paths = [
    "packages/eslint-plugin/src/config/assertions/evidence.ts",
    "packages/eslint-plugin/src/config/collections.ts",
    "packages/eslint-plugin/src/config/libraries.ts",
    "packages/eslint-plugin/src/config/logic.ts",
]
reason = "Module-level Map and Set tables name their numbers, and gspot/no-magic-numbers in plugin 0.2.3 reads them as unnamed."

[[ignore]]
check = "site/purgecss"
reason = "The purgecss bundle of gspot 0.3.8 leaves out a package that it imports, so the check stops before it reads the site."

[[ignore]]
check = "site/unused-assets"
rule = "unused-asset"
paths = ["docs/src/assets/mark.webp"]
reason = "SiteTitle.astro imports this image through the #docs package alias, which gspot 0.3.8 does not resolve."

[[ignore]]
check = "prose/vale"
rule = "gspot.home-paths"
paths = ["docs/astro.config.ts"]
reason = "A component path in this file passes through a folder named home, and gspot 0.3.8 matches it as a home folder."

[[ignore]]
check = "prose/vale"
rule = "gspot.title-case"
paths = ["docs/**"]
reason = "Page titles use sentence case, and the title case style of gspot 0.3.8 asks for title case."
