[tools.knip]
entry = [
    "**/build.ts",
    "packages/eslint-plugin/src/plugin.ts",
    "packages/cli/scripts/inputs.ts",
    "packages/cli/src/lifecycle/preview/eslint/worker.ts",
    "docs/src/content/reference/collection.ts",
    "docs/astro.config.ts",
    "docs/src/content.config.ts",
    "docs/src/route-metadata.ts",
    "scripts/*.ts",
]

[[tools.knip.ignore_dependencies]]
name = "^.+$"
workspace = "tests"
reason = "Every package the tests workspace lists is planted into a test repository, which knip cannot see."

[[tools.knip.ignore_dependencies]]
name = "^tree-sitter-"
reason = "The build copies the grammar WASM files from these packages by path; nothing imports them."

[[tools.knip.ignore_dependencies]]
name = "^@fontsource-variable/"
reason = "The site imports the fonts from docs/src/theme.css, outside the TypeScript import graph."

[structure]

# The rule corpus is this repository's product; its lint is this repository's check and ships in no package.

[[structure.folder_name_allowed]]
paths = [
    "tests/acceptance/kits/language/bash",
    "tests/acceptance/kits/language/python",
    "tests/acceptance/kits/language/swift",
    "tests/acceptance/kits/language/typescript",
    "tests/integration/cli/checks/swift",
    "tests/support/cli/python",
    "tests/unit/cli/checks/python",
]
reason = "Each directory owns tests of that named language kit, parser, or tool integration; the files are TypeScript, not buckets grouped by implementation language."

[[structure.folder_name_allowed]]
paths = [
    "packages/cli/src/checks/language/bash",
    "packages/cli/src/checks/language/javascript",
    "packages/cli/src/checks/language/python",
    "packages/cli/src/checks/language/swift",
]
reason = "Each folder holds the checks of one language kit and is named after the kit, as the kits folder is."

[[structure.single_file_folder_allowed]]
paths = ["tests/acceptance/kits/database", "tests/acceptance/kits/library", "tests/acceptance/kits/platform"]
reason = "The acceptance tests of the kits sit under the kit category, as the kits folder does, and these categories have one test file."

[[structure.single_file_folder_allowed]]
paths = ["docs/src/pages/schema"]
reason = "Astro maps this directory to the published /schema/gspot.schema.json endpoint; moving the route changes the public schema URL."

[[structure.prefix_collision_allowed]]
paths = ["packages/eslint-plugin/src/rules/**", "tests/unit/plugin/rules/**"]
reason = "ESLint rule ids are the file names, and the ids share their first word by convention."

[[structure.prefix_collision_allowed]]
paths = ["docs/src"]
reason = "Astro fixes the name of the content configuration file beside the content folder."
[tools.licenses]

[[tools.licenses.packages_allowed]]
package = "axe-core@4.13.0"
license = "MPL-2.0"
reason = "The JSX accessibility lint plugin requires this unmodified development dependency. Its installed LICENSE identifies MPL-2.0; it is not included in the gspot package."

[[tools.licenses.packages_allowed]]
package = "@csstools/selector-specificity@5.0.0"
license = "MIT-0"
reason = "The CSS tooling dependency uses the MIT No Attribution license; its installed package retains the license text."

[[tools.licenses.packages_allowed]]
package = "@fontsource-variable/geist@5.3.0"
license = "OFL-1.1"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[[tools.licenses.packages_allowed]]
package = "@fontsource-variable/geist-mono@5.3.0"
license = "OFL-1.1"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[[tools.licenses.packages_allowed]]
package = "eslint-plugin-sonarjs@4.2.0"
license = "LGPL-3.0-only"
reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the gspot package."

[[tools.licenses.packages_allowed]]
package = "lightningcss@1.33.0"
license = "MPL-2.0"
reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."

[[tools.licenses.packages_allowed]]
package = "truncate-utf8-bytes@1.0.2"
license = "WTFPL"
reason = "A permissive license with no conditions; it arrives through a test tool and ships in nothing."
[tools.osv]

[[ignore]]
check = "security/semgrep"
rule = "node-no-configured-require"
paths = [
    "packages/cli/src/lifecycle/preview/eslint/declarations.ts",
    "packages/cli/src/lifecycle/preview/eslint/worker.ts",
]
reason = "These configuration evaluators intentionally execute repository-selected modules and installed tool APIs in the configuration subprocess. Static imports select the CLI dependencies instead of the repository dependencies and cannot preserve executable configuration. Other security rules remain active for these exact files."

[[ignore]]
check = "typescript/eslint"
rule = "gspot/no-trivial-functions"
paths = ["packages/cli/src/kits/messages.ts", "packages/cli/src/policy/messages.ts"]
reason = "Every message has one builder in its catalog, so callers share one wording. A builder is one template, so the trivial-function rule would ask for every message text to be copied to its callers. Remove this entry if the catalogs move out of functions."

[[ignore]]
check = "typescript/eslint"
rule = "package-json/require-exports"
paths = ["packages/cli/package.json"]
reason = "The gspot package exposes a command through bin and has no importable module API. Remove this exception if the package gains a module API."

[[ignore]]
check = "integrity/stale-paths"
paths = ["UPDATES.md"]
reason = "UPDATES.md records an audit, and it names files and folders the work deletes and moves."

[prose]
vocabulary = ["Nx", "Turborepo", "Husky", "Lefthook", "EditorConfig Checker"]

[tools.codeql]
languages = ["javascript-typescript", "actions"]

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = [
    "tests/acceptance/cli/agents.test.ts",
    "tests/acceptance/cli/lifecycle/clone.test.ts",
    "tests/integration/cli/checks/nextjs-build.test.ts",
    "tests/integration/cli/checks/swift/build/isolation.test.ts",
    "tests/integration/cli/execution/resource-reads.test.ts",
    "tests/tools/cli/packages/project.test.ts",
    "tests/support/cli/preservation.ts",
]
reason = "Each test owns its temporary tree and is the only writer; the stat and the read it compares are the assertion."

[[tools.codeql.false_positives]]
rule = "js/bad-code-sanitization"
paths = ["packages/cli/src/generation/fragments.ts"]
reason = "JSON.stringify emits whole literals into a standalone ESLint module, never into an HTML script element."

[[tools.codeql.false_positives]]
rule = "js/incomplete-sanitization"
paths = ["packages/cli/src/checks/general/files/actions.ts"]
reason = "Only the leading self-repository marker is translated; later dollar signs are path characters and must stay."

[[tools.codeql.false_positives]]
rule = "js/incomplete-sanitization"
paths = ["packages/cli/src/repository/revisions/refspecs.ts"]
reason = "git check-ref-format validates every refspec first and permits at most one wildcard, so one replacement is complete."

[[tools.codeql.false_positives]]
rule = "js/http-to-file-access"
paths = ["packages/cli/scripts/inputs.ts"]
reason = "Every downloaded byte is checked against the pinned SHA-256 digest before the cache file is written."
