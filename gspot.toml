#:schema ./.gspot/gspot.schema.json
# gspot settings for this repository. Change them with gspot set, unset, add, remove, ignore, and unignore.

level = "all"
configurations = ["typescript", "markdown", "github-actions", "bash"]

[hooks]
enabled = true

[ci]
setup_command = ["mise", "run", "setup"]
enabled = true

[naming]
banned_words = ["catalog", "corpus", "render", "sync", "materialize", "coerce", "scoped", "bind", "load", "fetch", "resolve", "probe", "fixture", "shell", "diagnostic", "directory", "envelope", "outcome", "emit", "violation", "problem", "tooling", "implementation", "candidate", "fragment", "invocation", "lexeme", "substantial", "substance", "floor", "hint", "sink", "inputs", "memo", "collect", "summarize", "verdict", "your", "odd", "qa", "cfg", "obsolete", "release hold", "installed root", "working folder", "root path", "entry", "entries", "item", "items", "part", "parts", "data", "known", "declared", "needed", "prepared", "pinned", "existing", "current", "extra", "complete", "whole", "plain", "raw", "full", "real", "additional", "given", "retained", "observed", "computed", "actual", "effective", "original", "specific", "captured", "recorded", "chosen", "internal", "helper", "helpers", "util", "utils", "payload", "fallback", "attempt", "normalized", "expanded", "composed", "thing", "things", "misc", "info", "details", "meta", "stuff", "perform", "execute", "ensure", "wrapper", "temp", "tmp", "various", "several", "certain", "resulting", "handled", "wrapped", "underlying", "corresponding", "relevant", "appropriate", "proper", "basic", "generic", "overall"]

[[naming.override]]
paths = ["docs/src/content/docs/404.md"]
allow_digits = true
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.override]]
paths = ["tests/types/tools.ts"]
allowed_names = ["rule_id"]
reason = "SwiftLint JSON diagnostics identify the native rule using rule_id."

[[naming.override]]
paths = ["packages/cli/src/types/checks/platform/supabase.ts", "packages/cli/src/types/checks/general/naming.ts", "packages/cli/src/types/configurations.ts", "packages/cli/src/types/runs/output/formats.ts", "packages/cli/src/types/runs/output/outputs.ts", "packages/cli/src/types/settings/**"]
categories = ["properties"]
cases = ["camel", "upper-snake", "snake"]
reason = "These properties retain the serialized gspot.toml, configuration manifest and tool report field names."

[[naming.override]]
paths = ["packages/eslint-plugin/src/rules/no-magic-numbers.ts"]
allowed_names = ["meta"]
reason = "ESLint names the description of a rule meta."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/site/purgecss-process.ts"]
allowed_names = ["PurgeCSS"]
reason = "PurgeCSS exports its class under this exact name."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/svelte.ts"]
categories = ["functions"]
allowed_names = ["checkSvelteCheck"]
reason = "Check functions start with check and spell the svelte/svelte-check check ID without repeating svelte."

[[naming.override]]
paths = ["packages/cli/src/checks/platform/supabase.ts"]
categories = ["functions"]
allowed_names = ["checkSupabaseDenoCheck"]
reason = "Check functions start with check and spell the supabase/deno-check check ID."

[[naming.override]]
paths = ["tests/suites/unit/cli/generation/configurations/general/data-files.test.ts"]
allow_digits = true
reason = "v8r is the name of the tool."

[[naming.override]]
paths = ["tests/types/ci.ts"]
allowed_names = ["with"]
reason = "GitHub Actions calls its action argument record with."

[[naming.override]]
paths = ["packages/cli/src/generation/configurations/general/data-files.ts", "packages/cli/src/config/generation/configurations/general/data-files.ts"]
allow_digits = true
reason = "v8r is the name of the tool."

[[naming.override]]
paths = ["tests/suites/e2e/cli.test.ts"]
allowed_names = ["resolved"]
reason = "npm and Yarn lockfiles name each package download URL resolved."

[[naming.override]]
paths = ["packages/cli/src/types/generation/css.ts"]
allowed_names = ["customSyntax"]
reason = "Stylelint names its parser option customSyntax."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/projects/xcode.ts"]
allowed_names = ["objects"]
reason = "Xcode project files name the object table objects."

[[naming.override]]
paths = ["packages/cli/configurations/language/markdown/config-files/markdownlint-cli2.ts", "packages/cli/src/types/generation/markdownlint-cli2.ts"]
allowed_names = ["markdownlint-cli2"]
reason = "The manifest names the source after its markdownlint-cli2 target, and the placeholder uses that name."

[[naming.override]]
paths = ["packages/cli/src/types/generation/eslint-functions.ts"]
allowed_names = ["getDocumentFragment"]
reason = "vue-eslint-parser names this parser service getDocumentFragment."

[[naming.override]]
paths = ["docs/src/types/reference.ts"]
allowed_names = ["data"]
reason = "Astro content entries keep their fields in data."

[[naming.override]]
paths = ["packages/cli/src/config/checks/language/swift/cache.ts"]
allowed_names = ["DERIVED_DATA_FLAG", "DERIVED_DATA_FOLDER"]
reason = "Xcode names its build folder DerivedData and its flag -derivedDataPath."

[[naming.override]]
paths = ["packages/cli/src/generation/configurations/language/python.ts", "tests/suites/unit/cli/generation/configurations/language/python.test.ts"]
allowed_names = ["extraPaths"]
reason = "basedpyright names its import search setting extraPaths."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/formats/toml.ts", "packages/cli/src/types/parsers/projects/tsconfig.ts"]
allowed_names = ["raw"]
reason = "toml-patch and the TypeScript compiler API name the source text raw."

[[naming.override]]
paths = ["packages/cli/src/config/generation/configurations/language/javascript/knip.ts", "packages/cli/src/generation/configurations/language/javascript/knip.ts", "tests/types/tools.ts"]
allowed_names = ["KNIP_JAVASCRIPT_ENTRY_FILES", "selectEntryFiles", "entry", "entries"]
reason = "knip names its start files entry, and tools.knip.entry passes them on."

[[naming.override]]
paths = ["packages/cli/src/types/commands/list.ts", "packages/cli/src/types/settings/definitions.ts", "packages/cli/src/types/settings/inheritance.ts"]
allowed_names = ["reason_when"]
reason = "gspot list settings --json and the shipped setting definitions name this field reason_when."

[[naming.override]]
paths = ["packages/cli/src/checks/database/postgres/definer-search-path.ts", "packages/cli/src/checks/database/postgres/row-level-security.ts", "packages/cli/src/checks/database/postgres/foreign-key-indexes.ts", "packages/cli/src/checks/framework/react-dom.ts", "packages/cli/src/checks/general/dependencies.ts", "packages/cli/src/checks/general/gspot.ts", "packages/cli/src/checks/general/structure/file-folder-clashes.ts", "packages/cli/src/checks/general/structure/pass-through-folders.ts", "packages/cli/src/checks/infrastructure/xcode.ts", "packages/cli/src/checks/platform/supabase.ts"]
categories = ["functions"]
allowed_names = ["checkPostgresDefinerSearchPath", "checkPostgresRowLevelSecurity", "checkPostgresForeignKeyIndexes", "checkReactDomReactVersions", "checkDependenciesPackageManagerPin", "checkGspotConflictingConfigFiles", "checkStructureFileFolderClashes", "checkStructurePassThroughFolders", "checkXcodeFilesWithoutTarget", "checkXcodeAppTransportSecurity", "checkSupabaseServiceRoleKey"]
reason = "Each check function is named check, then its configuration, then its check name."

[[naming.override]]
paths = ["packages/cli/configurations/general/data-files/**", "packages/cli/src/config/generation/configurations/general/data-files.ts", "packages/cli/src/generation/configurations/general/data-files.ts", "tests/config/generation/configurations/general/data-files.ts", "tests/config/integration/checks/general/data-files.ts", "tests/suites/integration/checks/general/data-files.test.ts", "tests/suites/unit/cli/generation/configurations/general/data-files.test.ts", "tests/config/integration/checks/general/security/sensitive-data.ts", "tests/suites/integration/checks/general/security/sensitive-data.test.ts"]
allowed_names = ["data-files", "data-files.test", "sensitive-data", "sensitive-data.test"]
reason = "These files and folders take the names of the data-files configuration and the security/sensitive-data check."

[structure]
environment_readers = ["packages/cli/src/system/environment.ts", "tests/setup/system/environment.ts", "tests/setup/runner/unit.ts"]

[dependencies]
bun_scanner = "@socketsecurity/bun-security-scanner"

[docs]
allowed_urls = { value = ["^https://www\\.npmjs\\.com/package/@gspothq/cli$"], reason = "The npm package page returns HTTP 403 to automated requests." }

[licenses]
allowed = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "BlueOak-1.0.0", "Python-2.0", "MIT-0", "PSF-2.0"]

[[licenses.allowed_package]]
name = "@fontsource-variable/geist-mono"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[[licenses.allowed_package]]
name = "lightningcss"
version = "1.33.0"
reason = "Vite depends on it to build the docs site; the license binds changes to its own files, and none are made."

[spelling.allowed_words]
vertica = "SQLFluff names its Vertica dialect vertica."
IIF = "ESLint names immediately invoked functions IIFEs."
next-intl = "The next-intl package name."
udid = "Apple names the device identifier udid."
NGINX = "Official product name."
Stylelint = "Official product name."
markdownlint = "Official product name."
React = "Official product name."
Native = "Part of the React Native product name."
Simple = "Part of the Simple Icons product name."
certifi = "The tests name the Python certificate bundle package certifi."
writeable = "ESLint accepts writeable as the value of a global."
styl = "The Stylus stylesheet extension is .styl."
USAGE = "mise uses USAGE in task argument directives."

[tools.eslint]
import_extension = "ts"

[tools.eslint.rules]
no-restricted-properties = [{ object = "Bun", property = "env" }, { object = "Deno", property = "env" }, { property = "localeCompare", message = "Use compareText for stable ordering." }]

[tools.knip]
entry = ["tests/setup/runner/unit.ts", "tests/setup/programs/**/*.ts", "packages/eslint-plugin/src/plugin.ts", "tests/setup/runner/prepare.ts", "tests/setup/sandboxes/tool-project.ts", "tests/setup/runner/integration.ts", "packages/cli/src/checks/framework/site/purgecss-process.ts", "packages/cli/configurations/language/javascript/config-files/eslint-functions.ts", "packages/cli/src/bin.ts", "packages/cli/configurations/language/markdown/config-files/markdownlint-cli2.ts", "packages/cli/configurations/framework/site/config-files/purgecss.ts"]

[[scope]]
path = "docs"
configurations = ["css", "astro", "cloudflare", "site"]
site.build_command = ["bun", "--bun", "astro", "build"]
tools.knip.ignore_dependencies = { value = ["satteri"], reason = "Astro prerender externalizes the native satteri loader in astro.config.ts." }

[[scope]]
path = "packages/cli"
configurations = ["zod"]

[[scope]]
path = "tests"
configurations = ["zod"]

[[import_rule]]
name = "cli-config"
paths = ["packages/cli/src/config/**"]
can_import = ["cli-types"]

[[import_rule]]
name = "cli-types"
paths = ["packages/cli/src/types/**"]
can_import = ["cli-config", "parsers", "configurations", "repository", "settings", "installers", "runs", "checks", "commands"]

[[import_rule]]
name = "system"
paths = ["packages/cli/src/system/**"]

[[import_rule]]
name = "parsers"
paths = ["packages/cli/src/parsers/**", "packages/cli/src/schemas/parsers/**"]

[[import_rule]]
name = "configurations"
paths = ["packages/cli/src/configurations/**", "packages/cli/src/schemas/configurations/**"]

[[import_rule]]
name = "repository"
paths = ["packages/cli/src/repository/**", "packages/cli/src/schemas/repository/**"]

[[import_rule]]
name = "settings"
paths = ["packages/cli/src/settings/**", "packages/cli/src/schemas/settings/**"]

[[import_rule]]
name = "planning"
paths = ["packages/cli/src/planning/**"]

[[import_rule]]
name = "tools"
paths = ["packages/cli/src/tools/**"]

[[import_rule]]
name = "installers"
paths = ["packages/cli/src/installers/**", "packages/cli/src/schemas/installers/**"]

[[import_rule]]
name = "generation"
paths = ["packages/cli/src/generation/**"]

[[import_rule]]
name = "runs"
paths = ["packages/cli/src/runs/**", "packages/cli/src/schemas/runs/**"]

[[import_rule]]
name = "checks"
paths = ["packages/cli/src/checks/**", "packages/cli/src/schemas/checks/**"]

[[import_rule]]
name = "commands"
paths = ["packages/cli/src/commands/**", "packages/cli/src/schemas/commands.ts"]

[[import_rule]]
name = "main"
paths = ["packages/cli/src/main.ts", "packages/cli/src/bin.ts"]

[[import_rule]]
name = "plugin-config"
paths = ["packages/eslint-plugin/src/config/**"]
can_import = []

[[import_rule]]
name = "plugin-types"
paths = ["packages/eslint-plugin/src/types/**"]
can_import = []

[[import_rule]]
name = "plugin"
paths = ["packages/eslint-plugin/src/*.ts", "packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/plugin.d.ts"]
can_import = ["plugin-config", "plugin-types"]

[[import_rule]]
name = "docs-config"
paths = ["docs/src/config/**"]
can_import = ["cli-config", "docs-types"]

[[import_rule]]
name = "docs-types"
paths = ["docs/src/types/**"]
can_import = ["cli-types", "settings", "docs-config"]

[[import_rule]]
name = "docs"
paths = ["docs/src/*.*", "docs/src/!(config|types)/**"]

[[import_rule]]
name = "tests-data"
paths = ["tests/config/**"]
can_import = ["cli-config", "tests-setup"]

[[import_rule]]
name = "tests-types"
paths = ["tests/types/**"]
can_import = ["cli-types", "plugin-types", "tests-data"]

[[import_rule]]
name = "tests-setup"
paths = ["tests/setup/**", "tests/schemas/**"]

[[import_rule]]
name = "tests"
paths = ["tests/suites/**"]

[[import_rule]]
name = "config-files"
paths = ["packages/cli/configurations/**/config-files/**"]
can_import = ["cli-types"]

[[ignore]]
check = "dependencies/osv-scanner"
rule = "GHSA-ch52-4w7c-c8xp"
reason = "As checked on 2026-10-20, no release fixes the max-stale flaw: bun.lock holds 4.2.0, and 4.3.0 changes only Vary handling. Astro and make-fetch-happen use it in the docs and tests workspaces, which share no cached responses between users."

[[ignore]]
check = "docs/missing-paths"
paths = ["packages/cli/configurations/infrastructure/docker/rules/DOCKER.md", "packages/cli/configurations/language/html/rules/HTML.md", "packages/cli/configurations/platform/supabase/rules/SUPABASE.md"]
reason = "Paths in shipped rules are examples for user projects."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/restrict-dependency-ranges"
paths = ["packages/eslint-plugin/package.json"]
reason = "A published library uses ranges for dependencies and peers."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/configurations/general/prose/config-files/styles/LICENSES.md"]
reason = "This file reproduces upstream license notices and terms whose wording must remain unchanged."

[[ignore]]
check = "prose/vale"
rule = "gspot.session-identifiers"
paths = ["tests/config/integration/checks/general/prose/scopes.ts"]
reason = "This sample URL holds a session identifier so that the Vale test sees the rule report it."

[[ignore]]
check = "prose/vale"
rule = "write-good.E-Prime"
paths = ["README.md", "packages/cli/README.md", "docs/src/content/docs/start/overview.md"]
reason = "These files open with the owner's product description, which keeps its wording."

[[ignore]]
check = "site/html-validate"
rule = "element-permitted-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "no-implicit-button-type"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "text-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "unique-landmark"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "spelling/typos"
paths = ["tests/config/spelling.ts"]
reason = "This literal supplies a deliberate misspelling to the spelling checks and their corrections."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["docs/src/pages/index.astro"]
reason = "Astro builds the routes of the site only from files in src/pages/."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["packages/cli/configurations/framework/site/config-files/purgecss.ts", "packages/cli/configurations/language/markdown/config-files/markdownlint-cli2.ts"]
reason = "The manifest loader discovers config files in config-files/ and names each of these modules as the source of its config file target."

[[ignore]]
check = "structure/pass-through-folders"
paths = ["packages/cli/src/checks/database", "packages/cli/src/config/checks/database", "tests/config/checks/database", "tests/suites/unit/cli/checks/database"]
reason = "The database group holds one configuration, postgres, and every group keeps each configuration in its own folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["docs/src/content.config.ts"]
reason = "Astro fixes this name beside the content folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/cli/src/generation/configurations/framework/react*.ts"]
reason = "The react and react-dom configurations name these generators, after their npm packages."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/src/config/rules/**", "tests/suites/unit/eslint-plugin/rules/**"]
reason = "ESLint rule IDs are the file names, and they share their first word by convention."
