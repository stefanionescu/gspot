#:schema ./.gspot/gspot.schema.json
# gspot settings for this repository. Change them with gspot set, unset, add, remove, ignore, and unignore.

level = "all"
configurations = ["typescript", "markdown", "github-actions", "bash"]

[hooks]
enabled = true

[ci]
setup_command = ["mise", "run", "setup"]
enabled = true

[naming]
# Words this repository does not use in names.
banned_words = ["catalog", "corpus", "render", "sync", "materialize", "coerce", "scoped", "bind", "load", "fetch", "resolve", "probe", "fixture", "shell", "diagnostic", "directory", "envelope", "outcome", "emit", "violation", "problem", "tooling", "implementation", "candidate", "fragment", "invocation", "lexeme", "substantial", "substance", "floor", "hint", "sink", "inputs", "memo", "collect", "summarize", "verdict", "your", "odd", "qa", "cfg", "obsolete", "release hold", "entry", "entries", "item", "items", "part", "parts", "data", "known", "declared", "needed", "prepared", "pinned", "existing", "current", "extra", "complete", "whole", "plain", "raw", "full", "real", "additional", "given"]

[[naming.override]]
paths = ["packages/cli/src/types/settings/**"]
allowed_names = ["final_newline", "v8r", "ParsedV8r"]
reason = "gspot.toml names the key final_newline, and v8r is the name of the tool."

[[naming.override]]
paths = ["docs/src/content/docs/404.md"]
allow_digits = true
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.override]]
paths = ["docs/src/types/agents.ts"]
allowed_names = ["$schema"]
reason = "The Agent Skills discovery index names its schema key $schema."

[[naming.override]]
paths = ["tests/types/tools.ts"]
allowed_names = ["rule_id"]
reason = "SwiftLint JSON diagnostics identify the native rule using rule_id."

[[naming.override]]
paths = ["packages/cli/src/types/checks/**", "packages/cli/src/types/commands/list.ts", "packages/cli/src/types/configurations.ts", "packages/cli/src/types/runs/output.ts", "packages/cli/src/types/runs/tool-reports.ts", "packages/cli/src/types/repository/detect.ts", "packages/cli/src/types/settings/**"]
categories = ["properties"]
cases = ["camel", "upper-snake", "snake"]
reason = "These properties retain the serialized gspot.toml, configuration manifest and tool report field names."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/site/purgecss-process.ts"]
allowed_names = ["PurgeCSS"]
reason = "PurgeCSS exports its class under this exact name."

[[naming.override]]
paths = ["packages/cli/src/types/checks/general/licenses.ts"]
allowed_names = ["Name", "Version"]
reason = "pip-licenses identifies these JSON fields with this exact capitalization."

[[naming.override]]
paths = ["packages/cli/src/schemas/checks/general/prose.ts", "packages/cli/src/types/checks/general/prose.ts"]
allowed_names = ["Check", "Line", "Message", "Span"]
reason = "Vale identifies these JSON diagnostic fields with this exact capitalization."

[[naming.override]]
paths = ["packages/cli/src/types/checks/infrastructure/docker.ts", "packages/cli/src/schemas/checks/infrastructure/docker/trivy-image.ts"]
allowed_names = ["PkgName", "Results", "RuleID", "SchemaVersion", "Secrets", "Title", "Vulnerabilities", "VulnerabilityID"]
reason = "Trivy identifies these JSON report fields with these exact names."

[[naming.override]]
paths = ["packages/cli/src/types/checks/infrastructure/xcode.ts", "packages/cli/src/schemas/checks/infrastructure/xcode.ts"]
allowed_names = ["shouldTranslate"]
reason = "The Xcode string format names its translation control shouldTranslate."

[[naming.override]]
paths = ["packages/cli/src/types/checks/language/python.ts", "packages/cli/src/schemas/checks/language/python/deptry.ts"]
allowed_names = ["extend_exclude", "known_first_party"]
reason = "deptry names these TOML settings extend_exclude and known_first_party."

[[naming.override]]
paths = ["packages/cli/src/types/checks/language/swift.ts", "packages/cli/src/schemas/checks/language/swift.ts"]
allowed_names = ["module_type"]
reason = "Swift coverage JSON names the module type field module_type."

[[naming.override]]
paths = ["packages/cli/src/schemas/parsers/projects/xcode.ts"]
allowed_names = ["rootObject", "objects"]
reason = "Xcode project files name the object table objects."

[[naming.override]]
paths = ["packages/cli/src/types/checks/platform/supabase.ts"]
categories = ["properties"]
allowed_names = ["diagnostics"]
reason = "Deno names its lint findings diagnostics; Supabase names its inventory file_path."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/svelte.ts"]
categories = ["functions"]
allowed_names = ["checkSvelteCheck"]
reason = "Check functions start with check and spell the svelte/check check ID."

[[naming.override]]
paths = ["packages/cli/src/checks/platform/supabase.ts"]
categories = ["functions"]
allowed_names = ["checkSupabaseDenoCheck"]
reason = "Check functions start with check and spell the supabase/deno-check check ID."

[[naming.override]]
paths = ["packages/cli/src/types/runs/tool-reports.ts"]
allowed_names = ["fixInfo"]
reason = "markdownlint names its fix field fixInfo."

[[naming.override]]
paths = ["tests/suites/unit/cli/generation/configurations/general/data-files.test.ts", "tests/config/generation/configurations/general/data-files.ts"]
allow_digits = true
reason = "v8r is the name of the tool."

[[naming.override]]
paths = ["tests/types/ci.ts"]
allowed_names = ["with"]
reason = "GitHub Actions calls its action argument record with."

[[naming.override]]
paths = ["packages/cli/src/types/configurations.ts"]
categories = ["properties"]
allowed_names = ["when"]
reason = "The shipped configuration manifest format names its selection condition when."

[[naming.override]]
paths = ["packages/cli/src/generation/configurations/general/data-files/v8r.ts", "packages/cli/src/config/generation/configurations/general/data-files/v8r.ts"]
allow_digits = true
allowed_names = ["buildV8rFile"]
reason = "v8r is the name of the tool."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/projects/lockfiles.ts", "packages/cli/src/schemas/parsers/projects/lockfiles.ts"]
allowed_names = ["resolved"]
reason = "npm and Yarn lockfiles name each package download URL resolved."

[[naming.override]]
paths = ["packages/cli/src/types/install/npm.ts"]
allowed_names = ["resolved", "resolution"]
reason = "npm and pnpm lockfiles call their download fields resolved and resolution."

[[naming.override]]
paths = ["packages/cli/src/types/generation/files.ts"]
allowed_names = ["customSyntax"]
reason = "Stylelint names its parser option customSyntax."

[[naming.override]]
paths = ["packages/cli/src/types/shapes.ts"]
allowed_names = ["_zod"]
reason = "Zod names its schema information property _zod."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/projects/xcode.ts"]
allowed_names = ["objects", "fileSystemSynchronizedGroups"]
reason = "Xcode project files name these keys objects and fileSystemSynchronizedGroups."

[[naming.override]]
paths = ["packages/cli/src/types/linter-exports.ts"]
allowed_names = ["resolveConfig"]
reason = "Prettier and Stylelint name their configuration methods resolveConfig."

[[naming.override]]
paths = ["packages/cli/configurations/language/markdown/config-files/markdownlint-cli2.ts", "packages/cli/src/types/generation/markdownlint-cli2.ts"]
allowed_names = ["markdownlint-cli2"]
reason = "The manifest loader reads this source by the external markdownlint-cli2 target filename."

[[naming.override]]
paths = ["packages/cli/src/types/runs/tool-reports.ts", "packages/cli/src/schemas/runs/sarif.ts", "packages/cli/src/runs/output/sarif.ts", "tests/suites/unit/cli/runs/output/sarif.test.ts", "tests/suites/unit/cli/runs/output/formats.test.ts"]
allowed_names = ["invocations"]
reason = "SARIF names the field of a run that records each tool run invocations."

[[naming.override]]
paths = ["packages/cli/src/types/generation/eslint-functions.ts"]
allowed_names = ["getDocumentFragment"]
reason = "vue-eslint-parser names this parser service getDocumentFragment."

[[naming.override]]
paths = ["docs/src/route-data.ts", "docs/src/types/reference.ts"]
allowed_names = ["route-data", "data"]
reason = "Starlight requires route-data.ts, and Astro content entries keep their fields in data."

[[naming.override]]
paths = ["packages/cli/src/config/checks/language/swift/cache.ts"]
allowed_names = ["DERIVED_DATA_FLAG", "DERIVED_DATA_FOLDER"]
reason = "Xcode names its build folder DerivedData and its flag -derivedDataPath."

[[naming.override]]
paths = ["packages/cli/src/types/checks/language/swift.ts"]
allowed_names = ["data"]
reason = "llvm-cov export reports keep their coverage under data."

[[naming.override]]
paths = ["packages/cli/src/types/runs/tool-reports.ts"]
allowed_names = ["extra"]
reason = "Semgrep reports keep the details of each result under extra."

[[naming.override]]
paths = ["packages/cli/src/generation/configurations/language/python/basedpyright.ts", "packages/cli/src/types/settings/tables.ts", "tests/suites/unit/cli/generation/configurations/language/python/basedpyright.test.ts"]
allowed_names = ["extraPaths", "extra_paths"]
reason = "basedpyright names its import search setting extraPaths, and python.extra_paths passes it on."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/formats/toml.ts", "packages/cli/src/types/parsers/projects/tsconfig.ts"]
allowed_names = ["raw"]
reason = "toml-patch and the TypeScript compiler API name the source text raw."

[[naming.override]]
paths = ["packages/cli/src/config/generation/configurations/language/javascript/knip.ts", "packages/cli/src/generation/configurations/language/javascript/knip.ts", "packages/cli/src/types/settings/tools.ts", "tests/types/tools.ts"]
allowed_names = ["KNIP_JAVASCRIPT_ENTRY_FILES", "KNIP_ENTRY_SETTING", "selectEntryFiles", "entry"]
reason = "knip names its start files entry, and tools.knip.entry passes them on."

[[naming.override]]
paths = ["packages/cli/src/config/runs/command/placeholders.ts", "packages/cli/src/runs/command/placeholders.ts"]
allowed_names = ["EXISTING_PLACEHOLDER", "expandExistingPlaceholder", "existing"]
reason = "These name the {existing:<flag>:<path>} placeholder of [[command_check]]."

[[naming.override]]
paths = ["packages/cli/src/types/commands/check.ts", "packages/cli/src/types/planning.ts", "packages/cli/src/types/repository/revisions.ts", "packages/cli/src/commands/check/tree.ts"]
allowed_names = ["historyComplete"]
reason = "gspot check --json names this field historyComplete."

[[naming.override]]
paths = ["packages/cli/src/types/commands/doctor.ts"]
allowed_names = ["pinned"]
reason = "gspot doctor --json names this field pinned."

[[naming.override]]
paths = ["packages/cli/src/types/commands/explain.ts", "tests/suites/unit/cli/commands/explain/settings.test.ts"]
allowed_names = ["data", "current"]
reason = "gspot explain --json names these fields data and current."

[[naming.override]]
paths = ["packages/cli/src/types/commands/list.ts", "packages/cli/src/types/settings/definitions.ts", "packages/cli/src/types/settings/inheritance.ts"]
allowed_names = ["reason_needed"]
reason = "gspot list settings --json and the shipped setting definitions name this field reason_needed."

[[naming.override]]
paths = ["packages/cli/src/types/settings/file.ts", "packages/cli/src/types/settings/tables.ts"]
allowed_names = ["max_list_item_words"]
reason = "gspot.toml names this setting prose.max_list_item_words."

[[naming.override]]
paths = ["packages/cli/configurations/general/data-files/**", "packages/cli/src/config/generation/configurations/general/data-files/**", "packages/cli/src/generation/configurations/general/data-files/**", "tests/config/generation/configurations/general/data-files.ts", "tests/config/integration/checks/general/data-files.ts", "tests/suites/integration/checks/general/data-files.test.ts", "tests/suites/unit/cli/generation/configurations/general/data-files.test.ts", "tests/config/integration/checks/general/security/sensitive-data.ts", "tests/suites/integration/checks/general/security/sensitive-data.test.ts"]
allowed_names = ["data-files", "data-files.test", "sensitive-data", "sensitive-data.test"]
reason = "These files and folders take the names of the data-files configuration and the security/sensitive-data check."

[structure]
environment_readers = ["packages/cli/src/system/environment.ts", "tests/setup/system/environment.ts", "tests/setup/runner/unit.ts"]

[dependencies]
bun_scanner = "@socketsecurity/bun-security-scanner"

[docs]
allowed_urls = { value = ["^https://www\\.npmjs\\.com/package/@gspothq/cli$"], reason = "The npm package page returns HTTP 403 to automated requests." }

[licenses]
# MIT-0 is MIT without the notice condition.
allowed = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Unlicense", "BlueOak-1.0.0", "Python-2.0", "MIT-0"]

[[licenses.allowed_package]]
name = "@fontsource-variable/geist-mono"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[[licenses.allowed_package]]
name = "axe-core"
version = "4.13.0"
reason = "The JSX accessibility lint plugin requires this unmodified development dependency. Its installed LICENSE identifies MPL-2.0; it is not included in the gspot package."

[[licenses.allowed_package]]
name = "eslint-plugin-sonarjs"
version = "4.2.0"
reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the gspot package."

[[licenses.allowed_package]]
name = "lightningcss"
version = "1.33.0"
reason = "Vite depends on it to build the docs site; the license binds changes to its own files, and none are made."

[spelling.allowed_words]
axe = "Part of the published axe-core license name."
optin = "Zod names its optional input marker optin."
IIF = "ESLint names immediately invoked functions IIFEs."
next-intl = "The next-intl package name."
udid = "Apple names the device identifier udid."
NGINX = "Official product name."
Stylelint = "Official product name."
markdownlint = "Official product name."
React = "Official product name."
Native = "Part of the React Native product name."
Simple = "Part of the Simple Icons product name."

[tools.eslint]
import_extension = "ts"

[[tools.eslint.plugins]]
name = "repository"
path = "packages/eslint-plugin/repository.mjs"

[tools.eslint.plugins.rules]
no-promise-matchers = []
schema-location = [{ folders = ["packages/cli/src/schemas", "tests/schemas"] }]

[tools.knip]
entry = ["tests/setup/runner/unit.ts", "packages/eslint-plugin/repository.mjs", "tests/setup/runner/prepare.ts", "tests/setup/runner/integration.ts", "packages/cli/src/checks/framework/site/purgecss-process.ts", "packages/cli/configurations/language/javascript/config-files/eslint-functions.ts", "docs/src/route-data.ts", "packages/cli/src/bin.ts", "packages/cli/configurations/language/markdown/config-files/markdownlint-cli2.ts", "packages/cli/src/configurations/linter-exports.ts"]

[[scope]]
path = "docs"
configurations = ["css", "astro", "zod", "cloudflare", "site"]
site.build_command = ["bun", "--bun", "astro", "build"]
tools.knip.ignore_dependencies = { value = ["@fontsource-variable/geist", "@fontsource-variable/geist-mono", "satteri"], reason = "The site imports the fonts through CSS, and Astro prerender externalizes the native satteri loader in astro.config.ts." }

[[scope]]
path = "packages/cli"
configurations = ["zod"]
tools.knip.ignore_dependencies = { value = ["tree-sitter-bash", "tree-sitter-css", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-typescript"], reason = "The build copies these grammar files by path." }

[[scope]]
path = "tests"
configurations = ["zod"]
removed_configurations = { value = ["astro", "jest", "nestjs", "nextjs", "react", "react-dom", "svelte", "vitest", "vue", "cloudflare"], reason = "The test code uses none of these frameworks; only the sandboxes that the tests create do." }
tools.knip.ignore_dependencies = { value = ["@darraghor/eslint-plugin-nestjs-typed", "@next/eslint-plugin-next", "@react-native/eslint-plugin", "@vitest/eslint-plugin", "bats", "eslint-plugin-drizzle", "eslint-plugin-expo", "eslint-plugin-i18next", "eslint-plugin-jest", "eslint-plugin-react", "eslint-plugin-react-hooks", "eslint-plugin-react-native", "eslint-plugin-react-refresh", "eslint-plugin-svelte", "eslint-plugin-testing-library", "eslint-plugin-vue", "eslint-plugin-vuejs-accessibility", "pnpm", "supabase", "svelte-eslint-parser", "vue-eslint-parser", "yarn", "@nestjs/common", "@nestjs/core", "@tanstack/eslint-plugin-query", "eslint-plugin-jsx-a11y", "reflect-metadata", "rxjs", "vue"], reason = "Native sandbox commands load these packages from the linked tests installation." }

# Code may import its own files and the files of every import rule above it. can_import gives an exact list instead.
[[import_rule]]
name = "cli-config"
paths = ["packages/cli/src/config/**"]
can_import = ["cli-types"]

[[import_rule]]
name = "cli-types"
paths = ["packages/cli/src/types/**"]

[[import_rule]]
name = "system"
paths = ["packages/cli/src/system/**"]
can_import = ["cli-config", "cli-types", "repository"]

[[import_rule]]
name = "parsers"
paths = ["packages/cli/src/parsers/**", "packages/cli/src/schemas/parsers/**"]

[[import_rule]]
name = "configurations"
paths = ["packages/cli/src/configurations/**", "packages/cli/src/schemas/configurations/**"]
can_import = ["cli-config", "cli-types", "system", "parsers", "repository"]

[[import_rule]]
name = "repository"
paths = ["packages/cli/src/repository/**", "packages/cli/src/schemas/repository/**"]

[[import_rule]]
name = "write"
paths = ["packages/cli/src/apply/write/**"]

[[import_rule]]
name = "settings"
paths = ["packages/cli/src/settings/**", "packages/cli/src/schemas/settings/**"]

[[import_rule]]
name = "planning"
paths = ["packages/cli/src/planning/**"]

[[import_rule]]
name = "generation"
paths = ["packages/cli/src/generation/**", "packages/cli/src/schemas/generation.ts"]

[[import_rule]]
name = "tools"
paths = ["packages/cli/src/tools/**"]

[[import_rule]]
name = "session"
paths = ["packages/cli/src/session.ts"]

[[import_rule]]
name = "install"
paths = ["packages/cli/src/install/**", "packages/cli/src/schemas/install/**"]

[[import_rule]]
name = "apply"
paths = ["packages/cli/src/apply/*.ts", "packages/cli/src/apply/files/**"]

[[import_rule]]
name = "runs"
paths = ["packages/cli/src/runs/**", "packages/cli/src/schemas/runs/**"]

[[import_rule]]
name = "checks"
paths = ["packages/cli/src/checks/**", "packages/cli/src/schemas/checks/**"]

[[import_rule]]
name = "commands"
paths = ["packages/cli/src/commands/**", "packages/cli/src/schemas/commands.ts"]

[[import_rule]]
name = "main"
paths = ["packages/cli/src/main.ts", "packages/cli/src/bin.ts"]

[[import_rule]]
name = "plugin-config"
paths = ["packages/eslint-plugin/src/config/**"]
can_import = []

[[import_rule]]
name = "plugin-types"
paths = ["packages/eslint-plugin/src/types/**"]
can_import = []

[[import_rule]]
name = "plugin"
paths = ["packages/eslint-plugin/src/*.ts", "packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/plugin.d.ts", "packages/eslint-plugin/repository.mjs"]
can_import = ["plugin-config", "plugin-types"]

[[import_rule]]
name = "docs-config"
paths = ["docs/src/config/**"]
can_import = ["cli-config"]

[[import_rule]]
name = "docs-types"
paths = ["docs/src/types/**"]
can_import = ["cli-types"]

[[import_rule]]
name = "docs"
paths = ["docs/src/*.*", "docs/src/!(config|types)/**"]

[[import_rule]]
name = "tests-data"
paths = ["tests/config/**"]
can_import = ["cli-config", "tests-setup"]

[[import_rule]]
name = "tests-types"
paths = ["tests/types/**"]
can_import = ["cli-types", "plugin-types", "tests-data"]

[[import_rule]]
name = "tests-setup"
paths = ["tests/setup/**", "tests/schemas/**"]

[[import_rule]]
name = "tests"
paths = ["tests/suites/**"]

[[import_rule]]
name = "config-files"
paths = ["packages/cli/configurations/**/config-files/**"]
can_import = ["cli-types"]

[[ignore]]
check = "dependencies/osv-scanner"
rule = "GHSA-ch52-4w7c-c8xp"
reason = "As checked on 2026-10-20, no release fixes the max-stale flaw: bun.lock holds 4.2.0, and 4.3.0 changes only Vary handling. Astro and make-fetch-happen use it in the docs and tests workspaces, which share no cached responses between users."
until = 2026-11-19

[[ignore]]
check = "dependencies/osv-scanner"
rule = "GHSA-vfj7-8cjw-p6xm"
reason = "As checked on 2026-10-20, braces 3.0.3 has no patched release and is used only by development tools to expand patterns written in this repository."
until = 2026-11-19

[[ignore]]
check = "docs/missing-paths"
paths = ["packages/cli/configurations/infrastructure/docker/rules/DOCKER.md", "packages/cli/configurations/language/html/rules/HTML.md", "packages/cli/configurations/platform/supabase/rules/SUPABASE.md"]
reason = "Paths in shipped rules are examples for user projects."

[[ignore]]
check = "javascript/eslint"
rule = "import-x/exports-last"
reason = "This repository exports declarations inline. Its ESLint generator omits import-x/exports-last."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/restrict-dependency-ranges"
paths = ["packages/eslint-plugin/package.json"]
reason = "A published library uses ranges for dependencies and peers."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/specify-peers-locally"
paths = ["packages/eslint-plugin/package.json"]
reason = "The tests workspace installs TypeScript and typescript-eslint, which the plugin tests load. The plugin builds with Bun and needs neither to build."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/configurations/general/prose/config-files/styles/LICENSES.md"]
reason = "This file reproduces upstream license notices and terms whose wording must remain unchanged."

[[ignore]]
check = "prose/vale"
rule = "gspot.session-identifiers"
paths = ["tests/config/integration/checks/general/prose/scopes.ts"]
reason = "This sample URL holds a session identifier so that the Vale test sees the rule report it."

[[ignore]]
check = "prose/vale"
rule = "write-good.E-Prime"
paths = ["README.md", "packages/cli/README.md", "docs/src/content/docs/start/overview.md"]
reason = "These files open with the owner's product description, which keeps its wording."

[[ignore]]
check = "site/html-validate"
rule = "element-permitted-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "no-implicit-button-type"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "text-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "unique-landmark"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "spelling/typos"
paths = ["tests/config/checks/general/spelling.ts"]
reason = "This literal supplies a deliberate misspelling to the spelling checks and their corrections."

[[ignore]]
check = "structure/lone-files"
rule = "lone-file"
paths = ["packages/cli/configurations/language/markdown/config-files/markdownlint-cli2.ts"]
reason = "The manifest loader discovers config files in config-files/ and reads this module by its external markdownlint-cli2 target filename."

[[ignore]]
check = "structure/pass-through-folders"
paths = ["packages/cli/src/checks/database", "packages/cli/src/config/checks/database", "tests/config/checks/database", "tests/suites/unit/cli/checks/database"]
reason = "The database group holds one configuration, postgres, and every group keeps each configuration in its own folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["docs/src/content.config.ts"]
reason = "Astro fixes this name beside the content folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/cli/src/generation/configurations/framework/react*.ts"]
reason = "The react and react-dom configurations name these generators, after their npm packages."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/src/config/rules/**", "tests/suites/unit/eslint-plugin/rules/**"]
reason = "ESLint rule IDs are the file names, and they share their first word by convention."
