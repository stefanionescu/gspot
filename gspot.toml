[[naming.override]]
paths = ["packages/cli/src/checks/general/prose.ts"]
allowed_names = ["Check", "Line", "Message", "Span"]
reason = "Vale identifies these JSON diagnostic fields with this exact capitalization."

[[naming.override]]
