#:schema ./gspot.schema.json

# Run gspot apply after changing policy. Use gspot explain <name> to inspect a setting.

version = 1
presets = ["bash", "spelling", "typescript", "markdown", "prose", "commits", "configs", "naming", "formatting", "docs", "secrets", "dependencies", "licenses", "duplication", "security"]

[[scope]]
path = "packages/cli"
presets = []

[[scope]]
path = "packages/eslint-plugin"
presets = []

[[scope]]
path = "docs"
presets = ["typescript"]

[hooks]
tool = "gspot"

[rules]
install = true
directory = ".gspot/rules"

[coverage]
strict = false

[runner]
tool = "mise"

[tools]

[tools.docs]
paths_allowed = [
    {patterns = ["rules/**"], reason = "The rule corpus is generic text installed into other repositories; it names nothing in this one."},
    {patterns = ["architecture/**"], reason = "The architecture names files in other repositories and files that are not built yet."},
    {patterns = ["docs/**"], reason = "The manual names files in the reader's repository and check ids written with a slash."},
]

[tools.lychee]
exclude_paths = [{paths = ["docs/src/content/docs/**"], reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."}]

[tools.typos]
words = [{word = "udid", reason = "Apple's device identifier API name."}, {word = "certifi", reason = "The Python certificate package name."}, {word = "axe", reason = "The axe-core accessibility package name."}, {word = "Virtua", reason = "The Virtua list virtualisation library."}, {word = "virtua", reason = "The Virtua list virtualisation library."}, {word = "synchronise", reason = "British spellings the naming policy bans on purpose."}, {word = "synchronised", reason = "British spellings the naming policy bans on purpose."}, {word = "materialise", reason = "British spellings the naming policy bans on purpose."}, {word = "IFEs", reason = "The ESLint option name for immediately invoked functions."}, {word = "IIF", reason = "The word typos sees inside the ESLint option IIFEs."}, {word = "capitalisation", reason = "The sqlfluff rule group is spelled capitalisation in its own configuration keys."}, {word = "speling", reason = "A preset name misspelled on purpose in the profile test."}]
exclude = [{paths = ["presets/prose/styles/gspot/us-english.yml"], reason = "A list of British spellings mapped to their US forms."}]

[[naming.rules]]
paths = ["packages/cli/src/checks/types.ts"]
names = ["Fingerprint", "File", "RuleID", "Commit"]
exclude = true
reason = "gitleaks writes these keys in its report and its baseline, and the type names them as they are."

[[naming.rules]]
paths = ["packages/cli/src/checks/types.ts", "packages/cli/src/checks/dependencies/manifest-policy.ts"]
names = ["packageManager"]
exclude = true
reason = "package.json names the key packageManager, and the code reads it under that name."

[[naming.rules]]
paths = ["packages/cli/src/readers/sql/types.ts"]
names = ["lengthBytesUTF8", "stringToUTF8", "UTF8ToString", "_malloc", "_free", "_wasm_parse_query_raw", "_wasm_free_parse_result", "stmt_location", "stmt_len"]
exclude = true
reason = "Emscripten and libpg-query name these members, and the type spells them as the module exports them."

[[naming.rules]]
paths = ["packages/cli/src/checks/xcode/types.ts"]
names = ["shouldTranslate"]
exclude = true
reason = "Xcode writes this key in a string file, and the type spells it as the file does."

[architecture]
roles = {env = "packages/cli/src/platform/environment.ts"}

[tools.eslint]
import_style = {"**/*" = "ts"}
script_files = ["packages/npm/**", "packages/cli/build.ts", "packages/cli/publish.ts", "packages/cli/schemas.ts", "packages/cli/src/rules/command.ts", "packages/eslint-plugin/build.ts", "docs/src/content/reference.ts"]
globals = {"packages/npm/**" = "commonjs"}
node_version = ">=24.2.0"

[tools.knip]
entry = ["**/build.ts", "**/publish.ts", "packages/cli/schemas.ts", "packages/cli/src/rules/command.ts", "packages/npm/gspot/gspot.js", "docs/src/content/reference.ts", "docs/astro.config.ts", "docs/src/content.config.ts"]
ignore_dependencies = [{name = "eslint-plugin-expo", reason = "The ESLint configuration of the planted react-native test repository imports it."}, {name = "@nestjs/common", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "@nestjs/core", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "reflect-metadata", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "rxjs", reason = "The planted nestjs test type-checks a test repository against it, which knip cannot see."}, {name = "eslint-plugin-vue", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "vue-eslint-parser", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "eslint-plugin-svelte", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "svelte-eslint-parser", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "svelte", reason = "The planted components test lints a test repository with it, which knip cannot see."}, {name = "@types/node", reason = "Next.js refuses to write its types in the planted test repository when the package is absent."}, {name = "next", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "react", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "react-dom", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "@types/react", reason = "The planted nextjs test runs the framework in a test repository, which knip cannot see."}, {name = "@next/eslint-plugin-next", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-react-hooks", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-react", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-i18next", reason = "The ESLint configuration of the planted nextjs test repository imports it."}, {name = "eslint-plugin-zod", reason = "The ESLint configuration of the planted libraries test repository imports it."}, {name = "@tanstack/eslint-plugin-query", reason = "The ESLint configuration of the planted libraries test repository imports it."}, {name = "eslint-plugin-drizzle", reason = "The ESLint configuration of the planted libraries test repository imports it."}, {name = "linkinator", reason = "The planted static-site test runs it in a test repository, which knip cannot see."}, {name = "svgo", reason = "The planted static-site test runs it in a test repository, which knip cannot see."}, {name = "purgecss", reason = "The planted static-site test runs it in a test repository, which knip cannot see."}, {name = "stylelint", reason = "The planted css test runs it in a test repository, which knip cannot see."}, {name = "stylelint-config-standard", reason = "The stylelint configuration of a planted test repository extends it."}, {name = "html-validate", reason = "The planted html test runs it in a test repository, which knip cannot see."}, {name = "vitest", reason = "The planted vitest test runs it in a test repository, which knip cannot see."}, {name = "@vitest/coverage-v8", reason = "The planted vitest test needs the coverage provider in a test repository."}, {name = "@vitest/eslint-plugin", reason = "The ESLint configuration of a planted test repository imports it."}, {name = "@stoplight/spectral-cli", reason = "The planted express test runs it by name, which knip cannot see."}, {name = "verdaccio", reason = "The release test starts it through bunx, which knip cannot see."}, {name = "tree-sitter-bash", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-css", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-go", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-html", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-javascript", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-python", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-typescript", reason = "The grammar WASM file is read from the package, not imported."}]

[structure]
folder_name_allowed = [{paths = ["packages/cli/src/checks/python", "packages/cli/src/checks/swift", "packages/cli/src/checks/typescript", "packages/cli/src/structure/python", "packages/cli/src/structure/swift"], reason = "Language names identify the implemented check and parser domains in the architecture ownership layout."}]
single_file_folder_allowed = [{paths = ["packages/npm/gspot"], reason = "The npm launcher package is one file by design: it runs the platform package that installed."}]
prefix_collision_allowed = [{paths = ["packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/tests/rules/**"], reason = "ESLint rule ids are the file names, and the ids share their first word by convention."}, {paths = ["docs/src"], reason = "Astro fixes the name of the content configuration file beside the content folder."}]

[[vendored]]
paths = ["packages/cli/grammars/swift.wasm", "packages/cli/grammars/swift.LICENSE", "packages/cli/notices.json"]
reason = "Pinned upstream grammar and license text are retained with source records; bun packages/cli/grammars/swift.build.ts owns the Swift outputs."

# The published JSON schemas are written from the zod schemas; this says whether they still match.
[[check]]
name = "schema/generated"
command = ["bun", "packages/cli/schemas.ts", "--check"]
paths = ["gspot.schema.json", "packages/cli/src/policy/schema.ts", "packages/cli/src/run/report-schema.ts"]
stage = "commit"
summary = "Checks that the published JSON schemas match the zod schemas the binary reads with."

[[generated]]
paths = ["gspot.schema.json"]
produced_by = "bun packages/cli/schemas.ts"

# The rule corpus is this repository's product; its lint is this repository's check and ships in no binary.
[[check]]
name = "rules/lint"
command = ["bun", "packages/cli/src/rules/command.ts"]
paths = ["rules/**", "packages/cli/src/rules/**"]
stage = "commit"
summary = "Lints rule files for front matter, links, size, layer boundaries, and fences."

[tools.licenses]
exceptions = [{package = "eslint-plugin-sonarjs@4.2.0", license = "LGPL-3.0-only", reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the binary."}, {package = "lightningcss@1.33.0", license = "MPL-2.0", reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."}, {package = "truncate-utf8-bytes@1.0.2", license = "WTFPL", reason = "A permissive license with no conditions; it arrives through a test tool and ships in nothing."}]

[tools.osv]
ignore = [{id = "GHSA-w5hq-g745-h8pq", reason = "uuid 9 arrives through gaxios under linkinator, a test tool. The flaw needs a caller that passes its own buffer, and gaxios passes none. Review when linkinator moves to uuid 11."}]

[[ignore]]
check = "configs/actions-security"
rule = "self-repository"
paths = [ ".github/workflows/release.yml" ]
reason = "Pinned Actionlint rejects the self-repository dollar syntax; retain its supported local reusable-workflow path."
