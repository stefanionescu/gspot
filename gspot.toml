[tools.osv]


[tools.jest]
global_package = "bun:test"

[[ignore]]
check = "jest/coverage"
reason = "This repository runs Bun tests. tests/unit runs unit and integration tests at push; tests/coverage measures their coverage with Bun instead of invoking Jest."

[[ignore]]
check = "security/semgrep"
rule = "node-no-configured-require"
paths = [
    "packages/cli/src/native/eslint-preview.ts",
    "packages/cli/src/native/eslint.ts",
]
reason = "These configuration evaluators intentionally execute repository-selected modules and installed tool APIs in the configuration subprocess. Static imports select the CLI dependencies instead of the repository dependencies and cannot preserve executable configuration. Other security rules remain active for these exact files."

[[ignore]]
check = "prose/vale"
rule = "Google.OxfordComma"
paths = [".mise/gspot/gspot"]
reason = "The required Bash runtime header is a version followed by two platforms, not a three-item list. The script runtime parser requires the exact macOS and Linux spelling. Remove this exception if that header contract changes or the upstream prose rule distinguishes this syntax."

[[ignore]]
check = "typescript/eslint"
rule = "gspot/no-trivial-functions"
paths = ["packages/cli/src/policy/messages.ts"]
reason = "Every policy message has one builder here, and tests/unit/cli/policy/messages.test.ts reads each builder for the shared vocabulary. A builder is one template, so the trivial-function rule would ask for every message text to be copied to its callers. Remove this entry if the catalog moves out of functions."

[[ignore]]
check = "typescript/eslint"
rule = "package-json/require-exports"
paths = ["packages/npm/package.json"]
reason = "The npm package exposes a command through bin and has no importable module API. An exports map would change existing package subpath resolution. Remove this exception if the launcher gains a module API."

[[check]]
name = "tests/unit"
command = ["mise", "run", "test"]
paths = [
    "packages/cli/**",
    "packages/eslint-plugin/**",
    "tests/**",
    ".mise/gspot/**",
    "packages/cli/kits/**",
    "packages/cli/guides/**",
    "package.json",
    "bun.lock",
    "tsconfig.json",
    "mise.toml",
    "docs/**",
    ".mise/conf.d/repo.toml",
]
stage = "push"
summary = "Runs the routine unit and integration suites, including CLI, plugin, and documentation tests."

[check.output]
format = "none"

[[check]]
name = "tests/coverage"
command = ["mise", "run", "test:coverage"]
paths = [
    "packages/cli/**",
    "packages/eslint-plugin/**",
    "tests/**",
    ".mise/gspot/**",
    "packages/cli/kits/**",
    "packages/cli/guides/**",
    "package.json",
    "bun.lock",
    "tsconfig.json",
    "mise.toml",
    "docs/**",
    ".mise/conf.d/repo.toml",
]
stage = "manual"
summary = "Measures unit and integration coverage with Bun without imposing a percentage quota."

[check.output]
