allowed_names = ["ArtifactName", "PkgName", "Results", "RuleID", "SchemaVersion", "Secrets", "Target", "Title", "Vulnerabilities", "VulnerabilityID"]
reason = "Trivy identifies these JSON report fields with these exact names."

[[naming.override]]
