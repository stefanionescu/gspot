[dependencies]
scanner = "@socketsecurity/bun-security-scanner"

[docs]
allowed_urls = { value = ["^https://generativespotting\\.com/(?:configure/gspot-toml/|gspot\\.schema\\.json|start/concepts/#levels|start/install/|start/quickstart/|use/agent-rules/|use/ci/|use/findings/|use/hooks/)$", "^https://www\\.npmjs\\.com/package/@gspothq/cli$"], reason = "The built site contains these new routes; remove their exclusions after deployment. The npm package page returns HTTP 403 to automated requests." }

[licenses]
allowed = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Unlicense", "BlueOak-1.0.0", "Python-2.0"]

[[licenses.allowed_package]]
name = "@csstools/selector-specificity"
version = "5.0.0"
reason = "The CSS tooling dependency uses the MIT No Attribution license; its installed package retains the license text."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist-mono"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[[licenses.allowed_package]]
name = "axe-core"
version = "4.13.0"
reason = "The JSX accessibility lint plugin requires this unmodified development dependency. Its installed LICENSE identifies MPL-2.0; it is not included in the gspot package."

[[licenses.allowed_package]]
name = "eslint-plugin-sonarjs"
version = "4.2.0"
reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the gspot package."

[[licenses.allowed_package]]
name = "lightningcss"
version = "1.33.0"
reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."

[tools.commitlint]
scopes = ["cli", "eslint-plugin", "docs", "root", "deps"]

[tools.eslint]
import_extension = "ts"

[tools.knip]
ignore_dependencies = { value = ["@fontsource-variable/geist", "@fontsource-variable/geist-mono", "tree-sitter-bash", "tree-sitter-css", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-typescript"], reason = "The build imports these packages through CSS or copies their grammar files by path." }
entry = ["tests/setup/prepare-run.ts", "tests/setup/integration.ts", "packages/cli/src/checks/framework/site/linkinator-process.ts", "packages/cli/src/checks/framework/site/purgecss-process.ts", "packages/cli/configurations/language/javascript/eslint-runtime.mjs"]

[tools.typos]
extra = { value = { type = { license_names = { extend-glob = ["gspot.toml"], extend-words = { axe = "axe" } }, zod_types = { extend-glob = ["shapes.ts"], extend-words = { optin = "optin" } } } }, reason = "Typos splits the published axe-core license name; Zod names its optional input marker optin." }

[[scope]]
path = "docs"
configurations = ["css", "astro", "zod", "cloudflare", "site"]
site.build_command = ["bun", "--bun", "astro", "build"]
tools.knip.ignore_dependencies = { value = ["satteri"], reason = "Astro prerender externalizes this native Markdown loader in astro.config.ts. A direct dependency keeps Bun’s package lookup at the installed loader origin; the site build verifies native resolution." }

[[scope]]
path = "packages/cli"
configurations = ["zod"]

[[scope]]
path = "tests"
configurations = ["zod"]
removed_configurations = ["astro", "jest", "nestjs", "nextjs", "react", "react-dom", "svelte", "vitest", "vue", "cloudflare"]
tools.knip.ignore_dependencies = { value = ["@darraghor/eslint-plugin-nestjs-typed", "@next/eslint-plugin-next", "@react-native/eslint-plugin", "@vitest/eslint-plugin", "bats", "eslint-plugin-drizzle", "eslint-plugin-expo", "eslint-plugin-i18next", "eslint-plugin-jest", "eslint-plugin-react", "eslint-plugin-react-hooks", "eslint-plugin-react-native", "eslint-plugin-react-refresh", "eslint-plugin-svelte", "eslint-plugin-testing-library", "eslint-plugin-vue", "eslint-plugin-vuejs-accessibility", "pnpm", "supabase", "svelte-eslint-parser", "vue-eslint-parser", "yarn", "@nestjs/common", "@nestjs/core", "@tanstack/eslint-plugin-query", "eslint-plugin-jsx-a11y", "reflect-metadata", "rxjs", "vue"], reason = "Native sandbox commands load these packages from the linked tests installation." }

[[ignore]]
check = "dependencies/osv"
rule = "GHSA-ch52-4w7c-c8xp"
reason = "As checked on 2026-10-09, http-cache-semantics 4.3.0 has no patched release and is used only in development without sharing cached responses between users."
until = 2026-11-08

[[ignore]]
check = "dependencies/osv"
rule = "GHSA-vfj7-8cjw-p6xm"
reason = "As checked on 2026-10-09, braces 3.0.3 has no patched release and is used only by development tools to expand patterns written in this repository."
until = 2026-11-08

[[ignore]]
check = "docs/lychee"
paths = ["docs/src/content/docs/**"]
reason = "Starlight builds these source links into site routes; site/linkinator checks their targets in the built site."

[[ignore]]
check = "docs/missing-paths"
paths = ["packages/cli/configurations/*/*/rules/**"]
reason = "Paths in shipped rules are examples for user projects."

[[ignore]]
check = "docs/missing-paths"
paths = ["packages/cli/RELEASE_NOTES.md"]
reason = "Release notes quote commands and task names of the version they describe, which later versions may rename."

[[ignore]]
check = "javascript/eslint"
rule = "@typescript-eslint/no-magic-numbers"
paths = ["tests/data/**"]
reason = "These declarations hold fixed test data; giving each literal another constant would duplicate the same data."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/no-redundant-files"
paths = ["packages/cli/package.json"]
reason = "The CLI package keeps its exact published file list explicit, including the executable named by bin."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/restrict-dependency-ranges"
paths = ["packages/eslint-plugin/package.json"]
reason = "A published library uses ranges for dependencies and peers."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/specify-peers-locally"
paths = ["packages/eslint-plugin/package.json"]
reason = "The tests workspace declares TypeScript and checks the packed plugin declaration. The plugin builds with Bun."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/configurations/general/prose/tool-files/vale/styles/LICENSES.md"]
reason = "This file reproduces upstream license notices and terms whose wording must remain unchanged."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/RELEASE_NOTES.md"]
reason = "Release notes describe what changed between versions, so they name past states and old behavior on purpose."

[[ignore]]
check = "prose/vale"
rule = "Google.Parens"
paths = [".mise/tasks/test"]
reason = "Required #MISE assignments contain task metadata. The corrected token pattern handles them after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "Google.Parens"
paths = ["packages/cli/configurations/language/javascript/eslint-runtime.mjs"]
reason = "Nested JSDoc type syntax is machine metadata. The corrected token pattern handles it after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "Google.Quotes"
paths = [".mise/tasks/build"]
reason = "Required #MISE assignments contain task metadata. The corrected token pattern handles them after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "gspot.acronyms"
paths = [".mise/tasks/build", ".mise/tasks/docs/build", ".mise/tasks/docs/deploy", ".mise/tasks/docs/serve", ".mise/tasks/packages/cli/build", ".mise/tasks/packages/eslint-plugin/build", ".mise/tasks/release", ".mise/tasks/setup", ".mise/tasks/test"]
reason = "Required #MISE assignments contain task metadata. The corrected token pattern handles them after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "gspot.alt-text"
paths = ["tests/integration/checks/markdown.test.ts"]
reason = "The markdownlint test needs an image without alt text. gspot 0.3.0 runs this markup rule on markup files only."

[[ignore]]
check = "prose/vale"
rule = "gspot.file-paths"
paths = [".mise/tasks/packages/eslint-plugin/build", ".mise/tasks/test"]
reason = "Required #MISE assignments contain task metadata. The corrected token pattern handles them after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "gspot.placeholders"
paths = [".mise/tasks/docs/build", ".mise/tasks/docs/deploy", ".mise/tasks/docs/serve", ".mise/tasks/packages/cli/build", ".mise/tasks/packages/eslint-plugin/build"]
reason = "Required #MISE assignments contain task metadata. The corrected token pattern handles them after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "gspot.sentence-length"
paths = ["packages/cli/configurations/language/javascript/eslint-runtime.mjs"]
reason = "Nested JSDoc type syntax is machine metadata. The corrected token pattern handles it after the final pin upgrade."

[[ignore]]
check = "prose/vale"
rule = "gspot.session-identifiers"
paths = ["tests/data/checks/prose.ts"]
reason = "The sample for the session-identifier rule is a URL with a session id."

[[ignore]]
check = "prose/vale"
rule = "gspot.title-case"
paths = ["docs/README.md"]
reason = "DOC-037 requires the exact title Documentation site for this README; preserve its sentence case."

[[ignore]]
check = "prose/vale"
rule = "Harper.NumericRangeEnDash"
paths = ["docs/README.md"]
reason = "CC0-1.0 is the official license identifier for the supplied Simple Icons assets, not a numeric range."

[[ignore]]
check = "prose/vale"
rule = "write-good.E-Prime"
paths = ["docs/README.md"]
reason = "DOC-037 requires the exact sentence The sidebar is src/config/navigation.ts in this README."

[[ignore]]
check = "site/html-validate"
rule = "element-permitted-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "no-implicit-button-type"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "text-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "unique-landmark"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/svgo"
paths = ["docs/public/tools/jest.svg", "docs/public/tools/knip.svg", "docs/public/tools/pytest.svg", "docs/public/tools/trivy.svg", "docs/public/tools/typescript.svg", "docs/public/tools/vitest.svg", "docs/assets/readme/badges/npm.svg", "docs/assets/readme/badges/license.svg"]
reason = "These exact supplied official assets retain their approved bytes; the owner removed the SVG byte-saving check in CHK050 and decision 25."

[[ignore]]
check = "spelling/typos"
paths = ["tests/data/checks/spelling.ts"]
reason = "This literal supplies a deliberate misspelling to the spelling checks and their corrections."

[[ignore]]
check = "structure/lone-files"
paths = ["docs/src/pages/index.astro"]
reason = "Astro routes the home page by this file."

[[ignore]]
check = "structure/lone-files"
paths = ["docs/src/types/reference.ts"]
reason = "The Folders rule keeps every type of the docs site in docs/src/types/, and the site has one type file."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["docs/src/content.config.ts"]
reason = "Astro fixes this name beside the content folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/cli/src/config/generation/tool-files.ts", "packages/cli/src/generation/eslint/fragments/react*.ts"]
reason = "The files are named after their topic and their npm packages."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/eslint-plugin/src/rules/**", "tests/unit/eslint-plugin/**"]
reason = "ESLint rule IDs are the file names, and they share their first word by convention."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["tests/data/checks/swift-tests.ts", "tests/integration/checks/swift-tests.test.ts", "tests/unit/cli/checks/swift-tests.test.ts"]
reason = "The test files are named after the swift and swift-tests configurations."
