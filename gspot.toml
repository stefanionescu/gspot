#:schema https://unpkg.com/@gspothq/cli@0.1.1/gspot.schema.json

# gspot settings for this repository. Change them with gspot set, unset, ignore, add, and remove.

level = "all"
configurations = ["typescript", "markdown", "github-actions", "bash"]
allowed_words = { value = ["capitalisation", "IIF", "LICENCE", "next-intl", "udid", "NGINX", "Stylelint", "markdownlint", "React", "Native", "Simple", "Icons"], reason = "SQLFluff uses capitalisation; ESLint uses IIFEs; tests use LICENCE and Apple’s udid; next-intl is a package; NGINX, Stylelint, markdownlint, React Native, and Simple Icons are official product names used in the documentation." }

[hooks]
enabled = true

[ci]
setup_command = ["mise", "run", "setup"]
enabled = true

[naming]
# Use the Names table word.
banned_words = ["catalog", "corpus", "render", "sync", "materialize", "coerce", "scoped", "bind", "load", "fetch", "resolve", "probe", "fixture", "shell", "diagnostic", "directory", "envelope", "outcome", "emit"]

[[naming.override]]
paths = ["packages/cli/src/types/settings/**"]
allowed_names = ["may_import", "tool_timeout_seconds", "test_files", "removed_configurations", "final_newline", "v8r", "ParsedV8r"]
reason = "These fields carry the gspot.toml key names."

[[naming.override]]
paths = ["docs/src/content/docs/404.md"]
allow_digits = true
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.override]]
paths = ["tests/types/tool-output.ts"]
allowed_names = ["rule_id"]
reason = "SwiftLint JSON diagnostics identify the native rule using rule_id."

[[naming.override]]
paths = ["packages/cli/src/types/checks/{database,framework,general,infrastructure,language,library,platform}.ts", "packages/cli/src/types/commands/list.ts", "packages/cli/src/types/configurations.ts", "packages/cli/src/types/parsers/output.ts", "packages/cli/src/types/repository/selection.ts", "packages/cli/src/types/rules.ts", "packages/cli/src/types/settings/**"]
categories = ["properties"]
cases = ["camel", "upper-snake", "snake"]
reason = "These properties retain the serialized gspot.toml, configuration manifest and tool report field names."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/site/linkinator-process.ts"]
allowed_names = ["LinkChecker"]
reason = "Linkinator exports LinkChecker under this exact name."

[[naming.override]]
