#:schema https://unpkg.com/@gspothq/cli@0.1.1/gspot.schema.json

# gspot settings for this repository. Change them with gspot set, unset, ignore, add, and remove.

level = "all"
configurations = ["typescript", "markdown", "github-actions"]
allowed_words = { value = ["capitalisation", "IIF", "LICENCE", "next-intl", "udid"], reason = "SQLFluff uses capitalisation; ESLint uses IIFEs; tests use LICENCE and Apple’s udid; next-intl names a package." }

[hooks]
enabled = true

[ci]
setup_command = ["mise", "run", "setup"]
enabled = true

[naming]
banned_words = ["catalog", "catalogue", "corpus", "render", "sync", "synchronize", "materialize", "coerce", "scoped", "bind", "load", "loaded", "loader", "loaders", "loading", "fetch", "resolve", "resolving", "resolution", "probe", "probes", "probed", "probing", "fixture", "fixtures", "shell", "rendered", "renders", "resolved", "resolver", "synced", "bindings", "fetched"]

[[naming.override]]
paths = ["packages/cli/src/types/settings/**"]
allowed_names = ["may_import", "tool_timeout_seconds", "test_files", "removed_configurations", "final_newline", "v8r", "ParsedV8r"]
reason = "These fields carry the gspot.toml key names."

[[naming.override]]
paths = ["docs/src/content/docs/404.md"]
allow_digits = true
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.override]]
paths = ["tests/types/tool-output.ts"]
allowed_names = ["rule_id"]
reason = "SwiftLint JSON diagnostics identify the native rule using rule_id."

[[naming.override]]
paths = ["packages/cli/src/types/settings/**", "packages/cli/src/types/commands/list.ts", "packages/cli/src/types/checks/{database,framework,general,infrastructure,library,platform}.ts", "packages/cli/src/types/repository/selection.ts", "packages/cli/src/types/configurations.ts", "packages/cli/src/types/parsers/output.ts", "packages/cli/src/types/rules.ts"]
categories = ["properties"]
cases = ["camel", "upper-snake", "snake"]
reason = "These properties retain the serialized gspot.toml, configuration manifest and tool report field names."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/nextjs.ts"]
allowed_names = ["nextConfig"]
reason = "This check keeps the Next.js configuration reader name required by the final placement table."

[[naming.override]]
paths = ["packages/cli/src/checks/framework/site/linkinator-program.ts"]
allowed_names = ["LinkChecker"]
reason = "Linkinator exports LinkChecker under this exact name."

[[naming.override]]
paths = ["packages/cli/src/checks/general/licenses.ts"]
allowed_names = ["License", "Name", "Version"]
reason = "pip-licenses identifies these JSON fields with this exact capitalization."

[[naming.override]]
paths = ["packages/cli/src/checks/general/prose.ts"]
allowed_names = ["Check", "Line", "Message", "Span"]
reason = "Vale identifies these JSON diagnostic fields with this exact capitalization."

[[naming.override]]
paths = ["packages/cli/src/checks/infrastructure/docker.ts"]
allowed_names = ["ArtifactName", "PkgName", "Results", "RuleID", "SchemaVersion", "Secrets", "Target", "Title", "Vulnerabilities", "VulnerabilityID"]
reason = "Trivy identifies these JSON report fields with these exact names."

[[naming.override]]
paths = ["packages/cli/src/checks/infrastructure/nginx.ts"]
allowed_names = ["nginxConfigTest"]
reason = "This check keeps the NGINX configuration test name required by the final placement table."

[[naming.override]]
paths = ["packages/cli/src/checks/infrastructure/xcode/resources.ts"]
allowed_names = ["shouldTranslate"]
reason = "The Xcode string format names its translation control shouldTranslate."

[[naming.override]]
paths = ["packages/cli/src/checks/language/python/deptry.ts"]
allowed_names = ["extend_exclude"]
reason = "deptry names this TOML setting extend_exclude."

[[naming.override]]
paths = ["packages/cli/src/checks/platform/supabase.ts"]
allowed_names = ["denoConfigArguments", "readConfigToml"]
reason = "These readers keep the configuration function names required by the final placement table."

[[naming.override]]
paths = ["packages/cli/src/checks/testing/swift-tests.ts"]
allowed_names = ["module_type"]
reason = "Swift coverage JSON names the module type field module_type."

[[naming.override]]
paths = ["packages/cli/src/parsers/xcode.ts"]
allowed_names = ["rootObject"]
reason = "The Xcode project format names its top-level reference rootObject."

[[naming.override]]
paths = ["packages/cli/src/types/checks/platform.ts"]
allowed_names = ["file_path"]
reason = "The Supabase inventory names its file location field file_path."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/dependency-files.ts"]
allowed_names = ["packageManager"]
reason = "npm names this package.json field packageManager."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/output.ts"]
allowed_names = ["Data", "DetectorName", "Git", "SourceMetadata", "Verified", "fixInfo"]
reason = "These tool report properties retain the exact TruffleHog, Semgrep, markdownlint and typos JSON field names."

[[naming.override]]
paths = ["tests/unit/cli/generation/tool-file-sources/v8r.test.ts", "packages/cli/configurations/language/markdown/markdownlint-cli2.mjs"]
allow_digits = true
reason = "These files retain the official v8r and markdownlint-cli2 tool names."

[[naming.override]]
paths = ["tests/types/ci.ts"]
allowed_names = ["with"]
reason = "GitHub Actions calls its action argument record with."

[[naming.override]]
paths = ["packages/cli/src/types/configurations.ts"]
categories = ["properties"]
allowed_names = ["when"]
reason = "The shipped configuration manifest format names its selection condition when."

[[naming.override]]
paths = ["packages/cli/src/config/execution/copy.ts"]
allowed_names = ["GIT_INDEX_INFO"]
reason = "The final placement names the arguments for Git --index-info GIT_INDEX_INFO."

[[naming.override]]
paths = ["packages/cli/src/config/generation/eslint-rules.ts"]
allowed_names = ["CORE_RULES"]
reason = "The final placement names the ESLint core lint rules CORE_RULES."

[[naming.override]]
paths = ["packages/cli/src/config/tools/find.ts"]
allowed_names = ["MISE_SHIMS_FOLDER"]
reason = "The final placement names the actual mise shims folder MISE_SHIMS_FOLDER."

[[naming.override]]
paths = ["packages/cli/src/generation/tool-file-sources/v8r.ts"]
allowed_names = ["v8r", "v8rToolFile"]
reason = "The final placement retains the official v8r tool name and its producer v8rToolFile."

[[naming.override]]
paths = ["packages/cli/src/tools/npm/lockfiles.ts"]
allowed_names = ["resolved"]
reason = "The npm lockfile format names each package download URL resolved."

[[naming.override]]
paths = ["packages/cli/src/types/generation/eslint.ts"]
allowed_names = ["customSyntax"]
reason = "Stylelint names its parser option customSyntax."

[[naming.override]]
paths = ["packages/cli/src/types/objects.ts"]
allowed_names = ["_zod"]
reason = "Zod names its schema information property _zod."

[[naming.override]]
paths = ["packages/cli/src/tools/npm/package-manager.ts"]
allowed_names = ["detectPackageManager", "package-manager", "packageManager", "packageManagerDeclarationSchema", "packageManagerSchema", "parsePackageManagerField", "readPackageManagerDeclaration", "readPackageManagerVersion", "selectPackageManager"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/commands/session.ts"]
allowed_names = ["getPackageManagerIdentity", "packageManager", "packageManagerIdentity", "packageManagerState"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/config/tools/npm.ts"]
allowed_names = ["MISSING_PACKAGE_MANAGER_MESSAGE"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/tools/npm/tool-project.ts"]
allowed_names = ["packageManager", "packageManagerName"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/types/planning.ts"]
allowed_names = ["getPackageManager", "requirePackageManager"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/types/tools/project.ts"]
allowed_names = ["PackageManagerArguments", "PackageManagerCommand", "packageManager", "requirePackageManager"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/tools/npm/lockfiles.ts"]
allowed_names = ["packageManager"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/tools/npm/project.ts"]
allowed_names = ["assertPackageManagerVersion", "packageManager", "runPackageManager", "selectPackageManagerArguments"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[[naming.override]]
paths = ["packages/cli/src/types/parsers/dependency-files.ts"]
allowed_names = ["PackageManager", "PackageManagerDeclaration"]
reason = "The repository Names table requires package manager for npm, pnpm, Yarn, and Bun."

[architecture.roles]
environment_readers = ["packages/cli/src/system/environment.ts", "tests/setup/environment.ts"]
scripts = ["scripts/**"]

# A module may import itself and the modules in its may_import list.
[[architecture.module]]
name = "cli-config"
paths = ["packages/cli/src/config/**"]
may_import = []

[[architecture.module]]
name = "cli-types"
paths = ["packages/cli/src/types/**"]
may_import = ["cli-config"]

[[architecture.module]]
name = "plugin-config"
paths = ["packages/eslint-plugin/src/config/**"]
