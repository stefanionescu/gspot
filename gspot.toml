#:schema https://gspot.dev/schema/gspot.schema.json

# Run gspot apply after changing policy. Use gspot explain <name> to inspect a setting.

level = "all"
kits = [
    "bash",
    "spelling",
    "typescript",
    "markdown",
    "prose",
    "commits",
    "files",
    "actions",
    "naming",
    "format",
    "docs",
    "secrets",
    "dependencies",
    "licenses",
    "duplication",
    "security",
]
runner = "mise"
# The root scripts run the test suites and the local plugin, so they take the test overrides.
tests = ["**/*.{test,spec}.{ts,tsx,js,jsx,mjs,cjs}", "**/tests/**", "**/__tests__/**", "scripts/**"]
naming.banned = [
    "catalog",
    "catalogue",
    "corpus",
    "render",
    "sync",
    "synchronize",
    "synchronise",
    "materialize",
    "materialise",
    "coerce",
    "scoped",
    "bind",
    "load",
    "loaded",
    "loader",
    "loaders",
    "loading",
    "fetch",
    "resolve",
    "resolving",
    "resolution",
    "probe",
    "probes",
    "probed",
    "probing",
    "fixture",
    "fixtures",
    "shell",
]

[[scope]]
path = "docs"
kits = ["typescript", "css", "astro"]

[hooks]

[rules]
install = true
path = ".gspot/rules"

[tools]

[tools.docs]

[[tools.docs.exclude]]
paths = [
    ".github/workflows/gspot.yml",
    "packages/cli/grammars",
]
reason = "These documented paths are ignored build or installation outputs, exact packaged asset identities, or outputs of optional consumer configurations. Their source manifests and build owners define them. Remove an entry when its output contract or documentation is removed."

[[tools.docs.exclude]]
paths = [
    "src/orders.ts",
    "src/discounts.ts",
    "src/utils.ts",
    "src/receipt.ts",
    "./orders.js",
    "./utils.js",
]
reason = "Documentation walkthroughs and regression records use these exact consumer paths, deliberately invalid imports, and sandbox module names. They are not tracked checkout claims. Remove an entry when its example or regression record is removed."

[[tools.docs.exclude]]
paths = ["acceptance/kits/language/css.test.ts"]
reason = "The documented acceptance command resolves this argument from its declared tests working directory; the tracked target is tests/acceptance/kits/language/css.test.ts."

[[tools.docs.exclude]]
paths = ["packages/cli/rules/**", "packages/cli/kits/*/*/rules/**"]
reason = "The rules are generic text installed into other repositories; they name nothing in this one."

[[tools.docs.exclude]]
paths = [".gitlab/ci/gspot.yml"]
reason = "This documented integration destination belongs to consumer repositories that select GitLab CI."

[[tools.docs.exclude]]
paths = [
    "packages/eslint-plugin/dist",
    "packages/cli/dist",
    "packages/cli/dist/gspot.js",
    ".gspot/state",
    ".gspot/.venv",
]
reason = "These exact documented outputs are ignored build products, runtime state, or configuration generated only for selected consumer integrations. Source manifests and output tests own their paths."

[[tools.docs.exclude]]
paths = [
    "scripts/check-notes.ts",
    "notes/deploy.txt",
    "bash",
    "supabase/config.toml",
    "src/app.ts",
]
reason = "The rules explicitly introduce these downloaded binaries, consumer project resources, and example files. They are not claims that this checkout tracks them."

[tools.lychee]

[[tools.lychee.exclude]]
paths = ["docs/src/content/docs/**"]
reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."
[tools.typos]

[[tools.typos.exclude]]
paths = ["tests/harness/spelling.ts"]
reason = "The deliberate misspellings the spelling tests plant; every other test file stays checked."

[[tools.typos.exclude]]
paths = ["packages/cli/kits/general/prose/styles/gspot/us-english.yml"]
reason = "The Vale substitution list names the British spellings it corrects."

[[tools.typos.words]]
word = "udid"
reason = "Apple's device identifier API name."

[[tools.typos.words]]
word = "axe"
reason = "The axe-core accessibility package name."

[[tools.typos.words]]
word = "capitalisation"
reason = "SQLFluff names its rule group capitalisation; the SQL template and its tests quote it."

[[tools.typos.words]]
word = "materialise"
reason = "The naming policy bans this British spelling by name, so the policy and the notes spell it."

[[tools.typos.words]]
word = "synchronise"
reason = "The naming policy bans this British spelling by name, so the policy and the notes spell it."

[[tools.typos.words]]
word = "IIFEs"
reason = "ESLint's max-lines-per-function option and the unicorn rule description spell the plural so."

[[naming.allowed]]
name = "snapshot"
reason = "A snapshot is the copy of a revision that gspot checks; the tests name that product concept, not a test fixture."

[[naming.protocol_keys]]
file = "packages/cli/src/types/kits.ts"
names = [
    "check_references",
    "crash_pattern",
    "query_packs",
    "rule_url",
    "version_command",
    "version_exit_code",
    "version_pattern",
]
reason = "Kit manifests declare these keys, and the normalized types keep their spelling."

[[naming.protocol_keys]]
file = "packages/cli/src/types/policy/policy.ts"
names = [
    "allow_digits",
    "allow_duplicate_words",
    "ban_digits",
    "ban_repeats",
    "case_insensitive",
    "config_directory",
    "dropped_groups",
    "edges_allowed",
    "folder_names_allowed",
    "lone_files_allowed",
    "max_chars",
    "max_words",
    "prefix_collisions_allowed",
    "protocol_keys",
    "structural_prefix",
    "types_directory",
    "whole_parts",
]
reason = "Public gspot.toml keys, and the keys of the naming policy gspot ships."

[[naming.protocol_keys]]
file = "packages/cli/src/types/repository/revisions.ts"
names = ["object"]
reason = "The pre-push JSON report names Git object identities with this key."

[[naming.protocol_keys]]
file = "packages/cli/src/types/commands/check.ts"
names = ["object"]
reason = "The pre-push JSON report names Git object identities with this key."

[[naming.protocol_keys]]
file = "packages/cli/src/types/commands/commands.ts"
names = ["C"]
reason = "Commander names the value of the -C flag after its letter, which Git uses for the same flag."

[[naming.protocol_keys]]
file = "packages/cli/src/types/checks/general/secrets.ts"
names = ["Commit", "File", "Fingerprint", "RuleID"]
reason = "gitleaks reports spell these keys."

[[naming.protocol_keys]]
file = "packages/cli/src/types/checks/language/sql.ts"
names = ["DefElem", "List", "String"]
reason = "libpg-query AST tags spell these keys."

[[naming.protocol_keys]]
file = "packages/cli/src/types/checks/tool/xcode.ts"
names = ["shouldTranslate"]
reason = "Xcode string files spell this key."

[[naming.protocol_keys]]
file = "packages/cli/src/types/parsers/sql.ts"
names = [
    "lengthBytesUTF8",
    "stringToUTF8",
    "UTF8ToString",
    "_malloc",
    "_free",
    "_wasm_parse_query_raw",
    "_wasm_parse_plpgsql",
    "_wasm_free_string",
    "_wasm_free_parse_result",
    "stmt_location",
    "stmt_len",
]
reason = "Emscripten and libpg-query export these members."

[[naming.protocol_keys]]
file = "packages/cli/src/checks/language/sql.ts"
names = ["FunctionParameter"]
reason = "The libpg-query AST tag for a function parameter."

[[naming.protocol_keys]]
file = "packages/cli/src/lifecycle/preview/vale.ts"
names = ["BasedOnStyles"]
reason = "The Vale setting the rule preview reads."

[[naming.protocol_keys]]
file = "docs/src/content/docs/404.md"
names = ["404"]
reason = "Starlight routes the HTTP 404 page by this filename."

[[naming.protocol_keys]]
file = "tests/integration/cli/generation/formatting.test.ts"
names = ["MD007"]
reason = "The markdownlint rule name."

[[naming.protocol_keys]]
file = "tests/tools/cli/parameter-limits.test.ts"
names = ["rule_id"]
reason = "The SwiftLint JSON diagnostic key."

[[naming.protocol_keys]]
file = "tests/integration/cli/generation/selection.test.ts"
names = ["allowed", "exceptions"]
reason = "The license scanner policy keys."

[[naming.protocol_keys]]
file = "tests/integration/cli/commands/ci.test.ts"
names = ["with"]
reason = "The GitHub Actions inputs key."

[architecture]
types_directory = "types"
config_directory = "config"

# The layers of the CLI: a folder imports only itself and the rows its edge names. Its config and types files sit in its layer.
[[architecture.elements]]
name = "main"
paths = ["packages/cli/src/main.ts"]

[[architecture.elements]]
name = "commands"
paths = [
    "packages/cli/src/commands/**",
    "packages/cli/src/config/commands/**",
    "packages/cli/src/types/commands/**",
]

[[architecture.elements]]
name = "checks"
paths = [
    "packages/cli/src/checks/**",
    "packages/cli/src/config/checks/**",
    "packages/cli/src/types/checks/**",
]

[[architecture.elements]]
name = "output"
paths = [
    "packages/cli/src/output/**",
    "packages/cli/src/config/output.ts",
    "packages/cli/src/types/output.ts",
]

[[architecture.elements]]
name = "execution"
paths = [
    "packages/cli/src/execution/**",
    "packages/cli/src/config/execution/**",
    "packages/cli/src/types/execution/**",
]

[[architecture.elements]]
name = "lifecycle"
paths = [
    "packages/cli/src/lifecycle/**",
    "packages/cli/src/config/lifecycle/**",
    "packages/cli/src/types/lifecycle/**",
]

[[architecture.elements]]
name = "generation"
paths = [
    "packages/cli/src/generation/**",
    "packages/cli/src/config/generation/**",
    "packages/cli/src/types/generation/**",
]

[[architecture.elements]]
name = "tools"
paths = [
    "packages/cli/src/tools/**",
    "packages/cli/src/config/tools/**",
    "packages/cli/src/types/tools/**",
]

[[architecture.elements]]
name = "policy"
paths = [
    "packages/cli/src/policy/**",
    "packages/cli/src/config/policy/**",
    "packages/cli/src/types/policy/**",
]

[[architecture.elements]]
name = "rules"
paths = [
    "packages/cli/src/rules/**",
    "packages/cli/src/config/rules.ts",
    "packages/cli/src/types/rules.ts",
]

[[architecture.elements]]
name = "kits"
paths = [
    "packages/cli/src/kits/**",
    "packages/cli/src/config/kits.ts",
    "packages/cli/src/types/kits.ts",
]

[[architecture.elements]]
name = "repository"
paths = [
    "packages/cli/src/repository/**",
    "packages/cli/src/config/repository/**",
    "packages/cli/src/types/repository/**",
]

[[architecture.elements]]
name = "parsers"
paths = [
    "packages/cli/src/parsers/**",
    "packages/cli/src/config/parsers/**",
    "packages/cli/src/types/parsers/**",
]

[[architecture.elements]]
name = "platform"
paths = [
    "packages/cli/src/platform/**",
    "packages/cli/src/config/platform/**",
    "packages/cli/src/types/platform/**",
]

# The ESLint plugin is one more element, which neither imports the CLI nor is imported by it.
[[architecture.elements]]
name = "plugin"
paths = ["packages/eslint-plugin/src/**"]

[[architecture.edges_allowed]]
from = "main"
to = ["main", "commands", "platform"]

[[architecture.edges_allowed]]
from = "commands"
to = [
    "commands",
    "checks",
    "output",
    "execution",
    "lifecycle",
    "generation",
    "tools",
    "policy",
    "rules",
    "kits",
    "repository",
    "parsers",
    "platform",
]

[[architecture.edges_allowed]]
from = "checks"
to = [
    "checks",
    "execution",
    "lifecycle",
    "generation",
    "tools",
    "policy",
    "rules",
    "kits",
    "repository",
    "parsers",
    "platform",
]

[[architecture.edges_allowed]]
from = "output"
to = ["output", "execution", "generation", "platform"]

[[architecture.edges_allowed]]
from = "execution"
to = ["execution", "lifecycle", "generation", "tools", "policy", "rules", "kits", "repository", "parsers", "platform"]

[[architecture.edges_allowed]]
from = "lifecycle"
to = ["lifecycle", "generation", "tools", "policy", "kits", "repository", "platform"]

[[architecture.edges_allowed]]
from = "generation"
to = ["generation", "tools", "policy", "rules", "kits", "repository", "platform"]

[[architecture.edges_allowed]]
from = "tools"
to = ["tools", "policy", "kits", "repository", "platform"]

[[architecture.edges_allowed]]
from = "policy"
to = ["policy", "rules", "kits", "repository", "platform"]

[[architecture.edges_allowed]]
from = "rules"
to = ["rules", "kits", "repository", "platform"]

[[architecture.edges_allowed]]
from = "kits"
to = ["kits", "repository", "platform"]

[[architecture.edges_allowed]]
from = "repository"
to = ["repository", "parsers", "platform"]

[[architecture.edges_allowed]]
from = "parsers"
to = ["parsers", "platform"]

[[architecture.edges_allowed]]
from = "platform"
to = ["platform"]

[[architecture.edges_allowed]]
from = "plugin"
to = ["plugin"]

[architecture.roles]
tests = ["tests/**", "**/*.test.*"]
harness = "tests/harness"
runtime = ["src/**"]
env = ["packages/cli/src/platform/environment.ts", "tests/harness/environment.ts"]

[tools.eslint]
import_style = {"**/*" = "ts"}
script_files = [
    "scripts/**",
    "packages/cli/scripts/**",
    "packages/eslint-plugin/build.ts",
    "docs/src/content/reference/**",
]
node_version = ">=24.2.0"

[tools.commitlint]
scopes = ["cli", "eslint-plugin", "docs", "root", "hooks", "deps"]

[[tools.osv.ignore]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces 3.0.3 is the newest release, and no release fixes it. micromatch pulls it into the development tools of this workspace, which expand only the patterns this repository writes."
review_by = "2026-10-17"

[[tools.osv.ignore]]
id = "GHSA-ch52-4w7c-c8xp"
reason = "http-cache-semantics 4.2.0 is the newest release, and no release fixes it. Astro and the npm fetch client use it in the development tools; the static docs build shares no cached response between users."
review_by = "2026-10-17"

[tools.knip]
entry = [
    "**/build.ts",
    "packages/eslint-plugin/src/plugin.ts",
    "packages/cli/scripts/grammars.ts",
    "packages/cli/src/lifecycle/preview/eslint/worker.ts",
    "docs/src/content/reference/collection.ts",
    "docs/astro.config.ts",
    "docs/src/content.config.ts",
    "docs/src/route-metadata.ts",
    "scripts/*.ts",
]

[[tools.knip.ignore_dependencies]]
name = "^.+$"
workspace = "tests"
reason = "Every package the tests workspace lists is planted into a test repository, which knip cannot see."

[[tools.knip.ignore_dependencies]]
name = "^tree-sitter-"
reason = "The build copies the grammar WASM files from these packages by path; nothing imports them."

[[tools.knip.ignore_dependencies]]
name = "^@fontsource-variable/"
reason = "The site imports the fonts from docs/src/theme.css, outside the TypeScript import graph."

[structure]

# The rule corpus is this repository's product; its lint is this repository's check and ships in no package.

[[structure.folder_names_allowed]]
paths = [
    "tests/acceptance/kits/language/bash",
    "tests/acceptance/kits/language/swift",
    "tests/acceptance/kits/language/typescript",
    "tests/integration/cli/checks/language/python",
    "tests/integration/cli/checks/language/swift",
    "tests/unit/cli/checks/language/python",
]
reason = "Each directory owns tests of that named language kit, parser, or tool integration; the files are TypeScript, not buckets grouped by implementation language."

[[structure.folder_names_allowed]]
paths = [
    "packages/cli/src/checks/language/bash",
    "packages/cli/src/checks/language/javascript",
    "packages/cli/src/checks/language/python",
    "packages/cli/src/checks/language/swift",
]
reason = "Each folder holds the checks of one language kit and is named after the kit, as the kits folder is."

[[structure.lone_files_allowed]]
paths = ["tests/acceptance/kits/database", "tests/acceptance/kits/library", "tests/acceptance/kits/platform"]
reason = "The acceptance tests of the kits sit under the kit category, as the kits folder does, and these categories have one test file."

[[structure.lone_files_allowed]]
paths = ["docs/src/pages/schema"]
reason = "Astro maps this directory to the published /schema/gspot.schema.json endpoint; moving the route changes the public schema URL."

[[structure.prefix_collisions_allowed]]
paths = ["packages/eslint-plugin/src/rules/**", "tests/unit/plugin/rules/**"]
reason = "ESLint rule ids are the file names, and the ids share their first word by convention."

[[structure.prefix_collisions_allowed]]
paths = ["docs/src"]
reason = "Astro fixes the name of the content configuration file beside the content folder."

[[structure.prefix_collisions_allowed]]
paths = ["packages/cli/kits/language/html", "packages/cli/kits/language/markdown", "packages/cli/kits/tool/docker"]
reason = "A kit template takes the name of the file it writes, and a tool names its own configuration files."
[tools.licenses]

[[tools.licenses.exceptions]]
package = "axe-core@4.13.0"
license = "MPL-2.0"
reason = "The JSX accessibility lint plugin requires this unmodified development dependency. Its installed LICENSE identifies MPL-2.0; it is not included in the gspot package."

[[tools.licenses.exceptions]]
package = "@csstools/selector-specificity@5.0.0"
license = "MIT-0"
reason = "The CSS tooling dependency uses the MIT No Attribution license; its installed package retains the license text."

[[tools.licenses.exceptions]]
package = "@fontsource-variable/geist@5.3.0"
license = "OFL-1.1"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[[tools.licenses.exceptions]]
package = "@fontsource-variable/geist-mono@5.3.0"
license = "OFL-1.1"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[[tools.licenses.exceptions]]
package = "eslint-plugin-sonarjs@4.2.0"
license = "LGPL-3.0-only"
reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the gspot package."

[[tools.licenses.exceptions]]
package = "lightningcss@1.33.0"
license = "MPL-2.0"
reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."

[[tools.licenses.exceptions]]
package = "truncate-utf8-bytes@1.0.2"
license = "WTFPL"
reason = "A permissive license with no conditions; it arrives through a test tool and ships in nothing."

[[ignore]]
check = "security/semgrep"
rule = "node-no-configured-require"
paths = [
    "packages/cli/src/lifecycle/preview/eslint/declarations.ts",
    "packages/cli/src/lifecycle/preview/eslint/worker.ts",
]
reason = "These configuration evaluators intentionally execute repository-selected modules and installed tool APIs in the configuration subprocess. Static imports select the CLI dependencies instead of the repository dependencies and cannot preserve executable configuration. Other security rules remain active for these exact files."

[[ignore]]
check = "javascript/eslint"
rule = "gspot/no-trivial-functions"
paths = ["packages/cli/src/kits/messages.ts", "packages/cli/src/policy/messages.ts"]
reason = "Every message has one builder in its catalog, so callers share one wording. A builder is one template, so the trivial-function rule would ask for every message text to be copied to its callers. Remove this entry if the catalogs move out of functions."

[[ignore]]
check = "docs/stale-paths"
paths = ["FINDINGS.md"]
reason = "FINDINGS.md records an audit, and it names files and folders the cleanup deletes and moves."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/require-exports"
paths = ["packages/cli/package.json"]
reason = "The gspot package exposes a command through bin and has no importable module API. Remove this exception if the package gains a module API."

[prose]
vocabulary = ["Nx", "Turborepo", "Husky", "Lefthook", "EditorConfig Checker"]

[tools.codeql]
languages = ["javascript-typescript", "actions"]

[[tools.codeql.ignore]]
rule = "js/file-system-race"
paths = [
    "tests/integration/cli/commands/agents.test.ts",
    "tests/acceptance/cli/clone.test.ts",
    "tests/integration/cli/checks/framework/nextjs/build.test.ts",
    "tests/integration/cli/checks/language/swift/build/isolation.test.ts",
    "tests/integration/cli/execution/resource-reads.test.ts",
    "tests/tools/cli/packages/project.test.ts",
    "tests/harness/planted/preservation.ts",
]
reason = "Each test owns its temporary tree and is the only writer; the stat and the read it compares are the assertion."

[[tools.codeql.ignore]]
rule = "js/bad-code-sanitization"
paths = ["packages/cli/src/generation/fragments.ts"]
reason = "JSON.stringify emits whole literals into a standalone ESLint module, never into an HTML script element."

[[tools.codeql.ignore]]
rule = "js/incomplete-sanitization"
paths = ["packages/cli/src/checks/tool/actions.ts"]
reason = "Only the leading self-repository marker is translated; later dollar signs are path characters and must stay."

[[tools.codeql.ignore]]
rule = "js/incomplete-sanitization"
paths = ["packages/cli/src/repository/revisions/refspecs.ts"]
reason = "git check-ref-format validates every refspec first and permits at most one wildcard, so one replacement is complete."

[[tools.codeql.ignore]]
rule = "js/http-to-file-access"
paths = ["packages/cli/scripts/grammars.ts"]
reason = "Every downloaded byte is checked against the pinned SHA-256 digest before the cache file is written."
