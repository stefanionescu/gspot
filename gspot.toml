[tools.codeql]
languages = ["javascript-typescript", "actions"]


[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/acceptance/source/cli/agents.test.ts"]
reason = "The test owns its temporary repository and compares agent-file bytes and modes across apply and uninstall. No other process mutates these fixtures. Remove this exception if the test uses shared files."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/acceptance/source/cli/lifecycle/uninstall.test.ts"]
reason = "These owned temporary repositories verify preservation of unowned configuration bytes and modes across lifecycle commands. Separate observations are the assertion contract. Remove this exception if fixture ownership changes."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/integration/cli/checks/nextjs-build.test.ts"]
reason = "The test owns the temporary Next.js project and compares source bytes and modes after isolated builds. The subprocess boundary is controlled by the test. Remove this exception if the test uses shared files."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/integration/cli/checks/swift/build/isolation.test.ts"]
reason = "The test controls the build boundary and verifies that an owned temporary Swift project retains its original bytes and modes. Remove this exception if the fixture or build boundary is shared."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/integration/cli/execution/storage/cache.test.ts"]
reason = "The test deliberately replaces an owned temporary executable between metadata and content observations to reproduce a filesystem race. Keep the defective path observation as regression evidence. Remove this exception when that race fixture is removed."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/integration/cli/execution/storage/reports.test.ts"]
reason = "The test owns the temporary obstruction and checks whether it remains a file with its authored bytes or a directory. The check and read have no concurrent writer. Remove this exception if fixture ownership changes."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/integration/cli/execution/storage/resource-reads.test.ts"]
reason = "The test deliberately replaces owned temporary resources with directories and malformed bytes between executions. Separate assertions verify each transition. Remove this exception when these replacement fixtures are removed."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/integration/tools/tools/packages/project.test.ts"]
reason = "The installer tests own their temporary repositories and deliberately edit and inspect lockfile bytes and modes across lifecycle operations. These are preservation assertions, not permission checks on shared files. Remove this exception if fixture ownership changes."

[[tools.codeql.false_positives]]
rule = "js/file-system-race"
paths = ["tests/support/cli/preservation.ts"]
reason = "Only acceptance fixtures call these preservation helpers on their owned temporary trees. The helpers inspect and restore fixture bytes, modes, and links without concurrent writers. Remove this exception before accepting shared or external filesystem roots."

[[tools.codeql.false_positives]]
rule = "js/bad-code-sanitization"
paths = ["packages/cli/src/generation/fragments.ts"]
reason = "JSON.stringify emits complete literals into a standalone ESLint JavaScript module. The generated text is never embedded in an HTML script element, which is the query threat model. Parser and loaded-plugin regressions preserve hostile-looking scope strings and detect neighboring real defects. Remove this exception before adding an HTML embedding consumer."

[[tools.codeql.false_positives]]
rule = "js/incomplete-sanitization"
paths = ["packages/cli/src/checks/actions.ts"]
reason = "This replacement translates exactly one leading self-repository marker in a parsed YAML scalar. Later dollar signs are literal path characters and must remain unchanged. Native Actionlint tests verify that distinction and retain expression errors. Remove this exception when the pinned parser accepts the original syntax."

[[tools.codeql.false_positives]]
rule = "js/incomplete-sanitization"
paths = ["packages/cli/src/repository/revisions/refspecs.ts"]
reason = "Git check-ref-format --refspec-pattern validates every source and destination before substitution and permits at most one wildcard. Regression cases reject multiple source, destination, and exclusion wildcards before accepting corrected mappings. Remove this exception if validation moves or the Git refspec contract changes."

[[tools.codeql.false_positives]]
rule = "js/http-to-file-access"
paths = ["packages/cli/scripts/inputs.ts"]
reason = "The build downloader verifies every byte against the pinned SHA-256 digest before creating its cache file. CodeQL does not model the Bun.CryptoHasher guard. Corrupted downloads leave no cache, HTTP failures fail, and matching bytes are retained. Remove this exception if the checksum or trusted build-input contract changes, or the query models this guard."
