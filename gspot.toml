[tools.codeql]
languages = ["javascript-typescript", "actions"]

[tools.commitlint]
scopes = ["cli", "eslint-plugin", "docs", "root", "hooks", "deps"]

[tools.eslint.import_extensions]
"**/*" = "ts"

[tools.knip]
entry = ["packages/cli/src/checks/general/site/linkinator.ts", "packages/cli/src/checks/general/site/purgecss.ts", "packages/cli/src/parsers/tool/format.ts", "packages/eslint-plugin/src/rules/public.ts", "scripts/setting-values.ts"]

[tools.knip.ignore_dependencies]
"^@fontsource-variable/" = "The site imports the fonts from docs/src/theme.css, outside the TypeScript import graph."
"^tree-sitter-" = "The build copies the grammar WASM files from these packages by path; nothing imports them."

[tools.knip.ignore_dependencies."^(?:@darraghor/eslint-plugin-nestjs-typed|@next/eslint-plugin-next|@react-native/eslint-plugin|@typescript-eslint/utils|@vitest/eslint-plugin|bats|eslint-plugin-drizzle|eslint-plugin-expo|eslint-plugin-i18next|eslint-plugin-jest|eslint-plugin-react|eslint-plugin-react-hooks|eslint-plugin-react-native|eslint-plugin-react-refresh|eslint-plugin-svelte|eslint-plugin-testing-library|eslint-plugin-vue|eslint-plugin-vuejs-accessibility|pnpm|std-env|supabase|svelte-eslint-parser|vue-eslint-parser|yarn)$"]
reason = "Native sandbox commands load these packages from the linked tests installation."
workspace = "tests"

[tools.knip.ignore_dependencies.satteri]
reason = "Astro prerender externalizes this native Markdown loader in astro.config.ts. A direct dependency keeps Bun’s package lookup at the installed loader origin; the site build verifies native resolution."
workspace = "docs"

[[ignore]]
check = "dependencies/osv"
reason = "Checked 2026-10-09: GHSA lists no patched release; http-cache-semantics 4.3.0 is latest. Astro and npm fetch use it in development; the static docs build shares no cached response between users."
rule = "GHSA-ch52-4w7c-c8xp"
until = 2026-11-08

[[ignore]]
check = "dependencies/osv"
reason = "Checked 2026-10-09: braces 3.0.3 is latest and GHSA lists no patched release. micromatch uses it in development tools, which expand only repository-authored patterns."
rule = "GHSA-vfj7-8cjw-p6xm"
until = 2026-11-08

[[ignore]]
check = "docs/lychee"
paths = ["docs/src/content/docs/**"]
reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."

[[ignore]]
check = "docs/stale-paths"
paths = ["FINDINGS.md", "findings/**"]
reason = "FINDINGS.md and findings/ record an audit, and they name files and folders the cleanup deletes and moves."

[[ignore]]
check = "docs/stale-paths"
paths = ["packages/cli/configurations/*/*/rules/**"]
reason = "Shipped agent rules describe consumer projects. Their file paths are examples for those projects."

[[ignore]]
check = "github-actions/zizmor"
paths = [".github/workflows/ci.yml", ".github/workflows/database.yml", ".github/workflows/docs.yml", ".github/workflows/release.yml"]
reason = "Actionlint reads ./ natively. Pull-request jobs run the checked-out setup action. Reusable workflow calls resolve at the same commit."
rule = "self-repository"

[[ignore]]
check = "javascript/eslint"
paths = ["packages/cli/src/**", "scripts/**"]
reason = "These command implementations and repository scripts use synchronous filesystem operations to prepare and publish local files before they return."
rule = "n/no-sync"

[[ignore]]
check = "javascript/eslint"
paths = ["packages/eslint-plugin/package.json"]
reason = "A published library keeps ranges for runtime dependencies and peers."
rule = "package-json/restrict-dependency-ranges"

[[ignore]]
check = "prose/vale"
paths = ["FINDINGS.md", "findings/**"]
reason = "The findings ledger preserves original quotations and stable record text. Its technical audit terms and historical wording must remain verbatim."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/configurations/general/prose/styles/LICENSES.md"]
reason = "This asset reproduces the upstream MIT license notices verbatim. Legal text must retain its exact wording and capitalization."

[[ignore]]
check = "prose/vale"
paths = ["tests/config/tools/configurations/general/prose/rules.ts"]
reason = "These literal negative test vectors deliberately contain the defects detected by the native Vale rules. Preserve their bytes and expected diagnostics."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/configurations/database/postgres/rules/POSTGRES.md", "packages/cli/configurations/framework/express/rules/EXPRESS.md", "packages/cli/configurations/framework/fastapi/rules/FASTAPI.md", "packages/cli/configurations/framework/nextjs/rules/NEXTJS.md", "packages/cli/configurations/framework/react/rules/REACT.md", "packages/cli/configurations/framework/vue/rules/VUE.md", "packages/cli/configurations/general/commits/rules/GIT.md", "packages/cli/configurations/general/engineering/rules/agent/WORKING.md", "packages/cli/configurations/general/engineering/rules/code/ACCESSIBILITY.md", "packages/cli/configurations/general/engineering/rules/code/CLI.md", "packages/cli/configurations/general/engineering/rules/code/CONFIGURATION.md", "packages/cli/configurations/general/engineering/rules/code/LOGGING.md", "packages/cli/configurations/general/engineering/rules/code/TESTING.md", "packages/cli/configurations/general/files/rules/YAML.md", "packages/cli/configurations/general/naming/rules/NAMING-FILES.md", "packages/cli/configurations/general/naming/rules/NAMING.md", "packages/cli/configurations/general/prose/rules/DOCS-CONTENT.md", "packages/cli/configurations/general/prose/rules/DOCS-FORMAT.md", "packages/cli/configurations/general/prose/rules/DOCS-MEDIA.md", "packages/cli/configurations/general/prose/rules/DOCS-SURFACES.md", "packages/cli/configurations/general/prose/rules/DOCS.md", "packages/cli/configurations/general/prose/rules/WRITING.md", "packages/cli/configurations/general/secrets/rules/SECRETS.md", "packages/cli/configurations/language/bash/rules/BASH.md", "packages/cli/configurations/language/bash/rules/LANGUAGE.md", "packages/cli/configurations/language/bash/rules/NAMING.md", "packages/cli/configurations/language/bash/rules/SAFETY.md", "packages/cli/configurations/language/css/rules/NAMING.md", "packages/cli/configurations/language/css/rules/TAILWIND.md", "packages/cli/configurations/language/html/rules/HTML.md", "packages/cli/configurations/languag