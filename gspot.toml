[structure]


# The rule corpus is this repository's product; its lint is this repository's check and ships in no binary.

[[structure.folder_name_allowed]]
paths = [
    "tests/acceptance/source/kits/bash",
    "tests/acceptance/source/kits/python",
    "tests/acceptance/source/kits/swift",
    "tests/acceptance/source/kits/typescript",
    "tests/integration/cli/checks/swift",
    "tests/integration/tools/bash",
    "tests/support/cli/python",
    "tests/integration/tools/generation/swift",
]
reason = "Each directory owns tests of that named language kit, parser, or tool integration; the files are TypeScript, not buckets grouped by implementation language."

[[structure.folder_name_allowed]]
paths = ["packages/cli/src/checks/python", "packages/cli/src/checks/swift", "packages/cli/src/checks/typescript"]
reason = "Language names identify the implemented check and parser domains in the architecture ownership layout."

[[structure.single_file_folder_allowed]]
paths = ["docs/src/pages/schema"]
reason = "Astro maps this directory to the published /schema/gspot.schema.json endpoint; moving the route changes the public schema URL."

[[structure.prefix_collision_allowed]]
paths = ["packages/eslint-plugin/src/rules/**", "tests/unit/plugin/rules/**"]
reason = "ESLint rule ids are the file names, and the ids share their first word by convention."

[[structure.prefix_collision_allowed]]
paths = ["docs/src"]
reason = "Astro fixes the name of the content configuration file beside the content folder."
[[check]]
name = "guides/lint"
command = ["mise", "run", "guides:lint"]
paths = ["packages/cli/guides/**", "packages/cli/src/agents/**", "packages/cli/kits/**", "tests/integration/tools/generation/**", "tests/unit/cli/agents/**", ".mise/conf.d/repo.toml"]
stage = "push"
