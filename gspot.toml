[[naming.rules]]
paths = ["packages/cli/src/types/commands/init.ts"]
categories = ["properties"]
names = ["min_release_age_days", "security_scanner"]
case = ["snake"]
reason = "Installer settings preserve these exact public TOML keys during initialization. Remove an allowance when its setting leaves the supported policy."

[[naming.rules]]
paths = ["packages/cli/src/types/kits.ts"]
categories = ["properties"]
names = [
    "check_references",
    "crash_pattern",
    "query_packs",
    "rule_page",
    "version_command",
    "version_exit_code",
    "version_regex",
]
case = ["snake"]
reason = "Kit manifests declare these exact tool and reference keys. The normalized types retain the manifest spelling. Remove an allowance when its manifest key is removed."

[[naming.rules]]
paths = ["packages/cli/src/types/policy/policy.ts"]
categories = ["properties"]
names = [
    "allow_digits",
    "allow_duplicate_words",
    "allowed_for",
    "banned_terms",
    "config_directory",
    "contract_properties",
    "edges_allowed",
    "folder_name_allowed",
    "max_chars",
    "max_words",
    "prefix_collision_allowed",
    "remove_groups",
    "single_file_folder_allowed",
    "structural_prefix",
    "types_directory",
]
case = ["snake"]
reason = "These properties describe exact public policy keys in gspot.toml. Their spelling is part of the supported configuration contract. Remove an allowance when its key leaves that contract."

[[naming.rules]]
paths = ["tests/acceptance/source/cli/init/selection.test.ts"]
categories = ["properties"]
names = ["types_directory"]
case = ["snake"]
reason = "The initialization test inspects the public architecture.types_directory TOML key. Remove this allowance if that policy key changes."

[[naming.rules]]
paths = ["tests/acceptance/source/cli/report-storage.test.ts", "tests/types/cli.ts"]
categories = ["properties"]
names = ["check_name"]
case = ["snake"]
reason = "The Code Quality report format requires check_name. These test types inspect the serialized report. Remove this allowance if the report contract changes."

[[naming.rules]]
paths = ["tests/integration/cli/generation/format-width.test.ts"]
categories = ["properties"]
names = ["MD007"]
case = ["upper-snake"]
allow_digits = true
reason = "Markdownlint names the unordered-list indentation rule MD007. The test reads that exact generated rule key. Remove this allowance if the native rule identifier changes."

[[naming.rules]]
paths = ["tests/integration/tools/generation/swift/security.test.ts"]
categories = ["properties"]
names = ["check_id"]
case = ["snake"]
reason = "Semgrep JSON results identify their rule with check_id. The test inspects the native report key. Remove this allowance if the native report contract changes."

[[naming.rules]]
paths = ["tests/integration/tools/hooks/pre-commit.test.ts", "tests/types/integration/cli/lifecycle/lifecycle.ts"]
categories = ["properties"]
names = ["fail_fast"]
case = ["snake"]
reason = "Pre-commit configures early failure with fail_fast. These test types preserve that native YAML key. Remove this allowance if the native option changes."

[[naming.rules]]
paths = ["tests/integration/tools/parameter-limits.test.ts"]
categories = ["properties"]
names = ["rule_id"]
case = ["snake"]
reason = "SwiftLint JSON diagnostics identify their rule with rule_id. The test reads that exact native field. Remove this allowance if the native report contract changes."

[[naming.rules]]
paths = ["tests/types/integration/cli/generation.ts"]
categories = ["properties"]
names = ["licenses_allowed", "packages_allowed"]
case = ["snake"]
reason = "The generated license-scanner configuration uses these exact policy keys. The tests inspect their serialized spelling. Remove an allowance when the corresponding scanner setting changes."

[[naming.rules]]
paths = ["packages/cli/src/types/repository/revisions.ts"]
categories = ["properties"]
names = ["object"]
exclude = true
reason = "The published pre-push JSON report names Git object identities with the key object. PushRevision and PushSelection preserve that serialized contract. Internal Git entry and revision-source keys use hash. Remove the allowance only if the report contract changes."

[[naming.rules]]
paths = ["tests/types/acceptance/source/cli.ts"]
categories = ["properties"]
names = ["with", "when"]
exclude = true
reason = "GitHub Actions names action inputs with, and GitLab CI names artifact retention when. These test types inspect those exact generated workflow keys. Remove an allowance if its workflow provider or field leaves the contract."

[[naming.rules]]
paths = ["packages/cli/src/config/repository/windows-launcher.ts"]
names = ["PE32_MAGIC", "PE32_PLUS_MAGIC", "PE32_DIRECTORIES_OFFSET", "PE32_PLUS_DIRECTORIES_OFFSET"]
exclude = true
reason = "The Microsoft Portable Executable specification names these formats PE32 and PE32+. The constants identify their magic values and directory offsets. Their exact format names require digits and the term PLUS. Only these four names are excepted. Remove this allowance if the launcher stops supporting those formats."

[[naming.rules]]
paths = ["packages/cli/src/types/checks/security.ts"]
names = ["Fingerprint", "File", "RuleID", "Commit"]
exclude = true
reason = "gitleaks writes these keys in its report and its baseline, and the type names them as they are."

[[naming.rules]]
paths = ["packages/cli/src/checks/dependencies/manifest-policy.ts"]
names = ["packageManager"]
exclude = true
reason = "package.json names the key packageManager, and the code reads it under that name."

[[naming.rules]]
paths = ["packages/cli/src/types/parsers/sql.ts"]
names = [
    "lengthBytesUTF8",
    "stringToUTF8",
    "UTF8ToString",
    "_malloc",
    "_free",
    "_wasm_parse_query_raw",
    "_wasm_parse_plpgsql",
    "_wasm_free_string",
    "_wasm_free_parse_result",
    "stmt_location",
    "stmt_len",
]
exclude = true
reason = "Emscripten and libpg-query name these members, and the type spells them as the module exports them."

[[naming.rules]]
paths = ["packages/cli/src/types/checks/xcode.ts"]
names = ["shouldTranslate"]
exclude = true
reason = "Xcode writes this key in a string file, and the type spells it as the file does."

[[naming.rules]]
paths = ["packages/cli/src/types/checks/checks.ts"]
names = ["DefElem", "String", "List"]
exclude = true
reason = "libpg-query emits these exact PostgreSQL AST node tags. SQL option parsing consumes their original JSON shape. Remove an allowance when its node tag is no longer consumed."

[[naming.rules]]
paths = ["packages/cli/src/checks/sql.ts"]
names = ["FunctionParameter"]
exclude = true
reason = "libpg-query emits this exact PostgreSQL AST node tag for function parameters. Renaming the property breaks argument counting. Remove the allowance when the parser contract changes."

[[naming.rules]]
paths = ["packages/cli/src/repository/scopes.ts", "packages/cli/src/execution/cache.ts"]
names = ["withFileTypes"]
exclude = true
reason = "The filesystem implementation must accept Node readdir options through the globby filesystem contract. This exact option selects directory entries. Remove the allowance when the filesystem implementation is removed."

[[naming.rules]]
paths = ["packages/cli/src/repository/configuration/vale-rules.ts"]
names = ["BasedOnStyles"]
exclude = true
reason = "The Vale configuration reader preserves this exact native setting for adoption. Remove the allowance if the native setting changes."

[[naming.rules]]
paths = ["docs/src/content/docs/404.md"]
names = ["404"]
exclude = true
reason = "Starlight uses this exact filename for the HTTP 404 route. Renaming it changes the framework route contract."

[architecture]
types_directory = "types"
config_directory = "config"
roles = {env = "packages/cli/src/platform/environment.ts"}

[tools.eslint]
import_style = {"**/*" = "ts"}
script_files = [
    "packages/npm/**",
    "packages/cli/scripts/**",
    "packages/eslint-plugin/build.ts",
    "docs/src/content/reference/**",
]
globals = {"packages/npm/**" = "commonjs"}
node_version = ">=24.2.0"

[tools.knip]
entry = [
    "**/build.ts",
    "packages/cli/scripts/command.ts",
    "packages/cli/scripts/inputs.ts",
    "**/publish.ts",
    "packages/cli/src/agents/lint.ts",
    "packages/npm/gspot.js",
    "docs/src/content/reference/collection.ts",
    "docs/astro.config.ts",
    "docs/src/content.config.ts",
    "docs/src/route-metadata.ts",
]


