#:schema https://gspot.dev/schema/gspot.schema.json

# The policy of this repository under gspot. Every setting has a command that writes it:
# gspot set, allow, ignore, declare, add, remove. Run gspot explain <anything> for what it means.

version = 1
presets = ["bash", "spelling", "typescript", "markdown", "prose", "commits", "config-files", "naming", "formatting", "docs", "secrets", "dependencies", "licenses", "duplication", "security"]

[[scope]]
path = "packages/cli"
presets = []

[[scope]]
path = "packages/eslint-plugin"
presets = []

[[scope]]
path = "docs"
presets = ["typescript"]

[hooks]
tool = "gspot"

[ci]
provider = "github"

[rules]
install = true
directory = ".gspot/rules"

[inspection]
strict = false

[runner]
tool = "mise"

[tools]

[tools.docs]
paths_allowed = [
    {patterns = ["rules/**"], reason = "The rule corpus is generic text installed into other repositories; it names nothing in this one."},
    {patterns = ["architecture/**"], reason = "The architecture names files in other repositories and files that are not built yet."},
    {patterns = ["docs/**"], reason = "The manual names files in the reader's repository and check ids written with a slash."},
]

[tools.lychee]
exclude_paths = [{paths = ["docs/src/content/docs/**"], reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."}]

[tools.typos]
words = [{word = "udid", reason = "Apple's device identifier API name."}, {word = "certifi", reason = "The Python certificate package name."}, {word = "axe", reason = "The axe-core accessibility package name."}, {word = "Virtua", reason = "The Virtua list virtualisation library."}, {word = "virtua", reason = "The Virtua list virtualisation library."}, {word = "synchronise", reason = "British spellings the naming policy bans on purpose."}, {word = "synchronised", reason = "British spellings the naming policy bans on purpose."}, {word = "materialise", reason = "British spellings the naming policy bans on purpose."}, {word = "IFEs", reason = "The ESLint option name for immediately invoked functions."}, {word = "IIF", reason = "The word typos sees inside the ESLint option IIFEs."}, {word = "capitalisation", reason = "The sqlfluff rule group is spelled capitalisation in its own configuration keys."}, {word = "speling", reason = "A preset name misspelled on purpose in the profile test."}]
exclude = [{paths = ["prose/styles/gspot/us-english.yml"], reason = "A list of British spellings mapped to their US forms."}]

[[naming.rules]]
paths = ["packages/cli/types/integrity.ts"]
names = ["Fingerprint", "File", "RuleID", "Commit"]
exclude = true
reason = "gitleaks writes these keys in its report and its baseline, and the type names them as they are."

[[naming.rules]]
paths = ["packages/cli/types/integrity.ts", "packages/cli/src/integrity/manifest-policy.ts"]
names = ["packageManager"]
exclude = true
reason = "package.json names the key packageManager, and the code reads it under that name."

[[naming.rules]]
paths = ["packages/cli/types/sql.ts"]
names = ["lengthBytesUTF8", "stringToUTF8", "UTF8ToString", "_malloc", "_free", "_wasm_parse_query_raw", "_wasm_free_parse_result", "stmt_location", "stmt_len"]
exclude = true
reason = "Emscripten and libpg-query name these members, and the type spells them as the module exports them."

[[naming.rules]]
paths = ["packages/cli/types/apple.ts"]
names = ["shouldTranslate"]
exclude = true
reason = "Xcode writes this key in a string file, and the type spells it as the file does."

[architecture]
roles = {env = "packages/cli/src/platform/environment.ts"}

[tools.typescript]
types = ["bun"]

[tools.typescript.extra]
reason = "Bun runs TypeScript from source and imports .ts paths, so the compiler accepts them and emits nothing; Bun and Node 22 ship the ES2025 iterator helpers the code uses."
allowImportingTsExtensions = true
noEmit = true
target = "ESNext"
lib = ["ESNext"]

[tools.eslint]
import_style = {"**/*" = "ts"}
script_files = ["packages/npm/**", "packages/cli/build.ts", "packages/cli/publish.ts", "packages/cli/schemas.ts", "packages/cli/rules-lint/command.ts", "packages/eslint-plugin/build.ts", "docs/reference-pages.ts"]
globals = {"packages/npm/**" = "commonjs"}

[tools.knip]
entry = ["**/build.ts", "**/publish.ts", "packages/cli/schemas.ts", "packages/cli/rules-lint/command.ts", "packages/npm/gspot/gspot.js", "docs/reference-pages.ts", "docs/astro.config.ts", "docs/src/content.config.ts"]
ignore_dependencies = [{name = "eslint-plugin-expo", reason = "The ESLint configuration of the planted react-native fixture imports it."}, {name = "@nestjs/common", reason = "The planted nestjs test type-checks a fixture against it, which knip cannot see."}, {name = "@nestjs/core", reason = "The planted nestjs test type-checks a fixture against it, which knip cannot see."}, {name = "reflect-metadata", reason = "The planted nestjs test type-checks a fixture against it, which knip cannot see."}, {name = "rxjs", reason = "The planted nestjs test type-checks a fixture against it, which knip cannot see."}, {name = "eslint-plugin-vue", reason = "The planted components test lints a fixture with it, which knip cannot see."}, {name = "vue-eslint-parser", reason = "The planted components test lints a fixture with it, which knip cannot see."}, {name = "eslint-plugin-svelte", reason = "The planted components test lints a fixture with it, which knip cannot see."}, {name = "svelte-eslint-parser", reason = "The planted components test lints a fixture with it, which knip cannot see."}, {name = "svelte", reason = "The planted components test lints a fixture with it, which knip cannot see."}, {name = "@types/node", reason = "Next.js refuses to write its types in the planted fixture when the package is absent."}, {name = "next", reason = "The planted nextjs test runs the framework in a fixture, which knip cannot see."}, {name = "react", reason = "The planted nextjs test runs the framework in a fixture, which knip cannot see."}, {name = "react-dom", reason = "The planted nextjs test runs the framework in a fixture, which knip cannot see."}, {name = "@types/react", reason = "The planted nextjs test runs the framework in a fixture, which knip cannot see."}, {name = "@next/eslint-plugin-next", reason = "The ESLint configuration of the planted nextjs fixture imports it."}, {name = "eslint-plugin-react-hooks", reason = "The ESLint configuration of the planted nextjs fixture imports it."}, {name = "eslint-plugin-react", reason = "The ESLint configuration of the planted nextjs fixture imports it."}, {name = "eslint-plugin-i18next", reason = "The ESLint configuration of the planted nextjs fixture imports it."}, {name = "eslint-plugin-zod", reason = "The ESLint configuration of the planted libraries fixture imports it."}, {name = "@tanstack/eslint-plugin-query", reason = "The ESLint configuration of the planted libraries fixture imports it."}, {name = "eslint-plugin-drizzle", reason = "The ESLint configuration of the planted libraries fixture imports it."}, {name = "linkinator", reason = "The planted static-site test runs it in a fixture, which knip cannot see."}, {name = "svgo", reason = "The planted static-site test runs it in a fixture, which knip cannot see."}, {name = "purgecss", reason = "The planted static-site test runs it in a fixture, which knip cannot see."}, {name = "stylelint", reason = "The planted css test runs it in a fixture, which knip cannot see."}, {name = "stylelint-config-standard", reason = "The stylelint configuration of a planted fixture extends it."}, {name = "html-validate", reason = "The planted html test runs it in a fixture, which knip cannot see."}, {name = "vitest", reason = "The planted vitest test runs it in a fixture, which knip cannot see."}, {name = "@vitest/coverage-v8", reason = "The planted vitest test needs the coverage provider in a fixture."}, {name = "@vitest/eslint-plugin", reason = "The ESLint configuration of a planted fixture imports it."}, {name = "@stoplight/spectral-cli", reason = "The planted express test runs it by name, which knip cannot see."}, {name = "verdaccio", reason = "The release test starts it through bunx, which knip cannot see."}, {name = "tree-sitter-bash", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-css", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-go", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-html", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-javascript", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-python", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-typescript", reason = "The grammar WASM file is read from the package, not imported."}]

[structure]
single_file_folder_allowed = [{paths = ["packages/npm/gspot"], reason = "The npm launcher package is one file by design: it runs the platform package that installed."}]
prefix_collision_allowed = [{paths = ["packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/tests/rules/**"], reason = "ESLint rule ids are the file names, and the ids share their first word by convention."}, {paths = ["docs/src"], reason = "Astro fixes the name of the content configuration file beside the content folder."}]

# The reference pages of the manual are written from the binary's own data; this says whether they still match.
[[check]]
name = "docs/generated"
command = ["bun", "docs/reference-pages.ts", "--check"]
paths = ["docs/src/content/docs/reference/**", "presets/**", "architecture/14-decisions.md", "packages/cli/src/commands/**"]
stage = "commit"
summary = "Checks that the reference pages of the manual match what the binary carries."

[[declare]]
paths = ["packages/cli/grammars/swift.wasm"]
vendored = true
reason = "The Swift grammar has no npm package with a prebuilt WASM file, so the build of tree-sitter-swift is kept in the tree."

# The published JSON schemas are written from the zod schemas; this says whether they still match.
[[check]]
name = "schema/generated"
command = ["bun", "packages/cli/schemas.ts", "--check"]
paths = ["schema/**", "docs/public/schema/**", "packages/cli/src/policy/schema.ts", "packages/cli/src/run/record/schema.ts"]
stage = "commit"
summary = "Checks that the published JSON schemas match the zod schemas the binary reads with."

[[declare]]
paths = ["schema/**", "docs/public/schema/**"]
produced_by = "bun packages/cli/schemas.ts"

# The rule corpus is this repository's product; its lint is this repository's check and ships in no binary.
[[check]]
name = "rules/lint"
command = ["bun", "packages/cli/rules-lint/command.ts"]
paths = ["rules/**", "packages/cli/rules-lint/**"]
stage = "commit"
summary = "Lints every rule file: front matter, links, size, layer boundary, fences, and the prose rules."

[tools.licenses]
exceptions = [{package = "eslint-plugin-sonarjs@4.2.0", license = "LGPL-3.0-only", reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the binary."}, {package = "lightningcss@1.33.0", license = "MPL-2.0", reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."}, {package = "truncate-utf8-bytes@1.0.2", license = "WTFPL", reason = "A permissive license with no conditions; it arrives through a test tool and ships in nothing."}]

[tools.osv]
ignore = [{id = "GHSA-w5hq-g745-h8pq", reason = "uuid 9 arrives through gaxios under linkinator, a test tool. The flaw needs a caller that passes its own buffer, and gaxios passes none. Review when linkinator moves to uuid 11."}]
