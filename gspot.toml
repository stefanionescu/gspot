#:schema https://gspot.dev/schema/gspot.schema.json

# The policy of this repository under gspot. Every setting has a command that writes it:
# gspot set, allow, ignore, declare, add, remove. Run gspot explain <anything> for what it means.

version = 1
presets = ["bash", "spelling", "typescript", "markdown", "prose", "commits", "config-files", "naming", "formatting", "docs"]

[[scope]]
path = "packages/cli"
presets = []

[[scope]]
path = "packages/eslint-plugin"
presets = []

[[scope]]
path = "docs"
presets = ["typescript"]

[hooks]
tool = "gspot"

[ci]
provider = "github"

[rules]
install = true
directory = ".gspot/rules"

[inspection]
strict = false

[runner]
surface = "mise"

[tools]

[tools.docs]
paths_allowed = [
    {patterns = ["rules/**"], reason = "The rule corpus is generic text installed into other repositories; it names nothing in this one."},
    {patterns = ["architecture/**"], reason = "The architecture names files in other repositories and files that are not built yet."},
    {patterns = ["docs/**"], reason = "The manual names files in the reader's repository and check ids written with a slash."},
]

[tools.lychee]
exclude_paths = [{paths = ["docs/src/content/docs/**"], reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."}]

[tools.typos]
words = [{word = "udid", reason = "Apple's device identifier API name."}, {word = "certifi", reason = "The Python certificate package name."}, {word = "axe", reason = "The axe-core accessibility package name."}, {word = "Virtua", reason = "The Virtua list virtualisation library."}, {word = "virtua", reason = "The Virtua list virtualisation library."}, {word = "synchronise", reason = "British spellings the naming policy bans on purpose."}, {word = "synchronised", reason = "British spellings the naming policy bans on purpose."}, {word = "materialise", reason = "British spellings the naming policy bans on purpose."}, {word = "IFEs", reason = "The ESLint option name for immediately invoked functions."}, {word = "IIF", reason = "The word typos sees inside the ESLint option IIFEs."}, {word = "capitalisation", reason = "The sqlfluff rule group is spelled capitalisation in its own configuration keys."}]
exclude = [{paths = ["prose/styles/gspot/us-english.yml"], reason = "A list of British spellings mapped to their US forms."}]

[architecture]
roles = {env = "packages/cli/src/platform/environment.ts"}

[tools.typescript]
types = ["bun"]

[tools.typescript.extra]
reason = "Bun runs TypeScript from source and imports .ts paths, so the compiler accepts them and emits nothing; Bun and Node 22 ship the ES2025 iterator helpers the code uses."
allowImportingTsExtensions = true
noEmit = true
target = "ESNext"
lib = ["ESNext"]

[tools.eslint]
import_style = {"**/*" = "ts"}
script_files = ["packages/npm/**", "packages/cli/build.ts", "packages/cli/publish.ts", "packages/cli/schemas.ts", "packages/cli/rules-lint/command.ts", "packages/eslint-plugin/build.ts", "docs/reference-pages.ts"]
globals = {"packages/npm/**" = "commonjs"}

[tools.knip]
entry = ["**/build.ts", "**/publish.ts", "packages/cli/schemas.ts", "packages/cli/rules-lint/command.ts", "packages/npm/gspot/gspot.js", "docs/reference-pages.ts", "docs/astro.config.ts", "docs/src/content.config.ts"]
ignore_dependencies = [{name = "verdaccio", reason = "The release test starts it through bunx, which knip cannot see."}, {name = "tree-sitter-bash", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-css", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-html", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-javascript", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-python", reason = "The grammar WASM file is read from the package, not imported."}, {name = "tree-sitter-typescript", reason = "The grammar WASM file is read from the package, not imported."}]

[structure]
single_file_folder_allowed = [{paths = ["packages/npm/gspot"], reason = "The npm launcher package is one file by design: it runs the platform package that installed."}]
prefix_collision_allowed = [{paths = ["packages/eslint-plugin/src/rules/**", "packages/eslint-plugin/tests/rules/**"], reason = "ESLint rule ids are the file names, and the ids share their first word by convention."}, {paths = ["docs/src"], reason = "Astro fixes the name of the content configuration file beside the content folder."}]

# The reference pages of the manual are written from the binary's own data; this says whether they still match.
[[check]]
id = "docs/generated"
command = ["bun", "docs/reference-pages.ts", "--check"]
paths = ["docs/src/content/docs/reference/**", "presets/**", "architecture/14-decisions.md", "packages/cli/src/commands/**"]
stage = "commit"
summary = "Checks that the reference pages of the manual match what the binary carries."

[[declare]]
paths = ["packages/cli/grammars/swift.wasm"]
vendored = true
reason = "The Swift grammar has no npm package with a prebuilt WASM file, so the build of tree-sitter-swift is kept in the tree."

# The published JSON schemas are written from the zod schemas; this says whether they still match.
[[check]]
id = "schema/generated"
command = ["bun", "packages/cli/schemas.ts", "--check"]
paths = ["schema/**", "docs/public/schema/**", "packages/cli/src/policy/schema.ts", "packages/cli/src/run/record/schema.ts"]
stage = "commit"
summary = "Checks that the published JSON schemas match the zod schemas the binary reads with."

[[declare]]
paths = ["schema/**", "docs/public/schema/**"]
produced_by = "bun packages/cli/schemas.ts"

# The rule corpus is this repository's product; its lint is this repository's check and ships in no binary.
[[check]]
id = "rules/lint"
command = ["bun", "packages/cli/rules-lint/command.ts"]
paths = ["rules/**", "packages/cli/rules-lint/**"]
stage = "commit"
summary = "Lints every rule file: front matter, links, size, layer boundary, fences, and the prose rules."
