[dependencies]
scanner = "@socketsecurity/bun-security-scanner"

[licenses]
allowed = ["MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "0BSD", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Unlicense", "BlueOak-1.0.0", "Python-2.0"]

[[licenses.allowed_package]]
name = "@csstools/selector-specificity"
version = "5.0.0"
reason = "The CSS tooling dependency uses the MIT No Attribution license; its installed package retains the license text."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist-mono"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist-mono.txt."

[[licenses.allowed_package]]
name = "@fontsource-variable/geist"
version = "5.3.0"
reason = "The documentation distributes this unmodified font and copies its license into the built site under licenses/geist.txt."

[[licenses.allowed_package]]
name = "axe-core"
version = "4.13.0"
reason = "The JSX accessibility lint plugin requires this unmodified development dependency. Its installed LICENSE identifies MPL-2.0; it is not included in the gspot package."

[[licenses.allowed_package]]
name = "eslint-plugin-sonarjs"
version = "4.2.0"
reason = "A lint plugin that runs at development time and is linked dynamically; nothing of it ships in the gspot package."

[[licenses.allowed_package]]
name = "lightningcss"
version = "1.33.0"
reason = "A build dependency of the manual site; the license binds changes to its own files, and none are made."

[tools.commitlint]
scopes = ["cli", "eslint-plugin", "docs", "root", "deps"]

[tools.eslint]
import_extension = "ts"

[tools.knip]
ignore_dependencies = { value = ["@fontsource-variable/geist", "@fontsource-variable/geist-mono", "tree-sitter-bash", "tree-sitter-css", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-typescript"], reason = "The build imports these packages through CSS or copies their grammar files by path." }
entry = ["tests/setup/prepare-run.ts", "scripts/build.ts", "tests/setup/integration.ts", "packages/cli/src/checks/framework/site/linkinator-program.ts", "packages/cli/configurations/language/markdown/markdownlint-cli2.mjs"]

[tools.typos]
extra = { value = { type = { license_names = { extend-glob = ["gspot.toml"], extend-words = { axe = "axe" } }, zod_types = { extend-glob = ["objects.ts"], extend-words = { optin = "optin" } } } }, reason = "Typos splits the published axe-core license name; Zod names its optional input marker optin." }

[[scope]]
path = "docs"
configurations = ["css", "astro", "zod", "cloudflare", "site"]
site.build_command = ["bun", "--bun", "astro", "build"]
tools.knip.ignore_dependencies = { value = ["satteri"], reason = "Astro prerender externalizes this native Markdown loader in astro.config.ts. A direct dependency keeps Bun’s package lookup at the installed loader origin; the site build verifies native resolution." }

[[scope]]
path = "packages/cli"
configurations = ["zod"]

[[scope]]
path = "tests"
configurations = ["cloudflare"]
removed_configurations = ["astro", "jest", "nestjs", "nextjs", "react", "react-dom", "svelte", "vitest", "vue"]
tools.knip.ignore_dependencies = { value = ["@darraghor/eslint-plugin-nestjs-typed", "@next/eslint-plugin-next", "@react-native/eslint-plugin", "@vitest/eslint-plugin", "bats", "eslint-plugin-drizzle", "eslint-plugin-expo", "eslint-plugin-i18next", "eslint-plugin-jest", "eslint-plugin-react", "eslint-plugin-react-hooks", "eslint-plugin-react-native", "eslint-plugin-react-refresh", "eslint-plugin-svelte", "eslint-plugin-testing-library", "eslint-plugin-vue", "eslint-plugin-vuejs-accessibility", "pnpm", "supabase", "svelte-eslint-parser", "vue-eslint-parser", "yarn", "@nestjs/common", "@nestjs/core", "@tanstack/eslint-plugin-query", "eslint-plugin-jsx-a11y", "reflect-metadata", "rxjs", "vue"], reason = "Native sandbox commands load these packages from the linked tests installation." }

[[ignore]]
check = "dependencies/osv"
rule = "GHSA-ch52-4w7c-c8xp"
reason = "As checked on 2026-10-09, http-cache-semantics 4.3.0 has no patched release and is used only in development without sharing cached responses between users."
until = 2026-11-08

[[ignore]]
check = "dependencies/osv"
rule = "GHSA-vfj7-8cjw-p6xm"
reason = "As checked on 2026-10-09, braces 3.0.3 has no patched release and is used only by development tools to expand patterns written in this repository."
until = 2026-11-08

[[ignore]]
check = "docs/lychee"
paths = ["docs/src/content/docs/**", "docs/src/reference/configuration-guides/**"]
reason = "Starlight builds these source links into site routes; site/linkinator checks their targets in the built site."

[[ignore]]
check = "docs/missing-paths"
paths = ["packages/cli/configurations/*/*/rules/**"]
reason = "Paths in shipped rules are examples for user projects."

[[ignore]]
check = "javascript/eslint"
rule = "@typescript-eslint/no-magic-numbers"
paths = ["tests/config/**"]
reason = "These declarations hold fixed test data; giving each literal another constant would duplicate the same data."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/restrict-dependency-ranges"
paths = ["packages/eslint-plugin/package.json"]
reason = "A published library uses ranges for dependencies and peers."

[[ignore]]
check = "javascript/eslint"
rule = "package-json/specify-peers-locally"
paths = ["packages/eslint-plugin/package.json"]
reason = "The declaration build uses the root workspace TypeScript dependency, so the plugin does not repeat it as a development dependency."

[[ignore]]
check = "prose/vale"
paths = ["packages/cli/configurations/general/prose/vale/styles/LICENSES.md"]
reason = "The upstream license notices must keep their exact text."

[[ignore]]
check = "prose/vale"
rule = "gspot.session-identifiers"
paths = ["tests/config/prose.ts"]
reason = "The sample for the session-identifier rule is a URL with a session id."

[[ignore]]
check = "site/html-validate"
rule = "element-permitted-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "no-implicit-button-type"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "text-content"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "site/html-validate"
rule = "unique-landmark"
paths = ["docs/**"]
reason = "Starlight and Expressive Code write this markup."

[[ignore]]
check = "spelling/typos"
paths = ["tests/config/spelling.ts"]
reason = "This literal supplies a deliberate misspelling to the spelling checks and their corrections."

[[ignore]]
check = "structure/lone-files"
paths = ["docs/src/components/starlight/SiteTitle.astro", "docs/src/pages/index.astro", "tests/config/samples/settings.ts", "tests/integration/database/postgres.test.ts", "tests/unit/cli/checks/testing/swift-tests.test.ts", "tests/unit/cli/parsers/sql/postgres.test.ts", "tests/unit/cli/parsers/toml/document.test.ts"]
reason = "The final placement keeps each test beside its source topic and keeps Astro components and routes in their framework folders."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["docs/src/content.config.ts"]
reason = "Astro fixes the name of the content configuration file beside the content folder."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/cli/configurations/language/markdown", "packages/cli/configurations/infrastructure/docker"]
reason = "A configuration template takes the name of the file it writes, and a tool names its own configuration files."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/cli/src/checks/general/structure/file-folder-clashes.ts", "packages/cli/src/checks/language/swift/build-folder.ts", "packages/cli/src/config/generation/tool-file-sources.ts", "packages/cli/src/generation/eslint/fragments/react*.ts", "packages/cli/src/generation/tool-file-builders.ts", "packages/cli/src/generation/tool-files.ts", "tests/config/ignore-patterns.ts", "tests/config/swift-tests.ts", "tests/types/tool-files.ts", "tests/unit/cli/checks/general/structure/file-folder-clashes.test.ts", "tests/unit/cli/checks/language/swift/build-folder.test.ts", "tests/unit/cli/generation/tool-files.test.ts"]
reason = "The final placement names each distinct topic directly; these related topics share a word without sharing one implementation."

[[ignore]]
check = "structure/shared-prefixes"
paths = ["packages/eslint-plugin/src/rules/**", "tests/unit/eslint-plugin/**", "tests/config/eslint/**"]
reason = "ESLint rule ids are the file names, and the ids share their first word by convention."
