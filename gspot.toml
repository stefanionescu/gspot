#:schema https://gspot.dev/schema/gspot.schema.json

# Run gspot apply after changing policy. Use gspot explain <name> to inspect a setting.

version = 1
level = "all"
kits = [
    "jest",
    "bash",
    "spelling",
    "typescript",
    "markdown",
    "prose",
    "commits",
    "files",
    "naming",
    "formatting",
    "docs",
    "secrets",
    "dependencies",
    "licenses",
    "duplication",
    "security",
]

[[scope]]
path = "packages/cli"
kits = []

[[scope]]
path = "packages/eslint-plugin"
kits = []

[[scope]]
path = "docs"
kits = ["typescript", "css"]

[hooks]
tool = "gspot"

[guides]
install = true
directory = ".gspot/guides"

[coverage]
strict = true

[runner]
tool = "mise"

[tools]

[tools.docs]


[[tools.docs.paths_allowed]]
patterns = [
    ".github/workflows/gspot.yml",
    ".gspot/config/basedpyrightconfig.json",
    ".gspot/config/hadolint.yaml",
    ".gspot/config/html-validate-built.json",
    ".gspot/config/html-validate-templates.json",
    ".gspot/config/periphery.yml",
    ".gspot/config/ruff.toml",
    ".gspot/config/semgrep/workers.yml",
    ".gspot/config/spectral.yaml",
    ".gspot/config/sqlfluff.cfg",
    ".gspot/config/squawk.toml",
    ".gspot/config/stylelint.json",
    ".gspot/config/swiftformat",
    ".gspot/config/swiftlint.yml",
    ".gspot/config/trivy.yaml",
    ".gspot/node_modules",
    ".gspot/node_modules/.bin",
    ".gspot/guides/framework/nextjs/NEXTJS.md",
    ".gspot/guides/framework/react/REACT.md",
    ".gspot/guides/library/zod/ZOD.md",
    "docs/dist",
    "packages/cli/.build",
    "packages/cli/scripts/configuration-process.js",
]
reason = "These documented paths are ignored build or installation outputs, exact embedded asset identities, or outputs of optional consumer configurations. Their source manifests and build owners define them. Remove an entry when its output contract or documentation is removed."

[[tools.docs.paths_allowed]]
patterns = [
    "../../adoption/rules.mjs",
    "../cart/b",
    "../outside-rules",
    "../run/private/router.js",
    "../user/b",
    "api/src/a.ts",
    "api/src/routes/turn.ts",
    "api/types/supabase.ts",
    "features/cart/a.ts",
    "functions/_middleware.js",
    "functions/_worker.js",
    "hooks/use-thing.ts",
    "plugin.cjs",
    "private/router.js",
    "private/router.ts",
    "processing.mjs",
    "rules.mjs",
    "src/app/api/checkout/route.ts",
    "src/settings.py",
    "scripts/list-archive.sh",
    "supabase/scripts/migrations.ts",
    "supabase/seed.sql",
    "turn",
    "typecheck/trt.json",
    "utils/common.ts",
]
reason = "Architecture examples, documentation walkthroughs, and regression records use these exact consumer paths, deliberately invalid imports, and sandbox module names. They are not tracked checkout claims. Remove an entry when its example or regression record is removed."

[[tools.docs.paths_allowed]]
patterns = ["acceptance/source/kits/css.test.ts"]
reason = "The documented acceptance command resolves this argument from its declared tests working directory; the tracked target is tests/acceptance/source/kits/css.test.ts."

[[tools.docs.paths_allowed]]
patterns = [".gspot/reports/report.json"]
reason = "The check runner writes this ignored runtime report and the CI workflow uploads it. Runtime reports are not tracked repository inputs."

[[tools.docs.paths_allowed]]
patterns = ["packages/cli/guides/**"]
reason = "The rule corpus is generic text installed into other repositories; it names nothing in this one."

[[tools.docs.paths_allowed]]
patterns = [".github/copilot-instructions.md", ".cursor", ".cursor/rules/gspot.mdc", ".husky", ".gitlab/ci/gspot.yml"]
reason = "These documented integration destinations belong to consumer repositories. Their presence depends on the selected agent, hook, or CI integration."

[[tools.docs.paths_allowed]]
patterns = [
    "packages/eslint-plugin/dist",
    "coverage/lcov.info",
    "packages/cli/.build/swift.wasm",
    ".gspot/state",
    ".gspot/state/recovery",
    ".gspot/cache",
    ".gspot/reports",
    ".gspot/reports/report.sarif",
    ".gspot/reports/report.codequality.json",
    ".gspot/.venv",
    ".gspot/config/semgrep/ios.yml",
]
reason = "These exact documented outputs are ignored build products, runtime state, or configuration generated only for selected consumer integrations. Source manifests and output tests own their paths."

[[tools.docs.paths_allowed]]
patterns = [
    "gspot-darwin-arm64",
    "scripts/check-notes.ts",
    "notes/deploy.txt",
    "bash",
    "supabase/config.toml",
    "src/app.ts",
]
reason = "The guides explicitly introduce these downloaded binaries, consumer project resources, and example files. They are not claims that this checkout tracks them."

[[tools.docs.paths_allowed]]
patterns = ["acceptance/source/kits/vite.test.ts"]
reason = "The acceptance runner resolves this documented argument from its tests working directory. The tracked file is tests/acceptance/source/kits/vite.test.ts."
[tools.lychee]


[[tools.lychee.exclude_paths]]
paths = ["docs/src/content/docs/**"]
reason = "The site links are root-relative and resolve once Starlight builds it; its build validates them."
