# Generated by gspot 0.1.0 from gspot.toml. Do not edit.
# Change policy: gspot set / allow / ignore, or edit gspot.toml, then run: gspot sync
[default]
locale = "en-us"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-words]
# Apple's device identifier API name.
udid = "udid"
# The Python certificate package name.
certifi = "certifi"
# The axe-core accessibility package name.
axe = "axe"
# The Virtua list virtualisation library.
Virtua = "Virtua"
# The Virtua list virtualisation library.
virtua = "virtua"
# British spellings the naming policy bans on purpose.
synchronise = "synchronise"
# British spellings the naming policy bans on purpose.
synchronised = "synchronised"
# British spellings the naming policy bans on purpose.
materialise = "materialise"

[files]
extend-exclude = [
    "*.lock", "bun.lockb", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "Package.resolved",
    "*.pbxproj", "*.xcstrings", "*.svg", "*.min.js", "*.min.css",
    ".gspot/cache/", ".gspot/last.json", ".gspot/last.sarif", ".gspot/baseline/",
    "reference-rules/lint/vale/styles/gspot/us-english.yml",
    "reference-rules/lint/completeness-report.json",
]
